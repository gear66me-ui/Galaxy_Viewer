<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Galaxy Viewer">
<title>Galaxy Viewer 4K</title>
<link rel="manifest" href="./manifest.webmanifest?v=0022">
<link rel="icon" href="./icon.svg?v=0022" type="image/svg+xml">
<link rel="apple-touch-icon" href="../viewer/artwork/GV-splash-0002.png?v=0022">
<style>
html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:#000;color:#fff}
body{font-family:"Roboto Mono",Consolas,monospace}
#gv-loading{padding:18px;color:#62D8FF}
#aladin-cosmic-command-test{
  width:100%!important;
  height:100vh!important;
  height:100svh!important;
  height:100dvh!important;
  min-height:100vh!important;
  min-height:100svh!important;
  min-height:100dvh!important;
}
#aladin-cosmic-command-test button.gv-simbad-proxy img.gv-target-trademark{
  width:32px!important;
  height:32px!important;
  min-width:32px!important;
  min-height:32px!important;
  max-width:32px!important;
  max-height:32px!important;
}
</style>
</head>
<body>
<div id="gv-loading">Loading Galaxy Viewer 4K…</div>
<script>
(async()=>{
  if('serviceWorker' in navigator){
    window.addEventListener('load',async()=>{
      try{
        const registration=await navigator.serviceWorker.register(
          './service-worker.js?maintenance=0021-refresh-1',
          {updateViaCache:'none'}
        );
        await registration.update();
        if(registration.waiting){registration.waiting.postMessage('SKIP_WAITING')}
      }catch(error){
        console.warn('Service worker registration failed',error);
      }
    });
  }

  const loading=document.getElementById('gv-loading');
  try{
    const response=await fetch('../viewer/GV-beta-0004K.py?v=729fd57a4c4c5b7a3db945078fb104b6f2317927',{cache:'no-store'});
    if(!response.ok)throw new Error(`GV-beta-0004K.py returned HTTP ${response.status}`);
    const source=await response.text();
    const htmlMatch=source.match(/display\(HTML\("""([\s\S]*?)"""\)\)/);
    const jsMatch=source.match(/display\(Javascript\(r"""([\s\S]*?)"""\)\)/);
    if(!htmlMatch||!jsMatch)throw new Error('Could not extract the 4K HTML and JavaScript blocks.');
    loading.remove();
    document.body.insertAdjacentHTML('beforeend',htmlMatch[1]);
    const script=document.createElement('script');
    script.textContent=jsMatch[1];
    document.body.appendChild(script);
  }catch(error){
    console.error('Galaxy Viewer 4K mobile launcher failure',error);
    loading.textContent=`Galaxy Viewer 4K failed to load: ${error.message}`;
  }
})();
</script>
</body>
</html>
