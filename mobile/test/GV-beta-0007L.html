<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GALAXY VIEWER 7L MAXIMUM COORDINATE TEST</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#62D8FF}
#gv-loading{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:#000;font:16px/1.5 Arial,sans-serif;text-align:center}
#gv-loading[hidden]{display:none}
#gv-error{color:#FFD166;white-space:pre-wrap}
</style>
</head>
<body>
<div id="gv-loading">LOADING GALAXY VIEWER 7L…</div>
<script>
(async()=>{
  const loading=document.getElementById('gv-loading');
  try{
    const response=await fetch('../../viewer/GV-beta-0007L.py?v=eb3563f1ff5f0bc232faa537d4b5e3ae44652c05',{cache:'no-store'});
    if(!response.ok)throw new Error(`GV-BETA-0007L.PY RETURNED HTTP ${response.status}`);
    const source=await response.text();
    const htmlMatches=[...source.matchAll(/display\(HTML\("""([\s\S]*?)"""\)\)/g)];
    if(!htmlMatches.length)throw new Error('COULD NOT EXTRACT THE 7L VIEWER HTML.');
    htmlMatches.forEach(match=>document.body.insertAdjacentHTML('beforeend',match[1]));
    const javascriptMatches=[...source.matchAll(/display\(Javascript\(r"""([\s\S]*?)"""\)\)/g)];
    if(!javascriptMatches.length)throw new Error('COULD NOT EXTRACT THE 7L VIEWER JAVASCRIPT.');
    javascriptMatches.forEach(match=>{
      const script=document.createElement('script');
      script.textContent=match[1];
      document.body.appendChild(script);
    });
    const deadline=performance.now()+30000;
    while(!(document.querySelector('#aladin-cosmic-command-test canvas')&&window.aladin_cosmic_command_test&&document.querySelectorAll('#aladin-cosmic-command-test button').length>=2)){
      if(performance.now()>=deadline)throw new Error('THE VIEWER AND MAXIMUM-COORDINATE BUTTONS DID NOT LOAD WITHIN 30 SECONDS.');
      await new Promise(resolve=>setTimeout(resolve,100));
    }
    loading.hidden=true;
  }catch(error){
    loading.id='gv-error';
    loading.textContent='APP FAILED TO LOAD\n\n'+String(error?.message||error);
    console.error('GALAXY VIEWER 7L TEST LAUNCH FAILURE',error);
  }
})();
</script>
</body>
</html>
