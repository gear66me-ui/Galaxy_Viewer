<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GALAXY VIEWER 7L MAXIMUM COORDINATE TEST</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#62D8FF}
#gv-loading{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:#000;font:16px/1.5 Arial,sans-serif;text-align:center}
#gv-loading[hidden]{display:none}
#gv-error{color:#FFD166;white-space:pre-wrap}
</style>
</head>
<body>
<div id="gv-loading">LOADING GALAXY VIEWER 7L…</div>
<script>
(async()=>{
  const loading=document.getElementById('gv-loading');
  try{
    const response=await fetch('../../viewer/GV-beta-0007L.py?v=0c54a53a6809388dd6ccca3268d556856434fc48',{cache:'no-store'});
    if(!response.ok)throw new Error(`GV-BETA-0007L.PY RETURNED HTTP ${response.status}`);
    const source=await response.text();
    const htmlMatch=source.match(/display\(HTML\("""([\s\S]*?)"""\)\)/);
    if(!htmlMatch)throw new Error('COULD NOT EXTRACT THE 7L VIEWER HTML.');
    const jsMatch=source.match(/display\(Javascript\(r"""([\s\S]*?)"""\)\)/);
    if(!jsMatch)throw new Error('COULD NOT EXTRACT THE 7L VIEWER JAVASCRIPT.');
    document.body.insertAdjacentHTML('beforeend',htmlMatch[1]);
    const script=document.createElement('script');
    script.textContent=jsMatch[1];
    document.body.appendChild(script);
    const deadline=performance.now()+20000;
    while(!(document.querySelector('#aladin-cosmic-command-test canvas')&&window.aladin_cosmic_command_test)){
      if(performance.now()>=deadline)throw new Error('THE VIEWER DID NOT CREATE A CANVAS WITHIN 20 SECONDS.');
      await new Promise(resolve=>setTimeout(resolve,100));
    }
    loading.hidden=true;
  }catch(error){
    loading.id='gv-error';
    loading.textContent='APP FAILED TO LOAD\n\n'+String(error?.message||error);
    console.error('GALAXY VIEWER 7L TEST LAUNCH FAILURE',error);
  }
})();
</script>
</body>
</html>
