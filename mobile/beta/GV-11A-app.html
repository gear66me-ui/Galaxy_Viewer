<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Galaxy Viewer 11A Diagnostics</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff}
#gv11a-boot{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#000}
#gv11a-boot::after{content:"";width:54px;height:54px;border-radius:50%;border:3px solid rgba(120,255,171,.18);border-top-color:#78FFAB;animation:gv11a-spin .75s linear infinite}@keyframes gv11a-spin{to{transform:rotate(360deg)}}
#gv11a-error{display:none;position:fixed;inset:0;z-index:2147483647;box-sizing:border-box;padding:24px;background:#000;color:#FFD166;white-space:pre-wrap;font:14px/1.45 monospace}
</style>
</head>
<body>
<div id="gv11a-boot" aria-label="Loading Galaxy Viewer 11A"></div>
<div id="gv11a-error"></div>
<script>
(async()=>{
    'use strict';
    const fail=error=>{document.getElementById('gv11a-boot')?.remove();const panel=document.getElementById('gv11a-error');panel.style.display='block';panel.textContent='GALAXY VIEWER 11A FAILED TO LOAD\n\n'+String(error?.stack||error)};
    try{
        const viewerUrl='https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/beta/viewer/GV-beta-0011A.py?t='+Date.now();
        const response=await fetch(viewerUrl,{cache:'no-store'});if(!response.ok)throw new Error('VIEWER HTTP '+response.status);
        const source=await response.text();
        if(/GV-beta-0010AE|10AE/i.test(source))throw new Error('11A CONTAINS FORBIDDEN PRIOR-REVISION REFERENCE');
        const htmlMatch=source.match(/display\(HTML\(\"\"\"([\s\S]*?)\"\"\"\)\)/);
        const jsMatches=[...source.matchAll(/display\(Javascript\(r?\"\"\"([\s\S]*?)\"\"\"\)\)/g)];
        if(!htmlMatch||!jsMatches.length)throw new Error('11A VIEWER EXTRACTION FAILED');
        const scripts=jsMatches.map(match=>'<script>'+match[1].replace(/<\/script/gi,'<\\/script')+'</scr'+'ipt>').join('');
        const diag='<script src="https://gear66me-ui.github.io/Galaxy_Viewer/viewer/modules/gv-prefetch-diagnostics-0001.js?t='+Date.now()+'"></scr'+'ipt>';
        const page='<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#000000"></head><body>'+htmlMatch[1]+scripts+diag+'</body></html>';
        document.open();document.write(page);document.close();
    }catch(error){fail(error)}
})();
</script>
</body>
</html>
