<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Galaxy Viewer 10H</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff}
#gv-boot{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#000}
#gv-boot img{display:block;width:min(42vw,240px);height:auto}
#gv-error{display:none;position:fixed;inset:0;z-index:2147483647;box-sizing:border-box;padding:24px;background:#000;color:#FFD166;white-space:pre-wrap;font:14px/1.45 monospace}
</style>
</head>
<body>
<div id="gv-boot"><img src="../../viewer/artwork/icon_target_vector.svg" alt="Galaxy Viewer"></div>
<div id="gv-error"></div>
<script>
(async()=>{
    'use strict';
    const fail=error=>{
        document.getElementById('gv-boot')?.remove();
        const panel=document.getElementById('gv-error');
        panel.style.display='block';
        panel.textContent='GALAXY VIEWER 10H FAILED TO LOAD\n\n'+String(error?.stack||error);
    };
    const text=async url=>{
        const response=await fetch(url,{cache:'no-store'});
        if(!response.ok)throw new Error('HTTP '+response.status+' '+url);
        return response.text();
    };
    try{
        const pointer=JSON.parse(await text('../../viewer/gv-current-viewer.json?t='+Date.now()));
        const viewer=String(pointer.viewer||'').trim();
        if(viewer!=='GV-beta-0010H.py')throw new Error('10H POINTER MISMATCH: '+viewer);
        const source=await text('../../viewer/'+viewer+'?t='+Date.now());
        const htmlMatch=source.match(/display\(HTML\(\"\"\"([\s\S]*?)\"\"\"\)\)/);
        const jsMatch=source.match(/display\(Javascript\(r\"\"\"([\s\S]*?)\"\"\"\)\)/);
        if(!htmlMatch||!jsMatch)throw new Error('10H VIEWER EXTRACTION FAILED');
        const safeJs=jsMatch[1].replace(/<\/script/gi,'<\\/script');
        const page='<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#000000"></head><body>'+htmlMatch[1]+'<script>'+safeJs+'<\\/script></body></html>';
        document.open();
        document.write(page);
        document.close();
    }catch(error){fail(error)}
})();
</script>
</body>
</html>
