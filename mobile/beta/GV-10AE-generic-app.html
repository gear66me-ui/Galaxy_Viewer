<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>GALAXY VIEWER 10AE</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff}#gv-boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;font:14px monospace}</style>
</head>
<body>
<div id="gv-boot">GALAXY VIEWER 10AE</div>
<script>
(async()=>{
  'use strict';
  try{
    const response=await fetch('./generic-app.html?t='+Date.now(),{cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status+' generic-app.html');
    let html=await response.text();
    const oldBlock=`const loadPointer=async()=>{\n  const pointer=JSON.parse(await text(POINTER_URL));\n  const version=String(pointer.version||'').trim();\n  versionEl.textContent=version?'VERSION '+version:'VERSION';\n  return pointer;\n};`;
    const newBlock=`const loadPointer=async()=>{\n  const pointer={version:'10AE',viewer:'GV-beta-0010AE.py'};\n  versionEl.textContent='VERSION 10AE';\n  return pointer;\n};`;
    if(!html.includes(oldBlock))throw new Error('GENERIC APP POINTER BLOCK NOT FOUND');
    html=html.replace(oldBlock,newBlock);
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    const boot=document.getElementById('gv-boot');
    if(boot)boot.textContent='GALAXY VIEWER 10AE FAILED TO LOAD\n\n'+String(error?.stack||error);
  }
})();
</script>
</body>
</html>
