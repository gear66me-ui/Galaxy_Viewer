<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#000000"><title>Galaxy Viewer</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff}#cover{position:fixed;inset:0;z-index:2147483646;display:flex;align-items:center;justify-content:center;background:#000}#cover svg{width:min(42vw,240px);height:auto}#err{display:none;position:fixed;inset:0;z-index:2147483647;box-sizing:border-box;padding:24px;background:#000;color:#FFD166;white-space:pre-wrap;font:14px/1.45 monospace}</style></head><body><div id="cover"><svg viewBox="0 0 32 32" role="img" aria-label="Galaxy Viewer target icon"><circle cx="16" cy="16" r="9.5" fill="#000" stroke="#fff" stroke-width="1.8"/><ellipse cx="16" cy="16" rx="11.5" ry="4.2" fill="none" stroke="#fff" stroke-width="2.2" transform="rotate(-18 16 16)"/><ellipse cx="16" cy="16" rx="5.7" ry="2.2" fill="none" stroke="#fff" stroke-width="1.6" transform="rotate(-18 16 16)"/><circle cx="16" cy="16" r="1.6" fill="#fff"/><path d="M16 2.5V7 M16 25V29.5 M2.5 16H7 M25 16H29.5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></div><div id="err"></div><script>(async()=>{'use strict';const RAW='https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/beta/viewer/';const cover=document.getElementById('cover'),err=document.getElementById('err');let failed=false;const fail=(stage,e)=>{if(failed)return;failed=true;console.error('GV GENERIC',stage,e);cover?.remove();err.style.display='block';err.textContent='GALAXY VIEWER FAILED TO LOAD\n\nSTAGE: '+stage+'\n\n'+String(e?.stack||e)};window.addEventListener('error',e=>fail('JAVASCRIPT',e.error||e.message));window.addEventListener('unhandledrejection',e=>fail('PROMISE',e.reason));const text=async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status+' '+u);return r.text()};const extract=s=>{const h=[...s.matchAll(/display\(HTML\(\"\"\"([\s\S]*?)\"\"\"\)\)/g)],j=[...s.matchAll(/display\(Javascript\(r\"\"\"([\s\S]*?)\"\"\"\)\)/g)];if(h.length!==1||j.length!==1)throw new Error('Viewer extraction mismatch HTML='+h.length+' JS='+j.length);return[h[0][1],j[0][1]]};try{const manifest=JSON.parse(await text(RAW+'gv-current-viewer.json?t='+Date.now()));const viewer=String(manifest.viewer||'').trim();if(!/^GV-beta-[0-9A-Za-z._-]+\.py$/.test(viewer))throw new Error('Invalid viewer pointer: '+viewer);const source=await text(RAW+viewer+'?t='+Date.now());const [html,js]=extract(source);document.body.insertAdjacentHTML('beforeend',html);const script=document.createElement('script');script.textContent=js;document.body.appendChild(script);const deadline=performance.now()+30000;const ready=()=>{if(failed)return;if(document.getElementById('aladin-cosmic-command-test')?.querySelector('canvas')&&window.aladin_cosmic_command_test){cover?.remove();return}if(performance.now()>deadline){fail('VIEWER_READY',new Error('Aladin canvas did not become ready'));return}setTimeout(ready,100)};ready()}catch(e){fail('BOOTSTRAP',e)}})();</script></body></html>
