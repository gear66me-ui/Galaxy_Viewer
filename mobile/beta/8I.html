<!doctype html>
<!--
GALAXY VIEWER ENGINEERING CHANGE ORDER — GV-8I APP LAUNCHER
PURPOSE: Dedicated app launcher for the exact Galaxy Viewer 8I test release with production Splash 0058H.
AUTHORIZED RELEASE: viewer/GV-beta-0008I.py blob e61a0cbf2adf06b9b51df0d93d5699d0946eb395
AUTHORIZED SPLASH: viewer/artwork/Splash/Galaxy-Viewer-Singularity-0058H.html blob 730d5e35a3d375c668fd3464d8f1181eea7d37b9
PRESERVED BEHAVIOR: No Viewer application logic is duplicated in this launcher; it loads the full 8I Viewer concurrently with the production splash and reveals the Viewer only after both are complete.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GALAXY VIEWER BETA 8I">
<title>GALAXY VIEWER 8I — APP LAUNCHER</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff}
#gv-launch-error{display:none;position:fixed;inset:0;z-index:2147483647;padding:24px;box-sizing:border-box;background:#000;color:#FFD166;white-space:pre-wrap;font:14px/1.5 monospace}
#gv-splash-frame{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:2147483646;background:#000}
#aladin-cosmic-command-test{width:100%!important;height:100vh!important;height:100svh!important;height:100dvh!important}
</style>
</head>
<body>
<iframe id="gv-splash-frame" src="../../viewer/artwork/Splash/Galaxy-Viewer-Singularity-0058H.html?v=730d5e35a3d375c668fd3464d8f1181eea7d37b9" title="GALAXY VIEWER SPLASH"></iframe>
<div id="gv-launch-error" role="alert"></div>
<script>
(async()=>{
  'use strict';
  const VIEWER_URL='../../viewer/GV-beta-0008I.py?v=e61a0cbf2adf06b9b51df0d93d5699d0946eb395';
  const VIEWER_TIMEOUT_MS=20000;
  const splashFrame=document.getElementById('gv-splash-frame');
  const errorBox=document.getElementById('gv-launch-error');
  let splashComplete=false,viewerReady=false;
  const maybeReveal=()=>{
    if(splashComplete&&viewerReady&&splashFrame.isConnected)splashFrame.remove();
  };
  const onSplashLoaded=()=>{
    splashFrame.contentWindow.addEventListener('galaxy-splash-complete',()=>{
      splashComplete=true;
      maybeReveal();
    },{once:true});
  };
  splashFrame.addEventListener('load',onSplashLoaded,{once:true});
  const showError=error=>{
    errorBox.style.display='block';
    errorBox.textContent='APP FAILED TO LOAD\n\n'+String(error?.stack||error);
  };
  const waitForViewer=()=>new Promise((resolve,reject)=>{
    const deadline=performance.now()+VIEWER_TIMEOUT_MS;
    const check=()=>{
      const root=document.getElementById('aladin-cosmic-command-test');
      if(root?.querySelector('canvas')&&window.aladin_cosmic_command_test){resolve();return}
      if(performance.now()>=deadline){reject(new Error('GALAXY VIEWER 8I STARTUP TIMEOUT'));return}
      setTimeout(check,100);
    };
    check();
  });
  try{
    const response=await fetch(VIEWER_URL,{cache:'no-store'});
    if(!response.ok)throw new Error('GV-BETA-0008I.PY RETURNED HTTP '+response.status);
    const source=await response.text();
    const htmlMatches=[...source.matchAll(/display\(HTML\(\"\"\"([\s\S]*?)\"\"\"\)\)/g)];
    const jsMatches=[...source.matchAll(/display\(Javascript\(r\"\"\"([\s\S]*?)\"\"\"\)\)/g)];
    if(!htmlMatches.length||!jsMatches.length)throw new Error('COULD NOT EXTRACT THE VERIFIED 8I FULL VIEWER');
    htmlMatches.forEach(match=>document.body.insertAdjacentHTML('beforeend',match[1]));
    jsMatches.forEach(match=>{
      const script=document.createElement('script');
      script.textContent=match[1];
      document.body.appendChild(script);
    });
    await waitForViewer();
    viewerReady=true;
    maybeReveal();
  }catch(error){
    console.error('GALAXY VIEWER 8I APP LAUNCHER FAILURE',error);
    showError(error);
  }
})();
</script>
</body>
</html>
