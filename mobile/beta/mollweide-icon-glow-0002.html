<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mollweide Icon Glow 0002</title>
<style>
:root{--cycle:6.4s;--cyan:#8feaff;--violet:#9d7cff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000}
body{display:grid;place-items:center}
.tile{position:relative;width:96px;height:96px;border:2px solid #d7f4ff;border-radius:14px;display:grid;place-items:center;overflow:hidden;background:#020408}
.tile::before{content:"";position:absolute;inset:3px;border-radius:10px;pointer-events:none;animation:innerPulse var(--cycle) cubic-bezier(.42,0,.18,1) infinite}
svg{position:relative;z-index:1;width:57.6px;height:57.6px;display:block;animation:iconPulse var(--cycle) cubic-bezier(.42,0,.18,1) infinite}
.outline,.grid{fill:none;stroke-linecap:round;stroke-linejoin:round}.outline{stroke:var(--cyan);stroke-width:1.8}.grid{stroke:var(--violet);stroke-width:1.25;opacity:.98}
@keyframes innerPulse{
0%,100%{background:rgba(0,0,0,0);box-shadow:inset 0 0 0 1px rgba(143,234,255,.08),inset 0 0 7px rgba(98,216,255,.05),inset 0 0 12px rgba(157,124,255,.03)}
24%{background:rgba(79,166,255,.025);box-shadow:inset 0 0 0 1px rgba(143,234,255,.24),inset 0 0 10px rgba(98,216,255,.16),inset 0 0 16px rgba(157,124,255,.09)}
52%{background:rgba(79,166,255,.055);box-shadow:inset 0 0 0 2px rgba(214,249,255,.95),inset 0 0 10px rgba(143,234,255,.82),inset 0 0 19px rgba(79,166,255,.58),inset 0 0 28px rgba(157,124,255,.30)}
76%{background:rgba(79,166,255,.03);box-shadow:inset 0 0 0 1px rgba(143,234,255,.26),inset 0 0 10px rgba(98,216,255,.17),inset 0 0 16px rgba(157,124,255,.10)}
}
@keyframes iconPulse{
0%,100%{opacity:.56;filter:drop-shadow(0 0 1px rgba(143,234,255,.16))}
24%{opacity:.72;filter:drop-shadow(0 0 2px rgba(143,234,255,.34)) drop-shadow(0 0 4px rgba(157,124,255,.20))}
52%{opacity:1;filter:drop-shadow(0 0 4px rgba(214,249,255,1)) drop-shadow(0 0 8px rgba(98,216,255,.90)) drop-shadow(0 0 13px rgba(79,166,255,.76)) drop-shadow(0 0 17px rgba(157,124,255,.48))}
76%{opacity:.72;filter:drop-shadow(0 0 2px rgba(143,234,255,.34)) drop-shadow(0 0 4px rgba(157,124,255,.20))}
}
</style>
</head>
<body>
<div class="tile" aria-label="Mollweide icon glow prototype">
<svg viewBox="0 0 64 64" aria-hidden="true">
<path class="outline" d="M6 32C10 19 19.5 13.5 32 13.5C44.5 13.5 54 19 58 32C54 45 44.5 50.5 32 50.5C19.5 50.5 10 45 6 32Z"/>
<path class="grid" d="M6 32H58"/>
<path class="grid" d="M8.5 25.5C20 21.2 44 21.2 55.5 25.5M8.5 38.5C20 42.8 44 42.8 55.5 38.5"/>
<path class="grid" d="M32 13.5V50.5"/>
<path class="grid" d="M32 13.5C23.5 20 22 44 32 50.5M32 13.5C40.5 20 42 44 32 50.5"/>
<path class="grid" d="M32 13.5C16.5 21 14 43 32 50.5M32 13.5C47.5 21 50 43 32 50.5"/>
</svg>
</div>
</body>
</html>
