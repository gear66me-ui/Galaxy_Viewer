<!doctype html>
<!--
GALAXY VIEWER ENGINEERING CHANGE ORDER — GV-9G APP LAUNCHER
PURPOSE: Dedicated launcher for exact Galaxy Viewer 9G with first-frame splash reveal.
AUTHORIZED RELEASE: viewer/GV-beta-0009G.py blob ed915121d7b735cc0118c8d688ce7a28922d2d61
AUTHORIZED SPLASH: viewer/releases/splash/Galaxy-Viewer-Singularity-FINAL/index.html blob a22e99d53d1cea58736d961e2d8bec400c670b72
AUTHORIZED STARTUP: Viewer/Aladin and splash initialize concurrently; app icon is only a loading cover and is removed at the splash's first genuinely rendered frame; the unchanged splash then remains visible through completion; HOME is revealed after splash completion and Viewer readiness.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GALAXY VIEWER BETA 9G">
<title>GALAXY VIEWER 9G — APP LAUNCHER</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff}
#gv-launch-error{display:none;position:fixed;inset:0;z-index:2147483647;padding:24px;box-sizing:border-box;background:#000;color:#FFD166;white-space:pre-wrap;font:14px/1.5 monospace}
#gv-launch-cover{position:fixed;inset:0;z-index:2147483646;display:flex;align-items:center;justify-content:center;background:#000}
#gv-splash-frame{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:2147483645;background:#000;opacity:1;visibility:visible}
#gv-opening-poster{display:block;width:min(42vw,240px);height:auto;max-height:42vh;object-fit:contain;background:transparent}
#aladin-cosmic-command-test{width:100%!important;height:100vh!important;height:100svh!important;height:100dvh!important}
</style>
</head>
<body>
<div id="gv-launch-cover"><img id="gv-opening-poster" src="../../viewer/artwork/App%20Icons/GV-app-icon-512.png" alt="GALAXY VIEWER"></div>
<iframe id="gv-splash-frame" title="GALAXY VIEWER SPLASH"></iframe>
<div id="gv-launch-error" role="alert"></div>
<script>
(async()=>{
  'use strict';
  const VIEWER_URL='../../viewer/archive/GV-beta-0009G.py?v=ed915121d7b735cc0118c8d688ce7a28922d2d61';
  const SPLASH_BASE='../../viewer/releases/splash/Galaxy-Viewer-Singularity-FINAL/';
  const SPLASH_URL=SPLASH_BASE+'index.html?v=a22e99d53d1cea58736d961e2d8bec400c670b72';
  const VIEWER_TIMEOUT_MS=20000;
  const SPLASH_FIRST_FRAME_TIMEOUT_MS=5000;
  const launchCover=document.getElementById('gv-launch-cover');
  const splashFrame=document.getElementById('gv-splash-frame');
  const errorBox=document.getElementById('gv-launch-error');

  const showError=error=>{
    errorBox.style.display='block';
    errorBox.textContent='APP FAILED TO LOAD\n\n'+String(error?.stack||error);
  };

  const viewerDownloadPromise=fetch(VIEWER_URL,{cache:'force-cache'}).then(async response=>{
    if(!response.ok)throw new Error('GV-BETA-0009G.PY RETURNED HTTP '+response.status);
    return response.blob();
  });

  const startVisibleSplash=()=>new Promise((resolve,reject)=>{
    let settled=false;
    const fail=error=>{
      if(settled)return;
      settled=true;
      reject(error);
    };
    const onLoad=()=>{
      try{
        const splashWindow=splashFrame.contentWindow;
        if(!splashWindow)throw new Error('FINAL SPLASH WINDOW IS UNAVAILABLE');
        splashWindow.addEventListener('galaxy-splash-complete',()=>{
          if(settled)return;
          settled=true;
          resolve();
        },{once:true});
        const firstFrameDeadline=performance.now()+SPLASH_FIRST_FRAME_TIMEOUT_MS;
        const revealAtFirstFrame=()=>{
          try{
            const splashDocument=splashWindow.document;
            const scene=splashDocument.getElementById('scene');
            const poster=splashDocument.getElementById('poster');
            const rendered=scene?.style.opacity==='1'||poster?.style.visibility==='visible';
            if(rendered){
              if(launchCover.isConnected)launchCover.remove();
              return;
            }
            if(performance.now()>=firstFrameDeadline){fail(new Error('FINAL SPLASH FIRST FRAME TIMEOUT'));return}
            requestAnimationFrame(revealAtFirstFrame);
          }catch(error){fail(error)}
        };
        requestAnimationFrame(revealAtFirstFrame);
      }catch(error){fail(error)}
    };
    splashFrame.addEventListener('load',onLoad,{once:true});
    splashFrame.addEventListener('error',()=>fail(new Error('FINAL SPLASH FAILED TO LOAD')),{once:true});
    splashFrame.src=SPLASH_URL;
  });

  const waitForViewer=()=>new Promise((resolve,reject)=>{
    const deadline=performance.now()+VIEWER_TIMEOUT_MS;
    const check=()=>{
      const root=document.getElementById('aladin-cosmic-command-test');
      const home=document.getElementById('gv-we-are-here');
      const homeReady=Boolean(home&&!home.classList.contains('gv-hidden')&&String(home.textContent||'').includes('WE ARE HERE'));
      if(root?.querySelector('canvas')&&window.aladin_cosmic_command_test&&homeReady){
        requestAnimationFrame(()=>requestAnimationFrame(resolve));
        return;
      }
      if(performance.now()>=deadline){reject(new Error('GALAXY VIEWER 9G STARTUP TIMEOUT'));return}
      setTimeout(check,100);
    };
    check();
  });

  const initializeViewer=async()=>{
    const viewerBlob=await viewerDownloadPromise;
    const source=await viewerBlob.text();
    const htmlMatches=[...source.matchAll(/display\(HTML\(\"\"\"([\s\S]*?)\"\"\"\)\)/g)];
    const jsMatches=[...source.matchAll(/display\(Javascript\(r\"\"\"([\s\S]*?)\"\"\"\)\)/g)];
    if(!htmlMatches.length||!jsMatches.length)throw new Error('COULD NOT EXTRACT THE VERIFIED 9G FULL VIEWER');
    htmlMatches.forEach(match=>document.body.insertAdjacentHTML('beforeend',match[1]));
    jsMatches.forEach(match=>{
      const script=document.createElement('script');
      script.textContent=match[1];
      document.body.appendChild(script);
    });
    await waitForViewer();
  };

  try{
    const viewerInitializePromise=initializeViewer();
    const splashCompletePromise=startVisibleSplash();
    await Promise.all([viewerInitializePromise,splashCompletePromise]);
    requestAnimationFrame(()=>{
      if(splashFrame.isConnected)splashFrame.remove();
      if(launchCover.isConnected)launchCover.remove();
    });
  }catch(error){
    console.error('GALAXY VIEWER 9G APP LAUNCHER FAILURE',error);
    showError(error);
  }
})();
</script>
</body>
</html>
