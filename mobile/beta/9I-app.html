<!doctype html>
<!--
GALAXY VIEWER 9I — DIRECT APP LAUNCHER
Permanent launcher path. No splash animation. The public 9I website owns the approved Galaxy Viewer banner.
Viewer: viewer/GV-beta-0009I.py
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GALAXY VIEWER BETA 9I">
<title>GALAXY VIEWER 9I — APP LAUNCHER</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff}
#gv-launch-error{display:none;position:fixed;inset:0;z-index:2147483647;padding:24px;box-sizing:border-box;background:#000;color:#FFD166;white-space:pre-wrap;font:14px/1.5 monospace}
#aladin-cosmic-command-test{width:100%!important;height:100vh!important;height:100svh!important;height:100dvh!important}
</style>
</head>
<body>
<div id="gv-launch-error" role="alert"></div>
<script>
(async()=>{
  'use strict';
  const VIEWER_URL='../../viewer/GV-beta-0009I.py?v=e0fbdcdf2f6a191353d191fc3d05af919b1de996';
  const VIEWER_TIMEOUT_MS=20000;
  const errorBox=document.getElementById('gv-launch-error');

  const showError=error=>{
    errorBox.style.display='block';
    errorBox.textContent='APP FAILED TO LOAD\n\n'+String(error?.stack||error);
  };

  const waitForViewer=()=>new Promise((resolve,reject)=>{
    const deadline=performance.now()+VIEWER_TIMEOUT_MS;
    const check=()=>{
      const root=document.getElementById('aladin-cosmic-command-test');
      const home=document.getElementById('gv-we-are-here');
      const homeReady=Boolean(home&&!home.classList.contains('gv-hidden')&&String(home.textContent||'').includes('WE ARE HERE'));
      if(root?.querySelector('canvas')&&window.aladin_cosmic_command_test&&homeReady){
        requestAnimationFrame(()=>requestAnimationFrame(resolve));
        return;
      }
      if(performance.now()>=deadline){reject(new Error('GALAXY VIEWER 9I STARTUP TIMEOUT'));return}
      setTimeout(check,100);
    };
    check();
  });

  const initializeViewer=async()=>{
    const response=await fetch(VIEWER_URL,{cache:'force-cache'});
    if(!response.ok)throw new Error('GV-BETA-0009I.PY RETURNED HTTP '+response.status);
    const source=await response.text();
    const htmlMatches=[...source.matchAll(/display\(HTML\(\"\"\"([\s\S]*?)\"\"\"\)\)/g)];
    const jsMatches=[...source.matchAll(/display\(Javascript\(r\"\"\"([\s\S]*?)\"\"\"\)\)/g)];
    if(!htmlMatches.length||!jsMatches.length)throw new Error('COULD NOT EXTRACT THE VERIFIED 9I FULL VIEWER');
    htmlMatches.forEach(match=>document.body.insertAdjacentHTML('beforeend',match[1]));
    jsMatches.forEach(match=>{
      const script=document.createElement('script');
      script.textContent=match[1];
      document.body.appendChild(script);
    });
    await waitForViewer();
  };

  try{
    await initializeViewer();
  }catch(error){
    console.error('GALAXY VIEWER 9I APP LAUNCHER FAILURE',error);
    showError(error);
  }
})();
</script>
</body>
</html>
