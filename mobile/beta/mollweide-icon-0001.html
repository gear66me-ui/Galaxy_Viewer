<!doctype html>
<!--
GALAXY VIEWER CHANGE ORDER
USER INSTRUCTION: Keep the Mollweide icon pulse slow and tense; glow the INSIDE of the square tile only, not the outside border. Keep the icon geometry glowing in sync with the tile interior. This timing is the reference rhythm for future menu icons so they can chime in unison.
AUTHORIZED CHANGES: mobile/beta/mollweide-icon-0001.html only.
PRESERVED BEHAVIOR: Mollweide SVG geometry and standalone prototype structure.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GV Mollweide Icon 0001</title>
<style>
:root{--cyan:#8feaff;--violet:#9d7cff;--cycle:6.4s}
*{box-sizing:border-box}
html,body{margin:0;background:#000;width:100%;height:100%}
body{display:grid;place-items:center}
.cell{
  position:relative;
  width:64px;
  height:64px;
  border:1px solid #324754;
  border-radius:7px;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:#020408;
  box-shadow:none;
}
.cell::before{
  content:"";
  position:absolute;
  inset:1px;
  border-radius:5px;
  pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,rgba(79,166,255,.06) 0%,rgba(38,56,88,.035) 42%,rgba(0,0,0,0) 76%);
  box-shadow:inset 0 0 8px rgba(98,216,255,.025),inset 0 0 2px rgba(157,124,255,.02);
  animation:tileInteriorPulse var(--cycle) cubic-bezier(.42,0,.18,1) infinite;
}
svg{
  position:relative;
  z-index:1;
  width:48px;
  height:48px;
  overflow:visible;
  animation:iconPulse var(--cycle) cubic-bezier(.42,0,.18,1) infinite;
}
.outline,.grid{fill:none;stroke-linecap:round;stroke-linejoin:round}
.outline{stroke:var(--cyan);stroke-width:1.8}
.grid{stroke:var(--violet);stroke-width:1.25;opacity:.98}
@keyframes tileInteriorPulse{
  0%,100%{
    opacity:.48;
    background:radial-gradient(ellipse at 50% 50%,rgba(79,166,255,.035) 0%,rgba(26,34,54,.025) 42%,rgba(0,0,0,0) 76%);
    box-shadow:inset 0 0 7px rgba(98,216,255,.02),inset 0 0 2px rgba(157,124,255,.015);
  }
  24%{
    opacity:.68;
    background:radial-gradient(ellipse at 50% 50%,rgba(79,166,255,.09) 0%,rgba(42,58,92,.055) 46%,rgba(0,0,0,0) 77%);
    box-shadow:inset 0 0 10px rgba(98,216,255,.07),inset 0 0 5px rgba(157,124,255,.045);
  }
  52%{
    opacity:1;
    background:radial-gradient(ellipse at 50% 50%,rgba(96,191,255,.28) 0%,rgba(61,76,138,.18) 36%,rgba(38,25,78,.12) 58%,rgba(0,0,0,0) 80%);
    box-shadow:inset 0 0 18px rgba(98,216,255,.30),inset 0 0 9px rgba(157,124,255,.22),inset 0 0 3px rgba(255,255,255,.13);
  }
  76%{
    opacity:.70;
    background:radial-gradient(ellipse at 50% 50%,rgba(79,166,255,.10) 0%,rgba(42,58,92,.06) 46%,rgba(0,0,0,0) 77%);
    box-shadow:inset 0 0 10px rgba(98,216,255,.075),inset 0 0 5px rgba(157,124,255,.05);
  }
}
@keyframes iconPulse{
  0%,100%{opacity:.54;filter:drop-shadow(0 0 1px rgba(143,234,255,.16))}
  24%{opacity:.68;filter:drop-shadow(0 0 2px rgba(143,234,255,.28))}
  52%{opacity:1;filter:drop-shadow(0 0 4px rgba(143,234,255,.98)) drop-shadow(0 0 9px rgba(79,166,255,.76)) drop-shadow(0 0 14px rgba(157,124,255,.58))}
  76%{opacity:.68;filter:drop-shadow(0 0 2px rgba(143,234,255,.30))}
}
</style>
</head>
<body>
<div class="cell">
<svg viewBox="0 0 64 64" role="img" aria-label="Mollweide projection">
  <g aria-hidden="true">
    <path class="outline" d="M7 32C7 21 17 14 32 14C47 14 57 21 57 32C57 43 47 50 32 50C17 50 7 43 7 32Z"/>
    <path class="grid" d="M7 32H57"/>
    <path class="grid" d="M9.5 25C20 20.5 44 20.5 54.5 25"/>
    <path class="grid" d="M9.5 39C20 43.5 44 43.5 54.5 39"/>
    <path class="grid" d="M16 17.5C21.5 24.5 21.5 39.5 16 46.5"/>
    <path class="grid" d="M22.5 15.2C26.5 23.5 26.5 40.5 22.5 48.8"/>
    <path class="grid" d="M32 14V50"/>
    <path class="grid" d="M41.5 15.2C37.5 23.5 37.5 40.5 41.5 48.8"/>
    <path class="grid" d="M48 17.5C42.5 24.5 42.5 39.5 48 46.5"/>
  </g>
</svg>
</div>
</body>
</html>
