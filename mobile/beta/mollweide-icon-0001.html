<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GV Mollweide Icon 0001</title>
<style>
:root{--cyan:#8feaff;--violet:#9d7cff;--cycle:5.2s}
*{box-sizing:border-box}
html,body{margin:0;background:#000;width:100%;height:100%}
body{display:grid;place-items:center}
.cell{
  width:64px;height:64px;border:1px solid #324754;border-radius:7px;
  display:grid;place-items:center;
  background:radial-gradient(ellipse at center,rgba(35,80,110,.10),rgba(0,0,0,.95) 72%);
  box-shadow:0 0 7px rgba(98,216,255,.16),inset 0 0 4px rgba(98,216,255,.06);
  animation:tilePulse var(--cycle) cubic-bezier(.45,0,.2,1) infinite;
}
svg{
  width:48px;height:48px;overflow:visible;
  animation:iconPulse var(--cycle) cubic-bezier(.45,0,.2,1) infinite;
}
.outline,.grid{fill:none;stroke-linecap:round;stroke-linejoin:round}
.outline{stroke:var(--cyan);stroke-width:1.8}
.grid{stroke:var(--violet);stroke-width:1.25;opacity:.98}
@keyframes tilePulse{
  0%,100%{
    background:radial-gradient(ellipse at center,rgba(28,54,74,.08),rgba(0,0,0,.96) 74%);
    box-shadow:0 0 6px rgba(98,216,255,.12),inset 0 0 4px rgba(98,216,255,.05);
  }
  18%{
    background:radial-gradient(ellipse at center,rgba(42,93,128,.14),rgba(3,5,12,.95) 72%);
    box-shadow:0 0 8px rgba(98,216,255,.22),inset 0 0 6px rgba(98,216,255,.10);
  }
  50%{
    background:radial-gradient(ellipse at center,rgba(79,166,255,.28),rgba(26,20,58,.96) 72%);
    box-shadow:0 0 6px rgba(240,237,255,.86),0 0 16px rgba(98,216,255,.76),inset 0 0 13px rgba(157,124,255,.34);
  }
  72%{
    background:radial-gradient(ellipse at center,rgba(42,93,128,.14),rgba(3,5,12,.95) 72%);
    box-shadow:0 0 8px rgba(98,216,255,.22),inset 0 0 6px rgba(98,216,255,.10);
  }
}
@keyframes iconPulse{
  0%,100%{opacity:.54;filter:drop-shadow(0 0 1px rgba(143,234,255,.18))}
  18%{opacity:.68;filter:drop-shadow(0 0 2px rgba(143,234,255,.30))}
  50%{opacity:1;filter:drop-shadow(0 0 4px rgba(143,234,255,.98)) drop-shadow(0 0 10px rgba(79,166,255,.75)) drop-shadow(0 0 15px rgba(157,124,255,.62))}
  72%{opacity:.68;filter:drop-shadow(0 0 2px rgba(143,234,255,.30))}
}
</style>
</head>
<body>
<div class="cell">
<svg viewBox="0 0 64 64" role="img" aria-label="Mollweide projection">
  <g aria-hidden="true">
    <path class="outline" d="M7 32C7 21 17 14 32 14C47 14 57 21 57 32C57 43 47 50 32 50C17 50 7 43 7 32Z"/>
    <path class="grid" d="M7 32H57"/>
    <path class="grid" d="M9.5 25C20 20.5 44 20.5 54.5 25"/>
    <path class="grid" d="M9.5 39C20 43.5 44 43.5 54.5 39"/>
    <path class="grid" d="M16 17.5C21.5 24.5 21.5 39.5 16 46.5"/>
    <path class="grid" d="M22.5 15.2C26.5 23.5 26.5 40.5 22.5 48.8"/>
    <path class="grid" d="M32 14V50"/>
    <path class="grid" d="M41.5 15.2C37.5 23.5 37.5 40.5 41.5 48.8"/>
    <path class="grid" d="M48 17.5C42.5 24.5 42.5 39.5 48 46.5"/>
  </g>
</svg>
</div>
</body>
</html>
