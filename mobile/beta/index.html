<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GALAXY VIEWER">
<title>GALAXY VIEWER</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="../../viewer/artwork/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../viewer/artwork/icon_transparent.png">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}</style>
</head>
<body>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(reg=>reg.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(key=>/^galaxy-viewer-/.test(key)).map(key=>caches.delete(key)));
    }
  }catch(error){console.warn('GV beta cache reset skipped',error)}
  window.location.replace('./generic-app.html?source=mobile-entry&v=0081-'+Date.now()+window.location.hash);
})();
</script>
</body>
</html>
