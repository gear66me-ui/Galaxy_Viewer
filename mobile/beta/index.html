<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GALAXY VIEWER BETA 6I">
<title>GALAXY VIEWER 6I — MOBILE APP BETA</title>
<link rel="manifest" href="./manifest.webmanifest?v=6I-pwa-install-001">
<link rel="icon" href="../../viewer/artwork/icon_target_vector.svg?v=6I-coordinate-harmony-001" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../viewer/artwork/icon_target_vector.svg?v=6I-coordinate-harmony-001">
<style>
@font-face{font-family:"Space Age";src:url("../../viewer/artwork/Fonts/Space%20Age/space%20age.otf?v=6I-coordinate-harmony-001") format("opentype");font-style:normal;font-weight:400;font-display:block}
html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:#000;color:#fff}
body{font-family:"Space Age",sans-serif;text-transform:uppercase}
.gv-startup-stage{position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;opacity:1;transition:opacity .28s ease}
.gv-startup-stage[hidden]{display:none}
.gv-startup-stage img{display:block;object-fit:contain;background:#000}
#gv-trademark-stage img{width:min(42vw,180px);height:min(42vw,180px)}
#gv-splash-stage img{width:100%;height:100%;position:absolute;inset:0}
.gv-startup-message{position:relative;z-index:2;margin-top:18px;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,.72);color:#62D8FF;font-size:13px;font-weight:400;text-align:center}
.gv-startup-message>span,#gv-loading-error>span{display:inline-block;transform:scaleY(1.5);transform-origin:center}
#gv-splash-stage .gv-startup-message{position:absolute;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%);margin:0;white-space:nowrap}
body.gv-ready .gv-startup-stage{opacity:0;pointer-events:none}
#gv-loading-error{display:none;position:fixed;inset:0;z-index:2147483647;padding:24px;background:#000;color:#ff7b8b;white-space:pre-wrap;font:400 14px/1.5 "Space Age",sans-serif;text-transform:uppercase}
#aladin-cosmic-command-test{width:100%!important;height:100vh!important;height:100svh!important;height:100dvh!important;min-height:100vh!important;min-height:100svh!important;min-height:100dvh!important}
#gv-diagnostics{position:fixed;z-index:2147483647;top:max(10px,env(safe-area-inset-top));right:10px;width:min(92vw,430px);max-height:72vh;display:flex;flex-direction:column;border:2px solid #62D8FF;border-radius:10px;background:rgba(0,5,18,.94);box-shadow:0 0 20px rgba(98,216,255,.42);color:#fff;font:400 11px/1.45 "Space Age",sans-serif;text-transform:uppercase}
#gv-diagnostics[hidden]{display:none}
.gv-diag-title{padding:10px;border-bottom:1px solid #7575ff;color:#62D8FF;text-align:center}
#gv-diag-log{min-height:120px;overflow:auto;padding:10px;white-space:pre-wrap;word-break:break-word;text-transform:none}
.gv-diag-controls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:9px;border-top:1px solid #7575ff}
.gv-diag-controls button,.gv-diag-toggle{min-height:38px;border:1px solid #62D8FF;border-radius:6px;background:#101024;color:#fff;font:400 10px "Space Age",sans-serif;text-transform:uppercase}
.gv-diag-toggle{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:8px;padding:7px}
.gv-diag-toggle input{width:18px;height:18px}
</style>
</head>
<body>
<div id="gv-trademark-stage" class="gv-startup-stage">
  <img src="../../viewer/artwork/icon_target_vector.svg?v=6I-coordinate-harmony-001" alt="GALAXY VIEWER TRADEMARK">
  <div class="gv-startup-message"><span>STARTING GALAXY VIEWER BETA 6I…</span></div>
</div>
<div id="gv-splash-stage" class="gv-startup-stage" hidden>
  <img src="../../viewer/artwork/GV-splash-0003.svg?v=6I-coordinate-harmony-001" alt="GALAXY VIEWER SPLASH ARTWORK">
  <div class="gv-startup-message"><span>LOADING 1,000 GALAXIES · 250 SPECTACULAR…</span></div>
</div>
<div id="gv-loading-error" role="alert"></div>
<section id="gv-diagnostics" hidden aria-label="GALAXY VIEWER ENGINEERING DIAGNOSTICS">
  <div class="gv-diag-title">ENGINEERING DIAGNOSTICS</div>
  <div id="gv-diag-log" role="log" aria-live="polite"></div>
  <div class="gv-diag-controls">
    <button id="gv-diag-continue" type="button">CONTINUE</button>
    <button id="gv-diag-copy" type="button">COPY LOG</button>
    <button id="gv-diag-clear" type="button">CLEAR LOG</button>
    <label class="gv-diag-toggle"><input id="gv-diag-auto" type="checkbox"> AUTO RUN</label>
  </div>
</section>
<script>
console.log("DIAG: JS ENTERED");

const __earlyDiag = new URLSearchParams(window.location.search).get('diag') === '1';
if (__earlyDiag) {
  const panel = document.getElementById('gv-diagnostics');
  const log = document.getElementById('gv-diag-log');
  if (panel && log) {
    panel.hidden = false;
    log.textContent = "[EARLY] DIAGNOSTIC MODE ENTERED";
  }
}
</script>
<script>
(()=>{
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>{
      navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).then(registration=>{
        console.log('GALAXY VIEWER SERVICE WORKER REGISTERED',registration.scope);
      }).catch(error=>{
        console.error('GALAXY VIEWER SERVICE WORKER REGISTRATION FAILED',error);
      });
    });
  }
})();
</script>
<script>
(async()=>{
  const ICON_MS=1000;
  const SPLASH_MS=4000;
  const VIEWER_TIMEOUT_MS=20000;
  const diagnosticMode=new URLSearchParams(window.location.search).get('diag')==='1';
  const trademarkStage=document.getElementById('gv-trademark-stage');
  const splashStage=document.getElementById('gv-splash-stage');
  const errorBox=document.getElementById('gv-loading-error');
  const diagPanel=document.getElementById('gv-diagnostics');
  const diagLog=document.getElementById('gv-diag-log');
  const diagContinue=document.getElementById('gv-diag-continue');
  const diagCopy=document.getElementById('gv-diag-copy');
  const diagClear=document.getElementById('gv-diag-clear');
  const diagAuto=document.getElementById('gv-diag-auto');
  const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  let continueResolver=null;
  const timestamp=()=>new Date().toISOString();
  const formatDetail=detail=>{
    if(detail===undefined)return '';
    if(detail instanceof Error)return ` — ${detail.name}: ${detail.message}`;
    if(typeof detail==='string')return ` — ${detail}`;
    try{return ` — ${JSON.stringify(detail)}`;}catch(_){return ` — ${String(detail)}`;}
  };
  const appendDiagnostic=(label,detail)=>{
    if(!diagnosticMode)return;
    const line=`[${timestamp()}] ${label}${formatDetail(detail)}`;
    diagLog.textContent+=(diagLog.textContent?'\n':'')+line;
    diagLog.scrollTop=diagLog.scrollHeight;
  };
  const checkpoint=async(label,detail)=>{
    appendDiagnostic(label,detail);
    if(!diagnosticMode||diagAuto.checked)return;
    await new Promise(resolve=>{continueResolver=resolve;});
    continueResolver=null;
  };
  if(diagnosticMode){
    diagPanel.hidden=false;
    diagContinue.addEventListener('click',()=>{continueResolver?.();});
    diagAuto.addEventListener('change',()=>{if(diagAuto.checked)continueResolver?.();});
    diagCopy.addEventListener('click',async()=>{
      try{
        await navigator.clipboard.writeText(diagLog.textContent);
        appendDiagnostic('LOG COPIED');
      }catch(error){appendDiagnostic('WARNING','COPY LOG FAILED: '+String(error?.message||error));}
    });
    diagClear.addEventListener('click',()=>{diagLog.textContent='';});
    window.addEventListener('error',event=>appendDiagnostic('EXCEPTION',event.error||event.message));
    window.addEventListener('unhandledrejection',event=>appendDiagnostic('EXCEPTION',event.reason));
    const originalWarn=console.warn.bind(console);
    console.warn=(...args)=>{appendDiagnostic('WARNING',args.map(String).join(' '));originalWarn(...args);};
    const originalError=console.error.bind(console);
    console.error=(...args)=>{appendDiagnostic('EXCEPTION',args.map(String).join(' '));originalError(...args);};
  }
  const showError=message=>{trademarkStage.hidden=true;splashStage.hidden=true;errorBox.style.display='block';errorBox.innerHTML='<span>'+String(message).toUpperCase().replace(/[&<>]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[char]))+'</span>'};
  const prepareCleanBetaStart=async()=>{
    await checkpoint('CACHE CLEAR STARTED');
    try{
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(keys.filter(key=>key.startsWith('galaxy-viewer-beta-')).map(key=>caches.delete(key)));
      }
      navigator.serviceWorker?.controller?.postMessage('CLEAR_BETA_CACHES');
    }catch(error){console.warn('GALAXY VIEWER BETA CLEAN-START PREPARATION FAILED',error);}
    await checkpoint('CACHE CLEAR COMPLETED');
  };
  const waitForViewer=()=>new Promise((resolve,reject)=>{
    const deadline=performance.now()+VIEWER_TIMEOUT_MS;
    const check=()=>{
      const root=document.getElementById('aladin-cosmic-command-test');
      if(root?.querySelector('canvas')&&window.aladin_cosmic_command_test){resolve();return;}
      if(performance.now()>=deadline){reject(new Error('THE ALADIN VIEWER DID NOT CREATE A CANVAS WITHIN 20 SECONDS.'));return;}
      setTimeout(check,100);
    };
    check();
  });
  await checkpoint('LAUNCHER ENTERED');
  if(diagnosticMode)await checkpoint('DIAGNOSTIC MODE ENABLED');
  await prepareCleanBetaStart();
  try{
    const viewerReady=(async()=>{
      await checkpoint('FETCH STARTED');
      const response=await fetch('../../viewer/GV-beta-0006I.py?v='+Date.now(),{cache:'no-store'});
      await checkpoint('HTTP RESPONSE RECEIVED',`HTTP ${response.status}`);
      if(!response.ok)throw new Error(`GV-BETA-0006I.PY RETURNED HTTP ${response.status}`);
      const source=await response.text();
      await checkpoint('PYTHON DOWNLOADED',`${source.length} CHARACTERS`);
      const htmlMatch=source.match(/display\(HTML\("""([\s\S]*?)"""\)\)/);
      if(!htmlMatch)throw new Error('COULD NOT EXTRACT THE VERIFIED 6I STANDALONE VIEWER HTML.');
      await checkpoint('HTML EXTRACTED');
      const jsMatch=source.match(/display\(Javascript\(r"""([\s\S]*?)"""\)\)/);
      if(!jsMatch)throw new Error('COULD NOT EXTRACT THE VERIFIED 6I STANDALONE VIEWER JAVASCRIPT.');
      await checkpoint('JAVASCRIPT EXTRACTED');
      document.body.insertAdjacentHTML('beforeend',htmlMatch[1]);
      await checkpoint('HTML INSERTED');
      const cometCss=document.createElement('link');
      cometCss.rel='stylesheet';
      cometCss.href='../../viewer/GV-beta-0005R-comet-120.css?v='+Date.now();
      document.head.appendChild(cometCss);
      const script=document.createElement('script');
      script.textContent=jsMatch[1];
      document.body.appendChild(script);
      await checkpoint('JAVASCRIPT INJECTED');
      await checkpoint('ALADIN INITIALIZATION');
      await checkpoint('WAITING FOR CANVAS');
      await waitForViewer();
      await checkpoint('CANVAS DETECTED');
      await checkpoint('VIEWER READY');
    })();
    await sleep(ICON_MS);
    trademarkStage.hidden=true;
    splashStage.hidden=false;
    await Promise.all([viewerReady,sleep(SPLASH_MS)]);
    document.body.classList.add('gv-ready');
    setTimeout(()=>{splashStage.hidden=true;},300);
  }catch(error){
    console.error('GALAXY VIEWER 6I MOBILE BETA STARTUP FAILURE',error);
    if(diagnosticMode){
      showError(error?.message||error);
      return;
    }
    const fallback=new URL('../../launch/beta/web/',window.location.href);
    fallback.searchParams.set('source','beta-6i-app-fallback');
    fallback.searchParams.set('reason',String(error?.message||error).slice(0,180));
    window.location.replace(fallback.href);
  }
})();
</script>
</body>
</html>
