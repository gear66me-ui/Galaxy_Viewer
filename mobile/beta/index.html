<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Galaxy Viewer Beta 5Z">
<title>Galaxy Viewer 5Z — Mobile App Beta</title>
<link rel="manifest" href="./manifest.webmanifest?v=5Z-rounded-tiles-001">
<link rel="icon" href="../../viewer/artwork/icon_target_vector.svg?v=5Z-rounded-tiles-001" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../viewer/artwork/icon_target_vector.svg?v=5Z-rounded-tiles-001">
<style>
html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:#000;color:#fff}
body{font-family:"Roboto Mono",Consolas,monospace}
.gv-startup-stage{position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;opacity:1;transition:opacity .28s ease}
.gv-startup-stage[hidden]{display:none}
.gv-startup-stage img{display:block;object-fit:contain;background:#000}
#gv-trademark-stage img{width:min(42vw,180px);height:min(42vw,180px)}
#gv-splash-stage img{width:100%;height:100%;position:absolute;inset:0}
.gv-startup-message{position:relative;z-index:2;margin-top:18px;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,.72);color:#62D8FF;font-size:13px;font-weight:700;text-align:center}
#gv-splash-stage .gv-startup-message{position:absolute;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%);margin:0;white-space:nowrap}
body.gv-ready .gv-startup-stage{opacity:0;pointer-events:none}
#gv-loading-error{display:none;position:fixed;inset:0;z-index:2147483647;padding:24px;background:#000;color:#ff7b8b;white-space:pre-wrap;font:700 14px/1.5 "Roboto Mono",Consolas,monospace}
#aladin-cosmic-command-test{width:100%!important;height:100vh!important;height:100svh!important;height:100dvh!important;min-height:100vh!important;min-height:100svh!important;min-height:100dvh!important}
</style>
</head>
<body>
<div id="gv-trademark-stage" class="gv-startup-stage">
  <img src="../../viewer/artwork/icon_target_vector.svg?v=5Z-rounded-tiles-001" alt="Galaxy Viewer trademark">
  <div class="gv-startup-message">Starting Galaxy Viewer Beta 5Z…</div>
</div>
<div id="gv-splash-stage" class="gv-startup-stage" hidden>
  <img src="../../viewer/artwork/GV-splash-0003.svg?v=5Z-rounded-tiles-001" alt="Galaxy Viewer splash artwork">
  <div class="gv-startup-message">Loading 1,000 galaxies · 250 spectacular…</div>
</div>
<div id="gv-loading-error" role="alert"></div>
<script>
(async()=>{
  const ICON_MS=1000;
  const SPLASH_MS=4000;
  const VIEWER_TIMEOUT_MS=20000;
  const TARGET_ICON_URL='../../viewer/artwork/icon_target_vector.svg?v=5Z-rounded-tiles-001';
  const trademarkStage=document.getElementById('gv-trademark-stage');
  const splashStage=document.getElementById('gv-splash-stage');
  const errorBox=document.getElementById('gv-loading-error');
  const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const showError=message=>{trademarkStage.hidden=true;splashStage.hidden=true;errorBox.style.display='block';errorBox.textContent=message};
  const prepareCleanBetaStart=async()=>{
    try{
      if('serviceWorker' in navigator){
        const registrations=await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.filter(registration=>registration.scope.includes('/Galaxy_Viewer/mobile/beta/')).map(registration=>registration.unregister()));
      }
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(keys.map(key=>caches.delete(key)));
      }
    }catch(error){console.warn('Galaxy Viewer beta clean-start preparation failed',error);}
  };
  const installVectorTarget=()=>{
    const root=document.getElementById('aladin-cosmic-command-test');
    const proxy=root?.querySelector('button.gv-target-proxy');
    const targetImage=proxy?.querySelector('img');
    if(!proxy||!targetImage)return false;
    if(targetImage.dataset.gvVectorInstalled!=='true'){
      targetImage.src=TARGET_ICON_URL;
      targetImage.dataset.gvVectorInstalled='true';
    }
    let tileStyle=document.getElementById('gv-5z-rounded-tiles-style');
    if(!tileStyle){
      tileStyle=document.createElement('style');
      tileStyle.id='gv-5z-rounded-tiles-style';
      tileStyle.textContent='#aladin-cosmic-command-test button.gv-target-proxy{border-radius:6px!important}#aladin-cosmic-command-test button.gv-target-proxy[aria-pressed="true"]::before{inset:0!important;border-radius:5px!important;background-size:110% 110%!important;background-position:center!important}#aladin-cosmic-command-test .gv-target-status{margin-left:3px!important;border-radius:6px!important}';
      document.head.appendChild(tileStyle);
    }
    targetImage.style.setProperty('width','32px','important');
    targetImage.style.setProperty('height','32px','important');
    targetImage.style.setProperty('object-fit','contain','important');
    targetImage.style.setProperty('filter','none','important');
    proxy.style.setProperty('border-radius','6px','important');
    const status=root.querySelector('.gv-target-status');
    if(status){
      status.innerHTML='<span>Tap Galaxy/Star</span><span>for Info</span>';
      status.style.setProperty('margin-left','3px','important');
      status.style.setProperty('border-radius','6px','important');
      status.style.setProperty('width','clamp(88px,25vw,104px)','important');
      status.style.setProperty('min-width','88px','important');
      status.style.setProperty('max-width','104px','important');
      status.style.setProperty('height','32px','important');
      status.style.setProperty('min-height','32px','important');
      status.style.setProperty('max-height','32px','important');
      status.style.setProperty('padding','2px 6px','important');
      status.style.setProperty('font-size','clamp(9px,2.3vw,10px)','important');
      status.style.setProperty('line-height','1.05','important');
      status.style.setProperty('white-space','nowrap','important');
      status.style.setProperty('overflow','hidden','important');
      status.querySelectorAll('span').forEach(span=>span.style.setProperty('white-space','nowrap','important'));
    }
    const versionLabel=root.querySelector('#gv-version-label');
    if(versionLabel)versionLabel.textContent='Galaxy Viewer 5Z';
    const comet=proxy.querySelector('.gv-target-comet');
    if(comet){
      comet.style.setProperty('left','50%','important');
      comet.style.setProperty('top','50%','important');
    }
    const centerGlow=comet?.querySelector('i:nth-child(1)');
    if(centerGlow){
      centerGlow.style.setProperty('left','-2px','important');
      centerGlow.style.setProperty('top','-2px','important');
    }
    return true;
  };

  await prepareCleanBetaStart();

  const waitForViewer=()=>new Promise((resolve,reject)=>{
    const deadline=performance.now()+VIEWER_TIMEOUT_MS;
    const check=()=>{
      const root=document.getElementById('aladin-cosmic-command-test');
      if(root?.querySelector('canvas')&&window.aladin_cosmic_command_test){installVectorTarget();resolve();return;}
      if(performance.now()>=deadline){reject(new Error('The Aladin viewer did not create a canvas within 20 seconds.'));return;}
      setTimeout(check,100);
    };
    check();
  });

  try{
    const viewerReady=(async()=>{
      const response=await fetch('../../viewer/GV-beta-0005Y.py?v='+Date.now(),{cache:'no-store'});
      if(!response.ok)throw new Error(`GV-beta-0005Y.py returned HTTP ${response.status}`);
      const source=await response.text();
      const htmlMatch=source.match(/display\(HTML\("""([\s\S]*?)"""\)\)/);
      const jsMatch=source.match(/display\(Javascript\(r"""([\s\S]*?)"""\)\)/);
      if(!htmlMatch||!jsMatch)throw new Error('Could not extract the verified 5Y viewer engine.');
      document.body.insertAdjacentHTML('beforeend',htmlMatch[1]);
      const cometCss=document.createElement('link');
      cometCss.rel='stylesheet';
      cometCss.href='../../viewer/GV-beta-0005R-comet-120.css?v='+Date.now();
      document.head.appendChild(cometCss);
      const script=document.createElement('script');
      script.textContent=jsMatch[1];
      document.body.appendChild(script);
      const observer=new MutationObserver(()=>{
        if(installVectorTarget())observer.disconnect();
      });
      observer.observe(document.body,{childList:true,subtree:true});
      if(installVectorTarget())observer.disconnect();
      await waitForViewer();
    })();

    await sleep(ICON_MS);
    trademarkStage.hidden=true;
    splashStage.hidden=false;
    await Promise.all([viewerReady,sleep(SPLASH_MS)]);
    document.body.classList.add('gv-ready');
    setTimeout(()=>{splashStage.hidden=true;},300);
  }catch(error){
    console.error('Galaxy Viewer 5Z mobile beta startup failure',error);
    showError(`Galaxy Viewer 5Z mobile beta failed to load:\n${error.message}`);
  }
})();
</script>
</body>
</html>
