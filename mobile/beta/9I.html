<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>GALAXY VIEWER — 9I</title>
<link rel="icon" href="../../viewer/artwork/icon_target_vector.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff}
body{font-family:system-ui,sans-serif;text-align:center}
main{width:min(100%,960px);margin:0 auto;padding:18px 14px 28px}
.banner{width:100%;aspect-ratio:3/1;border:0;display:block;background:#000}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:min(100%,660px);margin:22px auto 0}
.choice{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px;border:2px solid #4f9dff;border-radius:12px;background:#081226;color:#eef7ff;text-decoration:none;box-shadow:0 0 16px rgba(69,231,255,.18),inset 0 0 12px rgba(79,157,255,.10);font:600 clamp(10px,2.2vw,14px)/1.2 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.choice:active{transform:scale(.99)}
.comet-icon{position:relative;width:min(58%,96px);aspect-ratio:1/1;flex:0 0 auto}
.comet-icon img{position:absolute;left:50%;top:50%;width:64%;height:64%;object-fit:contain;transform:translate(-50%,-50%);filter:drop-shadow(0 0 7px rgba(69,231,255,.72))}
.comet-orbit{position:absolute;inset:0;border:1px solid rgba(69,231,255,.22);border-radius:50%;animation:gv-orbit 3s linear infinite}
.comet-orbit::before{content:"";position:absolute;left:50%;top:-3px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#fff;box-shadow:0 0 5px #fff,0 0 10px #45e7ff,0 0 16px #4f9dff}
.comet-orbit::after{content:"";position:absolute;left:50%;top:1px;width:24px;height:3px;transform-origin:0 50%;transform:rotate(18deg);border-radius:999px;background:linear-gradient(90deg,rgba(69,231,255,.9),rgba(79,157,255,.48),transparent);filter:blur(.3px)}
.choice:nth-child(1) .comet-orbit{animation-delay:0s}
.choice:nth-child(2) .comet-orbit{animation-delay:-1s}
.choice:nth-child(3) .comet-orbit{animation-delay:-2s}
@keyframes gv-orbit{to{transform:rotate(360deg)}}
@media(max-width:520px){main{padding-left:10px;padding-right:10px}.choices{gap:10px}.choice{padding:8px;gap:8px;border-radius:9px}.comet-icon{width:min(64%,84px)}}
</style>
</head>
<body>
<main>
  <iframe class="banner" src="../../launch/galaxy-viewer-banner-0002.html" title="Galaxy Viewer 9I banner"></iframe>
  <div class="choices">
    <a class="choice" href="./9I-app.html?source=9i-friends-app"><span>Launch App Version</span><span class="comet-icon" aria-hidden="true"><img src="../../viewer/artwork/App%20Icons/GV-app-icon-192.png" alt=""><span class="comet-orbit"></span></span></a>
    <a class="choice" href="./9I-app.html?source=9i-friends-web"><span>Launch Web Version</span><span class="comet-icon" aria-hidden="true"><img src="../../viewer/artwork/App%20Icons/GV-app-icon-192.png" alt=""><span class="comet-orbit"></span></span></a>
    <a class="choice" href="https://github.com/gear66me-ui/Galaxy_Viewer" target="_blank" rel="noopener"><span>Galaxy Viewer Project</span><span class="comet-icon" aria-hidden="true"><img src="../../viewer/artwork/App%20Icons/GV-app-icon-192.png" alt=""><span class="comet-orbit"></span></span></a>
  </div>
</main>
<script>
(()=>{
  const q=new URLSearchParams(location.search);
  if(q.get('source')==='android-app' || q.get('launch')==='1'){
    location.replace('./9I-app.html'+location.search+location.hash);
  }
})();
</script>
</body>
</html>
