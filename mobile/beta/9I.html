<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020818">
<title>Galaxy Viewer 9I</title>
<style>
@font-face{font-family:"Space Age";src:url("../../viewer/releases/splash/Galaxy-Viewer-Singularity-FINAL/Space-Age.otf") format("opentype");font-style:normal;font-weight:400;font-display:swap}
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:"Space Age",sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 50% 12%,rgba(0,74,255,.18),transparent 34%),radial-gradient(circle at 50% 88%,rgba(0,135,255,.10),transparent 42%),#000}
main{width:min(560px,100%);text-align:center;padding:14px;border:1px solid rgba(89,158,255,.34);border-radius:22px;background:linear-gradient(180deg,rgba(4,12,30,.94),rgba(0,0,0,.98));box-shadow:0 0 36px rgba(22,91,255,.16),inset 0 0 28px rgba(35,92,255,.05)}
.banner-shell{width:100%;overflow:hidden;border:1px solid rgba(105,166,255,.62);border-radius:18px;background:#000;box-shadow:0 0 22px rgba(21,90,255,.24),inset 0 0 18px rgba(34,95,255,.08)}
.banner-shell iframe{display:block;width:100%;aspect-ratio:3/1;min-height:150px;border:0;background:#000}
.version{display:inline-block;margin:15px 0 8px;padding:5px 11px;border:1px solid rgba(91,151,255,.68);border-radius:999px;color:#9EC7FF;font-size:10px;letter-spacing:.12em;box-shadow:0 0 12px rgba(36,92,255,.22)}
p{margin:7px auto 18px;max-width:390px;color:#B9D6FF;font-size:10px;line-height:1.65;letter-spacing:.065em}
.actions{display:grid;gap:12px}
a.action{position:relative;display:grid;grid-template-columns:1fr 54px;align-items:center;min-height:68px;padding:8px 8px 8px 18px;border:1px solid #8EBBFF;border-radius:18px;background:linear-gradient(145deg,rgba(9,44,119,.98),rgba(20,82,190,.97));color:#F4F8FF;text-decoration:none;font-size:12px;font-weight:400;line-height:1.25;letter-spacing:.07em;text-transform:uppercase;text-shadow:0 0 5px rgba(223,236,255,.82);box-shadow:inset 0 0 12px rgba(117,167,255,.20),0 0 12px rgba(33,90,255,.28);-webkit-tap-highlight-color:transparent}
a.action.secondary{background:linear-gradient(145deg,rgba(6,27,74,.98),rgba(12,53,126,.97));border-color:#6FA8FF;box-shadow:inset 0 0 10px rgba(97,150,255,.14),0 0 10px rgba(31,77,222,.20)}
a.action:active{filter:brightness(1.12);transform:translateY(1px)}
.action-label{text-align:center;padding-left:8px}
.tile-target{position:relative;justify-self:end;width:46px;height:46px;border:1px solid rgba(137,187,255,.72);border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(4,17,49,.96),rgba(0,0,0,.96));box-shadow:0 0 12px rgba(28,93,255,.30),inset 0 0 10px rgba(66,124,255,.12);overflow:visible}
.tile-target img{position:relative;z-index:2;display:block;width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 0 5px rgba(64,133,255,.75))}
.tile-comet{position:absolute;left:50%;top:50%;width:0;height:0;animation:tile-comet-orbit 2.8s linear infinite;pointer-events:none;z-index:3}
.actions .action:nth-child(1) .tile-comet{animation-delay:0s}
.actions .action:nth-child(2) .tile-comet{animation-delay:-0.9333333333s}
.actions .action:nth-child(3) .tile-comet{animation-delay:-1.8666666667s}
.tile-comet i{position:absolute;left:-2px;top:-2px;width:4px;height:4px;border-radius:50%;background:#62D8FF;transform:rotate(var(--gv-angle)) translateY(-15px) scale(var(--gv-scale));opacity:var(--gv-opacity);box-shadow:0 0 4px rgba(98,216,255,.85)}
.tile-comet i:nth-child(1){--gv-angle:0deg;--gv-scale:1;--gv-opacity:1;background:#FFFFFF;box-shadow:0 0 3px 1px #FFFFFF,0 0 7px 2px #62D8FF}
.tile-comet i:nth-child(2){--gv-angle:-15deg;--gv-scale:.88;--gv-opacity:.84}
.tile-comet i:nth-child(3){--gv-angle:-30deg;--gv-scale:.76;--gv-opacity:.68}
.tile-comet i:nth-child(4){--gv-angle:-45deg;--gv-scale:.64;--gv-opacity:.52}
.tile-comet i:nth-child(5){--gv-angle:-60deg;--gv-scale:.52;--gv-opacity:.38}
.tile-comet i:nth-child(6){--gv-angle:-75deg;--gv-scale:.42;--gv-opacity:.26}
.tile-comet i:nth-child(7){--gv-angle:-90deg;--gv-scale:.32;--gv-opacity:.16}
.tile-comet i:nth-child(8){--gv-angle:-105deg;--gv-scale:.24;--gv-opacity:.08}
@keyframes tile-comet-orbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.tile-comet{animation:none;transform:rotate(35deg)}.actions .action:nth-child(2) .tile-comet{transform:rotate(155deg)}.actions .action:nth-child(3) .tile-comet{transform:rotate(275deg)}}
small{display:block;margin:17px 4px 3px;color:#739ACC;font-size:8px;line-height:1.6;letter-spacing:.07em}
html.gv-launching,html.gv-launching body{width:100%;height:100%;min-height:100%;overflow:hidden;background:#000}
html.gv-launching body{display:block;padding:0}
html.gv-launching main{display:none}
#gv-launch-error{display:none;position:fixed;inset:0;z-index:2147483647;padding:24px;background:#000;color:#FFD166;white-space:pre-wrap;font:14px/1.5 monospace}
#gv-launch-cover{position:fixed;inset:0;z-index:2147483646;display:flex;align-items:center;justify-content:center;background:#000}
#gv-splash-frame{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:2147483645;background:#000;opacity:1;visibility:visible}
#gv-opening-poster{display:block;width:min(42vw,240px);height:auto;max-height:42vh;object-fit:contain;background:transparent}
html.gv-launching #aladin-cosmic-command-test{width:100%!important;height:100vh!important;height:100svh!important;height:100dvh!important}
</style>
</head>
<body>
<main>
  <div class="banner-shell"><iframe src="../../launch/galaxy-viewer-banner-0002.html" title="Galaxy Viewer banner" loading="eager"></iframe></div>
  <div class="version">9I FROZEN RELEASE</div>
  <p>CHOOSE HOW YOU WANT TO ENTER GALAXY VIEWER.</p>
  <div class="actions">
    <a class="action" href="https://github.com/gear66me-ui/Galaxy_Viewer/releases/download/galaxy-viewer-9i-m/Galaxy-Viewer-9I-M.apk"><span class="action-label">INSTALL ANDROID APP</span><span class="tile-target"><img src="../../viewer/artwork/App%20Icons/GV-app-icon-512.png" alt=""><span class="tile-comet" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></span></a>
    <a class="action secondary" href="./9I.html?launch=9i-m"><span class="action-label">LAUNCH IN BROWSER</span><span class="tile-target"><img src="../../viewer/artwork/App%20Icons/GV-app-icon-512.png" alt=""><span class="tile-comet" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></span></a>
    <a class="action secondary" href="https://github.com/gear66me-ui/Galaxy_Viewer" target="_blank" rel="noopener"><span class="action-label">GALAXY VIEWER PROJECT</span><span class="tile-target"><img src="../../viewer/artwork/App%20Icons/GV-app-icon-512.png" alt=""><span class="tile-comet" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></span></a>
  </div>
  <small>THIS PAGE DOES NOT AUTO-LAUNCH THE APP. CHOOSE AN OPTION ABOVE.</small>
</main>
<script>
(async()=>{
  if(new URLSearchParams(location.search).get('launch')!=='9i-m')return;
  'use strict';
  document.documentElement.classList.add('gv-launching');
  const cover=document.createElement('div');
  cover.id='gv-launch-cover';
  cover.innerHTML='<img id="gv-opening-poster" src="../../viewer/artwork/App%20Icons/GV-app-icon-512.png" alt="GALAXY VIEWER">';
  const splash=document.createElement('iframe');
  splash.id='gv-splash-frame';
  splash.title='GALAXY VIEWER SPLASH';
  const errorBox=document.createElement('div');
  errorBox.id='gv-launch-error';
  errorBox.setAttribute('role','alert');
  document.body.append(cover,splash,errorBox);

  const VIEWER_URL='https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/669eec8d45d675c6eb86946e98983eb569429505/viewer/GV-beta-0010F.py';
  const SPLASH_URL='../../viewer/releases/splash/Galaxy-Viewer-Singularity-FINAL/index.html?v=a22e99d53d1cea58736d961e2d8bec400c670b72';
  const VIEWER_TIMEOUT_MS=20000;
  const SPLASH_FIRST_FRAME_TIMEOUT_MS=5000;
  const ICON_MIN_HOLD_MS=3500;
  const launchStartedAt=performance.now();
  const showError=error=>{errorBox.style.display='block';errorBox.textContent='APP FAILED TO LOAD\n\n'+String(error?.stack||error)};
  const viewerDownloadPromise=fetch(VIEWER_URL,{cache:'force-cache'}).then(async response=>{if(!response.ok)throw new Error('GV-BETA-0010F.PY RETURNED HTTP '+response.status);return response.blob()});
  const waitForIconMinimum=()=>new Promise(resolve=>setTimeout(resolve,Math.max(0,ICON_MIN_HOLD_MS-(performance.now()-launchStartedAt))));

  const splashPreload=document.createElement('iframe');
  Object.assign(splashPreload.style,{position:'fixed',left:'-10000px',top:'0',width:'1px',height:'1px',border:'0',opacity:'0',pointerEvents:'none'});
  splashPreload.setAttribute('aria-hidden','true');
  splashPreload.src=SPLASH_URL;
  document.body.appendChild(splashPreload);

  const startVisibleSplash=async()=>{
    await waitForIconMinimum();
    splashPreload.remove();
    return new Promise((resolve,reject)=>{
      let settled=false;
      const fail=error=>{if(settled)return;settled=true;reject(error)};
      splash.addEventListener('load',()=>{
        try{
          const splashWindow=splash.contentWindow;
          if(!splashWindow)throw new Error('FINAL SPLASH WINDOW IS UNAVAILABLE');
          splashWindow.addEventListener('galaxy-splash-complete',()=>{if(settled)return;settled=true;resolve()},{once:true});
          const deadline=performance.now()+SPLASH_FIRST_FRAME_TIMEOUT_MS;
          const reveal=()=>{
            try{
              const doc=splashWindow.document;
              const rendered=doc.getElementById('scene')?.style.opacity==='1'||doc.getElementById('poster')?.style.visibility==='visible';
              if(rendered){cover.remove();return}
              if(performance.now()>=deadline){fail(new Error('FINAL SPLASH FIRST FRAME TIMEOUT'));return}
              requestAnimationFrame(reveal);
            }catch(error){fail(error)}
          };
          requestAnimationFrame(reveal);
        }catch(error){fail(error)}
      },{once:true});
      splash.addEventListener('error',()=>fail(new Error('FINAL SPLASH FAILED TO LOAD')),{once:true});
      splash.src=SPLASH_URL;
    });
  };

  const waitForViewer=()=>new Promise((resolve,reject)=>{
    const deadline=performance.now()+VIEWER_TIMEOUT_MS;
    const check=()=>{
      const root=document.getElementById('aladin-cosmic-command-test');
      const home=document.getElementById('gv-we-are-here');
      const homeReady=Boolean(home&&!home.classList.contains('gv-hidden')&&String(home.textContent||'').includes('WE ARE HERE'));
      if(root?.querySelector('canvas')&&window.aladin_cosmic_command_test&&homeReady){requestAnimationFrame(()=>requestAnimationFrame(resolve));return}
      if(performance.now()>=deadline){reject(new Error('GALAXY VIEWER 9I-M STARTUP TIMEOUT'));return}
      setTimeout(check,100);
    };
    check();
  });

  const initializeViewer=async()=>{
    const viewerBlob=await viewerDownloadPromise;
    const source=await viewerBlob.text();
    const htmlMatches=[...source.matchAll(/display\(HTML\(\"\"\"([\s\S]*?)\"\"\"\)\)/g)];
    const jsMatches=[...source.matchAll(/display\(Javascript\(r\"\"\"([\s\S]*?)\"\"\"\)\)/g)];
    if(!htmlMatches.length||!jsMatches.length)throw new Error('COULD NOT EXTRACT THE VERIFIED 9I-M VIEWER');
    htmlMatches.forEach(match=>document.body.insertAdjacentHTML('beforeend',match[1]));
    jsMatches.forEach(match=>{const script=document.createElement('script');script.textContent=match[1];document.body.appendChild(script)});
    await waitForViewer();
  };

  try{
    await Promise.all([initializeViewer(),startVisibleSplash()]);
    requestAnimationFrame(()=>{splash.remove();cover.remove()});
  }catch(error){console.error('GALAXY VIEWER 9I-M WEBSITE LAUNCH FAILURE',error);showError(error)}
})();
</script>
</body>
</html>
