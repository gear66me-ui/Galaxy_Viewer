<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Galaxy Viewer 11C Diagnostics</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff}
#gv11c-boot{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#000}
#gv11c-comet{position:relative;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;line-height:20px}
#gv11c-comet .gvrg-random-star{display:block;font:16px/20px system-ui,sans-serif;transform:translateY(-.5px)}
#gv11c-comet .gvrg-random-comet{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:2;animation:gvrg-launch-comet-orbit-11c 2.8s linear infinite}
#gv11c-comet .gvrg-random-comet i{position:absolute;left:-1.5px;top:-1.5px;width:3px;height:3px;border-radius:50%;background:#62D8FF;transform:rotate(var(--a)) translateY(-8px) scale(var(--s));opacity:var(--o);box-shadow:0 0 3px rgba(98,216,255,.85)}
#gv11c-comet .gvrg-random-comet i:nth-child(1){--a:0deg;--s:1;--o:1;background:#fff;box-shadow:0 0 2px 1px #fff,0 0 5px 1px #62D8FF}
#gv11c-comet .gvrg-random-comet i:nth-child(2){--a:-15deg;--s:.88;--o:.84}#gv11c-comet .gvrg-random-comet i:nth-child(3){--a:-30deg;--s:.76;--o:.68}#gv11c-comet .gvrg-random-comet i:nth-child(4){--a:-45deg;--s:.64;--o:.52}#gv11c-comet .gvrg-random-comet i:nth-child(5){--a:-60deg;--s:.52;--o:.38}#gv11c-comet .gvrg-random-comet i:nth-child(6){--a:-75deg;--s:.42;--o:.26}#gv11c-comet .gvrg-random-comet i:nth-child(7){--a:-90deg;--s:.32;--o:.16}#gv11c-comet .gvrg-random-comet i:nth-child(8){--a:-105deg;--s:.24;--o:.08}
@keyframes gvrg-launch-comet-orbit-11c{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
#gv11c-error{display:none;position:fixed;inset:0;z-index:2147483647;box-sizing:border-box;padding:24px;background:#000;color:#FFD166;white-space:pre-wrap;font:14px/1.45 monospace}
</style>
</head>
<body>
<div id="gv11c-boot" aria-label="Loading Galaxy Viewer 11C"><div id="gv11c-comet"><span class="gvrg-random-star">✨</span><span class="gvrg-random-comet"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></div></div>
<div id="gv11c-error"></div>
<script>
(async()=>{
    'use strict';
    const fail=error=>{document.getElementById('gv11c-boot')?.remove();const panel=document.getElementById('gv11c-error');panel.style.display='block';panel.textContent='GALAXY VIEWER 11C FAILED TO LOAD\n\n'+String(error?.stack||error)};
    try{
        const viewerUrl='https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/beta/viewer/GV-beta-0011C.py?t='+Date.now();
        const response=await fetch(viewerUrl,{cache:'no-store'});if(!response.ok)throw new Error('VIEWER HTTP '+response.status);
        const source=await response.text();
        const htmlMatch=source.match(/display\(HTML\("""([\s\S]*?)"""\)\)/);
        const jsMatches=[...source.matchAll(/display\(Javascript\(r?"""([\s\S]*?)"""\)\)/g)];
        if(!htmlMatch||!jsMatches.length)throw new Error('11C VIEWER EXTRACTION FAILED');
        const scripts=jsMatches.map(match=>'<script>'+match[1].replace(/<\/script/gi,'<\\/script')+'</scr'+'ipt>').join('');
        const diag='<script src="https://gear66me-ui.github.io/Galaxy_Viewer/viewer/modules/gv-prefetch-diagnostics-0002.js?t='+Date.now()+'"></scr'+'ipt>';
        const page='<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#000000"></head><body>'+htmlMatch[1]+scripts+diag+'</body></html>';
        document.open();document.write(page);document.close();
    }catch(error){fail(error)}
})();
</script>
</body>
</html>
