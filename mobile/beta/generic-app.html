<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GALAXY VIEWER</title>
<style>
@font-face{font-family:"Space Age";src:url("../../viewer/artwork/Fonts/Space%20Age%20Regular/Space%20Age%20Regular.otf") format("opentype");font-style:normal;font-weight:400;font-display:block}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff}
#gv-generic-cover{position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;background:#000}
#gv-loading-mark{position:relative;display:flex;align-items:center;justify-content:center;width:min(52vw,280px);height:min(52vw,280px);--gv-orbit-radius:min(24vw,122px)}
#gv-loading-mark>img{position:relative;z-index:2;display:block;width:min(42vw,220px);height:min(42vw,220px);object-fit:contain;background:transparent}
#gv-loading-comet{position:absolute;left:50%;top:50%;width:0;height:0;animation:gv-loading-comet-orbit 2.8s linear infinite;pointer-events:none;z-index:3}
#gv-loading-comet i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:#62D8FF;transform:rotate(var(--gv-angle)) translateY(calc(-1 * var(--gv-orbit-radius))) scale(var(--gv-scale));opacity:var(--gv-opacity);box-shadow:0 0 6px rgba(98,216,255,.85)}
#gv-loading-comet i:nth-child(1){--gv-angle:0deg;--gv-scale:1;--gv-opacity:1;background:#fff;box-shadow:0 0 5px 2px #fff,0 0 12px 4px #62D8FF}
#gv-loading-comet i:nth-child(2){--gv-angle:-15deg;--gv-scale:.88;--gv-opacity:.84}
#gv-loading-comet i:nth-child(3){--gv-angle:-30deg;--gv-scale:.76;--gv-opacity:.68}
#gv-loading-comet i:nth-child(4){--gv-angle:-45deg;--gv-scale:.64;--gv-opacity:.52}
#gv-loading-comet i:nth-child(5){--gv-angle:-60deg;--gv-scale:.52;--gv-opacity:.38}
#gv-loading-comet i:nth-child(6){--gv-angle:-75deg;--gv-scale:.42;--gv-opacity:.26}
#gv-loading-comet i:nth-child(7){--gv-angle:-90deg;--gv-scale:.32;--gv-opacity:.16}
#gv-loading-comet i:nth-child(8){--gv-angle:-105deg;--gv-scale:.24;--gv-opacity:.08}
@keyframes gv-loading-comet-orbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
#gv-generic-version{min-height:20px;color:#FFD85A;font:400 16px/20px "Space Age",sans-serif;letter-spacing:1.2px;text-align:center;text-shadow:0 0 7px rgba(255,216,90,.55);white-space:nowrap}
#gv-generic-splash{position:fixed;inset:0;z-index:2147483646;width:100%;height:100%;border:0;background:#000;visibility:hidden}
#gv-generic-error{display:none;position:fixed;inset:0;z-index:2147483647;box-sizing:border-box;padding:24px;background:#000;color:#FFD166;white-space:pre-wrap;font:14px/1.45 monospace}
@media (prefers-reduced-motion:reduce){#gv-loading-comet{animation-duration:5.6s}}
</style>
</head>
<body>
<div id="gv-generic-cover">
  <div id="gv-loading-mark">
    <img src="../../viewer/artwork/icon.svg" alt="GALAXY VIEWER">
    <span id="gv-loading-comet" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
  </div>
  <div id="gv-generic-version">VERSION</div>
</div>
<iframe id="gv-generic-splash" title="GALAXY VIEWER SPLASH"></iframe>
<div id="gv-generic-error" role="alert"></div>
<script>
(async()=>{
'use strict';
const POINTER_URL='../../viewer/gv-current-viewer.json';
const SPLASH_URL='../../viewer/releases/splash/Galaxy-Viewer-Singularity-FINAL/index.html';
const ICON_HOLD_MS=3000;
const POST_SPLASH_HOLD_MS=1000;
const VIEWER_TIMEOUT_MS=30000;
const cover=document.getElementById('gv-generic-cover');
const versionEl=document.getElementById('gv-generic-version');
const splash=document.getElementById('gv-generic-splash');
const errorBox=document.getElementById('gv-generic-error');
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const coverPainted=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
const fail=error=>{errorBox.style.display='block';errorBox.textContent='GALAXY VIEWER FAILED TO LOAD\n\n'+String(error?.stack||error)};
const text=async url=>{const response=await fetch(url+(url.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status+' '+url);return response.text()};
const loadPointer=async()=>{
  const pointer=JSON.parse(await text(POINTER_URL));
  const version=String(pointer.version||'').trim();
  versionEl.textContent=version?'VERSION '+version:'VERSION';
  return pointer;
};
function installCatalogImagePolicy(){
  const nativeFetch=window.fetch.bind(window);
  window.fetch=async(input,init)=>{
    const raw=typeof input==='string'?input:String(input?.url||'');
    const response=await nativeFetch(input,init);
    if(!/gv-hubble-galaxies-full-\d+\.json(?:[?#]|$)/i.test(raw))return response;
    if(!response.ok)return response;
    const payload=await response.clone().json();
    if(Array.isArray(payload?.entries)){
      payload.entries=payload.entries.map(entry=>{
        if(!entry||typeof entry!=='object')return entry;
        const candidates=Array.isArray(entry.jpegCandidates)?entry.jpegCandidates.map(value=>String(value||'').trim()).filter(Boolean):[];
        const screen=candidates.find(url=>/\/archives\/images\/screen\//i.test(url));
        if(!screen)return entry;
        return {...entry,selectedImageUrl:screen,githubImageUrl:''};
      });
    }
    const headers=new Headers(response.headers);headers.delete('content-length');headers.delete('content-encoding');headers.set('content-type','application/json; charset=utf-8');
    return new Response(JSON.stringify(payload),{status:response.status,statusText:response.statusText,headers});
  };
}
function mountHtml(html){
  const template=document.createElement('template');template.innerHTML=html;
  for(const node of [...template.content.childNodes]){
    if(node.nodeName==='SCRIPT'){
      const script=document.createElement('script');
      for(const attr of [...node.attributes])script.setAttribute(attr.name,attr.value);
      script.textContent=node.textContent;document.body.appendChild(script);
    }else document.body.appendChild(node);
  }
}
async function prepareViewer(){
  const pointer=await loadPointer();
  const viewer=String(pointer.viewer||'').trim();
  if(!/^GV-beta-[A-Za-z0-9.-]+\.py$/.test(viewer)||viewer.includes('/')||/archive/i.test(viewer))throw new Error('INVALID ACTIVE VIEWER POINTER: '+viewer);
  const source=await text('../../viewer/'+viewer);
  const htmlMatch=source.match(/display\(HTML\(\"\"\"([\s\S]*?)\"\"\"\)\)/);
  const jsMatches=[...source.matchAll(/display\(Javascript\(r?\"\"\"([\s\S]*?)\"\"\"\)\)/g)];
  if(!htmlMatch||!jsMatches.length)throw new Error('ACTIVE VIEWER EXTRACTION FAILED: '+viewer);
  return {viewer,html:htmlMatch[1],scripts:jsMatches.map(match=>match[1])};
}
async function initializeViewer(prepared){
  installCatalogImagePolicy();
  mountHtml(prepared.html);
  for(const source of prepared.scripts){const script=document.createElement('script');script.textContent=source;document.body.appendChild(script)}
  const deadline=performance.now()+VIEWER_TIMEOUT_MS;
  while(performance.now()<deadline){
    const root=document.getElementById('aladin-cosmic-command-test');
    if(root?.querySelector('canvas'))return prepared.viewer;
    await sleep(100);
  }
  throw new Error('ACTIVE VIEWER STARTUP TIMEOUT: '+prepared.viewer);
}
function collectSplashAssetUrls(html){
  const base=new URL(SPLASH_URL,location.href);
  const doc=new DOMParser().parseFromString(html,'text/html');
  const urls=new Set();
  for(const node of doc.querySelectorAll('[src]')){
    const raw=node.getAttribute('src');
    if(raw&&!raw.startsWith('data:')&&!raw.startsWith('blob:'))urls.add(new URL(raw,base).href);
  }
  for(const node of doc.querySelectorAll('link[href]')){
    const raw=node.getAttribute('href');
    if(raw&&!raw.startsWith('data:')&&!raw.startsWith('blob:'))urls.add(new URL(raw,base).href);
  }
  for(const match of html.matchAll(/url\((['\"]?)(.*?)\1\)/gi)){
    const raw=String(match[2]||'').trim();
    if(raw&&!raw.startsWith('data:')&&!raw.startsWith('blob:'))urls.add(new URL(raw,base).href);
  }
  return [...urls];
}
async function preloadSplash(){
  const response=await fetch(SPLASH_URL,{cache:'reload'});
  if(!response.ok)throw new Error('HTTP '+response.status+' '+SPLASH_URL);
  const html=await response.text();
  const assets=collectSplashAssetUrls(html);
  await Promise.all(assets.map(async url=>{
    const asset=await fetch(url,{cache:'reload'});
    if(!asset.ok)throw new Error('HTTP '+asset.status+' '+url);
    await asset.arrayBuffer();
  }));
  const baseHref=new URL('./',new URL(SPLASH_URL,location.href)).href;
  const baseTag='<base href="'+baseHref+'">';
  return /<head(?:\s[^>]*)?>/i.test(html)
    ?html.replace(/<head(\s[^>]*)?>/i,match=>match+baseTag)
    :baseTag+html;
}
async function runSplash(preloadedHtml){
  const splashCompletion=new Promise((resolve,reject)=>{
    let settled=false;
    const done=()=>{if(settled)return;settled=true;resolve()};
    const timer=setTimeout(()=>{if(settled)return;settled=true;reject(new Error('SPLASH COMPLETION TIMEOUT'))},30000);
    splash.addEventListener('load',()=>{
      try{
        const w=splash.contentWindow;if(!w)throw new Error('SPLASH WINDOW UNAVAILABLE');
        w.addEventListener('galaxy-splash-complete',()=>{clearTimeout(timer);done()},{once:true});
      }catch(error){clearTimeout(timer);reject(error)}
    },{once:true});
    splash.addEventListener('error',()=>{clearTimeout(timer);reject(new Error('SPLASH FAILED TO LOAD'))},{once:true});
  });
  splash.style.visibility='visible';
  cover.style.display='none';
  splash.srcdoc=preloadedHtml;
  await splashCompletion;
}
try{
  await coverPainted();
  const minimumHold=sleep(ICON_HOLD_MS);
  const splashReadyPromise=preloadSplash();
  const preparedViewerPromise=prepareViewer();
  const [preloadedSplash,preparedViewer]=await Promise.all([
    Promise.all([minimumHold,splashReadyPromise]).then(([,html])=>html),
    preparedViewerPromise
  ]);
  await runSplash(preloadedSplash);
  const loadingIcon=cover.querySelector('#gv-loading-mark>img');
  if(loadingIcon)loadingIcon.style.display='none';
  versionEl.style.display='none';
  cover.style.display='flex';
  const postSplashHold=sleep(POST_SPLASH_HOLD_MS);
  const viewerReadyPromise=initializeViewer(preparedViewer);
  await Promise.all([viewerReadyPromise,postSplashHold]);
  if(splash.isConnected)splash.remove();
  if(cover.isConnected)cover.remove();
}catch(error){console.error(error);fail(error)}
})();
</script>
</body>
</html>
