<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>GALAXY VIEWER 12O DIAGNOSTICS</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff}
#gvdiag{position:fixed;left:0;right:0;bottom:0;z-index:2147483647;box-sizing:border-box;padding:8px;background:#000;border-top:1px solid #58bfff;font:11px monospace;display:flex;gap:8px;align-items:center}
#status{flex:1;color:#9be5ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#download{height:44px;padding:0 12px;border:1px solid #78ffab;border-radius:5px;background:#081b3a;color:#fff;font:700 10px monospace}
#error{display:none;position:fixed;inset:0 0 61px 0;z-index:2147483646;margin:0;padding:14px;overflow:auto;background:#000;color:#ff9b7a;white-space:pre-wrap;font:11px/1.4 monospace}
</style>
</head>
<body>

<pre id="error"></pre>

<div id="gvdiag">
  <span id="status">12O DIAGNOSTICS · BOOTING</span>
  <button id="download">DOWNLOAD REPORT</button>
</div>

<script>
(()=>{
'use strict';

const VIEWER='GV-beta-0012O.py';
const VIEWER_URL='../../viewer/'+VIEWER;

const start=performance.now();
const events=[];
const errors=[];
const snapshots=[];

const status=document.getElementById('status');
const errorBox=document.getElementById('error');

const elapsed=()=>Math.round(performance.now()-start);

function safe(v){
  try{
    if(v instanceof Error)return {message:v.message,stack:v.stack||''};
    return JSON.parse(JSON.stringify(v));
  }catch(_){
    return String(v);
  }
}

function emit(type,detail={}){
  const item={
    at:new Date().toISOString(),
    elapsedMs:elapsed(),
    type:String(type),
    detail:safe(detail)
  };
  events.push(item);
  status.textContent=(item.elapsedMs/1000).toFixed(1)+'s · '+item.type;
  try{
    window.GalaxyViewerAndroid?.mark?.(String(type),JSON.stringify(item.detail));
  }catch(_){}
}

function err(type,e){
  const item={
    at:new Date().toISOString(),
    elapsedMs:elapsed(),
    type,
    message:String(e?.stack||e?.message||e)
  };
  errors.push(item);
  emit(type,item);
}

function snap(){
  let telemetry=null;
  try{telemetry=window.GalaxyRandomGalaxy?.getPrefetchTelemetry?.()||null}catch(e){}

  const s={
    at:new Date().toISOString(),
    elapsedMs:elapsed(),
    readyState:document.readyState,
    windowA:Boolean(window.A),
    aladinInitType:typeof window.A?.init,
    aladinApi:Boolean(window.aladin_cosmic_command_test),
    viewerCore:Boolean(window.GalaxyViewerCore),
    randomApi:Boolean(window.GalaxyRandomGalaxy),
    randomVersion:String(window.GalaxyRandomGalaxy?.VERSION||''),
    root:Boolean(document.getElementById('aladin-cosmic-command-test')),
    startupWait:Boolean(document.getElementById('gv-startup-wait')),
    canvasCount:document.querySelectorAll('#aladin-cosmic-command-test canvas').length,
    telemetry:safe(telemetry)
  };

  snapshots.push(s);

  if(s.canvasCount>0 && s.viewerCore && !window.__GV_ANALYTICS_STARTUP_READY__){
    window.__GV_ANALYTICS_STARTUP_READY__=true;
    emit('VIEWER_READY',s);
  }

  return s;
}

function nativeAudit(){
  try{
    const raw=window.GalaxyViewerNativeAudit?.getNativeAudit?.();
    if(!raw)return null;
    try{return JSON.parse(raw)}catch(_){return raw}
  }catch(e){
    return {error:String(e)};
  }
}

function report(reason){
  return {
    schema:'galaxy-viewer-12n-diagnostics',
    reason,
    exportedAt:new Date().toISOString(),
    elapsedMs:elapsed(),
    viewer:VIEWER,
    startupReady:Boolean(window.__GV_ANALYTICS_STARTUP_READY__),
    current:snap(),
    events,
    errors,
    snapshots,
    resources:performance.getEntriesByType('resource').map(r=>({
      name:r.name,
      initiatorType:r.initiatorType,
      durationMs:Math.round(r.duration),
      transferSize:Number(r.transferSize||0)
    })),
    nativeAudit:nativeAudit()
  };
}

async function saveReport(){
  const filename='Galaxy-Viewer-12O-Diagnostics-'+
    new Date().toISOString().replace(/[:.]/g,'-')+'.json';

  const json=JSON.stringify(report('MANUAL_BUTTON'),null,2);

  if(window.GalaxyViewerDownloads?.saveJson){
    window.GalaxyViewerDownloads.saveJson(filename,json);
    status.textContent='REPORT SAVED · '+filename;
    return;
  }

  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  status.textContent='REPORT DOWNLOADED · '+filename;
}

document.getElementById('download').onclick=()=>saveReport().catch(e=>err('REPORT_SAVE_FAILURE',e));

window.addEventListener('error',e=>{
  if(e.target && e.target!==window){
    err('RESOURCE_ERROR',(e.target.src||e.target.href||e.target.tagName||''));
  }else{
    err('JS_ERROR',e.error||e.message);
  }
},true);

window.addEventListener('unhandledrejection',e=>err('PROMISE_REJECTION',e.reason));

const nativeFetch=window.fetch.bind(window);

window.fetch=async(input,init)=>{
  const url=typeof input==='string'?input:String(input?.url||'');
  const t=performance.now();
  emit('FETCH_START',{url});
  try{
    const response=await nativeFetch(input,init);
    emit('FETCH_END',{
      url,
      status:response.status,
      ok:response.ok,
      durationMs:Math.round(performance.now()-t)
    });
    return response;
  }catch(e){
    err('FETCH_FAILURE',e);
    throw e;
  }
};

window.__GV_ANALYTICS_AUDIT__={
  version:'12O-DIAGNOSTICS-0001',
  emit,
  events,
  errors,
  snapshots,
  exportData:()=>report('API_EXPORT')
};

window.__GV_ANALYTICS_SAVE_NOW__=saveReport;

function mountHtml(html){
  const t=document.createElement('template');
  t.innerHTML=html;

  for(const node of [...t.content.childNodes]){
    if(node.nodeName==='SCRIPT'){
      const s=document.createElement('script');
      for(const a of [...node.attributes])s.setAttribute(a.name,a.value);
      s.textContent=node.textContent;
      document.body.appendChild(s);
    }else{
      document.body.appendChild(node);
    }
  }
}

async function launch(){
  emit('VIEWER_FETCH_START',{viewer:VIEWER});

  const response=await fetch(
    VIEWER_URL+'?diag='+Date.now(),
    {cache:'no-store'}
  );

  if(!response.ok)throw new Error('VIEWER HTTP '+response.status);

  const source=await response.text();

  emit('VIEWER_FETCH_END',{chars:source.length});

  const html=source.match(/display\(HTML\("""([\s\S]*?)"""\)\)/);
  const js=source.match(/display\(Javascript\(r?"""([\s\S]*?)"""\)\)/);

  if(!html)throw new Error('12O HTML EXTRACTION FAILED');
  if(!js)throw new Error('12O JAVASCRIPT EXTRACTION FAILED');

  emit('VIEWER_EXTRACTED',{
    htmlChars:html[1].length,
    jsChars:js[1].length
  });

  mountHtml(html[1]);

  const script=document.createElement('script');
  script.textContent=js[1];
  document.body.appendChild(script);

  emit('VIEWER_SCRIPT_MOUNTED');
}

setInterval(snap,1000);

setTimeout(()=>{
  if(!window.__GV_ANALYTICS_STARTUP_READY__){
    emit('STARTUP_NOT_READY_15S',snap());
  }
},15000);

launch().catch(e=>{
  err('LAUNCH_FAILURE',e);
  errorBox.style.display='block';
  errorBox.textContent='GALAXY VIEWER 12O STARTUP FAILURE\n\n'+String(e?.stack||e);
});

})();
</script>

</body>
</html>
