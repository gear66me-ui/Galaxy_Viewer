<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#061d45">
<title>GALAXY VIEWER ANALYTICS</title>
<script>
(() => {
  'use strict';
  const bootPerf=performance.now(),bootEpoch=Date.now();
  const events=[],resources=[],snapshots=[],errors=[];
  const MAX_EVENTS=20000,MAX_RESOURCES=20000,MAX_SNAPSHOTS=7200,MAX_ERRORS=1000;
  let saveIssued=false,savedFilename='',second=0;
  const elapsed=()=>Math.round(performance.now()-bootPerf);
  const trim=(a,max)=>{if(a.length>max)a.splice(0,a.length-max)};
  const safe=v=>{try{return typeof v==='string'?v:JSON.parse(JSON.stringify(v))}catch(_){return String(v)}};
  const emit=(type,detail={})=>{events.push({at:new Date().toISOString(),elapsedMs:elapsed(),type:String(type),detail:safe(detail)});trim(events,MAX_EVENTS)};
  const recordError=(type,value)=>{const message=value?.error?.stack||value?.reason?.stack||value?.message||value?.reason||value?.error||value;errors.push({at:new Date().toISOString(),elapsedMs:elapsed(),type:String(type),message:String(message||'UNKNOWN ERROR')});trim(errors,MAX_ERRORS)};
  const addResource=entry=>{resources.push({at:new Date().toISOString(),elapsedMs:elapsed(),name:String(entry.name||''),initiatorType:String(entry.initiatorType||''),durationMs:Math.round(Number(entry.duration||0)),transferSize:Number(entry.transferSize||0),encodedBodySize:Number(entry.encodedBodySize||0),decodedBodySize:Number(entry.decodedBodySize||0)});trim(resources,MAX_RESOURCES)};
  const compactUrl=value=>{try{const u=new URL(String(value||''),location.href);return `${u.host}${u.pathname}${u.search}`.slice(-320)}catch(_){return String(value||'').slice(-320)}};
  const core=()=>window.GalaxyViewerCore||window.GalaxyRandomGalaxy?.prefetchRuntime?.core||null;
  const telemetry=()=>{try{return window.GalaxyRandomGalaxy?.getPrefetchTelemetry?.()||null}catch(error){recordError('TELEMETRY',error);return null}};
  function queueState(){
    const c=core(),t=telemetry(),rows=Array.isArray(t?.rows)?t.rows:[];
    return rows.map((row,index)=>{
      const d=row?.destination||row||{};let prepared=null;
      try{prepared=c?.getHdPreparedResource?.(row?.key)||null}catch(error){recordError('HD_RESOURCE',error)}
      return {
        slot:Number(row?.slot||index+1),key:String(row?.key||d?.key||''),name:String(row?.bannerText||row?.name||d?.displayName||d?.designation||d?.name||''),
        provider:String(row?.provider||prepared?.provider||d?.provider||d?.imageType||''),
        hd:{state:String(row?.hd?.state||''),detail:String(row?.hd?.detail||''),url:String(prepared?.url||prepared?.src||d?.selectedImageUrl||d?.githubImageUrl||'')},
        aladin:{state:String(row?.aladin?.state||''),detail:String(row?.aladin?.detail||''),ra:d?.ra??null,dec:d?.dec??null,fov:d?.fieldOfView??d?.fov??null,rotation:d?.aladinRotation??d?.orientation??null},
        web:{state:String(row?.web?.state||''),detail:String(row?.web?.detail||''),url:String(d?.sourceUrl||d?.archiveUrl||'')},
        selectedImageUrl:String(d?.selectedImageUrl||''),githubImageUrl:String(d?.githubImageUrl||''),sourceUrl:String(d?.sourceUrl||'')
      };
    });
  }
  function imageState(){return [...document.images].slice(0,200).map((img,index)=>({index,id:String(img.id||''),alt:String(img.alt||''),src:compactUrl(img.currentSrc||img.src||''),complete:Boolean(img.complete),width:Number(img.naturalWidth||0),height:Number(img.naturalHeight||0),state:img.complete?(img.naturalWidth>0?'LOADED':'FAILED_OR_EMPTY'):'LOADING'}))}
  function snapshot(){
    const c=core(),t=telemetry(),random=c?.randomGalaxy?.getState?.()||{},queue=queueState();
    const s={at:new Date().toISOString(),elapsedMs:elapsed(),second,readyState:document.readyState,viewer:String(c?.displayVersion||''),randomVersion:String(window.GalaxyRandomGalaxy?.VERSION||''),viewerCore:Boolean(window.GalaxyViewerCore),randomApi:Boolean(window.GalaxyRandomGalaxy),diagnostics:Boolean(window.GalaxyViewerDiagnostics),mode:random.busy?'TRAVELING':random.hdOpen?'HD_OPEN':'READY',backgroundSuspended:Boolean(c?.getBackgroundWorkSuspended?.()||t?.suspended),future:queue.length,next:queue[0]?.name||'',active:String(t?.active?.bannerText||t?.active?.name||''),catalog:Number(c?.eligibleCatalogCount||0),queue,images:imageState(),canvasCount:document.querySelectorAll('canvas').length,aladinRoot:Boolean(document.getElementById('aladin-cosmic-command-test')),aladinCanvas:Boolean(document.querySelector('#aladin-cosmic-command-test canvas')),resourceCount:resources.length,eventCount:events.length};
    snapshots.push(s);trim(snapshots,MAX_SNAPSHOTS);return s;
  }
  function nativeAudit(){try{const raw=window.GalaxyViewerNativeAudit?.getNativeAudit?.();return raw?JSON.parse(raw):null}catch(error){recordError('NATIVE_AUDIT',error);return null}}
  function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}-${p(d.getSeconds())}`}
  function exportData(reason,extra={}){
    let diagnostics=null;try{diagnostics=window.GalaxyViewerDiagnostics?.exportData?.()||null}catch(error){recordError('DIAGNOSTICS_EXPORT',error)}
    return {module:'GalaxyViewerStartupAudit',version:'0002',reason:String(reason||'MANUAL'),startedAt:new Date(bootEpoch).toISOString(),exportedAt:new Date().toISOString(),elapsedMs:elapsed(),startupReady:Boolean(window.__GV_ANALYTICS_STARTUP_READY__),extra:safe(extra),events:[...events],resources:[...resources],snapshots:[...snapshots],errors:[...errors],diagnostics,nativeAudit:nativeAudit()};
  }
  async function saveNow(reason='MANUAL',extra={}){
    if(saveIssued)return savedFilename||'SAVE_ALREADY_REQUESTED';
    saveIssued=true;
    const filename=`Galaxy-Viewer-Startup-Audit-${stamp()}.json`;
    savedFilename=filename;
    emit('AUDIT_SAVE_BEGIN',{reason,filename});
    try{
      const bridge=window.GalaxyViewerDownloads;
      if(!bridge||typeof bridge.saveJson!=='function')throw new Error('NATIVE SAVE BRIDGE MISSING');
      const json=JSON.stringify(exportData(reason,extra),null,2);
      bridge.saveJson(filename,json);
      emit('AUDIT_SAVE_REQUESTED',{reason,filename,bytes:json.length});
      return filename;
    }catch(error){
      saveIssued=false;savedFilename='';recordError('AUDIT_SAVE',error);emit('AUDIT_SAVE_FAILED',{reason,error:String(error?.stack||error)});throw error;
    }
  }
  window.__GV_ANALYTICS_AUDIT__={version:'0002',startedAt:new Date(bootEpoch).toISOString(),bootEpoch,emit,events,resources,snapshots,errors,exportData:()=>exportData('EXPORT')};
  window.__GV_ANALYTICS_SAVE_NOW__=saveNow;
  emit('BOOT_SCRIPT_START',{href:location.href,userAgent:navigator.userAgent});
  try{new PerformanceObserver(list=>list.getEntries().forEach(addResource)).observe({type:'resource',buffered:true})}catch(error){recordError('PERFORMANCE_OBSERVER',error);emit('PERFORMANCE_OBSERVER_FAILED',{error:String(error)})}
  const nativeFetch=window.fetch.bind(window);
  window.fetch=async(input,init)=>{const url=typeof input==='string'?input:String(input?.url||'');const id=`f${elapsed()}-${Math.random().toString(36).slice(2,7)}`,started=performance.now();emit('FETCH_START',{id,url,method:String(init?.method||input?.method||'GET'),cache:String(init?.cache||'')});try{const response=await nativeFetch(input,init);emit('FETCH_END',{id,url,status:response.status,ok:response.ok,durationMs:Math.round(performance.now()-started),contentLength:response.headers.get('content-length')||''});return response}catch(error){recordError('FETCH',error);emit('FETCH_FAIL',{id,url,durationMs:Math.round(performance.now()-started),error:String(error?.stack||error)});throw error}};
  const XO=XMLHttpRequest.prototype.open,XS=XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open=function(method,url,...rest){this.__gvAudit={method:String(method),url:String(url),started:0};return XO.call(this,method,url,...rest)};
  XMLHttpRequest.prototype.send=function(...args){const a=this.__gvAudit||{method:'?',url:'?',started:0};a.started=performance.now();emit('XHR_START',{method:a.method,url:a.url});const done=type=>emit(type,{method:a.method,url:a.url,status:Number(this.status||0),durationMs:Math.round(performance.now()-a.started)});this.addEventListener('load',()=>done('XHR_END'),{once:true});this.addEventListener('error',()=>done('XHR_FAIL'),{once:true});this.addEventListener('timeout',()=>done('XHR_TIMEOUT'),{once:true});return XS.apply(this,args)};
  window.addEventListener('load',event=>{const t=event.target;if(t&&t!==window&&('src'in t||'href'in t))emit('RESOURCE_LOAD',{tag:t.tagName||'',url:String(t.currentSrc||t.src||t.href||'')})},true);
  window.addEventListener('error',event=>{const t=event.target;if(t&&t!==window&&('src'in t||'href'in t)){emit('RESOURCE_ERROR',{tag:t.tagName||'',url:String(t.currentSrc||t.src||t.href||'')})}else{recordError('JS_ERROR',event);emit('JS_ERROR',{message:String(event.message||event.error||''),source:String(event.filename||''),line:event.lineno||0,col:event.colno||0,stack:String(event.error?.stack||'')})}},true);
  window.addEventListener('unhandledrejection',event=>{recordError('PROMISE_REJECTION',event);emit('PROMISE_REJECTION',{reason:String(event.reason?.stack||event.reason||'')})});
  const originalError=console.error.bind(console),originalWarn=console.warn.bind(console);
  console.error=(...args)=>{emit('CONSOLE_ERROR',{args:args.map(safe)});originalError(...args)};
  console.warn=(...args)=>{emit('CONSOLE_WARN',{args:args.map(safe)});originalWarn(...args)};
  snapshot();
  setInterval(()=>{second++;const s=snapshot();emit('BOOT_HEARTBEAT',{second:s.second,readyState:s.readyState,viewerCore:s.viewerCore,random:s.randomApi,diagnostics:s.diagnostics,future:s.future,next:s.next,canvases:s.canvasCount,aladinRoot:s.aladinRoot,aladinCanvas:s.aladinCanvas,images:s.images.length})},1000);
  setTimeout(()=>{if(!window.__GV_ANALYTICS_STARTUP_READY__)saveNow('JS_FAILSAFE_50S',{message:'Startup not ready at 50 seconds'}).catch(()=>{})},50000);
  emit('BOOT_INSTRUMENTATION_READY');
})();
</script>
<style>
@font-face{font-family:"Space Age";src:url("../../viewer/artwork/Fonts/Space%20Age%20Regular/Space%20Age%20Regular.otf") format("opentype");font-style:normal;font-weight:400;font-display:block}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff}
#gv-cover{position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:linear-gradient(145deg,#020812,#061d45 55%,#0b4aa2)}
#gv-cover img{width:min(42vw,220px);height:min(42vw,220px);object-fit:contain}.title{font:400 18px "Space Age",sans-serif;color:#eaf8ff;letter-spacing:1px}.mode{font:700 12px monospace;color:#78ffab;letter-spacing:1.5px}.sub{font:10px monospace;color:#9be5ff}

<body>
<div id="gv-cover"><img src="../../viewer/artwork/icon.svg" alt="Galaxy Viewer"><div class="title">GALAXY VIEWER</div><div class="mode">ANALYTICS MODE · 12L</div><div class="sub">SECOND-BY-SECOND STARTUP AUDIT ACTIVE</div></div>
<iframe id="gv-splash" title="GALAXY VIEWER SPLASH"></iframe>
<div id="gv-error"><div id="gv-error-text"></div><button id="gv-save-audit">SAVE AUDIT NOW</button><div id="gv-save-status"></div></div>
<script>
(async()=>{
'use strict';
const A=window.__GV_ANALYTICS_AUDIT__,emit=A.emit,saveNow=window.__GV_ANALYTICS_SAVE_NOW__;
const VIEWER='GV-beta-0012L.py',VIEWER_URL='../../viewer/'+VIEWER,SPLASH_URL='../../viewer/releases/splash/Galaxy-Viewer-Singularity-FINAL/index.html',ICON_HOLD_MS=3000,POST_SPLASH_HOLD_MS=1000,VIEWER_TIMEOUT_MS=45000;
const cover=document.getElementById('gv-cover'),splash=document.getElementById('gv-splash'),errorBox=document.getElementById('gv-error'),errorText=document.getElementById('gv-error-text'),saveButton=document.getElementById('gv-save-audit'),saveStatus=document.getElementById('gv-save-status');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const text=async url=>{const response=await fetch(url+(url.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status+' '+url);return response.text()};
async function fail(error){emit('LAUNCH_FAIL',{error:String(error?.stack||error)});errorBox.style.display='block';errorText.textContent='GALAXY VIEWER ANALYTICS FAILED\n\n'+String(error?.stack||error);try{const f=await saveNow('LAUNCH_FAIL',{error:String(error?.stack||error)});saveStatus.textContent='AUDIT AUTO-SAVED: '+f}catch(saveError){saveStatus.textContent='AUTO-SAVE FAILED: '+String(saveError?.message||saveError)}}
saveButton.addEventListener('click',async()=>{saveStatus.textContent='SAVING AUDIT...';try{const f=await saveNow('MANUAL_FAILURE_SCREEN');saveStatus.textContent='AUDIT SAVED: '+f}catch(error){saveStatus.textContent='SAVE FAILED: '+String(error?.message||error)}});
function installCatalogImagePolicy(){const wrapped=window.fetch.bind(window);window.fetch=async(input,init)=>{const raw=typeof input==='string'?input:String(input?.url||'');const response=await wrapped(input,init);if(!/gv-hubble-galaxies-full-\d+\.json(?:[?#]|$)/i.test(raw)||!response.ok)return response;emit('CATALOG_POLICY_APPLY',{url:raw});const payload=await response.clone().json();if(Array.isArray(payload?.entries))payload.entries=payload.entries.map(entry=>{if(!entry||typeof entry!=='object')return entry;const candidates=Array.isArray(entry.jpegCandidates)?entry.jpegCandidates.map(v=>String(v||'').trim()).filter(Boolean):[];const screen=candidates.find(url=>/\/archives\/images\/screen\//i.test(url));return screen?{...entry,selectedImageUrl:screen,githubImageUrl:''}:entry});const headers=new Headers(response.headers);headers.delete('content-length');headers.delete('content-encoding');headers.set('content-type','application/json; charset=utf-8');return new Response(JSON.stringify(payload),{status:response.status,statusText:response.statusText,headers})}}
function mountHtml(html){const template=document.createElement('template');template.innerHTML=html;for(const node of [...template.content.childNodes]){if(node.nodeName==='SCRIPT'){const script=document.createElement('script');for(const attr of [...node.attributes])script.setAttribute(attr.name,attr.value);script.textContent=node.textContent;document.body.appendChild(script)}else document.body.appendChild(node)}}
async function prepareViewer(){emit('VIEWER_PREPARE_START',{viewer:VIEWER,url:VIEWER_URL});const source=await text(VIEWER_URL);emit('VIEWER_SOURCE_RECEIVED',{viewer:VIEWER,chars:source.length});const htmlMatch=source.match(/display\(HTML\(\"\"\"([\s\S]*?)\"\"\"\)\)/);const jsMatches=[...source.matchAll(/display\(Javascript\(r?\"\"\"([\s\S]*?)\"\"\"\)\)/g)];if(!htmlMatch||!jsMatches.length)throw new Error('ANALYTICS VIEWER EXTRACTION FAILED: '+VIEWER);emit('VIEWER_EXTRACTED',{htmlChars:htmlMatch[1].length,scripts:jsMatches.length});return{viewer:VIEWER,html:htmlMatch[1],scripts:jsMatches.map(m=>m[1])}}
async function initializeViewer(p){emit('VIEWER_INITIALIZE_START',{viewer:p.viewer});installCatalogImagePolicy();mountHtml(p.html);for(const [index,source] of p.scripts.entries()){emit('VIEWER_INLINE_SCRIPT_START',{index,chars:source.length});const script=document.createElement('script');script.textContent=source;document.body.appendChild(script);emit('VIEWER_INLINE_SCRIPT_MOUNTED',{index})}const started=performance.now();while(performance.now()-started<VIEWER_TIMEOUT_MS){const root=document.getElementById('aladin-cosmic-command-test');if(root?.querySelector('canvas')){emit('VIEWER_CANVAS_READY',{durationMs:Math.round(performance.now()-started)});return p.viewer}await sleep(1000);emit('VIEWER_WAIT_SECOND',{seconds:Math.floor((performance.now()-started)/1000),root:Boolean(root),canvas:Boolean(root?.querySelector('canvas')),core:Boolean(window.GalaxyViewerCore),random:Boolean(window.GalaxyRandomGalaxy),diag:Boolean(window.GalaxyViewerDiagnostics)})}throw new Error('ANALYTICS VIEWER STARTUP TIMEOUT: '+p.viewer)}
function splashAssets(html){const base=new URL(SPLASH_URL,location.href),doc=new DOMParser().parseFromString(html,'text/html'),urls=new Set();for(const n of doc.querySelectorAll('[src]')){const r=n.getAttribute('src');if(r&&!r.startsWith('data:')&&!r.startsWith('blob:'))urls.add(new URL(r,base).href)}for(const n of doc.querySelectorAll('link[href]')){const r=n.getAttribute('href');if(r&&!r.startsWith('data:')&&!r.startsWith('blob:'))urls.add(new URL(r,base).href)}for(const m of html.matchAll(/url\((['\"]?)(.*?)\1\)/gi)){const r=String(m[2]||'').trim();if(r&&!r.startsWith('data:')&&!r.startsWith('blob:'))urls.add(new URL(r,base).href)}return[...urls]}
async function preloadSplash(){emit('SPLASH_PRELOAD_START');const response=await fetch(SPLASH_URL,{cache:'reload'});if(!response.ok)throw new Error('HTTP '+response.status+' '+SPLASH_URL);const html=await response.text(),assets=splashAssets(html);emit('SPLASH_ASSETS_FOUND',{count:assets.length});await Promise.all(assets.map(async url=>{const r=await fetch(url,{cache:'reload'});if(!r.ok)throw new Error('HTTP '+r.status+' '+url);await r.arrayBuffer()}));const baseHref=new URL('./',new URL(SPLASH_URL,location.href)).href,tag='<base href="'+baseHref+'">';emit('SPLASH_PRELOAD_END',{count:assets.length});return /<head(?:\s[^>]*)?>/i.test(html)?html.replace(/<head(\s[^>]*)?>/i,m=>m+tag):tag+html}
async function runSplash(html){emit('SPLASH_RUN_START');const done=new Promise((resolve,reject)=>{let settled=false;const timer=setTimeout(()=>{if(!settled){settled=true;reject(new Error('SPLASH COMPLETION TIMEOUT'))}},30000);splash.addEventListener('load',()=>{try{const w=splash.contentWindow;if(!w)throw new Error('SPLASH WINDOW UNAVAILABLE');w.addEventListener('galaxy-splash-complete',()=>{if(!settled){settled=true;clearTimeout(timer);emit('SPLASH_COMPLETE');resolve()}},{once:true})}catch(e){clearTimeout(timer);reject(e)}},{once:true});splash.addEventListener('error',()=>{clearTimeout(timer);reject(new Error('SPLASH FAILED TO LOAD'))},{once:true})});splash.style.visibility='visible';cover.style.display='none';splash.srcdoc=html;await done}
try{emit('ANALYTICS_LAUNCH_START',{viewer:VIEWER});const minimum=sleep(ICON_HOLD_MS),sp=preloadSplash(),vp=prepareViewer();const [splashHtml,viewer]=await Promise.all([Promise.all([minimum,sp]).then(([,h])=>h),vp]);emit('PRELOAD_PHASE_COMPLETE');await runSplash(splashHtml);cover.style.display='flex';cover.querySelector('img').style.display='none';cover.querySelector('.title').style.display='none';cover.querySelector('.mode').textContent='ANALYTICS MODE · INITIALIZING 12L';const viewerReady=initializeViewer(viewer);await Promise.all([viewerReady,sleep(POST_SPLASH_HOLD_MS)]);window.__GV_ANALYTICS_STARTUP_READY__=true;try{window.GalaxyViewerNativeAudit?.startupReady?.()}catch(_){}emit('ANALYTICS_LAUNCH_READY');if(splash.isConnected)splash.remove();if(cover.isConnected)cover.remove()}catch(error){console.error(error);await fail(error)}
})();
</script>
