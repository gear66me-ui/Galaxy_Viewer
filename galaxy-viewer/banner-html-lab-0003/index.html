<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#010308">
<title>Galaxy Viewer — HTML Banner Lab 0003</title>
<style>
@font-face{
  font-family:"Space Age";
  src:url("../../viewer/releases/splash/Galaxy-Viewer-Singularity-FINAL/Space-Age.otf") format("opentype");
  font-display:swap;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#010308}
body{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:10px;
  overflow:hidden;
  font-family:"Space Age",sans-serif;
  background:#010308;
}
.banner{
  position:relative;
  width:min(1536px,calc(100vw - 10px));
  aspect-ratio:1536/315;
  min-height:132px;
  overflow:hidden;
  isolation:isolate;
  border-radius:30px;
  background:
    radial-gradient(ellipse at 78% 50%,rgba(15,40,72,.18),transparent 35%),
    linear-gradient(180deg,#02060d 0%,#010409 55%,#010307 100%);
  border:1px solid rgba(126,170,205,.32);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.035),
    inset 0 0 48px rgba(0,0,0,.45),
    0 22px 65px rgba(0,0,0,.56),
    0 0 18px rgba(40,103,190,.08);
}

/* Pure CSS star field replacing the text-contaminated left/center raster area */
.stars,.stars:before,.stars:after{
  position:absolute;
  inset:0;
  content:"";
  z-index:0;
  pointer-events:none;
}
.stars{
  opacity:.90;
  background:
    radial-gradient(circle at 4% 30%,rgba(255,255,255,.90) 0 1px,transparent 1.35px),
    radial-gradient(circle at 9% 72%,rgba(139,190,237,.72) 0 .8px,transparent 1.2px),
    radial-gradient(circle at 15% 14%,rgba(255,255,255,.76) 0 .7px,transparent 1.1px),
    radial-gradient(circle at 22% 55%,rgba(190,218,244,.72) 0 .9px,transparent 1.25px),
    radial-gradient(circle at 28% 29%,rgba(255,255,255,.68) 0 .7px,transparent 1.1px),
    radial-gradient(circle at 35% 74%,rgba(116,177,234,.66) 0 .8px,transparent 1.2px),
    radial-gradient(circle at 41% 12%,rgba(255,255,255,.80) 0 .9px,transparent 1.25px),
    radial-gradient(circle at 47% 62%,rgba(177,211,242,.62) 0 .7px,transparent 1.1px),
    radial-gradient(circle at 53% 35%,rgba(255,255,255,.62) 0 .75px,transparent 1.1px),
    radial-gradient(circle at 60% 82%,rgba(128,184,235,.56) 0 .7px,transparent 1.1px);
}
.stars:before{
  opacity:.42;
  background:
    repeating-radial-gradient(circle at 12% 20%,rgba(255,255,255,.75) 0 .55px,transparent .8px 19px),
    repeating-radial-gradient(circle at 47% 68%,rgba(100,170,235,.56) 0 .45px,transparent .75px 27px);
  background-size:233px 173px,311px 211px;
}
.stars:after{
  opacity:.30;
  filter:blur(12px);
  background:
    radial-gradient(ellipse at 18% 58%,rgba(22,74,136,.34),transparent 28%),
    radial-gradient(ellipse at 49% 42%,rgba(27,82,151,.24),transparent 24%);
}

/* Preserve the real right-side galaxy artwork only.
   The old baked-in GALAXY VIEWER lettering never enters the visible region. */
.galaxy-window{
  position:absolute;
  z-index:1;
  top:0;
  right:0;
  width:47%;
  height:100%;
  overflow:hidden;
  pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.20) 9%,#000 27%,#000 100%);
  mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.20) 9%,#000 27%,#000 100%);
}
.galaxy-art{
  position:absolute;
  top:0;
  right:0;
  width:213%;
  height:100%;
  object-fit:cover;
  object-position:right center;
  filter:brightness(.86) saturate(.90) contrast(1.06);
}

/* Dark blend over the transition: CSS only, no old text visible */
.clean-blend{
  position:absolute;
  z-index:2;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(90deg,
      rgba(1,3,8,.08) 0%,
      rgba(1,3,8,.02) 50%,
      rgba(1,3,8,.00) 67%,
      rgba(1,3,8,.02) 100%),
    radial-gradient(ellipse at 63% 52%,rgba(16,78,164,.08),transparent 20%);
}

/* Exact Space Age font used by the FINAL splash */
.title{
  position:absolute;
  z-index:5;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:82%;
  margin:0;
  text-align:center;
  font-family:"Space Age",sans-serif;
  font-weight:400;
  line-height:.80;
  letter-spacing:.018em;
  color:#67b8ff;
  white-space:nowrap;
  -webkit-text-stroke:clamp(1.4px,.34vw,5px) #176fd1;
  paint-order:stroke fill;
  text-shadow:
    0 0 2px rgba(183,226,255,.90),
    0 0 7px rgba(72,165,255,.94),
    0 0 16px rgba(32,118,255,.82),
    0 0 31px rgba(18,84,219,.52),
    0 0 54px rgba(10,51,164,.30);
}
.title span{
  display:block;
  font-size:clamp(46px,6.65vw,102px);
}
.brand-x{
  position:relative;
  display:inline-block !important;
  width:.72em;
  height:.88em;
  margin:0 .015em;
  vertical-align:-.06em;
}
.brand-x .x-arc{
  position:absolute;
  left:50%;
  width:.54em;
  height:.28em;
  transform:translateX(-50%);
  border:.085em solid currentColor;
  border-left-color:transparent;
  border-right-color:transparent;
  border-radius:50%;
  filter:
    drop-shadow(0 0 .025em rgba(183,226,255,.95))
    drop-shadow(0 0 .075em rgba(72,165,255,.92))
    drop-shadow(0 0 .16em rgba(32,118,255,.70));
}
.brand-x .x-top{
  top:.08em;
  border-bottom-color:currentColor;
  transform:translateX(-50%) rotate(180deg);
}
.brand-x .x-bottom{
  bottom:.06em;
  border-bottom-color:currentColor;
}
.brand-x .x-dot{
  position:absolute;
  left:50%;
  top:50%;
  width:.16em;
  height:.16em;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:currentColor;
  box-shadow:
    0 0 .03em rgba(255,255,255,.95),
    0 0 .10em rgba(72,165,255,.95),
    0 0 .20em rgba(32,118,255,.78);
}

/* very subtle blue aura behind title, not a second copy */
.title-glow{
  position:absolute;
  z-index:4;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:64%;
  height:64%;
  border-radius:50%;
  pointer-events:none;
  filter:blur(24px);
  background:radial-gradient(ellipse,rgba(25,103,229,.16) 0%,rgba(9,56,164,.07) 45%,transparent 72%);
}

.edge{
  position:absolute;
  inset:0;
  z-index:7;
  pointer-events:none;
  border-radius:inherit;
  box-shadow:inset 0 0 34px rgba(0,0,0,.34);
}

@media(max-width:700px){
  body{padding:4px}
  .banner{width:calc(100vw - 6px);min-height:112px;border-radius:20px}
  .galaxy-window{width:49%}
  .title{width:90%}
  .title span{font-size:clamp(34px,10.2vw,67px)}
  .title-glow{width:76%;height:72%}
}
</style>
</head>
