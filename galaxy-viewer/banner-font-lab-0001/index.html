<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020407">
<title>Galaxy Viewer — Banner Font Lab 0001</title>
<style>
@font-face{
  font-family:"Space Age";
  src:url("../../viewer/releases/splash/Galaxy-Viewer-Singularity-FINAL/Space-Age.otf") format("opentype");
  font-display:swap;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#020407}
body{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:18px;
  overflow:hidden;
  font-family:"Space Age",sans-serif;
  background:
    radial-gradient(circle at 50% 35%,rgba(20,37,52,.25),transparent 38rem),
    #020407;
}
.banner{
  position:relative;
  width:min(1536px,calc(100vw - 18px));
  aspect-ratio:1536/315;
  min-height:150px;
  overflow:hidden;
  border-radius:28px;
  background:#010306;
  border:1px solid rgba(154,190,210,.22);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.05),
    inset 0 0 46px rgba(0,0,0,.26),
    0 26px 70px rgba(0,0,0,.52);
}
.art{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center 51%;
  filter:brightness(.62) saturate(.78) contrast(1.08);
  transform:scale(1.02);
}
.banner::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:1;
  background:
    linear-gradient(90deg,rgba(0,3,7,.78) 0%,rgba(0,3,7,.47) 36%,rgba(0,3,7,.10) 68%,rgba(0,3,7,.18) 100%),
    linear-gradient(180deg,rgba(0,0,0,.14),transparent 42%,rgba(0,0,0,.34));
}
.banner::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
  border-radius:inherit;
  box-shadow:inset 0 0 38px rgba(0,0,0,.38);
}
.title{
  position:absolute;
  z-index:2;
  left:11%;
  top:50%;
  transform:translateY(-50%);
  margin:0;
  width:55%;
  color:#fff;
  text-align:left;
  font-weight:400;
  font-size:clamp(46px,7.2vw,112px);
  line-height:.78;
  letter-spacing:.01em;
  text-shadow:
    0 0 4px rgba(255,255,255,.72),
    0 0 10px rgba(11,61,255,.55),
    0 0 22px rgba(0,70,255,.34);
  -webkit-text-stroke:clamp(1.5px,.58vw,8px) #0b3dff;
  paint-order:stroke fill;
}
.title span{display:block}
@media(max-width:700px){
  body{padding:6px}
  .banner{width:calc(100vw - 8px);min-height:110px;border-radius:18px}
  .title{left:8%;width:62%;font-size:clamp(34px,10vw,66px)}
}
</style>
</head>
<body>
  <section class="banner" aria-label="Galaxy Viewer banner prototype">
    <img class="art"
      src="../../viewer/releases/splash/Galaxy-Viewer-Singularity-FINAL/Galaxy-Splash.png"
      alt="">
    <h1 class="title"><span>GALAXY</span><span>VIEWER</span></h1>
  </section>
</body>
</html>
