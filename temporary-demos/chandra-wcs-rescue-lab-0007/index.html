 $('miniName').textContent=current.name;
 $('miniSaved').textContent=saved[current.key]?.verified?'✓':'';
 $('progress').textContent=(idx+1)+' / '+queue.length+' · VERIFIED '+Object.values(saved).filter(x=>x&&x.verified).length;
 $('diag').textContent='Loading image once…';
 clearGuides();
 try{
   const probe=saved[current.key]?.raster;
   current._wcs=wcsFor(current,Number(probe?.width||1024),Number(probe?.height||1024),p);
   currentRaster=await loadSoftImage(current.image);
   current._wcs=wcsFor(current,currentRaster[0],currentRaster[1],p);
   await establishPreview(true);
 }catch(e){$('diag').textContent='ERROR: '+e.message}
}

function commitSoft(){
 if(!current||!currentRaster||!baseRefScreen)return;
 const p=state(current),sign=rotationScreenSign();
 const S=softMatrix();
 const finalRef=applyM(S,baseRefScreen[0],baseRefScreen[1]);
 const world=aladin.pix2world(finalRef[0],finalRef[1],'ICRSd');
 const newRa=Number(world?.[0]),newDec=Number(world?.[1]);
 if(!Number.isFinite(newRa)||!Number.isFinite(newDec)){ $('diag').textContent='REGISTER FAILED: could not convert screen position to sky';return; }
 const [ra0,dec0]=baseReference(current);
 const cosd=Math.max(.05,Math.abs(Math.cos(dec0*Math.PI/180)));
 p.raOff=raDelta(newRa,ra0)*cosd*60;
 p.decOff=(newDec-dec0)*60;
 p.rotation=norm180(Number(p.rotation||0)+soft.rot*sign);
 p.scalePct=Math.max(.1,Math.min(200,Number(p.scalePct||100)*soft.scale));
 persistParams(p);setControls(current,p);
 soft={dx:0,dy:0,rot:0,scale:1};
 const wcs=wcsFor(current,currentRaster[0],currentRaster[1],p);current._wcs=wcs;
 const q=buildBaseMatrix(wcs,currentRaster[0],currentRaster[1]);baseMatrix=q.M;baseRefScreen=q.ref;
 renderSoft();
 $('diag').textContent='COORDINATES REGISTERED · RAoff '+p.raOff.toFixed(4)+'′ · DECoff '+p.decOff.toFixed(4)+'′ · rot '+signText(p.rotation)+' · scale '+p.scalePct.toFixed(1)+'%';
}

function svgSize(){
 const svg=$('guideSvg'),r=svg.getBoundingClientRect();
 svg.setAttribute('viewBox','0 0 '+Math.max(1,r.width)+' '+Math.max(1,r.height));
 return {w:r.width,h:r.height};
}
function clearGuides(){$('axisGuide').innerHTML='';$('rotGuide').innerHTML=''}
function esc(t){return String(t).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function lineSvg(x1,y1,x2,y2,color,marker,label,lx,ly){
 return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+color+'" stroke-width="3" marker-end="url(#'+marker+')" />'+
 '<text x="'+lx+'" y="'+ly+'" fill="'+color+'" font-size="13" font-weight="900" paint-order="stroke" stroke="#00101a" stroke-width="3">'+esc(label)+'</text>';
}
function arcPath(cx,cy,r,a0,a1){
 const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
 return 'M '+x0+' '+y0+' A '+r+' '+r+' 0 0 '+(a1>a0?1:0)+' '+x1+' '+y1;
}
function drawGuides(){
 if(!current||!current._wcs)return;
 const {w,h}=svgSize(),v=screenAxisVectors();if(!v)return;
 const ax=Math.min(92,Math.max(76,w*.14)),ay=Math.min(Math.max(145,h*.30),h-85),L=46;
 let axis='<rect x="'+(ax-66)+'" y="'+(ay-66)+'" width="132" height="132" rx="12" fill="rgba(2,12,22,.62)" stroke="rgba(85,205,255,.6)" />';
 if(v.ra){
  axis+=lineSvg(ax,ay,ax+v.ra[0]*L,ay+v.ra[1]*L,'#ff55dc','arrowMagenta','RA+',ax+v.ra[0]*(L+10)-10,ay+v.ra[1]*(L+10)-5);
  axis+=lineSvg(ax,ay,ax-v.ra[0]*L,ay-v.ra[1]*L,'#a93893','arrowMagentaDim','RA−',ax-v.ra[0]*(L+18)-10,ay-v.ra[1]*(L+18)-5);
 }
 if(v.dec){
  axis+=lineSvg(ax,ay,ax+v.dec[0]*L,ay+v.dec[1]*L,'#54ddff','arrowCyan','DEC+',ax+v.dec[0]*(L+16)-14,ay+v.dec[1]*(L+16)-5);
  axis+=lineSvg(ax,ay,ax-v.dec[0]*L,ay-v.dec[1]*L,'#267d9c','arrowCyanDim','DEC−',ax-v.dec[0]*(L+20)-14,ay-v.dec[1]*(L+20)-5);
 }
 axis+='<circle cx="'+ax+'" cy="'+ay+'" r="3" fill="#fff"/>';$('axisGuide').innerHTML=axis;
 const sign=rotationScreenSign(),rx=w-82,ry=Math.min(Math.max(145,h*.30),h-85),r=39;
 let rot='<rect x="'+(rx-66)+'" y="'+(ry-66)+'" width="132" height="132" rx="12" fill="rgba(2,12,22,.62)" stroke="rgba(85,205,255,.6)" />';
 if(sign>0){
  rot+='<path d="'+arcPath(rx,ry,r,-2.45,-.55)+'" fill="none" stroke="#62ff9c" stroke-width="3" marker-end="url(#arrowGreen)"/><text x="'+(rx-52)+'" y="'+(ry-48)+'" fill="#62ff9c" font-size="12" font-weight="900">ROT+ CW</text>';
 }else{
  rot+='<path d="'+arcPath(rx,ry,r,2.45,.55)+'" fill="none" stroke="#62ff9c" stroke-width="3" marker-end="url(#arrowGreen)"/><text x="'+(rx-58)+'" y="'+(ry-48)+'" fill="#62ff9c" font-size="12" font-weight="900">ROT+ CCW</text>';
 }
 rot+='<text x="'+rx+'" y="'+(ry+4)+'" fill="#fff" font-size="12" font-weight="900" text-anchor="middle">SOFT '+signText(soft.rot)+'</text>';$('rotGuide').innerHTML=rot;
}

// Instant local controls: no Aladin rebuild, no image reload.
$('opacity').oninput=()=>{$('opv').textContent=$('opacity').value+'%';renderSoft()};
$('rot').oninput=()=>{
 const p=state(current),desired=unsignedToSigned(Number($('rot').value)),delta=norm180(desired-Number(p.rotation||0));
 soft.rot=delta*rotationScreenSign();
 $('rotv').textContent=Number($('rot').value).toFixed(1)+'° (= '+signText(desired)+')';renderSoft();
};
$('scale').oninput=()=>{
 const p=state(current),desired=Number($('scale').value);
 soft.scale=Math.max(.001,desired/Math.max(.1,Number(p.scalePct||100)));
 $('scalev').textContent=desired.toFixed(1)+'%';renderSoft();
};
$('rotMinus').onclick=()=>{soft.rot-=rotationStep()*rotationScreenSign();const p=state(current),d=norm180(Number(p.rotation||0)+soft.rot*rotationScreenSign());$('rot').value=signedToUnsigned(d);$('rotv').textContent=signedToUnsigned(d).toFixed(1)+'° (= '+signText(d)+')';renderSoft()};
$('rotPlus').onclick=()=>{soft.rot+=rotationStep()*rotationScreenSign();const p=state(current),d=norm180(Number(p.rotation||0)+soft.rot*rotationScreenSign());$('rot').value=signedToUnsigned(d);$('rotv').textContent=signedToUnsigned(d).toFixed(1)+'° (= '+signText(d)+')';renderSoft()};
function softNudge(axis,sgn){
 const v=screenAxisVectors();if(!v||!v[axis])return;
 const px=positionStepPx();soft.dx+=v[axis][0]*px*sgn;soft.dy+=v[axis][1]*px*sgn;renderSoft();
}
$('raMinus').onclick=()=>softNudge('ra',-1);$('raPlus').onclick=()=>softNudge('ra',1);$('decMinus').onclick=()=>softNudge('dec',-1);$('decPlus').onclick=()=>softNudge('dec',1);
$('step').onclick=()=>{stepFine=!stepFine;$('step').textContent=stepFine?'FINE':'COARSE'};
$('flipX').onclick=()=>{const p=state(current);p.flipX=!p.flipX;persistParams(p);setControls(current,p);soft={dx:0,dy:0,rot:0,scale:1};establishPreview(false)};
$('flipY').onclick=()=>{const p=state(current);p.flipY=!p.flipY;persistParams(p);setControls(current,p);soft={dx:0,dy:0,rot:0,scale:1};establishPreview(false)};
$('register').onclick=commitSoft;

// Direct drag on Chandra image.
$('softImage').addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,dx:soft.dx,dy:soft.dy};$('softImage').setPointerCapture(e.pointerId);e.preventDefault()});
$('softImage').addEventListener('pointermove',e=>{if(!drag)return;soft.dx=drag.dx+(e.clientX-drag.x);soft.dy=drag.dy+(e.clientY-drag.y);renderSoft();e.preventDefault()});
function endDrag(){drag=null}
$('softImage').addEventListener('pointerup',endDrag);$('softImage').addEventListener('pointercancel',endDrag);

let resetArmedUntil=0,resetArmTimer=null;
$('reset').onclick=()=>{
 if(!current)return;
 const now=Date.now();
 if(now<resetArmedUntil){
  clearTimeout(resetArmTimer);resetArmedUntil=0;$('reset').classList.remove('armed');$('reset').textContent='RESET CURRENT';
  saved[current.key]={params:defaults(current)};localStorage.setItem(KEY,JSON.stringify(saved));
  soft={dx:0,dy:0,rot:0,scale:1};setControls(current,defaults(current));establishPreview(true);return;
 }
 resetArmedUntil=now+3000;$('reset').classList.add('armed');$('reset').textContent='TAP AGAIN TO RESET';
 clearTimeout(resetArmTimer);resetArmTimer=setTimeout(()=>{resetArmedUntil=0;$('reset').classList.remove('armed');$('reset').textContent='RESET CURRENT'},3000);
};
$('save').onclick=()=>{
 if(!current||!current._wcs||!currentRaster)return;
 if(Math.abs(soft.dx)>.01||Math.abs(soft.dy)>.01||Math.abs(soft.rot)>.001||Math.abs(soft.scale-1)>.0001)commitSoft();
 const p=state(current),wcs=wcsFor(current,currentRaster[0],currentRaster[1],p);current._wcs=wcs;
 saved[current.key]={params:Object.assign({},p),wcs:Object.assign({},wcs),raster:{width:currentRaster[0],height:currentRaster[1]},savedAt:new Date().toISOString(),verified:true};
 localStorage.setItem(KEY,JSON.stringify(saved));show(idx+1);
};
$('prev').onclick=()=>show(idx-1);$('next').onclick=()=>show(idx+1);
$('export').onclick=()=>{
 const out={version:'0007',generatedAt:new Date().toISOString(),queueCount:queue.length,solutions:saved,queue:queue.map(c=>({key:c.key,imageId:c.imageId,name:c.name,mode:c.mode,publishedFovArcmin:c.publishedFovArcmin,center:c.center,image:c.image,sourceUrl:c.sourceUrl}))};
 const b=new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='gv-chandra-wcs-rescue-solutions-0007.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};

let viewportSyncTimer=null;
function syncViewportSoon(){
 clearTimeout(viewportSyncTimer);
 viewportSyncTimer=setTimeout(()=>{if(current?._wcs&&currentRaster)establishPreview(false)},180);
}
window.addEventListener('resize',syncViewportSoon);
try{
 if(typeof aladin.on==='function'){
   aladin.on('positionChanged',syncViewportSoon);
   aladin.on('zoomChanged',syncViewportSoon);
 }
}catch(_){}
let start=queue.findIndex(c=>!saved[c.key]?.verified);if(start<0)start=0;
show(start);
})().catch(e=>{document.getElementById('miniName').textContent='LAB ERROR';document.getElementById('diag').textContent='FATAL: '+(e?.message||e)});
</script></body></html>
