<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galaxy Explorer — WWT</title>
<script src="https://web.wwtassets.org/engine/7/wwtsdk.js"></script>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#070b14;color:#edf4ff;font:16px/1.45 system-ui,sans-serif}header{padding:14px 16px;background:#10192b;border-bottom:1px solid #28354b}h1{font-size:1.25rem;margin:0 0 4px}p{margin:0;color:#aebbd0;font-size:.92rem}main{padding:12px;max-width:1200px;margin:auto}#status{padding:10px 12px;margin-bottom:10px;border:1px solid #30415a;border-radius:8px;background:#10192b;overflow-wrap:anywhere}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 10px}button{background:#68b7ff;color:#07111e;border:0;border-radius:9px;padding:12px 18px;font-size:1rem;font-weight:700}button:disabled{opacity:.45}#target{color:#e4edff}#wwtcanvas{height:min(72vh,760px);min-height:340px;width:100%;background:#000;border:1px solid #40506b;border-radius:8px;overflow:hidden}.note{margin-top:10px;color:#9aa9bf;font-size:.82rem}</style></head>
<body><header><h1>Galaxy Explorer</h1><p>WorldWide Telescope imagery · Random galaxy travel</p></header><main><div id="status" role="status">Loading WorldWide Telescope SDK…</div><div class="controls"><button id="random" disabled>Random Galaxy</button><span id="target">Waiting for WWT…</span></div><div id="wwtcanvas" aria-label="WorldWide Telescope interactive sky"></div><p class="note">WWT supplies the sky imagery. Starter destinations are well-known galaxies; this is not yet a complete index of every WWT place.</p></main>
<script>
(function(){
const status=document.getElementById('status'),button=document.getElementById('random'),targetLabel=document.getElementById('target');const say=s=>status.textContent=s;
const galaxies=[
{name:'Andromeda Galaxy (M31)',ra:10.6847,dec:41.2690,zoom:.65},{name:'Whirlpool Galaxy (M51)',ra:202.4696,dec:47.1952,zoom:.22},{name:'Pinwheel Galaxy (M101)',ra:210.8023,dec:54.3489,zoom:.22},{name:'Sombrero Galaxy (M104)',ra:189.9975,dec:-11.6231,zoom:.16},{name:'Centaurus A (NGC 5128)',ra:201.3651,dec:-43.0191,zoom:.25},{name:'Triangulum Galaxy (M33)',ra:23.4621,dec:30.6602,zoom:.38},{name:'Bode’s Galaxy (M81)',ra:148.8882,dec:69.0653,zoom:.20},{name:'Cigar Galaxy (M82)',ra:148.9685,dec:69.6797,zoom:.10},{name:'Sculptor Galaxy (NGC 253)',ra:11.8880,dec:-25.2884,zoom:.20},{name:'Southern Pinwheel (M83)',ra:204.2539,dec:-29.8658,zoom:.20},{name:'Leo Triplet (M66)',ra:170.0625,dec:12.9915,zoom:.10},{name:'NGC 1300',ra:49.9200,dec:-19.4117,zoom:.08},{name:'NGC 1365',ra:53.4017,dec:-36.1404,zoom:.12},{name:'M87',ra:187.7059,dec:12.3911,zoom:.10},{name:'Antennae Galaxies (NGC 4038/4039)',ra:180.4709,dec:-18.8677,zoom:.10},{name:'NGC 4565',ra:189.0866,dec:25.9877,zoom:.10},{name:'NGC 6946',ra:308.7181,dec:60.1539,zoom:.12}];
let wwt=null,previous=-1,busy=false;
function travel(){if(!wwt||busy)return;let i;do{i=Math.floor(Math.random()*galaxies.length)}while(i===previous);previous=i;const g=galaxies[i];busy=true;button.disabled=true;targetLabel.textContent='Travelling to '+g.name+'…';say('Zooming out before travelling to '+g.name+'.');try{wwt.zoom(8);setTimeout(()=>{try{wwt.gotoRADecZoom(g.ra,g.dec,60,false);setTimeout(()=>{try{wwt.gotoRADecZoom(g.ra,g.dec,g.zoom,false);targetLabel.textContent=g.name;say('Arrived at '+g.name+'. Press Random Galaxy to travel again.')}catch(e){say('Arrival zoom failed: '+e.message)}busy=false;button.disabled=false},1600)}catch(e){say('Sky travel failed: '+e.message);busy=false;button.disabled=false}},500)}catch(e){say('Zoom-out failed: '+e.message);busy=false;button.disabled=false}}
function start(){if(!window.wwtlib||!wwtlib.WWTControlBuilder){say('ERROR: WWT SDK did not load. Check access to web.wwtassets.org.');return}try{const builder=new wwtlib.WWTControlBuilder('wwtcanvas');builder.startRenderLoop(true);const si=builder.create();si.add_ready(()=>{wwt=wwtlib.WWTControl.singleton;say('WWT is ready. Built-in sky imagery should now be visible.');button.disabled=false;targetLabel.textContent='Ready · '+galaxies.length+' starter destinations';wwt.gotoRADecZoom(10.6847,41.2690,60,false)});setTimeout(()=>{if(!wwt)say('WWT is still initializing. If the viewport remains black, check network access and WebGL.')},15000)}catch(e){say('WWT initialization error: '+(e&&e.message?e.message:String(e)))}}
button.addEventListener('click',travel);window.addEventListener('error',e=>{if(e.message)say('Browser error: '+e.message)});if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script></body></html>
