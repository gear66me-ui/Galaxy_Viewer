","sourceUrl":"http://chandra.harvard.edu/photo/2026/galaxies/","center":[178.20583333333335,44.120777777777775],"mode":"seed","publishedFovArcmin":12},{"key":"847","imageId":"847","name":"Guitar Nebula","image":"https://www.astropix.org/archive/chandra/847/chandra_847_1024.jpg","sourceUrl":"http://chandra.harvard.edu/photo/2024/guitar/","center":[336.46816666666666,65.59271944444444],"mode":"seed","publishedFovArcmin":2.6},{"key":"838p","imageId":"838p","name":"Hb 5 Nebula","image":"https://www.astropix.org/archive/chandra/838p/chandra_838p_1024.jpg","sourceUrl":"http://chandra.harvard.edu/photo/2024/25th/","center":[266.9845833333333,29.994472222222225],"mode":"seed","publishedFovArcmin":1.04},{"key":"813","imageId":"813","name":"SN1006","image":"https://www.astropix.org/archive/chandra/813/chandra_813_1024.jpg","sourceUrl":"http://chandra.harvard.edu/photo/2023/sn1006/","center":[225.712,-41.9235667],"mode":"seed","publishedFovArcmin":34},{"key":"797","imageId":"797","name":"Tycho's Supernova Remnant","image":"https://www.astropix.org/archive/chandra/797/chandra_797_1024.jpg","sourceUrl":"http://chandra.harvard.edu/photo/2023/tycho/","center":[6.320833333333334,64.14361111111111],"mode":"seed","publishedFovArcmin":16},{"key":"429","imageId":"429","name":"RCW 86","image":"https://www.astropix.org/archive/chandra/429/chandra_429_1024.jpg","sourceUrl":"http://chandra.harvard.edu/photo/2009/rcw86/","center":[220.1875,-62.666667],"mode":"seed","publishedFovArcmin":6},{"key":"heart-2026","imageId":"heart-2026","name":"Cocoon Nebula · IC 5146","image":"https://www.chandra.harvard.edu/photo/2026/heart/heart.jpg","sourceUrl":"https://www.chandra.harvard.edu/photo/2026/heart/","center":[328.3695833333333,47.27111388888889],"mode":"seed","publishedFovArcmin":23},{"key":"spring-w2","imageId":"spring-w2","name":"Westerlund 2","image":"https://chandra.harvard.edu/photo/2026/spring/spring_westerlund2.jpg","sourceUrl":"https://chandra.harvard.edu/photo/2026/spring/","center":[15 const KEY='gv-chandra-wcs-rescue-lab-0001';
const $=id=>document.getElementById(id);
let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){}
let idx=0,layer=null,currentRaster=null,current=null,stepFine=true,serial=0;
await A.init;
const aladin=A.aladin('#aladin',{survey:'P/DSS2/color',target:'0 +0',fov:1,cooFrame:'ICRS',projection:'TAN',showReticle:true,showGotoControl:false,showZoomControl:true,showFullscreenControl:true,showLayersControl:true,showCooGridControl:true,showProjectionControl:false});

function defaults(c){
 if(c.mode==='full')return {rotation:Number(c.avm.rotation||0),scalePct:100,raOff:0,decOff:0,flipX:false,flipY:false,mode:'full'};
 return {rotation:0,scalePct:100,raOff:0,decOff:0,flipX:false,flipY:false,mode:'seed'};
}
function state(c){return Object.assign(defaults(c),saved[c.key]?.params||{})}
function imageSize(url){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok([im.naturalWidth,im.naturalHeight]);im.onerror=()=>no(new Error('IMAGE LOAD FAILED'));im.src=url+(url.includes('?')?'&':'?')+'wcsrescue=0001'})}
function fullWcs(c,w,h){
 const a=c.avm,rd=a.referenceDimension,rp=a.referencePixel,sc=a.scale,rx=w/rd[0],ry=h/rd[1],t=Number(a.rotation||0)*Math.PI/180,co=Math.cos(t),si=Math.sin(t),sx=sc[0]/rx,sy=sc[1]/ry;
 return {NAXIS:2,NAXIS1:w,NAXIS2:h,CTYPE1:'RA---'+(a.projection||'TAN'),CTYPE2:'DEC--'+(a.projection||'TAN'),CUNIT1:'deg',CUNIT2:'deg',EQUINOX:2000,CRVAL1:a.referenceValue[0],CRVAL2:a.referenceValue[1],CRPIX1:rp[0]*rx,CRPIX2:rp[1]*ry,CD1_1:sx*co,CD1_2:-sy*si,CD2_1:sx*si,CD2_2:sy*co};
}
function seedWcs(c,w,h,p){
 const base=c.publishedFovArcmin/60,fx=base*(p.scalePct/100),fy=fx*(h/w),dec0=c.center[1],cosd=Math.max(.05,Math.cos(dec0*Math.PI/180));
 const ra=c.center[0]+p.raOff/(60*cosd),dec=dec0+p.decOff/60,t=p.rotation*Math.PI/180,co=Math.cos(t),si=Math.sin(t);
 const sx=(p.flipX?1:-1)*(fx/w),sy=(p.flipY?-1:1)*(fy/h);
 return {NAXIS:2,NAXIS1:w,NAXIS2:h,CTYPE1:'RA---TAN',CTYPE2:'DEC--TAN',CUNIT1:'deg',CUNIT2:'deg',EQUINOX:2000,CRVAL1:ra,CRVAL2:dec,CRPIX1:(w+1)/2,CRPIX2:(h+1)/2,CD1_1:sx*co,CD1_2:-sy*si,CD2_1:sx*si,CD2_2:sy*co};
}
function fovOf(wcs,w,h){const sx=Math.hypot(wcs.CD1_1,wcs.CD2_1),sy=Math.hypot(wcs.CD1_2,wcs.CD2_2);return Math.max(sx*w,sy*h)*1.18}
function setControls(c,p){
 $('rot').value=p.rotation;$('rotv').textContent=Number(p.rotation).toFixed(1)+'°';$('scale').value=p.scalePct;$('scalev').textContent=Number(p.scalePct).toFixed(1)+'%';
 const seeded=c.mode==='seed';['rot','scale','raMinus','raPlus','decMinus','decPlus','step','flipX','flipY','reset'].forEach(id=>$(id).classList.toggle('disabled',!seeded));
 $('flipX').classList.toggle('active',!!p.flipX);$('flipY').classList.toggle('active',!!p.flipY);$('step').textContent=stepFine?'FINE':'COARSE';
}
async function rebuild(){
 const s=++serial,c=current;if(!c||!currentRaster)return;const [w,h]=currentRaster,p=state(c),wcs=c.mode==='full'?fullWcs(c,w,h):seedWcs(c,w,h,p);
 if(layer){try{layer.setOpacity(0)}catch(_){}}
 layer=A.image(c.image,{name:'CHANDRA WCS RESCUE',imgFormat:'jpg',wcs,opacity:Number($('opacity').value)/100});
 aladin.setOverlayImageLayer(layer,'CHANDRA WCS RESCUE');if(s!==serial)return;
 aladin.gotoRaDec(wcs.CRVAL1,wcs.CRVAL2);aladin.setFoV(fovOf(wcs,w,h));
 $('diag').textContent=(c.mode==='full'?'RECOVERED AVM WCS':'SEEDED FROM CHANDRA CENTER + PUBLISHED '+c.publishedFovArcmin+'′ FOV')+' · raster '+w+'×'+h+' · RAoff '+p.raOff.toFixed(3)+'′ · DECoff '+p.decOff.toFixed(3)+'′';
 current._wcs=wcs;
}
async function show(n){
 idx=(n+queue.length)%queue.length;current=queue[idx];currentRaster=null;if(layer){try{layer.setOpacity(0)}catch(_){}layer=null}
 const p=state(current);setControls(current,p);$('title').innerHTML=(idx+1)+'. '+current.name+' <span class="badge '+(current.mode==='full'?'full':'seed')+'">'+(current.mode==='full'?'RECOVERED FULL WCS':'WCS RESCUE SEED')+'</span>';
 $('meta').textContent='Chandra '+current.imageId+' · '+(current.mode==='full'?'metadata complete':'published center + '+current.publishedFovArcmin+' arcmin scale')+' · '+current.sourceUrl;
 $('progress').textContent=(idx+1)+' / '+queue.length+' · SAVED '+Object.keys(saved).length;
 $('diag').textContent='Loading image…';
 try{currentRaster=await imageSize(current.image);await rebuild()}catch(e){$('diag').textContent='ERROR: '+e.message}
}
function persistParams(){
 if(!current||current.mode!=='seed')return;
 saved[current.key]=saved[current.key]||{};saved[current.key].params=state(current);localStorage.setItem(KEY,JSON.stringify(saved));
}
function updateSeed(mut){
 if(!current||current.mode!=='seed')return;let p=state(current);mut(p);saved[current.key]=saved[current.key]||{};saved[current.key].params=p;localStorage.setItem(KEY,JSON.stringify(saved));setControls(current,p);rebuild();
}
$('opacity').oninput=()=>{$('opv').textContent=$('opacity').value+'%';if(layer?.setOpacity)layer.setOpacity(Number($('opacity').value)/100)};
$('rot').oninput=()=>{$('rotv').textContent=Number($('rot').value).toFixed(1)+'°'};$('rot').onchange=()=>updateSeed(p=>p.rotation=Number($('rot').value));
$('scale').oninput=()=>{$('scalev').textContent=Number($('scale').value).toFixed(1)+'%'};$('scale').onchange=()=>updateSeed(p=>p.scalePct=Number($('scale').value));
function nudge(which,sign){if(!current||current.mode!=='seed')return;const step=(current.publishedFovArcmin||1)*(stepFine?.002:.01);updateSeed(p=>p[which]+=sign*step)}
$('raMinus').onclick=()=>nudge('raOff',-1);$('raPlus').onclick=()=>nudge('raOff',1);$('decMinus').onclick=()=>nudge('decOff',-1);$('decPlus').onclick=()=>nudge('decOff',1);
$('step').onclick=()=>{stepFine=!stepFine;$('step').textContent=stepFine?'FINE':'COARSE'};
$('flipX').onclick=()=>updateSeed(p=>p.flipX=!p.flipX);$('flipY').onclick=()=>updateSeed(p=>p.flipY=!p.flipY);
$('reset').onclick=()=>{if(!current||current.mode!=='seed')return;delete saved[current.key];localStorage.setItem(KEY,JSON.stringify(saved));setControls(current,defaults(current));rebuild()};
$('save').onclick=()=>{if(!current||!current._wcs)return;const p=state(current);saved[current.key]={params:p,wcs:current._wcs,raster:{width:currentRaster[0],height:currentRaster[1]},savedAt:new Date().toISOString(),verified:true};localStorage.setItem(KEY,JSON.stringify(saved));$('progress').textContent=(idx+1)+' / '+queue.length+' · SAVED '+Object.keys(saved).length;show(idx+1)};
$('prev').onclick=()=>show(idx-1);$('next').onclick=()=>show(idx+1);
$('export').onclick=()=>{const out={version:'0001',generatedAt:new Date().toISOString(),queueCount:queue.length,solutions:saved,queue:queue.map(c=>({key:c.key,imageId:c.imageId,name:c.name,mode:c.mode,publishedFovArcmin:c.publishedFovArcmin,center:c.center,image:c.image,sourceUrl:c.sourceUrl}))};const b=new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='gv-chandra-wcs-rescue-solutions-0001.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
show(0);
})().catch(e=>{document.getElementById('title').textContent='WCS RESCUE LAB ERROR';document.getElementById('diag').textContent='FATAL: '+(e?.message||e)});
