<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GV Browser Row 1</title>
<style>
@font-face{font-family:"Space Age";src:url("../../viewer/artwork/Fonts/Space Age Regular/Space Age Regular.otf") format("opentype");font-style:normal;font-weight:400;font-display:block}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
body{padding:12px;background:#000}
.gv-row{height:36px;width:100%;display:grid;grid-template-columns:36px minmax(0,1fr) 36px;gap:2px}
.gv-tile{position:relative;height:36px;min-height:36px;max-height:36px;margin:0;border:1px solid #7CCBFF;border-radius:6px;background:linear-gradient(145deg,#081B3A 0%,#0B3177 48%,#123F86 72%,#296DBD 100%);color:#DDF8FF;box-shadow:inset 0 2px 2px rgba(225,251,255,.82),inset 0 -3px 5px rgba(0,0,0,.52),inset 0 0 13px rgba(41,153,255,.34),0 0 3px #DDF8FF,0 0 9px rgba(50,190,255,.72),0 0 18px rgba(20,116,219,.35);overflow:hidden}
.gv-tile::before{content:"";position:absolute;inset:2px;border-radius:6px;pointer-events:none;z-index:1;opacity:1;background:linear-gradient(145deg,rgba(8,27,58,.28),rgba(20,132,219,.10));box-shadow:inset 0 0 0 1px rgba(124,203,255,.34),inset 0 0 7px rgba(88,191,255,.20),inset 0 0 11px rgba(41,109,189,.16)}
.gv-icon{display:flex;align-items:center;justify-content:center;padding:2px}
.gv-icon img{position:relative;z-index:2;display:block;width:30px;height:30px;object-fit:contain}
.gv-title{display:flex;align-items:center;justify-content:center;padding:0 10px;font:400 12px/1.15 "Space Age",sans-serif;letter-spacing:.55px;text-shadow:0 0 2px rgba(234,248,255,.58);white-space:nowrap;text-align:center}
.gv-title span{position:relative;z-index:2}
.gv-provider{display:flex;align-items:center;justify-content:center;padding:2px}
.gv-provider img{position:relative;z-index:2;display:block;width:30px;height:30px;object-fit:cover;border-radius:4px}
</style></head><body>
<div class="gv-row">
 <div class="gv-tile gv-icon"><img src="../../viewer/artwork/icon.svg" alt="Galaxy Viewer"></div>
 <div class="gv-tile gv-title"><span>GALAXY WEB BROWSER</span></div>
 <div class="gv-tile gv-provider"><img src="../../viewer/artwork/Chandra/Chandra.jpg" alt="Chandra"></div>
</div>
</body></html>
