<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Galaxy Viewer Web Browser — 0002 Visual Calibration</title>
<style>
@font-face{font-family:SpaceAge;src:url('../../viewer/artwork/Fonts/Space Age Regular/Space Age Regular.otf') format('opentype');font-display:swap}
:root{
 --cyan:#72ecff; --cyan2:#1bc9ff; --blue:#063b91; --deep:#010817;
 --outer:clamp(10px,3.0vw,24px); --gap:clamp(8px,1.45vh,17px);
 --header-h:5.7vh; --nav-h:6.0vh; --footer-h:6.5vh;
 --r:clamp(14px,2.6vw,25px); --stroke:clamp(1.5px,.32vw,3px);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#effcff}
body{font-family:SpaceAge,Arial,sans-serif;background:
 radial-gradient(circle at 52% 34%,rgba(16,92,167,.15),transparent 35%),
 linear-gradient(rgba(0,6,20,.72),rgba(0,2,9,.88)),
 url('../../viewer/artwork/Splash/Galaxy Splash Ibis NO NAME.png') center/cover fixed}
.shell{height:100dvh;padding:var(--outer);display:grid;grid-template-rows:var(--header-h) var(--nav-h) minmax(0,1fr) var(--footer-h);gap:var(--gap)}
.neon{border:var(--stroke) solid var(--cyan);border-radius:var(--r);background:linear-gradient(110deg,rgba(3,25,72,.96),rgba(7,76,164,.86) 55%,rgba(3,22,65,.96));box-shadow:0 0 5px #c9fbff,0 0 13px rgba(44,214,255,.76),inset 0 0 12px rgba(35,174,255,.34)}
.header{display:grid;grid-template-columns:minmax(0,1fr) var(--header-h);gap:clamp(7px,1.3vw,12px)}
.title{display:grid;place-items:center;min-width:0;padding:.25em .65em;font-size:clamp(15px,3.35vw,32px);letter-spacing:.07em;white-space:nowrap;text-shadow:0 0 7px rgba(110,231,255,.75)}
.icon-tile{display:grid;place-items:center;padding:7%}
.icon-tile img{width:86%;height:86%;object-fit:contain;filter:drop-shadow(0 0 6px rgba(73,220,255,.7))}
.nav{display:grid;grid-template-columns:calc(var(--nav-h) - 10px) calc(var(--nav-h) - 10px) minmax(0,1fr) calc(var(--nav-h) - 10px);gap:clamp(6px,1.2vw,11px);padding:5px 7px;align-items:center}
.control{height:100%;aspect-ratio:1;display:grid;place-items:center;border:1.5px solid var(--cyan);border-radius:calc(var(--r)*.7);background:linear-gradient(135deg,#031c4d,#0757b4 60%,#087dc8);box-shadow:0 0 7px rgba(66,221,255,.55),inset 0 0 9px rgba(75,215,255,.2);padding:0}
.control svg{width:48%;height:48%;overflow:visible;stroke:#e9fdff;stroke-width:11;fill:none;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px #72ecff)}
.address{height:100%;min-width:0;border:1.5px solid #38bce8;border-radius:calc(var(--r)*.68);display:grid;grid-template-columns:34px minmax(0,1fr);align-items:center;background:linear-gradient(180deg,#041533,#010711);box-shadow:inset 0 0 12px rgba(0,0,0,.9),0 0 5px rgba(36,188,244,.4)}
.lock{display:grid;place-items:center}
.lock svg{width:20px;height:25px;fill:var(--cyan);filter:drop-shadow(0 0 3px #36d9ff)}
.url{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:Arial,sans-serif;font-size:clamp(13px,2.6vw,25px);letter-spacing:.015em;color:#eefbff;padding-right:10px}
.viewport-frame{min-height:0;padding:5px;border:var(--stroke) solid var(--cyan);border-radius:var(--r);background:linear-gradient(145deg,#062c6d,#001127 20%,#001127 80%,#06447f);box-shadow:0 0 6px #aef8ff,0 0 16px rgba(27,207,255,.72),inset 0 0 12px rgba(33,188,255,.42)}
.viewport-inner{width:100%;height:100%;overflow:hidden;border:1px solid #179fce;border-radius:calc(var(--r) - 5px);background:#03070d;position:relative}
.viewport-demo{height:100%;overflow:hidden;background:linear-gradient(155deg,#02050b,#041629 58%,#02050b);font-family:Arial,sans-serif;position:relative}
.viewport-demo:before{content:"REAL WEBVIEW OCCUPIES THIS EXACT RECTANGLE";position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:25px;color:#a8edff;font-family:SpaceAge,Arial,sans-serif;font-size:clamp(18px,4vw,38px);letter-spacing:.07em;background:radial-gradient(circle at 67% 32%,rgba(21,112,180,.27),transparent 28%)}
.footer{position:relative;overflow:hidden;display:grid;grid-template-columns:var(--footer-h) minmax(0,1fr) var(--footer-h);align-items:center;padding:5px 7px;background:
 linear-gradient(90deg,rgba(1,35,87,.68),rgba(6,82,158,.57),rgba(1,27,72,.7)),
 url('../../viewer/artwork/Splash/Galaxy Splash Ibis NO NAME.png') center 56%/cover}
.footer .control{height:calc(var(--footer-h) - 12px);justify-self:start}
.footer-text{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:70%;text-align:center;font-size:clamp(14px,3.1vw,29px);letter-spacing:.08em;text-shadow:0 0 8px #54ddff;white-space:nowrap}
.footer-icon{grid-column:3;display:grid;place-items:center;height:100%}
.footer-icon img{width:74%;height:74%;object-fit:contain;filter:drop-shadow(0 0 7px #43d9ff)}
@media(max-width:380px){:root{--outer:8px;--gap:7px}.title{font-size:13px;letter-spacing:.045em}.nav{gap:5px;padding-left:5px;padding-right:5px}.address{grid-template-columns:28px 1fr}.url{font-size:12px}.footer-text{font-size:13px}}
</style>
</head>
<body>
<main class="shell" id="gvwb-shell">
 <header class="header" data-audit="HEADER: thin title + real Galaxy Viewer icon; no hamburger; no blank tile">
  <div class="title neon">GALAXY VIEW WEB BROWSER</div>
  <div class="icon-tile neon"><img src="../../viewer/artwork/icon.svg" alt="Galaxy Viewer"></div>
 </header>

 <nav class="nav neon" data-audit="BROWSER: identical square controls; vector chevrons; locked ellipsized URL; refresh; no menu">
  <button class="control" aria-label="Back"><svg viewBox="0 0 100 100"><path d="M62 18 L30 50 L62 82"/></svg></button>
  <button class="control" aria-label="Random website / Forward"><svg viewBox="0 0 100 100"><path d="M38 18 L70 50 L38 82"/></svg></button>
  <div class="address">
   <span class="lock"><svg viewBox="0 0 24 30"><path d="M5 12V8a7 7 0 0 1 14 0v4h2v16H3V12h2zm3 0h8V8a4 4 0 0 0-8 0v4z"/></svg></span>
   <span class="url">https://www.nasa.gov/galaxies/example/source/page/that-ellipsizes-cleanly</span>
  </div>
  <button class="control" aria-label="Refresh"><svg viewBox="0 0 100 100"><path d="M72 32 A30 30 0 1 0 78 62"/><path d="M72 12 V34 H50"/></svg></button>
 </nav>

 <section class="viewport-frame" data-audit="WEBVIEW: dominant flexible region; 5px structural frame; no debug/status band">
  <div class="viewport-inner"><div class="viewport-demo"></div></div>
 </section>

 <footer class="footer neon" data-audit="FOOTER: one cohesive thin artwork panel; exact same back chevron path as top; independently centered text; real icon">
  <button class="control" aria-label="Back to viewer"><svg viewBox="0 0 100 100"><path d="M62 18 L30 50 L62 82"/></svg></button>
  <div class="footer-text">BACK TO VIEWER</div>
  <div class="footer-icon"><img src="../../viewer/artwork/icon.svg" alt=""></div>
 </footer>
</main>
<script>
/* 0002 CALIBRATION CONTRACT:
   This page intentionally contains NO production navigation/catalog JS.
   It freezes shell geometry for visual approval before APK rebuild.
   Top-back and footer-back use the exact same SVG path:
   M62 18 L30 50 L62 82
   Forward is its mathematical mirror:
   M38 18 L70 50 L38 82
*/
document.querySelectorAll('.control').forEach(b=>b.addEventListener('click',e=>e.preventDefault()));
</script>
</body>
</html>
