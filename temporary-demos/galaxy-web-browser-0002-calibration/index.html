<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Galaxy Web Browser — Header Calibration</title>
<style>
@font-face{font-family:"GV Space Age";src:url("../../viewer/artwork/Fonts/Space Age Regular/Space Age Regular.otf") format("opentype");font-display:swap}
:root{--cyan:#7CCBFF;--ice:#DDF8FF}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:var(--ice);overflow:hidden}
body{padding:10px 9px;font-family:"GV Space Age",sans-serif}
.gv-top{width:100%;height:66px;display:grid;grid-template-columns:66px minmax(0,1fr) 66px;gap:4px}
.gv-tile{position:relative;overflow:hidden;border:1px solid #7CCBFF;border-radius:6px;background:linear-gradient(145deg,#081B3A 0%,#0B3177 44%,#123F86 70%,#296DBD 100%);box-shadow:inset 0 2px 2px rgba(225,251,255,.82),inset 0 -3px 5px rgba(0,0,0,.52),inset 0 0 13px rgba(41,153,255,.34),0 0 3px #DDF8FF,0 0 9px rgba(50,190,255,.72),0 0 18px rgba(20,116,219,.35)}
.gv-tile::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:5px;background:linear-gradient(180deg,rgba(255,255,255,.30) 0%,rgba(210,245,255,.13) 13%,rgba(255,255,255,.025) 43%,rgba(255,255,255,0) 58%);mix-blend-mode:screen}
.gv-tile::after{content:"";position:absolute;left:5%;right:5%;top:3px;height:34%;z-index:4;pointer-events:none;border-radius:5px 5px 45% 45%/4px 4px 22% 22%;background:linear-gradient(180deg,rgba(240,253,255,.26),rgba(124,203,255,.055) 70%,transparent)}
.gv-icon{display:grid;place-items:center;padding:5px}
.gv-icon img{position:relative;z-index:2;width:100%;height:100%;object-fit:contain}
.gv-title{display:grid;place-items:center;min-width:0;padding:0 8px;text-align:center;font-family:"GV Space Age",sans-serif;font-size:clamp(14px,3.55vw,24px);font-weight:400;letter-spacing:.65px;color:#DDF8FF;text-shadow:0 0 4px rgba(124,203,255,.42);white-space:nowrap}
.gv-provider{display:grid;place-items:center;padding:5px}
.gv-provider img{position:relative;z-index:2;width:100%;height:100%;object-fit:cover;border-radius:4px}
@media(max-width:390px){body{padding-left:7px;padding-right:7px}.gv-top{height:58px;grid-template-columns:58px minmax(0,1fr) 58px;gap:4px}.gv-title{font-size:13px;letter-spacing:.45px}.gv-icon,.gv-provider{padding:4px}}
</style>
</head>
<body>
<header class="gv-top" aria-label="Galaxy Web Browser header calibration">
  <div class="gv-tile gv-icon"><img src="../../viewer/artwork/icon.svg" alt="Galaxy Viewer"></div>
  <div class="gv-tile gv-title">GALAXY WEB BROWSER</div>
  <div class="gv-tile gv-provider"><img src="../../viewer/artwork/Chandra/Chandra.jpg" alt="Chandra"></div>
</header>
</body>
</html>
