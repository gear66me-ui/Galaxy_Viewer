<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GV Gate 2F</title>
<link rel="stylesheet" href="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.min.css"><script src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#080b12;color:#fff;font-family:system-ui}.app{width:min(1180px,98vw);margin:10px auto}.stage{display:grid;grid-template-columns:minmax(190px,1fr) minmax(360px,430px) minmax(190px,1fr);gap:10px;align-items:start}.side{min-height:520px;overflow:auto}.center{min-width:0}@media(max-width:800px){.stage{grid-template-columns:1fr}.side{min-height:0}}#wrap{position:relative;height:520px;border:1px solid #556;border-radius:8px;overflow:hidden}#aladin{position:absolute;inset:0}#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.row{display:none}.vctl{position:absolute;top:58px;bottom:58px;z-index:20;display:flex;flex-direction:column;align-items:center;gap:5px;padding:5px;background:#111927cc;border:1px solid #39465b;border-radius:8px}.vctl.left{left:5px}.vctl.right{right:5px}.vctl input{writing-mode:vertical-lr;direction:rtl;width:28px;height:100%}.vctl output{font:10px monospace;writing-mode:vertical-rl}.opctl{display:grid;grid-template-columns:58px 1fr 48px;gap:7px;align-items:center;margin:8px 0}.opctl input{width:100%}button{padding:8px 12px}.modebtn{background:#fff;color:#111;border:2px solid #aaa;border-radius:6px}.modebtn.active{background:#22c55e;color:#06130a;border-color:#78ffab;font-weight:800}.top{display:flex;gap:8px;align-items:center}.top b{flex:1}.mono{font:11px monospace;background:#111927;border:1px solid #39465b;padding:8px;border-radius:7px;white-space:pre-wrap}h1{font-size:15px;margin:8px 0}</style></head>
<body><div class="app"><h1>Gate 2F — JSON / WCS Decode</h1><div class="top"><b id="name">Loading catalog…</b><button id="random">Random Image</button></div><div class="top"><button id="jsonload" class="modebtn active">JSON LOAD</button><button id="wcsload" class="modebtn">WCS DECODE LOAD</button></div><div class="stage"><pre id="wcspanel" class="mono side">WCS decoded data…</pre><div class="center"><div id="wrap"><div id="aladin"></div><canvas id="ov"></canvas><label class="vctl left"><b>ROT</b><input id="rot" type="range" min="-180" max="180" step=".01" value="0"><output id="rotv">0°</output></label><label class="vctl right"><b>FoV</b><input id="fov" type="range" min="-6" max="6" step=".001" value="0"><output id="fovv">—</output></label></div>
<div class="opctl"><b>IMAGE</b><input id="opacity" type="range" min="0" max="100" step="1" value="55"><output id="opv">55%</output></div>
<div id="read" class="mono">Initializing…</div><button id="download">DOWNLOAD SETTINGS</button></div><pre id="jsonpanel" class="mono side">JSON decoded data…</pre></div></div><script>
const CAT="https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/beta/viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0001.json";
let aladin,layer,rows=[],rec,imgW=1,imgH=1,baseFov=1,serial=0,currentBlob=null,currentMode='JSON',lastDecoded=null;
function n(v){v=Number(v);return Number.isFinite(v)?v:null}
function geom(r){let fx=n(r.fovXDegrees??r.fovDegrees),fy=n(r.fovYDegrees??r.fovDegrees),rot=n(r.aladinRotation??r.spatialRotationDeg),ra=n(r.ra),dec=n(r.dec);return {ra,dec,fx,fy,rot}}
function usable(r){let g=geom(r);return !!r.imageUrl&&[g.ra,g.dec,g.fx,g.fy,g.rot].every(Number.isFinite)&&g.fx>0&&g.fy>0}
function cd(){let g=geom(rec),sx=g.fx/imgW,sy=g.fy/imgH,t=g.rot*Math.PI/180,c=Math.cos(t),s=Math.sin(t);return{a:-sx*c,b:-sy*s,c:-sx*s,d:sy*c}}
function W(){let g=geom(rec),m=cd();return{NAXIS:2,CTYPE1:"RA---TAN",CTYPE2:"DEC--TAN",EQUINOX:2000,LONPOLE:180,CUNIT1:"deg",CUNIT2:"deg",CRVAL1:g.ra,CRVAL2:g.dec,CRPIX1:(imgW+1)/2,CRPIX2:(imgH+1)/2,CD1_1:m.a,CD1_2:m.b,CD2_1:m.c,CD2_2:m.d,NAXIS1:imgW,NAXIS2:imgH}}
function sky(x,y){let g=geom(rec),m=cd(),dx=x-(imgW+1)/2,dy=y-(imgH+1)/2,e=m.a*dx+m.b*dy,no=m.c*dx+m.d*dy;return[g.ra+e/Math.cos(g.dec*Math.PI/180),g.dec+no]}
function P(x,y){let q=sky(x,y);return aladin.world2pix(q[0],q[1])}
function draw(){if(!rec)return;let cv=document.getElementById("ov"),r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);let c=cv.getContext("2d");c.setTransform(d,0,0,d,0,0);let a=P(.5,.5),b=P(imgW+.5,.5),e=P(imgW+.5,imgH+.5),f=P(.5,imgH+.5),l=P(.5,(imgH+1)/2),rr=P(imgW+.5,(imgH+1)/2),t=P((imgW+1)/2,.5),bb=P((imgW+1)/2,imgH+.5);c.strokeStyle="#78ffab";c.lineWidth=2;c.beginPath();c.moveTo(...a);c.lineTo(...b);c.lineTo(...e);c.lineTo(...f);c.closePath();c.stroke();c.lineWidth=1.5;c.beginPath();c.moveTo(...l);c.lineTo(...rr);c.moveTo(...t);c.lineTo(...bb);c.stroke()}
function paintMode(){let j=document.getElementById("jsonload"),w=document.getElementById("wcsload");if(!j||!w)return;j.classList.toggle("active",currentMode==="JSON");w.classList.toggle("active",currentMode==="WCS DECODE")}
function panels(){if(!rec)return;document.getElementById("jsonpanel").textContent="JSON RUNTIME RECORD\n\n"+JSON.stringify(rec,null,2);document.getElementById("wcspanel").textContent="JPEG EMBEDDED WCS / AVM\n\n"+(lastDecoded?JSON.stringify(lastDecoded,null,2):"Not decoded yet / unavailable")}
function info(s="READY"){paintMode();panels();let g=geom(rec),q=aladin.getRaDec(),f=aladin.getFov();document.getElementById("read").textContent=s+" ["+currentMode+"]\n"+rec.providerKey+" — "+rec.name+"\nJPEG "+imgW+" × "+imgH+" | WCS FoV "+g.fx+" × "+g.fy+"° | WCS Rot "+g.rot+"°\nALADIN RA/Dec "+q[0]+" / "+q[1]+" | FoV "+f[0]+" × "+f[1]+"° | Rot "+aladin.getRotation();draw()}
async function load(r){let token=++serial;rec=r;let g=geom(r);document.getElementById("name").textContent=r.providerKey+" — "+r.name;document.getElementById("read").textContent="FETCHING IMAGE…";let resp=await fetch(r.imageUrl,{mode:"cors",credentials:"omit",cache:"no-store"});if(!resp.ok)throw Error("HTTP "+resp.status);let blob=await resp.blob();currentBlob=blob;let bmp=await createImageBitmap(blob);if(token!==serial)return;imgW=bmp.width;imgH=bmp.height;bmp.close();try{aladin.removeImageLayer?.("GATE2C_IMAGE")}catch(e){}let u=URL.createObjectURL(blob);currentMode="JSON";layer=A.image(u,{name:"GATE2C_IMAGE",imgFormat:"jpeg",wcs:W(),opacity:+document.getElementById("opacity").value/100,successCallback:()=>info("IMAGE READY"),errorCallback:e=>info("IMAGE LAYER ERROR "+e)});aladin.setOverlayImageLayer(layer,"GATE2C_IMAGE");aladin.gotoRaDec(g.ra,g.dec);baseFov=Math.max(g.fx,g.fy)*2.5;document.getElementById("fov").value=0;aladin.setFoV(baseFov);document.getElementById("fovv").value=baseFov.toFixed(5)+"°";document.getElementById("rot").value=g.rot;document.getElementById("rotv").value=g.rot.toFixed(2)+"°";aladin.setRotation(g.rot);info("IMAGE LOADING…")}
function avmText(buf){return new TextDecoder("latin1").decode(new Uint8Array(buf))}
function avmArray(x,key){let p=x.indexOf(key);if(p<0)return[];let z=x.slice(p,p+3000),a=[...z.matchAll(/<rdf:li[^>]*>([^<]+)<\/rdf:li>/gi)].map(m=>m[1].trim());if(a.length)return a;let q=z.match(/=["\x27]([^"\x27]+)["\x27]/);return q?[q[1]]:[]}
function decodedWcs(buf){let x=avmText(buf),ref=avmArray(x,"Spatial.ReferenceValue").map(Number),pix=avmArray(x,"Spatial.ReferencePixel").map(Number),sc=avmArray(x,"Spatial.Scale").map(Number),rv=avmArray(x,"Spatial.Rotation"),rot=Number(rv[0]);if(ref.length<2||sc.length<2||!Number.isFinite(rot))throw Error("AVM WCS FIELDS MISSING");let sx=Math.abs(sc[0]),sy=Math.abs(sc[1]),t=rot*Math.PI/180,c=Math.cos(t),sn=Math.sin(t);lastDecoded={NAXIS:2,CTYPE1:"RA---TAN",CTYPE2:"DEC--TAN",EQUINOX:2000,CUNIT1:"deg",CUNIT2:"deg",CRVAL1:ref[0],CRVAL2:ref[1],CRPIX1:Number.isFinite(pix[0])?pix[0]:(imgW+1)/2,CRPIX2:Number.isFinite(pix[1])?pix[1]:(imgH+1)/2,CD1_1:-sx*c,CD1_2:-sy*sn,CD2_1:-sx*sn,CD2_2:sy*c,NAXIS1:imgW,NAXIS2:imgH};return lastDecoded}
async function reloadMode(mode){if(!rec||!currentBlob)return;let wc=mode==="JSON"?W():decodedWcs(await currentBlob.arrayBuffer());currentMode=mode;try{aladin.removeImageLayer?.("GATE2C_IMAGE")}catch(e){}let u=URL.createObjectURL(currentBlob);layer=A.image(u,{name:"GATE2C_IMAGE",imgFormat:"jpeg",wcs:wc,opacity:+document.getElementById("opacity").value/100,successCallback:()=>info("IMAGE READY"),errorCallback:e=>info("IMAGE LAYER ERROR "+e)});aladin.setOverlayImageLayer(layer,"GATE2C_IMAGE");info("IMAGE LOADING…")}
async function random(){for(let k=0;k<20;k++){let r=rows[Math.floor(Math.random()*rows.length)];if(!usable(r))continue;try{await load(r);return}catch(e){document.getElementById("read").textContent="SKIP FAILED IMAGE: "+e}}document.getElementById("read").textContent="No usable random image after 20 attempts"}
window.addEventListener("load",async()=>{await A.init;aladin=A.aladin("#aladin",{survey:"P/DSS2/color",target:"M 31",fov:4,projection:"SIN",showReticle:true,showZoomControl:true,showLayersControl:true});let j=await (await fetch(CAT,{cache:"no-store"})).json();rows=(Array.isArray(j)?j:(j.records||j.entries||j.data||j.catalog||[])).filter(usable);document.getElementById("random").onclick=random;document.getElementById("download").onclick=()=>{let q=aladin.getRaDec(),f=aladin.getFov(),o={gate:"2F",aladinSource:"https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js",mode:currentMode,image:{width:imgW,height:imgH},runtimeJSON:rec,jsonConstructedWCS:W(),embeddedDecodedWCS:lastDecoded,aladinLive:{ra:q[0],dec:q[1],fovX:f[0],fovY:f[1],rotation:aladin.getRotation(),projection:"SIN"},controls:{opacity:+document.getElementById("opacity").value,rotation:+document.getElementById("rot").value,fovLog2:+document.getElementById("fov").value}};let b=new Blob([JSON.stringify(o,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="Galaxy-Viewer-Gate2F-Settings.json";a.click()};document.getElementById("jsonload").onclick=()=>reloadMode("JSON").catch(e=>info("JSON LOAD ERROR "+e));document.getElementById("wcsload").onclick=()=>reloadMode("WCS DECODE").catch(e=>info("WCS DECODE ERROR "+e));document.getElementById("rot").oninput=e=>{let v=+e.target.value;document.getElementById("rotv").value=v.toFixed(2)+"°";aladin.setRotation(v);info()};document.getElementById("fov").oninput=e=>{let v=baseFov*Math.pow(2,+e.target.value);document.getElementById("fovv").value=v.toFixed(5)+"°";aladin.setFoV(v);info()};document.getElementById("opacity").oninput=e=>{let v=+e.target.value;document.getElementById("opv").value=v+"%";if(layer)layer.setOpacity(v/100);info()};setInterval(()=>{if(rec)info()},300);random()});
</script></body></html>
