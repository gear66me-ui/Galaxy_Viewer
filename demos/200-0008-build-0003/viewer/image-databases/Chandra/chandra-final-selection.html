onst text=`CHANDRA FINAL SELECTIONS (${chosen.length}/29)\n`+rows.join('\n');try{await navigator.clipboard.writeText(text)}catch{const x=document.createElement('textarea');x.value=text;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}toast(`Copied ${chosen.length} final selections`)}document.getElementById('copyTop').onclick=document.getElementById('copyBottom').onclick=copy;fetch(CAT,{cache:'no-store'}).then(r=>r.json()).then(d=>{all=d.entries||[];if(all.length!==95)throw Error('Expected 95 catalog records');render()}).catch(e=>{document.getElementById('list').innerHTML='<div class="note">Catalog load failed: '+esc(e.message)+'</div>'});})();</script></body></html>
