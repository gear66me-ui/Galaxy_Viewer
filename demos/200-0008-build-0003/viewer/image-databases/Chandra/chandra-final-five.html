<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chandra Final Five</title><style>
:root{color-scheme:dark;--bg:#05070b;--p:#0d121c;--line:#29384e;--txt:#eef6ff;--mut:#9eb0c8;--sel:#7de59a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.35 system-ui,sans-serif}header{position:sticky;top:0;z-index:5;background:#05070bf2;border-bottom:1px solid var(--line);padding:12px}.bar{max-width:1400px;margin:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.title{font-size:20px;font-weight:900}.stat{color:var(--mut)}button{border:1px solid #45658a;background:#15314e;color:#fff;border-radius:9px;padding:11px 14px;font-weight:900}.copy{margin-left:auto;background:#17537d}.object{max-width:1400px;margin:16px auto;border:1px solid var(--line);background:var(--p);border-radius:13px;overflow:hidden}.head{padding:11px 13px;font-size:20px;font-weight:900;border-bottom:1px solid var(--line)}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;padding:10px}.choice{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#101827}.choice.selected{outline:3px solid var(--sel);border-color:var(--sel)}.img{height:290px;background:#000;display:flex;align-items:center;justify-content:center}.img img{width:100%;height:100%;object-fit:contain}.body{padding:9px}.label{font-weight:900;margin-bottom:8px}.select{width:100%;font-size:16px}.choice.selected .select{background:#18532c;border-color:var(--sel)}.bottom{max-width:1400px;margin:20px auto;padding:10px;text-align:center}.bottom button{font-size:18px}.note{max-width:1400px;margin:12px auto;color:var(--mut);padding:0 12px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#17283b;border:1px solid #58799b;padding:10px 14px;border-radius:9px;opacity:0;transition:.15s}.toast.show{opacity:1}@media(max-width:600px){header{position:relative}.copy{margin-left:0;width:100%}.choices{grid-template-columns:1fr}.img{height:320px}}
</style></head><body><header><div class="bar"><div><div class="title">CHANDRA — FINAL FIVE</div><div class="stat" id="stat">0 / 5 selected</div></div><button class="copy" id="copyTop">COPY FINAL FIVE</button></div></header><div class="note">Choose one final image for each remaining catalog record. The original is included for comparison.</div><main id="list"></main><div class="bottom"><button id="copyBottom">COPY FINAL FIVE</button></div><div class="toast" id="toast"></div><script>
(()=>{'use strict';const KEY='gv-chandra-final-five-006';const sel=JSON.parse(localStorage.getItem(KEY)||'{}');const data=[
{n:68,name:'J1610+1811',choices:[['ORIGINAL','https://chandra.harvard.edu/photo/2025/j1610/j1610.jpg'],['OPTION 1 — X-ray only','https://chandra.harvard.edu/photo/2025/j1610/j1610_xray.jpg']]},
{n:82,name:'M 87',choices:[['ORIGINAL','https://chandra.harvard.edu/photo/2006/m87/m87.jpg'],['OPTION 1 — 2026 composite','https://chandra.harvard.edu/photo/2026/m87/m87.jpg'],['OPTION 2 — 2026 X-ray','https://chandra.harvard.edu/photo/2026/m87/m87_xray.jpg'],['OPTION 3 — 2020 full field','https://chandra.harvard.edu/photo/2020/m87/m87_full.jpg']]},
{n:92,name:'RACS J0320-35',choices:[['ORIGINAL','https://chandra.harvard.edu/photo/2025/red6/red6.jpg'],['OPTION 1 — X-ray only','https://chandra.harvard.edu/photo/2025/red6/red6_xray.jpg']]},
{n:93,name:'GSN 069',choices:[['ORIGINAL','https://chandra.harvard.edu/photo/2020/gsn069/gsn069.jpg'],['OPTION 1 — X-ray only','https://chandra.harvard.edu/photo/2020/gsn069/gsn069_xray.jpg']]},
{n:94,name:'CXO J101527.2+625911 host galaxy',choices:[['ORIGINAL','https://chandra.harvard.edu/photo/2017/rsmbh/rsmbh.jpg'],['OPTION 1 — X-ray + optical','https://chandra.harvard.edu/photo/2017/rsmbh/rsmbh_xray_optical.jpg']]}
];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(s){const t=document.querySelector('.toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1400)}function stat(){document.getElementById('stat').textContent=`${data.filter(x=>sel[x.n]).length} / 5 selected`}function render(){document.getElementById('list').innerHTML=data.map(x=>`<section class="object" data-n="${x.n}"><div class="head">${x.n} — ${esc(x.name)}</div><div class="choices">${x.choices.map((c,i)=>{const on=sel[x.n]===c[1];return `<div class="choice${on?' selected':''}" data-url="${c[1]}" data-label="${esc(c[0])}"><div class="img"><img loading="lazy" src="${c[1]}" alt="${esc(c[0])}"></div><div class="body"><div class="label">${esc(c[0])}</div><button class="select">${on?'✓ SELECTED':'SELECT ✓'}</button></div></div>`}).join('')}</div></section>`).join('');document.querySelectorAll('.object').forEach(o=>o.querySelectorAll('.choice').forEach(c=>c.querySelector('.select').onclick=()=>{sel[o.dataset.n]=c.dataset.url;localStorage.setItem(KEY,JSON.stringify(sel));o.querySelectorAll('.choice').forEach(z=>{const on=z===c;z.classList.toggle('selected',on);z.querySelector('.select').textContent=on?'✓ SELECTED':'SELECT ✓'});stat()}));stat()}async function copy(){const rows=data.filter(x=>sel[x.n]).map(x=>{const c=x.choices.find(y=>y[1]===sel[x.n]);return `${x.n} — ${x.name} — ${c?c[0]:'SELECTED'} — ${sel[x.n]}`});if(!rows.length)return toast('Nothing selected');const text=`CHANDRA FINAL FIVE (${rows.length}/5)\n`+rows.join('\n');try{await navigator.clipboard.writeText(text)}catch{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}toast(`Copied ${rows.length} selections`)}document.getElementById('copyTop').onclick=document.getElementById('copyBottom').onclick=copy;render()})();
</script></body></html>
