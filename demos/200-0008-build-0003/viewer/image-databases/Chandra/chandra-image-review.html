<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chandra Images — Mark for Replacement</title>
<style>
:root{color-scheme:dark;--bg:#05070b;--panel:#0d121c;--line:#263246;--text:#edf5ff;--muted:#9eb0c8;--selected:#8ee6a8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input{font:inherit}
header{position:sticky;top:0;z-index:10;background:#05070bf2;border-bottom:1px solid var(--line);padding:12px}.bar{max-width:1200px;margin:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.title{font-weight:800;font-size:18px}.count{color:var(--muted)}.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
button{cursor:pointer;border:1px solid #36506f;background:#11243a;color:#fff;border-radius:9px;padding:10px 13px;font-weight:800}.copy{background:#164a70;border-color:#4d98c7}.clear{background:#241820}
main{max-width:1200px;margin:auto;padding:12px}.help{color:var(--muted);padding:4px 2px 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.card{border:1px solid var(--line);background:var(--panel);border-radius:12px;overflow:hidden}.card.selected{outline:3px solid var(--selected);border-color:var(--selected)}.image{height:280px;background:#000;display:flex;align-items:center;justify-content:center}.image img{width:100%;height:100%;object-fit:contain;display:block}.foot{padding:10px}.identity{font-weight:800;margin-bottom:8px}.checkrow{display:flex;align-items:center;gap:12px;cursor:pointer;padding:10px;border:1px solid #36506f;border-radius:9px;background:#101b2a;font-weight:800}.checkrow input{width:28px;height:28px;accent-color:#38a65a;flex:0 0 auto}.card.selected .checkrow{background:#153b23;border-color:var(--selected);color:#eaffee}.number{font-size:19px;min-width:34px}.label{flex:1}
.bottom{display:flex;justify-content:center;gap:8px;padding:20px 0 8px;flex-wrap:wrap}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#17263a;border:1px solid #55789b;padding:10px 14px;border-radius:9px;opacity:0;pointer-events:none;transition:.15s;z-index:20}.toast.show{opacity:1}
@media(max-width:600px){header{position:relative}.actions{margin-left:0;width:100%}.actions button{flex:1}.grid{grid-template-columns:1fr}.image{height:310px}}
</style>
</head>
<body>
<header><div class="bar"><div><div class="title">CHANDRA — CHECK IMAGES TO CHANGE</div><div class="count" id="count">Loading all 95 images…</div></div><div class="actions"><button class="copy" id="copyTop">COPY SELECTED</button><button class="clear" id="clearTop">CLEAR</button></div></div></header>
<main><div class="help">Review every current catalog image. Check <b>CHANGE THIS IMAGE</b> for each one you want me to replace.</div><div class="grid" id="grid"></div><div class="bottom"><button class="copy" id="copyBottom">COPY SELECTED</button><button class="clear" id="clearBottom">CLEAR</button></div></main>
<div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const CATALOG='databases/gv-chandra-galaxies-full-0001.json';
const KEY='gv-chandra-change-checkboxes-v2';
const selected=new Set(JSON.parse(localStorage.getItem(KEY)||'[]').map(Number));
let entries=[];
const grid=document.getElementById('grid'),count=document.getElementById('count');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify([...selected].sort((a,b)=>a-b)))}
function update(){count.textContent=`${entries.length} catalog images • ${selected.size} checked to change`}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1400)}
function render(){grid.innerHTML=entries.map((e,i)=>{const n=i+1,on=selected.has(n),name=e.displayName||e.name||e.archiveId||('Image '+n);return `<article class="card${on?' selected':''}" data-n="${n}"><div class="image"><img loading="lazy" src="${esc(e.selectedImageUrl)}" alt="${esc(name)}"></div><div class="foot"><div class="identity">${n}. ${esc(name)}</div><label class="checkrow"><input class="pick" type="checkbox" ${on?'checked':''}><span class="number">${n}</span><span class="label">CHANGE THIS IMAGE</span></label></div></article>`}).join('');grid.querySelectorAll('.card').forEach(card=>{const box=card.querySelector('.pick'),n=Number(card.dataset.n);box.onchange=()=>{box.checked?selected.add(n):selected.delete(n);card.classList.toggle('selected',box.checked);save();update()}});update()}
async function copySelected(){const nums=[...selected].sort((a,b)=>a-b);if(!nums.length)return toast('Nothing selected');const rows=nums.map(n=>`${n} — ${entries[n-1]?.displayName||entries[n-1]?.name||entries[n-1]?.archiveId||'Unknown'}`);const text=`CHANDRA IMAGES TO CHANGE (${nums.length})\n`+rows.join('\n');try{await navigator.clipboard.writeText(text)}catch{const x=document.createElement('textarea');x.value=text;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}toast(`Copied ${nums.length} selections`)}
function clearAll(){selected.clear();save();grid.querySelectorAll('.card').forEach(c=>{c.classList.remove('selected');c.querySelector('.pick').checked=false});update();toast('Cleared')}
document.getElementById('copyTop').onclick=document.getElementById('copyBottom').onclick=copySelected;
document.getElementById('clearTop').onclick=document.getElementById('clearBottom').onclick=clearAll;
fetch(CATALOG,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{entries=Array.isArray(d.entries)?d.entries:[];if(entries.length!==95)throw Error(`Expected 95 records, found ${entries.length}`);render()}).catch(e=>{grid.innerHTML=`<p>Catalog load failed: ${esc(e.message)}</p>`;count.textContent='Catalog unavailable'});
})();
</script>
</body>
</html>
