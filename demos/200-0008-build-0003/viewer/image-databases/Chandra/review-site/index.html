<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chandra Quality Review</title><style>body{margin:0;background:#070910;color:#eef2f8;font:14px system-ui}header{position:sticky;top:0;z-index:9;background:#0b0e16ee;padding:10px;border-bottom:1px solid #293244}.bar{max-width:1600px;margin:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,input,select{background:#171c28;color:#eef2f8;border:1px solid #354057;border-radius:7px;padding:8px}.stats{margin-left:auto;color:#aab4c3}main{max-width:1600px;min-width:1180px;margin:auto;padding:10px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.card{background:#111621;border:1px solid #293244;border-radius:10px;overflow:hidden}.img{height:205px;background:#020307;display:flex;align-items:center;justify-content:center;position:relative}.img img{width:100%;height:100%;object-fit:contain}.badge{position:absolute;top:5px;left:5px;background:#000c;padding:4px;border-radius:5px;font-size:11px}.body{padding:8px}.name{font-weight:700}.meta{font-size:11px;color:#aab4c3;margin:3px 0 6px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:4px}.actions button.active{outline:2px solid #7de59a;background:#194829}.links{display:flex;gap:4px;margin-top:5px}.links a{flex:1;text-align:center;color:#bcd7ff;background:#171c28;padding:6px;border-radius:6px;text-decoration:none;font-size:11px}.noimg{color:#9aa5b5;text-align:center;padding:18px}.out{max-width:1600px;min-width:1180px;margin:auto;padding:0 10px 20px}textarea{width:100%;min-height:160px;background:#020307;color:#eef2f8;border:1px solid #354057;border-radius:7px;padding:8px;font:11px ui-monospace,monospace}</style></head><body><header><div class="bar"><b>Chandra Quality Review</b><input id="q" placeholder="Search"><select id="filter"><option value="all">All</option><option value="unreviewed">Unreviewed by me</option><option value="flagged">Flagged</option><option value="KEEP">Keep</option><option value="MONOCHROME">Monochrome</option><option value="ARTWORK">Artwork</option><option value="TABLE_DATA">Table / Data</option><option value="COMPOSITE_CLIPPED">Composite / Clipped</option><option value="DELETE_REPLACE">Delete / Replace</option></select><button id="copyTop">COPY MY SELECTIONS</button><span class="stats" id="stats"></span></div></header><main><div class="grid" id="grid"></div></main><section class="out"><button id="copyBottom">COPY MY SELECTIONS</button><textarea id="report" readonly>No decisions yet.</textarea></section><script>let M=[],S=JSON.parse(localStorage.getItem('gv-chandra-review-selections')||'{}');const save=()=>localStorage.setItem('gv-chandra-review-selections',JSON.stringify(S));const opt=[['KEEP','KEEP'],['MONOCHROME','MONOCHROME'],['ARTWORK','ARTWORK'],['TABLE_DATA','TABLE/DATA'],['COMPOSITE_CLIPPED','COMPOSITE/CLIPPED'],['DELETE_REPLACE','DELETE/REPLACE']];function id(r,i){return r.archiveId||String(i+1)}function choose(k,v){S[k]=v;save();render()}function filtered(){let q=document.getElementById('q').value.toLowerCase(),f=document.getElementById('filter').value;return M.map((r,i)=>({r,i})).filter(x=>{let k=id(x.r,x.i),d=S[k],t=((x.r.name||'')+' '+(x.r.designation||'')+' '+k).toLowerCase();return(!q||t.includes(q))&&(f==='all'||(f==='unreviewed'?!d:f==='flagged'?d&&d!=='KEEP':d===f))})}function thumb(u){return u?u.replace(/\.jpg($|\?)/i,'_300.jpg$1'):''}function updateReport(){let rows=M.map((r,i)=>{let k=id(r,i),d=S[k],u=r.selectedImageUrl||(r.jpegCandidates&&r.jpegCandidates[0])||'';return d?`${i+1} — ${r.name||r.designation||k} — ${d} — ${u} — ${r.sourceUrl||''}`:null}).filter(Boolean);document.getElementById('report').value=rows.length?`CHANDRA QUALITY REVIEW (${rows.length}/${M.length})\n`+rows.join('\n'):'No decisions yet.'}function render(){let d=filtered(),g=document.getElementById('grid');g.innerHTML='';d.forEach(x=>{let r=x.r,i=x.i,k=id(r,i),u=r.selectedImageUrl||(r.jpegCandidates&&r.jpegCandidates[0])||'',src=r.sourceUrl||'',v=S[k]||'',el=document.createElement('div');el.className='card';let im=u?`<img loading="lazy" src="${thumb(u)}" onerror="this.onerror=null;this.parentElement.innerHTML='<div class=&quot;noimg&quot;>PREVIEW UNAVAILABLE</div>'">`:'<div class="noimg">NO IMAGE</div>';el.innerHTML=`<div class="img">${im}<span class="badge">${v||'UNREVIEWED'}</span></div><div class="body"><div class="name">${i+1}. ${r.name||r.designation||k}</div><div class="meta">${r.designation||''}<br>${k}</div><div class="actions">${opt.map(o=>`<button class="${v===o[0]?'active':''}" data-v="${o[0]}">${o[1]}</button>`).join('')}</div><div class="links">${u?`<a target="_blank" href="${u}">Open full image</a>`:''}${src?`<a target="_blank" href="${src}">Source / detail</a>`:''}</div></div>`;el.querySelectorAll('.actions button').forEach(b=>b.onclick=()=>choose(k,b.dataset.v));g.appendChild(el)});document.getElementById('stats').textContent=`${d.length} shown · ${M.length} records · ${Object.keys(S).length} reviewed`;updateReport()}async function copy(){updateReport();let t=document.getElementById('report');if(t.value==='No decisions yet.')return;try{await navigator.clipboard.writeText(t.value)}catch{t.select();document.execCommand('copy')}}document.getElementById('q').oninput=render;document.getElementById('filter').onchange=render;document.getElementById('copyTop').onclick=document.getElementById('copyBottom').onclick=copy;fetch('../databases/gv-chandra-galaxies-full-0001.json?'+Date.now()).then(r=>r.json()).then(j=>{M=Array.isArray(j.entries)?j.entries:[];render()});</script></body></html>
