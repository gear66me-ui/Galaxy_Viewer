<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chandra Quality Review</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#05070b;color:#f4f7fb}header{position:sticky;top:0;z-index:10;background:#0b1019f5;border-bottom:1px solid #344158;padding:8px}.bar{max-width:1900px;margin:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0 8px 0 0}button,input,select{background:#131c29;color:#eef6ff;border:1px solid #3b4d65;border-radius:7px;padding:8px;font-weight:700}.stats{margin-left:auto;color:#aebbd0;font-size:12px}main{max-width:1900px;min-width:1180px;margin:auto;padding:8px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.card{background:#0d1725;border:1px solid #31527a;border-radius:9px;overflow:hidden}.card.flagged{box-shadow:0 0 0 2px #df9f36 inset}.pic{height:170px;background:#000;display:flex;align-items:center;justify-content:center;position:relative}.pic img{width:100%;height:100%;object-fit:contain;display:block}.placeholder{padding:12px;color:#9db0c8;text-align:center;font-size:11px}.badge{position:absolute;top:5px;left:5px;background:#000d;border-radius:5px;padding:3px 5px;font-size:9px;font-weight:900}.body{padding:7px}.name{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:#9db0c8;margin:3px 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.choices button{padding:6px 3px;font-size:9px}.choices button.active{outline:2px solid #80e6a0;background:#194829}.links{display:flex;gap:4px;margin-top:5px}.links a{flex:1;text-align:center;text-decoration:none;color:#cbe2ff;background:#141e2d;border:1px solid #344b67;border-radius:6px;padding:5px;font-size:9px}.output{max-width:1900px;min-width:1180px;margin:0 auto 20px;padding:8px}.copy{width:100%;background:#dfeaff;color:#08111f;font-weight:900}.report{width:100%;min-height:130px;margin-top:6px;background:#02050a;color:#fff;border:1px solid #344158;border-radius:7px;padding:8px;font:11px/1.35 ui-monospace,monospace}@media(max-width:1180px){body{overflow-x:auto}}</style></head><body><header><div class="bar"><h1>CHANDRA QUALITY REVIEW</h1><input id="q" placeholder="Search galaxy"><select id="filter"><option value="all">All</option><option value="unreviewed">Unreviewed</option><option value="flagged">Flagged</option><option value="KEEP">Keep</option><option value="MONOCHROME">Monochrome</option><option value="ARTWORK">Artwork</option><option value="TABLE_DATA">Table / Data</option><option value="COMPOSITE_CLIPPED">Composite / Clipped</option><option value="DELETE_REPLACE">Delete / Replace</option></select><button id="copyTop">COPY MY SELECTIONS</button><span class="stats" id="stats">Loading catalog…</span></div></header><main><div class="grid" id="grid"></div></main><section class="output"><button class="copy" id="copyBottom">COPY MY SELECTIONS</button><textarea class="report" id="report" readonly>No decisions yet.</textarea></section><script>(()=>{'use strict';const CATALOG='../databases/gv-chandra-galaxies-full-0001.json';const KEY='gv-chandra-quality-review-011';const OPTIONS=[['KEEP','KEEP'],['MONOCHROME','MONOCHROME'],['ARTWORK','ARTWORK'],['TABLE_DATA','TABLE/DATA'],['COMPOSITE_CLIPPED','COMPOSITE/CLIPPED'],['DELETE_REPLACE','DELETE/REPLACE']];let entries=[];let decisions=JSON.parse(localStorage.getItem(KEY)||'{}');const grid=document.getElementById('grid'),stats=document.getElementById('stats'),report=document.getElementById('report');const save=()=>localStorage.setItem(KEY,JSON.stringify(decisions));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function thumb(url){if(!url)return'';return url.replace(/\.jpg($|\?)/i,'_300.jpg$1')}function filtered(){const q=document.getElementById('q').value.toLowerCase(),f=document.getElementById('filter').value;return entries.filter((e,i)=>{const id=e.archiveId||String(i+1),d=decisions[id];const text=`${e.name||''} ${e.designation||''} ${e.archiveId||''}`.toLowerCase();if(q&&!text.includes(q))return false;if(f==='all')return true;if(f==='unreviewed')return !d;if(f==='flagged')return !!d&&d!=='KEEP';return d===f})}function setDecision(id,v){decisions[id]=v;save();render()}function previewMarkup(e){const full=e.selectedImageUrl||e.jpegCandidates?.[0]||'';if(!full)return'<div class="placeholder">NO IMAGE URL</div>';const t=thumb(full);return `<img class="lazy" data-thumb="${esc(t)}" data-full="${esc(full)}" alt="${esc(e.name||e.designation||'Chandra image')}"><span class="badge">PREVIEW</span>`}function render(){const list=filtered();grid.innerHTML=list.map((e,idx)=>{const originalIndex=entries.indexOf(e),id=e.archiveId||String(originalIndex+1),d=decisions[id]||'',full=e.selectedImageUrl||e.jpegCandidates?.[0]||'',source=e.sourceUrl||'';return `<article class="card${d&&d!=='KEEP'?' flagged':''}"><div class="pic">${previewMarkup(e)}</div><div class="body"><div class="name">${originalIndex+1}. ${esc(e.name||e.designation||id)}</div><div class="meta">${esc(e.designation||'')} · ${esc(id)}</div><div class="choices">${OPTIONS.map(([v,label])=>`<button class="${d===v?'active':''}" data-id="${esc(id)}" data-v="${v}">${label}</button>`).join('')}</div><div class="links">${full?`<a href="${esc(full)}" target="_blank">FULL IMAGE</a>`:''}${source?`<a href="${esc(source)}" target="_blank">SOURCE</a>`:''}</div></div></article>`}).join('');grid.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>setDecision(b.dataset.id,b.dataset.v));observeImages();const flagged=Object.values(decisions).filter(v=>v&&v!=='KEEP').length;stats.textContent=`${list.length} shown · ${entries.length} total · ${Object.keys(decisions).length} reviewed · ${flagged} flagged`;updateReport()}function observeImages(){const imgs=[...grid.querySelectorAll('img.lazy')];const load=img=>{img.onerror=()=>{img.onerror=null;img.remove();const p=document.createElement('div');p.className='placeholder';p.textContent='Preview unavailable — use FULL IMAGE';img.parentElement?.appendChild(p)};img.src=img.dataset.thumb};if('IntersectionObserver'in window){const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){load(x.target);io.unobserve(x.target)}}),{rootMargin:'180px'});imgs.forEach(i=>io.observe(i))}else imgs.forEach(load)}function updateReport(){const rows=entries.map((e,i)=>{const id=e.archiveId||String(i+1),d=decisions[id];return d?`${i+1} — ${e.name||e.designation||id} — ${d} — ${e.selectedImageUrl||e.jpegCandidates?.[0]||''} — ${e.sourceUrl||''}`:null}).filter(Boolean);report.value=rows.length?`CHANDRA QUALITY REVIEW (${rows.length}/${entries.length})\n`+rows.join('\n'):'No decisions yet.'}async function copy(){updateReport();if(report.value==='No decisions yet.')return;try{await navigator.clipboard.writeText(report.value)}catch{report.select();document.execCommand('copy')}}document.getElementById('q').oninput=render;document.getElementById('filter').onchange=render;document.getElementById('copyTop').onclick=document.getElementById('copyBottom').onclick=copy;fetch(CATALOG+'?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(j=>{entries=Array.isArray(j.entries)?j.entries:[];render()}).catch(e=>{stats.textContent='Catalog load failed';grid.innerHTML=`<div class="placeholder">${esc(e.message)}</div>`})})();</script></body></html>
