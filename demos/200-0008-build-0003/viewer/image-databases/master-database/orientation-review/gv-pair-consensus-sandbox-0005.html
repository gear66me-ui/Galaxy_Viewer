<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Galaxy Viewer Pair Consensus Sandbox 0005</title></head><body><div id="gv-bootstrap" style="font:14px system-ui;padding:20px;background:#05080d;color:#eef5ff;min-height:100vh">Loading Pair Consensus Sandbox 0005…</div><script>

const engine=function(){
const q=s=>document.querySelector(s);let pcBusy=false,lastSolution=null;const STORE='gv-pair-consensus-catalog-0005';
function pcStatus(text,kind='warn'){const e=q('#actionStatus');if(e){e.textContent=text;e.className='action '+kind}const s=q('#status');if(s){s.textContent=text;s.className=kind}}
function feedback(){const b=q('#pcRun');if(!b)return;b.textContent='PRESSED ✓';b.style.background='#0f7a3d';b.style.boxShadow='0 0 20px #65e7a4';pcStatus('PAIR CONSENSUS BUTTON PRESSED ✓','good')}
function centroids(d,max,minSep){const m=features(d),all=detectStars(d,m)||[];const ranked=[...all].filter(p=>Number.isFinite(+p.x)&&Number.isFinite(+p.y)).sort((a,b)=>{const ab=(+a.b||0),bb=(+b.b||0),ap=(a.prominent?1:0)+(a.offGalaxy?.5:0),bp=(b.prominent?1:0)+(b.offGalaxy?.5:0);return (bb+25*bp)-(ab+25*ap)});const out=[];for(const p of ranked){if(out.length>=max)break;if(out.every(z=>Math.hypot(p.x-z.x,p.y-z.y)>=minSep))out.push(p)}for(const p of ranked){if(out.length>=max)break;if(!out.includes(p))out.push(p)}return{all,selected:out}}
function pts(P,w,h){return P.map((p,i)=>({x:p.x*w,y:p.y*h,id:i,brightness:+p.b||0}))}
function overlayCanvas(sel){const c=q(sel),r=c.parentElement.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=Math.max(1,Math.round(r.width*dpr));c.height=Math.max(1,Math.round(r.height*dpr));c.style.width=r.width+'px';c.style.height=r.height+'px';const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,r.width,r.height);return{g,w:r.width,h:r.height}}
function drawDetections(sel,P,prefix,color){const o=overlayCanvas(sel),g=o.g;g.strokeStyle=color;g.fillStyle=color;g.lineWidth=2.6;g.font='bold 12px monospace';P.forEach((p,i)=>{const x=p.x/512*o.w,y=p.y/512*o.h;g.beginPath();g.arc(x,y,12,0,Math.PI*2);g.stroke();g.fillText(prefix+(i+1),x+14,y-7)})}
function drawMatches(sel,P,matches,side,color){const o=overlayCanvas(sel),g=o.g;g.strokeStyle=color;g.fillStyle=color;g.lineWidth=3.2;g.font='bold 13px monospace';matches.forEach((m,k)=>{const idx=side==='s'?m.si:m.ti,p=P[idx],x=p.x/512*o.w,y=p.y/512*o.h;g.beginPath();g.arc(x,y,14,0,Math.PI*2);g.stroke();g.fillText('M'+(k+1),x+16,y-8)})}
function transformFromPair(a,b,c,d){const vax=b.x-a.x,vay=b.y-a.y,vbx=d.x-c.x,vby=d.y-c.y,da=Math.hypot(vax,vay),db=Math.hypot(vbx,vby);if(da<1||db<1)return null;const scale=db/da;if(scale<.18||scale>5.5)return null;const angA=Math.atan2(vay,vax),angB=Math.atan2(vby,vbx),rot=angB-angA,cs=Math.cos(rot)*scale,sn=Math.sin(rot)*scale,tx=c.x-(cs*a.x-sn*a.y),ty=c.y-(sn*a.x+cs*a.y);return{scale,rot,cs,sn,tx,ty}}
function applyTr(tr,p){return{x:tr.cs*p.x-tr.sn*p.y+tr.tx,y:tr.sn*p.x+tr.cs*p.y+tr.ty}}
function coverage(matches,S){if(!matches.length)return 0;const qd=new Set();for(const m of matches){const p=S[m.si];qd.add((p.x>=256?1:0)+(p.y>=256?2:0))}return qd.size/4}
function scoreTransform(tr,S,T,gate=11){const used=new Set(),matches=[];for(let si=0;si<S.length;si++){const p=applyTr(tr,S[si]);let bi=-1,bd=gate;for(let ti=0;ti<T.length;ti++){if(used.has(ti))continue;const d=Math.hypot(p.x-T[ti].x,p.y-T[ti].y);if(d<bd){bd=d;bi=ti}}if(bi>=0){used.add(bi);matches.push({si,ti:bi,residual:bd})}}const rms=matches.length?Math.sqrt(matches.reduce((z,m)=>z+m.residual*m.residual,0)/matches.length):999,cov=coverage(matches,S);return{matches,rms,cov,score:matches.length*1000+cov*100-rms*12}}
function solvePairs(S,T){let best=null,tests=0;for(let i=0;i<S.length;i++)for(let j=i+1;j<S.length;j++){const ds=Math.hypot(S[j].x-S[i].x,S[j].y-S[i].y);if(ds<55)continue;for(let k=0;k<T.length;k++)for(let l=k+1;l<T.length;l++){const dt=Math.hypot(T[l].x-T[k].x,T[l].y-T[k].y);if(dt<35)continue;for(const rev of [false,true]){const c=rev?T[l]:T[k],d=rev?T[k]:T[l],tr=transformFromPair(S[i],S[j],c,d);if(!tr)continue;tests++;const ev=scoreTransform(tr,S,T,11);if(!best||ev.score>best.score)best={...tr,...ev,def:{si1:i,si2:j,ti1:rev?l:k,ti2:rev?k:l,ds,dt}}}}}return{best,tests}}
function renderTable(best){const body=q('#pcTableBody');body.innerHTML='';best.matches.forEach((m,k)=>{const tr=document.createElement('tr');tr.innerHTML='<td>M'+(k+1)+'</td><td>S'+(m.si+1)+'</td><td>T'+(m.ti+1)+'</td><td>'+m.residual.toFixed(2)+' px</td>';body.appendChild(tr)})}
function norm360(v){v=((+v%360)+360)%360;return v}
function norm180(v){v=norm360(v);return v>180?v-360:v}
function rawDeg(best){return norm360(best.rot*180/Math.PI)}
function aladinConvention(best){return norm180(-rawDeg(best))}
function liveState(){try{const s=readLiveState?.();if(s)return s}catch{}const f=(()=>{try{const z=aladin.getFov?.()||aladin.getFoV?.();return Array.isArray(z)?Math.max(...z.map(Number).filter(Number.isFinite)):+z}catch{return NaN}})();const r=(()=>{try{return +aladin.getRotation?.()||0}catch{return 0}})();return{fov:f,rot:r}}
async function capturePoints(){const source=q('#source'),sd=imageDataFromImage(source),u=await captureAladin(),td=await imageDataFromUrl(u),SA=centroids(sd,18,.05),TA=centroids(td,24,.035);return{sd,td,SA,TA,S:pts(SA.selected,sd.width,sd.height),T:pts(TA.selected,td.width,td.height)}}
async function verifyAfterMove(S){const u=await captureAladin(),td=await imageDataFromUrl(u),TA=centroids(td,24,.035),T=pts(TA.selected,td.width,td.height),R=solvePairs(S,T),b=R.best;return{tests:R.tests,best:b,T,TA}}
function selfTest(){const S=[{x:40,y:60},{x:140,y:70},{x:90,y:190},{x:230,y:130},{x:300,y:250},{x:390,y:110}];const ang=37*Math.PI/180,sc=.73,cs=Math.cos(ang)*sc,sn=Math.sin(ang)*sc,tx=51,ty=-18;const T=S.map(p=>({x:cs*p.x-sn*p.y+tx,y:sn*p.x+cs*p.y+ty}));T.push({x:30,y:420},{x:470,y:400});const R=solvePairs(S,T),b=R.best;if(!b)return{ok:false};const deg=rawDeg(b);return{ok:b.matches.length>=6&&Math.abs(b.scale-sc)<1e-6&&Math.abs(deg-37)<1e-5,matches:b.matches.length,rot:deg,scale:b.scale,tests:R.tests}}
function catalogRows(){try{const a=JSON.parse(localStorage.getItem(STORE)||'[]');return Array.isArray(a)?a:[]}catch{return[]}}

function sendCatalog(){if(!lastSolution?.pass)throw Error('NO PASSING SOLUTION TO SEND');const rows=catalogRows(),key=(record?.archiveId||record?.id||record?.name||('record-'+recordIndex));const row={key,mission:q('#mission')?.value||null,recordIndex:Number(recordIndex)||0,archiveId:record?.archiveId||record?.id||null,name:record?.name||record?.title||null,ra:+record?.ra,dec:+record?.dec,fieldOfViewDeg:lastSolution.requestedFov,orientationDeg:lastSolution.requestedRotation,aladinReadback:{fov:lastSolution.actualFov,rotation:lastSolution.actualRotation},solver:{method:'pair-consensus',version:'0005',matches:lastSolution.matches,rmsPx:lastSolution.rms,coverage:lastSolution.coverage,scale:lastSolution.scale,rawTransformDeg:lastSolution.rawTransformDeg,postVerifyMatches:lastSolution.postMatches,postVerifyRmsPx:lastSolution.postRms},sourceImage:record?.selectedImageUrl||null,timestamp:new Date().toISOString()};const i=rows.findIndex(r=>r.key===key&&r.mission===row.mission);if(i>=0)rows[i]=row;else rows.push(row);saveRows(rows);downloadCatalog(rows);pcStatus('SENT TO JSON CATALOG ✓ · '+rows.length+' RECORDS','good');if(typeof log==='function')log('PAIR CONSENSUS CATALOG SEND',row)}
async function run(){feedback();const b=q('#pcRun');if(pcBusy){pcStatus('PAIR CONSENSUS ALREADY RUNNING','warn');return}pcBusy=true;lastSolution=null;q('#pcSend').disabled=true;try{b.textContent='PAIR SOLVER RUNNING…';if(typeof record==='undefined'||!record)throw Error('NO RECORD LOADED');if(typeof aladin==='undefined'||!aladin)throw Error('ALADIN NOT READY');const source=q('#source');if(!source||!source.complete||!source.naturalWidth)throw Error('CATALOG IMAGE NOT READY');clearAnchorOverlays();const start=liveState();pcStatus('PAIR CONSENSUS · CAPTURING FRAMES','warn');const C=await capturePoints(),{SA,TA,S,T}=C;q('#pcSource').textContent=S.length+' / '+SA.all.length;q('#pcTarget').textContent=T.length+' / '+TA.all.length;drawDetections('#sourceAnchors',S,'S','#ffd166');drawDetections('#aladinAnchors',T,'T','#ffd166');if(S.length<3||T.length<3)throw Error('FEWER THAN 3 USABLE CENTROIDS');pcStatus('PAIR CONSENSUS · TESTING STAR-PAIR GEOMETRIES','warn');await new Promise(r=>setTimeout(r,60));const R=solvePairs(S,T),best=R.best;if(!best||best.matches.length<3)throw Error('NO GEOMETRIC CONSENSUS ≥3 MATCHES');const raw=rawDeg(best),requestedRotation=aladinConvention(best),startFov=Number(start?.fov),requestedFov=Number.isFinite(startFov)?startFov*best.scale:NaN,prePass=best.matches.length>=5&&best.rms<=7&&best.cov>=.5;if(!prePass)throw Error('PRE-APPLY CONSENSUS DID NOT PASS');q('#pcRaw').textContent=raw.toFixed(3)+'° forensic';q('#pcRot').textContent=requestedRotation.toFixed(3)+'°';q('#pcFovReq').textContent=Number.isFinite(requestedFov)?requestedFov.toFixed(6)+'°':'—';q('#pcApply').textContent='APPLYING ROT '+requestedRotation.toFixed(3)+'° · FOV '+(Number.isFinite(requestedFov)?requestedFov.toFixed(6):'—')+'°';pcStatus('PAIR CONSENSUS · APPLYING SOLUTION TO ALADIN','warn');if(Number.isFinite(requestedFov)){aladin.setFoV?.(requestedFov);aladin.setFov?.(requestedFov)}aladin.setRotation?.(requestedRotation);await new Promise(r=>setTimeout(r,900));updateLive?.();const actual=liveState(),actualRotation=norm180(+actual.rot||0),actualFov=+actual.fov;q('#pcActualRot').textContent=actualRotation.toFixed(3)+'°';q('#pcActualFov').textContent=Number.isFinite(actualFov)?actualFov.toFixed(6)+'°':'—';pcStatus('PAIR CONSENSUS · POST-MOVE VERIFICATION','warn');const V=await verifyAfterMove(S),vb=V.best;let postMatches=0,postRms=999;if(vb){postMatches=vb.matches.length;postRms=vb.rms;drawMatches('#sourceAnchors',S,vb.matches,'s','#5ee7ff');drawMatches('#aladinAnchors',V.T,vb.matches,'t','#65e7a4');renderTable(vb)}else{drawMatches('#sourceAnchors',S,best.matches,'s','#5ee7ff');drawMatches('#aladinAnchors',T,best.matches,'t','#65e7a4');renderTable(best)}const finalBest=vb||best,pass=prePass&&Math.abs(norm180(actualRotation-requestedRotation))<=.25&&(!Number.isFinite(requestedFov)||Math.abs(actualFov-requestedFov)<=Math.max(1e-6,requestedFov*.01))&&postMatches>=5;q('#pcTests').textContent=R.tests.toLocaleString();q('#pcDef').textContent='S'+(best.def.si1+1)+'–S'+(best.def.si2+1)+' ↔ T'+(best.def.ti1+1)+'–T'+(best.def.ti2+1);q('#pcDist').textContent=best.def.ds.toFixed(1)+' px ↔ '+best.def.dt.toFixed(1)+' px';q('#pcScale').textContent=best.scale.toFixed(6);q('#pcMatches').textContent=best.matches.length+' initial · '+postMatches+' post';q('#pcRms').textContent=best.rms.toFixed(3)+' px initial · '+postRms.toFixed(3)+' px post';q('#pcCoverage').textContent=Math.round(finalBest.cov*100)+'%';q('#pcResult').textContent=pass?'PASS ✓':'REVIEW';q('#pcResult').className=pass?'good':'warn';q('#pcSend').disabled=!pass;lastSolution={pass,requestedRotation,requestedFov,actualRotation,actualFov,matches:best.matches.length,rms:best.rms,coverage:best.cov,scale:best.scale,rawTransformDeg:raw,postMatches,postRms};pcStatus((pass?'PAIR CONSENSUS PASS':'PAIR CONSENSUS REVIEW')+' · ALADIN ROT '+actualRotation.toFixed(2)+'° · FOV '+(Number.isFinite(actualFov)?actualFov.toFixed(6):'—')+'° · '+postMatches+' POST MATCHES',pass?'good':'warn');if(typeof log==='function')log('PAIR CONSENSUS 0005 RESULT',{tests:R.tests,raw_transform_deg:raw,aladin_requested:{rotation_deg:requestedRotation,fov_deg:requestedFov},aladin_actual:{rotation_deg:actualRotation,fov_deg:actualFov},initial:{defining_pair:best.def,scale:best.scale,matches:best.matches,rms_px:best.rms,coverage:best.cov},post_verify:{matches:vb?.matches||[],rms_px:postRms,coverage:vb?.cov||0},pass})}catch(e){pcStatus('PAIR CONSENSUS NO SOLUTION · '+String(e?.message||e),'bad');q('#pcResult').textContent='NO SOLUTION';q('#pcResult').className='bad';if(typeof log==='function')log('PAIR CONSENSUS 0005 FAILURE',{message:String(e?.message||e)},'ERROR')}finally{pcBusy=false;b.disabled=false;b.textContent='RUN AUTO PAIR CONSENSUS';b.style.background='#14532d';b.style.boxShadow='none'}}
function install(){const orient=q('#orient');if(!orient)return;document.title='Galaxy Viewer Pair Consensus Sandbox 0005';const h=document.querySelector('main section.panel strong');if(h)h.textContent='GALAXY VIEWER PAIR CONSENSUS SANDBOX 0005';q('#pcRun')?.remove();q('#pcPanel')?.remove();window.GV_PAIR_RUN=run;const b=document.createElement('button');b.id='pcRun';b.type='button';b.textContent='RUN AUTO PAIR CONSENSUS';b.style.cssText='position:relative;z-index:9999;pointer-events:auto;touch-action:manipulation;background:#14532d;color:#fff;font-weight:900;border:3px solid #65e7a4;min-width:220px;min-height:42px';b.onclick=e=>{e.preventDefault();e.stopPropagation();feedback();setTimeout(()=>window.GV_PAIR_RUN(),0)};orient.insertAdjacentElement('afterend',b);const send=document.createElement('button');send.id='pcSend';send.type='button';send.textContent='SEND TO JSON CATALOG';send.disabled=true;send.style.cssText='background:#533814;color:#fff;font-weight:900;border:2px solid #ffd166;min-height:42px';send.onclick=e=>{e.preventDefault();e.stopPropagation();try{sendCatalog()}catch(err){pcStatus('JSON CATALOG · '+String(err?.message||err),'bad')}};b.insertAdjacentElement('afterend',send);const p=document.createElement('section');p.id='pcPanel';p.className='panel';p.innerHTML='<strong>GEOMETRIC PAIR CONSENSUS — AUTO APPLY 0005</strong><div class="readouts" style="margin-top:7px"><div class="readout">SELF-TEST<b id="pcSelf">PENDING</b></div><div class="readout">SOURCE CENTROIDS<b id="pcSource">—</b></div><div class="readout">ALADIN CENTROIDS<b id="pcTarget">—</b></div><div class="readout">PAIR HYPOTHESES<b id="pcTests">—</b></div><div class="readout">DEFINING PAIR<b id="pcDef">—</b></div><div class="readout">PAIR DISTANCE<b id="pcDist">—</b></div><div class="readout">SCALE<b id="pcScale">—</b></div><div class="readout">ALADIN ROTATION<b id="pcRot">—</b></div><div class="readout">REQUESTED FOV<b id="pcFovReq">—</b></div><div class="readout">ALADIN ACTUAL ROT<b id="pcActualRot">—</b></div><div class="readout">ALADIN ACTUAL FOV<b id="pcActualFov">—</b></div><div class="readout">APPLY COMMAND<b id="pcApply">—</b></div><div class="readout">CORRELATED STARS<b id="pcMatches">—</b></div><div class="readout">RMS RESIDUAL<b id="pcRms">—</b></div><div class="readout">COVERAGE<b id="pcCoverage">—</b></div><div class="readout">JSON CATALOG<b id="pcCatalogCount">0 records</b></div><div class="readout">RESULT<b id="pcResult">WAITING</b></div><div class="readout">RAW TRANSFORM<b id="pcRaw">forensic only</b></div></div><div class="hint" style="margin-top:7px">All user-facing rotation values use the Aladin convention. The raw source→target transform is forensic only. A passing solve automatically commands Aladin rotation + FOV, reads them back, then re-runs geometric verification. SEND TO JSON CATALOG stores/replaces this record locally and downloads the accumulated test catalog.</div><div style="overflow:auto;margin-top:8px"><table style="width:100%;border-collapse:collapse;font:11px ui-monospace,monospace"><thead><tr><th>MATCH</th><th>SOURCE</th><th>ALADIN</th><th>RESIDUAL</th></tr></thead><tbody id="pcTableBody"></tbody></table></div>';const anchor=q('.statusrow')||orient.parentElement;anchor.insertAdjacentElement('afterend',p);saveRows(catalogRows());setTimeout(()=>{const C=selfTest(),ok=C.ok&&typeof window.GV_PAIR_RUN==='function'&&typeof q('#pcRun').onclick==='function';q('#pcSelf').textContent=ok?'PASS ✓ · '+C.matches+' matches · '+C.rot.toFixed(1)+'°':'FAIL';q('#pcSelf').className=ok?'good':'bad';b.style.outline=ok?'2px solid #65e7a4':'3px solid #ff7b7b';if(typeof log==='function')log('PAIR CONSENSUS 0005 READY',{self_test:C,button_ok:ok,rotation_convention:'Aladin user-facing; raw transform forensic only',catalog_store:STORE})},100)}
install();
};
