'use strict';
try{
 const r=await fetch('./gv-auto-curator-0014.html?v=0015-base',{cache:'no-store'});if(!r.ok)throw Error(`0014 baseline HTTP ${r.status}`);let h=await r.text();

 const panel=`<section class="panel analysisResultPanel"><div class="analysisHead"><b>ANALYSIS RESULT — WHAT THE MACHINE ANALYZED AND SELECTED</b><span class="pill analysisStateWarn" id="analysisState0015">NOT ANALYZED</span><button id="toggleMarkers0015">HIDE MARKERS</button></div><div class="analysisGrid"><div class="analysisCell"><h3>OBJECT / SOURCE ANALYSIS</h3><strong id="analysisObject0015">—</strong></div><div class="analysisCell"><h3>PRECOMPUTED REGISTRATION EVIDENCE</h3><strong id="registration0015">—</strong></div><div class="analysisCell"><h3>MACHINE SELECTED CANDIDATE</h3><strong id="selected0015">RA — · DEC — · FOV — · ROT —</strong></div><div class="analysisCell"><h3>ALADIN LIVE READ-BACK</h3><strong id="verified0015">NOT VERIFIED</strong></div></div><div class="analysisEvidence" id="analysisEvidence0015">Press ANALYZE CURRENT. This field will report the image features examined, registration evidence, FoV regression, selected RA/Dec/FoV/rotation, and the final Aladin placement verification.</div><div class="markerLegend">SOURCE IMAGE OVERLAY: circles = browser landmark diagnostics; cross = detected brightness/feature centroid; line = detected major axis. These are browser diagnostics. The current SIFT/RANSAC prediction file stores match/inlier counts but not the individual SIFT point coordinates, so this page does not falsely label browser markers as SIFT inliers.</div></section>`;

 const patch=`<script>\n(function(){\n'use strict';\nconst Q=s=>document.querySelector(s);let markersVisible0015=true;\nfunction clearOverlay0015(){const c=Q('#sourceOverlay');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height)}\nfunction setAnalysisState0015(text,kind='warn'){const e=Q('#analysisState0015');if(!e)return;e.textContent=text;e.className='pill '+(kind==='good'?'analysisStateGood':kind==='bad'?'analysisStateBad':'analysisStateWarn')}\nfunction renderPrecomputed0015(){const x=current?.();if(!x)return;const m=machineOf(x),p=m?.p,rg=p?.registration||{};Q('#analysisObject0015').textContent=x?x.c.name+' '+x.c.revision+' · '+nameOf(x.r)+' · image '+(imageOf(x.r)?'present':'MISSING'): '—';if(m){Q('#registration0015').textContent='method '+(rg.method||'unknown')+' · confidence '+((m.confidence||0)*100).toFixed(1)+'% · matches '+(rg.matches??'—')+' · inliers '+(rg.inliers??'—')+' · inlier ratio '+(Number.isFinite(Number(rg.inlier_ratio))?(Number(rg.inlier_ratio)*100).toFixed(1)+'%':'—')+' · scale '+(Number.isFinite(Number(rg.scale))?Number(rg.scale).toFixed(4):'—')+' · warning '+(rg.warning||'none')}else Q('#registration0015').textContent='No precomputed SIFT/RANSAC candidate for this record.'}\nfunction renderFinal0015(){const a=currentAnalysis,x=current?.(),m=x?machineOf(x):null;renderPrecomputed0015();if(!a){Q('#selected0015').textContent='No final machine candidate was produced.';Q('#verified0015').textContent='NOT VERIFIED';setAnalysisState0015('MANUAL / FAILED','bad');return}const f=a.source||{},g=a.placementGate||{};Q('#selected0015').textContent='RA '+fmt(a.ra)+' · DEC '+fmt(a.dec)+' · FOV '+fmt(a.fov)+'° · ROT '+Number(a.rot||0).toFixed(2)+'°';Q('#verified0015').textContent=g.ok?'RA '+fmt(g.center?.[0])+' · DEC '+fmt(g.center?.[1])+' · FOV '+fmt(g.fov)+'° · ROT '+Number(g.rot||0).toFixed(2)+'° · separation '+Number(g.sep||0).toFixed(6)+'°':'NOT VERIFIED';const rg=m?.p?.registration||{};Q('#analysisEvidence0015').textContent='IMAGE FEATURES: centroid x '+(Number.isFinite(f.cx)?f.cx.toFixed(3):'—')+', y '+(Number.isFinite(f.cy)?f.cy.toFixed(3):'—')+' · footprint '+(Number.isFinite(f.occupancy)?f.occupancy.toFixed(3):'—')+' · major-axis angle '+(Number.isFinite(f.angle)?f.angle.toFixed(1)+'°':'—')+' · elongation '+(Number.isFinite(f.elong)?f.elong.toFixed(2):'—')+'\\nREGISTRATION: '+(rg.method||'browser regression')+' · precomputed matches '+(rg.matches??'—')+' · inliers '+(rg.inliers??'—')+' · warning '+(rg.warning||'none')+'\\nSEARCH: zoom-out/coarse FoV regression → center refinement → orientation trial → fine FoV regression.\\nSELECTED: RA '+fmt(a.ra)+' · DEC '+fmt(a.dec)+' · FOV '+fmt(a.fov)+'° · ROT '+Number(a.rot||0).toFixed(2)+'°\\nALADIN GATE: '+(g.ok?'PASS; live target read-back matched commanded candidate':'FAIL / not verified');setAnalysisState0015(g.ok?'ANALYZED + ALADIN VERIFIED':'ANALYZED / NOT VERIFIED',g.ok?'good':'bad')}\nfunction landmarkPoints0015(d,maxN=16){const w=d.width,h=d.height,p=d.data,L=new Float32Array(w*h),vals=[];for(let i=0,j=0;i<p.length;i+=4,j++){const y=.2126*p[i]+.7152*p[i+1]+.0722*p[i+2];L[j]=y;vals.push(y)}vals.sort((a,b)=>a-b);const th=vals[Math.floor(vals.length*.965)]||220,cand=[];for(let y=2;y<h-2;y++)for(let x=2;x<w-2;x++){const i=y*w+x,v=L[i];if(v<th)continue;if(v<L[i-1]||v<L[i+1]||v<L[i-w]||v<L[i+w]||v<L[i-w-1]||v<L[i-w+1]||v<L[i+w-1]||v<L[i+w+1])continue;const edge=Math.abs(L[i+1]-L[i-1])+Math.abs(L[i+w]-L[i-w]);cand.push({x,y,s:v+edge*.5})}cand.sort((a,b)=>b.s-a.s);const out=[];for(const c of cand){if(out.every(o=>(o.x-c.x)**2+(o.y-c.y)**2>64)){out.push(c);if(out.length>=maxN)break}}return out}\nasync function drawOverlay0015(){clearOverlay0015();if(!markersVisible0015)return;const x=current?.(),c=Q('#sourceOverlay');if(!x||!c)return;try{const im=await loadImage(imageOf(x.r)),d=imageDataFromImage(im,ANALYSIS_SIZE),f=features(d),pts=landmarkPoints0015(d),g=c.getContext('2d');c.width=ANALYSIS_SIZE;c.height=ANALYSIS_SIZE;g.lineWidth=1.4;for(const p of pts){g.beginPath();g.arc(p.x,p.y,3.2,0,Math.PI*2);g.strokeStyle='rgba(66,220,255,.95)';g.stroke()}if(f?.ok){const cx=f.cx*ANALYSIS_SIZE,cy=f.cy*ANALYSIS_SIZE;g.strokeStyle='rgba(87,227,155,.98)';g.beginPath();g.moveTo(cx-7,cy);g.lineTo(cx+7,cy);g.moveTo(cx,cy-7);g.lineTo(cx,cy+7);g.stroke();const a=f.angle*Math.PI/180,len=Math.min(ANALYSIS_SIZE*.36,Math.max(18,(f.major||.3)*ANALYSIS_SIZE*.55));g.strokeStyle='rgba(255,209,102,.98)';g.beginPath();g.moveTo(cx-Math.cos(a)*len,cy-Math.sin(a)*len);g.lineTo(cx+Math.cos(a)*len,cy+Math.sin(a)*len);g.stroke()}}catch(e){Q('#analysisEvidence0015').textContent+='\\nSOURCE OVERLAY unavailable: '+e.message}}\nconst originalShow0015=showCurrent;showCurrent=async function(...args){clearOverlay0015();setAnalysisState0015('NOT ANALYZED','warn');Q('#selected0015').textContent='RA — · DEC — · FOV — · ROT —';Q('#verified0015').textContent='NOT VERIFIED';Q('#analysisEvidence0015').textContent='Press ANALYZE CURRENT. No candidate has been accepted for this record yet.';const out=await originalShow0015(...args);renderPrecomputed0015();return out};\nconst originalAnalyze0015=analyzeCurrent;analyzeCurrent=async function(...args){setAnalysisState0015('ANALYZING…','warn');Q('#analysisEvidence0015').textContent='Analyzing authoritative source image, testing FoV/center/orientation candidates, and verifying final Aladin placement…';clearOverlay0015();const out=await originalAnalyze0015(...args);renderFinal0015();await drawOverlay0015();return out};\nQ('#analyzeBtn').onclick=analyzeCurrent;Q('#toggleMarkers0015').onclick=()=>{markersVisible0015=!markersVisible0015;Q('#toggleMarkers0015').textContent=markersVisible0015?'HIDE MARKERS':'SHOW MARKERS';if(markersVisible0015)drawOverlay0015();else clearOverlay0015()};setTimeout(()=>{renderPrecomputed0015();if(currentAnalysis){renderFinal0015();drawOverlay0015()}},1200);\n})();\n<\/script>`;
