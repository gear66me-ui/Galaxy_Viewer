<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Galaxy Viewer Astroalign Sandbox 0001</title></head><body><div id="gv-bootstrap" style="font:14px system-ui;padding:20px;background:#05080d;color:#eef5ff;min-height:100vh">Loading Astroalign Sandbox 0001…</div><script>
'use strict';
(async()=>{
const BASE='https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/fcf413428accb443b7d29ddb880493252bf98729/viewer/image-databases/master-database/orientation-review/gv-astrometry-sandbox-0010.html';
const engine=async function(){
const ECO='ASTROALIGN-0001B-BRIGHTEST-CENTROIDS',PY='https://cdn.jsdelivr.net/pyodide/v0.28.2/full/pyodide.js';let py=null,ready=null;
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(Error('script load failed: '+src));document.head.appendChild(s)})}
function pressFeedback(){const b=$('#aaRun');if(!b)return;b.textContent='PRESSED ✓ — STARTING';b.style.background='#0f7a3d';b.style.boxShadow='0 0 18px #65e7a4';action('ASTROALIGN BUTTON PRESSED ✓','good');setTimeout(()=>{if(!busy){b.textContent='RUN ASTROALIGN';b.style.background='#14532d';b.style.boxShadow='none'}},700)}
async function runtime(){if(ready)return ready;ready=(async()=>{action('ASTROALIGN · LOADING PYTHON','warn');$('#aaRuntime').textContent='LOADING PYTHON…';if(typeof loadPyodide!=='function')await loadScript(PY);py=await loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.28.2/full/'});$('#aaRuntime').textContent='LOADING PACKAGES…';await py.loadPackage(['numpy','scipy','scikit-image','micropip']);action('ASTROALIGN · INSTALLING 2.6.2','warn');$('#aaRuntime').textContent='INSTALLING ASTROALIGN…';await py.runPythonAsync("import micropip\nawait micropip.install('astroalign==2.6.2')\nimport astroalign, numpy as np\n");$('#aaRuntime').textContent='READY · 2.6.2';log('ASTROALIGN RUNTIME READY',{eco:ECO,astroalign:'2.6.2',pyodide:'0.28.2'});return py})().catch(e=>{ready=null;$('#aaRuntime').textContent='LOAD FAILED · '+String(e?.message||e);throw e});return ready}
function brightestCentroids(d,max=18,minSep=.055){const m=features(d),all=detectStars(d,m)||[];const ranked=[...all].filter(p=>Number.isFinite(+p.x)&&Number.isFinite(+p.y)).sort((a,b)=>(+b.b||0)-(+a.b||0));const out=[];for(const p of ranked){if(out.length>=max)break;if(out.every(q=>Math.hypot(p.x-q.x,p.y-q.y)>=minSep))out.push(p)}for(const p of ranked){if(out.length>=max)break;if(!out.includes(p))out.push(p)}return{all,selected:out}}
function draw(sel,pts,color,prefix='B'){const c=$(sel),r=c.parentElement.getBoundingClientRect();c.width=Math.round(r.width*devicePixelRatio);c.height=Math.round(r.height*devicePixelRatio);c.style.width=r.width+'px';c.style.height=r.height+'px';const g=c.getContext('2d');g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);g.clearRect(0,0,r.width,r.height);g.strokeStyle=color;g.fillStyle=color;g.lineWidth=3;g.font='bold 12px monospace';pts.forEach((p,i)=>{const x=p[0]/512*r.width,y=p[1]/512*r.height;g.beginPath();g.arc(x,y,13,0,Math.PI*2);g.stroke();g.fillText(prefix+(i+1),x+15,y-8)})}
function pxPoints(P,w,h){return P.map(p=>[p.x*w,p.y*h])}
async function run(){pressFeedback();const b=$('#aaRun');const old='RUN ASTROALIGN';if(busy){action('ASTROALIGN ALREADY RUNNING','warn');return}busy=true;try{b.disabled=false;b.textContent='ASTROALIGN RUNNING…';b.style.background='#0f7a3d';if(!record)throw Error('NO RECORD LOADED — press LOAD RECORD first');if(!aladin)throw Error('ALADIN NOT READY');if(!$('#source')?.complete||!$('#source')?.naturalWidth)throw Error('CATALOG IMAGE NOT READY');$('#status').textContent='ASTROALIGN';$('#status').className='warn';await runtime();clearAnchorOverlays();action('ASTROALIGN · CAPTURING CURRENT FRAMES','warn');const s=imageDataFromImage($('#source')),u=await captureAladin(),t=await imageDataFromUrl(u);const SB=brightestCentroids(s,18,.055),TB=brightestCentroids(t,30,.035),spx=pxPoints(SB.selected,s.width,s.height),tpx=pxPoints(TB.selected,t.width,t.height);$('#aaSourceBright').textContent=SB.selected.length+' / '+SB.all.length;$('#aaTargetBright').textContent=TB.selected.length+' / '+TB.all.length;draw('#sourceAnchors',spx,'#ffd166','S');draw('#aladinAnchors',tpx,'#ffd166','T');log('BRIGHTEST CENTROIDS SELECTED',{eco:ECO,source_total_detected:SB.all.length,source_selected:SB.selected.map(p=>({x:p.x,y:p.y,brightness:+p.b||0})),aladin_total_detected:TB.all.length,aladin_selected:TB.selected.map(p=>({x:p.x,y:p.y,brightness:+p.b||0}))});if(SB.selected.length<3||TB.selected.length<3)throw Error('FEWER THAN 3 BRIGHT CENTROIDS');py.globals.set('src_pts',spx);py.globals.set('tgt_pts',tpx);action('ASTROALIGN · MATCHING BRIGHTEST 3-STAR ASTERISMS','warn');const raw=await py.runPythonAsync(`
import json, numpy as np, astroalign as aa
S=np.asarray(src_pts.to_py(),dtype=float)
T=np.asarray(tgt_pts.to_py(),dtype=float)
try:
 tr,(sp,tp)=aa.find_transform(S,T,max_control_points=50)
 sp=np.asarray(sp,float); tp=np.asarray(tp,float); pred=np.asarray(tr(sp),float); rr=np.sqrt(np.sum((pred-tp)**2,axis=1)) if len(sp) else np.array([])
 out={'ok':True,'scale':float(tr.scale),'rotation_deg':float(np.degrees(tr.rotation)),'translation':[float(tr.translation[0]),float(tr.translation[1])],'matched':int(len(sp)),'rms_px':float(np.sqrt(np.mean(rr**2))) if len(rr) else None,'median_px':float(np.median(rr)) if len(rr) else None,'max_px':float(np.max(rr)) if len(rr) else None,'source_points':sp.tolist(),'target_points':tp.tolist(),'matrix':np.asarray(tr.params,float).tolist()}
except Exception as e: out={'ok':False,'error':type(e).__name__+': '+str(e)}
json.dumps(out)
`);const R=JSON.parse(String(raw));if(!R.ok)throw Error(R.error);draw('#sourceAnchors',R.source_points,'#5ee7ff','A');draw('#aladinAnchors',R.target_points,'#65e7a4','A');const rot=((R.rotation_deg%360)+360)%360,pass=R.matched>=4&&Number.isFinite(R.rms_px)&&R.rms_px<=6&&R.scale>.08&&R.scale<12.5;$('#aaMatches').textContent=R.matched+' stars';$('#aaRot').textContent=rot.toFixed(3)+'°';$('#aaScale').textContent=R.scale.toFixed(6);$('#aaResidual').textContent=R.rms_px.toFixed(3)+' px RMS';$('#sBestRot').textContent=rot.toFixed(2)+'°';$('#sStar').textContent=R.matched+' Astroalign correspondences';$('#sConsensus').textContent=R.rms_px.toFixed(2)+' px RMS · '+R.median_px.toFixed(2)+' px median';$('#status').textContent=pass?'ASTROALIGN PASS':'ASTROALIGN REVIEW';$('#status').className=pass?'good':'warn';action((pass?'ASTROALIGN PASS':'ASTROALIGN REVIEW')+' · '+R.matched+' MATCHES · ROT '+rot.toFixed(2)+'° · SCALE '+R.scale.toFixed(4)+' · RMS '+R.rms_px.toFixed(2)+' px',pass?'good':'warn');log('ASTROALIGN RESULT',{eco:ECO,record:record?.name||record?.archiveId||null,visible_state:readLiveState(),brightest_only:true,result:R,acceptance:{pass,min_matches:4,max_rms_px:6,scale_range:[.08,12.5]}})}catch(e){$('#status').textContent='NO SOLUTION';$('#status').className='bad';action('ASTROALIGN NO SOLUTION · '+String(e?.message||e),'bad');log('ASTROALIGN FAILURE',{eco:ECO,message:String(e?.message||e),stack:String(e?.stack||'')},'ERROR')}finally{busy=false;b.disabled=false;b.textContent=old;b.style.background='#14532d';b.style.boxShadow='none'}}
function install(){const orient=$('#orient');if(!orient||$('#aaRun'))return;document.title='Galaxy Viewer Astroalign Sandbox 0001B';const h=document.querySelector('main section.panel strong');if(h)h.textContent='GALAXY VIEWER ASTROALIGN SANDBOX 0001B';const hint=document.querySelector('main section.panel .hint');if(hint)hint.textContent='Astroalign test using BRIGHTEST detected centroids only. The old Fourier decision path is bypassed. Button feedback is immediate.';const b=document.createElement('button');b.id='aaRun';b.textContent='RUN ASTROALIGN';b.disabled=false;b.style.cssText='background:#14532d;color:#fff;font-weight:900;border:2px solid #65e7a4;min-width:155px';b.addEventListener('pointerdown',pressFeedback,{passive:true});b.addEventListener('click',run);orient.insertAdjacentElement('afterend',b);const p=document.createElement('section');p.className='panel';p.innerHTML='<strong>ASTROALIGN 2.6.2 — BRIGHTEST-CENTROID EVIDENCE</strong><div class="readouts" style="margin-top:7px"><div class="readout">RUNTIME<b id="aaRuntime">NOT LOADED</b></div><div class="readout">SOURCE BRIGHT<b id="aaSourceBright">—</b></div><div class="readout">ALADIN BRIGHT<b id="aaTargetBright">—</b></div><div class="readout">MATCHED STARS<b id="aaMatches">—</b></div><div class="readout">ROTATION<b id="aaRot">—</b></div><div class="readout">SCALE<b id="aaScale">—</b></div><div class="readout">RESIDUAL<b id="aaResidual">—</b></div><div class="readout">METHOD<b>BRIGHTEST CENTROIDS → 3-STAR ASTERISMS</b></div></div><div class="hint" style="margin-top:7px">Yellow circles first show the brightest centroids submitted to Astroalign. Cyan/green circles show only the accepted correspondences. No faint-star ranking. No 180° fallback.</div>';$('.statusrow').insertAdjacentElement('afterend',p);log('ASTROALIGN 0001B READY',{eco:ECO,button_always_live:true,immediate_press_feedback:true,brightest_centroids_only:true,existing_solvers_modified:false})}install()};
const PATCH='<script>('+engine.toString()+')();<'+'/script>';const r=await fetch(BASE,{cache:'no-store'});if(!r.ok)throw Error('baseline HTTP '+r.status);let html=await r.text();html=html.replace('</body>',PATCH+'\n</body>');document.open();document.write(html);document.close();
})().catch(e=>{document.getElementById('gv-bootstrap').textContent='BOOTSTRAP FAILED — '+String(e?.message||e)});
</script></body></html>
