async function createAladin(){await A.init;$('#aladin').innerHTML='';const F=fov(rec.fieldOfView)||.1;aladin=A.aladin('#aladin',{survey:$('#survey').value,target:rec.ra+' '+rec.dec,fov:F,projection:'TAN',cooFrame:'ICRSd',lockNorthUp:false,showReticle:true,showCooGrid:true,showZoomControl:true,showLayersControl:true,inertia:false});await sleep(350);apply({ra:rec.ra,dec:rec.dec,fov:F,rot:0,survey:$('#survey').value})}
function imageDataFromImage(im,size=PX){const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d',{willReadFrequently:true});g.fillStyle='#000';g.fillRect(0,0,size,size);const s=Math.min(size/im.naturalWidth,size/im.naturalHeight),w=im.naturalWidth*s,h=im.naturalHeight*s;g.drawImage(im,(size-w)/2,(size-h)/2,w,h);return g.getImageData(0,0,size,size)}
function luminance(d){const p=d.data,L=new Float32Array(d.width*d.height);for(let i=0,j=0;i<p.length;i+=4,j++)L[j]=.2126*p[i]+.7152*p[i+1]+.0722*p[i+2];return L}
function morphology(d){const w=d.width,h=d.height,L=luminance(d),v=[];for(let i=0;i<L.length;i+=8)v.push(L[i]);v.sort((a,b)=>a-b);const th=v[Math.floor(v.length*.84)]||0;let sw=0,sx=0,sy=0;for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const z=Math.max(0,L[y*w+x]-th);if(z){sw+=z;sx+=z*x;sy+=z*y}}if(sw<1)return{ok:false};const cx=sx/sw,cy=sy/sw;let xx=0,yy=0,xy=0;for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const z=Math.max(0,L[y*w+x]-th);if(!z)continue;const dx=x-cx,dy=y-cy;xx+=z*dx*dx;yy+=z*dy*dy;xy+=z*dx*dy}xx/=sw;yy/=sw;xy/=sw;const tr=xx+yy,de=Math.sqrt((xx-yy)**2+4*xy*xy),l1=Math.max(1e-6,(tr+de)/2),l2=Math.max(1e-6,(tr-de)/2),elong=Math.sqrt(l1/l2),angle=.5*Math.atan2(2*xy,xx-yy)*180/Math.PI,major=Math.sqrt(l1)*4/w,minor=Math.sqrt(l2)*4/h;return{ok:true,cx:cx/w,cy:cy/h,elong,angle,major,minor,occupancy:Math.max(major,minor)}}
function brightSpots(d,max=28){const w=d.width,h=d.height,L=luminance(d),vals=[];for(let i=0;i<L.length;i+=16)vals.push(L[i]);vals.sort((a,b)=>a-b);const med=vals[Math.floor(vals.length*.5)]||0,ths=[.985,.97,.94,.90].map(q=>Math.max(vals[Math.floor(vals.length*q)]||0,med+10)),raw=[];for(let pass=0;pass<ths.length;pass++){const th=ths[pass];for(let y=4;y<h-4;y+=2)for(let x=4;x<w-4;x+=2){let bx=x,by=y,bv=L[y*w+x];for(let yy=y-1;yy<=y+1;yy++)for(let xx=x-1;xx<=x+1;xx++){const z=L[yy*w+xx];if(z>bv){bv=z;bx=xx;by=yy}}if(bv<th)continue;let core=0,ring=0,cn=0,rn=0;for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){const z=L[(by+dy)*w+bx+dx];if(Math.hypot(dx,dy)<=1.5){core+=z;cn++}else if(Math.hypot(dx,dy)<=3.5){ring+=z;rn++}}const compact=core/cn-ring/rn;if(compact<2)continue;raw.push({x:bx/w,y:by/h,b:bv-med,compact,pass,score:(bv-med)+3*compact})}}const m=[];for(const p of raw.sort((a,b)=>b.score-a.score)){const q=m.find(z=>Math.hypot(z.x-p.x,z.y-p.y)<.014);if(q){q.score=Math.max(q.score,p.score);q.b=Math.max(q.b,p.b);q.compact=Math.max(q.compact,p.compact);q.persistence=(q.persistence||1)|(1<<p.pass)}else m.push({...p,persistence:1<<p.pass})}for(const p of m){let iso=1;for(const q of m)if(p!==q)iso=Math.min(iso,Math.hypot(p.x-q.x,p.y-q.y));p.isolation=iso;p.rank=p.score*(1+Math.min(.7,iso*3))}return m.sort((a,b)=>b.rank-a.rank).slice(0,max)}

function overlay(id){const c=$(id),r=c.getBoundingClientRect();c.width=Math.max(1,Math.round(r.width));c.height=Math.max(1,Math.round(r.height));const g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);g.font='bold 12px monospace';return{g,w:c.width,h:c.height}}
function drawAnchors(points){const o=overlay('#srcOverlay');points.forEach((p,i)=>{const x=p.x*o.w,y=p.y*o.h;o.g.strokeStyle='#5ee7ff';o.g.fillStyle='#5ee7ff';o.g.lineWidth=3;o.g.beginPath();o.g.arc(x,y,16,0,Math.PI*2);o.g.stroke();o.g.fillText('A'+String(i+1).padStart(2,'0'),x+18,y-10)})}
async function captureAladin(){if(typeof aladin?.getViewDataURL==='function'){const x=aladin.getViewDataURL('image/png'),u=x&&typeof x.then==='function'?await x:x;if(typeof u==='string'&&u.startsWith('data:image'))return u}const cs=[...$('#aladin').querySelectorAll('canvas')].filter(c=>c.width>32&&c.height>32).sort((a,b)=>b.width*b.height-a.width*a.height);if(!cs.length)throw Error('no Aladin canvas');return cs[0].toDataURL('image/png')}

function pairDistances(P){const a=[];for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const d=Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y);if(d>.03)a.push(d)}return a}

async function solveFov(start,S,srcM,klass){const factors=[.30,.42,.58,.75,1,1.3,1.7,2.2,3.0];let best=null;for(let i=0;i<factors.length;i++){const F=clamp(start.fov*factors[i],.00001,180);stat('FOV '+(i+1)+'/'+factors.length+' · '+F.toFixed(5)+'°');apply({...start,fov:F});await sleep(430);const an=await aladinAnalysis(),metric=klass==='POINT-RICH'?fovMetric(S,selectBright(an.pts,16,.045)):Math.min(fovMetric(S,selectBright(an.pts,16,.045)),morphMetric(srcM,an.m));log('FOV SAMPLE',{F,metric});if(!best||metric<best.metric)best={F,metric}}for(const z of [.78,.88,.95,1,1.05,1.14,1.28]){const F=clamp(best.F*z,.00001,180);apply({...start,fov:F});await sleep(400);const an=await aladinAnalysis(),metric=klass==='POINT-RICH'?fovMetric(S,selectBright(an.pts,16,.045)):Math.min(fovMetric(S,selectBright(an.pts,16,.045)),morphMetric(srcM,an.m));if(metric<best.metric)best={F,metric}}apply({...start,fov:best.F});await sleep(450);log('FOV FINAL',best);return best}

async function runAuto(){if(!rec||!aladin||busy)return;busy=true;const start=state(),btn=$('#auto');btn.disabled=true;try{audit=[];stat('CLASSIFYING');overlay('#srcOverlay');overlay('#aliOverlay');const sd=imageDataFromImage($('#source')),sm=morphology(sd),all=brightSpots(sd),klass=classify(sm,all),passes=[4,6,9,14];$('#rClass').textContent=klass;log('CLASSIFY',{class:klass,morphology:sm,bright_spots:all.length});let S,fv,rr;for(const count of passes){S=selectBright(all,count,.07);drawAnchors(S);$('#rAnchors').textContent=S.length+' strongest';log('BRIGHT PASS',{count,anchors:S});fv=await solveFov(start,S,sm,klass);$('#rBestFov').textContent=fv.F.toFixed(6)+'°';rr=await solveRotation(start,S,sm,fv.F,klass);log('ROT PASS',{count,rotation:rr.r,matches:rr.g.matches,mean_px:rr.g.mean*PX,coverage:rr.g.coverage,morph_metric:rr.mm});if(rr.g.matches>=Math.min(5,Math.max(3,Math.ceil(S.length*.55)))&&rr.g.coverage>=.5&&rr.g.mean<=GATE*.8)break}const trusted=rr&&rr.g.matches>=3&&rr.g.coverage>=.5&&rr.g.mean<=GATE*.8;$('#rBestRot').textContent=rr?rr.r.toFixed(2)+'°':'—';$('#rConsensus').textContent=rr?(rr.g.matches+' matches · '+(rr.g.mean*PX).toFixed(1)+' px · '+Math.round(rr.g.coverage*100)+'%'):'—';lastResult={class:klass,start,fov:fv,rotation:rr,trusted};if(trusted){apply({...start,fov:fv.F,rot:rr.r});stat('TRUSTED · '+klass+' · ROT '+rr.r.toFixed(2)+'°','good')}else{apply(start);stat('REJECTED · START RESTORED','bad')}log('FINAL',lastResult)}catch(e){apply(start);stat('FAILED · '+String(e.message||e),'bad');log('ERROR',{message:String(e.message||e),stack:String(e.stack||'')})}finally{busy=false;btn.disabled=false}}
async function fetchCatalog(){stat('FETCHING');const r=await fetch(CAT[$('#mission').value],{cache:'no-store'});if(!r.ok)throw Error('catalog HTTP '+r.status);catalog=entries(await r.json()).map(slim).filter(x=>x.ra!=null&&x.dec!=null&&x.images.length);$('#idx').max=catalog.length;await loadRecord(0)}
async function loadRecord(i){ri=clamp(i,0,catalog.length-1);rec=catalog[ri];$('#idx').value=ri+1;$('#rRecord').textContent=(ri+1)+' / '+catalog.length+' · '+rec.name;$('#rClass').textContent='—';$('#rBestFov').textContent='—';$('#rBestRot').textContent='—';$('#rConsensus').textContent='—';stat('LOADING');await createAladin();await loadImage(rec.images[0]);$('#auto').disabled=false;stat('READY','good');log('LOAD',{index:ri+1,name:rec.name,ra:rec.ra,dec:rec.dec,catalog_fov:fov(rec.fieldOfView),catalog_rotation:rec.orientation})}
$('#fetch').onclick=()=>fetchCatalog().catch(e=>stat('FAIL '+e.message,'bad'));$('#load').onclick=()=>loadRecord(+$('#idx').value-1).catch(e=>stat('FAIL '+e.message,'bad'));$('#prev').onclick=()=>loadRecord(ri-1).catch(e=>stat('FAIL '+e.message,'bad'));$('#next').onclick=()=>loadRecord(ri+1).catch(e=>stat('FAIL '+e.message,'bad'));$('#survey').onchange=()=>{if(aladin)apply({...state(),survey:$('#survey').value})};$('#auto').onclick=runAuto;$('#save').onclick=()=>{const a=document.createElement('a'),b=new Blob([JSON.stringify({result:lastResult,audit},null,2)],{type:'application/json'});a.href=URL.createObjectURL(b);a.download='gv-astrometry-0011-'+Date.now()+'.json';a.click()};stat('READY TO FETCH','good');
</script></body></html>
