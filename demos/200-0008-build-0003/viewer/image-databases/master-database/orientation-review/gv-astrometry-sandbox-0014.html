function angleDiff(a,b){let d=Math.abs(a-b)%180;if(d>90)d=180-d;return d}
async function fovSolve(start,S,srcFoot){let best=null;const factors=[.25,.4,.65,1,1.6,2.5,4,6.5,10];log('FOV START',{catalog_or_start_fov:start.fov,source_footprint:srcFoot,candidates:factors.map(x=>start.fov*x)});for(let i=0;i<factors.length;i++){const F=clamp(start.fov*factors[i],.00001,180);stat('FOV '+(i+1)+'/'+factors.length+' · '+F.toFixed(6));apply({...start,fov:F});await sleep(500);const q=await snap(),A=selectBright(q.spots,Math.max(12,S.length*2),.04),pair=scaleMetric(S,A),macro=footprintScore(srcFoot,q.fp),metric=macro.score+Math.min(2,pair)*.35;log('FOV SAMPLE',{stage:'coarse',F,metric,pair_metric:pair,macro,aladin_footprint:q.fp});if(macro.pass&&(!best||metric<best.metric))best={F,metric,pair,macro,fp:q.fp}}if(!best){log('FOV FAILED',{stage:'coarse',reason:'NO_MACROSCOPIC_CANDIDATE_PASSED'});throw Error('FOV FAILED · no macroscopic candidate passed')}const base=best.F,refine=[.62,.75,.86,.94,1,1.08,1.2,1.38,1.6];for(let i=0;i<refine.length;i++){const F=clamp(base*refine[i],.00001,180);stat('FOV REFINE '+(i+1)+'/'+refine.length+' · '+F.toFixed(6));apply({...start,fov:F});await sleep(470);const q=await snap(),A=selectBright(q.spots,Math.max(12,S.length*2),.04),pair=scaleMetric(S,A),macro=footprintScore(srcFoot,q.fp),metric=macro.score+Math.min(2,pair)*.35;log('FOV SAMPLE',{stage:'refine',F,metric,pair_metric:pair,macro,aladin_footprint:q.fp});if(macro.pass&&metric<best.metric)best={F,metric,pair,macro,fp:q.fp}}apply({...start,fov:best.F});await sleep(500);$('#rBestFov').textContent=best.F.toFixed(6)+'°';log('FOV FINAL',{...best,accepted:true});return best}
async function rotationSolve(start,S,F,cls,srcMorph){let best=null;const rots=[];if(cls==='AXIS-DOMINANT'&&srcMorph.ok){for(const d of [0,180])for(let o=-30;o<=30;o+=10)rots.push(norm(start.rot+srcMorph.angle+d+o))}else for(let d=0;d<360;d+=15)rots.push(norm(start.rot+d));for(let i=0;i<rots.length;i++){const r=rots[i];stat('ROT '+(i+1)+'/'+rots.length+' '+r.toFixed(0)+'°');apply({...start,fov:F,rot:r});await sleep(390);const q=await snap(),A=selectBright(q.spots,Math.max(14,S.length*2),.04),g=translateMatch(S,A),axis=srcMorph.ok&&q.m.ok?angleDiff(srcMorph.angle,q.m.angle):45,axisBonus=(cls==='AXIS-DOMINANT'||cls==='STRUCTURE-DOMINANT')?Math.max(0,35-axis):0,score=g.matches*100+g.coverage*50-g.mean*1000+axisBonus;if(!best||score>best.score)best={r,g,axis,score}}const c=best.r;for(let d=-10;d<=10;d+=2){const r=norm(c+d);apply({...start,fov:F,rot:r});await sleep(340);const q=await snap(),A=selectBright(q.spots,Math.max(14,S.length*2),.04),g=translateMatch(S,A),axis=srcMorph.ok&&q.m.ok?angleDiff(srcMorph.angle,q.m.angle):45,axisBonus=(cls==='AXIS-DOMINANT'||cls==='STRUCTURE-DOMINANT')?Math.max(0,35-axis):0,score=g.matches*100+g.coverage*50-g.mean*1000+axisBonus;if(score>best.score)best={r,g,axis,score}}apply({...start,fov:F,rot:best.r});await sleep(450);$('#rBestRot').textContent=best.r.toFixed(2)+'°';log('ROT FINAL',{rotation:best.r,matches:best.g.matches,mean:best.g.mean,coverage:best.g.coverage,axis_error:best.axis,score:best.score});return best}
async function auto(){if(busy||!rec)return;busy=true;const b=$('#auto');b.disabled=true;const start=state();try{overlay('#srcOverlay');overlay('#aliOverlay');const d=imageDataFromImage($('#source')),m=morphology(d),srcFoot=footprint(d),all=brightSpots(d,32),cls=classify(m,all);$('#rClass').textContent=cls;log('CLASSIFY',{class:cls,morphology:m,source_footprint:srcFoot,bright_candidates:all.length,largest_first:all.slice(0,12).map(p=>({x:p.x,y:p.y,energy:p.energy,area:p.area,peak:p.b,rank:p.rank}))});const passes=cls==='POINT-RICH'?[4,6,9,14]:cls==='AXIS-DOMINANT'?[6,9,14]:[6,10,16];let winner=null;for(const count of passes){const S=selectBright(all,count,.065);draw(S);log('BRIGHT PASS START',{class:cls,count,anchors:S.map(p=>({x:p.x,y:p.y,energy:p.energy,area:p.area,peak:p.b,rank:p.rank}))});const fv=await fovSolve(start,S,srcFoot);log('FOV GATE PASS',{fov:fv.F,metric:fv.metric,macro:fv.macro});const rr=await rotationSolve(start,S,fv.F,cls,m);const trusted=rr.g.matches>=Math.min(5,Math.max(4,Math.ceil(S.length*.45)))&&rr.g.coverage>=.5&&rr.g.mean<=GATE*.72&&(cls!=='AXIS-DOMINANT'||rr.axis<=18);log('BRIGHT PASS RESULT',{count,fov:fv,rotation:rr.r,matches:rr.g.matches,coverage:rr.g.coverage,mean:rr.g.mean,axis_error:rr.axis,trusted});winner={count,S,fv,rr,trusted};if(trusted)break}lastResult={class:cls,start,winner};$('#rConsensus').textContent=winner.rr.g.matches+' matches · '+Math.round(winner.rr.g.coverage*100)+'% · '+(winner.rr.g.mean*512).toFixed(1)+' px';if(winner.trusted){apply({...start,fov:winner.fv.F,rot:winner.rr.r});stat('TRUSTED '+cls,'good');log('AUTO FINAL',{accepted:true,class:cls,fov:winner.fv.F,rotation:winner.rr.r,pass_anchors:winner.count})}else{apply(start);stat('REJECTED · START RESTORED','bad');log('AUTO FINAL',{accepted:false,class:cls,reason:'NO TRUSTED PASS'})}}catch(e){apply(start);const msg=String(e?.message||e);stat(msg.startsWith('FOV FAILED')?msg:'FAIL '+msg,'bad');log(msg.startsWith('FOV FAILED')?'FOV FAILED':'FAIL',{message:msg,stack:String(e?.stack||'')})}finally{busy=false;b.disabled=false}}
async function fetchCatalog(){audit=[];const m=$('#mission').value;stat('FETCHING '+m);const r=await fetch(CAT[m],{cache:'no-store'});if(!r.ok)throw Error('catalog HTTP '+r.status);catalog=entries(await r.json()).map(slim).filter(x=>x.ra!=null&&x.dec!=null&&x.images.length);$('#idx').max=catalog.length;log('CATALOG',{mission:m,records:catalog.length});await loadRecord(0)}
async function loadRecord(i){ri=clamp(i,0,catalog.length-1);rec=catalog[ri];$('#idx').value=ri+1;$('#rRecord').textContent=(ri+1)+' / '+catalog.length+' · '+rec.name;$('#rClass').textContent='—';$('#rBestFov').textContent='—';$('#rBestRot').textContent='—';$('#rConsensus').textContent='—';stat('LOADING');await createAladin();let loaded=null,last=null;for(let k=0;k<rec.images.length;k++){try{stat('LOADING IMAGE '+(k+1)+'/'+rec.images.length);await loadImage(rec.images[k]);loaded=rec.images[k];break}catch(e){last=e;log('IMAGE CANDIDATE FAIL',{candidate:k+1,url:rec.images[k],message:String(e?.message||e)})}}if(!loaded)throw Error('all image candidates failed: '+String(last?.message||last||'unknown'));$('#auto').disabled=false;stat('READY','good');log('LOAD',{index:ri+1,name:rec.name,ra:rec.ra,dec:rec.dec,catalog_fov:fov(rec.fieldOfView),catalog_rotation:rec.orientation,image_url:loaded,image_candidates:rec.images.length})}
$('#fetch').onclick=()=>fetchCatalog().catch(e=>{stat('FAIL '+e.message,'bad');log('FAIL',{message:e.message})});$('#prev').onclick=()=>loadRecord(ri-1).catch(e=>stat('FAIL '+e.message,'bad'));$('#next').onclick=()=>loadRecord(ri+1).catch(e=>stat('FAIL '+e.message,'bad'));$('#load').onclick=()=>loadRecord(Number($('#idx').value)-1).catch(e=>stat('FAIL '+e.message,'bad'));$('#auto').onclick=auto;$('#survey').onchange=()=>{if(rec)apply({...state(),survey:$('#survey').value})};$('#save').onclick=()=>{const b=new Blob([JSON.stringify({sandbox:'0014',record:rec,index:ri,result:lastResult,audit},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='gv-astrometry-0014-'+Date.now()+'.json';a.click()};stat('READY');log('BOOT',{sandbox:'0014',engine:'025A',gate:GATE,transport:['DIRECT','MIRROR','WORKER'],anchor_passes:true,largest_brightest_first:true,classifier:true,fov_first:true,fov_hard_gate:true});
</script></body></html>
