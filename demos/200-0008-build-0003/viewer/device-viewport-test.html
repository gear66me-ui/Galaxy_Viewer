<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Galaxy Viewer — Device Viewport</title>
<style>
html,body{margin:0;min-height:100%;background:#05070b;color:#f5f7ff;font-family:system-ui,-apple-system,sans-serif}
main{box-sizing:border-box;min-height:100vh;padding:24px 18px}
h1{margin:0 0 20px;font-size:25px}
.row{margin:10px 0;padding:14px;border:1px solid #65708a;border-radius:10px;background:#101521}
.label{font-size:13px;opacity:.72}
.value{font-size:32px;font-weight:700;line-height:1.15}
.note{margin-top:20px;font-size:16px;line-height:1.45}
</style>
</head>
<body>
<main>
<h1>Galaxy Viewer — Device Viewport</h1>
<div class="row"><div class="label">WINDOW WIDTH</div><div class="value" id="iw"></div></div>
<div class="row"><div class="label">WINDOW HEIGHT</div><div class="value" id="ih"></div></div>
<div class="row"><div class="label">SCREEN WIDTH</div><div class="value" id="sw"></div></div>
<div class="row"><div class="label">SCREEN HEIGHT</div><div class="value" id="sh"></div></div>
<div class="row"><div class="label">DEVICE PIXEL RATIO</div><div class="value" id="dpr"></div></div>
<div class="row"><div class="label">ORIENTATION</div><div class="value" id="ori"></div></div>
<div class="note">Take one screenshot of this page and send it to ChatGPT.</div>
</main>
<script>
function report(){
 iw.textContent=window.innerWidth;
 ih.textContent=window.innerHeight;
 sw.textContent=screen.width;
 sh.textContent=screen.height;
 dpr.textContent=window.devicePixelRatio;
 ori.textContent=screen.orientation?.type||((innerWidth>innerHeight)?'landscape':'portrait');
}
report();
addEventListener('resize',report);
screen.orientation?.addEventListener?.('change',report);
</script>
</body>
</html>
