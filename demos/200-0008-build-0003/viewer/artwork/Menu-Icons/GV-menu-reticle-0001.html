<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GV Reticle Icon 0001</title><style>:root{--live:#8feaff;--blue:#4fa6ff;--violet:#9d7cff;--off:#68747c}*{box-sizing:border-box}html,body{margin:0;background:#000;width:100%;height:100%}body{display:grid;place-items:center}.cell{width:64px;height:64px;border:1px solid #324754;border-radius:7px;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(35,80,110,.2),rgba(0,0,0,.92) 70%);cursor:pointer}.reticle{width:42px;height:42px;overflow:visible;color:var(--live);animation:wake 2.6s ease-in-out infinite;animation-delay:1600ms;filter:drop-shadow(0 0 2px rgba(143,234,255,.28))}.ring{fill:none;stroke:currentColor;stroke-width:1.8}.cross{stroke:var(--blue);stroke-width:1.5;stroke-linecap:round}.core{fill:var(--violet)}.off .reticle{color:var(--off);filter:none}.off .cross{stroke:#56636b}.off .core{fill:#56636b}@keyframes wake{0%,12%,100%{opacity:.58;filter:drop-shadow(0 0 1px rgba(143,234,255,.2))}18%{opacity:1;filter:drop-shadow(0 0 4px rgba(143,234,255,.95)) drop-shadow(0 0 11px rgba(79,166,255,.75)) drop-shadow(0 0 16px rgba(157,124,255,.38))}32%,88%{opacity:.72;filter:drop-shadow(0 0 2px rgba(143,234,255,.38))}}</style></head><body><div class="cell" id="cell" aria-label="Reticle toggle" role="button" tabindex="0"><svg class="reticle" viewBox="0 0 64 64" role="img" aria-label="Reticle"><ellipse class="ring" cx="32" cy="32" rx="21" ry="13"/><ellipse class="ring" cx="32" cy="32" rx="13" ry="21"/><path class="cross" d="M32 7v8M32 49v8M7 32h8M49 32h8"/><circle class="core" cx="32" cy="32" r="2.5"/></svg></div><script>const c=document.getElementById('cell');function toggle(){c.classList.toggle('off');c.setAttribute('aria-pressed',String(!c.classList.contains('off')))}c.addEventListener('click',toggle);c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});c.setAttribute('aria-pressed','true');</script></body></html>
