<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Galaxy Viewer — Particle Cyclone 0005</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#dff7ff;font-family:system-ui,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}.title{position:fixed;left:0;right:0;z-index:2;text-align:center;pointer-events:none;font-weight:700;letter-spacing:.28em;color:#dffcff;text-shadow:0 0 8px #00e5ff,0 0 18px #0077ff}.title.top{top:18px;font-size:clamp(18px,5vw,34px)}.title.bottom{bottom:82px;font-size:clamp(15px,4vw,28px)}.hint{position:fixed;top:58px;left:8px;right:8px;z-index:2;text-align:center;font-size:11px;color:#9dd8e8;pointer-events:none;text-shadow:0 1px 4px #000}.panel{position:fixed;left:8px;right:8px;bottom:8px;z-index:3;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border:1px solid rgba(98,216,255,.45);border-radius:10px;background:rgba(0,0,0,.74);font-size:12px}.panel button,.panel select{border:1px solid rgba(98,216,255,.55);border-radius:7px;background:#07121a;color:#e9fbff;padding:6px 8px;font:inherit}.panel label{display:flex;align-items:center;gap:4px;white-space:nowrap}.status{margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="title top">GALAXY</div>
<div class="hint">LOCAL CORE ROTATION · RELEASED CORNERS TWIST AND FALL · TIGHTENING ARCS</div>
<canvas id="c" aria-label="Tangential corner-release viscous drape cyclone"></canvas>
<div class="title bottom">VIEWER</div>
<div class="panel">
<button id="restart" type="button">Restart</button><button id="pause" type="button">Pause</button>
<label>Speed <select id="speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option><option value="2.5">2.5×</option><option value="3">3×</option><option value="3.5">3.5×</option><option value="4">4×</option></select></label>
<label><input id="trails" type="checkbox" checked> Trails</label><label><input id="guides" type="checkbox" checked> Guides</label>
<span class="status" id="status">0.00 s · 1× · 0 FPS · corners 4/4</span>
</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false});
const restartBtn=document.getElementById('restart'),pauseBtn=document.getElementById('pause'),speedSel=document.getElementById('speed'),trailsBox=document.getElementById('trails'),guidesBox=document.getElementById('guides'),status=document.getElementById('status');
const TAU=Math.PI*2,PHI=1.61803398875;
const cfg={cols:25,rows:37,total:4.8,spinEnd:2,horizon:.043,margin:.045,trailLength:10,sigma:.22,coreTurns:2,collapseTurns:2.4,cornerReleaseTurns:1.35,edgeReleaseTurns:.95,fieldReleaseTurns:.35};
let W=1,H=1,cx=0,cy=0,scale=1,maxR=1,particles=[],running=true,lastWall=0,simTime=0,speed=1,finished=false,pulseStart=0,fps=0,fpsFrames=0,fpsStamp=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};
function resize(){W=innerWidth;H=innerHeight;canvas.width=W;canvas.height=H;ctx.setTransform(1,0,0,1,0,0);cx=W/2;cy=H/2;scale=Math.min(W,H);maxR=Math.hypot((W/2-cfg.margin*W)/scale,(H/2-cfg.margin*H)/scale)}
function buildParticles(){particles=[];for(let row=0;row<cfg.rows;row++)for(let col=0;col<cfg.cols;col++){const fx=cfg.margin+(1-2*cfg.margin)*col/(cfg.cols-1),fy=cfg.margin+(1-2*cfg.margin)*row/(cfg.rows-1),x0=(fx*W-cx)/scale,y0=(fy*H-cy)/scale,r0=Math.hypot(x0,y0),a0=Math.atan2(y0,x0),corner=(row===0||row===cfg.rows-1)&&(col===0||col===cfg.cols-1),edge=row===0||row===cfg.rows-1||col===0||col===cfg.cols-1;particles.push({r0,a0,r:r0,a:a0,corner,edge,size:corner?2.8:edge?1.6:1.0,alive:true,history:[]})}}
function reset(){simTime=0;finished=false;pulseStart=0;running=true;pauseBtn.textContent='Pause';lastWall=performance.now();fpsFrames=0;fpsStamp=lastWall;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);buildParticles()}
function stateAt(p,t){const rn=clamp(p.r0/maxR,0,1),mask=Math.exp(-Math.pow(p.r0/cfg.sigma,2));if(t<=cfg.spinEnd){const q=t/cfg.spinEnd;return{r:p.r0,a:p.a0+TAU*cfg.coreTurns*q*mask,alive:true,pull:0}}
const q=clamp((t-cfg.spinEnd)/(cfg.total-cfg.spinEnd),0,1),S=smooth(q),pull=Math.pow(S,PHI),sideDistance=Math.min(Math.abs(Math.cos(p.a0)),Math.abs(Math.sin(p.a0))),sideLead=.88+.12*sideDistance,cornerLag=p.corner?.72:p.edge?.88:1;
const propagation=smooth((q-(rn*.42))/(1-rn*.42+.0001)),drape=Math.pow(propagation,PHI),globalFinish=Math.pow(q,3.4),convergence=Math.max(drape*cornerLag*sideLead,globalFinish);
const releaseTurns=p.corner?cfg.cornerReleaseTurns:p.edge?cfg.edgeReleaseTurns:cfg.fieldReleaseTurns,releaseTwist=TAU*releaseTurns*Math.pow(propagation,1.18)*pull*(.55+.45*rn);
const angular=p.a0+TAU*cfg.coreTurns*mask+TAU*cfg.collapseTurns*S*mask*(.68+.32*(1-rn))+releaseTwist;
const r=p.r0*Math.pow(Math.max(0,1-convergence),1.46);return{r:r<cfg.horizon?0:r,a:angular,alive:r>=cfg.horizon,pull}}
function updateHistory(){for(const p of particles){const s=stateAt(p,simTime);p.r=s.r;p.a=s.a;p.alive=s.alive;if(!s.alive)continue;const x=cx+Math.cos(s.a)*s.r*scale,y=cy+Math.sin(s.a)*s.r*scale;p.history.push({x,y});if(p.history.length>cfg.trailLength)p.history.shift()}}
function drawGuides(){if(!guidesBox.checked)return;ctx.save();ctx.strokeStyle='rgba(98,216,255,.13)';ctx.lineWidth=1;ctx.strokeRect(cfg.margin*W,cfg.margin*H,(1-2*cfg.margin)*W,(1-2*cfg.margin)*H);for(const rr of [.12,.25,.40,.58,maxR]){ctx.beginPath();ctx.arc(cx,cy,rr*scale,0,TAU);ctx.stroke()}ctx.restore()}
function drawCore(){const hr=cfg.horizon*scale,g=ctx.createRadialGradient(cx,cy,hr*.5,cx,cy,hr*3);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.42,'rgba(255,61,0,.10)');g.addColorStop(.72,'rgba(255,90,0,.52)');g.addColorStop(1,'rgba(255,143,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,hr*3,0,TAU);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(cx,cy,hr*.92,0,TAU);ctx.fill();ctx.strokeStyle='#ff6a00';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,hr,0,TAU);ctx.stroke();ctx.strokeStyle='#00e5ff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,hr*.58,0,TAU);ctx.stroke();ctx.fillStyle='#7c4dff';ctx.beginPath();ctx.arc(cx,cy,hr*.18,0,TAU);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-hr*.75,cy);ctx.lineTo(cx+hr*.75,cy);ctx.moveTo(cx,cy-hr*.75);ctx.lineTo(cx,cy+hr*.75);ctx.stroke()}
function drawParticle(p){if(!p.alive)return;const x=cx+Math.cos(p.a)*p.r*scale,y=cy+Math.sin(p.a)*p.r*scale,pull=simTime<=cfg.spinEnd?0:smooth((simTime-cfg.spinEnd)/(cfg.total-cfg.spinEnd));if(trailsBox.checked&&p.history.length>1){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(p.history[0].x,p.history[0].y);for(let i=1;i<p.history.length;i++)ctx.lineTo(p.history[i].x,p.history[i].y);ctx.strokeStyle=p.corner?`rgba(255,170,72,${.06+.40*pull})`:`rgba(100,210,255,${.04+.31*pull})`;ctx.lineWidth=.5+p.size*.72*pull;ctx.stroke();ctx.restore()}const halo=1.5+p.size*2.5*pull;ctx.fillStyle=p.corner?`rgba(255,172,75,${.42+.42*pull})`:`rgba(90,210,255,${.18+.31*pull})`;ctx.beginPath();ctx.arc(x,y,halo,0,TAU);ctx.fill();ctx.fillStyle='#f7feff';ctx.beginPath();ctx.arc(x,y,p.size*(.72+.28*pull),0,TAU);ctx.fill()}
function drawPulse(now){if(!finished)return;const e=clamp((now-pulseStart)/420,0,1),fade=1-e,r=(5+55*e)*scale/600;ctx.strokeStyle=`rgba(150,225,255,${fade})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.stroke();ctx.fillStyle=`rgba(255,255,255,${fade})`;ctx.fillRect(cx-1,cy-r,2,r*2);ctx.fillRect(cx-r,cy-1,r*2,2)}
function render(now){ctx.fillStyle=trailsBox.checked?'rgba(0,0,0,.27)':'#000';ctx.fillRect(0,0,W,H);drawGuides();for(const p of particles)drawParticle(p);drawCore();drawPulse(now)}
function frame(now){if(!lastWall)lastWall=now;const wallDelta=Math.min(.12,(now-lastWall)/1000);lastWall=now;if(running&&!finished){simTime=Math.min(cfg.total,simTime+wallDelta*speed);updateHistory();if(simTime>=cfg.total){for(const p of particles)p.alive=false;finished=true;pulseStart=now}}fpsFrames++;if(now-fpsStamp>=500){fps=Math.round(fpsFrames*1000/(now-fpsStamp));fpsFrames=0;fpsStamp=now}render(now);const cornerAlive=particles.filter(p=>p.corner&&p.alive).length;status.textContent=`${simTime.toFixed(2)} s · ${speed}× · ${fps} FPS · corners ${cornerAlive}/4`;requestAnimationFrame(frame)}
restartBtn.addEventListener('click',reset);pauseBtn.addEventListener('click',()=>{running=!running;pauseBtn.textContent=running?'Pause':'Play';lastWall=performance.now()});speedSel.addEventListener('change',()=>{speed=Number(speedSel.value)||1;lastWall=performance.now()});trailsBox.addEventListener('change',()=>{ctx.fillStyle='#000';ctx.fillRect(0,0,W,H)});addEventListener('resize',()=>{resize();reset()},{passive:true});resize();reset();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
