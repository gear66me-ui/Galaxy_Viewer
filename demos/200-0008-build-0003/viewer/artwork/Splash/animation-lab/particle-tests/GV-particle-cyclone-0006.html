<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Galaxy Viewer — Particle Cyclone 0006</title>
<style>
@font-face{font-family:SpaceAge;src:url('../../../Fonts/Space%20Age/space%20age.otf') format('opentype');font-display:block}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}#stage{position:fixed;inset:0;display:grid;place-items:center;background:#000}#wrap{position:relative;width:min(100vw,66.6667vh);height:min(150vw,100vh);overflow:hidden;background:#000}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#fx{pointer-events:none}
</style>
</head>
<body>
<div id="stage"><div id="wrap"><canvas id="gl"></canvas><canvas id="fx"></canvas></div></div>
<script>
(()=>{'use strict';
const IMAGE='../../Galaxy%20Splash%20Ibis%20NO%20NAME.png';
const TOTAL=6.0,ENGRAVE_START=.32,ENGRAVE_END=1.72,CYCLONE_START=2.02,COLLAPSE_END=5.40,FLASH_END=5.78;
const CENTER=[.527535,.584087],PHI=1.61803398875,TAU=Math.PI*2;
const wrap=document.getElementById('wrap'),glc=document.getElementById('gl'),fx=document.getElementById('fx'),ctx=fx.getContext('2d');
let gl,program,locTime,locCenter,locAspect,start=0,ready=false,ended=false,signatureMask=null;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
function resize(){const r=wrap.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,1.25);for(const c of [glc,fx]){c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);c.style.width=r.width+'px';c.style.height=r.height+'px'}ctx.setTransform(dpr,0,0,dpr,0,0);if(gl)gl.viewport(0,0,glc.width,glc.height);buildSignature()}
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
function initGL(img){gl=glc.getContext('webgl',{alpha:false,antialias:true,preserveDrawingBuffer:false});if(!gl)throw Error('WebGL unavailable');
const vs=`attribute vec2 aPos;attribute vec2 aUV;uniform float uTime;uniform vec2 uCenter;uniform float uAspect;varying vec2 vUV;varying float vAlpha;
float sm(float a,float b,float x){float q=clamp((x-a)/(b-a),0.0,1.0);return q*q*(3.0-2.0*q);}void main(){vec2 uv=aUV;vec2 d=vec2((uv.x-uCenter.x)*uAspect,-(uv.y-uCenter.y));float r=length(d);float maxR=.92;float rn=clamp(r/maxR,0.0,1.0);float t=clamp((uTime-${CYCLONE_START.toFixed(2)})/${(COLLAPSE_END-CYCLONE_START).toFixed(2)},0.0,1.0);float mask=exp(-pow(r/.235,2.0));float release=sm(.15+.43*rn,.92,t);float pull=pow(release,${PHI.toFixed(8)});float finalPull=pow(t,6.0);float convergence=max(pull*(.70+.30*rn),finalPull);float radial=max(0.0,1.0-convergence);float localTurns=2.10*t*mask;float releasedTurns=1.45*pow(release,1.18)*t*(.45+.55*rn);float ang=atan(d.y,d.x)+${TAU.toFixed(8)}*(localTurns+releasedTurns);vec2 nd=vec2(cos(ang),sin(ang))*r*radial;vec2 outUV=vec2(uCenter.x+nd.x/uAspect,uCenter.y-nd.y);vec2 clip=vec2(outUV.x*2.0-1.0,1.0-outUV.y*2.0);gl_Position=vec4(clip,0.0,1.0);vUV=uv;vAlpha=1.0-sm(.965,1.0,t);}`;
const fs=`precision mediump float;uniform sampler2D uTex;varying vec2 vUV;varying float vAlpha;void main(){vec4 c=texture2D(uTex,vUV);gl_FragColor=vec4(c.rgb*vAlpha,1.0);}`;
program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const cols=45,rows=67,pos=[],uv=[],idx=[];for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const u=x/(cols-1),v=y/(rows-1);pos.push(u*2-1,1-v*2);uv.push(u,v)}for(let y=0;y<rows-1;y++)for(let x=0;x<cols-1;x++){const i=y*cols+x;idx.push(i,i+1,i+cols,i+1,i+cols+1,i+cols)}
function attr(name,data){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.STATIC_DRAW);const l=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0)}attr('aPos',pos);attr('aUV',uv);const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(idx),gl.STATIC_DRAW);program.count=idx.length;
const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
locTime=gl.getUniformLocation(program,'uTime');locCenter=gl.getUniformLocation(program,'uCenter');locAspect=gl.getUniformLocation(program,'uAspect');gl.uniform2f(locCenter,CENTER[0],CENTER[1]);gl.uniform1f(locAspect,1024/1536);gl.clearColor(0,0,0,1);ready=true}
function buildSignature(){const r=wrap.getBoundingClientRect();if(!r.width)return;signatureMask=document.createElement('canvas');signatureMask.width=Math.round(r.width*2);signatureMask.height=Math.round(r.height*2);const c=signatureMask.getContext('2d');c.scale(2,2);const size=Math.max(12,r.width*.040);c.font=`${size}px SpaceAge, sans-serif`;c.textAlign='center';c.textBaseline='middle';c.letterSpacing='0.12em';c.fillStyle='#fff';c.shadowColor='#1677ff';c.shadowBlur=10;c.fillText('BY GERMÁN ARCINIEGAS',r.width*.5,r.height*.455)}
function drawSignature(t){if(!signatureMask)return;const r=wrap.getBoundingClientRect();const p=clamp((t-ENGRAVE_START)/(ENGRAVE_END-ENGRAVE_START));if(p<=0)return;ctx.save();ctx.globalCompositeOperation='source-over';ctx.globalAlpha=t<CYCLONE_START?1:1-smooth((t-CYCLONE_START)/(COLLAPSE_END-CYCLONE_START));ctx.drawImage(signatureMask,0,0,signatureMask.width*p,signatureMask.height,0,0,r.width*p,r.height);if(p<1){const x=r.width*p,y=r.height*.455;ctx.fillStyle='#fff';ctx.shadowColor='#42d9ff';ctx.shadowBlur=14;for(let i=0;i<7;i++){const a=(i*2.399+t*17)%TAU,rr=4+((i*7)%13);ctx.fillRect(x+Math.cos(a)*rr,y+Math.sin(a)*rr*.55,1.5,1.5)}}else if(t<2.02){const g=1-smooth((t-1.72)/.30);ctx.globalAlpha=.35*g;ctx.filter='blur(4px)';ctx.drawImage(signatureMask,0,0,r.width,r.height)}ctx.restore()}
function drawFlash(t){if(t<COLLAPSE_END||t>FLASH_END)return;const r=wrap.getBoundingClientRect(),x=r.width*CENTER[0],y=r.height*CENTER[1],q=clamp((t-COLLAPSE_END)/(FLASH_END-COLLAPSE_END)),flare=Math.sin(Math.PI*q),len=r.width*(.08+.32*flare),a=1-q;ctx.save();ctx.globalCompositeOperation='screen';ctx.strokeStyle=`rgba(220,248,255,${a})`;ctx.shadowColor='#8bdcff';ctx.shadowBlur=18;ctx.lineWidth=1.5+3*flare;ctx.beginPath();ctx.moveTo(x-len,y);ctx.lineTo(x+len,y);ctx.moveTo(x,y-len*.72);ctx.lineTo(x,y+len*.72);ctx.stroke();ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.beginPath();ctx.arc(x,y,2+9*flare,0,TAU);ctx.fill();ctx.restore()}
function frame(now){if(!ready)return requestAnimationFrame(frame);if(!start)start=now;const t=Math.min(TOTAL,(now-start)/1000);gl.clear(gl.COLOR_BUFFER_BIT);gl.useProgram(program);gl.uniform1f(locTime,t);gl.drawElements(gl.TRIANGLES,program.count,gl.UNSIGNED_SHORT,0);const r=wrap.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);drawSignature(t);drawFlash(t);if(t>=FLASH_END){gl.clear(gl.COLOR_BUFFER_BIT);ctx.clearRect(0,0,r.width,r.height);ended=true;return}requestAnimationFrame(frame)}
const img=new Image();img.decoding='async';img.src=IMAGE;Promise.all([new Promise((res,rej)=>{img.onload=res;img.onerror=rej}),document.fonts.ready]).then(async()=>{try{await img.decode()}catch(e){}resize();initGL(img);gl.uniform1f(locTime,0);gl.drawElements(gl.TRIANGLES,program.count,gl.UNSIGNED_SHORT,0);requestAnimationFrame(()=>requestAnimationFrame(frame))}).catch(e=>{document.body.textContent='Unable to load splash animation.';document.body.style.color='white'});
addEventListener('resize',()=>{resize()},{passive:true});addEventListener('click',()=>{if(ended){start=0;ended=false;requestAnimationFrame(frame)}},{passive:true});
})();
</script>
</body>
</html>
