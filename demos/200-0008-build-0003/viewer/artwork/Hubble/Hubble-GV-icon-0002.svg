<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title>Galaxy Viewer Hubble icon</title>
  <desc>High-contrast monochrome icon of the Hubble Space Telescope with NASA, ESA, and hubble text.</desc>
  <rect width="256" height="256" fill="#000"/>
  <g fill="#fff" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- telescope body -->
    <rect x="70" y="86" width="86" height="42" rx="6" ry="6" fill="none" stroke-width="8"/>
    <rect x="82" y="78" width="64" height="10" rx="4" fill="#fff" stroke="none"/>
    <circle cx="76" cy="107" r="8" fill="#000" stroke-width="6"/>
    <circle cx="151" cy="107" r="5" fill="#fff" stroke="none"/>
    <line x1="92" y1="92" x2="136" y2="92" stroke-width="4"/>
    <line x1="90" y1="122" x2="146" y2="122" stroke-width="4"/>

    <!-- front assembly -->
    <path d="M156 92 L178 100 L178 114 L156 122 Z" fill="none" stroke-width="8"/>
    <rect x="178" y="97" width="14" height="20" rx="3" fill="#fff" stroke="none"/>
    <line x1="192" y1="107" x2="205" y2="107" stroke-width="6"/>

    <!-- solar panels -->
    <rect x="20" y="74" width="34" height="66" rx="2" fill="none" stroke-width="6"/>
    <rect x="205" y="74" width="31" height="66" rx="2" fill="none" stroke-width="6"/>
    <line x1="54" y1="107" x2="70" y2="107" stroke-width="6"/>
    <line x1="192" y1="107" x2="205" y2="107" stroke-width="6"/>
    <line x1="31" y1="86" x2="31" y2="128" stroke-width="3"/>
    <line x1="43" y1="86" x2="43" y2="128" stroke-width="3"/>
    <line x1="215" y1="86" x2="215" y2="128" stroke-width="3"/>
    <line x1="226" y1="86" x2="226" y2="128" stroke-width="3"/>
    <line x1="23" y1="94" x2="51" y2="94" stroke-width="3"/>
    <line x1="23" y1="107" x2="51" y2="107" stroke-width="3"/>
    <line x1="23" y1="120" x2="51" y2="120" stroke-width="3"/>
    <line x1="208" y1="94" x2="233" y2="94" stroke-width="3"/>
    <line x1="208" y1="107" x2="233" y2="107" stroke-width="3"/>
    <line x1="208" y1="120" x2="233" y2="120" stroke-width="3"/>

    <!-- support structure -->
    <line x1="100" y1="128" x2="88" y2="149" stroke-width="5"/>
    <line x1="126" y1="128" x2="143" y2="149" stroke-width="5"/>
    <line x1="113" y1="129" x2="113" y2="151" stroke-width="5"/>
    <circle cx="113" cy="157" r="5" fill="#fff" stroke="none"/>
  </g>

  <!-- label block -->
  <g fill="#fff" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="64" y="184" font-size="18" font-weight="700" letter-spacing="1.2">NASA</text>
    <text x="192" y="184" font-size="18" font-weight="700" letter-spacing="1.4">ESA</text>
    <text x="128" y="225" font-size="30" font-weight="700" letter-spacing="1.2">hubble</text>
  </g>
</svg>
