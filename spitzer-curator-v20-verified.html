ateStatus();if(scroll)scrollTo(0,0)}function updateStatus(){const rev=ITEMS.filter(x=>S.decisions[x.id]).length;$('status').textContent=`${ITEMS.length} UNIQUE NEW • ${rev} reviewed • ${hidden} old hidden`}
const v=$('verification');v.textContent=`VERIFIED BUILD: AstroPix advertised ${META.advertisedCount}; feed records ${META.feedRecords}; unique feed IDs ${META.uniqueFeedIds}; candidate links tested ${META.candidateUrlsTested}; working image URLs ${META.workingImageUrls}; failed ${META.failedImageUrls}; exact duplicate image content dropped ${META.duplicateImageContentDropped}; embedded verified unique new ${META.embeddedVerifiedUniqueNew}; previously reviewed on this device hidden ${hidden}; VISIBLE NOW ${ITEMS.length}. Verification: ${META.verificationMethod}.`;if(ITEMS.length<500)v.classList.add('warn');
$('prev').onclick=()=>{if(S.page>0){S.page--;save();render()}};$('next').onclick=()=>{const p=slice().pages;if(S.page<p-1){S.page++;save();render()}};$('jump').onchange=e=>{S.page=+e.target.value;save();render()};$('filter').onchange=e=>{S.filter=e.target.value;S.page=0;save();render()};$('nextUn').onclick=()=>{const a=filtered();const i=a.findIndex(x=>!S.decisions[x.id]);if(i<0)return toast('No unreviewed cards');S.page=Math.floor(i/PAGE_SIZE);save();render()};$('keepPage').onclick=()=>{for(const x of slice().items)S.decisions[x.id]='KEEP';save();render(false)};$('noPage').onclick=()=>{for(const x of slice().items)S.decisions[x.id]='REJECT';save();render(false)};$('clearPage').onclick=()=>{for(const x of slice().items)delete S.decisions[x.id];save();render(false)};$('undo').onclick=()=>{const h=S.history.pop();if(!h)return toast('Nothing to undo');if(h.prev===null)delete S.decisions[h.id];else S.decisions[h.id]=h.prev;save();render(false)};$('download').onclick=()=>{const out={schema:'spitzer-curator-v20-verified',verification:META,visibleUniqueNew:ITEMS.length,hiddenPreviouslyReviewed:hidden,decisions:S.decisions,keepIds:Object.entries(S.decisions).filter(([,v])=>v==='KEEP').map(([id])=>id),items:ITEMS};const b=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='spitzer-curator-v20-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('refreshLock').onclick=()=>{refreshLocked=!refreshLocked;$('refreshLock').textContent=refreshLocked?'🔒 REFRESH LOCK: ON':'🔓 REFRESH LOCK: OFF'};window.addEventListener('beforeunload',e=>{save();if(refreshLocked){e.preventDefault();e.returnValue=''}});$('filter').value=S.filter;render(false);
</script></body></html>
