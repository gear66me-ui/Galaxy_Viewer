<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Galaxy Viewer 4O</title>
<link rel="icon" href="../../viewer/artwork/icon.svg?v=829faf3594e85d4ff529d3c2b069a309d580b054" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../viewer/artwork/icon.svg?v=829faf3594e85d4ff529d3c2b069a309d580b054">
<style>
html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:#000;color:#fff}
body{font-family:"Roboto Mono",Consolas,monospace}
#gv-loading{padding:18px;color:#62D8FF}
#gv-splash{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#000;opacity:1;transition:opacity .28s ease}
#gv-splash img{display:block;width:100%;height:100%;object-fit:contain;background:#000}
body.gv-ready #gv-splash{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="gv-splash"><img src="../../viewer/artwork/GV-splash-0003.svg?v=0023" alt="Galaxy Viewer launch artwork"></div>
<div id="gv-loading">Loading Galaxy Viewer 4O…</div>
<script>
(async()=>{
  const splashStarted=Date.now();
  const loading=document.getElementById('gv-loading');
  try{
    const response=await fetch('../../viewer/GV-beta-0004O.py?v=4O-001',{cache:'no-store'});
    if(!response.ok)throw new Error(`GV-beta-0004O.py returned HTTP ${response.status}`);
    const source=await response.text();
    const htmlMatch=source.match(/display\(HTML\("""([\s\S]*?)"""\)\)/);
    const jsMatch=source.match(/display\(Javascript\(r"""([\s\S]*?)"""\)\)/);
    if(!htmlMatch||!jsMatch)throw new Error('Could not extract the 4O HTML and JavaScript blocks.');
    loading.remove();
    document.body.insertAdjacentHTML('beforeend',htmlMatch[1]);
    const script=document.createElement('script');
    script.textContent=jsMatch[1];
    document.body.appendChild(script);
    const vectorIconUrl='../../viewer/artwork/icon_target_vector.svg?v=608828c6835dd2d892969475469937f0a6956552';
    const applyVectorIcon=()=>{
      const icon=document.querySelector('button.gv-simbad-proxy img.gv-target-trademark');
      if(icon)icon.src=vectorIconUrl;
    };
    const applyReleaseLabel=()=>{
      const label=document.querySelector('#gv-version-label');
      if(label)label.textContent='Galaxy Viewer 4O';
    };
    const alignUpperLeftControls=()=>{
      const root=document.getElementById('aladin-cosmic-command-test');
      if(!root)return;
      const layers=root.querySelector('.gv-layers');
      const world=root.querySelector('.gv-world');
      const coordinate=root.querySelector('.gv-native-coordinate-target-row')||root.querySelector('.aladin-location')||root.querySelector('.aladin-coordinates');
      if(!layers||!world||!coordinate)return;
      let group=layers;
      while(group.parentElement&&group.parentElement!==root&&!group.contains(world))group=group.parentElement;
      if(!group||group===root||!group.contains(world))return;
      group.style.setProperty('translate','0 0','important');
      const groupRect=group.getBoundingClientRect();
      const coordinateRect=coordinate.getBoundingClientRect();
      const delta=Math.round(coordinateRect.left-groupRect.left);
      group.style.setProperty('translate',delta+'px 0','important');
    };
    [250,700,1400,2400].forEach(delay=>setTimeout(applyVectorIcon,delay));
    [260,720,1420,2420].forEach(delay=>setTimeout(applyReleaseLabel,delay));
    [300,800,1500,2500].forEach(delay=>setTimeout(alignUpperLeftControls,delay));
    window.addEventListener('resize',alignUpperLeftControls);
    const splashDelay=Math.max(0,2200-(Date.now()-splashStarted));
    setTimeout(()=>document.body.classList.add('gv-ready'),splashDelay);
  }catch(error){
    console.error('Galaxy Viewer 4O browser launcher failure',error);
    loading.textContent=`Galaxy Viewer 4O failed to load: ${error.message}`;
  }
})();
</script>
</body>
</html>
