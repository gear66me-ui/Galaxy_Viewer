<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Galaxy Viewer — Beta Tester</title>
<link rel="icon" href="../../viewer/artwork/icon.svg?v=5A-startup-001" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../viewer/artwork/icon.svg?v=5A-startup-001">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff}
body{min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
main{width:min(100%,420px)}
.badge{display:inline-block;margin-bottom:14px;padding:6px 10px;border:1px solid #7575ff;border-radius:999px;color:#bceeff;background:#111127;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
h1{margin:0 0 10px;font-size:clamp(28px,8vw,42px);line-height:1.05}
p{margin:0 0 24px;color:#bfc7d5;font-size:16px;line-height:1.5}
.choices{display:grid;gap:14px}
a{display:flex;align-items:center;justify-content:center;gap:12px;min-height:58px;padding:14px 18px;border:1px solid #45e7ff;border-radius:12px;color:#fff;text-decoration:none;font-size:18px;font-weight:750;background:#07131b}
a img{width:34px;height:34px;flex:0 0 34px;border-radius:8px}
a:active{transform:scale(.99)}
.mobile{border-color:#7575ff;background:#111127}
small{display:block;margin-top:20px;color:#7d8796;line-height:1.4}
</style>
</head>
<body>
<main>
<div class="badge">Beta Tester</div>
<h1>Galaxy Viewer 5A</h1>
<p>Choose the isolated 5A beta test. Both versions use the same trademark-to-splash startup sequence.</p>
<div class="choices">
<a href="./5A/?v=5A-startup-001"><img src="../../viewer/artwork/icon.svg?v=5A-startup-001" alt="">Open 5A Web Beta</a>
<a class="mobile" href="../../mobile/beta/?v=5A-startup-001"><img src="../../viewer/artwork/icon.svg?v=5A-startup-001" alt="">Open 5A Mobile Beta</a>
</div>
<small>The public launcher and the current 4O mobile page remain unchanged.</small>
</main>
</body>
</html>
