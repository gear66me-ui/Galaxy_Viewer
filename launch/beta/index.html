<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GALAXY VIEWER BETA 6I">
<title>GALAXY VIEWER — BETA 6I</title>
<link rel="manifest" href="./manifest.webmanifest?v=6I-launcher-pwa-001">
<link rel="icon" href="../../viewer/artwork/icon_target_vector.svg?v=6I-coordinate-harmony-001" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../viewer/artwork/App%20Icons/GV-app-icon-192.png?v=6I-launcher-pwa-001">
<style>
@font-face{font-family:"Space Age";src:url("../../viewer/artwork/Fonts/Space%20Age/space%20age.otf?v=6I-coordinate-harmony-001") format("opentype");font-style:normal;font-weight:400;font-display:block}
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff}
body{min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Space Age",sans-serif;text-align:center;text-transform:uppercase}
main{width:min(100%,420px)}
.gv-glyph{display:inline-block;transform:scaleY(1.5);transform-origin:center}
.badge{display:inline-block;margin-bottom:30px;padding:6px 10px;border:1px solid #7575ff;border-radius:999px;color:#f0edff;background:#111126;font-size:12px;font-weight:400;letter-spacing:.08em;box-shadow:0 0 16px rgba(117,117,255,.28)}
.choices{display:grid;gap:18px}
a,button{display:flex;align-items:center;justify-content:flex-start;gap:14px;width:100%;min-height:86px;padding:12px 18px;border:2px solid #7575ff;border-radius:12px;color:#fff;text-decoration:none;font:400 19px "Space Age",sans-serif;text-transform:uppercase;background:#101024;box-shadow:0 0 18px rgba(117,117,255,.24)}
a img,button img{width:48px;height:48px;object-fit:contain;flex:0 0 48px}
a span,button span{flex:1;text-align:center;padding-right:48px}
a:active,button:active{transform:scale(.99)}
#gv-install-app{border-color:#62D8FF;box-shadow:0 0 20px rgba(98,216,255,.38)}
#gv-install-app[hidden]{display:none}
</style>
</head>
<body>
<main>
<div class="badge"><span class="gv-glyph">GALAXY VIEWER · BETA 6I</span></div>
<div class="choices">
<button id="gv-install-app" type="button" hidden><img src="../../viewer/artwork/icon_target_vector.svg?v=6I-coordinate-harmony-001" alt=""><span><span class="gv-glyph">INSTALL GALAXY VIEWER</span></span></button>
<a id="gv-open-app" href="../../mobile/beta/?source=beta-6i-app&v=6I-coordinate-harmony-001"><img src="../../viewer/artwork/icon_target_vector.svg?v=6I-coordinate-harmony-001" alt=""><span><span class="gv-glyph">LAUNCH APP</span></span></a>
<a id="gv-open-diagnostics" href="../../mobile/beta/?diag=1"><img src="../../viewer/artwork/icon_target_vector.svg?v=6I-coordinate-harmony-001" alt=""><span><span class="gv-glyph">LAUNCH DIAGNOSTICS</span></span></a>
</div>
</main>
<script>
(async()=>{
  const installButton=document.getElementById('gv-install-app');
  const standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  let deferredInstallPrompt=null;

  if(standalone){
    window.location.replace('../../mobile/beta/?source=pwa&v=6I-launcher-pwa-001');
    return;
  }

  if('serviceWorker' in navigator){
    try{
      const registration=await navigator.serviceWorker.register('./service-worker.js?v=6I-launcher-pwa-001',{scope:'./'});
      console.log('GALAXY VIEWER LAUNCHER SERVICE WORKER REGISTERED',registration.scope);
    }catch(error){
      console.error('GALAXY VIEWER LAUNCHER SERVICE WORKER REGISTRATION FAILED',error);
    }
  }

  window.addEventListener('beforeinstallprompt',event=>{
    event.preventDefault();
    deferredInstallPrompt=event;
    installButton.hidden=false;
  });

  installButton.addEventListener('click',async()=>{
    if(!deferredInstallPrompt)return;
    installButton.hidden=true;
    deferredInstallPrompt.prompt();
    try{
      const choice=await deferredInstallPrompt.userChoice;
      if(choice.outcome!=='accepted')installButton.hidden=false;
    }finally{
      deferredInstallPrompt=null;
    }
  });

  window.addEventListener('appinstalled',()=>{
    deferredInstallPrompt=null;
    installButton.hidden=true;
    console.log('GALAXY VIEWER INSTALLED');
  });

  const clearBetaCaches=async()=>{
    try{
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(keys.filter(key=>key.startsWith('galaxy-viewer-beta-')).map(key=>caches.delete(key)));
      }
      navigator.serviceWorker?.controller?.postMessage('CLEAR_BETA_CACHES');
    }catch(error){console.warn('GALAXY VIEWER BETA LAUNCHER CACHE CLEAR FAILED',error);}
  };
  await clearBetaCaches();
  document.querySelectorAll('#gv-open-app,#gv-open-diagnostics').forEach(link=>{
    link.addEventListener('click',async event=>{
      event.preventDefault();
      const destination=event.currentTarget.href;
      await clearBetaCaches();
      window.location.assign(destination);
    });
  });
})();
</script>
</body>
</html>
