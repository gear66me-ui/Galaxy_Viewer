<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GALAXY VIEWER BETA 6S">
<title>GALAXY VIEWER — BETA 6S</title>
<link rel="manifest" href="./manifest.webmanifest?v=6S-coordinate-height-001">
<link rel="icon" href="../../viewer/artwork/icon_target_vector.svg?v=6S-coordinate-height-001" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../viewer/artwork/App%20Icons/GV-app-icon-192.png?v=6S-coordinate-height-001">
<style>
@font-face{font-family:"Space Age";src:url("../../viewer/artwork/Fonts/Space%20Age/space%20age.otf?v=6S-coordinate-height-001") format("opentype");font-style:normal;font-weight:400;font-display:block}
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff}
body{min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Space Age",sans-serif;text-align:center;text-transform:uppercase}
main{width:min(100%,420px)}
.gv-glyph{display:inline-block;transform:scaleY(1.5);transform-origin:center}
.badge{display:inline-block;margin-bottom:30px;padding:6px 10px;border:1px solid #D7F4FF;border-radius:999px;color:#f0edff;background:#111126;font-size:12px;font-weight:400;letter-spacing:.08em;box-shadow:inset 0 0 4px rgba(98,216,255,.16),0 0 6px rgba(215,244,255,.50),0 0 12px rgba(98,216,255,.24)}
.choices{display:grid;gap:18px}
a,button{display:flex;align-items:center;justify-content:flex-start;gap:14px;width:100%;min-height:86px;padding:12px 18px;border:2px solid #D7F4FF;border-radius:12px;color:#fff;text-decoration:none;font:400 19px "Space Age",sans-serif;text-transform:uppercase;background:#101024;box-shadow:inset 0 0 5px rgba(98,216,255,.22),0 0 7px rgba(215,244,255,.68),0 0 16px rgba(98,216,255,.34)}
a img,button img{width:48px;height:48px;object-fit:contain;flex:0 0 48px}
a span,button span{flex:1;text-align:center;padding-right:48px}
a:active,button:active{transform:scale(.99)}
#gv-install-app{border-color:#D7F4FF;box-shadow:inset 0 0 5px rgba(98,216,255,.22),0 0 7px rgba(215,244,255,.68),0 0 16px rgba(98,216,255,.34)}
#gv-install-app[aria-disabled="true"]{opacity:.72}
#gv-install-status{min-height:0;margin:0;color:#62D8FF;font:400 11px/1.5 "Space Age",sans-serif;text-transform:uppercase}
#gv-install-status:empty{display:none}
#gv-open-app.gv-launch-failed{border-color:#FFD166;color:#FFD166;box-shadow:inset 0 0 5px rgba(255,209,102,.22),0 0 7px rgba(255,209,102,.68),0 0 16px rgba(255,209,102,.34)}
</style>
</head>
<body>
<main>
<div class="badge"><span class="gv-glyph">GALAXY VIEWER · BETA 6S</span></div>
<div class="choices">
<button id="gv-install-app" type="button" aria-disabled="true"><img src="../../viewer/artwork/icon_target_vector.svg?v=6S-coordinate-height-001" alt=""><span><span id="gv-install-label" class="gv-glyph">PREPARING INSTALL</span></span></button>
<p id="gv-install-status" role="status" aria-live="polite"></p>
<a id="gv-open-app" href="../../mobile/beta/?source=beta-6s-app&v=6S-coordinate-height-001"><img src="../../viewer/artwork/icon_target_vector.svg?v=6S-coordinate-height-001" alt=""><span><span id="gv-open-app-label" class="gv-glyph">LAUNCH APP</span></span></a>
<a id="gv-open-diagnostics" href="../../mobile/beta/?diag=1&v=6S-coordinate-height-001"><img src="../../viewer/artwork/icon_target_vector.svg?v=6S-coordinate-height-001" alt=""><span><span class="gv-glyph">LAUNCH DIAGNOSTICS</span></span></a>
</div>
</main>
<script>
const installButton=document.getElementById('gv-install-app');
const installLabel=document.getElementById('gv-install-label');
const installStatus=document.getElementById('gv-install-status');
const openApp=document.getElementById('gv-open-app');
const openAppLabel=document.getElementById('gv-open-app-label');
let deferredInstallPrompt=null;

try{
  if(localStorage.getItem('gv-beta-launch-failure')==='6S'){
    openApp.classList.add('gv-launch-failed');
    openAppLabel.textContent='APP FAILED TO LOAD';
  }
}catch(error){console.warn('GALAXY VIEWER LAUNCH FAILURE STATE UNAVAILABLE',error);}

openApp.addEventListener('click',()=>{
  try{localStorage.removeItem('gv-beta-launch-failure');}catch(_){ }
  openApp.classList.remove('gv-launch-failed');
  openAppLabel.textContent='LAUNCH APP';
});

window.addEventListener('pageshow',()=>{
  try{
    if(localStorage.getItem('gv-beta-launch-failure')==='6S'){
      openApp.classList.add('gv-launch-failed');
      openAppLabel.textContent='APP FAILED TO LOAD';
    }
  }catch(_){ }
});

window.addEventListener('beforeinstallprompt',event=>{
  event.preventDefault();
  deferredInstallPrompt=event;
  installButton.setAttribute('aria-disabled','false');
  installLabel.textContent='INSTALL GALAXY VIEWER';
  installStatus.textContent='';
});

window.addEventListener('appinstalled',()=>{
  deferredInstallPrompt=null;
  installButton.setAttribute('aria-disabled','true');
  installLabel.textContent='GALAXY VIEWER INSTALLED';
  installStatus.textContent='INSTALLATION COMPLETE';
  console.log('GALAXY VIEWER INSTALLED');
});

installButton.addEventListener('click',async()=>{
  if(!deferredInstallPrompt){
    installStatus.textContent='PLEASE REMAIN ON THIS PAGE FOR 30 SECONDS, TAP THE PAGE ONCE, THEN CHECK AGAIN.';
    return;
  }
  const promptEvent=deferredInstallPrompt;
  deferredInstallPrompt=null;
  installButton.setAttribute('aria-disabled','true');
  installLabel.textContent='OPENING INSTALL';
  installStatus.textContent='';
  promptEvent.prompt();
  const choice=await promptEvent.userChoice;
  if(choice.outcome!=='accepted'){
    installLabel.textContent='PREPARING INSTALL';
    installStatus.textContent='INSTALLATION WAS NOT ACCEPTED. WAIT FOR CHROME TO OFFER INSTALL AGAIN.';
  }
});

(async()=>{
  const standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;

  if(standalone){
    window.location.replace('../../mobile/beta/?source=pwa&v=6S-coordinate-height-001');
    return;
  }

  if('serviceWorker' in navigator){
    try{
      const registration=await navigator.serviceWorker.register('./service-worker.js?v=6S-coordinate-height-001',{scope:'./'});
      console.log('GALAXY VIEWER LAUNCHER SERVICE WORKER REGISTERED',registration.scope);
    }catch(error){
      console.error('GALAXY VIEWER LAUNCHER SERVICE WORKER REGISTRATION FAILED',error);
    }
  }

  try{
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(key=>key.startsWith('galaxy-viewer-beta-')).map(key=>caches.delete(key)));
    }
    navigator.serviceWorker?.controller?.postMessage('CLEAR_BETA_CACHES');
  }catch(error){
    console.warn('GALAXY VIEWER BETA LAUNCHER CACHE CLEAR FAILED',error);
  }
})();
</script>
</body>
</html>
