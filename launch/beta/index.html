<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>GALAXY VIEWER — BETA 6I</title>
<link rel="icon" href="../../viewer/artwork/icon_target_vector.svg?v=6I-coordinate-harmony-001" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../viewer/artwork/icon_target_vector.svg?v=6I-coordinate-harmony-001">
<style>
@font-face{font-family:"Space Age";src:url("../../viewer/artwork/Fonts/Space%20Age/space%20age.otf?v=6I-coordinate-harmony-001") format("opentype");font-style:normal;font-weight:400;font-display:block}
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff}
body{min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Space Age",sans-serif;text-align:center;text-transform:uppercase}
main{width:min(100%,420px)}
.gv-glyph{display:inline-block;transform:scaleY(1.5);transform-origin:center}
.badge{display:inline-block;margin-bottom:30px;padding:6px 10px;border:1px solid #7575ff;border-radius:999px;color:#f0edff;background:#111126;font-size:12px;font-weight:400;letter-spacing:.08em;box-shadow:0 0 16px rgba(117,117,255,.28)}
.choices{display:grid;gap:18px}
a{display:flex;align-items:center;justify-content:flex-start;gap:14px;min-height:86px;padding:12px 18px;border:2px solid #7575ff;border-radius:12px;color:#fff;text-decoration:none;font-size:19px;font-weight:400;background:#101024;box-shadow:0 0 18px rgba(117,117,255,.24)}
a img{width:48px;height:48px;object-fit:contain;flex:0 0 48px}
a span{flex:1;text-align:center;padding-right:48px}
a:active{transform:scale(.99)}
</style>
</head>
<body>
<main>
<div class="badge"><span class="gv-glyph">GALAXY VIEWER · BETA 6I</span></div>
<div class="choices">
<a id="gv-open-app" href="../../mobile/beta/?source=beta-6i-app&v=6I-coordinate-harmony-001"><img src="../../viewer/artwork/icon_target_vector.svg?v=6I-coordinate-harmony-001" alt=""><span><span class="gv-glyph">LAUNCH APP VERSION</span></span></a>
<a id="gv-open-web" href="./web/?source=beta-6i-web&v=6I-coordinate-harmony-001"><img src="../../viewer/artwork/icon_target_vector.svg?v=6I-coordinate-harmony-001" alt=""><span><span class="gv-glyph">LAUNCH WEB VERSION</span></span></a>
</div>
</main>
<script>
(async()=>{
  const clearBetaCaches=async()=>{
    try{
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(keys.filter(key=>key.startsWith('galaxy-viewer-beta-')).map(key=>caches.delete(key)));
      }
      navigator.serviceWorker?.controller?.postMessage('CLEAR_BETA_CACHES');
    }catch(error){console.warn('GALAXY VIEWER BETA LAUNCHER CACHE CLEAR FAILED',error);}
  };
  await clearBetaCaches();
  document.getElementById('gv-open-app').addEventListener('click',async event=>{
    event.preventDefault();
    const destination=event.currentTarget.href;
    await clearBetaCaches();
    window.location.assign(destination);
  });
  document.getElementById('gv-open-web').addEventListener('click',async event=>{
    event.preventDefault();
    const destination=event.currentTarget.href;
    await clearBetaCaches();
    window.location.assign(destination);
  });
})();
</script>
</body>
</html>
