<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Galaxy Viewer 4I</title>
<style>
html,body{margin:0;min-height:100%;background:#000;color:#fff}
body{font-family:"Roboto Mono",Consolas,monospace}
#gv-loading{padding:18px;color:#62D8FF}
</style>
</head>
<body>
<div id="gv-loading">Loading Galaxy Viewer 4I…</div>
<script>
(async()=>{
  const loading=document.getElementById('gv-loading');
  try{
    const response=await fetch('../../viewer/GV-beta-0004I.py?v=8fd590c34ca82b4244abf04eb8ca200e4778c318',{cache:'no-store'});
    if(!response.ok)throw new Error(`GV-beta-0004I.py returned HTTP ${response.status}`);
    const source=await response.text();
    const htmlMatch=source.match(/display\(HTML\("""([\s\S]*?)"""\)\)/);
    const jsMatch=source.match(/display\(Javascript\(r"""([\s\S]*?)"""\)\)/);
    if(!htmlMatch||!jsMatch)throw new Error('Could not extract the 4I HTML and JavaScript blocks.');
    loading.remove();
    document.body.insertAdjacentHTML('beforeend',htmlMatch[1]);
    const script=document.createElement('script');
    script.textContent=jsMatch[1];
    document.body.appendChild(script);
  }catch(error){
    console.error('Galaxy Viewer 4I browser launcher failure',error);
    loading.textContent=`Galaxy Viewer 4I failed to load: ${error.message}`;
  }
})();
</script>
</body>
</html>
