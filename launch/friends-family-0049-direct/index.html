<!doctype html>
<html lang="en">
<head>

<link rel="preload" href="../../viewer/artwork/Fonts/Space%20Age%20Regular%20GV-9/Space%20Age%20GV-9A.otf" as="font" type="font/otf" crossorigin>

<style>
@font-face{font-family:"GV Space Age";src:url("../../viewer/artwork/Fonts/Space%20Age%20Regular%20GV-9/Space%20Age%20GV-9A.otf") format("opentype");font-display:block}
@font-face{font-family:"Space Age";src:url("../../viewer/releases/splash/Galaxy-Viewer-Singularity-FINAL/Space-Age.otf") format("opentype");font-display:block}
html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#000;color:#fff;font-family:"GV Space Age","Space Age",Arial,sans-serif!important}
#cover{position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;background:#000;text-align:center;opacity:0;transition:opacity .25s ease;pointer-events:none}
.fonts-ready #cover{opacity:1}
#splash-wrap{position:relative;width:min(86vw,430px);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 18px rgba(80,190,255,.7))}
#splash{width:100%;height:100%;object-fit:contain;animation:gvSplashPulse 4.2s ease-in-out infinite;transform-origin:50% 50%}
#splash-comet{position:absolute;left:50%;top:50%;width:0;height:0;animation:gvCometOrbit 2.7s linear infinite;pointer-events:none}
#splash-comet i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:#62D8FF;transform:rotate(var(--a)) translateY(-140px) scale(var(--s));opacity:var(--o);box-shadow:0 0 7px rgba(98,216,255,.9)}
#splash-comet i:nth-child(1){--a:0deg;--s:1;--o:1;background:#fff;box-shadow:0 0 5px 2px #fff,0 0 12px 4px #62D8FF}
#splash-comet i:nth-child(2){--a:-15deg;--s:.88;--o:.84}#splash-comet i:nth-child(3){--a:-30deg;--s:.76;--o:.68}#splash-comet i:nth-child(4){--a:-45deg;--s:.64;--o:.52}#splash-comet i:nth-child(5){--a:-60deg;--s:.52;--o:.38}#splash-comet i:nth-child(6){--a:-75deg;--s:.42;--o:.26}#splash-comet i:nth-child(7){--a:-90deg;--s:.32;--o:.16}#splash-comet i:nth-child(8){--a:-105deg;--s:.24;--o:.08}
.label{color:#f2fdff;text-shadow:-1px 0 #063f8f,0 1px #063f8f,1px 0 #063f8f,0 -1px #063f8f,0 0 12px #058cff;font:400 17px/1 "GV Space Age","Space Age",Arial,sans-serif!important;letter-spacing:1.2px;text-transform:uppercase;min-height:20px}
#build-label{margin-top:-4px}.launch-note{margin-top:4px;color:#8ddcff;font:400 8px/1.4 "GV Space Age","Space Age",Arial,sans-serif!important;letter-spacing:1.4px;text-transform:uppercase;text-shadow:0 0 8px rgba(88,191,255,.75)}
#err{display:none;position:fixed;inset:0;z-index:2147483647;box-sizing:border-box;padding:22px;background:#000;color:#FFD166;white-space:pre-wrap;font:13px/1.45 monospace;overflow:auto}
@keyframes gvSplashPulse{0%,100%{transform:scale(.985);filter:brightness(.95) saturate(1)}50%{transform:scale(1.02);filter:brightness(1.12) saturate(1.12)}}
@keyframes gvCometOrbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@media(max-height:740px){#splash-wrap{width:min(72vw,330px)}#splash-comet i{transform:rotate(var(--a)) translateY(-108px) scale(var(--s))}.label{font-size:15px}.launch-note{font-size:7px}}
</style>
</head>
<body>
<div id="cover">
  <div id="splash-wrap" aria-hidden="true">
    <img id="splash" src="../../viewer/releases/splash/Galaxy-Viewer-Singularity-FINAL/Galaxy-Splash.png?v=ff0049-splash-clean-0001" alt="GALAXY VIEWER">
    <span id="splash-comet"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
  </div>
  <div class="label" id="version-label">VERSION GV-beta-200-013</div>
  <div class="label" id="build-label">BUILD 0049</div>
  <div class="launch-note">Initializing Galaxy Viewer</div>
</div>
<div id="err"></div>
<script>
(async()=>{
'use strict';
const BUILD='0049';
const TIMEOUT=45000;
const MIN_SPLASH_MS=2600;
const cover=document.getElementById('cover');
const err=document.getElementById('err');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const splashStarted=performance.now();
async function readyFonts(){
  try{
    await Promise.all([
      document.fonts.load('400 17px "GV Space Age"'),
      document.fonts.load('400 17px "Space Age"')
    ]);
    await document.fonts.ready;
  }catch(_){}
  document.documentElement.classList.add('fonts-ready');
}
await readyFonts();
const nonce=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const candidates=[
  '../../viewer/GV-beta-200-013.py',
  'https://gear66me-ui.github.io/Galaxy_Viewer/viewer/GV-beta-200-013.py',
  'https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/3d1e1f8b36efe011d1cded4c0169fd949f6ec47d/viewer/GV-beta-200-013.py',
  'https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/beta/viewer/GV-beta-200-013.py'
];
function bust(url){return url+(url.includes('?')?'&':'?')+'ffdirect='+encodeURIComponent(nonce)}
function fail(message){err.style.display='block';err.textContent='GALAXY VIEWER FAILED TO LOAD\n\n'+message}
async function fetchText(url){
  const u=bust(url);
  try{
    const r=await fetch(u,{cache:'no-store',mode:url.startsWith('http')?'cors':'same-origin'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    return await r.text();
  }catch(fetchError){
    return await new Promise((resolve,reject)=>{
      try{
        const x=new XMLHttpRequest();
        x.open('GET',u,true);
        x.timeout=20000;
        x.onload=()=>x.status>=200&&x.status<300?resolve(x.responseText):reject(new Error('XHR HTTP '+x.status));
        x.onerror=()=>reject(new Error('XHR network failure after fetch failure: '+fetchError.message));
        x.ontimeout=()=>reject(new Error('XHR timeout after fetch failure: '+fetchError.message));
        x.send();
      }catch(xhrError){reject(new Error('FETCH '+fetchError.message+' / XHR '+xhrError.message))}
    });
  }
}
async function loadSource(){
  const errors=[];
  for(const url of candidates){
    try{
      const text=await fetchText(url);
      if(text.includes("const GV200001_BUILD='0049'"))return text;
      errors.push(url+' :: fetched but build marker missing');
    }catch(e){errors.push(url+' :: '+(e&&e.message?e.message:String(e)))}
  }
  throw new Error(errors.join('\n'));
}
function mountHtml(html){
  const t=document.createElement('template');
  t.innerHTML=html;
  for(const node of [...t.content.childNodes]){
    if(node.nodeName==='SCRIPT'){
      const s=document.createElement('script');
      for(const a of [...node.attributes])s.setAttribute(a.name,a.value);
      s.textContent=node.textContent;
      document.body.appendChild(s);
    }else document.body.appendChild(node);
  }
}
function extract(src){
  const html=(src.match(/display\(HTML\(\"\"\"([\s\S]*?)\"\"\"\)\)/)||[])[1];
  const js=[...src.matchAll(/display\(Javascript\(r?\"\"\"([\s\S]*?)\"\"\"\)\)/g)].map(m=>m[1]);
  if(!html||!js.length)throw new Error('Viewer extraction failed from Build 49 source');
  return {html,js};
}
try{
  const source=await loadSource();
  const declared=(source.match(/const GV200001_BUILD='(\d{4})'/)||[])[1]||'';
  if(declared!==BUILD)throw new Error('Build mismatch: expected '+BUILD+' got '+declared);
  const parts=extract(source);
  mountHtml(parts.html);
  for(const code of parts.js){const s=document.createElement('script');s.textContent=code;document.body.appendChild(s)}
  const deadline=performance.now()+TIMEOUT;
  while(performance.now()<deadline){
    const root=document.getElementById('aladin-cosmic-command-test');
    if(root&&root.querySelector('canvas')){
      const elapsed=performance.now()-splashStarted;
      if(elapsed<MIN_SPLASH_MS)await sleep(MIN_SPLASH_MS-elapsed);
      await sleep(450);
      if(cover.isConnected)cover.remove();
      return;
    }
    await sleep(120);
  }
  throw new Error('Viewer startup timeout after loading Build 49 source');
}catch(e){console.error(e);fail(e&&e.stack?e.stack:String(e))}
})();
</script>
</body>
</html>
