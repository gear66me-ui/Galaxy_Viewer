<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GALAXY VIEWER — BUILD 0049 DIRECT</title>
<style>
@font-face{font-family:"GV Space Age";src:url("../../viewer/artwork/Fonts/Space%20Age%20Regular%20GV-9/Space%20Age%20GV-9A.otf") format("opentype");font-display:swap}
@font-face{font-family:"Space Age";src:url("../../viewer/releases/splash/Galaxy-Viewer-Singularity-FINAL/Space-Age.otf") format("opentype");font-display:swap}
html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#000;color:#fff;font-family:"GV Space Age","Space Age",Arial,sans-serif!important}#cover{position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#000;text-align:center}#logo{width:min(42vw,220px);height:min(42vw,220px);object-fit:contain}.label{color:#f2fdff;text-shadow:0 0 12px #058cff;font:400 17px/1 "GV Space Age","Space Age",Arial,sans-serif!important;letter-spacing:1.2px}.spin{width:42px;height:42px;border:3px solid rgba(98,216,255,.25);border-top-color:#fff;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}#err{display:none;position:fixed;inset:0;z-index:2147483647;box-sizing:border-box;padding:22px;background:#000;color:#FFD166;white-space:pre-wrap;font:13px/1.45 monospace;overflow:auto}
</style>
</head>
<body>
<div id="cover"><img id="logo" src="../../viewer/artwork/icon.svg" alt="GALAXY VIEWER"><div class="label">VERSION GV-beta-200-013</div><div class="label">BUILD 0049</div><div class="spin"></div></div><div id="err"></div>
<script>
(async()=>{
'use strict';
const BUILD='0049';
const TIMEOUT=45000;
const cover=document.getElementById('cover');
const err=document.getElementById('err');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const nonce=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const candidates=[
  '../../viewer/GV-beta-200-013.py',
  'https://gear66me-ui.github.io/Galaxy_Viewer/viewer/GV-beta-200-013.py',
  'https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/3d1e1f8b36efe011d1cded4c0169fd949f6ec47d/viewer/GV-beta-200-013.py',
  'https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/beta/viewer/GV-beta-200-013.py'
];
function bust(url){return url+(url.includes('?')?'&':'?')+'ffdirect='+encodeURIComponent(nonce)}
function fail(message){err.style.display='block';err.textContent='GALAXY VIEWER FAILED TO LOAD\n\n'+message}
async function fetchText(url){
  const u=bust(url);
  try{
    const r=await fetch(u,{cache:'no-store',mode:url.startsWith('http')?'cors':'same-origin'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    return await r.text();
  }catch(fetchError){
    return await new Promise((resolve,reject)=>{
      try{
        const x=new XMLHttpRequest();
        x.open('GET',u,true);
        x.timeout=20000;
        x.onload=()=>x.status>=200&&x.status<300?resolve(x.responseText):reject(new Error('XHR HTTP '+x.status));
        x.onerror=()=>reject(new Error('XHR network failure after fetch failure: '+fetchError.message));
        x.ontimeout=()=>reject(new Error('XHR timeout after fetch failure: '+fetchError.message));
        x.send();
      }catch(xhrError){reject(new Error('FETCH '+fetchError.message+' / XHR '+xhrError.message))}
    });
  }
}
async function loadSource(){
  const errors=[];
  for(const url of candidates){
    try{
      const text=await fetchText(url);
      if(text.includes("const GV200001_BUILD='0049'"))return text;
      errors.push(url+' :: fetched but build marker missing');
    }catch(e){errors.push(url+' :: '+(e&&e.message?e.message:String(e)))}
  }
  throw new Error(errors.join('\n'));
}
function installViewerFixStyle(){
  if(document.getElementById('gv-ff0049-visibility-fix'))return;
  const style=document.createElement('style');
  style.id='gv-ff0049-visibility-fix';
  style.textContent=`
@font-face{font-family:"GV Space Age";src:url("../../viewer/artwork/Fonts/Space%20Age%20Regular%20GV-9/Space%20Age%20GV-9A.otf") format("opentype");font-display:swap}
@font-face{font-family:"Space Age";src:url("../../viewer/releases/splash/Galaxy-Viewer-Singularity-FINAL/Space-Age.otf") format("opentype");font-display:swap}
#aladin-cosmic-command-test,#aladin-cosmic-command-test *{font-family:"GV Space Age","Space Age",Arial,sans-serif!important}
#gv-version-readout{font:400 8px/1 "GV Space Age","Space Age",Arial,sans-serif!important;letter-spacing:.3px!important;color:#9edcff!important;text-shadow:0 0 5px rgba(141,218,255,.9),0 0 10px rgba(88,191,255,.65)!important;top:-15px!important;display:block!important;visibility:visible!important;opacity:1!important}
#gv-navigation-host{position:fixed!important;left:50%!important;bottom:max(104px,calc(env(safe-area-inset-bottom) + 92px))!important;z-index:2147483000!important;display:flex!important;gap:5px!important;width:min(430px,calc(100vw - 20px))!important;transform:translateX(-50%)!important;pointer-events:auto!important;visibility:visible!important;opacity:1!important;overflow:visible!important}
#gv-navigation-host .gv-galaxy-navigator,#gv-random-galaxy,.gv-galaxy-history{display:flex!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important}
#gv-random-galaxy{min-height:42px!important;height:42px!important;flex:1 1 auto!important}
@media(max-height:740px){#gv-navigation-host{bottom:max(82px,calc(env(safe-area-inset-bottom) + 70px))!important}}
`;
  document.head.appendChild(style);
}
function mountHtml(html){
  const t=document.createElement('template');
  t.innerHTML=html;
  for(const node of [...t.content.childNodes]){
    if(node.nodeName==='SCRIPT'){
      const s=document.createElement('script');
      for(const a of [...node.attributes])s.setAttribute(a.name,a.value);
      s.textContent=node.textContent;
      document.body.appendChild(s);
    }else document.body.appendChild(node);
  }
  installViewerFixStyle();
}
function patchSource(src){
  let s=String(src||'');
  s=s.replace("const fresh=url=>`${url}${url.includes('?')?'&':'?'}v=GV200001-${GV200001_BUILD}`;","const fresh=url=>`${url}${url.includes('?')?'&':'?'}v=GV200001-${GV200001_BUILD}-ffdirect-${Date.now().toString(36)}`;");
  s=s.replace("#gv-navigation-host{position:absolute;left:50%;bottom:12px;z-index:7300;display:flex;gap:5px;width:min(430px,calc(100vw - 20px));transform:translateX(-50%);pointer-events:auto}","#gv-navigation-host{position:fixed;left:50%;bottom:max(104px,calc(env(safe-area-inset-bottom) + 92px));z-index:2147483000;display:flex;gap:5px;width:min(430px,calc(100vw - 20px));transform:translateX(-50%);pointer-events:auto;visibility:visible;opacity:1;overflow:visible}");
  s=s.replace("font:'400 8px/1 \"GV Space Age\",sans-serif'","font:'400 8px/1 \"GV Space Age\",\"Space Age\",Arial,sans-serif'");
  return s;
}
function extract(src){
  const html=(src.match(/display\(HTML\(\"\"\"([\s\S]*?)\"\"\"\)\)/)||[])[1];
  const js=[...src.matchAll(/display\(Javascript\(r?\"\"\"([\s\S]*?)\"\"\"\)\)/g)].map(m=>m[1]);
  if(!html||!js.length)throw new Error('Viewer extraction failed from Build 49 source');
  return {html,js};
}
function keepControlsVisible(){
  installViewerFixStyle();
  const host=document.getElementById('gv-navigation-host');
  if(host){
    host.style.setProperty('position','fixed','important');
    host.style.setProperty('left','50%','important');
    host.style.setProperty('bottom','max(104px, calc(env(safe-area-inset-bottom) + 92px))','important');
    host.style.setProperty('z-index','2147483000','important');
    host.style.setProperty('display','flex','important');
    host.style.setProperty('visibility','visible','important');
    host.style.setProperty('opacity','1','important');
    host.style.setProperty('pointer-events','auto','important');
  }
  const readout=document.getElementById('gv-version-readout');
  if(readout){
    readout.style.setProperty('font','400 8px/1 "GV Space Age","Space Age",Arial,sans-serif','important');
    readout.style.setProperty('display','block','important');
    readout.style.setProperty('visibility','visible','important');
    readout.style.setProperty('opacity','1','important');
  }
}
try{
  const source=patchSource(await loadSource());
  const declared=(source.match(/const GV200001_BUILD='(\d{4})'/)||[])[1]||'';
  if(declared!==BUILD)throw new Error('Build mismatch: expected '+BUILD+' got '+declared);
  const parts=extract(source);
  mountHtml(parts.html);
  installViewerFixStyle();
  for(const code of parts.js){const s=document.createElement('script');s.textContent=code;document.body.appendChild(s)}
  const interval=setInterval(keepControlsVisible,250);
  const deadline=performance.now()+TIMEOUT;
  while(performance.now()<deadline){
    keepControlsVisible();
    const root=document.getElementById('aladin-cosmic-command-test');
    const nav=document.getElementById('gv-random-galaxy');
    if(root&&root.querySelector('canvas')&&nav){await sleep(1800);keepControlsVisible();if(cover.isConnected)cover.remove();clearInterval(interval);return}
    await sleep(120);
  }
  throw new Error('Viewer startup timeout after loading Build 49 source');
}catch(e){console.error(e);fail(e&&e.stack?e.stack:String(e))}
})();
</script>
</body>
</html>
