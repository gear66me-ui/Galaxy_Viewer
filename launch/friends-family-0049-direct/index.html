<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GALAXY VIEWER — BUILD 0049 DIRECT</title>
<style>
@font-face{font-family:"GV Space Age";src:url("../../viewer/artwork/Fonts/Space%20Age%20Regular%20GV-9/Space%20Age%20GV-9A.otf") format("opentype");font-display:block}
@font-face{font-family:"Space Age";src:url("../../viewer/releases/splash/Galaxy-Viewer-Singularity-FINAL/Space-Age.otf") format("opentype");font-display:block}
html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden;overflow-y:auto;background:#000;color:#fff;font-family:"GV Space Age","Space Age",Arial,sans-serif;-webkit-overflow-scrolling:touch}
#gv-direct-shell{width:100%;min-height:1120px;padding:0 0 120px;background:#000;box-sizing:border-box}
#gv-direct-frame{display:block;width:100%;height:1000px;border:0;background:#000;overflow:hidden}
#cover{position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#000;text-align:center}#logo{width:min(42vw,220px);height:min(42vw,220px);object-fit:contain}.label{color:#f2fdff;text-shadow:0 0 12px #058cff;font:400 17px/1 "GV Space Age","Space Age",Arial,sans-serif!important;letter-spacing:1.2px}.spin{width:42px;height:42px;border:3px solid rgba(98,216,255,.25);border-top-color:#fff;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}#err{display:none;position:fixed;inset:0;z-index:2147483647;box-sizing:border-box;padding:22px;background:#000;color:#FFD166;white-space:pre-wrap;font:13px/1.45 monospace;overflow:auto}
</style>
</head>
<body>
<div id="cover"><img id="logo" src="../../viewer/artwork/icon.svg" alt="GALAXY VIEWER"><div class="label">VERSION GV-beta-200-013</div><div class="label">BUILD 0049</div><div class="spin"></div></div><div id="err"></div>
<div id="gv-direct-shell"><iframe id="gv-direct-frame" title="GALAXY VIEWER BUILD 0049" scrolling="no"></iframe></div>
<script>
(async()=>{
'use strict';
function hideParentClose(){try{const button=parent?.document?.getElementById?.('gv-inline-close');if(button){button.style.setProperty('display','none','important');button.style.setProperty('visibility','hidden','important');button.style.setProperty('pointer-events','none','important');button.setAttribute('aria-hidden','true')}}catch(_){}}
hideParentClose();
setInterval(hideParentClose,500);
const VERSION='GV-beta-200-013';
const BUILD='0049';
const APP_VIEWPORT_HEIGHT=1000;
const TIMEOUT=45000;
const cover=document.getElementById('cover');
const err=document.getElementById('err');
const frame=document.getElementById('gv-direct-frame');
const shell=document.getElementById('gv-direct-shell');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const nonce=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const candidates=[
  '../../viewer/GV-beta-200-013.py',
  'https://gear66me-ui.github.io/Galaxy_Viewer/viewer/GV-beta-200-013.py',
  'https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/3d1e1f8b36efe011d1cded4c0169fd949f6ec47d/viewer/GV-beta-200-013.py',
  'https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/beta/viewer/GV-beta-200-013.py'
];
function setArtificialViewport(){frame.style.height=APP_VIEWPORT_HEIGHT+'px';shell.style.minHeight=(APP_VIEWPORT_HEIGHT+120)+'px'}
setArtificialViewport();
function bust(url){return url+(url.includes('?')?'&':'?')+'ffdirect='+encodeURIComponent(nonce)}
function fail(message){err.style.display='block';err.textContent='GALAXY VIEWER FAILED TO LOAD\n\n'+message}
async function fetchText(url){
  const u=bust(url);
  try{
    const r=await fetch(u,{cache:'no-store',mode:url.startsWith('http')?'cors':'same-origin'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    return await r.text();
  }catch(fetchError){
    return await new Promise((resolve,reject)=>{
      try{
        const x=new XMLHttpRequest();
        x.open('GET',u,true);
        x.timeout=20000;
        x.onload=()=>x.status>=200&&x.status<300?resolve(x.responseText):reject(new Error('XHR HTTP '+x.status));
        x.onerror=()=>reject(new Error('XHR network failure after fetch failure: '+fetchError.message));
        x.ontimeout=()=>reject(new Error('XHR timeout after fetch failure: '+fetchError.message));
        x.send();
      }catch(xhrError){reject(new Error('FETCH '+fetchError.message+' / XHR '+xhrError.message))}
    });
  }
}
async function loadSource(){
  const errors=[];
  for(const url of candidates){
    try{
      const text=await fetchText(url);
      if(text.includes("const GV200001_BUILD='0049'"))return text;
      errors.push(url+' :: fetched but build marker missing');
    }catch(e){errors.push(url+' :: '+(e&&e.message?e.message:String(e)))}
  }
  throw new Error(errors.join('\n'));
}
function patchSource(src){
  let s=String(src||'');
  s=s.replace("const fresh=url=>`${url}${url.includes('?')?'&':'?'}v=GV200001-${GV200001_BUILD}`;","const fresh=url=>`${url}${url.includes('?')?'&':'?'}v=GV200001-${GV200001_BUILD}-ffdirect-${Date.now().toString(36)}`;");
  s=s.replace("destinationPresentationUrl:'https://gear66me-ui.github.io/Galaxy_Viewer/viewer/modules/destination-presentation/gv-destination-presentation.js'","destinationPresentationUrl:'https://gear66me-ui.github.io/Galaxy_Viewer/viewer/modules/destination-presentation/gv-destination-presentation-0049-hotfix.js'");
  return s;
}
function extract(src){
  const html=(src.match(/display\(HTML\(\"\"\"([\s\S]*?)\"\"\"\)\)/)||[])[1];
  const js=[...src.matchAll(/display\(Javascript\(r?\"\"\"([\s\S]*?)\"\"\"\)\)/g)].map(m=>m[1]);
  if(!html||!js.length)throw new Error('Viewer extraction failed from Build 49 source');
  return {html,js};
}
function prepareFrame(){
  const d=frame.contentDocument||frame.contentWindow.document;
  const baseHref=new URL('.',location.href).href;
  d.open();
  d.write('<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><base href="'+baseHref.replace(/"/g,'&quot;')+'"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}</style></head><body></body></html>');
  d.close();
  return d;
}
function mountHtml(d,html){
  const t=d.createElement('template');
  t.innerHTML=html;
  for(const node of [...t.content.childNodes]){
    if(node.nodeName==='SCRIPT'){
      const s=d.createElement('script');
      for(const a of [...node.attributes])s.setAttribute(a.name,a.value);
      s.textContent=node.textContent;
      d.body.appendChild(s);
    }else d.body.appendChild(node);
  }
}
try{
  const source=patchSource(await loadSource());
  const declared=(source.match(/const GV200001_BUILD='(\d{4})'/)||[])[1]||'';
  if(declared!==BUILD)throw new Error('Build mismatch: expected '+BUILD+' got '+declared);
  const parts=extract(source);
  const d=prepareFrame();
  mountHtml(d,parts.html);
  for(const code of parts.js){const s=d.createElement('script');s.textContent=code;d.body.appendChild(s)}
  const deadline=performance.now()+TIMEOUT;
  while(performance.now()<deadline){
    hideParentClose();
    const root=d.getElementById('aladin-cosmic-command-test');
    if(root&&root.querySelector('canvas')){await sleep(1600);hideParentClose();if(cover.isConnected)cover.remove();return}
    await sleep(120);
  }
  throw new Error('Viewer startup timeout after loading Build 49 source');
}catch(e){console.error(e);fail(e&&e.stack?e.stack:String(e))}
})();
</script>
</body>
</html>
