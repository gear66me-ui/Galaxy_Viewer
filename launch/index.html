<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Galaxy Viewer — Choose How to Open</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff}
body{min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
main{width:min(100%,420px)}
h1{margin:0 0 10px;font-size:clamp(28px,8vw,42px);line-height:1.05}
p{margin:0 0 24px;color:#bfc7d5;font-size:16px}
.choices{display:grid;gap:14px}
a{display:flex;align-items:center;justify-content:center;min-height:58px;padding:14px 18px;border:1px solid #45e7ff;border-radius:12px;color:#fff;text-decoration:none;font-size:18px;font-weight:750;background:#07131b}
a:active{transform:scale(.99)}
.secondary{border-color:#7575ff;background:#111127}
small{display:block;margin-top:20px;color:#7d8796;line-height:1.4}
</style>
</head>
<body>
<main>
<h1>Galaxy Viewer</h1>
<p>Pick how you want to open it.</p>
<div class="choices">
<a class="primary" href="../mobile/">Open Mobile App</a>
<a class="secondary" href="./4N/">Open Web Browser</a>
</div>
<small>The mobile option opens the installed Galaxy Viewer experience when available. The web option opens release 4N in your browser.</small>
</main>
</body>
</html>
