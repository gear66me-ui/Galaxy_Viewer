<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>GALAXY VIEWER — 6U</title>
<link rel="icon" href="../viewer/artwork/icon_target_vector.svg?v=6U-coordinate-fit-001" type="image/svg+xml">
<link rel="apple-touch-icon" href="../viewer/artwork/icon_target_vector.svg?v=6U-coordinate-fit-001">
<style>
@font-face{font-family:"Space Age";src:url("../viewer/artwork/Fonts/Space%20Age/space%20age.otf?v=6U-coordinate-fit-001") format("opentype");font-style:normal;font-weight:400;font-display:swap}
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff}
body{min-height:100vh;display:grid;place-items:center;padding:24px;font-family:"Space Age",sans-serif;text-align:center;text-transform:uppercase}
main{width:min(100%,420px)}
.gv-glyph{display:inline-block;transform:scaleY(1.5);transform-origin:center}
.badge{display:inline-block;margin-bottom:30px;padding:6px 10px;border:1px solid #7575ff;border-radius:999px;color:#f0edff;background:#111126;font-size:12px;letter-spacing:.08em;box-shadow:0 0 16px rgba(117,117,255,.28)}
.choices{display:grid;gap:18px}
a{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:14px;min-height:86px;padding:12px 18px;border:2px solid #7575ff;border-radius:12px;color:#fff;text-decoration:none;font-size:19px;background:#101024;box-shadow:0 0 18px rgba(117,117,255,.24)}
a img{width:48px;height:48px;object-fit:contain}
a .label{text-align:center}
a:active{transform:scale(.99)}
</style>
</head>
<body>
<main>
<div class="badge"><span class="gv-glyph">GALAXY VIEWER · 6U</span></div>
<div class="choices">
<a id="gv-open-app" href="../mobile/beta/?source=6u-app&v=6U-coordinate-fit-001"><img src="../viewer/artwork/icon_target_vector.svg?v=6U-coordinate-fit-001" alt=""><span class="label"><span class="gv-glyph">LAUNCH APP VERSION</span></span><span aria-hidden="true"></span></a>
<a id="gv-open-web" href="../mobile/beta/?source=6u-web&v=6U-coordinate-fit-001"><img src="../viewer/artwork/icon_target_vector.svg?v=6U-coordinate-fit-001" alt=""><span class="label"><span class="gv-glyph">LAUNCH WEB VERSION</span></span><span aria-hidden="true"></span></a>
</div>
</main>
<script>
(()=>{
  const appButton=document.getElementById('gv-open-app');
  const fallback='https://gear66me-ui.github.io/Galaxy_Viewer/mobile/beta/?source=6u-app&v=6U-coordinate-fit-001';
  const intent='intent://gear66me-ui.github.io/Galaxy_Viewer/mobile/beta/?source=6u-app&v=6U-coordinate-fit-001#Intent;scheme=https;S.browser_fallback_url='+encodeURIComponent(fallback)+';end';
  appButton.addEventListener('click',event=>{
    if(/Android/i.test(navigator.userAgent)){
      event.preventDefault();
      window.location.href=intent;
    }
  });
})();
</script>
</body>
</html>
