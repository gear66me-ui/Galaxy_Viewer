name: Build Galaxy Viewer Android 8W

on:
  push:
    branches:
      - beta
    paths:
      - '.github/workflows/build-galaxy-viewer-android-8W.yml'
      - 'android/galaxy-viewer/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android/galaxy-viewer
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK exists
        run: test -f android/galaxy-viewer/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Galaxy Viewer 8W APK
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Viewer-8W-debug-apk
          path: android/galaxy-viewer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
