name: Update 9I designation fallback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-9i-designation-fallback.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply 9I designation hierarchy only
        shell: bash
        run: |
          set -euo pipefail
          SITE_BLOB=$(git hash-object mobile/beta/9I.html)
          LAUNCH_SITE_BLOB=$(git hash-object launch/9I/index.html)
          git fetch origin beta main
          test "$(git rev-parse origin/beta:viewer/GV-beta-0009J.py)" = "02c1070ee8f1528f7c04a53d81b79f2d044bde3f"
          python - <<'PY'
          from pathlib import Path
          p=Path('viewer/GV-beta-0009I.py')
          s=p.read_text()
          old='''    function extractDesignation(candidate){
              const texts=[candidate?.name,candidate?.title].map(value=>String(value||'').trim()).filter(Boolean);
              for(const text of texts){
                  const match=text.match(/\\b(?:M|NGC|IC|UGC|PGC)\\s*[- ]?\\s*\\d+[A-Z]?\\b/i);
                  if(match)return match[0].replace(/\\s+/g,' ').toUpperCase();
              }
              return '';
          }
          '''
          new='''    function extractDesignation(candidate){
              const explicit=String(candidate?.designation||'').trim();
              const texts=[explicit,candidate?.name,candidate?.title,candidate?.displayName,candidate?.imageType,candidate?.category]
                  .map(value=>String(value||'').trim()).filter(Boolean);
              const joined=texts.join(' | ');

              if(/stephan(?:'|’)?s\\s+quintet/i.test(joined))return 'HCG 92';

              for(const text of texts){
                  let match=text.match(/\\bHCG\\s*[- ]?\\s*(\\d+[A-Z]?)\\b/i);
                  if(match)return `HCG ${match[1].toUpperCase()}`;
                  match=text.match(/\\bHICKSON(?:\\s+COMPACT\\s+GROUP)?\\s*[- ]?\\s*(\\d+[A-Z]?)\\b/i);
                  if(match)return `HCG ${match[1].toUpperCase()}`;
                  match=text.match(/\\bABELL\\s*[- ]?\\s*(\\d+[A-Z]?)\\b/i);
                  if(match)return `ABELL ${match[1].toUpperCase()}`;
              }

              if(explicit)return explicit.toUpperCase();

              for(const text of texts){
                  const match=text.match(/\\b(?:M|NGC|IC|UGC|PGC|ARP)\\s*[- ]?\\s*\\d+[A-Z]?\\b/i);
                  if(match)return match[0].replace(/\\s+/g,' ').toUpperCase();
              }

              if(/\\b(?:galaxy\\s+cluster|cluster\\s+of\\s+galaxies|galaxies\\s+cluster)\\b/i.test(joined))return 'GALAXY CLUSTER';
              if(/\\b(?:compact\\s+group|galaxy\\s+group|group\\s+of\\s+galaxies)\\b/i.test(joined))return 'GALAXY GROUP';
              if(/\\b(?:galaxy\\s+pair|pair\\s+of\\s+galaxies|interacting\\s+galaxies)\\b/i.test(joined))return 'GALAXY PAIR';
              if(/\\b(?:star\\s+cluster|stellar\\s+cluster)\\b/i.test(joined))return 'STAR CLUSTER';
              if(/\\b(?:star\\s+field|stellar\\s+field)\\b/i.test(joined))return 'STAR FIELD';
              if(/\\bstar\\b/i.test(joined)&&!/\\bgalax/i.test(joined))return 'STAR';
              if(/\\bnebula\\b/i.test(joined))return 'NEBULA';
              return 'GALAXY';
          }
          '''
          if s.count(old)!=1:
              raise SystemExit('REFUSE: exact 9I extractDesignation baseline not found')
          s=s.replace(old,new,1)
          old_source="source:'ESA/HUBBLE GALAXIES CATALOG FULL-0001'"
          if s.count(old_source)==1:
              s=s.replace(old_source,"source:'ESA/HUBBLE GALAXIES CATALOG FULL-0002'",1)
          p.write_text(s)
          PY
          NEW_BLOB=$(git hash-object viewer/GV-beta-0009I.py)
          python - "$NEW_BLOB" <<'PY'
          from pathlib import Path
          import re,sys
          sha=sys.argv[1]
          p=Path('mobile/beta/9I-app.html')
          s=p.read_text()
          n=re.sub(r'GV-beta-0009I\.py\?v=[0-9a-f]+',f'GV-beta-0009I.py?v={sha}',s,count=1)
          if n==s:
              raise SystemExit('REFUSE: 9I app launcher cache reference not found')
          p.write_text(n)
          PY
          test "$(git hash-object mobile/beta/9I.html)" = "$SITE_BLOB"
          test "$(git hash-object launch/9I/index.html)" = "$LAUNCH_SITE_BLOB"
          grep -F "return 'GALAXY';" viewer/GV-beta-0009I.py
          grep -F "return 'GALAXY CLUSTER';" viewer/GV-beta-0009I.py
          grep -F "return 'GALAXY GROUP';" viewer/GV-beta-0009I.py
          grep -F "return 'HCG 92';" viewer/GV-beta-0009I.py
          test "$(git rev-parse origin/beta:viewer/GV-beta-0009J.py)" = "02c1070ee8f1528f7c04a53d81b79f2d044bde3f"
          git config user.name 'Galaxy Viewer Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add viewer/GV-beta-0009I.py mobile/beta/9I-app.html
          git commit -m 'Ensure 9I designation is never blank'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "COMMIT=$(git rev-parse HEAD)"
          echo "VIEWER_BLOB=$(git hash-object viewer/GV-beta-0009I.py)"
          echo "LAUNCHER_BLOB=$(git hash-object mobile/beta/9I-app.html)"
          echo "SITE_BLOB=$(git hash-object mobile/beta/9I.html)"
