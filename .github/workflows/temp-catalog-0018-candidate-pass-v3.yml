name: Temporary generate conservative Catalog 0018 pseudonym candidates v3

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/temp-catalog-0018-candidate-pass-v3.yml'

permissions:
  contents: write

jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Generate conservative candidates only
        shell: bash
        run: |
          git fetch origin beta
          git reset --hard origin/beta
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0018.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          forbidden=re.compile(r'\b(?:hubble|image|images|imaging|ground[- ]based|telescope|observatory|camera|instrument|exposure)\b',re.I)
          catalog=re.compile(r'\b(?:NGC|IC|UGC|UGCA|MACS|eMACS|RXC|RCS2?|Abell|ESO|SDSS|2XMM|PSZ1?|ACT-CL|IRAS|LMC|SMC|LEDA|MCG|AM|Arp|2MASX|WINGS|HerS|Messier|PGC|ACO|HCG|DDO|Mrk|Markarian|Fornax|GAMA|PLCK|ZwCl|VV|REP|HST|MS|CL|RX|3C|CGCG|LRG|Ka|CDG|Z\s|MXDF)\b',re.I)
          def flagged(e):
              n=(e.get('displayName') or '').strip(); des=(e.get('designation') or '').strip()
              return (not n or re.search(r'\d',n) or forbidden.search(n) or catalog.search(n) or len(n.split())>8 or (des and des.lower() in n.lower() and n.lower()!=des.lower()))

          known={
            'NGC 1300':'Prototypical Barred Spiral','NGC 6217':'Barred Spiral Galaxy','NGC 7049':'Backlit Dust-Lane Galaxy','NGC 1672':'Spiral-Arm Stellar Nursery','NGC 1510 / NGC 1512':'Interacting Spiral and Dwarf','NGC 4526':'Whirling Lenticular Galaxy','UGC 8091':'Dwarf Irregular Galaxy','M 83':'Southern Pinwheel Galaxy','NGC 4449':'Stellar Fireworks Galaxy','NGC 660':'Polar Ring Galaxy','NGC 1132':'Fossil Group Giant','NGC 346':'Stellar Sculptors','LEDA 1313424':'Bullseye','NGC 2207 / IC 2163':'Interacting Spiral Pair','REP: M 87':'Black Hole Jet and Nova','M 87':'Virgo A','IC 1954':'Asymmetric Spiral Galaxy','MCG -03-34-064':'Dual Active Nuclei','UGC 12158':'Asteroid-Photobombed Galaxy','NGC 3783':'Active Spiral Galaxy','AM 1054-325':'String-of-Pearls Galaxy','J020941.1+001557':'So Near, So Far','Abell 3192':'One Cluster or Two','MACS J0416.1-2403':'Christmas Tree Galaxy Cluster','IC 5332':'Weakly Barred Spiral','2MASX J05101744-4519179':'Clear-View Galaxy Cluster','Arp 263':'Starstruck Irregular Galaxy','eMACS J1353.7+4329':'Galactic Monster Mash','J211347.41+022834.9':'Under the Sea','NGC 2442':'Meathook Galaxy','LEDA 36252':'Cosmic Tadpole','NGC 253':'Sculptor Galaxy','NGC 300':'Sculptor Pinwheel Galaxy','NGC 4163':'Dwarf Irregular Galaxy','NGC 3077':'Dwarf Irregular Galaxy','NGC 6946':'Fireworks Galaxy','M 81':"Bode's Galaxy",'M 100':'Grand Design Spiral','NGC 6240':'Tangled Merger Galaxy','NGC 1512 / IRAS 04022-4329':'Barred Spiral Galaxy','Abell 370':'Frontier Fields Cluster','Abell 1758':'Merging Galaxy Cluster','Abell 1689':'Gravitational Lens Cluster','NGC 5256':'Interacting Galaxies','NGC 922':'Collisional Ring Galaxy','NGC 2841':'Flocculent Spiral','M 77':'Squid Galaxy','NGC 4214':'Dwarf Starburst Galaxy','NGC 4921':'Anemic Spiral Galaxy','NGC 1600':'Giant Elliptical Galaxy','NGC 2976':'Dwarf Spiral Galaxy','UGC 9391':'Cepheid Host Galaxy','NGC 1073':'Barred Spiral Galaxy','NGC 4150':'Lenticular Galaxy','HCG 31':'Interacting Galaxy Group','NGC 4314 / IRAS 12200+3010':'Barred Spiral Galaxy','NGC 1808 / IRAS 05059-3734':'Starburst Galaxy','NGC 2366 / IRAS 07233+6917':'Dwarf Irregular Galaxy','M 33 / NGC 604':'Triangulum Star-Forming Region','NGC 1365 / IRAS 03317-3618':'Great Barred Spiral','Dwingeloo 1':'Hidden Spiral Galaxy','NGC 2363 / NGC 2366':'Giant Star-Forming Region','NGC 7173':'Elliptical Galaxy','NGC 3370 / IRAS 10444+1732':'Supernova Host Galaxy','NGC 3982':'Spiral Galaxy','NGC 4365':'Elliptical Galaxy','NGC 3310 / IRAS 10356+5345':'Starburst Galaxy','NGC 2903 / IRAS 09293+2143':'Barred Spiral Galaxy','HCG 87':'Compact Galaxy Group'
          }
          catchy=[
            ('sunburst arc','Sunburst Arc'),('galactic wings','Galactic Wings'),('jellyfish','Jellyfish Galaxy'),('meathook','Meathook Galaxy'),('cosmic tadpole','Cosmic Tadpole'),('galactic seascape','Galactic Seascape'),('cosmic contortions','Cosmic Contortions'),('galactic soup','Galactic Soup'),('galactic monster mash','Galactic Monster Mash'),('cosmic optical illusion','Cosmic Optical Illusion'),('galactic fireflies','Galactic Fireflies'),('light bends from the beyond','Light Bends from Beyond'),('lure of the rings','Lure of the Rings'),('under the sea','Under the Sea'),('one cluster or two','One Cluster or Two'),('so near, or so far','So Near, So Far'),('one of the greats','One of the Greats'),('magnifying the distant universe','Magnifying the Distant Universe'),('explosive secret','Explosive Secret Galaxy'),('slashing smudge','Slashing Smudge Galaxy'),('stellar sculptors','Stellar Sculptors'),('colourful clouds','Colourful Clouds'),('polar ring','Polar Ring Galaxy'),('sleeping giant','Sleeping Giant Galaxy'),('messy star factory','Messy Star Factory'),('bizarre cosmic quartet','Bizarre Cosmic Quartet'),('galactic neighbourhood','Galactic Neighbourhood'),('galactic pioneer','Galactic Pioneer'),('cosmic hair ruffling','Cosmic Hair Ruffling'),('celestial composition','Celestial Composition'),('cosmic fireworks','Cosmic Fireworks'),('stellar fireworks','Stellar Fireworks Galaxy'),('string-of-pearls','String-of-Pearls Galaxy'),('grand design spiral','Grand Design Spiral'),('stellar nursery','Stellar Nursery'),('menagerie of galaxies','Menagerie of Galaxies'),('our giant universe','Our Giant Universe'),('galaxy silhouettes','Galaxy Silhouettes'),('odd couple','Odd Couple'),('minuet of galaxies','Minuet of Galaxies'),('a bright find','Bright Cosmic Find'),('misbehaving spiral','Misbehaving Spiral'),('galactic pioneer','Galactic Pioneer'),('distant and ancient','Distant Ancient Galaxy'),('galactic monster mash','Galactic Monster Mash')
          ]
          cluster_prefix=re.compile(r'^(?:Abell|MACS|eMACS|ACO|CL\b|PLCK|PSZ|RX\b|RXC|ZwCl|MS\s*\d|HST\s*\d)',re.I)
          def infer(e):
              aid=(e.get('archiveId') or '')
              des=(e.get('designation') or '').strip()
              text=' '.join(str(e.get(k) or '') for k in ('title','displayName','name','designation')).lower()
              # release-family facts established by ESA/NASA
              if aid.startswith('heic0810'): return 'Interacting Galaxies'
              if aid.startswith('topo9918'): return 'Gravitational Lens'
              if aid.startswith('topo9928'): return 'Distant Galaxy Cluster'
              if aid.startswith('topo9827'): return 'Distant Galaxy Cluster'
              if aid.startswith('topo9910'): return 'Infrared Galaxy'
              if cluster_prefix.search(des): return 'Galaxy Cluster'
              if re.search(r'\bSN\s*\d',e.get('displayName') or '',re.I): return 'Supernova Host Galaxy'
              if 'gravitational lens' in text or 'lensing' in text or 'dark matter ring' in text: return 'Gravitational Lens'
              if 'globular cluster' in text: return 'Globular Cluster'
              if 'galaxy cluster' in text or 'cluster of galaxies' in text: return 'Galaxy Cluster'
              if 'radio galaxy' in text: return 'Radio Galaxy'
              if 'cepheid' in text: return 'Cepheid Host Galaxy'
              if 'star-forming region' in text: return 'Star-Forming Region'
              if 'starburst' in text: return 'Starburst Galaxy'
              if 'dwarf irregular' in text: return 'Dwarf Irregular Galaxy'
              if 'dwarf spheroidal' in text: return 'Dwarf Spheroidal Galaxy'
              if 'dwarf galaxy' in text or 'dwarf' in text: return 'Dwarf Galaxy'
              if 'low-surface-brightness' in text: return 'Low-Surface-Brightness Galaxy'
              if 'polar ring' in text: return 'Polar Ring Galaxy'
              if 'ring galaxy' in text: return 'Ring Galaxy'
              if 'lenticular' in text: return 'Lenticular Galaxy'
              if 'elliptical' in text: return 'Elliptical Galaxy'
              if 'barred spiral' in text: return 'Barred Spiral Galaxy'
              if 'grand design' in text: return 'Grand Design Spiral'
              if 'spiral' in text: return 'Spiral Galaxy'
              if 'merger' in text or 'colliding' in text or 'collision' in text or 'interacting' in text or 'tangled' in text: return 'Interacting Galaxies'
              if 'triplet' in text: return 'Galaxy Triplet'
              if 'quartet' in text: return 'Galaxy Quartet'
              if 'pair' in text: return 'Galaxy Pair'
              if 'black hole' in text or 'active galaxy' in text or 'active galactic' in text: return 'Active Galaxy'
              if 'supernova' in text: return 'Supernova Host Galaxy'
              if 'galaxy' in text: return 'Galaxy Portrait'
              if 'cluster' in text: return 'Star Cluster'
              return 'Galaxy Portrait'
          def candidate(e):
              des=(e.get('designation') or '').strip()
              if des in known: return known[des]
              low=(e.get('title') or '').lower()
              for key,val in catchy:
                  if key in low: return val
              return infer(e)
          rows=[]
          for i,e in enumerate(d['entries'],1):
              if not flagged(e): continue
              new=candidate(e)
              # absolute contract
              if not new or re.search(r'\d',new) or forbidden.search(new) or catalog.search(new) or len(new.split())>8:
                  new='Galaxy Portrait'
              rows.append((i,e.get('archiveId') or '',e.get('designation') or '',e.get('displayName') or '',new,e.get('title') or ''))
          out=Path('viewer/image-databases/Hubble/databases/catalog-0018-pseudonym-candidates-v3.tsv')
          out.write_text('\n'.join('\t'.join(str(x).replace('\t',' ').replace('\n',' ') for x in r) for r in rows)+'\n',encoding='utf-8')
          print('CANDIDATES',len(rows))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/image-databases/Hubble/databases/catalog-0018-pseudonym-candidates-v3.tsv
          git commit -m 'TEMP Catalog 0018 conservative pseudonym candidates v3'
          git pull --rebase origin beta
          git push origin HEAD:beta
