name: Temporary apply final 829 Catalog 0018 pseudonyms

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/temp-apply-catalog-0018-final-829.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Apply original audit pool only
        shell: bash
        run: |
          git fetch origin beta
          git reset --hard origin/beta
          python - <<'PY'
          import csv,json,re
          from pathlib import Path
          cat=Path('viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0018.json')
          audit=Path('viewer/image-databases/Hubble/databases/catalog-0018-pseudonym-audit-remaining.json')
          cand=Path('viewer/image-databases/Hubble/databases/catalog-0018-pseudonym-candidates-v3.tsv')
          d=json.loads(cat.read_text(encoding='utf-8')); entries=d['entries']
          a=json.loads(audit.read_text(encoding='utf-8'))
          target_rows={int(x['row']) for x in a['flagged']}
          if a.get('flaggedCount')!=829 or len(target_rows)!=829:
              raise SystemExit(f'Expected original 829 target rows, got {a.get("flaggedCount")} / {len(target_rows)}')
          cmap={}
          for r in csv.reader(cand.open(encoding='utf-8'),delimiter='\t'):
              if r: cmap[int(r[0])]=r
          missing=sorted(target_rows-set(cmap))
          if missing: raise SystemExit('Missing candidate rows: '+repr(missing[:30]))

          overrides={
              'Abell 2744':"Pandora's Cluster",
              'Abell 2667':'Comet Galaxy',
              '3C 321':'Death Star Galaxy',
              'Messier 89':'Virgo Elliptical Galaxy',
              'REP: Hubble Space Telescope':'Space Observatory',
          }
          forbidden=re.compile(r'\b(?:hubble|image|images|imaging|ground[- ]based|telescope|camera|instrument|exposure)\b',re.I)
          toks=re.compile(r'\b(?:NGC|IC|UGC|UGCA|MACS|eMACS|RXC|RCS2?|Abell|ESO|SDSS|2XMM|PSZ1?|ACT-CL|IRAS|LMC|SMC|LEDA|MCG|AM|Arp|2MASX|WINGS|HerS|Messier|PGC|ACO|HCG|DDO|Mrk|Markarian|GAMA|PLCK|ZwCl|VV|HST|MS\s*\d|3C\s*\d)\b',re.I)
          changed=[]
          for row in sorted(target_rows):
              r=cmap[row]
              _,aid,des,old,new,title=r
              e=entries[row-1]
              if (e.get('archiveId') or '')!=aid or (e.get('designation') or '')!=des or (e.get('displayName') or '')!=old:
                  raise SystemExit('Baseline mismatch row %d: %r' % (row,(aid,des,old,e.get('archiveId'),e.get('designation'),e.get('displayName'))))
              if aid.startswith('heic0810'):
                  new='Interacting Galaxies'
              elif aid.startswith('topo9918'):
                  new='Gravitational Lens'
              elif aid.startswith('topo9928') or aid.startswith('topo9827'):
                  new='Distant Galaxy Cluster'
              elif aid.startswith('topo9910'):
                  new='Infrared Galaxy'
              if des in overrides: new=overrides[des]
              if not new or len(new.split())>8 or re.search(r'\d',new) or forbidden.search(new) or toks.search(new):
                  raise SystemExit(f'Invalid final replacement row {row}: {new!r}')
              if old!=new:
                  e['displayName']=new
                  changed.append((row,aid,des,old,new))

          failures=[]
          for row in sorted(target_rows):
              n=(entries[row-1].get('displayName') or '').strip()
              if not n or len(n.split())>8 or re.search(r'\d',n) or forbidden.search(n) or toks.search(n):
                  failures.append((row,entries[row-1].get('archiveId'),entries[row-1].get('designation'),n))
          if failures: raise SystemExit('Final validation failed: '+repr(failures[:30]))
          if len(changed)<800: raise SystemExit(f'Unexpectedly low changed count {len(changed)}')

          cat.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          out=Path('viewer/image-databases/Hubble/databases/catalog-0018-pseudonym-final-audit.txt')
          out.write_text('targeted=829\nchanged=%d\n'%len(changed)+'\n'.join(f'{r}\t{aid}\t{des}\t{old} -> {new}' for r,aid,des,old,new in changed)+'\n',encoding='utf-8')
          print('TARGETED',len(target_rows),'CHANGED',len(changed),'TOTAL',len(entries))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0018.json viewer/image-databases/Hubble/databases/catalog-0018-pseudonym-final-audit.txt
          git commit -m 'Catalog 0018: finish remaining 829 pseudonyms'
          git pull --rebase origin beta
          git push origin HEAD:beta
