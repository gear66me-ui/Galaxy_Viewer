name: Repair NGC 2655 Hubble Image Span

on:
  workflow_dispatch:
  push:
    branches:
      - release
    paths:
      - .github/workflows/repair-ngc2655-image-span.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: repair-ngc2655-image-span
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Recalculate the catalog image span from the record distance and FOV
        shell: bash
        env:
          CATALOG: viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math, os
          from pathlib import Path

          path = Path(os.environ["CATALOG"])
          data = json.loads(path.read_text(encoding="utf-8"))
          matches = [
              e for e in data.get("entries", [])
              if e.get("archiveId") == "potw1817a" and e.get("designation") == "NGC 2655"
          ]
          if len(matches) != 1:
              raise SystemExit(f"STOP: expected exactly one NGC 2655 / potw1817a record, found {len(matches)}")
          entry = matches[0]
          science = entry.get("science")
          if not isinstance(science, dict):
              raise SystemExit("STOP: target record has no science object")

          distance_mly = science.get("distanceMly")
          fov_x = entry.get("imageFovXArcmin")
          fov_y = entry.get("imageFovYArcmin")
          if not all(isinstance(v, (int, float)) and math.isfinite(v) and v > 0
                     for v in (distance_mly, fov_x, fov_y)):
              raise SystemExit(f"STOP: invalid distance/FOV: distanceMly={distance_mly}, FOV={fov_x} x {fov_y} arcmin")

          old = science.get("sizeKly")
          if old != [750.492, 573.05]:
              raise SystemExit(f"STOP: sizeKly differs from the reviewed bad value; refusing to overwrite: {old!r}")

          # Full angular footprint: 2 D tan(theta/2); distance in Mly, output in Kly.
          x_kly = distance_mly * 1000 * 2 * math.tan(math.radians(fov_x / 60) / 2)
          y_kly = distance_mly * 1000 * 2 * math.tan(math.radians(fov_y / 60) / 2)
          science["sizeKly"] = [round(x_kly, 3), round(y_kly, 3)]
          science["sizeMethod"] = "estimated_from_catalog_distance_and_image_fov_full_angular_footprint"
          science["sizeEstimated"] = True
          science["sizeDisplay"] = f"EST. {x_kly:.2f} × {y_kly:.2f} KLY"

          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          checked = json.loads(path.read_text(encoding="utf-8"))
          target = [e for e in checked["entries"] if e.get("archiveId") == "potw1817a" and e.get("designation") == "NGC 2655"]
          assert len(target) == 1
          s = target[0]["science"]
          assert abs(s["sizeKly"][0] - x_kly) < 0.001
          assert abs(s["sizeKly"][1] - y_kly) < 0.001
          print(json.dumps({
              "archiveId": target[0]["archiveId"],
              "designation": target[0]["designation"],
              "distanceMly": distance_mly,
              "imageFovArcmin": [fov_x, fov_y],
              "oldSizeKly": old,
              "newSizeKly": s["sizeKly"],
              "sizeMethod": s["sizeMethod"],
          }, indent=2))
          PY

      - name: Validate and commit only the Hubble catalog
        id: commit
        shell: bash
        env:
          CATALOG: viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json
        run: |
          set -euo pipefail
          python3 -m json.tool "$CATALOG" >/dev/null
          git diff --check
          changed="$(git diff --name-only)"
          if [[ -n "$changed" && "$changed" != "$CATALOG" ]]; then
            echo "STOP: unexpected changed paths:"
            printf '%s\n' "$changed"
            exit 1
          fi
          if git diff --quiet -- "$CATALOG"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No catalog change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$CATALOG"
          git diff --cached --check
          [[ "$(git diff --cached --name-only)" == "$CATALOG" ]]
          git commit -m "Correct NGC 2655 Hubble image span"
          git push origin HEAD:release
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages validation and deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref release
