name: Repair runtime catalog surgical diff
on:
  push:
    branches:
      - release
    paths:
      - ".github/workflows/gv-runtime-format-repair-20261011.yml"
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0
      - name: Restore original runtime JSON formatting and patch only UGC 2890
        shell: bash
        run: |
          set -euo pipefail
          runtime="viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0003.json"
          git show 20d838c9f9a93b63f081e4efd8aee139f68eff4e:"$runtime" > "$runtime"
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          p = Path("viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0003.json")
          text = p.read_text(encoding="utf-8")
          marker = '"archiveId": "potw2314a"'
          i = text.find(marker)
          if i < 0 or text.find(marker, i + len(marker)) >= 0:
              raise SystemExit("Safety stop: expected exactly one UGC 2890 runtime record")
          start = text.rfind("    {", 0, i)
          end = text.find("\n    },", i)
          if start < 0 or end < 0:
              raise SystemExit("Safety stop: could not isolate the target record")
          end += len("\n    }")
          block = text[start:end]
          for key, expected in [
              ('"distanceMly": 30,', '"distanceMly": 30,'),
              ('"ageYears": 13770000000,', '"ageYears": 13770000000,')
          ]:
              if expected not in block:
                  raise SystemExit("Safety stop: expected scientific values not found: " + key)
          if '"sizeKly": [' not in block or '"physicalSizeLy": [' not in block:
              raise SystemExit("Safety stop: expected physical-size fields not found")

          additions = [
              '      "distanceDisplay": "30 million light-years",',
              '      "distanceEstimated": false,',
              '      "ageGyr": 13.77,',
              '      "ageDisplay": "13.77 GYR",',
              '      "ageEstimated": false,',
              '      "sizeDisplay": "EST. 28.9 × 24.9 KLY",',
              '      "sizeEstimated": true,'
          ]
          # Add explicit display/estimate fields after the physical-size array.
          anchor = '      "physicalSizeLy": [\n        28900,\n        24900\n      ],'
          if anchor not in block:
              raise SystemExit("Safety stop: physicalSizeLy anchor did not match")
          block = block.replace(anchor, anchor + "\n" + "\n".join(additions), 1)
          block = re.sub(
              r'"scienceSource": "[^"]*"',
              '"scienceSource": "ESA/Hubble potw2314a: distance around 30 million light-years; age 13.77 Gyr; physical span estimated from published 3.31 × 2.86 arcmin field"',
              block,
              count=1
          )
          if '"scienceSource": "ESA/Hubble potw2314a: distance around 30 million light-years; age 13.77 Gyr;' not in block:
              raise SystemExit("Safety stop: science source update failed")
          text = text[:start] + block + text[end:]
          # Parse the full file and validate the edited record before committing.
          data = json.loads(text)
          matches = [r for r in data["records"] if r.get("archiveId") == "potw2314a"]
          if len(matches) != 1:
              raise SystemExit("Safety stop: post-edit record count invalid")
          r = matches[0]
          assert r["distanceMly"] == 30 and r["distanceDisplay"] == "30 million light-years"
          assert r["ageYears"] == 13770000000 and r["ageGyr"] == 13.77
          assert r["sizeKly"] == [28.9, 24.9] and r["physicalSizeLy"] == [28900, 24900]
          p.write_text(text, encoding="utf-8")
          print("Validated JSON; only the UGC 2890 record was patched in the runtime catalog.")
          PY
      - name: Commit runtime repair and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/gv-runtime-format-repair-20261011.yml
          git add viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0003.json .github/workflows/gv-runtime-format-repair-20261011.yml
          git diff --cached --check
          git commit -m "Keep UGC 2890 runtime catalog edit surgical"
          git push origin HEAD:release
