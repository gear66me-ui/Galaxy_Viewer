name: Hubble Nebulae Staging Ingest

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: hubble-nebulae-staging-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Install astronomy verification dependencies
        run: |
          python -m pip install --quiet --disable-pip-version-check requests beautifulsoup4 astroquery astropy

      - name: Ingest ESA/Hubble nebulae to completion in 50-record checkpoints
        env:
          STAGING_PATH: viewer/image-databases/Hubble/databases/gv-hubble-nebulae-ingest.json
          PRODUCTION_PATH: viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0018.json
          SOURCE_BASE: https://esahubble.org
          SOURCE_CATEGORY: https://esahubble.org/images/archive/category/nebulae/
          BATCH_SIZE: '50'
        run: |
          python3 <<'PY'
          import datetime as dt
          import json
          import math
          import os
          import re
          import subprocess
          import time
          import unicodedata
          from pathlib import Path
          from urllib.parse import quote

          import requests

          STAGING = Path(os.environ['STAGING_PATH'])
          PRODUCTION = Path(os.environ['PRODUCTION_PATH'])
          SOURCE_BASE = os.environ['SOURCE_BASE'].rstrip('/')
          CATEGORY = os.environ['SOURCE_CATEGORY']
          BATCH = int(os.environ.get('BATCH_SIZE', '50'))

          UA = 'GalaxyViewer-HubbleNebulaIngest/1.0 (+https://github.com/gear66me-ui/Galaxy_Viewer)'
          session = requests.Session()
          session.headers.update({'User-Agent': UA, 'Accept': '*/*'})

          def utcnow():
              return dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00', 'Z')

          def get(url, timeout=30, retries=3):
              last = None
              for attempt in range(retries):
                  try:
                      r = session.get(url, timeout=timeout)
                      if r.status_code == 200:
                          return r
                      last = RuntimeError(f'HTTP {r.status_code} for {url}')
                  except Exception as e:
                      last = e
                  time.sleep(1.2 * (attempt + 1))
              raise last

          def norm(s):
              if s is None:
                  return ''
              s = unicodedata.normalize('NFKD', str(s)).encode('ascii', 'ignore').decode('ascii')
              return re.sub(r'[^a-z0-9]+', '', s.lower())

          def parse_float(x):
              try:
                  return float(x)
              except Exception:
                  return None

          def sexa_ra_to_deg(text):
              if not text:
                  return None
              nums = re.findall(r'[-+]?\d+(?:\.\d+)?', str(text))
              if len(nums) < 3:
                  return None
              h, m, s = map(float, nums[:3])
              return 15.0 * (h + m/60.0 + s/3600.0)

          def sexa_dec_to_deg(text):
              if not text:
                  return None
              sign = -1 if str(text).strip().startswith('-') else 1
              nums = re.findall(r'\d+(?:\.\d+)?', str(text))
              if len(nums) < 3:
                  return None
              d, m, s = map(float, nums[:3])
              return sign * (d + m/60.0 + s/3600.0)

          def angular_sep_arcsec(ra1, dec1, ra2, dec2):
              if None in (ra1, dec1, ra2, dec2):
                  return None
              r1, d1, r2, d2 = map(math.radians, (ra1, dec1, ra2, dec2))
              c = math.sin(d1)*math.sin(d2) + math.cos(d1)*math.cos(d2)*math.cos(r1-r2)
              c = max(-1.0, min(1.0, c))
              return math.degrees(math.acos(c)) * 3600.0

          def parse_distance_mly(value):
              if value is None:
                  return None
              s = str(value).replace(',', '').lower()
              m = re.search(r'([0-9]+(?:\.[0-9]+)?)\s*(billion|million|thousand)?\s*light[- ]?years?', s)
              if not m:
                  return None
              v = float(m.group(1))
              unit = m.group(2)
              if unit == 'billion': return v * 1000.0
              if unit == 'million': return v
              if unit == 'thousand': return v / 1000.0
              return v / 1_000_000.0

          H0 = 70.0
          OM = 0.3
          OL = 0.7
          HUBBLE_TIME_GYR = 9.778 / (H0 / 100.0)

          def E(z):
              return math.sqrt(OM * (1.0 + z)**3 + OL)

          def simpson(f, a, b, n=1200):
              if n % 2: n += 1
              h = (b-a)/n
              s = f(a) + f(b)
              for i in range(1, n):
                  s += (4 if i % 2 else 2) * f(a + i*h)
              return s*h/3.0

          def lookback_gyr_from_z(z):
              if z is None or z < 0: return None
              return HUBBLE_TIME_GYR * simpson(lambda x: 1.0/((1.0+x)*E(x)), 0.0, z, n=600)

          def universe_age_now_gyr():
              return HUBBLE_TIME_GYR * simpson(lambda x: 1.0/((1.0+x)*E(x)), 0.0, 1000.0, n=4000)

          AGE_NOW = universe_age_now_gyr()

          def cosmic_age_from_z(z):
              lb = lookback_gyr_from_z(z)
              return None if lb is None else max(0.0, AGE_NOW - lb)

          def cosmic_age_from_light_travel_mly(distance_mly):
              if distance_mly is None: return None
              return max(0.0, AGE_NOW - distance_mly/1000.0)

          def select_image(resources):
              if not isinstance(resources, list): return (None, [])
              urls, ranked = [], []
              rank = {'Original': 0, 'Publication': 1, 'Large': 2, 'Screen': 3}
              for res in resources:
                  if not isinstance(res, dict): continue
                  u = res.get('URL') or res.get('Url') or res.get('url')
                  if not u: continue
                  urls.append(u)
                  typ = str(res.get('ResourceType') or res.get('Type') or '')
                  ranked.append((rank.get(typ, 9), u))
              ranked.sort()
              return (ranked[0][1] if ranked else None, list(dict.fromkeys(urls)))

          def extract_ids_from_archive():
              found, seen, total = [], set(), None
              for page in range(1, 100):
                  url = CATEGORY if page == 1 else f'{CATEGORY}page/{page}/'
                  text = get(url).text
                  mt = re.search(r'Showing\s+\d+\s+to\s+\d+\s+of\s+([\d,]+)', text, re.I)
                  if mt: total = int(mt.group(1).replace(',', ''))
                  ids = re.findall(r'(?:href=["\']?/images/|["\']url["\']\s*:\s*["\']/images/)([A-Za-z0-9_-]+)', text)
                  if not ids:
                      ids = re.findall(r'/images/([A-Za-z0-9_-]+)/', text)
                  for iid in ids:
                      if iid in {'archive', 'category', 'search'}: continue
                      if iid not in seen:
                          seen.add(iid); found.append(iid)
                  if total is not None and len(found) >= total: break
                  if page > 1 and not ids: break
              return found, total

          def esa_metadata(image_id):
              url = f'{SOURCE_BASE}/images/{quote(image_id)}/api/json/'
              info = get(url).json()
              if not isinstance(info, dict):
                  raise RuntimeError('ESA API did not return an object')
              return info, url

          def value(info, *keys):
              for k in keys:
                  if k in info and info[k] not in (None, '', []): return info[k]
              return None

          def coords_from_info(info):
              ref = value(info, 'Spatial.ReferenceValue')
              if isinstance(ref, (list, tuple)) and len(ref) >= 2:
                  ra, dec = parse_float(ref[0]), parse_float(ref[1])
                  if ra is not None and dec is not None: return ra, dec
              ra, dec = parse_float(value(info, 'RA', 'ra')), parse_float(value(info, 'Dec', 'DEC', 'dec'))
              if ra is not None and dec is not None: return ra, dec
              return sexa_ra_to_deg(value(info, 'RAString', 'raText')), sexa_dec_to_deg(value(info, 'DecString', 'decText'))

          def try_simbad(name):
              if not name: return {'status':'SKIP','reason':'no query name'}
              try:
                  from astroquery.simbad import Simbad
                  tbl = Simbad().query_object(name)
                  if tbl is None or len(tbl) == 0: return {'status':'NOT_FOUND','query':name}
                  row, cols = tbl[0], set(tbl.colnames)
                  ra = parse_float(row['ra']) if 'ra' in cols else None
                  dec = parse_float(row['dec']) if 'dec' in cols else None
                  if ra is None and 'RA' in cols: ra = sexa_ra_to_deg(row['RA'])
                  if dec is None and 'DEC' in cols: dec = sexa_dec_to_deg(row['DEC'])
                  main_id = str(row['main_id']) if 'main_id' in cols else (str(row['MAIN_ID']) if 'MAIN_ID' in cols else None)
                  return {'status':'PASS','query':name,'mainId':main_id,'ra':ra,'dec':dec}
              except Exception as e:
                  return {'status':'ERROR','query':name,'error':str(e)[:500]}

          def try_ned(name):
              if not name: return {'status':'SKIP','reason':'no query name'}
              try:
                  from astroquery.ipac.ned import Ned
                  tbl = Ned.query_object(name)
                  if tbl is None or len(tbl) == 0: return {'status':'NOT_FOUND','query':name}
                  row, cols = tbl[0], set(tbl.colnames)
                  return {'status':'PASS','query':name,
                          'ra':parse_float(row['RA']) if 'RA' in cols else None,
                          'dec':parse_float(row['DEC']) if 'DEC' in cols else None,
                          'redshift':parse_float(row['Redshift']) if 'Redshift' in cols else None}
              except Exception as e:
                  msg = str(e)
                  status = 'NOT_APPLICABLE' if any(x in msg.lower() for x in ['no object','not found','failed to resolve']) else 'ERROR'
                  return {'status':status,'query':name,'error':msg[:500]}

          def run(*args, check=True):
              return subprocess.run(args, check=check, text=True, capture_output=True)

          def checkpoint(staging, batch_number):
              STAGING.write_text(json.dumps(staging, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              run('git','config','user.name','github-actions[bot]')
              run('git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
              run('git','add',str(STAGING))
              diff = run('git','diff','--cached','--quiet', check=False)
              if diff.returncode == 0:
                  print(f'Checkpoint {batch_number}: no staging change')
                  return
              message = (
                  'ECO-ID: GV-20260819-HUBBLE-NEBULA-INGEST-002\n'
                  'AUTHORIZED-PATHS: viewer/image-databases/Hubble/databases/gv-hubble-nebulae-ingest.json\n'
                  'REQUIREMENTS: REQ-002-REQ-008\n'
                  'ARCHIVE-AUTHORIZED: false\n'
                  'USER-GO: true'
              )
              run('git','commit','-m',message)
              for attempt in range(1, 7):
                  pull = run('git','pull','--rebase','origin','beta', check=False)
                  if pull.returncode != 0:
                      run('git','rebase','--abort', check=False)
                      time.sleep(4 * attempt)
                      continue
                  push = run('git','push','origin','HEAD:beta', check=False)
                  if push.returncode == 0:
                      print(f'Checkpoint {batch_number}: committed and pushed')
                      return
                  time.sleep(4 * attempt)
              raise SystemExit(f'FAIL: unable to push checkpoint {batch_number}')

          staging = json.loads(STAGING.read_text(encoding='utf-8'))
          if staging.get('complete') is True:
              print('Staging database already complete; nothing to do.')
              raise SystemExit(0)

          prod = json.loads(PRODUCTION.read_text(encoding='utf-8'))
          prod_entries = prod.get('entries', [])
          prod_ids = {str(e.get('archiveId')) for e in prod_entries if e.get('archiveId')}
          prod_names, prod_coords = set(), []
          for e in prod_entries:
              for k in ('designation','displayName','name','title'):
                  n = norm(e.get(k))
                  if n: prod_names.add(n)
              ra, dec = parse_float(e.get('ra')), parse_float(e.get('dec'))
              if ra is not None and dec is not None: prod_coords.append((ra, dec, e.get('archiveId')))

          ids, source_total = extract_ids_from_archive()
          if source_total is not None: staging['sourceCount'] = source_total
          if not ids: raise SystemExit('FAIL: no ESA/Hubble nebula archive IDs were discovered')
          if source_total is not None and len(ids) < source_total:
              raise SystemExit(f'FAIL: archive announces {source_total} records but scraper discovered only {len(ids)} IDs')

          existing_stage_ids = {str(e.get('archiveId')) for e in staging.get('entries', []) if e.get('archiveId')}
          offset = int(staging.get('nextOffset') or 0)
          if offset > len(ids): raise SystemExit(f'FAIL: nextOffset {offset} exceeds discovered source list {len(ids)}')

          batch_number = 0
          while offset < len(ids):
              batch_number += 1
              batch_ids = ids[offset:min(offset+BATCH, len(ids))]
              processed_new = 0
              print(f'Batch {batch_number}: source offset {offset} -> {offset + len(batch_ids)} of {len(ids)}')

              for image_id in batch_ids:
                  if image_id in existing_stage_ids: continue
                  record = {'archiveId':image_id,'ingestedAt':utcnow(),'disposition':'REVIEW','candidateScore':0,'verificationStatus':'REVIEW','verification':{}}
                  try:
                      info, api_url = esa_metadata(image_id)
                      record['verification']['pass1ESA'] = {'status':'PASS','apiUrl':api_url}
                      title = value(info,'Title','title')
                      name = value(info,'Name','Object','ObjectName','name')
                      designation = value(info,'ObjectName','Name','Title')
                      ra, dec = coords_from_info(info)
                      selected, candidates = select_image(value(info,'Resources') or [])
                      image_type = value(info,'Type','ImageType','imageType') or 'Observation'
                      record.update({
                          'name':name,'title':title,'designation':designation,'displayName':title or name or designation or image_id,
                          'ra':ra,'dec':dec,'raText':value(info,'RAString','raText'),'decText':value(info,'DecString','decText'),
                          'constellation':value(info,'Constellation','constellation'),'fieldOfView':value(info,'Spatial.FOV','FieldOfView','fieldOfView'),
                          'orientation':value(info,'Spatial.Rotation','Orientation','orientation'),'imageType':image_type,
                          'releaseDate':value(info,'Date','ReleaseDate','releaseDate'),'pixelSize':value(info,'Size','PixelSize','pixelSize'),
                          'credit':value(info,'Credit','credit'),'sourceUrl':value(info,'ReferenceURL','URL') or f'{SOURCE_BASE}/images/{image_id}/',
                          'selectedImageUrl':selected,'jpegCandidates':candidates,
                      })
                      distance_mly = parse_distance_mly(value(info,'Distance','distance'))
                      query_name = designation or name or title
                      simbad = try_simbad(query_name); record['verification']['pass2SIMBAD'] = simbad
                      ned = try_ned(query_name); record['verification']['pass3NED'] = ned
                      sep_simbad = angular_sep_arcsec(ra,dec,simbad.get('ra'),simbad.get('dec')) if simbad.get('status') == 'PASS' else None
                      sep_ned = angular_sep_arcsec(ra,dec,ned.get('ra'),ned.get('dec')) if ned.get('status') == 'PASS' else None
                      if sep_simbad is not None: record['verification']['pass2SIMBAD']['separationArcsec'] = round(sep_simbad,3)
                      if sep_ned is not None: record['verification']['pass3NED']['separationArcsec'] = round(sep_ned,3)
                      redshift = ned.get('redshift') if ned.get('status') == 'PASS' else None
                      science = {'distanceMly':distance_mly,'distanceMethod':'esa' if distance_mly is not None else None,
                                 'sizeKly':None,'sizeMethod':None,'ageGyr':None,'ageMethod':None,'ageDisplay':None,'redshift':redshift}
                      if redshift is not None and redshift >= 0:
                          age = cosmic_age_from_z(redshift); science['ageGyr'] = round(age,6) if age is not None else None
                          science['ageMethod'] = 'cosmic_age_at_emission_from_ned_redshift_flat_lcdm_H0_70_Om_0.3_staging'
                      elif distance_mly is not None:
                          age = cosmic_age_from_light_travel_mly(distance_mly); science['ageGyr'] = round(age,6) if age is not None else None
                          science['ageMethod'] = 'cosmic_age_at_emission_from_esa_light_travel_distance_flat_lcdm_H0_70_Om_0.3_staging'
                      if science['ageGyr'] is not None: science['ageDisplay'] = f"EST. {science['ageGyr']:.2f} GYR"
                      record['science'] = science

                      dup_reasons = []
                      if image_id in prod_ids: dup_reasons.append('archiveId')
                      for candidate in (designation,name,title):
                          nn = norm(candidate)
                          if nn and nn in prod_names: dup_reasons.append('normalizedName'); break
                      if ra is not None and dec is not None:
                          for pra,pdec,pid in prod_coords:
                              sep = angular_sep_arcsec(ra,dec,pra,pdec)
                              if sep is not None and sep <= 3.0: dup_reasons.append(f'skyPosition:{pid}'); break
                      if dup_reasons:
                          record['duplicateIn0018'] = True; record['duplicateReasons'] = dup_reasons; record['disposition'] = 'DUPLICATE_0018'
                      else: record['duplicateIn0018'] = False

                      score = 0
                      if str(image_type).lower() == 'observation': score += 25
                      if selected: score += 20
                      if ra is not None and dec is not None: score += 20
                      if record.get('fieldOfView'): score += 10
                      if query_name: score += 10
                      if record.get('credit'): score += 5
                      if simbad.get('status') == 'PASS': score += 5
                      if ned.get('status') == 'PASS': score += 5
                      if record.get('duplicateIn0018'): score = max(0,score-25)
                      record['candidateScore'] = score

                      disagreements = []
                      if sep_simbad is not None and sep_simbad > 60.0: disagreements.append(f'ESA/SIMBAD position differs by {sep_simbad:.1f} arcsec')
                      if sep_ned is not None and sep_ned > 60.0: disagreements.append(f'ESA/NED position differs by {sep_ned:.1f} arcsec')
                      if disagreements:
                          record['verificationStatus'] = 'REVIEW'; record['verificationDisagreements'] = disagreements
                      elif simbad.get('status') == 'PASS' and ned.get('status') in {'PASS','NOT_APPLICABLE','NOT_FOUND'}:
                          record['verificationStatus'] = 'PASS'
                      else: record['verificationStatus'] = 'REVIEW'

                      if record['disposition'] != 'DUPLICATE_0018':
                          if str(image_type).lower() != 'observation': record['disposition'] = 'REJECT_NON_OBSERVATION'
                          elif record['verificationStatus'] == 'PASS' and score >= 60: record['disposition'] = 'ACCEPT'
                          elif simbad.get('status') == 'ERROR' and ned.get('status') == 'ERROR': record['disposition'] = 'VERIFICATION_FAILED'
                          else: record['disposition'] = 'REVIEW'
                  except Exception as e:
                      record['disposition'] = 'VERIFICATION_FAILED'; record['verificationStatus'] = 'REVIEW'; record['error'] = str(e)[:1000]
                      record['verification'].setdefault('pass1ESA', {'status':'ERROR','error':str(e)[:500]})

                  staging.setdefault('entries',[]).append(record)
                  existing_stage_ids.add(image_id)
                  processed_new += 1

              offset = min(offset + len(batch_ids), len(ids))
              staging['nextOffset'] = offset
              staging['processedCount'] = len(staging.get('entries',[]))
              staging['acceptedCount'] = sum(1 for e in staging['entries'] if e.get('disposition') == 'ACCEPT')
              staging['rejectedCount'] = sum(1 for e in staging['entries'] if str(e.get('disposition','')).startswith('REJECT'))
              staging['duplicateIn0018Count'] = sum(1 for e in staging['entries'] if e.get('disposition') == 'DUPLICATE_0018')
              staging['reviewCount'] = sum(1 for e in staging['entries'] if e.get('disposition') in {'REVIEW','VERIFICATION_FAILED'})
              staging['discoveredSourceIdCount'] = len(ids)
              staging['sourceCount'] = source_total if source_total is not None else staging.get('sourceCount')
              staging['complete'] = offset >= len(ids) and (source_total is None or len(ids) >= source_total)
              staging['lastRun'] = utcnow()
              staging['lastBatch'] = {'offsetStart':offset-len(batch_ids),'sourceIdsConsidered':len(batch_ids),'newRecordsWritten':processed_new,'offsetEnd':offset}

              ids_now = [e.get('archiveId') for e in staging.get('entries',[])]
              if any(not x for x in ids_now): raise SystemExit('FAIL: staging record without archiveId')
              if len(ids_now) != len(set(ids_now)): raise SystemExit('FAIL: duplicate archiveId inside staging database')
              if staging['processedCount'] != len(staging['entries']): raise SystemExit('FAIL: processedCount mismatch')
              checkpoint(staging, batch_number)
              time.sleep(1.0)

          if not staging.get('complete'):
              raise SystemExit('FAIL: source loop ended without complete=true')
          print(json.dumps({k:staging.get(k) for k in ['sourceCount','discoveredSourceIdCount','processedCount','acceptedCount','rejectedCount','duplicateIn0018Count','reviewCount','nextOffset','complete']}, indent=2))
          PY

      - name: Final validation
        env:
          STAGING_PATH: viewer/image-databases/Hubble/databases/gv-hubble-nebulae-ingest.json
        run: |
          python3 <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path(os.environ['STAGING_PATH']).read_text(encoding='utf-8'))
          entries = data.get('entries', [])
          ids = [e.get('archiveId') for e in entries]
          if len(ids) != len(set(ids)):
              raise SystemExit('FAIL: duplicate archiveId inside staging database')
          if data.get('processedCount') != len(entries):
              raise SystemExit('FAIL: processedCount does not equal entries length')
          if data.get('complete') is not True:
              raise SystemExit('FAIL: ingestion did not reach complete=true')
          if int(data.get('nextOffset',0)) < int(data.get('discoveredSourceIdCount',0)):
              raise SystemExit('FAIL: nextOffset does not cover discovered source list')
          print(f'PASS: complete staging catalog with {len(entries)} unique source records')
          PY
