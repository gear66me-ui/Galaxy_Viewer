name: Validate Destination Span Units (Build 0057)

on:
  workflow_dispatch:
  push:
    branches:
      - release
    paths:
      - ".github/workflows/validate-destination-span-units-0057.yml"
      - "viewer/modules/destination-presentation/gv-destination-presentation-0057.js"

permissions:
  contents: read

concurrency:
  group: gv-destination-span-0057
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
      - name: Validate JavaScript syntax
        run: node --check viewer/modules/destination-presentation/gv-destination-presentation-0057.js
      - name: Validate span-unit formatter
        shell: bash
        run: |
          set -euo pipefail
          FILE=viewer/modules/destination-presentation/gv-destination-presentation-0057.js
          grep -F "function size(d)" "$FILE" >/dev/null
          grep -F "return['IMG SPAN (LY)'" "$FILE" >/dev/null
          grep -F "return['IMG SPAN (KLY)'" "$FILE" >/dev/null
          grep -F "return['IMG SPAN (MLY)'" "$FILE" >/dev/null
          grep -F "(x*1000).toFixed(2)" "$FILE" >/dev/null
          grep -F "(x/1000).toFixed(2)" "$FILE" >/dev/null
          echo "PASS: destination span formatter supports LY, kly, and Mly with two decimal places."
