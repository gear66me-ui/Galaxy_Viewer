name: GV Nanoscopic Audit
on:
  push:
    branches: [beta]
  pull_request:
    branches: [beta]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nanoscopic-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit every touched file
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections, hashlib, json, pathlib, re, subprocess, sys
          def git(*a): return subprocess.check_output(["git",*a],text=True)
          head=git("rev-parse","HEAD").strip()
          try: base=git("rev-parse",head+"^").strip()
          except: base=head
          def blob(ref,p):
              try:return subprocess.check_output(["git","show",ref+":"+p])
              except:return b""
          punct=list("{}[](),;:'\".+-*/%=<>!?&#@_$\\|")
          multi=["==","!=","=>","::","&&","||","//","/*","*/","33"]
          def m(data):
              s=data.decode("utf-8","replace"); cf=collections.Counter(s); dg=collections.Counter(c for c in s if c.isdigit())
              funcs=re.findall(r"\\bfunction\\s+([A-Za-z_$][\\w$]*)\\s*\\(",s)
              arrows=re.findall(r"\\b([A-Za-z_$][\\w$]*)\\s*=\\s*(?:async\\s*)?(?:\\([^)]*\\)|[A-Za-z_$][\\w$]*)\\s*=>",s)
              decs=re.findall(r"\\b(?:const|let|var)\\s+([A-Za-z_$][\\w$]*)",s)
              return {"sha256":hashlib.sha256(data).hexdigest(),"bytes":len(data),"lines":len(s.splitlines()),"characters":len(s),"letters":sum(c.isalpha() for c in s),"uppercase":sum(c.isupper() for c in s),"lowercase":sum(c.islower() for c in s),"digits":sum(c.isdigit() for c in s),"digit_frequency":dict(sorted(dg.items())),"words":len(re.findall(r"[A-Za-z_$][A-Za-z0-9_$-]*",s)),"numeric_tokens":len(re.findall(r"[-+]?(?:\\d+(?:\\.\\d*)?|\\.\\d+)",s)),"spaces":s.count(" "),"tabs":s.count("\\t"),"newlines":s.count("\\n"),"whitespace":sum(c.isspace() for c in s),"punctuation":{p:s.count(p) for p in punct},"multi_tokens":{p:s.count(p) for p in multi},"functions":{"count":len(funcs)+len(arrows),"named":funcs,"arrow":arrows},"declarations":{"count":len(decs),"names":decs},"balanced":{"braces":s.count("{")==s.count("}"),"brackets":s.count("[")==s.count("]"),"parentheses":s.count("(")==s.count(")")},"character_frequency":dict(sorted(cf.items()))}
          rows=[]
          for line in git("diff","--name-status","-M",base,head).splitlines():
              p=line.split("\\t"); st=p[0]; old=p[1]; new=p[2] if st.startswith("R") else p[1]
              a=m(b"" if st.startswith("A") else blob(base,old)); b=m(b"" if st.startswith("D") else blob(head,new))
              scalar=["bytes","lines","characters","letters","uppercase","lowercase","digits","words","numeric_tokens","spaces","tabs","newlines","whitespace"]
              chars=set(a["character_frequency"])|set(b["character_frequency"])
              rows.append({"status":st,"old_path":old,"new_path":new,"before":a,"after":b,"delta":{k:b[k]-a[k] for k in scalar},"punctuation_delta":{k:b["punctuation"][k]-a["punctuation"][k] for k in punct},"digit_delta":{str(k):b["digit_frequency"].get(str(k),0)-a["digit_frequency"].get(str(k),0) for k in range(10)},"multi_token_delta":{k:b["multi_tokens"][k]-a["multi_tokens"][k] for k in multi},"changed_character_frequency":{c:b["character_frequency"].get(c,0)-a["character_frequency"].get(c,0) for c in sorted(chars) if b["character_frequency"].get(c,0)!=a["character_frequency"].get(c,0)}})
          report={"base":base,"head":head,"touched_files":len(rows),"files":rows}
          pathlib.Path("artifacts").mkdir(exist_ok=True)
          pathlib.Path("artifacts/gv-nanoscopic-audit.json").write_text(json.dumps(report,indent=2,ensure_ascii=False)+"\\n")
          out=["# GV Nanoscopic Audit","Base: "+base,"Head: "+head,"Touched files: "+str(len(rows)),""]
          for r in rows:
              out += ["## "+r["status"]+" "+r["new_path"],"Delta: "+json.dumps(r["delta"],sort_keys=True),"Punctuation delta: "+json.dumps(r["punctuation_delta"],sort_keys=True),"Digit delta: "+json.dumps(r["digit_delta"],sort_keys=True),"Token delta: "+json.dumps(r["multi_token_delta"],sort_keys=True),"Functions: "+str(r["before"]["functions"]["count"])+" -> "+str(r["after"]["functions"]["count"]),"Declarations: "+str(r["before"]["declarations"]["count"])+" -> "+str(r["after"]["declarations"]["count"]),"Balanced after: "+json.dumps(r["after"]["balanced"],sort_keys=True),""]
          pathlib.Path("artifacts/gv-nanoscopic-audit.md").write_text("\\n".join(out)+"\\n")
          print("\\n".join(out))
          if any(not all(r["after"]["balanced"].values()) for r in rows if r["after"]["bytes"]): sys.exit("FAIL: delimiter balance")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gv-nanoscopic-audit-${{ github.sha }}
          path: artifacts/
