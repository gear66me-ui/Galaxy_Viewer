name: Galaxy Viewer Nanoscopic Audit
on:
  push:
    branches: [beta]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nanoscopic-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Generate nanoscopic instruction report
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"; fi
          export BEFORE AFTER
          python3 - <<'PY'
          import collections,hashlib,json,os,pathlib,re,subprocess
          before=os.environ['BEFORE']; after=os.environ['AFTER']
          def git(*a): return subprocess.check_output(['git',*a],text=True,errors='replace')
          changed=[p for p in git('diff','--name-only',before,after).splitlines() if p]
          r=['GALAXY VIEWER NANOSCOPIC AUDIT','='*80,f'BEFORE_COMMIT={before}',f'AFTER_COMMIT={after}',f'CHANGED_FILES={len(changed)}','']
          def m(t):
            b=t.encode(); nums=re.findall(r'(?<![A-Za-z_])[-+]?\d+(?:\.\d+)?',t)
            return {'bytes':len(b),'lines':len(t.splitlines()),'characters':len(t),'words':len(re.findall(r'\S+',t)),'spaces':t.count(' '),'tabs':t.count('\t'),'newlines':t.count('\n'),'non_whitespace':len(re.sub(r'\s','',t)),'numeric_tokens':len(nums),'digits':sum(c.isdigit() for c in t),'occurrences_33':t.count('33'),'sha256':hashlib.sha256(b).hexdigest(),'digit_frequency':dict(sorted(collections.Counter(c for c in t if c.isdigit()).items()))}
          for p in changed:
            try: old=git('show',f'{before}:{p}')
            except subprocess.CalledProcessError: old=''
            try: new=git('show',f'{after}:{p}')
            except subprocess.CalledProcessError: new=''
            a,b=m(old),m(new); r += [f'FILE={p}','-'*80]
            for k in ['bytes','lines','characters','words','spaces','tabs','newlines','non_whitespace','numeric_tokens','digits','occurrences_33']: r.append(f'{k}: BEFORE={a[k]} AFTER={b[k]} DELTA={b[k]-a[k]:+d}')
            r += ['digit_frequency BEFORE='+json.dumps(a['digit_frequency'],sort_keys=True),'digit_frequency AFTER ='+json.dumps(b['digit_frequency'],sort_keys=True),'sha256 BEFORE='+a['sha256'],'sha256 AFTER ='+b['sha256'],'DIFF:',git('diff','--unified=3',before,after,'--',p).rstrip(),'']
          viewer=pathlib.Path('viewer/GV-beta-200-009.py').read_text(); pointer=json.loads(pathlib.Path('viewer/gv-current-viewer.json').read_text()); build=re.search(r"const GV200001_BUILD='(\d{4})';",viewer)
          r += ['CONTROLLED INVARIANTS','-'*80,'viewer_build='+(build.group(1) if build else '<missing>'),'pointer_build='+str(pointer.get('build')),'camera_30hz_owner_count='+str(viewer.count('sample=Math.floor(elapsedMs*30/1000)')),'fov_report_400ms_owner_count='+str(viewer.count('GV_FOV_REPORT_MS=400')),'fov_hysteresis_owner_count='+str(viewer.count('GV_FOV_REPORT_HYSTERESIS=0.001'))]
          assert build and build.group(1)==str(pointer.get('build')),'viewer/pointer build mismatch'
          assert viewer.count('sample=Math.floor(elapsedMs*30/1000)')==1,'30 Hz Aladin navigation invariant changed'
          out='\n'.join(r)+'\n'; pathlib.Path('gv-nanoscopic-audit.txt').write_text(out); print(out)
          PY
      - name: Publish report to workflow summary
        run: |
          echo '## Galaxy Viewer Nanoscopic Audit' >> "$GITHUB_STEP_SUMMARY"
          echo '~~~text' >> "$GITHUB_STEP_SUMMARY"
          cat gv-nanoscopic-audit.txt >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload nanoscopic report
        uses: actions/upload-artifact@v4
        with:
          name: gv-nanoscopic-audit-${{ github.sha }}
          path: gv-nanoscopic-audit.txt
          if-no-files-found: error
