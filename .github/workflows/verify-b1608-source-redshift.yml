name: Verify B1608+656 Source Redshift and FLRW Distance

on:
  push:
    branches: [release]
    paths:
      - "viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-b1608-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: release
      - name: Validate published source redshift and FLRW distance
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          path = Path("viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json")
          doc = json.loads(path.read_text(encoding="utf-8"))
          assert doc.get("recordCount") == 1847, f"Unexpected recordCount: {doc.get('recordCount')}"
          matches = [r for r in doc["records"] if r.get("providerKey") == "hubble" and r.get("archiveId") == "heic1702c"]
          assert len(matches) == 1, f"Expected exactly one heic1702c record, got {len(matches)}"
          r = matches[0]
          z, c, H0, om, ol = 1.394, 299792.458, 67.6, 0.315, 0.685
          n = 20000
          h = z / n
          f = lambda zp: 1.0 / math.sqrt(om * (1.0 + zp)**3 + ol)
          total = f(0.0) + f(z)
          for i in range(1, n):
              total += (4 if i % 2 else 2) * f(i*h)
          expected_mly = round((c/H0) * (h/3) * total * 3.261563777, 3)
          assert r.get("redshift") == z, f"Wrong primary redshift: {r.get('redshift')}"
          assert r.get("distanceMly") == expected_mly, f"Wrong FLRW distance: {r.get('distanceMly')} != {expected_mly}"
          assert r.get("lensRedshift") == 0.6304, f"Missing/incorrect lens redshift: {r.get('lensRedshift')}"
          assert r.get("sourceRedshift") == z, f"Missing/incorrect source redshift: {r.get('sourceRedshift')}"
          assert r.get("redshiftDisplay") == "z = 1.394000"
          assert r.get("science", {}).get("redshift") == z
          assert r.get("science", {}).get("distanceMly") == expected_mly
          print(f"PASS: unique {r['name']} record; source z={z}; lens z=0.630400; Dc={expected_mly:.3f} Mly")
          print("Cosmology: flat Lambda-CDM, H0=67.6, Omega_m=0.315, Omega_Lambda=0.685")
          PY
