name: One-shot Hubble catalog correction

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]

permissions:
  contents: write

jobs:
  remove-deleted-hubble-record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 1

      - name: Remove heic0106j only
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json")
          data = json.loads(p.read_text())
          before = len(data["entries"])
          data["entries"] = [e for e in data["entries"] if e.get("archiveId") != "heic0106j"]
          after = len(data["entries"])

          if before == 1103 and after == 1103:
              print("heic0106j already removed; nothing to do.")
              raise SystemExit(0)

          if before != 1104 or after != 1103:
              raise SystemExit(f"Unexpected Hubble count: {before} -> {after}")

          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          print(f"Hubble entries: {before} -> {after}")
          print("Removed: heic0106j")
          PY

      - name: Commit correction if needed
        run: |
          if git diff --quiet -- viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json; then
            echo "No catalog change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json
          git commit -m "Remove deleted Hubble record heic0106j"
          git push origin HEAD:release
