name: Repair NGC 2525 AVM runtime distance and redshift
on:
  push:
    branches: [release]
    paths:
      - .github/workflows/repair-ngc2525-runtime-catalog-0004.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repair-ngc2525-runtime-catalog-0004
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0
      - name: Correct NGC 2525 and verify persisted values
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path

          runtime_path = Path("viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json")
          map_path = Path("viewer/image-databases/master-database/avm-metadata/avm-runtime-distance-map-0004.csv")
          review_path = Path("viewer/image-databases/master-database/avm-metadata/AVM-METADATA-GEMINI-NED-SIMBAD/Galaxy_Viewer_v0004a_Distance_Review_Workbook.csv")
          targets = [
              ("hubble", "heic2018a", "NGC 2525"),
              ("hubble", "heic2018b", "NGC 2525"),
          ]
          distance, redshift = 70.0, 0.004822
          distance_source = "ESA/Hubble NGC 2525 release heic2018a: nearly 70 million light-years; https://esahubble.org/images/heic2018a/ (NASA lists 71 million light-years: https://science.nasa.gov/asset/hubble/ngc-2525/)"
          redshift_source = "Cosmology-derived redshift corresponding approximately to 70 Mly luminosity distance using flat Lambda-CDM H0=67.6 km/s/Mpc and Omega_m=0.315; not a spectroscopic measurement."

          for p in (runtime_path, map_path, review_path):
              if not p.is_file():
                  raise SystemExit("STOP: required file missing: " + str(p))

          runtime = json.loads(runtime_path.read_text(encoding="utf-8"))
          records = runtime.get("records", [])
          runtime_matches = []
          for provider, archive_id, name in targets:
              hits = [r for r in records if str(r.get("providerKey","")).strip().lower()==provider and str(r.get("archiveId","")).strip().lower()==archive_id]
              if len(hits) != 1:
                  raise SystemExit(f"STOP: expected exactly one runtime match {provider}/{archive_id}; got {len(hits)}")
              hits[0].update({
                  "distanceMly": distance,
                  "redshift": redshift,
                  "distanceMethod": "adopted_distance_70_Mly_cosmology_consistent_redshift",
                  "distanceSource": distance_source,
                  "redshiftMethod": "flat_LCDM_redshift_derived_from_70_Mly_luminosity_distance",
                  "redshiftSource": redshift_source,
                  "redshiftFrame": "cosmological_model_derived"
              })
              runtime_matches.append((provider, archive_id, name, hits[0]))

          with map_path.open(encoding="utf-8", newline="") as f:
              map_rows = list(csv.reader(f))
          for provider, archive_id, name, record in runtime_matches:
              mr = [r for r in map_rows if len(r)>=4 and r[1].strip().lower()==provider and r[2].strip().lower()==archive_id]
              if len(mr)!=1: raise SystemExit(f"STOP: expected exactly one distance-map row for {provider}/{archive_id}, got {len(mr)}")
              mr[0][3] = "70"
          with map_path.open("w", encoding="utf-8", newline="") as f:
              csv.writer(f, lineterminator=chr(10)).writerows(map_rows)

          with review_path.open(encoding="utf-8", newline="") as f:
              review_rows = list(csv.reader(f))
          for provider, archive_id, name, record in runtime_matches:
              rr = [r for r in review_rows if len(r)>=5 and r[1].strip().lower()==provider and r[2].strip().lower()==archive_id and r[3].strip().casefold()==name.casefold()]
              if len(rr)!=1: raise SystemExit(f"STOP: expected exactly one review row for {provider}/{archive_id}, got {len(rr)}")
              rr[0][4] = "70"
          with review_path.open("w", encoding="utf-8", newline="") as f:
              csv.writer(f, lineterminator=chr(10)).writerows(review_rows)

          with runtime_path.open("w", encoding="utf-8") as f:
              json.dump(runtime, f, indent=2, ensure_ascii=False)
              f.write(chr(10))

          check = json.loads(runtime_path.read_text(encoding="utf-8"))
          verified = []
          for provider, archive_id, name, record in runtime_matches:
              final = [r for r in check["records"] if str(r.get("providerKey","")).strip().lower()==provider and str(r.get("archiveId","")).strip().lower()==archive_id]
              assert len(final)==1 and float(final[0]["distanceMly"])==distance and abs(float(final[0]["redshift"])-redshift)<1e-12
              with map_path.open(encoding="utf-8", newline="") as f: final_map=list(csv.reader(f))
              assert sum(1 for r in final_map if len(r)>=4 and r[1].strip().lower()==provider and r[2].strip().lower()==archive_id and r[3].strip()=="70")==1
              with review_path.open(encoding="utf-8", newline="") as f: final_review=list(csv.reader(f))
              assert sum(1 for r in final_review if len(r)>=5 and r[1].strip().lower()==provider and r[2].strip().lower()==archive_id and r[3].strip().casefold()==name.casefold() and r[4].strip()=="70")==1
              verified.append({"providerKey":provider,"archiveId":archive_id,"distanceMly":float(final[0]["distanceMly"]),"redshift":float(final[0]["redshift"]),"runtimeMatches":len(final),"distanceMapRowsVerified":1,"reviewRowsVerified":1})
          report={"object":"NGC 2525","distanceMly":distance,"redshiftCosmologyDerived":redshift,"records":verified,"distanceSource":distance_source,"redshiftSource":redshift_source}
          with open("ngc2525-runtime-repair-report.json","w",encoding="utf-8") as f:
              json.dump(report,f,indent=2)
              f.write(chr(10))
          print(json.dumps(report,indent=2))
      - name: Validate changed files
        run: |
          python3 -m json.tool viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json >/dev/null
          git diff --check
      - name: Commit and push catalog correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json viewer/image-databases/master-database/avm-metadata/avm-runtime-distance-map-0004.csv viewer/image-databases/master-database/avm-metadata/AVM-METADATA-GEMINI-NED-SIMBAD/Galaxy_Viewer_v0004a_Distance_Review_Workbook.csv
          git diff --cached --check
          git commit -m "Correct NGC 2525 runtime distance and redshift"
          git push origin HEAD:release
      - name: Upload repair report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ngc2525-runtime-repair-report
          path: ngc2525-runtime-repair-report.json
          if-no-files-found: warn
