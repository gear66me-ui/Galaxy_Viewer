name: Fix 10V HD comet once

on:
  push:
    branches: [beta]
    paths:
      - .github/workflows/fix-10v-hd-comet-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Apply one-value 10V HD comet repair
        run: |
          set -euo pipefail
          test "$(git hash-object viewer/GV-beta-0010V.py)" = "e024d6808d0beb351eee3c9f05f1c30f31ca8cd3"
          python - <<'PY'
          from pathlib import Path
          p=Path('viewer/GV-beta-0010V.py')
          s=p.read_text()
          old='inset:-5px;border-radius:50%;opacity:0;pointer-events:none;transform-origin:50% 50%'
          new='inset:4px;border-radius:50%;opacity:0;pointer-events:none;transform-origin:50% 50%'
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          assert s.count(new)==1, s.count(new)
          p.write_text(s)
          PY
          python -m py_compile viewer/GV-beta-0010V.py
          test "$(git hash-object viewer/GV-beta-0010V.py)" = "ec060fd6cfad637db416c74370d1fa2b63fee007"
          git rm .github/workflows/fix-10v-hd-comet-once.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/GV-beta-0010V.py .github/workflows/fix-10v-hd-comet-once.yml
          git commit -m '10V keep HD archive comet inside provider icon' -m 'ECO-ID: GV-10V-HD-COMET-005' -m 'AUTHORIZED-PATHS: viewer/GV-beta-0010V.py, .github/workflows/fix-10v-hd-comet-once.yml' -m 'CHANGE: gv-hd-archive-comet inset -5px to 4px only' -m 'USER-GO: true'
          git push origin HEAD:beta
