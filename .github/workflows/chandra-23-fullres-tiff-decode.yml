name: Chandra 23 Full-Resolution TIFF Decode

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/chandra-23-fullres-tiff-decode.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Crawl Chandra source pages and decode TIFF AVM
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libimage-exiftool-perl imagemagick >/dev/null
          mkdir -p /tmp/chandra23tiff/assets /tmp/chandra23tiff/out
          python3 - <<'PY'
          import json,re,urllib.request,urllib.parse,ssl,pathlib,hashlib,subprocess,time
          targets=[
          ('901c','M33','https://chandra.harvard.edu/photo/2026/galaxies/'),
          ('838f','Eagle Nebula (M16)','https://chandra.harvard.edu/photo/2024/25th/'),
          ('800','Crab Nebula','https://chandra.harvard.edu/photo/2023/crabx/'),
          ('370','Coronet Cluster','https://chandra.harvard.edu/photo/2007/coronet/'),
          ('901a','NGC 1672','https://chandra.harvard.edu/photo/2026/galaxies/'),
          ('901b','II Zw 096','https://chandra.harvard.edu/photo/2026/galaxies/'),
          ('901e','NGC 1569','https://chandra.harvard.edu/photo/2026/galaxies/'),
          ('901f','M90','https://chandra.harvard.edu/photo/2026/galaxies/'),
          ('901i','Arp 143','https://chandra.harvard.edu/photo/2026/galaxies/'),
          ('901j','NGC 4725','https://chandra.harvard.edu/photo/2026/galaxies/'),
          ('901l','NGC 660','https://chandra.harvard.edu/photo/2026/galaxies/'),
          ('901o','NGC 3938','https://chandra.harvard.edu/photo/2026/galaxies/'),
          ('847','Guitar Nebula','https://chandra.harvard.edu/photo/2024/guitar/'),
          ('838p','Hb 5 Nebula','https://chandra.harvard.edu/photo/2024/25th/'),
          ('813','SN 1006','https://chandra.harvard.edu/photo/2023/sn1006/'),
          ('797',"Tycho's Supernova Remnant",'https://chandra.harvard.edu/photo/2023/tycho/'),
          ('429','RCW 86','https://chandra.harvard.edu/photo/2009/rcw86/'),
          ('heart-2026','Cocoon Nebula · IC 5146','https://chandra.harvard.edu/photo/2026/heart/'),
          ('spring-w2','Westerlund 2','https://chandra.harvard.edu/photo/2026/spring/'),
          ('spring-ngc346','NGC 346','https://chandra.harvard.edu/photo/2026/spring/'),
          ('spring-catspaw',"Cat's Paw Nebula · NGC 6334",'https://chandra.harvard.edu/photo/2026/spring/'),
          ('spring-pelican','Pelican Nebula','https://chandra.harvard.edu/photo/2026/spring/'),
          ('spring-flame','Flame Nebula · NGC 2024','https://chandra.harvard.edu/photo/2026/spring/')
          ]
          ua={'User-Agent':'Mozilla/5.0 GalaxyViewer/1.0'}
          ctx=ssl.create_default_context()
          def fetch(u,timeout=90):
            req=urllib.request.Request(u,headers=ua)
            with urllib.request.urlopen(req,timeout=timeout,context=ctx) as r:return r.read(),dict(r.headers)
          pages={}
          for _,_,page in targets:
            if page in pages: continue
            try:
              b,_=fetch(page);pages[page]=b.decode('utf-8','ignore')
            except Exception as e: pages[page]='';print('PAGE FAIL',page,e)
          page_tiffs={}
          for page,h in pages.items():
            links=set()
            for raw in re.findall(r'''(?:href|src)\s*=\s*["']([^"']+)["']''',h,re.I):
              u=urllib.parse.urljoin(page,raw)
              if re.search(r'\.tiff?(?:$|[?#])',u,re.I):links.add(u)
            # Also catch literal TIFF paths in scripts/text.
            for raw in re.findall(r'''https?://[^"'<>\s]+?\.tiff?''',h,re.I):links.add(raw)
            page_tiffs[page]=sorted(links)
            print('PAGE',page,'TIFFS',len(links))
          # Include known direct TIFF names that Chandra exposes even if page markup hides them.
          known=[
            'https://chandra.harvard.edu/photo/2026/heart/heart.tif',
            'https://chandra.harvard.edu/photo/2026/spring/spring_westerlund2.tif',
            'https://chandra.harvard.edu/photo/2026/spring/spring_ngc346.tif',
            'https://chandra.harvard.edu/photo/2026/spring/spring_catspaw.tif',
            'https://chandra.harvard.edu/photo/2026/spring/spring_pelican.tif',
            'https://chandra.harvard.edu/photo/2026/spring/spring_flame.tif',
            'https://chandra.harvard.edu/photo/2026/galaxies/galaxies.tif'
          ]
          for u in known:
            page=u.rsplit('/',1)[0]+'/'
            page_tiffs.setdefault(page,[])
            if u not in page_tiffs[page]: page_tiffs[page].append(u)

          all_urls=sorted(set(u for us in page_tiffs.values() for u in us))
          meta_by_url={}
          assets=pathlib.Path('/tmp/chandra23tiff/assets')
          for n,u in enumerate(all_urls,1):
            ext='.tif'
            p=assets/(hashlib.sha256(u.encode()).hexdigest()[:20]+ext)
            rec={'url':u}
            try:
              b,h=fetch(u,180)
              p.write_bytes(b);rec['bytes']=len(b);rec['sha256']=hashlib.sha256(b).hexdigest()
              raw=subprocess.check_output(['exiftool','-j','-G1','-a','-u',str(p)],text=True,stderr=subprocess.STDOUT,timeout=120)
              md=json.loads(raw)[0]
              keep={}
              for k,v in md.items():
                if any(s in k.lower() for s in ['spatial','wcs','fits','imagewidth','imageheight','orientation','scale','rotation','reference','xmp','title','description','subject']):
                  keep[k]=v
              rec['metadata']=keep
              rec['spatialQuality']=next((v for k,v in keep.items() if k.lower().endswith('spatialquality')),None)
              rec['hasReferenceValue']=any(k.lower().endswith('spatialreferencevalue') for k in keep)
              rec['hasReferencePixel']=any(k.lower().endswith('spatialreferencepixel') for k in keep)
              rec['hasScale']=any(k.lower().endswith('spatialscale') or k.lower().endswith('spatialcdmatrix') for k in keep)
              rec['hasRotation']=any(k.lower().endswith('spatialrotation') or k.lower().endswith('spatialcdmatrix') for k in keep)
              print('TIFF',n,'/',len(all_urls),u,len(b),rec['spatialQuality'])
            except Exception as e:
              rec['error']=str(e);print('TIFF FAIL',u,e)
            meta_by_url[u]=rec

          out={'version':'0001','targetCount':23,'uniqueSourcePages':len(pages),'uniqueTiffCount':len(all_urls),'targets':[],'assets':list(meta_by_url.values())}
          for key,name,page in targets:
            out['targets'].append({'key':key,'name':name,'sourcePage':page,'tiffUrls':page_tiffs.get(page,[])})
          pathlib.Path('/tmp/chandra23tiff/out/gv-chandra-23-fullres-tiff-decode-0001.json').write_text(json.dumps(out,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chandra-23-fullres-tiff-decode
          path: /tmp/chandra23tiff/out/gv-chandra-23-fullres-tiff-decode-0001.json
          retention-days: 30
