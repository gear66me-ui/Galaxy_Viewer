name: Deploy Aladin comparison test

on:
  push:
    branches: [beta]
    paths:
      - ".github/workflows/deploy-aladin-pages-test.yml"
      - "aladin-source-clone/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: aladin-source-clone/package.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build local Aladin
        working-directory: aladin-source-clone
        run: |
          npm install
          npm run build:npm
      - name: Assemble diagnostic website
        shell: bash
        run: |
          set -euo pipefail
          SITE="$GITHUB_WORKSPACE/_site"
          mkdir -p "$SITE/local"
          cp -R aladin-source-clone/dist/. "$SITE/local/"
          touch "$SITE/.nojekyll"

          cat > "$SITE/index.html" <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galaxy Viewer Aladin Test</title><style>body{margin:0;background:#020712;color:#eefaff;font-family:Arial;padding:24px}a{display:block;margin:16px 0;padding:18px;border:1px solid #62d8ff;border-radius:10px;color:white;text-decoration:none;background:#0b2038}</style></head><body><h1>Galaxy Viewer — Aladin Comparison</h1><a href="official.html">Official Aladin 3.8.2</a><a href="local.html">Local Aladin 3.9.0-beta</a></body></html>
          HTML

          cat > "$SITE/diagnostics.js" <<'JS'
          (() => {
            const lines = [];
            const show = message => {
              const text = String(message);
              lines.push(text);
              console.log('[GV diagnostic]', text);
              const box = document.getElementById('diagnostics');
              if (box) box.textContent = lines.join('\n');
            };
            window.GV_DIAG = show;
            window.addEventListener('error', event => {
              const target = event.target;
              if (target && target !== window) show('RESOURCE ERROR: ' + (target.src || target.href || target.tagName));
              else show('SCRIPT ERROR: ' + (event.message || 'unknown') + ' @ ' + (event.filename || 'unknown') + ':' + (event.lineno || 0));
            }, true);
            window.addEventListener('unhandledrejection', event => show('PROMISE ERROR: ' + String(event.reason)));
            const originalFetch = window.fetch.bind(window);
            window.fetch = async (...args) => {
              const url = String(args[0] && args[0].url ? args[0].url : args[0]);
              try {
                const response = await originalFetch(...args);
                if (!response.ok) show('FETCH ' + response.status + ': ' + url);
                return response;
              } catch (error) {
                show('FETCH FAILED: ' + url + ' — ' + error);
                throw error;
              }
            };
            const open = XMLHttpRequest.prototype.open;
            const send = XMLHttpRequest.prototype.send;
            XMLHttpRequest.prototype.open = function(method, url, ...rest) {
              this.__gvUrl = String(url);
              return open.call(this, method, url, ...rest);
            };
            XMLHttpRequest.prototype.send = function(...args) {
              this.addEventListener('loadend', () => {
                if (this.status === 0 || this.status >= 400) show('XHR ' + this.status + ': ' + this.__gvUrl);
              });
              return send.apply(this, args);
            };
            show('Diagnostics active — ' + navigator.userAgent);
          })();
          JS

          cat > "$SITE/official.html" <<'HTML'
          <!doctype html>
          <html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Official Aladin 3.8.2 Test</title><link rel="stylesheet" href="https://aladin.cds.unistra.fr/AladinLite/api/v3/3.8.2/aladin.min.css"><style>html,body{width:100%;height:100%;margin:0;background:#000;color:#fff;font-family:Arial;overflow:hidden}#status{height:56px;padding:8px 10px;background:#071525;border-bottom:1px solid #62d8ff}#diagnostics{height:110px;margin:0;padding:8px 10px;overflow:auto;white-space:pre-wrap;background:#160b12;color:#ffd5df;font:11px/15px monospace;border-bottom:1px solid #b33}#aladin-lite-div{width:100%;height:calc(100vh - 183px);background:#555}</style></head><body><div id="status"><strong>OFFICIAL ALADIN 3.8.2</strong><br>Loading engine…</div><pre id="diagnostics"></pre><div id="aladin-lite-div"></div><script src="diagnostics.js"></script><script src="https://aladin.cds.unistra.fr/AladinLite/api/v3/3.8.2/aladin.js"></script><script>const statusBox=document.getElementById('status');A.init.then(()=>{GV_DIAG('A.init resolved');statusBox.innerHTML='<strong>OFFICIAL ALADIN 3.8.2 INITIALIZED</strong><br>Requesting P/DSS2/color for M31…';window.OFFICIAL_ALADIN_TEST=A.aladin('#aladin-lite-div',{target:'10.6847083 +41.26875',survey:'P/DSS2/color',fov:1.5,projection:'TAN',cooFrame:'ICRSd',showReticle:true,reticleColor:'#62D8FF',reticleSize:22,showZoomControl:true,showFullscreenControl:true,showLayersControl:true,showGotoControl:true,showCooGridControl:true,showSimbadPointerControl:true,showProjectionControl:true});GV_DIAG('Viewer object created');}).catch(e=>{GV_DIAG('INITIALIZATION FAILED: '+e);statusBox.textContent='INITIALIZATION FAILED: '+e;});</script></body></html>
          HTML

          cat > "$SITE/local.html" <<'HTML'
          <!doctype html>
          <html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Local Aladin 3.9.0-beta Test</title><link rel="stylesheet" href="./local/aladin.css"><style>html,body{width:100%;height:100%;margin:0;background:#000;color:#fff;font-family:Arial;overflow:hidden}#status{height:56px;padding:8px 10px;background:#071525;border-bottom:1px solid #62d8ff}#diagnostics{height:110px;margin:0;padding:8px 10px;overflow:auto;white-space:pre-wrap;background:#160b12;color:#ffd5df;font:11px/15px monospace;border-bottom:1px solid #b33}#aladin-lite-div{width:100%;height:calc(100vh - 183px);background:#555}</style></head><body><div id="status"><strong>LOCAL ALADIN 3.9.0-BETA</strong><br>Loading local engine and WASM…</div><pre id="diagnostics"></pre><div id="aladin-lite-div"></div><script src="diagnostics.js"></script><script type="module">const statusBox=document.getElementById('status');try{const module=await import('./local/aladin.js');GV_DIAG('Module imported');const A=module.default||module.A||module;await A.init;GV_DIAG('A.init resolved');statusBox.innerHTML='<strong>LOCAL ALADIN 3.9.0-BETA INITIALIZED</strong><br>Requesting P/DSS2/color for M31…';window.LOCAL_ALADIN_TEST=A.aladin('#aladin-lite-div',{target:'10.6847083 +41.26875',survey:'P/DSS2/color',fov:1.5,projection:'TAN',cooFrame:'ICRSd',showReticle:true,reticleColor:'#62D8FF',reticleSize:22,showZoomControl:true,showFullscreenControl:true,showLayersControl:true,showGotoControl:true,showCooGridControl:true,showSimbadPointerControl:true,showProjectionControl:true});GV_DIAG('Viewer object created');}catch(e){GV_DIAG('INITIALIZATION FAILED: '+e);statusBox.textContent='INITIALIZATION FAILED: '+e;console.error(e);}</script></body></html>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
