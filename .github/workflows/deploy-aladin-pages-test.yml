name: Deploy Aladin comparison test

on:
  push:
    branches: [beta]
    paths:
      - ".github/workflows/deploy-aladin-pages-test.yml"
      - "aladin-source-clone/**"
      - "viewer/aladin-latency-lab.html"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out beta branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: aladin-source-clone/package.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install Aladin dependencies
        working-directory: aladin-source-clone
        run: npm install

      - name: Build local Aladin package
        working-directory: aladin-source-clone
        run: npm run build:npm

      - name: Assemble diagnostic website
        shell: bash
        run: |
          set -euo pipefail
          SITE="$GITHUB_WORKSPACE/_site"
          mkdir -p "$SITE/local"
          cp -R aladin-source-clone/dist/. "$SITE/local/"
          cp viewer/aladin-latency-lab.html "$SITE/latency.html"
          touch "$SITE/.nojekyll"

          cat > "$SITE/index.html" <<'HTML'
          <!doctype html>
          <html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Galaxy Viewer Aladin Diagnostics</title>
          <style>body{margin:0;background:#020712;color:#fff;font-family:Arial;padding:24px}a{display:block;margin:16px 0;padding:16px;background:#0b2038;border:1px solid #62d8ff;color:#fff;text-decoration:none;border-radius:10px}h1{color:#62d8ff}</style>
          </head><body><h1>GALAXY VIEWER ALADIN DIAGNOSTICS</h1><a href="latency.html?v=4">Diagnostic Build 4 — CDS latency laboratory</a><a href="official.html?v=2">Official 3.8.2 diagnostic</a><a href="local.html?v=2">Local 3.9.0-beta diagnostic</a></body></html>
          HTML

          cat > "$SITE/official.html" <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
          <title>Official Aladin Diagnostic Build 2</title>
          <link rel="stylesheet" href="https://aladin.cds.unistra.fr/AladinLite/api/v3/3.8.2/aladin.min.css">
          <style>
          html,body{width:100%;height:100%;margin:0;background:#000;color:#fff;font-family:Arial;overflow:hidden}#diag{height:150px;overflow:auto;padding:10px;background:#350707;border-bottom:3px solid #ff3b3b;font:12px/17px monospace;white-space:pre-wrap}#diag b{color:#fff27a}#aladin-lite-div{width:100%;height:calc(100vh - 173px)}#stamp{height:23px;background:#ff3b3b;color:#000;font-weight:900;text-align:center;line-height:23px}
          </style></head><body>
          <div id="stamp">DIAGNOSTIC BUILD 2 — OFFICIAL 3.8.2</div><div id="diag">Starting diagnostics…</div><div id="aladin-lite-div"></div>
          <script src="https://aladin.cds.unistra.fr/AladinLite/api/v3/3.8.2/aladin.js"></script>
          <script>
          const d=document.getElementById('diag'); const log=x=>{d.textContent+=`\n${x}`;d.scrollTop=d.scrollHeight};
          addEventListener('error',e=>log('WINDOW ERROR: '+(e.message||e.target?.src||'resource error')),true);
          addEventListener('unhandledrejection',e=>log('PROMISE ERROR: '+String(e.reason)));
          async function probe(label,url){try{const r=await fetch(url,{cache:'no-store'});log(label+': HTTP '+r.status+' '+r.statusText+' | type='+r.type);return r.ok}catch(e){log(label+': FAILED '+e.name+': '+e.message);return false}}
          (async()=>{
            d.textContent='DIAGNOSTIC BUILD 2\nPage: '+location.href+'\nBrowser: '+navigator.userAgent;
            await probe('CDS root','https://aladin.cds.unistra.fr/');
            await probe('DSS properties','https://alasky.cds.unistra.fr/DSS/DSSColor/properties');
            await probe('DSS sample tile','https://alasky.cds.unistra.fr/DSS/DSSColor/Norder3/Dir0/Npix0.jpg');
            try{await A.init;log('A.init: OK');const v=A.aladin('#aladin-lite-div',{survey:'P/DSS2/color',target:'M 31',fov:1.5,showReticle:true});window.TEST=v;log('A.aladin: viewer object created');setTimeout(()=>log('Canvas count after 5s: '+document.querySelectorAll('canvas').length),5000)}catch(e){log('ALADIN FAILURE: '+e.name+': '+e.message);log(e.stack||'')}
          })();
          </script></body></html>
          HTML

          cat > "$SITE/local.html" <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
          <title>Local Aladin Diagnostic Build 2</title>
          <link rel="stylesheet" href="./local/aladin.min.css">
          <style>
          html,body{width:100%;height:100%;margin:0;background:#000;color:#fff;font-family:Arial;overflow:hidden}#diag{height:150px;overflow:auto;padding:10px;background:#350707;border-bottom:3px solid #ff3b3b;font:12px/17px monospace;white-space:pre-wrap}#aladin-lite-div{width:100%;height:calc(100vh - 173px)}#stamp{height:23px;background:#ff3b3b;color:#000;font-weight:900;text-align:center;line-height:23px}
          </style></head><body>
          <div id="stamp">DIAGNOSTIC BUILD 2 — LOCAL 3.9.0-BETA</div><div id="diag">Starting diagnostics…</div><div id="aladin-lite-div"></div>
          <script type="module">
          const d=document.getElementById('diag'); const log=x=>{d.textContent+=`\n${x}`;d.scrollTop=d.scrollHeight};
          addEventListener('error',e=>log('WINDOW ERROR: '+(e.message||e.target?.src||'resource error')),true);
          addEventListener('unhandledrejection',e=>log('PROMISE ERROR: '+String(e.reason)));
          async function probe(label,url){try{const r=await fetch(url,{cache:'no-store'});log(label+': HTTP '+r.status+' '+r.statusText+' | type='+r.type);return r.ok}catch(e){log(label+': FAILED '+e.name+': '+e.message);return false}}
          d.textContent='DIAGNOSTIC BUILD 2\nPage: '+location.href+'\nBrowser: '+navigator.userAgent;
          await probe('CDS root','https://aladin.cds.unistra.fr/');
          await probe('DSS properties','https://alasky.cds.unistra.fr/DSS/DSSColor/properties');
          await probe('DSS sample tile','https://alasky.cds.unistra.fr/DSS/DSSColor/Norder3/Dir0/Npix0.jpg');
          try{const mod=await import('./local/aladin.js');const A=mod.default||mod.A||mod;log('Local JS import: OK');await A.init;log('A.init: OK');const v=A.aladin('#aladin-lite-div',{survey:'P/DSS2/color',target:'M 31',fov:1.5,showReticle:true});window.TEST=v;log('A.aladin: viewer object created');setTimeout(()=>log('Canvas count after 5s: '+document.querySelectorAll('canvas').length),5000)}catch(e){log('ALADIN FAILURE: '+e.name+': '+e.message);log(e.stack||'')}
          </script></body></html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
