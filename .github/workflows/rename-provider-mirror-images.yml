name: Rename Provider Mirror Images
on:
  push:
    branches: [release]
    paths: ['.github/workflows/rename-provider-mirror-images.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rename-provider-mirror-images
  cancel-in-progress: false
jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 1
      - name: Rename every mapped mirror image from source URL
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib,re,urllib.parse
          root=pathlib.Path('viewer/image-databases')
          providers=['Chandra','ESO','Hubble','JWST','NoirLab','Spitzer','master-database']
          total=0
          missing=[]
          for provider in providers:
            mirror=root/provider/'Mirror'
            mp=mirror/'mirror-mapping.json'
            if not mp.exists(): continue
            data=json.loads(mp.read_text())
            rows=data.get('images',[])
            plans=[]
            used=set()
            for i,row in enumerate(rows):
              total+=1
              old= root/provider/(row.get('relativePath') or ('Mirror/'+row.get('mirrorFilename','')))
              if not old.is_file():
                missing.append({'provider':provider,'path':str(old),'sourceUrl':row.get('sourceUrl')})
                continue
              source=row.get('sourceUrl') or ''
              base=pathlib.PurePosixPath(urllib.parse.unquote(urllib.parse.urlsplit(source).path)).name
              stem=pathlib.PurePosixPath(base).stem
              ext=pathlib.PurePosixPath(base).suffix.lower()
              if not re.fullmatch(r'\.[a-z0-9]{2,5}',ext or ''): ext=old.suffix.lower() or '.jpg'
              if not stem or re.fullmatch(r'[0-9a-fA-F]{40,}',stem):
                stem=re.sub(r'__[0-9a-fA-F]{8,}$','',old.stem)
              if not stem or re.fullmatch(r'[0-9a-fA-F]{40,}',stem):
                stem=provider.lower()+'-image-'+hashlib.sha256((source or str(i)).encode()).hexdigest()[:10]
              stem=re.sub(r'[^A-Za-z0-9._-]+','-',stem).strip('._-')[:100]
              name=stem+ext
              if name.casefold() in used:
                suffix=hashlib.sha256((source+'|'+str(i)).encode()).hexdigest()[:8]
                name=f'{stem}__{suffix}{ext}'
              used.add(name.casefold())
              plans.append((row,old,mirror/name,name,source))
            staged=[]
            for i,(row,old,new,name,source) in enumerate(plans):
              temp=None
              if old.resolve()!=new.resolve():
                temp=old.with_name('.rename-tmp-'+hashlib.sha256((str(old)+str(i)).encode()).hexdigest()[:16])
                old.rename(temp)
              staged.append((row,old,new,name,source,temp))
            for row,old,new,name,source,temp in staged:
              if temp:
                if new.exists(): raise SystemExit('Refusing to overwrite '+str(new))
                temp.rename(new)
              row['sourceFilename']=pathlib.PurePosixPath(urllib.parse.urlsplit(source).path).name or row.get('sourceFilename') or name
              row['mirrorFilename']=name
              row['relativePath']='Mirror/'+name
            data['imageCount']=len(rows)
            mp.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
            print(provider+': '+str(len(rows))+' mapped')
          if missing:
            print(json.dumps(missing[:30],indent=2))
            raise SystemExit(f'{len(missing)} mapped files missing; refusing to publish')
          for provider in providers:
            mp=root/provider/'Mirror'/'mirror-mapping.json'
            if mp.exists():
              data=json.loads(mp.read_text())
              for row in data.get('images',[]):
                if not (root/provider/row['relativePath']).is_file():
                  raise SystemExit('Validation failed: '+provider+'/'+row['relativePath'])
          print(json.dumps({'mappedImages':total,'validation':'passed'},indent=2))
          PY
      - name: Commit all renamed files and mappings
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/image-databases/Chandra/Mirror viewer/image-databases/ESO/Mirror viewer/image-databases/Hubble/Mirror viewer/image-databases/JWST/Mirror viewer/image-databases/NoirLab/Mirror viewer/image-databases/Spitzer/Mirror viewer/image-databases/master-database/Mirror
          if git diff --cached --quiet; then echo 'No renames needed'; exit 0; fi
          git commit -m 'Rename provider mirror images to descriptive source filenames'
          git push origin HEAD:release
