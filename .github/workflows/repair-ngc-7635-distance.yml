name: Repair NGC 7635 Bubble Nebula Distance and AVM

on:
  push:
    branches: [release]
    paths:
      - '.github/workflows/repair-ngc-7635-distance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0
      - name: Correct NOIRLab catalog and AVM runtime record
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, sys

          paths = [
              pathlib.Path("viewer/image-databases/NoirLab/databases/gv-noirlab-galaxies-full-0001.json"),
              pathlib.Path("viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0003.json"),
          ]
          aliases = ("ngc 7635", "bubble nebula")
          def is_target(obj):
              vals = []
              for k in ("name", "designation", "displayName", "commonName", "common_name", "title", "objectName", "id", "object", "target"):
                  v = obj.get(k)
                  if isinstance(v, str): vals.append(v.lower())
              a = obj.get("aliases")
              if isinstance(a, list): vals.extend(str(v).lower() for v in a)
              return any(any(alias in v for alias in aliases) for v in vals)

          def patch(node):
              n = 0
              if isinstance(node, dict):
                  if is_target(node):
                      # 11,300 ly = 0.0113 Mly = 11.3 Kly.
                      node["distanceMly"] = 0.0113
                      node["distance"] = "11,300 light-years"
                      node["distanceKly"] = 11.3
                      science = node.get("science")
                      if not isinstance(science, dict):
                          science = {}
                          node["science"] = science
                      science["distanceMly"] = 0.0113
                      science["distanceKly"] = 11.3
                      science["distanceDisplay"] = "11,300 light-years"
                      for key in ("distance_mly", "distance_mly_value"):
                          if key in node: node[key] = 0.0113
                      # Keep it classified as an emission nebula, not a galaxy.
                      for key in ("objectType", "object_type", "classification", "type"):
                          if key in node and isinstance(node[key], str) and "galaxy" in node[key].lower():
                              node[key] = "emission nebula"
                      n += 1
                  for value in node.values(): n += patch(value)
              elif isinstance(node, list):
                  for value in node: n += patch(value)
              return n

          total = 0
          for path in paths:
              if not path.is_file():
                  raise SystemExit(f"Required catalog missing: {path}")
              data = json.loads(path.read_text(encoding="utf-8"))
              changed = patch(data)
              if changed == 0:
                  raise SystemExit(f"No NGC 7635/Bubble Nebula record found in {path}; refusing to guess.")
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              verify = json.loads(path.read_text(encoding="utf-8"))
              found = []
              def collect(node):
                  if isinstance(node, dict):
                      if is_target(node): found.append(node)
                      for value in node.values(): collect(value)
                  elif isinstance(node, list):
                      for value in node: collect(value)
              collect(verify)
              if not found or any(float(o.get("science", {}).get("distanceMly", o.get("distanceMly", -1))) != 0.0113 for o in found):
                  raise SystemExit(f"Post-write distance validation failed: {path}")
              print(f"{path}: updated and verified {changed} NGC 7635 record(s) at 0.0113 Mly")
              total += changed
          if total < 2:
              raise SystemExit(f"Expected updates in both NOIRLab and AVM catalogs; found only {total}")
          PY
      - name: Commit and push verified correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases/NoirLab/databases/gv-noirlab-galaxies-full-0001.json viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0003.json
          if git diff --cached --quiet; then
            echo "No catalog diff produced; refusing an empty repair commit."
            exit 1
          fi
          git commit -m "Correct NGC 7635 distance to 11300 light-years in NOIRLab and AVM"
          git push origin HEAD:release
