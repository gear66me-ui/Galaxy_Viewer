name: Surgical M42 Distance Fix

on:
  push:
    branches:
      - release
    paths:
      - ".github/workflows/fix-m42-distance.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-m42-distance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Fix the second M42 distance without touching age fields
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path("viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          entries = data.get("entries", [])

          def is_m42(entry):
              # Identify M42 in the catalog's descriptive fields, not in unrelated metadata.
              fields = ("name", "designation", "objectName", "object_name", "title", "target", "id")
              return any(
                  isinstance(entry.get(key), str)
                  and re.search(r"(?<![A-Za-z0-9])(?:M\s*42|Messier\s*42)(?![A-Za-z0-9])", entry[key], re.I)
                  for key in fields
              )

          all_m42 = [e for e in entries if is_m42(e)]
          print("M42 records found:")
          for e in all_m42:
              print(json.dumps({
                  "archiveId": e.get("archiveId"),
                  "name": e.get("name"),
                  "designation": e.get("designation"),
                  "distance": e.get("distance"),
                  "age": e.get("age")
              }, ensure_ascii=False))

          # These are the two M42 records that were showing the bad distance.
          # opo9229a had "1 light-years"; opo9229b had a comma that can fail parsing.
          by_id = {e.get("archiveId"): e for e in all_m42}
          required_ids = ("opo9229a", "opo9229b")
          missing = [rid for rid in required_ids if rid not in by_id]
          if missing:
              raise SystemExit(f"STOP: expected M42 record IDs not found: {missing}")

          for rid in required_ids:
              entry = by_id[rid]
              old_distance = entry.get("distance")
              old_age = entry.get("age")
              entry["distance"] = "1500 light-years"
              if entry.get("age") != old_age:
                  raise SystemExit(f"STOP: age field changed unexpectedly for {rid}.")
              print(f"UPDATED {rid}: distance {old_distance!r} -> {entry['distance']!r}; age preserved {old_age!r}")

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"UPDATED second M42: archiveId={entry.get('archiveId')!r}, name={entry.get('name')!r}")
          print(f"Distance: {old_distance!r} -> {entry['distance']!r}")
          print(f"Age field preserved exactly: {old_age!r}")
          PY

      - name: Commit the surgical catalog change
        shell: bash
        run: |
          if git diff --quiet -- viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json; then
            echo "No catalog change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json
          git commit -m "Fix second M42 distance in Hubble catalog"
          git push origin HEAD:release
