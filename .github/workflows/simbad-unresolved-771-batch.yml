name: Batch SIMBAD search for unresolved Galaxy Viewer distances

on:
  push:
    branches: [release]
    paths:
      - ".github/workflows/simbad-unresolved-771-batch.yml"
      - ".github/scripts/simbad_unresolved_771_batch.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: simbad-unresolved-771-batch
  cancel-in-progress: true

jobs:
  batch-simbad:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: release
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query SIMBAD in batches for unresolved records
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: "38762527419"
          SOURCE_ARTIFACT_ID: "11993062820"
        run: python .github/scripts/simbad_unresolved_771_batch.py
      - name: Upload SIMBAD batch results
        uses: actions/upload-artifact@v4
        with:
          name: simbad-unresolved-771-results
          path: simbad-unresolved-771-batch-results.csv
          if-no-files-found: error
          retention-days: 30
