name: Galaxy Viewer Build Pipeline

on:
  workflow_dispatch:
    inputs:
      build:
        description: 'Four-digit Galaxy Viewer build, e.g. 0024'
        required: true
        type: string
      eco_id:
        description: 'Authorized ECO ID'
        required: true
        type: string
      requirements:
        description: 'Authorized requirement IDs'
        required: true
        type: string
      user_go:
        description: 'Confirm explicit user GO for this ECO'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  pages: read

concurrency:
  group: galaxy-viewer-build-pipeline-beta
  cancel-in-progress: false

jobs:
  promote-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Validate dependency tree and requested build
        env:
          BUILD: ${{ inputs.build }}
          USER_GO: ${{ inputs.user_go }}
        run: |
          set -euo pipefail
          [[ "$BUILD" =~ ^[0-9]{4}$ ]]
          [ "$USER_GO" = "true" ]
          python3 - <<'PY'
          import json, pathlib, re, os
          build=os.environ['BUILD']
          viewer=pathlib.Path('viewer/GV-beta-200-009.py')
          pointer=pathlib.Path('viewer/gv-current-viewer.json')
          launcher=pathlib.Path('mobile/beta/generic-app.html')
          for p in (viewer,pointer,launcher):
              if not p.is_file():
                  raise SystemExit('MISSING DEPENDENCY: '+str(p))
          s=viewer.read_text(encoding='utf-8')
          if s.count("const GV200001_BUILD='") != 1:
              raise SystemExit('VIEWER BUILD OWNER COUNT != 1')
          d=json.loads(pointer.read_text(encoding='utf-8'))
          if d.get('viewer') != viewer.name:
              raise SystemExit('POINTER VIEWER MISMATCH')
          l=launcher.read_text(encoding='utf-8')
          required=[
              "gv-current-viewer.json",
              "const build=String(pointer.build||'').trim()",
              "RAW_VIEWER_BASE+viewer+'?v='+encodeURIComponent(build)"
          ]
          for marker in required:
              if marker not in l:
                  raise SystemExit('LAUNCHER DEPENDENCY MISSING: '+marker)
          urls=re.findall(r"(?:Url|URL)\s*:\s*'([^']+)'",s)
          print('DEPENDENCY TREE')
          print('Android APK -> mobile/beta/generic-app.html')
          print('generic-app.html -> viewer/gv-current-viewer.json')
          print('gv-current-viewer.json -> '+viewer.name)
          print('Pointer requested build -> '+str(d.get('build','<missing>')))
          print('Viewer current build -> '+(re.search(r"const GV200001_BUILD='([0-9]{4})';",s).group(1) if re.search(r"const GV200001_BUILD='([0-9]{4})';",s) else '<missing>'))
          print('Viewer build cache key -> GV200001-'+build)
          for u in urls:
              print('Viewer dependency -> '+u)
          PY

      - name: Promote build atomically
        env:
          BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re, os
          build=os.environ['BUILD']
          vp=pathlib.Path('viewer/GV-beta-200-009.py')
          pp=pathlib.Path('viewer/gv-current-viewer.json')
          s=vp.read_text(encoding='utf-8')
          s2,n=re.subn(r"const GV200001_BUILD='[0-9]{4}';","const GV200001_BUILD='"+build+"';",s,count=1)
          if n != 1:
              raise SystemExit('BUILD REPLACEMENT COUNT != 1')
          vp.write_text(s2,encoding='utf-8',newline='\n')
          d=json.loads(pp.read_text(encoding='utf-8'))
          d['version']='GV-beta-200-009'
          d['viewer']='GV-beta-200-009.py'
          d['build']=build
          pp.write_text(json.dumps(d,indent=2)+'\n',encoding='utf-8',newline='\n')
          PY

      - name: Verify synchronized build owners
        env:
          BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, os
          build=os.environ['BUILD']
          s=pathlib.Path('viewer/GV-beta-200-009.py').read_text(encoding='utf-8')
          d=json.loads(pathlib.Path('viewer/gv-current-viewer.json').read_text(encoding='utf-8'))
          assert s.count("const GV200001_BUILD='"+build+"';") == 1
          assert d == {'version':'GV-beta-200-009','viewer':'GV-beta-200-009.py','build':build}
          print('BUILD OWNERS SYNCHRONIZED:',build)
          PY

      - name: Commit exact build promotion
        env:
          BUILD: ${{ inputs.build }}
          ECO_ID: ${{ inputs.eco_id }}
          REQUIREMENTS: ${{ inputs.requirements }}
        run: |
          set -euo pipefail
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' viewer/GV-beta-200-009.py viewer/gv-current-viewer.json | sort)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/GV-beta-200-009.py viewer/gv-current-viewer.json
          git commit -m "Promote Galaxy Viewer build $BUILD

          ECO-ID: $ECO_ID
          AUTHORIZED-PATHS: viewer/GV-beta-200-009.py, viewer/gv-current-viewer.json
          REQUIREMENTS: $REQUIREMENTS
          ARCHIVE-AUTHORIZED: false
          USER-GO: true"
          git pull --rebase origin beta
          git push origin HEAD:beta

      - name: Verify repository fetch-back
        env:
          BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          git fetch origin beta
          python3 - <<'PY'
          import json, os, re, subprocess
          build=os.environ['BUILD']
          pointer=json.loads(subprocess.check_output(['git','show','origin/beta:viewer/gv-current-viewer.json'],text=True))
          viewer=subprocess.check_output(['git','show','origin/beta:viewer/GV-beta-200-009.py'],text=True)
          assert pointer['build']==build
          assert viewer.count("const GV200001_BUILD='"+build+"';")==1
          print('REPOSITORY FETCH-BACK PASS:',build)
          PY

      - name: Wait for the Pages deployment of this exact promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          promoted_sha="$(git rev-parse HEAD)"
          echo "PROMOTED SHA: $promoted_sha"
          for attempt in $(seq 1 40); do
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?branch=beta&event=push&per_page=20")"
            match="$(printf '%s' "$run_json" | jq -c --arg sha "$promoted_sha" '.workflow_runs[] | select(.head_sha==$sha) | .' | head -n1)"
            if [ -n "$match" ]; then
              status="$(printf '%s' "$match" | jq -r '.status')"
              conclusion="$(printf '%s' "$match" | jq -r '.conclusion // ""')"
              echo "Pages run for $promoted_sha: status=$status conclusion=$conclusion"
              if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
                break
              fi
              if [ "$status" = "completed" ] && [ "$conclusion" != "success" ]; then
                echo "PAGES DEPLOYMENT FAILED FOR PROMOTED SHA $promoted_sha" >&2
                exit 1
              fi
            else
              echo "Waiting for Pages run tied to promoted SHA: attempt $attempt/40"
            fi
            [ "$attempt" -lt 40 ] || { echo "NO SUCCESSFUL PAGES RUN FOR PROMOTED SHA $promoted_sha" >&2; exit 1; }
            sleep 10
          done

      - name: Verify published pointer, viewer, launcher and cache owner
        env:
          BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          base='https://gear66me-ui.github.io/Galaxy_Viewer'
          for attempt in $(seq 1 30); do
            nonce="$BUILD-$(git rev-parse --short HEAD)-$attempt-$(date +%s)"
            pointer="$(curl -fsSL --retry 2 --max-time 15 -H 'Cache-Control: no-cache, no-store, max-age=0' "$base/viewer/gv-current-viewer.json?pipeline=$nonce" || true)"
            viewer="$(curl -fsSL --retry 2 --max-time 15 -H 'Cache-Control: no-cache, no-store, max-age=0' "$base/viewer/GV-beta-200-009.py?pipeline=$nonce" || true)"
            launcher="$(curl -fsSL --retry 2 --max-time 15 -H 'Cache-Control: no-cache, no-store, max-age=0' "$base/mobile/beta/generic-app.html?pipeline=$nonce" || true)"
            pointer_build="$(printf '%s' "$pointer" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("build",""))' 2>/dev/null || true)"
            viewer_build="$(printf '%s' "$viewer" | sed -n "s/.*const GV200001_BUILD='\([0-9][0-9][0-9][0-9]\)';.*/\1/p" | head -n1)"
            echo "PUBLIC FETCH $attempt: pointer=$pointer_build viewer=$viewer_build requested=$BUILD"
            if [ "$pointer_build" = "$BUILD" ] &&
               [ "$viewer_build" = "$BUILD" ] &&
               printf '%s' "$launcher" | grep -Fq "RAW_VIEWER_BASE+'gv-current-viewer.json'" &&
               printf '%s' "$launcher" | grep -Fq "RAW_VIEWER_BASE+viewer+'?v='+encodeURIComponent(build)"; then
              echo "PUBLIC DEPENDENCY TREE VERIFIED: launcher -> pointer $BUILD -> viewer $BUILD -> cache key $BUILD"
              exit 0
            fi
            sleep 10
          done
          echo "PUBLIC RELEASE TREE DID NOT CONVERGE TO BUILD $BUILD" >&2
          exit 1
