name: Build Galaxy Viewer Release Test APK
on:
  workflow_dispatch:
  push:
    branches: [release]
    paths:
      - 'viewer/gv-current-viewer.json'
      - 'viewer/RC-V1.0.0.9-BLD-0004.py'
      - 'android/galaxy-viewer-web-browser/app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java'
      - '.github/workflows/build-galaxy-viewer-release-test-apk.yml'
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: release }
      - name: Validate Build 0004 release pointer and preserve catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          pointer = json.loads(Path('viewer/gv-current-viewer.json').read_text(encoding='utf-8'))
          expected = {'version': 'RC-V1.0.0.9', 'viewer': 'RC-V1.0.0.9-BLD-0004.py', 'build': '0004'}
          if pointer != expected:
              raise SystemExit(f'Unexpected Build 0004 pointer: {pointer!r}')
          viewer = Path('viewer') / pointer['viewer']
          if not viewer.is_file():
              raise SystemExit(f'Viewer target missing: {viewer}')
          source = viewer.read_text(encoding='utf-8')
          if 'BUILD_NUMBER = "0004"' not in source:
              raise SystemExit('Build number inside viewer does not match pointer')
          html = source.count('display(HTML("""')
          js = source.count('display(Javascript(r"""')
          if html != 1 or js != 1:
              raise SystemExit(f'Viewer extraction markers invalid: html={html}, js={js}')
          print(f'Validated Build 0004 pointer and viewer extraction markers: {viewer}')
          html_start = source.index('display(HTML("""') + len('display(HTML("""')
          html_end = source.index('"""))', html_start)
          js_start = source.index('display(Javascript(r"""') + len('display(Javascript(r"""')
          js_end = source.index('"""))', js_start)
          Path('/tmp/gv-build-0004.js').write_text(source[js_start:js_end], encoding='utf-8')
          PY
          node --check /tmp/gv-build-0004.js
          if git diff --name-only HEAD^ HEAD | grep -q '^viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build the actual Galaxy Viewer Android app
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p android/galaxy-viewer-web-browser :app:assembleDebug
          APK=android/galaxy-viewer-web-browser/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" Galaxy-Viewer-Build-0004-Memory-Stabilization.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Galaxy-Viewer-Build-0004-Memory-Stabilization.apk
          sha256sum Galaxy-Viewer-Build-0004-Memory-Stabilization.apk > Galaxy-Viewer-Build-0004-Memory-Stabilization.apk.sha256
      - name: Publish direct-download Build 0004 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          T=galaxy-viewer-build-0004-memory-stabilization
          gh release delete "$T" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$T" Galaxy-Viewer-Build-0004-Memory-Stabilization.apk Galaxy-Viewer-Build-0004-Memory-Stabilization.apk.sha256 --target release --title "Galaxy Viewer Build 0004 — Memory Stabilization" --notes "Build 0004 Android APK. Viewer pointer and release manifest target Build 0004. Runtime catalog is preserved."
      - uses: actions/upload-artifact@v4
        with: { name: Galaxy-Viewer-Build-0004-Memory-Stabilization, path: 'Galaxy-Viewer-Build-0004-Memory-Stabilization.apk*' }
