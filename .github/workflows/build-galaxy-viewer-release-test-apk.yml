name: Build Galaxy Viewer Release Test APK
on:
  workflow_dispatch:
  push:
    branches: [release]
    paths:
      - 'viewer/RC-V1.0.0.9-BLD-0005.py'
      - 'android/galaxy-viewer-web-browser/**'
      - '.github/workflows/build-galaxy-viewer-release-test-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 1

      - name: Validate Build 0005 source and extraction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source_path = Path('viewer/RC-V1.0.0.9-BLD-0005.py')
          if not source_path.is_file():
              raise SystemExit(f'Missing Build 0005 source: {source_path}')
          source = source_path.read_text(encoding='utf-8')
          if 'VIEWER_VERSION = "RC-V1.0.0.9"' not in source:
              raise SystemExit('Viewer version mismatch')
          if 'BUILD_NUMBER = "0005"' not in source:
              raise SystemExit('Build number mismatch')
          html_marker = 'display(HTML("""'
          js_marker = 'display(Javascript(r"""'
          html_count = source.count(html_marker)
          js_count = source.count(js_marker)
          if html_count != 1 or js_count != 1:
              raise SystemExit(f'Viewer extraction markers invalid: html={html_count}, js={js_count}')
          html_start = source.index(html_marker) + len(html_marker)
          html_end = source.index('"""))', html_start)
          js_start = source.index(js_marker) + len(js_marker)
          js_end = source.index('"""))', js_start)
          Path('/tmp/gv-build-0005.js').write_text(source[js_start:js_end], encoding='utf-8')
          print('Build 0005 identity and extraction markers passed')
          PY
          node --check /tmp/gv-build-0005.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Galaxy Viewer Android APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p android/galaxy-viewer-web-browser :app:assembleDebug
          APK=android/galaxy-viewer-web-browser/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" Galaxy-Viewer-RC-V1.0.0.9-Build-0005.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Galaxy-Viewer-RC-V1.0.0.9-Build-0005.apk
          sha256sum Galaxy-Viewer-RC-V1.0.0.9-Build-0005.apk > Galaxy-Viewer-RC-V1.0.0.9-Build-0005.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Viewer-RC-V1.0.0.9-Build-0005
          path: |
            Galaxy-Viewer-RC-V1.0.0.9-Build-0005.apk
            Galaxy-Viewer-RC-V1.0.0.9-Build-0005.apk.sha256
          retention-days: 30
