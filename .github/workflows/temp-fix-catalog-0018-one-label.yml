name: Temporary fix one Catalog 0018 classification

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/temp-fix-catalog-0018-one-label.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Correct Abell S0740 classification
        shell: bash
        run: |
          git fetch origin beta
          git reset --hard origin/beta
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0018.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          hits=[e for e in d['entries'] if e.get('archiveId')=='opo0708a']
          assert len(hits)==1
          e=hits[0]
          assert e.get('displayName')=='Star Cluster', e.get('displayName')
          e['displayName']='Galaxy Cluster'
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          rm -f .github/workflows/temp-fix-catalog-0018-one-label.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Catalog 0018: correct galaxy-cluster label'
          git pull --rebase origin beta
          git push origin HEAD:beta
