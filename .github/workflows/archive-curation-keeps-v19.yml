name: Archive Curated KEEP Previews V19

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/archive-curation-keeps-v19.yml'

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
      - name: Download official AstroPix previews for KEEP selections
        shell: bash
        run: |
          python -m pip install --quiet requests
          python <<'PY'
          import json, hashlib, mimetypes, pathlib, requests, time

          ROOT=pathlib.Path('viewer/image-databases/master-database/curation')
          master=json.loads((ROOT/'gv-curation-master-0001.json').read_text())
          keep=master['providers']['astropix:spitzer']['KEEP']
          feed_url='https://www.astropix.org/d2d/913.json'
          s=requests.Session(); s.headers['User-Agent']='GalaxyViewer-CurationArchive/1.0'
          feed=s.get(feed_url,timeout=60); feed.raise_for_status(); data=feed.json()
          records={str(r.get('ID','')).strip().lower():r for r in data.get('Collections',[])}
          out=ROOT/'selected-previews'/'astropix-spitzer'; out.mkdir(parents=True,exist_ok=True)
          manifest=[]; missing=[]; failed=[]

          def image_resource(rec, kind='thumbnail'):
              found=[]
              for asset in rec.get('Assets') or []:
                  for r in asset.get('Resources') or []:
                      if str(r.get('MediaType','')).lower()!='image' or not r.get('URL'): continue
                      found.append(r)
              preferred=[r for r in found if str(r.get('ResourceType','')).lower()==kind]
              return (preferred or found or [None])[0]

          def facilities(rec):
              vals=[]
              for k in ('Facility','Facilities'):
                  v=rec.get(k)
                  if isinstance(v,str): vals.append(v)
                  elif isinstance(v,list): vals.extend(str(x) for x in v)
              # AstroPix AVM commonly stores facilities under Observation.Facility.
              obs=rec.get('Observation') or {}
              v=obs.get('Facility') if isinstance(obs,dict) else None
              if isinstance(v,str): vals.append(v)
              elif isinstance(v,list): vals.extend(str(x) for x in v)
              return sorted(set(x.strip() for x in vals if x and x.strip()))

          for rid in keep:
              rec=records.get(rid.lower())
              if not rec:
                  missing.append(rid); continue
              res=image_resource(rec,'thumbnail')
              if not res:
                  failed.append({'id':rid,'error':'no image resource'}); continue
              url=str(res['URL'])
              try:
                  q=s.get(url,timeout=(10,35)); q.raise_for_status()
                  if not (q.headers.get('content-type','').lower().startswith('image/')):
                      raise RuntimeError('not image content')
                  ext=pathlib.Path(url.split('?',1)[0]).suffix.lower()
                  if ext not in ('.jpg','.jpeg','.png','.webp','.gif'): ext='.jpg'
                  path=out/f'{rid}{ext}'
                  path.write_bytes(q.content)
                  subj=rec.get('Subject') or {}
                  manifest.append({
                    'id':rid,
                    'title':rec.get('Title') or rid,
                    'previewPath':str(path),
                    'previewUrl':url,
                    'previewBytes':len(q.content),
                    'previewSha256':hashlib.sha256(q.content).hexdigest(),
                    'sourceUrl':rec.get('ReferenceURL') or f'https://www.astropix.org/image/spitzer/{rid}',
                    'facilities':facilities(rec),
                    'categories':list(subj.get('Category') or []) if isinstance(subj,dict) else [],
                    'names':list(subj.get('Name') or []) if isinstance(subj,dict) else []
                  })
              except Exception as e:
                  failed.append({'id':rid,'url':url,'error':repr(e)})

          result={
            'schema':'gv-curation-selected-previews',
            'version':'0001',
            'provider':'AstroPix',
            'collection':'Spitzer',
            'sourceMaster':'../../gv-curation-master-0001.json',
            'requestedKeepCount':len(keep),
            'archivedPreviewCount':len(manifest),
            'missingFromOfficialFeedCount':len(missing),
            'failedDownloadCount':len(failed),
            'missingFromOfficialFeed':missing,
            'failedDownloads':failed,
            'records':manifest
          }
          (out/'manifest-0001.json').write_text(json.dumps(result,indent=2,ensure_ascii=False))
          print(json.dumps({k:result[k] for k in ('requestedKeepCount','archivedPreviewCount','missingFromOfficialFeedCount','failedDownloadCount')},indent=2))
          if len(manifest)<100:
              raise SystemExit('Refusing unexpectedly small KEEP archive')
          PY
      - name: Commit preview archive
        shell: bash
        run: |
          git config user.name 'Galaxy Viewer Curator'
          git config user.email 'actions@users.noreply.github.com'
          git add viewer/image-databases/master-database/curation/selected-previews
          if git diff --cached --quiet; then
            echo 'No preview changes'
            exit 0
          fi
          git commit -m '[skip ci] Archive curated KEEP previews from Spitzer v19'
          git push origin HEAD:beta
