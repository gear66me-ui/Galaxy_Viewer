name: Repair ESO 440-11 AVM runtime distance and redshift
# The repair step validates persisted JSON after writing with real newline terminators.

on:
  push:
    branches: [release]
    paths:
      - .github/workflows/repair-eso440-11-runtime-catalog-0004.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-eso440-11-runtime-catalog-0004
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Repair and verify ESO 440-11 runtime record
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path

          RUNTIME = Path("viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json")
          DISTANCE_MAP = Path("viewer/image-databases/master-database/avm-metadata/avm-runtime-distance-map-0004.csv")
          REVIEW = Path("viewer/image-databases/master-database/avm-metadata/AVM-METADATA-GEMINI-NED-SIMBAD/Galaxy_Viewer_v0004a_Distance_Review_Workbook.csv")
          PROVIDER = "noirlab"
          ARCHIVE_ID = "noirlab2325g"
          OBJECT = "ESO 440-11"
          DISTANCE_MLY = 75.0
          REDSHIFT_Z = 0.006492
          REDSHIFT_SOURCE = "SIMBAD ESO 440-11 (MCG-05-28-007), 2004MNRAS.350.1195M; heliocentric z(emission)=0.006492; https://simbad.u-strasbg.fr/simbad/sim-id?Ident=ESO+440-11"
          DISTANCE_SOURCE = "Published object page supplied for ESO 440-11: 75 million light-years; corroborating distance entry in the review workbook includes 75.016 Mly."

          for path in (RUNTIME, DISTANCE_MAP, REVIEW):
              if not path.is_file():
                  raise SystemExit(f"STOP: required file is missing: {path}")

          runtime = json.loads(RUNTIME.read_text(encoding="utf-8"))
          matches = [
              r for r in runtime.get("records", [])
              if str(r.get("providerKey", "")).strip().lower() == PROVIDER
              and str(r.get("archiveId", "")).strip().lower() == ARCHIVE_ID
          ]
          name_matches = [
              r for r in runtime.get("records", [])
              if str(r.get("name", "")).strip().casefold() == OBJECT.casefold()
          ]
          if len(matches) != 1:
              raise SystemExit(f"STOP: expected exactly one runtime record for {PROVIDER}/{ARCHIVE_ID}; found {len(matches)}")
          if len(name_matches) != 1:
              raise SystemExit(f"STOP: expected exactly one runtime name match for {OBJECT}; found {len(name_matches)}")

          record = matches[0]
          record.update({
              "distanceMly": DISTANCE_MLY,
              "redshift": REDSHIFT_Z,
              "distanceMethod": "published_object_distance_75_Mly",
              "distanceSource": DISTANCE_SOURCE,
              "redshiftMethod": "SIMBAD_2004MNRAS_350_1195M_heliocentric_emission_redshift",
              "redshiftSource": REDSHIFT_SOURCE,
              "redshiftFrame": "heliocentric"
          })

          with DISTANCE_MAP.open("r", encoding="utf-8", newline="") as f:
              map_rows = list(csv.reader(f))
          map_matches = [
              row for row in map_rows
              if len(row) >= 4 and row[1].strip().lower() == PROVIDER
              and row[2].strip().lower() == ARCHIVE_ID
          ]
          if len(map_matches) != 1:
              raise SystemExit(f"STOP: expected exactly one distance-map row; found {len(map_matches)}")
          map_matches[0][3] = "75"
          with DISTANCE_MAP.open("w", encoding="utf-8", newline="") as f:
              csv.writer(f, lineterminator="\n").writerows(map_rows)

          with REVIEW.open("r", encoding="utf-8", newline="") as f:
              review_rows = list(csv.reader(f))
          review_matches = [
              row for row in review_rows
              if len(row) >= 5 and row[1].strip().lower() == PROVIDER
              and row[2].strip().lower() == ARCHIVE_ID
              and row[3].strip().casefold() == OBJECT.casefold()
          ]
          if len(review_matches) != 1:
              raise SystemExit(f"STOP: expected exactly one review-workbook row; found {len(review_matches)}")
          review_matches[0][4] = "75"
          with REVIEW.open("w", encoding="utf-8", newline="") as f:
              csv.writer(f, lineterminator="\n").writerows(review_rows)

          RUNTIME.write_text(json.dumps(runtime, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          # Verify the saved artifacts, including uniqueness and exact requested values.
          runtime_check = json.loads(RUNTIME.read_text(encoding="utf-8"))
          final_matches = [
              r for r in runtime_check["records"]
              if str(r.get("providerKey", "")).strip().lower() == PROVIDER
              and str(r.get("archiveId", "")).strip().lower() == ARCHIVE_ID
          ]
          assert len(final_matches) == 1
          assert float(final_matches[0]["distanceMly"]) == DISTANCE_MLY
          assert abs(float(final_matches[0]["redshift"]) - REDSHIFT_Z) < 1e-12
          with DISTANCE_MAP.open("r", encoding="utf-8", newline="") as f:
              final_map = list(csv.reader(f))
          assert sum(1 for row in final_map if len(row) >= 4 and row[1].strip().lower() == PROVIDER and row[2].strip().lower() == ARCHIVE_ID and row[3].strip() == "75") == 1
          with REVIEW.open("r", encoding="utf-8", newline="") as f:
              final_review = list(csv.reader(f))
          assert sum(1 for row in final_review if len(row) >= 5 and row[1].strip().lower() == PROVIDER and row[2].strip().lower() == ARCHIVE_ID and row[3].strip().casefold() == OBJECT.casefold() and row[4].strip() == "75") == 1

          report = {
              "object": OBJECT,
              "providerKey": PROVIDER,
              "archiveId": ARCHIVE_ID,
              "distanceMly": DISTANCE_MLY,
              "redshiftHeliocentric": REDSHIFT_Z,
              "runtimeMatches": len(final_matches),
              "runtimeNameMatches": sum(1 for r in runtime_check["records"] if str(r.get("name", "")).strip().casefold() == OBJECT.casefold()),
              "distanceMapRowsUpdated": 1,
              "reviewRowsUpdated": 1,
              "redshiftSource": REDSHIFT_SOURCE,
              "distanceSource": DISTANCE_SOURCE,
              "updatedFiles": [str(RUNTIME), str(DISTANCE_MAP), str(REVIEW)]
          }
          Path("eso440-11-runtime-repair-report.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY

      - name: Validate changed data
        run: |
          python3 -m json.tool viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json >/dev/null
          git diff --check

      - name: Commit runtime catalog correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json viewer/image-databases/master-database/avm-metadata/avm-runtime-distance-map-0004.csv viewer/image-databases/master-database/avm-metadata/AVM-METADATA-GEMINI-NED-SIMBAD/Galaxy_Viewer_v0004a_Distance_Review_Workbook.csv
          git diff --cached --check
          git commit -m "Correct ESO 440-11 runtime distance and redshift"
          git push origin HEAD:release

      - name: Upload repair report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eso440-11-runtime-repair-report
          path: eso440-11-runtime-repair-report.json
          if-no-files-found: warn
