name: Build Galaxy Viewer 10F Surgical
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/build-galaxy-viewer-10f-surgical.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 1
      - name: Inspect exact native SIZE construction
        shell: bash
        run: |
          set -euo pipefail
          M='viewer/modules/gv-random-galaxy-0030.js'
          echo '--- SIZE occurrences ---'
          grep -n -C 4 'SIZE' "$M" || true
          echo '--- formatPhysicalSize call sites ---'
          grep -n -C 3 'formatPhysicalSize' "$M" || true
          echo '--- travelToRandom definition/export tail ---'
          grep -n -C 3 'travelToRandom' "$M" | head -120 || true
