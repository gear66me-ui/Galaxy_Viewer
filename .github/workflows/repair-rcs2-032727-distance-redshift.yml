name: Repair RCS2 032727-132623 Distance and Redshift

on:
  push:
    branches:
      - release
    paths:
      - ".github/workflows/repair-rcs2-032727-distance-redshift.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Correct the Hubble catalog and runtime JSON
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          files = [
              Path("viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json"),
              Path("viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json"),
          ]
          TARGET_NAMES = {"RCS2 032727-132623", "RCSGA 032727-132609"}
          TARGET_ARCHIVE = "opo1208b"
          Z_CLUSTER = 0.5637
          # Flat Lambda-CDM, H0=67.6 km/s/Mpc, Omega_m=0.315.
          # Store comoving radial distance, explicitly calculated from the foreground cluster redshift.
          H0, OM, C = 67.6, 0.315, 299792.458
          n = 20000
          dz = Z_CLUSTER / n
          integral = 0.0
          for i in range(n + 1):
              z = i * dz
              e = math.sqrt(OM * (1 + z)**3 + (1 - OM))
              weight = 1 if i in (0, n) else (4 if i % 2 else 2)
              integral += weight / e
          dc_mpc = (C / H0) * dz * integral / 3
          distance_mly = dc_mpc * 3.261563777
          distance_bly = distance_mly / 1000

          def walk(node):
              if isinstance(node, dict):
                  yield node
                  for value in node.values():
                      yield from walk(value)
              elif isinstance(node, list):
                  for value in node:
                      yield from walk(value)

          total_matches = 0
          for path in files:
              if not path.exists():
                  raise SystemExit(f"Required catalog missing: {path}")
              data = json.loads(path.read_text(encoding="utf-8"))
              all_dicts = list(walk(data))
              matches = []
              for rec in all_dicts:
                  name = str(rec.get("name", rec.get("objectName", rec.get("designation", "")))).strip()
                  archive = str(rec.get("archiveId", rec.get("archiveID", rec.get("id", "")))).strip()
                  searchable = " ".join(str(v) for v in rec.values() if isinstance(v, (str, int, float)))
                  if archive == TARGET_ARCHIVE or ("RCS2 032727-132623" in searchable and "opo1208b" in searchable):
                      matches.append(rec)
                  elif name in TARGET_NAMES and ("hubble" in searchable.lower() or "opo1208b" in searchable):
                      matches.append(rec)
              # De-duplicate dict references while preserving order.
              unique = []
              seen = set()
              for rec in matches:
                  if id(rec) not in seen:
                      unique.append(rec); seen.add(id(rec))
              if not unique:
                  raise SystemExit(f"No RCS2 032727-132623 / opo1208b record found in {path}")

              changed = 0
              for rec in unique:
                  # This Hubble image represents the foreground cluster (z=0.5637), not the lensed background source (z=1.7009).
                  for key in list(rec.keys()):
                      lk = key.lower().replace("_", "").replace("-", "")
                      if "redshift" in lk or lk in {"z", "redshiftz", "zred"}:
                          rec[key] = Z_CLUSTER
                          changed += 1
                      elif "distance" in lk:
                          if "bly" in lk or "billion" in lk:
                              rec[key] = round(distance_bly, 6)
                              changed += 1
                          elif "ly" in lk and "mly" not in lk and "million" not in lk:
                              rec[key] = round(distance_mly * 1_000_000, 3)
                              changed += 1
                          else:
                              # Catalog convention: numeric distance in millions of light-years (Mly).
                              rec[key] = round(distance_mly, 3)
                              changed += 1
                      elif lk in {"distancemly", "distancemillionlightyears", "sciencedistancemly"}:
                          rec[key] = round(distance_mly, 3)
                          changed += 1
                  # Also repair common nested science metadata fields.
                  for container_key in ("science", "metadata", "avm", "cosmology"):
                      sub = rec.get(container_key)
                      if isinstance(sub, dict):
                          for key in list(sub.keys()):
                              lk = key.lower().replace("_", "").replace("-", "")
                              if "redshift" in lk or lk in {"z", "redshiftz", "zred"}:
                                  sub[key] = Z_CLUSTER; changed += 1
                              elif "distancemly" in lk or "distancemillionlightyears" in lk:
                                  sub[key] = round(distance_mly, 3); changed += 1
                              elif "distancebly" in lk or "distancebillionlightyears" in lk:
                                  sub[key] = round(distance_bly, 6); changed += 1
              total_matches += len(unique)
              print(f"{path}: matched {len(unique)} record(s), updated {changed} fields")

              # Validate the target record contains no z=100 and no 547,083 Mly distance.
              for rec in unique:
                  for key, value in rec.items():
                      lk = key.lower().replace("_", "").replace("-", "")
                      if ("redshift" in lk or lk in {"z", "redshiftz", "zred"}) and isinstance(value, (int, float)) and abs(value - Z_CLUSTER) > 1e-6:
                          raise SystemExit(f"Redshift validation failed in {path}: {key}={value}")
                      if "distancemly" in lk and isinstance(value, (int, float)) and value > 100000:
                          raise SystemExit(f"Distance validation failed in {path}: {key}={value}")
              path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          if total_matches < 2:
              raise SystemExit(f"Expected matches in both catalog files; total matches={total_matches}")
          print(f"Correct foreground-cluster redshift: z={Z_CLUSTER}")
          print(f"Flat Lambda-CDM comoving radial distance: {distance_bly:.4f} billion light-years ({distance_mly:.1f} Mly)")
          print("Note: background lensed galaxy has a separate redshift z=1.7009.")
          PY

      - name: Validate JSON and commit
        run: |
          python -m json.tool viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json >/dev/null
          python -m json.tool viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json >/dev/null
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json
          if git diff --cached --quiet; then
            echo "No catalog changes were needed."
          else
            git commit -m "Correct RCS2 032727-132623 redshift and distance"
            git push origin HEAD:release
          fi
