name: TEMP GV200 JSON WCS UI Fix 0066

on:
  push:
    branches: [ beta ]
    paths:
      - '.github/workflows/temp-gv200-json-wcs-ui-fix-0066.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
      - name: Patch viewer JSON-WCS image and diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re, subprocess

          p = Path('viewer/GV-beta-200-001.py')
          s = p.read_text(encoding='utf-8')
          before = s

          def one(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1, found {n}')
              s = s.replace(old, new)

          one("const GV200001_BUILD='0065';", "const GV200001_BUILD='0066';", 'build')

          # Make diagnostic panels readable: left JSON catalog only, right live Aladin only.
          old_strip = "Object.assign(gvDiagnosticStrip.style,{position:'absolute',left:'8px',right:'8px',bottom:'96px',zIndex:'7313',padding:'6px 8px',borderRadius:'6px',background:'rgba(0,0,0,.78)',color:'#9eefff',font:'9px/1.25 monospace',overflowWrap:'anywhere',pointerEvents:'none',display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px'});"
          new_strip = "Object.assign(gvDiagnosticStrip.style,{position:'absolute',left:'8px',right:'8px',bottom:'92px',zIndex:'7313',padding:'8px 10px',borderRadius:'8px',background:'rgba(0,0,0,.80)',color:'#dff8ff',font:'10px/1.35 monospace',overflowWrap:'normal',pointerEvents:'none',display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px',boxShadow:'0 0 14px rgba(88,191,255,.18)'});"
          one(old_strip, new_strip, 'diagnostic strip style')

          old_color = "function gvColorLine(label,value,color){const row=document.createElement('div');const key=document.createElement('span'),val=document.createElement('span');key.textContent=label;val.textContent=value;key.style.color=val.style.color=color;row.append(key,val);return row}\nfunction gvSetDiagnostic(el,rows){el.replaceChildren(...rows)}"
          new_color = "function gvColorLine(label,value,color){const row=document.createElement('div');const key=document.createElement('span'),val=document.createElement('span');Object.assign(row.style,{display:'grid',gridTemplateColumns:'92px 1fr',gap:'8px',alignItems:'baseline'});key.textContent=label;val.textContent=value;key.style.color=color;val.style.color='#ffffff';key.style.opacity='.92';val.style.fontWeight='600';row.append(key,val);return row}\nfunction gvPanelTitle(text){const row=document.createElement('div');row.textContent=text;Object.assign(row.style,{color:'#7CCBFF',fontWeight:'700',letterSpacing:'.5px',marginBottom:'3px',textTransform:'uppercase'});return row}\nfunction gvSetDiagnostic(el,rows){el.replaceChildren(...rows)}\nfunction gvFmt(v,d=6){const n=Number(v);return Number.isFinite(n)?n.toFixed(d):'?'}"
          one(old_color, new_color, 'diagnostic row helpers')

          old_publish = "function gvPublishCatalogWcs(destination,record,wcs){gvSetDiagnostic(gvAvmDiagnostic,[gvColorLine('JSON RUNTIME WCS (AUTHORITATIVE)','','#fff'),gvColorLine('IMAGE: ',directHdUrl(destination),'#39e7ff'),gvColorLine('AUTHORITY: ',String(record?.authority||'RUNTIME_JSON'),'#ffe45c'),gvColorLine('CRVAL RA/DEC: ',String(record?.ra)+'  '+String(record?.dec),'#ff5b5b'),gvColorLine('FOV X/Y: ',String(record?.fovXDegrees)+'  '+String(record?.fovYDegrees),'#5ca9ff'),gvColorLine('CRPIX X/Y: ',gvWcsValue(wcs,'CRPIX1')+'  '+gvWcsValue(wcs,'CRPIX2'),'#fff'),gvColorLine('NAXIS X/Y: ',gvWcsValue(wcs,'NAXIS1')+'  '+gvWcsValue(wcs,'NAXIS2'),'#fff'),gvColorLine('CDELT X/Y: ',gvWcsValue(wcs,'CDELT1')+'  '+gvWcsValue(wcs,'CDELT2'),'#fff'),gvColorLine('CATALOG ROTATION: ',String(record?.aladinRotation??record?.spatialRotationDeg),'#62ff72')])}\nfunction gvPublishDiagnostic(destination){gvAvmDiagnostic.textContent='JSON RUNTIME WCS — WAITING FOR CATALOG\\nIMAGE: '+directHdUrl(destination)}\nfunction gvPublishLiveAladin(){let r=[],f=[],rot='?',p='?',frame='?',survey='?';try{r=aladin.getRaDec?.()||[]}catch(_){}try{f=aladin.getFov?.()||[]}catch(_){}try{rot=aladin.getRotation?.()??'?'}catch(_){}try{p=aladin.getProjectionName?.()??aladin.getProjection?.()?.name??aladin.view?.projection?.name??'?'}catch(_){}try{frame=aladin.getFrame?.()??aladin.view?.cooFrame??'?'}catch(_){}try{const x=aladin.getBaseImageLayer?.();survey=x?.name??x?.id??x?.url??'?'}catch(_){}const q=v=>Number.isFinite(Number(v))?Number(v).toFixed(8):'?';gvSetDiagnostic(gvLiveDiagnostic,[gvColorLine('ALADIN LIVE (100 ms)','','#fff'),gvColorLine('RA/DEC: ',q(r[0])+'  '+q(r[1]),'#ff5b5b'),gvColorLine('FOV X/Y: ',q(f[0])+'  '+q(f[1]),'#5ca9ff'),gvColorLine('ROTATION: ',q(rot)+'°','#62ff72'),gvColorLine('PROJECTION: ',String(p),'#ffe45c'),gvColorLine('SURVEY / FRAME: ',String(survey)+' / '+String(frame),'#fff')])}"
          new_publish = "function gvPublishCatalogWcs(destination,record,wcs){gvSetDiagnostic(gvAvmDiagnostic,[gvPanelTitle('JSON CATALOG'),gvColorLine('Galaxy',String(record?.name||destination?.name||record?.archiveId||'?'),'#7CCBFF'),gvColorLine('RA',gvFmt(record?.ra,8),'#ff8b8b'),gvColorLine('Dec',gvFmt(record?.dec,8),'#ff8b8b'),gvColorLine('Rotation',gvFmt(record?.aladinRotation??record?.spatialRotationDeg,4)+'°','#62ff72'),gvColorLine('FoV X',gvFmt(record?.fovXDegrees??record?.fovDegrees,8)+'°','#5ca9ff'),gvColorLine('FoV Y',gvFmt(record?.fovYDegrees??record?.fovDegrees,8)+'°','#5ca9ff')])}\nfunction gvPublishDiagnostic(destination){gvSetDiagnostic(gvAvmDiagnostic,[gvPanelTitle('JSON CATALOG'),gvColorLine('Galaxy',String(destination?.name||destination?.archiveId||destination?.id||'?'),'#7CCBFF'),gvColorLine('Status','loading catalog record','#ffe45c')])}\nfunction gvReadAladinRaDec(){let v=null;try{v=aladin.getRaDec?.()}catch(_){}if(Array.isArray(v))return [v[0],v[1]];if(v&&typeof v==='object')return [v.ra??v.RA??v.lon??v.lng??v[0],v.dec??v.DE??v.lat??v[1]];for(const c of [aladin.view?.center,aladin.view?.viewCenter,aladin.view?.cooCenter,aladin.view?.radec]){if(Array.isArray(c))return [c[0],c[1]];if(c&&typeof c==='object')return [c.ra??c.RA??c.lon??c.lng??c.x,c.dec??c.DE??c.lat??c.y]}return []}\nfunction gvReadAladinFov(){let v=null;try{v=aladin.getFov?.()}catch(_){}if(Array.isArray(v))return v;if(Number.isFinite(Number(v)))return [v,v];try{const f=aladin.view?.fov;if(Array.isArray(f))return f;if(Number.isFinite(Number(f)))return [f,f]}catch(_){}return []}\nfunction gvPublishLiveAladin(){let r=gvReadAladinRaDec(),f=gvReadAladinFov(),rot='?',p='?',frame='?';try{rot=aladin.getRotation?.()??aladin.view?.rotation??'?'}catch(_){}try{p=aladin.getProjectionName?.()??aladin.getProjection?.()?.name??aladin.view?.projection?.name??'?'}catch(_){}try{frame=aladin.getFrame?.()??aladin.view?.cooFrame??'?'}catch(_){}gvSetDiagnostic(gvLiveDiagnostic,[gvPanelTitle('ALADIN LIVE'),gvColorLine('RA',gvFmt(r[0],8),'#ff8b8b'),gvColorLine('Dec',gvFmt(r[1],8),'#ff8b8b'),gvColorLine('Rotation',gvFmt(rot,4)+'°','#62ff72'),gvColorLine('FoV X',gvFmt(f[0],8)+'°','#5ca9ff'),gvColorLine('FoV Y',gvFmt(f[1]??f[0],8)+'°','#5ca9ff'),gvColorLine('Projection',String(p),'#ffe45c'),gvColorLine('Frame',String(frame),'#ffffff')])}"
          one(old_publish, new_publish, 'diagnostic publishers')

          # Clean JPEG from canvas: no copied image metadata, but Aladin gets a format it already displays.
          one("const blob=await new Promise((resolve,reject)=>canvas.toBlob(value=>value?resolve(value):reject(new Error('VIGNETTE PNG ENCODE FAILED')),'image/png'));", "const blob=await new Promise((resolve,reject)=>canvas.toBlob(value=>value?resolve(value):reject(new Error('DISPLAY JPEG ENCODE FAILED')),'image/jpeg',.96));", 'canvas output')
          one("imgFormat:'png',", "imgFormat:'jpeg',", 'Aladin image format')

          # Publish JSON panel as soon as catalog record is found, before raster fetch can fail.
          old_load_head = "const [record,raster]=await Promise.all([gvRuntimeAvmRecord(destination),makeVignetteBlob(url)]);\n        if(directHdDestination!==destination)return false;"
          new_load_head = "const record=await gvRuntimeAvmRecord(destination);\n        const ra=Number(record.ra),dec=Number(record.dec);\n        const fovX=Number(record.fovXDegrees??record.fovDegrees);\n        const rotation=Number(record.aladinRotation??record.spatialRotationDeg);\n        const previewWcs={CRVAL1:ra,CRVAL2:dec,NAXIS1:'?',NAXIS2:'?',CRPIX1:'?',CRPIX2:'?',CDELT1:'?',CDELT2:'?'};\n        gvPublishCatalogWcs(destination,record,previewWcs);\n        const raster=await makeVignetteBlob(url);\n        if(directHdDestination!==destination)return false;"
          one(old_load_head, new_load_head, 'load record before raster')

          # Remove duplicate consts inside load block now declared before raster.
          one("const ra=Number(record.ra),dec=Number(record.dec);\n        const fovX=Number(record.fovXDegrees??record.fovDegrees);\n        const rotation=Number(record.aladinRotation??record.spatialRotationDeg);\n        aladin.setProjection('TAN');", "aladin.setProjection('TAN');", 'remove duplicate load consts')

          # Preserve the route view while raster loads, but use exact JSON when record is ready.
          one("aladin.setFoV(v.fov/0.80);", "aladin.setFoV(v.fov);", 'showDestination exact fov')

          p.write_text(s, encoding='utf-8')

          ptr = Path('viewer/gv-current-viewer.json')
          j = json.loads(ptr.read_text(encoding='utf-8'))
          j['build'] = '0066'
          ptr.write_text(json.dumps(j, indent=2, separators=(',', ': '))+'\n', encoding='utf-8')

          forbidden = ['jpegApp1Segments','makePreAladinDiagnosticJpeg','APP1 METADATA','AVM/XMP','DIRECT_HD_AVM_DECODER','gvPublishDecodedAvm',"imgFormat:'png'"]
          for marker in forbidden:
              if marker in s:
                  raise SystemExit(f'forbidden marker remains: {marker}')
          required = ["const GV200001_BUILD='0066';","imgFormat:'jpeg'","gvPublishCatalogWcs(destination,record,previewWcs)","gvReadAladinRaDec","gvReadAladinFov","aladin.setFoV(fovX);","aladin.setFoV(v.fov);"]
          for marker in required:
              if marker not in s:
                  raise SystemExit(f'required marker missing: {marker}')

          print('PATCH_OK')
          print('viewer_lines', len(s.splitlines()))
          print('viewer_chars', len(s))
          print('delta_chars', len(s)-len(before))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/GV-beta-200-001.py viewer/gv-current-viewer.json
          git commit -m 'GV200-001: restore clean JPEG display and formatted JSON diagnostics (build 0066)'
          git push origin beta
