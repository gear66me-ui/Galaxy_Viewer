name: Build Galaxy Viewer DEV 0057 WebKit 1.12 APK 0011 Double Buffer
# DEV 0057: APK 0011 double-buffers provider WebViews so a new galaxy preloads off-screen and atomically replaces the old site. Side-by-side package; production untouched.

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/build-galaxy-viewer-dev.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install launcher tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Generate current 0057 hosted shell + tablet fixes
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/galaxy-viewer-dev
          GOLD=e180f2d651a94f7e64497e07d8bc732c459ff276
          rm -rf "$ROOT"
          mkdir -p "$ROOT/app/src/main/java/com/gear66me/galaxyviewer/lab"
          mkdir -p "$ROOT/app/src/main/res/drawable" "$ROOT/app/src/main/res/mipmap-anydpi-v26" "$ROOT/app/src/main/res/values" "$ROOT/app/src/main/res/values-v31"

          cat > "$ROOT/settings.gradle" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='GalaxyViewer'
          include ':app'
          EOF

          cat > "$ROOT/build.gradle" <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF

          cat > "$ROOT/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > "$ROOT/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.gear66me.galaxyviewer.lab'
            compileSdk 36
            defaultConfig {
              applicationId 'com.gear66me.galaxyviewer.lab'
              minSdk 29
              targetSdk 36
              versionCode 66
              versionName 'APK-0011-DEV-0057-WEBKIT112-9'
            }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
          EOF

          # Android launcher artwork only. Galaxy Viewer stays hosted and follows the current launch/pointers.
          test -s viewer/artwork/app_icon_4.png
          cp viewer/artwork/app_icon_4.png "$ROOT/app/src/main/res/drawable/app_icon_4.png"
          cat > "$ROOT/app/src/main/res/drawable/transparent_splash_icon.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <solid android:color="#00000000"/>
            <size android:width="1dp" android:height="1dp"/>
          </shape>
          XML
          cat > "$ROOT/app/src/main/res/drawable/gv_launcher_background.xml" <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="#000000"/></shape>
          EOF
          cat > "$ROOT/app/src/main/res/drawable/gv_launcher_foreground.xml" <<'EOF'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:gravity="center" android:width="66dp" android:height="66dp"><bitmap android:src="@drawable/app_icon_4" android:gravity="fill"/></item></layer-list>
          EOF
          cat > "$ROOT/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/gv_launcher_background"/><foreground android:drawable="@drawable/gv_launcher_foreground"/></adaptive-icon>
          EOF
          cp "$ROOT/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" "$ROOT/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml"
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"; px="${spec##*:}"; mkdir -p "$ROOT/app/src/main/res/mipmap-${density}"
            convert viewer/artwork/app_icon_4.png -resize "${px}x${px}" "$ROOT/app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp "$ROOT/app/src/main/res/mipmap-${density}/ic_launcher.png" "$ROOT/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done

          cat > "$ROOT/app/src/main/res/values/styles.xml" <<'EOF'
          <resources>
            <style name="GalaxyViewerTheme" parent="@android:style/Theme.Material.NoActionBar">
              <item name="android:windowBackground">#000000</item>
              <item name="android:navigationBarColor">#000000</item>
              <item name="android:statusBarColor">#000000</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowLightNavigationBar">false</item>
            </style>
          </resources>
          EOF
          cat > "$ROOT/app/src/main/res/values-v31/styles.xml" <<'EOF'
          <resources>
            <style name="GalaxyViewerTheme" parent="@android:style/Theme.Material.NoActionBar">
              <item name="android:windowBackground">#000000</item>
              <item name="android:windowSplashScreenBackground">#000000</item>
              <item name="android:windowSplashScreenAnimatedIcon">@drawable/transparent_splash_icon</item>
              <item name="android:windowSplashScreenAnimationDuration">0</item>
              <item name="android:navigationBarColor">#000000</item>
              <item name="android:statusBarColor">#000000</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowLightNavigationBar">false</item>
            </style>
          </resources>
          EOF

          cat > "$ROOT/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:allowBackup="false" android:hardwareAccelerated="true"
              android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"
              android:label="Galaxy Viewer DEV 57 W112" android:theme="@style/GalaxyViewerTheme"
              android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity"
                android:configChanges="keyboardHidden|orientation|screenSize|smallestScreenSize|screenLayout"
                android:exported="true" android:screenOrientation="portrait">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          # Freeze the current Browser 0057 source for this DEV experiment.
          git fetch origin beta --no-tags
          git show "$GOLD:android/galaxy-viewer-web-browser/app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java" > "$ROOT/app/src/main/java/com/gear66me/galaxyviewer/lab/MainActivity.java"
          sed -i 's/package com\.gear66me\.galaxyviewer\.webbrowser;/package com.gear66me.galaxyviewer.lab;/' "$ROOT/app/src/main/java/com/gear66me/galaxyviewer/lab/MainActivity.java"

          MAIN="$ROOT/app/src/main/java/com/gear66me/galaxyviewer/lab/MainActivity.java"

          # DEV 0011: double-buffered provider handoff; old provider remains visible until the staged provider commits.
          # When the hosted top shell reloads after a prewarmed provider is already ready, immediately repopulate its browser state.
          python - "$MAIN" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()

          # Tablet lifetime / resize support.
          needle="import android.content.Intent;\n"
          assert needle in s
          s=s.replace(needle, needle+"import android.content.res.Configuration;\n", 1)
          old='  @Override public void onWindowFocusChanged(boolean h){super.onWindowFocusChanged(h);if(h)immersive();}\n'
          assert old in s
          s=s.replace(old,old+'  @Override public void onConfigurationChanged(Configuration c){super.onConfigurationChanged(c);immersive();if(top!=null)top.post(this::fitTopShell);}\n',1)

          # Cookie persistence + provider load error callback.
          needle='import android.webkit.WebView;\n'
          assert needle in s
          s=s.replace(needle,needle+'import android.webkit.CookieManager;\nimport android.webkit.WebResourceError;\n',1)

          # APK 0011 uses ordinary WebView loading into a hidden staging card, not speculative-prerender APIs.
          for line in [
              'import androidx.webkit.WebViewCompat;\n',
              'import androidx.webkit.WebViewFeature;\n',
              'import androidx.webkit.PrerenderOperationCallback;\n',
              'import androidx.webkit.PrerenderException;\n',
          ]:
              assert line in s
              s=s.replace(line,'',1)

          # Resync hosted browser chrome whenever its top shell reloads.
          old='          fitTopShell();\n        }\n      }\n    }); return v;\n'
          assert old in s
          new='          fitTopShell();\n          if(browserMode)syncShell();\n        }\n      }\n    }); return v;\n'
          s=s.replace(old,new,1)

          # Two provider cards: web = currently visible provider, warmWeb = hidden next provider.
          old='  private WebView top, web, bottom, viewerWeb;\n'
          assert old in s
          s=s.replace(old,'  private WebView top, web, warmWeb, bottom, viewerWeb;\n',1)

          old='  private String providerIcon="", sourceUrl="", pendingProviderUrl="", pendingProviderIcon="", providerHomeUrl="", prewarmedUrl="";\n'
          assert old in s
          new=('  private String providerIcon="", sourceUrl="", pendingProviderUrl="", pendingProviderIcon="", providerHomeUrl="";\n'
               '  private String warmRequestedUrl="", warmCommittedUrl="", warmProviderIcon="";\n'
               '  private boolean warmLoading=false, warmReady=false;\n')
          s=s.replace(old,new,1)

          # Create both provider cards. The warm card is always underneath/transparent until promoted.
          old='    top=shell(); web=provider(); bottom=shell();\n'
          assert old in s
          s=s.replace(old,'    top=shell(); web=provider(); warmWeb=provider(); bottom=shell();\n',1)

          old=('    web.setBackgroundColor(Color.TRANSPARENT);\n'
               '    FrameLayout.LayoutParams wp=new FrameLayout.LayoutParams(-1,-1); wp.setMargins(dp(2),dp(2),dp(2),dp(2));\n'
               '    GradientDrawable webClip=new GradientDrawable(); webClip.setColor(Color.TRANSPARENT); webClip.setCornerRadius(dp(8)); web.setBackground(webClip); web.setOutlineProvider(ViewOutlineProvider.BACKGROUND); web.setClipToOutline(true);\n'
               '    frame.addView(web,wp);\n')
          assert old in s
          new=('    web.setBackgroundColor(Color.TRANSPARENT); warmWeb.setBackgroundColor(Color.TRANSPARENT);\n'
               '    FrameLayout.LayoutParams wp=new FrameLayout.LayoutParams(-1,-1); wp.setMargins(dp(2),dp(2),dp(2),dp(2));\n'
               '    FrameLayout.LayoutParams wwp=new FrameLayout.LayoutParams(-1,-1); wwp.setMargins(dp(2),dp(2),dp(2),dp(2));\n'
               '    GradientDrawable webClip=new GradientDrawable(); webClip.setColor(Color.TRANSPARENT); webClip.setCornerRadius(dp(8)); web.setBackground(webClip); web.setOutlineProvider(ViewOutlineProvider.BACKGROUND); web.setClipToOutline(true);\n'
               '    GradientDrawable warmClip=new GradientDrawable(); warmClip.setColor(Color.TRANSPARENT); warmClip.setCornerRadius(dp(8)); warmWeb.setBackground(warmClip); warmWeb.setOutlineProvider(ViewOutlineProvider.BACKGROUND); warmWeb.setClipToOutline(true);\n'
               '    warmWeb.setAlpha(0f); frame.addView(warmWeb,wwp); frame.addView(web,wp);\n')
          s=s.replace(old,new,1)

          # Remove only the temporary red 57 TEST badge.
          badge_start=s.index('    TextView test57=new TextView(this);')
          badge_end=s.index('    LinearLayout.LayoutParams fp=',badge_start)
          assert badge_start>=0 and badge_end>badge_start
          s=s[:badge_start]+s[badge_end:]

          # Provider cookie persistence applies to both provider cards.
          old='    WebView v=new WebView(this); WebSettings s=v.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true);\n    s.setDatabaseEnabled(true); s.setUseWideViewPort(true); s.setLoadWithOverviewMode(false); s.setSupportZoom(true);\n'
          assert old in s
          new='    WebView v=new WebView(this); WebSettings s=v.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true);\n    CookieManager.getInstance().setAcceptCookie(true); CookieManager.getInstance().setAcceptThirdPartyCookies(v,true);\n    s.setDatabaseEnabled(true); s.setUseWideViewPort(true); s.setLoadWithOverviewMode(false); s.setSupportZoom(true);\n'
          s=s.replace(old,new,1)

          old='        WebView popup=new WebView(MainActivity.this); WebSettings ps=popup.getSettings(); ps.setJavaScriptEnabled(true); ps.setDomStorageEnabled(true); ps.setSupportZoom(true); ps.setBuiltInZoomControls(true); ps.setDisplayZoomControls(false);\n'
          assert old in s
          new='        WebView popup=new WebView(MainActivity.this); WebSettings ps=popup.getSettings(); ps.setJavaScriptEnabled(true); ps.setDomStorageEnabled(true); CookieManager.getInstance().setAcceptThirdPartyCookies(popup,true); ps.setSupportZoom(true); ps.setBuiltInZoomControls(true); ps.setDisplayZoomControls(false);\n'
          s=s.replace(old,new,1)

          # Provider callbacks distinguish the visible card from the hidden staging card.
          old='      @Override public void onPageFinished(WebView view,String url){ if(browserMode){ if(clearProviderEntryHistory){ web.clearHistory(); clearProviderEntryHistory=false; } sourceUrl=url; syncShell(); } }\n'
          assert old in s
          new=('      @Override public void onPageCommitVisible(WebView view,String url){ if(view==warmWeb)markWarmReady(view,url); }\n'
               '      @Override public void onReceivedError(WebView view,WebResourceRequest request,WebResourceError error){ if(view==warmWeb&&warmLoading&&request!=null&&request.isForMainFrame()){warmLoading=false;warmReady=false;warmCommittedUrl="";} }\n'
               '      @Override public void onPageFinished(WebView view,String url){ CookieManager.getInstance().flush(); if(view==warmWeb)markWarmReady(view,url); if(view==web&&browserMode){ if(clearProviderEntryHistory){ web.clearHistory(); clearProviderEntryHistory=false; } sourceUrl=url; syncShell(); } }\n')
          s=s.replace(old,new,1)

          # Flush cookies when leaving foreground.
          old='  @Override public void onWindowFocusChanged(boolean h){super.onWindowFocusChanged(h);if(h)immersive();}\n'
          assert old in s
          s=s.replace(old,old+'  @Override protected void onPause(){CookieManager.getInstance().flush();super.onPause();}\n',1)

          # Normal app launch only; landing-time provider warming comes from GVNative.prewarm().
          old='    if(launchUrl!=null&&launchPrewarm(getIntent())){ prewarmProvider(launchUrl); moveTaskToBack(true); }\n    else { launchGalaxyViewer(); if(launchUrl!=null){ openProvider(launchUrl,launchProviderIcon(getIntent())); } }\n'
          assert old in s
          s=s.replace(old,'    launchGalaxyViewer(); if(launchUrl!=null){ openProvider(launchUrl,launchProviderIcon(getIntent())); }\n',1)

          # Replace the old single-WebView prewarm with a true two-card staging system.
          start=s.index('  private boolean launchPrewarm(Intent intent){')
          end=s.index('  private String launchProviderIcon(Intent intent){',start)
          assert start>=0 and end>start
          replacement=r'''  private boolean validProviderPage(WebView v){
            if(v==null)return false; String u=v.getUrl(); return u!=null&&!u.isEmpty()&&!"about:blank".equals(u);
          }
          private void showBrowserLayer(){
            if(browserLayer!=null){browserLayer.setVisibility(View.VISIBLE);browserLayer.bringToFront();}
            if(web!=null){web.setAlpha(1f);web.bringToFront();web.requestFocus();}
            immersive();
          }
          private void markWarmReady(WebView view,String url){
            if(view!=warmWeb||!warmLoading||url==null||url.isEmpty()||"about:blank".equals(url))return;
            String current=view.getUrl();
            if(current==null||!url.equals(current))return;
            warmCommittedUrl=url; warmLoading=false; warmReady=true;
            if(browserMode&&!pendingProviderUrl.isEmpty()&&pendingProviderUrl.equals(warmRequestedUrl)){
              activateWarmProvider();
            }
          }
          private void activateWarmProvider(){
            if(!warmReady||warmWeb==null)return;
            WebView oldVisible=web;
            web=warmWeb;
            warmWeb=oldVisible;
            web.setAlpha(1f); web.bringToFront();
            warmWeb.setAlpha(0f);
            sourceUrl=warmCommittedUrl.isEmpty()?warmRequestedUrl:warmCommittedUrl;
            providerHomeUrl=warmRequestedUrl;
            providerIcon=warmProviderIcon;
            pendingProviderUrl=""; pendingProviderIcon="";
            warmRequestedUrl=""; warmCommittedUrl=""; warmProviderIcon="";
            warmLoading=false; warmReady=false;
            clearProviderEntryHistory=true;
            try{web.clearHistory();}catch(Exception ignored){}
            clearProviderEntryHistory=false;
            syncShell();
            if(browserMode)showBrowserLayer();
          }
          private void prewarmProvider(String u){
            if(u==null||!u.startsWith("https://"))return;
            if(u.equals(warmRequestedUrl)&&(warmLoading||warmReady))return;
            warmRequestedUrl=u; warmCommittedUrl=""; warmProviderIcon=""; warmReady=false; warmLoading=true;
            if(warmWeb!=null){warmWeb.setAlpha(0f);warmWeb.loadUrl(u);}
          }
'''
          s=s[:start]+replacement+s[end:]

          # Pointer/config fetch now refreshes browser chrome only.
          # It must never inject Browser-0026's default Spitzer source into either provider card.
          start=s.index('  private void fetchPointer(){')
          end=s.index('  private boolean validProviderPage(WebView v){',start)
          assert start>=0 and end>start
          replacement=r'''  private void fetchPointer(){
            new Thread(()->{try{
              long t=System.currentTimeMillis();
              JSONObject p=getJson(POINTER+"?gv="+t);
              String config=p.getString("config");
              JSONObject c=getJson(config+(config.contains("?")?"&":"?")+"gv="+t);
              String th=c.getString("topShell"), bh=c.getString("bottomShell");
              runOnUiThread(()->{
                top.loadUrl(th+(th.contains("?")?"&":"?")+"gv="+System.currentTimeMillis());
                bottom.loadUrl(bh+(bh.contains("?")?"&":"?")+"gv="+System.currentTimeMillis());
                if(browserMode)syncShell();
              });
            }catch(Exception e){ runOnUiThread(()->top.loadData("<h3>Galaxy Viewer Browser config error</h3><pre>"+esc(e.toString())+"</pre>","text/html","UTF-8")); }}).start();
          }
'''
          s=s[:start]+replacement+s[end:]

          # Atomic handoff policy:
          # - if the staged target is ready, swap immediately;
          # - if it is still loading, show the previous provider rather than black;
          # - if this is the first provider and no old page exists, keep the viewer visible until staging commits.
          old=("    if(browserLayer!=null)browserLayer.setVisibility(View.INVISIBLE);\n"
               "    if(web!=null&&!(u.equals(prewarmedUrl)&&u.equals(web.getUrl())))web.loadUrl(u);\n"
               "    fetchPointer();\n"
               "    new Handler(Looper.getMainLooper()).postDelayed(()->{if(browserMode&&browserLayer!=null){browserLayer.setVisibility(View.VISIBLE);immersive();}},4000);\n")
          assert old in s
          new=("    pendingProviderUrl=u; pendingProviderIcon=icon==null?\"\":icon;\n"
               "    if(!u.equals(warmRequestedUrl)){prewarmProvider(u);}\n"
               "    warmProviderIcon=pendingProviderIcon;\n"
               "    fetchPointer();\n"
               "    if(u.equals(warmRequestedUrl)&&warmReady){activateWarmProvider();}\n"
               "    else if(validProviderPage(web)){showBrowserLayer();}\n"
               "    else if(browserLayer!=null){browserLayer.setVisibility(View.GONE);}\n")
          s=s.replace(old,new,1)

          # openProvider must not overwrite the visible page metadata before the staged page is promoted.
          old='    browserMode=true; clearProviderEntryHistory=true; pendingProviderUrl=u; pendingProviderIcon=icon==null?"":icon; providerIcon=pendingProviderIcon; sourceUrl=u; providerHomeUrl=u;\n'
          assert old in s
          s=s.replace(old,'    browserMode=true; clearProviderEntryHistory=false;\n',1)

          # New intents open directly; no launch-time prerender mode.
          old='  @Override protected void onNewIntent(Intent intent){ super.onNewIntent(intent); setIntent(intent); String u=launchSourceUrl(intent); if(u!=null){ if(launchPrewarm(intent)){prewarmProvider(u);moveTaskToBack(true);}else openProvider(u,launchProviderIcon(intent)); } }\n'
          assert old in s
          s=s.replace(old,'  @Override protected void onNewIntent(Intent intent){ super.onNewIntent(intent); setIntent(intent); String u=launchSourceUrl(intent); if(u!=null)openProvider(u,launchProviderIcon(intent)); }\n',1)

          # Android Back returns to the already-running viewer; it never cold-launches it.
          old='  @Override public void onBackPressed(){if(browserMode){escapeToFreshViewer();}else{launchGalaxyViewer();}}\n'
          assert old in s
          s=s.replace(old,'  @Override public void onBackPressed(){if(browserMode){returnToViewer();}else{moveTaskToBack(true);}}\n',1)

          p.write_text(s)
          PY

          # Nanoscopic gates: APK 0011 double-buffered handoff + 1.12.1 + landing-only native WebView prewarm.
          grep -q 'GalaxyViewerWebBrowser/0057' "$MAIN"
          grep -q 'https://gear66me-ui.github.io/Galaxy_Viewer/viewer/releases/launch/Galaxy-Viewer-Launch/index.html?gv=' "$MAIN"
          grep -q 'https://gear66me-ui.github.io/Galaxy_Viewer/viewer/Web-Browser/web-browser-current.json' "$MAIN"
          grep -q 'private WebView top, web, warmWeb, bottom, viewerWeb;' "$MAIN"
          grep -q 'warmWeb=provider()' "$MAIN"
          grep -q 'private void markWarmReady(WebView view,String url)' "$MAIN"
          grep -q 'private void activateWarmProvider()' "$MAIN"
          grep -q 'private void prewarmProvider(String u)' "$MAIN"
          grep -q 'if(u.equals(warmRequestedUrl)&&warmReady){activateWarmProvider();}' "$MAIN"
          grep -q 'else if(validProviderPage(web)){showBrowserLayer();}' "$MAIN"
          grep -q 'warmWeb.setAlpha(0f)' "$MAIN"
          grep -q 'web=warmWeb' "$MAIN"
          grep -q 'warmWeb=oldVisible' "$MAIN"
          grep -q 'view==warmWeb' "$MAIN"
          grep -q 'if(view==web&&browserMode)' "$MAIN"
          grep -q 'viewerWeb.addJavascriptInterface(new ViewerBridge(),"GVNative")' "$MAIN"
          grep -q '@JavascriptInterface public void prewarm(String url)' "$MAIN"
          grep -q 'if(browserMode)syncShell();' "$MAIN"
          grep -q 'if(browserMode){returnToViewer();}else{moveTaskToBack(true);}' "$MAIN"
          grep -q 'onConfigurationChanged(Configuration c)' "$MAIN"
          grep -q 'CookieManager.getInstance().flush();' "$MAIN"
          grep -q 'setAcceptThirdPartyCookies(v,true)' "$MAIN"
          grep -q "androidx.webkit:webkit:1.12.1" "$ROOT/app/build.gradle"
          ! grep -q 'launchPrewarm' "$MAIN"
          ! grep -q 'WebViewCompat' "$MAIN"
          ! grep -q 'PrerenderOperationCallback' "$MAIN"
          ! grep -q 'prewarmedUrl' "$MAIN"
          ! grep -q 'postDelayed(()->{if(browserMode&&browserLayer!=null)' "$MAIN"
          ! grep -q 'if(web.getUrl()==null||web.getUrl().isEmpty()||"about:blank".equals(web.getUrl())) web.loadUrl(sourceUrl);' "$MAIN"
          ! grep -q '57 TEST' "$MAIN"
          ! grep -q 'test57' "$MAIN"
          test ! -e "$ROOT/app/src/main/assets/index.html"
          test ! -e "$ROOT/app/src/main/assets/rc-payload.js"

      - name: Build DEV 0057 APK
        run: gradle --no-daemon -p /tmp/galaxy-viewer-dev :app:assembleRelease

      - name: Sign DEV 0057 APK
        shell: bash
        env:
          GV_UPLOAD_KEYSTORE_BASE64: ${{ secrets.GALAXY_VIEWER_UPLOAD_KEYSTORE }}
          GV_UPLOAD_STORE_PASSWORD: ${{ secrets.GALAXY_VIEWER_UPLOAD_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE=/tmp/galaxy-viewer-upload.jks
          test -n "$GV_UPLOAD_KEYSTORE_BASE64"
          test -n "$GV_UPLOAD_STORE_PASSWORD"
          printf '%s' "$GV_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          APK_UNSIGNED=/tmp/galaxy-viewer-dev/app/build/outputs/apk/release/app-release-unsigned.apk
          APK=Galaxy-Viewer-DEV-0057-WEBKIT112-0011.apk
          test -s "$APK_UNSIGNED"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$APK_UNSIGNED" /tmp/app-release-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$KEYSTORE" --ks-key-alias galaxyviewer-upload --ks-pass env:GV_UPLOAD_STORE_PASSWORD --key-pass env:GV_UPLOAD_STORE_PASSWORD --out "$APK" /tmp/app-release-aligned.apk
