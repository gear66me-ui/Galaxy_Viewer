name: AR40 Random Hotfix
on:
  push:
    branches: [beta]
    paths: ['.github/ar40-trigger']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: beta}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build AR40
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          r=Path('viewer/modules/random-galaxy/gv-random-galaxy-0112.js').read_text()
          r=r.replace("const VERSION='0112';","const VERSION='0113';",1)
          old="this.#setStatus(`ARRIVED ${destination.name.toUpperCase()}`);\n        if (this.randomButton) this.randomButton.disabled = true;"
          new="this.#setStatus(`ARRIVED ${destination.name.toUpperCase()}`);\n        if (this.randomButton) this.randomButton.disabled = false;"
          if old not in r: raise SystemExit('arrival button anchor missing')
          r=r.replace(old,new,1)
          Path('viewer/modules/random-galaxy/gv-random-galaxy-0113.js').write_text(r)
          p=Path('viewer/GV-beta-0012AR-39.py').read_text()
          for a,b in [('12AR-39','12AR-40'),('gv-random-galaxy-0112.js','gv-random-galaxy-0113.js'),("RANDOM_GALAXY_VERSION='0112'","RANDOM_GALAXY_VERSION='0113'")]: p=p.replace(a,b)
          Path('viewer/GV-beta-0012AR-40.py').write_text(p)
          Path('viewer/gv-current-viewer.json').write_text(json.dumps({'version':'12AR-40.py','viewer':'GV-beta-0012AR-40.py'},indent=2)+'\n')
          PY
          node --check viewer/modules/random-galaxy/gv-random-galaxy-0113.js
          python -m py_compile viewer/GV-beta-0012AR-40.py
          grep -q "VERSION='0113'" viewer/modules/random-galaxy/gv-random-galaxy-0113.js
          grep -q "randomButton.disabled = false" viewer/modules/random-galaxy/gv-random-galaxy-0113.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/modules/random-galaxy/gv-random-galaxy-0113.js viewer/GV-beta-0012AR-40.py viewer/gv-current-viewer.json
          git commit -m 'AR40 fix Random button release after arrival'
          git push origin beta
