name: AR45 Temporary Registered Runner
on:
  push:
    branches: [beta]
    paths: ['.github/ar40-trigger']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: beta}
      - name: Run AR45 builder payload
        run: |
          python - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/ar45-reticle-build.yml').read_text()
          marker="          python - <<'PY'\n"
          if marker not in wf:
              raise SystemExit('AR45 builder Python marker missing')
          raw=wf.split(marker,1)[1].split("\n          PY",1)[0]
          block='\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines())
          exec(block,{'__name__':'__main__'})
          PY
          python -m py_compile viewer/GV-beta-0012AR-45.py
          git diff --check
          grep -q "const VERSION='12AR-45';" viewer/GV-beta-0012AR-45.py
          grep -q "function readCelestialNorthBearing" viewer/GV-beta-0012AR-45.py
          grep -q "function readEarthBearing" viewer/GV-beta-0012AR-45.py
          grep -q "northLabel.textContent='N'" viewer/GV-beta-0012AR-45.py
          grep -q "earthIcon.textContent='🌎'" viewer/GV-beta-0012AR-45.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/GV-beta-0012AR-45.py
          git commit -m 'AR45 full AR41 baseline with ICRSd and cosmic directional reticle'
          git push origin beta