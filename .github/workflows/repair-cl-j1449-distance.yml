name: Repair CL J1449+0856 Distance
on:
  workflow_dispatch:
  push:
    branches: [release]
permissions:
  contents: write
jobs:
  repair-distance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 1
      - name: Repair every release runtime-catalog copy
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          aliases = {"clj14490856", "clgj14490856", "clg14490856", "ann1105a"}
          identifier_keys = {
              "designation", "name", "title", "id", "object", "objectname",
              "target", "pseudonym", "nickname", "identifier", "displayname",
              "commonname", "common_name", "archiveid", "archive_id"
          }

          def norm(value):
              return "".join(ch.lower() for ch in str(value) if ch.isalnum())

          def walk(node, trail="$"):
              if isinstance(node, dict):
                  yield trail, node
                  for key, value in node.items():
                      yield from walk(value, f"{trail}.{key}")
              elif isinstance(node, list):
                  for i, value in enumerate(node):
                      yield from walk(value, f"{trail}[{i}]")

          found = []
          parsed = 0
          for path in Path("viewer/image-databases").rglob("*.json"):
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  parsed += 1
              except Exception:
                  continue
              for trail, record in walk(data):
                  values = [value for key, value in record.items()
                            if key.lower() in identifier_keys
                            and isinstance(value, (str, int, float))]
                  if any(norm(value) in aliases for value in values):
                      found.append((path, trail, record, data))

          unique_files = {str(item[0]) for item in found}
          print("JSON FILES PARSED:", parsed)
          print("MATCHES:", len(found))
          print("DISTINCT MATCHING FILES:", sorted(unique_files))
          for path, trail, record, _ in found:
              print("FOUND:", path, trail, "keys=", sorted(record.keys()))

          if len(found) != 3 or len(unique_files) != 3:
              raise SystemExit(
                  "STOP: expected exactly one CL J1449+0856 record in each of three runtime catalogs; "
                  "no files changed."
              )

          changed = {}
          for path, trail, record, data in found:
              # Runtime catalog records are flattened and do not have a science object.
              # Set both flattened runtime fields and the canonical science fields.
              science = record.get("science")
              if not isinstance(science, dict):
                  science = {}
                  record["science"] = science
              science["distanceMly"] = 10240
              science["distanceDisplay"] = "10.24 billion light-years"
              record["distanceMly"] = 10240
              record["distance_mly"] = 10240
              record["distanceDisplay"] = "10.24 billion light-years"
              record["distance"] = "10.24 billion light-years"
              changed[path] = data

          for path, data in changed.items():
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                              encoding="utf-8")
              reread = json.loads(path.read_text(encoding="utf-8"))
              matches = [obj for _, obj in walk(reread)
                         if norm(obj.get("archiveId", "")) == "ann1105a"
                         or norm(obj.get("designation", "")) == "clj14490856"
                         or norm(obj.get("name", "")) == "clj14490856"]
              if len(matches) != 1:
                  raise SystemExit(f"STOP: verification found {len(matches)} target records in {path}.")
              record = matches[0]
              science = record.get("science") or {}
              if (record.get("distanceMly") != 10240
                      or record.get("distance_mly") != 10240
                      or record.get("distanceDisplay") != "10.24 billion light-years"
                      or record.get("distance") != "10.24 billion light-years"
                      or science.get("distanceMly") != 10240
                      or science.get("distanceDisplay") != "10.24 billion light-years"):
                  raise SystemExit(f"STOP: distance verification failed in {path}.")
              print("VERIFIED:", path, "distanceMly=10240", "display=10.24 billion light-years")
          print("RESULT: all three runtime catalog copies repaired and verified.")
          PY
      - name: Validate and commit only changed catalog data
        shell: bash
        run: |
          git diff --check
          git add -u -- '*.json'
          git diff --cached --quiet && { echo "No catalog change detected"; exit 1; }
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Fix CL J1449+0856 distance in runtime catalogs"
          git push origin HEAD:release
