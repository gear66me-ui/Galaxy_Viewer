name: Repair CL J1449+0856 Distance
on:
  workflow_dispatch:
  push:
    branches: [release]
    paths:
      - ".github/workflows/repair-cl-j1449-distance.yml"
permissions:
  contents: write
jobs:
  repair-distance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 1
      - name: Inject destination-banner distance
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          aliases = {"clj14490856", "clgj14490856", "clg14490856", "ann1105a"}

          def norm(value):
              return "".join(ch.lower() for ch in str(value) if ch.isalnum())

          def walk(node, trail="$"):
              if isinstance(node, dict):
                  yield trail, node
                  for key, value in node.items():
                      yield from walk(value, f"{trail}.{key}")
              elif isinstance(node, list):
                  for i, value in enumerate(node):
                      yield from walk(value, f"{trail}[{i}]")

          matches = []
          seen = set()
          identifier_keys = (
              "designation", "name", "title", "id", "object", "objectName",
              "target", "pseudonym", "nickname", "identifier", "displayName",
              "commonName", "common_name"
          )
          for trail, obj in walk(data):
              values = [obj.get(k) for k in identifier_keys if obj.get(k) is not None]
              if any(norm(v) in aliases for v in values):
                  if id(obj) not in seen:
                      seen.add(id(obj))
                      matches.append((trail, obj))

          if len(matches) != 1:
              print(f"CATALOG CHECK: expected exactly one CL J1449+0856 record; found {len(matches)}")
              for trail, obj in matches:
                  print("candidate:", trail, {k: obj.get(k) for k in identifier_keys if obj.get(k) is not None})
              raise SystemExit("No catalog changes made; record must be uniquely identified.")

          trail, record = matches[0]
          science = record.get("science")
          if not isinstance(science, dict):
              raise SystemExit(f"Record at {trail} has no science object; refusing an unsafe schema change.")

          # Store in the catalog's canonical unit: millions of light-years.
          science["distanceMly"] = 10240
          science["distanceDisplay"] = "10.24 billion light-years"
          if "distanceMly" in record:
              record["distanceMly"] = 10240
          if "distance_mly" in record:
              record["distance_mly"] = 10240
          if "distance" in record:
              record["distance"] = "10.24 billion light-years"
          if "distanceDisplay" in record:
              record["distanceDisplay"] = "10.24 billion light-years"

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("VERIFIED TARGET:", trail)
          print("VERIFIED science.distanceMly:", science["distanceMly"])
          print("VERIFIED science.distanceDisplay:", science["distanceDisplay"])
          PY
      - name: Validate and commit only the catalog
        shell: bash
        run: |
          git diff --check
          git add viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json
          git diff --cached --quiet && { echo "No catalog change detected"; exit 1; }
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Fix CL J1449+0856 destination distance to 10.24 billion ly"
          git push origin HEAD:release
