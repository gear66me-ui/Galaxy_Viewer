name: Repair CL J1449+0856 Distance
on:
  workflow_dispatch:
  push:
    branches: [release]
    paths:
      - ".github/workflows/repair-cl-j1449-distance.yml"
permissions:
  contents: write
jobs:
  repair-distance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0
      - name: Repair Hubble source record and synchronize runtime copies
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          TARGET_MLY = 10240
          TARGET_DISPLAY = "10.24 billion light-years"
          source = Path("viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json")
          runtime_files = [
              Path("viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0001.json"),
              Path("viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0002.json"),
              Path("viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0003.json"),
          ]

          def record_bounds(text, marker_pattern):
              marker = re.search(marker_pattern, text)
              if not marker:
                  raise SystemExit(f"STOP: target marker not found: {marker_pattern}")
              stack, in_string, escaped = [], False, False
              for i, ch in enumerate(text[:marker.start()]):
                  if in_string:
                      if escaped: escaped = False
                      elif ch == "\\\\": escaped = True
                      elif ch == '"': in_string = False
                  else:
                      if ch == '"': in_string = True
                      elif ch == "{": stack.append(i)
                      elif ch == "}" and stack: stack.pop()
              if not stack:
                  raise SystemExit("STOP: could not locate containing JSON object.")
              start = stack[-1]
              depth, in_string, escaped = 0, False, False
              for i in range(start, len(text)):
                  ch = text[i]
                  if in_string:
                      if escaped: escaped = False
                      elif ch == "\\\\": escaped = True
                      elif ch == '"': in_string = False
                  else:
                      if ch == '"': in_string = True
                      elif ch == "{": depth += 1
                      elif ch == "}":
                          depth -= 1
                          if depth == 0: return start, i + 1
              raise SystemExit("STOP: unterminated target JSON object.")

          def patch_one(path, marker_pattern, kind):
              original = path.read_text(encoding="utf-8")
              start, end = record_bounds(original, marker_pattern)
              record_text = original[start:end]
              record = json.loads(record_text)
              if kind == "hubble":
                  if record.get("designation") != "CL J1449+0856":
                      raise SystemExit("STOP: Hubble marker matched an unexpected record.")
              else:
                  if record.get("archiveId") != "ann1105a" or record.get("name") != "CL J1449+0856":
                      raise SystemExit("STOP: runtime marker matched an unexpected record.")

              science = record.get("science")
              if not isinstance(science, dict):
                  science = {}
                  record["science"] = science
              science["distanceMly"] = TARGET_MLY
              science["distanceDisplay"] = TARGET_DISPLAY
              record["distanceMly"] = TARGET_MLY
              record["distance_mly"] = TARGET_MLY
              record["distanceDisplay"] = TARGET_DISPLAY
              record["distance"] = TARGET_DISPLAY

              line_start = original.rfind("\\n", 0, start) + 1
              base_indent = len(original[line_start:start])
              first_child = re.search(r"\\n([ \\t]+)\\S", record_text)
              unit = (len(first_child.group(1)) - base_indent) if first_child else 2
              if unit <= 0: unit = 2
              rendered = json.dumps(record, ensure_ascii=False, indent=unit)
              lines = rendered.splitlines()
              rendered = lines[0] + "".join("\\n" + (" " * base_indent) + line for line in lines[1:])
              updated = original[:start] + rendered + original[end:]
              parsed = json.loads(updated)

              def walk(node):
                  if isinstance(node, dict):
                      if kind == "hubble" and node.get("designation") == "CL J1449+0856":
                          yield node
                      if kind == "runtime" and node.get("archiveId") == "ann1105a":
                          yield node
                      for value in node.values(): yield from walk(value)
                  elif isinstance(node, list):
                      for value in node: yield from walk(value)

              hits = list(walk(parsed))
              if len(hits) != 1:
                  raise SystemExit(f"STOP: expected exactly one {kind} record, found {len(hits)}")
              result = hits[0]
              sci = result.get("science") or {}
              assert sci.get("distanceMly") == TARGET_MLY
              assert sci.get("distanceDisplay") == TARGET_DISPLAY
              assert result.get("distanceMly") == TARGET_MLY
              assert result.get("distance_mly") == TARGET_MLY
              assert result.get("distanceDisplay") == TARGET_DISPLAY
              assert result.get("distance") == TARGET_DISPLAY
              path.write_text(updated, encoding="utf-8")
              print(f"VERIFIED {kind}: {path} -> {TARGET_MLY} Mly / {TARGET_DISPLAY}")

          # The canonical source is repaired first and is the required acceptance check.
          patch_one(source, r'"designation"\\s*:\\s*"CL J1449\\+0856"', "hubble")
          for path in runtime_files:
              patch_one(path, r'"archiveId"\\s*:\\s*"ann1105a"', "runtime")

          print("SUCCESS: Hubble source record and all three runtime copies are corrected.")
          PY
      - name: Validate and commit only these catalog files
        shell: bash
        run: |
          git diff --check
          git add -- viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0001.json viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0002.json viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0003.json
          if git diff --cached --quiet; then
            echo "All target records already have the verified values."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Fix CL J1449+0856 distance in Hubble source catalog"
          git push origin HEAD:release
