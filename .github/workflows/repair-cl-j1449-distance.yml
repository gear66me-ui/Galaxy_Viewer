name: Repair CL J1449+0856 Distance
on:
  workflow_dispatch:
  push:
    branches: [release]
    paths:
      - ".github/workflows/repair-cl-j1449-distance.yml"
permissions:
  contents: write
jobs:
  repair-distance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 1
      - name: Find and repair the actual release record
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          aliases = {"clj14490856", "clgj14490856", "clg14490856", "ann1105a"}
          identifier_keys = {
              "designation", "name", "title", "id", "object", "objectname",
              "target", "pseudonym", "nickname", "identifier", "displayname",
              "commonname", "common_name", "archiveid", "archive_id"
          }

          def norm(value):
              return "".join(ch.lower() for ch in str(value) if ch.isalnum())

          def walk(node, trail="$"):
              if isinstance(node, dict):
                  yield trail, node
                  for key, value in node.items():
                      yield from walk(value, f"{trail}.{key}")
              elif isinstance(node, list):
                  for i, value in enumerate(node):
                      yield from walk(value, f"{trail}[{i}]")

          matches = []
          parsed = 0
          for path in Path(".").rglob("*.json"):
              if any(part in {".git", "node_modules"} for part in path.parts):
                  continue
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  parsed += 1
              except Exception:
                  continue
              for trail, obj in walk(data):
                  values = [value for key, value in obj.items()
                            if key.lower() in identifier_keys
                            and isinstance(value, (str, int, float))]
                  if any(norm(value) in aliases for value in values):
                      matches.append((path, trail, obj, data))

          print("JSON FILES PARSED:", parsed)
          print("MATCHING RECORDS ACROSS RELEASE:", len(matches))
          for path, trail, record, _ in matches:
              print("CANDIDATE:", path, trail,
                    {k: v for k, v in record.items()
                     if k.lower() in identifier_keys and isinstance(v, (str, int, float))})

          if len(matches) != 1:
              raise SystemExit(
                  "STOP: expected exactly one CL J1449+0856/ann1105a record across release; "
                  f"found {len(matches)}. No files changed."
              )

          path, trail, record, data = matches[0]
          science = record.get("science")
          if not isinstance(science, dict):
              raise SystemExit(f"STOP: record at {path}:{trail} has no science object.")

          science["distanceMly"] = 10240
          science["distanceDisplay"] = "10.24 billion light-years"
          if "distanceMly" in record:
              record["distanceMly"] = 10240
          if "distance_mly" in record:
              record["distance_mly"] = 10240
          if "distance" in record:
              record["distance"] = "10.24 billion light-years"
          if "distanceDisplay" in record:
              record["distanceDisplay"] = "10.24 billion light-years"

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                          encoding="utf-8")
          check = json.loads(path.read_text(encoding="utf-8"))
          verified = [obj for _, obj in walk(check)
                      if obj.get("designation") == record.get("designation")
                      and isinstance(obj.get("science"), dict)]
          if len(verified) != 1 or verified[0]["science"].get("distanceMly") != 10240:
              raise SystemExit("STOP: post-write verification failed.")
          print("PATCHED FILE:", path)
          print("VERIFIED RECORD:", record.get("designation") or record.get("name"))
          print("VERIFIED science.distanceMly:", science["distanceMly"])
          print("VERIFIED science.distanceDisplay:", science["distanceDisplay"])
          PY
      - name: Validate and commit only changed catalog data
        shell: bash
        run: |
          git diff --check
          git add -u -- '*.json'
          git diff --cached --quiet && { echo "No catalog change detected"; exit 1; }
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Fix CL J1449+0856 destination distance to 10.24 billion ly"
          git push origin HEAD:release
