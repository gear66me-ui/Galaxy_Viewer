          echo "CHANDRA REGISTRATION GATE STATIC PAGE READY"


      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: galaxy-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Remove orphaned GitHub Pages deployment record
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stale="009dd51fd7f8229c7831c53770a1e6eedcade890"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments"
          echo "Looking for orphaned deployment record for SHA ${stale}"
          code=$(curl -sS -o /tmp/deployments.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" "${api}?per_page=100")
          if [[ "${code}" != "200" ]]; then
            cat /tmp/deployments.json
            echo "Cannot list deployment records (HTTP ${code})."
            exit 1
          fi
          ids=$(jq -r --arg stale "${stale}" '.[] | select(.sha == $stale) | .id' /tmp/deployments.json)
          if [[ -z "${ids}" ]]; then
            echo "No orphaned deployment record remains for stale SHA ${stale}; cleanup is already complete."
            jq -r '.[] | [.id,.sha,.environment,.created_at] | @tsv' /tmp/deployments.json | sed -n '1,30p'
            exit 0
          fi
          while IFS= read -r id; do
            [[ -n "${id}" ]] || continue
            echo "Marking deployment ${id} inactive"
            status_code=$(curl -sS -o /tmp/deployment-status.json -w '%{http_code}' -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              -d '{"state":"inactive","description":"Clear orphaned Pages deployment lock"}' \
              "${api}/${id}/statuses")
            if [[ "${status_code}" != "201" ]]; then
              cat /tmp/deployment-status.json
              echo "Could not mark deployment ${id} inactive (HTTP ${status_code})."
              exit 1
            fi
            delete_code=$(curl -sS -o /tmp/deployment-delete.json -w '%{http_code}' -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" "${api}/${id}")
            if [[ "${delete_code}" != "204" ]]; then
              cat /tmp/deployment-delete.json
              echo "Could not delete orphaned deployment ${id} (HTTP ${delete_code})."
              exit 1
            fi
            echo "Deleted orphaned deployment ${id} for SHA ${stale}."
          done <<< "${ids}"
          echo "Orphaned deployment record cleanup complete."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: galaxy-pages-${{ github.run_id }}-${{ github.run_attempt }}

