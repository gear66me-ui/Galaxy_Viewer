name: Deploy GitHub Pages

# Production Pages runner plus an isolated temporary-review bypass.
# Normal pushes still validate the release runtime. Changes scoped only to the
# Chandra review site bypass RC/build/pointer validation so the review can be
# published independently of Galaxy Viewer production state.
on:
  push:
    branches:
      - release
  # PRODUCTION FROZEN after this restoration: manual dispatch remains available. Restoration trigger is temporary.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  deployments: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages-release
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Detect isolated Chandra review deployment
        id: scope
        shell: bash
        env:
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          echo "review_only=false" >> "$GITHUB_OUTPUT"
          echo "workflow_only=false" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_EVENT_NAME}" != "push" ]]; then
            exit 0
          fi

          # Bootstrap isolated static-site deployments without coupling them
          # to the production viewer validation gate.
          if [[ "${HEAD_MESSAGE}" == CHANDRA\ REVIEW* ]]; then
            echo "review_only=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(jq -r '.[] | (.added[]?, .modified[]?, .removed[]?)' <<< "${COMMITS_JSON}" | sort -u)"
          if [[ -z "${files}" ]]; then
            exit 0
          fi

          # Workflow-only commits do not change the deployed site.
          if ! grep -Ev '^\.github/workflows/' <<< "${files}" | grep -q .; then
            echo "workflow_only=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! grep -Ev '^(temporary-demos/chandra-avm-candidate-review-|galaxy-viewer/)' <<< "${files}" | grep -q .; then
            echo "review_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release site
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 1

      - name: Verify production release isolation
        if: ${{ steps.scope.outputs.review_only != 'true' && steps.scope.outputs.workflow_only != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,pathlib

          root=pathlib.Path('.')
          viewer=json.loads((root/'viewer/gv-current-viewer.json').read_text())
          pointer=json.loads((root/'viewer/Web-Browser/web-browser-current.json').read_text())
          manifest=json.loads((root/'release-manifest.json').read_text())
          avm=json.loads((root/'viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0003.json').read_text())
          rc_path=root/'viewer'/str(viewer.get('viewer',''))
          rc=rc_path.read_text()
          active_build=str(viewer.get('build',''))

          assert viewer.get('version')=='RC-V1.0.0.8'
          assert re.fullmatch(r'\d{4}',str(viewer.get('build',''))), 'viewer build must be four digits'
          assert viewer.get('viewer')==f"RC-V1.0.0.8-BLD-{viewer.get('build')}.py", 'pointer filename must match active build'
          assert manifest.get('build')==viewer.get('build')
          assert manifest.get('sourceBranch')=='release'
          assert manifest.get('release')==viewer.get('version')
          assert re.fullmatch(r'[0-9a-f]{40}',str(manifest.get('sourceCommit',''))), 'manifest sourceCommit must be a full commit SHA'
          assert manifest.get('dependencyPins')==["10ae327ec7ab126627cc1e482e27828075bbf4f4","1732aa60a871e16d71df4700aed75d9085c6b8c5","e637e98e674ebbf6ca97d2a955b92d6beb24ecde","9ad02b64b0c10e09938ad8276109f2a61a0229cc","d85d91201ea52aa6524a62394fc81b450b15ac23","e197403c8525b90f21c95967f11ab0bd01c3d0c4","f7740afe20a1dccd0e58644e8c154f4e6396ed83"]
          assert pointer.get('version')=='0026' and pointer.get('config')=='https://gear66me-ui.github.io/Galaxy_Viewer/viewer/Web-Browser/Web-Browser-0026/config.json', 'web-browser pointer must reference the active Web-Browser-0026 config independently of the RC build'
          assert avm.get('sourceBranch')=='release'
          assert 'Galaxy_Viewer@release/' not in rc
          assert 'gv-galaxy-navigator-013.js' in rc
          assert 'gv-destination-presentation-0054.js' in rc
          assert "host.addEventListener('touchmove',userChangedView,capturePassive)" in rc, 'Earth-distance must observe Android touchmove in capture phase'
          assert 'gvEarthDistanceSyncPending=true;' in rc, 'Earth-distance refreshes must queue while catalog lookup is busy'
          assert f"const GV200001_BUILD='{viewer.get('build')}';" in rc, 'runtime cache-busting build identity must match pointer'
          assert "GalaxyDestinationPresentation?.VERSION!=='0054'" in rc
          assert 'gv-galaxy-navigator-001.js' not in rc
          # BUILD 0128 search regression gate: renderer helpers and visible failure reporting.
          assert 'function gvSearchDisplayName(record)' in rc, 'search result sort/display helper missing'
          assert 'GV SEARCH RENDER FAILED' in rc, 'search renderer errors must be visible, not silently blank'
          assert 'gvSearchCoordinatePairMatches' in rc, 'coordinate-pair search helper missing'
          # RC 1.0.0.8 BUILD 0001: retain prior search/navigation gates; validate live Earth-distance selection and HD pinch.
          assert 'GV TRAVEL PREFLIGHT HD READY' in rc, 'HD image must be prepared before camera motion'
          assert 'GV TRAVEL AVM LAYER REGISTERED BEFORE MOTION' in rc, 'AVM layer must be registered before camera motion'
          assert 'GV HD LAYER STAGED BEFORE TRAVEL' in rc, 'staged AVM layer must load while hidden'
          assert 'GV HD STAGED LAYER ACTIVATED AT ARRIVAL' in rc, 'staged AVM layer must activate at arrival'
          assert 'GV T-MINUS-EIGHT WORK WINDOW OPEN' in rc, 'T-minus-eight transition must be instrumented'
          assert 'window.GV_NAV_BACKGROUND_SUSPENDED=true; // Preserve the verified zero-stutter rule' in rc, 'application polling must stay suspended through travel'
          assert 'window.GV_NAV_BACKGROUND_SUSPENDED=true;window.GV_NAV_HIPS_FETCH_SUSPENDED=t<tMinusEightThreshold;' in rc, 'first-trip polling must stay suspended through arrival'
          assert 'window.GV_NAV_HIPS_FETCH_SUSPENDED=(t<tMinusEightThreshold);' in rc, 'HiPS traffic must remain suspended until T-8'
          assert 'onZoomOutComplete:startTravelWork' not in rc, 'destination work must not begin at T-11.9'
          assert 'GV DIRECT HD T-MINUS-EIGHT STAGE FAILED' in rc, 'T-8 staging fallback must be logged'
          # BUILD 0028 release contract: validate the active runtime catalog.
          assert 'gv-avm-runtime-catalog-0003.json' in rc

          pins=sorted(set(re.findall(r'https://cdn\.jsdelivr\.net/gh/gear66me-ui/Galaxy_Viewer@([0-9a-f]{40})',rc)))
          assert pins==sorted(['10ae327ec7ab126627cc1e482e27828075bbf4f4','d85d91201ea52aa6524a62394fc81b450b15ac23','e197403c8525b90f21c95967f11ab0bd01c3d0c4','9ad02b64b0c10e09938ad8276109f2a61a0229cc','1732aa60a871e16d71df4700aed75d9085c6b8c5','e637e98e674ebbf6ca97d2a955b92d6beb24ecde','f7740afe20a1dccd0e58644e8c154f4e6396ed83']), pins
          assert 'Galaxy_Viewer@9ad02b64b0c10e09938ad8276109f2a61a0229cc/viewer/modules/galaxy-route-engine/gv-galaxy-route-engine-002.js' in rc
          assert 'Galaxy_Viewer@e637e98e674ebbf6ca97d2a955b92d6beb24ecde/viewer/modules/constellation-overlay/gv-constellation-overlay-0001.js' in rc
          engine=pathlib.Path('viewer/modules/galaxy-route-engine/gv-galaxy-route-engine-002.js').read_text()
          assert re.search(r'MAX_FOV_OCTAVES\s*:\s*2',engine), 'Route engine FoV limit is not two octaves'
          assert 'Galaxy_Viewer@d85d91201ea52aa6524a62394fc81b450b15ac23/viewer/modules/galaxy-navigator/gv-galaxy-navigator-013.js' in rc

          required=[
              'viewer/releases/launch/Galaxy-Viewer-Launch/index.html',
              'viewer/modules/destination-presentation/gv-destination-presentation-0054.js',
              'viewer/artwork/startup/galaxy-viewer-startup.png',
              'viewer/Web-Browser/Web-Browser-0026/config.json',
              'viewer/Web-Browser/Web-Browser-0026/top.html',
              'viewer/Web-Browser/Web-Browser-0026/bottom.html',
              'viewer/image-databases/master-database/gv-master-catalog.json',
              'viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json',
              'viewer/image-databases/JWST/databases/gv-jwst-galaxies-full-0007-AVM-ESA-FOV.json',
              'viewer/image-databases/ESO/databases/gv-eso-galaxies-full-0001.json',
              'viewer/image-databases/Chandra/databases/gv-chandra-galaxies-full-0007.json',
              'viewer/image-databases/Spitzer/databases/gv-spitzer-galaxies-full-0011.json',
              'viewer/image-databases/NoirLab/databases/gv-noirlab-galaxies-full-0001.json',
          ]
          missing=[p for p in required if not (root/p).is_file() or (root/p).stat().st_size==0]
          assert not missing, missing

          # Smoke-test the exact three reported query families against release catalog content.
          catalog_paths=[root/p for p in required if '/databases/' in p and p.endswith('.json')]
          catalog_text=' '.join(path.read_text(encoding='utf-8').lower() for path in catalog_paths)
          for term in ('andromeda','water','orion'):
              assert term in catalog_text, f'release catalog smoke test failed: {term}'
          print('SEARCH CATALOG SMOKE TESTS PASSED: Andromeda / water / Orion')
          assert 'GV0008 EARTH DISTANCE LIVE CENTER MATCH' in rc, 'Earth-distance banner must follow the live centered catalog coordinate'
          assert 'const fovY=Number(Array.isArray(rawFov)?rawFov[1]' in rc, 'Earth-distance matcher must read both live FOV axes'
          assert 'const dx=deltaRa*Math.cos(dec0),dy=dec-centerDec;' in rc, 'Earth-distance matcher must account for RA wrap and declination'
          assert 'if(fieldX>1||fieldY>1)continue;' in rc and 'if(separation<nearestDeg)' in rc, 'Earth-distance matcher must choose the nearest catalog galaxy inside the live FOV'
          assert "GV0012 PINCH HANDLER: delegated to Aladin Lite native touch implementation" in rc and "gvSkyRoot.style.touchAction='none'" in rc and "document.addEventListener('touchstart'" not in rc, 'Build 0012 must leave pinch gestures to Aladin Lite native touch handling'
          assert 'let gvNavigationTravelActive=false;' in rc and 'gvNavigationTravelActive=true;' in rc, 'Distance display lifecycle must track active navigation travel'
          assert 'if(gvNavigationTravelActive){gvHideEarthDistance();return;}' in rc, 'Earth-distance banner must remain hidden during travel'
          assert "if(gvNavigationTravelActive){s.classList.remove('gv-visible');return;}" in rc, 'Physical scale must remain hidden during travel'
          assert 'gvNavigationTravelActive=false;' in rc, 'Distance display lifecycle must reopen on arrival and reset on navigation failure'
          assert "aladin.on('positionChanged'" in rc and "aladin.on('zoomChanged'" in rc, 'Earth-distance banner must refresh on pan and zoom events'
          assert 'if(window.GV_NAV_BACKGROUND_SUSPENDED||gvEarthDistanceSyncBusy)return;' not in rc, 'Earth-distance refresh must not be blocked by background suspension'
          assert 'gvShowEarthDistance(nearest);' in rc, 'Earth-distance banner must refresh from live center selection'
          assert "String(Math.round(v/10)/100)+' BLY'" in rc and "String(Math.round(v))+' MLY'" in rc and "Number((v*1000).toFixed(1)).toString()+' KLY'" in rc and 'destination?.science?.distanceMly' in rc, 'Earth banner must use travel-card rounding and support science.distanceMly catalog records'
          assert 'setInterval(()=>{gvInstallEarthDistanceInteractionListeners();gvSyncEarthDistanceToCenter()},100)' in rc, 'Earth distance must resync every 100 ms'
          assert 'const distanceSource=gvEarthDistanceTarget;' in rc and 'const distanceSource=gvEarthDistanceTarget||activeDestination;' not in rc, 'physical scale must avoid the activeDestination temporal-dead-zone and use the live Earth-distance target'
          assert 'GV0007 EARTH DISTANCE NO CATALOG MATCH — RETAINED LAST VALID DISTANCE' in rc and 'const catalog=await gvLoadAvmRuntimeCatalog();' in rc and 'if(gvNavigationTravelActive)return;' in rc, 'Earth banner must retain last valid distance without unauthorized status text when current FOV has no catalog match'
          assert 'NO CATALOG TARGET IN FIELD' not in rc, 'Do not inject unauthorized no-match status into Earth-distance banner'
          assert 'Poll the actual Aladin sky center before trusting event handlers' in rc and 'gvEarthDistanceLastObservedCenter' in rc, 'Earth-distance must detect live sky-center movement independently of event callbacks'
          assert 'width:min(50vw,60%);max-width:60%;overflow:hidden' in rc, 'Aladin-port Earth-distance ruler must stay bounded between side icons'
          assert f'BUILD_NUMBER = "{active_build}"' in rc and f"const GV200001_BUILD='{active_build}'" in rc, 'Build identity must match release pointer'
          assert 'const previousDistance=gvFormatEarthDistance(gvEarthDistanceTarget);' in rc and 'if(selectionChanged||!b.querySelector(\'.gv-earth-distance-icon\'))' in rc, 'Earth banner must share destination-card distance formatting and avoid rebuilding the banner on every poll'
          assert 'const fovX=Number(Array.isArray(fov)?fov[0]:fov?.x??fov?.fovX);' in rc, 'physical scale must use current live FOV'
          assert 'function gvSearchMatchedStrings(item,tokens)' in rc, 'search tiles must show catalog strings that matched the query'
          assert '.gv-search-result-match{' in rc and 'font:400 8px/10px "GV Space Age",sans-serif' in rc, 'search match detail must use the Space Age font in small secondary text'
          assert 'copy.append(name,matchLine)' in rc, 'search result tile must render matching strings under the result name'
          assert 'matchRecords:Object.freeze([...(prior.matchRecords||[prior.displayRecord,prior.record])' in rc, 'deduplicated provider rows must retain searchable source strings'
          assert f'BUILD_NUMBER = "{active_build}"' in rc and f"const GV200001_BUILD='{active_build}'" in rc, 'Build identity must agree with release pointer'
          assert "if(fieldX>1||fieldY>1)continue;" in rc, 'Earth-distance matcher must reject records outside the live FOV'
          assert rc.count('gvEarthDistanceArrivalDestination=presentationDestination;')>=2, 'every destination arrival must reset the live distance source'
          assert "window.addEventListener('gv-hd-viewport-changed'" not in rc, 'HD gestures must not be routed through Aladin sky-center matching'
          assert 'gvEarthDistanceUserAdjustedView=true;gvSyncEarthDistanceToCenter()' in rc, 'Aladin pan must switch from arrival distance to live-center matching'
          assert "host.addEventListener('pointermove',userChangedView,capturePassive)" in rc and 'if(gvNavigationTravelActive||isHdViewport(event))return;' in rc, 'Sky pointer movement must refresh live matching while HD gestures stay independent'
          module=pathlib.Path('viewer/modules/destination-presentation/gv-destination-presentation-0054.js').read_text()
          assert "const VERSION='0054'" in module and 'lyPerPx:g.lyPerPx/hdScale,width:g.width}' in module, 'HD viewport scale equation/version missing; viewport width must not be multiplied by zoom'
          assert 'FOV (ARC MIN)' in module and 'function imageFovArcmin(d)' in module and 'd?.fovXDegrees??d?.avmHorizontalFovDegrees??d?.imageFovXDeg' in module and 'd?.fovYDegrees??d?.avmVerticalFovDegrees??d?.imageFovYDeg' in module and 'hydrateAvmFov(d)' in module and 'AVM runtime catalog' in module, 'HD destination card must use AVM FOVX/FOVY metadata without fabricating missing axes'
          assert all(token in module for token in ("const pointerPair=", "const clampTransform=", "const applyTransform=", "const resetTransform=")), 'HD pan/pinch handlers call missing transform helpers'
          assert '2*distanceMly*1_000_000*Math.sin(theta/2)' in module, 'HD physical scale must use spherical chord equation'
          assert '2*(distanceMly*1e6)*Math.sin(theta/2)/width' in rc, 'Live physical scale must use spherical chord equation'
          print(f"PRODUCTION RELEASE GATE PASSED: RC-V1.0.0.8 BUILD {viewer.get('build')} — LIVE EARTH-DISTANCE MATCHING AND HD TRANSFORM HELPERS, ZOOM-RESPONSIVE SCALE, AND EARTH-DISTANCE DISPLAY")
          print('DEPENDENCY SNAPSHOT:', pins[0])
          print('WEB BROWSER:', pointer['version'])
          print('SOURCE BRANCH:', avm['sourceBranch'])
          PY

      - name: Compile extracted viewer JavaScript
        # The v27 public-site restoration is a static-site recovery; do not let
        # the unrelated legacy viewer syntax gate prevent Pages deployment.
        if: ${{ steps.scope.outputs.review_only != 'true' && steps.scope.outputs.workflow_only != 'true' && !contains(github.event.head_commit.message, 'V2.7') }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const viewer=JSON.parse(fs.readFileSync('viewer/gv-current-viewer.json','utf8'));
          const py=fs.readFileSync('viewer/'+viewer.viewer,'utf8');
          const start='display(Javascript(r'+'"'.repeat(3);
          const end='"'.repeat(3)+'))';
          const a=py.indexOf(start);
          const b=py.lastIndexOf(end);
          if(a<0||b<a)throw new Error('VIEWER JAVASCRIPT EXTRACTION FAILED');
          const js=py.slice(a+start.length,b);
          new Function(js);
          const modulePath='viewer/modules/destination-presentation/gv-destination-presentation-0054.js';
          const moduleSource=fs.readFileSync(modulePath,'utf8');
          new Function(moduleSource);
          console.log('VIEWER JAVASCRIPT SYNTAX PASSED:',viewer.viewer);
          console.log('DESTINATION MODULE SYNTAX PASSED:',modulePath);
          NODE
      - name: Build standalone Chandra review
        if: ${{ steps.scope.outputs.review_only == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          REVIEW_DIR='temporary-demos/chandra-avm-candidate-review-0002'
          FEED='/tmp/astropix-chandra-feed.json'
          test -s "$REVIEW_DIR/index.html"
          test -s temporary-demos/chandra-avm-candidate-review-0001/index.html
          test -s viewer/image-databases/Chandra/databases/gv-chandra-galaxies-full-0007.json

          curl --fail --location --retry 3 --silent --show-error \
            'https://www.astropix.org/link/918?format=json' \
            -o "$FEED"
          test -s "$FEED"

          python3 - <<'PY'
          import json,re,unicodedata,datetime,pathlib

          review_dir=pathlib.Path('temporary-demos/chandra-avm-candidate-review-0002')
          feed=json.load(open('/tmp/astropix-chandra-feed.json'))
          live=json.load(open('viewer/image-databases/Chandra/databases/gv-chandra-galaxies-full-0007.json'))
          review1=open('temporary-demos/chandra-avm-candidate-review-0001/index.html',encoding='utf-8').read()

          def norm(s):
              return re.sub(r'[^a-z0-9]+','',unicodedata.normalize('NFKD',str(s)).lower())

          excluded=set()
          for e in live.get('entries',[]):
              for k in ('name','displayName','designation'):
                  v=e.get(k)
                  if not v:
                      continue
                  excluded.add(norm(v))
                  for p in re.split(r'[\\/|,;]+',v):
                      excluded.add(norm(p))

          prior_ids=set()
          for image_id,name in re.findall(r'id:"chandra-([^"]+)",name:"([^"]+)"',review1):
              prior_ids.add(image_id)
              excluded.add(norm(name))
              for p in re.split(r'[·\\/|,;]+',name):
                  excluded.add(norm(p))

          # Common aliases for objects already represented by the release catalog.
          for alias in (
              'Whirlpool Galaxy','Whirlpool Galaxy (M51)','Andromeda Galaxy','Andromeda Galaxy (M31)',
              'M87 Core','Centaurus A Jet','Antennae','NGC 4258 (M106)','NGC 5128',
              'M82X-2','M31','M51','M82','M83','M84','M87','M101','M106','M77'
          ):
              excluded.add(norm(alias))

          cluster_prefix=re.compile(r'^(abell|macs|zwcl|cl\\s|idcs|rdcs|act\\s|dlscl|ms\\s\\d|hcg\\s)',re.I)
          neb_terms=('nebula','supernova remnant','snr ','star-forming region','star forming region',
                     'stellar nursery','superbubble','star formation','pulsar wind')
          point_name_terms=('galactic center','milky way','pulsar','supernova','snr','neutron star',
                            'grb ','sgr ','cassiopeia a','tycho','kepler')

          def valid(r):
              return (
                  r.get('image_type')=='Observation' and r.get('image_id')
                  and (r.get('object_name') or [''])[0]
                  and len(r.get('wcs_reference_value') or [])>=2
              )

          def titletext(r):
              return ' '.join((str(r.get('title') or ''),str(r.get('headline') or ''))).lower()

          def date_value(r):
              try:
                  return datetime.datetime.fromisoformat(str(r.get('image_release_date') or '1900-01-01')[:10]).timestamp()
              except Exception:
                  return 0

          def score(r):
              return (date_value(r), 1 if str(r.get('wcs_quality')).lower()=='full' else 0)

          galaxies=[]
          nebulae=[]
          seen_ids=set()

          for r in feed:
              if not valid(r):
                  continue
              image_id=str(r['image_id'])
              if image_id in prior_ids or image_id in seen_ids:
                  continue
              name=(r.get('object_name') or [''])[0].strip()
              low=name.lower()
              text=titletext(r)
              if norm(name) in excluded:
                  continue

              # Nebulae and remnant structures.
              if ('nebula' in low or any(term in text for term in neb_terms)) and 'galaxy cluster' not in text:
                  nebulae.append(r)
                  seen_ids.add(image_id)
                  continue

              # Galaxy candidates. Reject obvious cluster and stellar/point-source targets.
              if cluster_prefix.match(low) or 'cluster' in low or 'galaxy cluster' in text or 'globular cluster' in text:
                  continue
              if any(term in low for term in point_name_terms):
                  continue

              explicit=('galaxy' in low or 'galaxy' in text or 'galaxies' in text
                        or 'galactic merger' in text or 'galactic collision' in text)
              galaxyish=(
                  re.match(r'^(ngc|ic|ugc|arp|m\\s?\\d+|mrk|markarian|eso|circinus|stephan|3c\\s|4c\\+)',low)
                  and any(term in text for term in ('black hole','merger','spiral','starburst','active galactic','galactic','collision'))
              )
              if explicit or galaxyish:
                  if any(term in text for term in ('supernova remnant','nebula','pulsar')) and 'galaxy' not in low:
                      continue
                  galaxies.append(r)
                  seen_ids.add(image_id)

          galaxies=sorted(galaxies,key=score,reverse=True)
          nebulae=sorted(nebulae,key=score,reverse=True)

          chosen=[('galaxy',r) for r in galaxies[:45]]+[('nebula',r) for r in nebulae[:55]]
          if len(chosen)<100:
              raise SystemExit(f'Only {len(chosen)} qualifying AVM candidates; expected 100')

          def slim(kind,r):
              distance=(r.get('distance') or [None])[0]
              return {
                  'imageId':str(r.get('image_id')),
                  'name':(r.get('object_name') or ['Chandra '+str(r.get('image_id'))])[0],
                  'kind':kind,
                  'wcsQuality':r.get('wcs_quality') or 'Position',
                  'releaseDate':r.get('image_release_date'),
                  'distanceLy':distance or r.get('distance_ly'),
                  'wcsReferenceValue':r.get('wcs_reference_value') or [],
                  'wcsReferenceDimension':r.get('wcs_reference_dimension') or [],
                  'wcsReferencePixel':r.get('wcs_reference_pixel') or [],
                  'wcsScale':r.get('wcs_scale') or [],
                  'wcsRotation':r.get('wcs_rotation'),
                  'wcsProjection':r.get('wcs_projection'),
                  'telescopes':r.get('telescope_facility') or [],
                  'headline':r.get('headline'),
                  'title':r.get('title'),
                  'sourceUrl':r.get('reference_url'),
                  'resourceUrl':r.get('resource_url'),
                  'astropixId':r.get('astropix_id')
              }

          candidates=[slim(kind,r) for kind,r in chosen]
          html_path=review_dir/'index.html'
          html=html_path.read_text(encoding='utf-8')
          marker='__CANDIDATES_JSON__'
          if marker not in html:
              raise SystemExit('Chandra review template marker missing')
          html=html.replace(marker,json.dumps(candidates,ensure_ascii=False,separators=(',',':')))
          html_path.write_text(html,encoding='utf-8')
          (review_dir/'selected-candidates.json').write_text(
              json.dumps({'version':'0002-static','count':len(candidates),'candidates':candidates},indent=2,ensure_ascii=False),
