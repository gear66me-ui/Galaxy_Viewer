name: Deploy GitHub Pages

# Production Pages runner. The workflow executes from beta because the github-pages environment currently permits beta, but it publishes the release branch exclusively.
on:
  push:
    branches:
      - beta
  workflow_dispatch:
  workflow_run:
    workflows:
      - Galaxy Viewer Controlled Engineering Change
    types:
      - completed
    branches:
      - beta

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 1

      - name: Verify production release isolation
        shell: bash
        run: |
          set -euo pipefail
          test -s viewer/releases/launch/Galaxy-Viewer-Launch/index.html
          test -s viewer/gv-current-viewer.json
          test -s viewer/RC-V1.0.0.py
          test -s viewer/Web-Browser/web-browser-current.json
          test -s viewer/Web-Browser/Web-Browser-0026/config.json
          test -s viewer/Web-Browser/Web-Browser-0026/top.html
          test -s viewer/Web-Browser/Web-Browser-0026/bottom.html
          grep -q '"build": "0050"' viewer/gv-current-viewer.json
          grep -q '"viewer": "RC-V1.0.0.py"' viewer/gv-current-viewer.json
          grep -q '"version":"0026"' viewer/Web-Browser/web-browser-current.json
          grep -q '"sourceBranch": "release"' release-manifest.json
          grep -q '"sourceBranch": "release"' viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0001.json
          if grep -RInI -E 'Galaxy_Viewer/beta/|Galaxy_Viewer@beta/|[?&]ref=beta([^A-Za-z0-9_-]|$)|"sourceBranch"[[:space:]]*:[[:space:]]*"beta"' viewer release-manifest.json; then
            echo "FORBIDDEN BETA RUNTIME REFERENCE FOUND"
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
