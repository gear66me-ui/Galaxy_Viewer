name: Build Galaxy Viewer GVDEV APK

on:
  push:
    branches: [dev/gvdev]
    paths:
      - 'viewer/**'
      - '.github/workflows/build-gvdev-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-gvdev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: dev/gvdev

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare isolated GVDEV Android app
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gvdev"
          export ROOT
          mkdir -p "$ROOT/app/src/main/java/com/gear66me/galaxyviewer/lab" "$ROOT/app/src/main/assets" "$ROOT/app/src/main/res/values"
          python3 - <<'PY'
          from pathlib import Path
          import os, re, subprocess
          from urllib.parse import unquote
          src = Path('viewer/RC-V1.0.0.3.py').read_text()
          def extract(pattern, label):
              m = re.search(pattern, src, re.S)
              if not m:
                  raise SystemExit('Could not extract ' + label + ' from viewer source')
              return m.group(1)
          html = extract(r'display\(HTML\("""([\s\S]*?)"""\)\)', 'HTML')
          js = extract(r'display\(Javascript\(r?"""([\s\S]*?)"""\)\)', 'JavaScript')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          def pin_urls(text):
              text = re.sub(r'https://cdn.jsdelivr.net/gh/gear66me-ui/Galaxy_Viewer@[^/]+/', 'https://cdn.jsdelivr.net/gh/gear66me-ui/Galaxy_Viewer@' + commit + '/', text)
              text = re.sub(r'https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/[^/]+/', 'https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/' + commit + '/', text)
              return text
          # Preserve HTML and JavaScript as separate blocks. Splitting the combined
          # string at its first newline truncated the HTML and removed the app shell.
          # Correct stale filenames to files that actually exist on this GVDEV branch.
          module_path_fixes = {
              '/viewer/modules/hamburger-menu/gv-hamburger-menu-0011.js': '/viewer/modules/hamburger-menu/gv-hamburger-menu-0009.js',
              '/viewer/modules/hud/gv-heads-up-display-0002.js': '/viewer/modules/hud/gv-heads-up-display-0001.js',
              '/viewer/modules/random-galaxy/gv-random-travel-presentation-003.js': '/viewer/modules/random-galaxy/gv-random-travel-presentation.js',
              '/viewer/modules/destination-presentation/gv-destination-presentation-0031.js': '/viewer/modules/destination-presentation/gv-destination-presentation-0017.js',
          }
          for old, new in module_path_fixes.items():
              html = html.replace(old, new)
              js = js.replace(old, new)
          html, js = pin_urls(html), pin_urls(js)
          combined = html + '\n' + js
          repo_urls = re.findall(r'https://(?:cdn\.jsdelivr\.net/gh/gear66me-ui/Galaxy_Viewer@|raw\.githubusercontent\.com/gear66me-ui/Galaxy_Viewer/)[^\s"\']+', combined)
          bad = [u for u in repo_urls if not (u.startswith('https://cdn.jsdelivr.net/gh/gear66me-ui/Galaxy_Viewer@' + commit + '/') or u.startswith('https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/' + commit + '/'))]
          if bad:
              raise SystemExit('Isolation audit failed: ' + repr(bad))
          # Check every required same-repository resource against the checkout.
          # The thumbnail bridge is optional; its loader explicitly falls back.
          missing_resources = []
          for url in repo_urls:
              m = re.search(r'https://cdn\.jsdelivr\.net/gh/gear66me-ui/Galaxy_Viewer@[^/]+/([^\s"\']+)|https://raw\.githubusercontent\.com/gear66me-ui/Galaxy_Viewer/[^/]+/([^\s"\']+)', url)
              if not m:
                  continue
              path = unquote((m.group(1) or m.group(2)).split('?', 1)[0])
              if not path and url.endswith('/'):
                  continue  # pinned repository root used as a base for dynamic resource paths
              if path == 'viewer/artwork/runtime/gv-survey-thumbnail-bridge-0001.json':
                  print('OPTIONAL RESOURCE NOT PRESENT (fallback expected):', path)
                  continue
              if not Path(path).is_file():
                  missing_resources.append((url, path))
          if missing_resources:
              raise SystemExit('GVDEV RESOURCE AUDIT FAILED: ' + repr(missing_resources))
          print('GVDEV RESOURCE AUDIT PASSED: all required repository URLs resolve in this checkout.')
          # Cross-check boot-time export guards against the exact modules being packaged.
          contracts = {
              'viewer/modules/hud/gv-heads-up-display-0001.js': "const VERSION='0001';",
              'viewer/modules/destination-presentation/gv-destination-presentation-0017.js': "const VERSION='0032';",
          }
          for path, token in contracts.items():
              body = Path(path).read_text(encoding='utf-8')
              if token not in body:
                  raise SystemExit(f'GVDEV MODULE CONTRACT FAILED: {path} does not contain {token}')
              if token not in js:
                  # The extracted app must validate the same version as the packaged module.
                  expected = token.split("'")[1]
                  if path.endswith('gv-heads-up-display-0001.js') and f"GalaxyViewerHeadsUpDisplay?.VERSION!=='{expected}'" not in js:
                      raise SystemExit('GVDEV HUD EXPORT GATE DOES NOT MATCH PACKAGED MODULE VERSION')
                  if path.endswith('gv-destination-presentation-0017.js') and f"GalaxyDestinationPresentation?.VERSION!=='{expected}'" not in js:
                      raise SystemExit('GVDEV DESTINATION EXPORT GATE DOES NOT MATCH PACKAGED MODULE VERSION')
          print('GVDEV MODULE CONTRACT AUDIT PASSED: HUD 0001 and destination presentation 0032.')
          # Module files execute from this checkout. Their secondary assets must not
          # escape to the release branch; the viewer source is branch-isolated only
          # when the module graph is isolated too.
          module_release_refs = []
          for path in Path('viewer/modules').rglob('*.js'):
              body = path.read_text(encoding='utf-8')
              if re.search(r'https://cdn\\.jsdelivr\\.net/gh/gear66me-ui/Galaxy_Viewer@release/|https://raw\\.githubusercontent\\.com/gear66me-ui/Galaxy_Viewer/release/', body):
                  module_release_refs.append(str(path))
          if module_release_refs:
              raise SystemExit('GVDEV MODULE ISOLATION FAILED; release asset URLs remain in: ' + ', '.join(module_release_refs))
          print('GVDEV MODULE ISOLATION PASSED: module assets do not reference release.')
          required = ['gv-hamburger-host', 'gv-coordinate-host', 'gv-target-host', 'gv-navigation-host']
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit('HTML extraction incomplete; missing hosts: ' + repr(missing))
          assets = Path(os.environ['ROOT']) / 'app/src/main/assets'
          assets.mkdir(parents=True, exist_ok=True)
          page = '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="color-scheme" content="dark"><style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}</style></head><body>' + html + '<script>' + js + '</script></body></html>'
          (assets / 'index.html').write_text(page)
          (Path(os.environ['ROOT']) / 'extracted-app.js').write_text(js)
          print('GVDEV source commit:', commit)
          print('HTML characters:', len(html), 'JavaScript characters:', len(js))
          print('Isolation audit passed: every Galaxy_Viewer CDN/raw URL pins to this exact commit.')
          PY
          node --check "$ROOT/extracted-app.js"
          cat > "$ROOT/settings.gradle" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='GalaxyViewerGVDEV'
          include ':app'
          EOF
          cat > "$ROOT/build.gradle" <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > "$ROOT/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > "$ROOT/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.gear66me.galaxyviewer.lab'
            compileSdk 35
            defaultConfig {
              applicationId 'com.gear66me.galaxyviewer.lab'
              minSdk 29
              targetSdk 35
              versionCode 4
              versionName 'GVDEV-APK-004'
            }
            dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
          }
          EOF
          cat > "$ROOT/app/src/main/res/values/styles.xml" <<'EOF'
          <resources><style name="GVDEVTheme" parent="@android:style/Theme.Material.NoActionBar"><item name="android:windowBackground">#000000</item><item name="android:navigationBarColor">#000000</item><item name="android:statusBarColor">#000000</item><item name="android:windowLightStatusBar">false</item></style></resources>
          EOF
          cat > "$ROOT/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:allowBackup="false" android:hardwareAccelerated="true" android:label="Galaxy Viewer GVDEV" android:theme="@style/GVDEVTheme" android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity" android:configChanges="keyboardHidden|orientation|screenSize" android:exported="true" android:screenOrientation="portrait">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > "$ROOT/app/src/main/java/com/gear66me/galaxyviewer/lab/MainActivity.java" <<'EOF'
          package com.gear66me.galaxyviewer.lab;
          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;
          public final class MainActivity extends Activity {
            private WebView web;
            @Override public void onCreate(Bundle state) {
              super.onCreate(state);
              applyImmersiveMode();
              getWindow().setStatusBarColor(Color.BLACK);
              getWindow().setNavigationBarColor(Color.BLACK);
              web=new WebView(this);
              web.setBackgroundColor(Color.BLACK);
              WebSettings s=web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setAllowFileAccess(false);
              s.setAllowContentAccess(false);
              s.setAllowFileAccessFromFileURLs(false);
              s.setAllowUniversalAccessFromFileURLs(false);
              WebViewAssetLoader loader=new WebViewAssetLoader.Builder()
                .addPathHandler("/assets/",new WebViewAssetLoader.AssetsPathHandler(this))
                .build();
              web.setWebViewClient(new WebViewClientCompat(){
                @Override public android.webkit.WebResourceResponse shouldInterceptRequest(WebView view, android.webkit.WebResourceRequest request) {
                  return loader.shouldInterceptRequest(request.getUrl());
                }
              });
              web.setWebChromeClient(new WebChromeClient());
              setContentView(web);
              web.loadUrl("https://appassets.androidplatform.net/assets/index.html");
            }
            private void applyImmersiveMode() {
              getWindow().getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                | View.SYSTEM_UI_FLAG_FULLSCREEN
                | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
              );
            }
            @Override public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) applyImmersiveMode();
            }
            @Override public void onBackPressed() { if(web!=null && web.canGoBack()) web.goBack(); else super.onBackPressed(); }
          }
          EOF
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Build GVDEV debug APK
        run: gradle --no-daemon -p "$ROOT" :app:assembleDebug

      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.gear66me.galaxyviewer.lab'" apk-badging.txt
          grep -q "application-label:'Galaxy Viewer GVDEV'" apk-badging.txt
          mkdir -p dist
          cp "$APK" dist/Galaxy-Viewer-GVDEV-APK-004.apk
          sha256sum dist/Galaxy-Viewer-GVDEV-APK-004.apk > dist/Galaxy-Viewer-GVDEV-APK-004.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Viewer-GVDEV-APK-004
          path: |
            dist/Galaxy-Viewer-GVDEV-APK-004.apk
            dist/Galaxy-Viewer-GVDEV-APK-004.apk.sha256
            apk-badging.txt
          retention-days: 30
