name: Build Galaxy Viewer GVDEV APK

on:
  push:
    branches: [dev/gvdev]
    paths:
      - 'viewer/**'
      - '.github/workflows/build-gvdev-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-gvdev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: dev/gvdev

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare isolated GVDEV Android app
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/gvdev"
          export ROOT
          mkdir -p "$ROOT/app/src/main/java/com/gear66me/galaxyviewer/lab" "$ROOT/app/src/main/assets" "$ROOT/app/src/main/res/values"
          BASELINE_APK="$ROOT/thumbnail-baseline.apk"
          curl -fL --retry 3 --retry-delay 2 "https://github.com/gear66me-ui/Galaxy_Viewer/releases/download/galaxy-viewer-rc-v1.0.0.26-local-survey-thumbnails/Galaxy-Viewer-RC-V1.0.0.26-Local-Survey-Thumbnails.apk" -o "$BASELINE_APK"
          echo "3b142b14103b72b1b87c7071c112819da7a03d01a7488e0fbf8ad84142b4811e  $BASELINE_APK" | sha256sum -c -
          unzip -q "$BASELINE_APK" 'assets/survey-thumbnails/*' -d "$ROOT/thumbnail-extract"
          python3 - <<'PY'
          from pathlib import Path
          import os, re, subprocess, shutil, json
          from urllib.parse import unquote, urlsplit
          
          ROOT = Path(os.environ['ROOT'])
          ASSETS = ROOT / 'app/src/main/assets'
          ASSET_BASE = 'https://appassets.androidplatform.net/assets/'
          pointer_path = Path('viewer/gv-current-viewer.json')
          pointer = json.loads(pointer_path.read_text(encoding='utf-8'))
          viewer_name = str(pointer.get('viewer') or '')
          pointer_version = str(pointer.get('version') or '')
          pointer_build = str(pointer.get('build') or '')
          if not re.fullmatch(r'RC-[A-Za-z0-9._-]+\.py', viewer_name):
              raise SystemExit('Invalid viewer filename in GVDEV current-viewer pointer: ' + repr(viewer_name))
          source_path = Path('viewer') / viewer_name
          if not source_path.is_file():
              raise SystemExit('GVDEV pointer references missing runtime: ' + str(source_path))
          src = source_path.read_text(encoding='utf-8')
          source_version = re.search("^VIEWER_VERSION\\s*=\\s*['\"]([^'\"]+)['\"]", src, re.M)
          source_build = re.search("^BUILD_NUMBER\\s*=\\s*['\"]([^'\"]+)['\"]", src, re.M)
          js_build = re.search("const GV200001_BUILD=['\"]([^'\"]+)['\"];", src)
          if not source_version or not source_build or not js_build:
              raise SystemExit('Could not verify runtime version/build identity from ' + str(source_path))
          if source_version.group(1) != pointer_version:
              raise SystemExit(f'GVDEV pointer/runtime version mismatch: pointer={pointer_version}, runtime={source_version.group(1)}')
          if source_build.group(1) != pointer_build or js_build.group(1) != pointer_build:
              raise SystemExit(f'GVDEV pointer/runtime build mismatch: pointer={pointer_build}, Python={source_build.group(1)}, JavaScript={js_build.group(1)}')
          
          def extract(pattern, label):
              m = re.search(pattern, src, re.S)
              if not m:
                  raise SystemExit('Could not extract ' + label + ' from viewer source')
              return m.group(1)
          
          html = extract(r'display\(HTML\("""([\s\S]*?)"""\)\)', 'HTML')
          js = extract(r'display\(Javascript\(r?"""([\s\S]*?)"""\)\)', 'JavaScript')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          
          # Correct only known stale module filenames; all other module versions are preserved.
          module_path_fixes = {
              '/viewer/modules/hamburger-menu/gv-hamburger-menu-0011.js': '/viewer/modules/hamburger-menu/gv-hamburger-menu-0009.js',
              '/viewer/modules/hud/gv-heads-up-display-0002.js': '/viewer/modules/hud/gv-heads-up-display-0001.js',
              '/viewer/modules/random-galaxy/gv-random-travel-presentation-003.js': '/viewer/modules/random-galaxy/gv-random-travel-presentation.js',
              '/viewer/modules/destination-presentation/gv-destination-presentation-0031.js': '/viewer/modules/destination-presentation/gv-destination-presentation-0017.js',
          }
          for old, new in module_path_fixes.items():
              html = html.replace(old, new)
              js = js.replace(old, new)
          
          def rewrite_repo_urls(text):
              # The thumbnail pack used a commit-derived base URL; in the native build its
              # records resolve to the bundled APK assets instead of a network CDN.
              text = text.replace(
                  "https://cdn.jsdelivr.net/gh/gear66me-ui/Galaxy_Viewer@'+commit+'/",
                  ASSET_BASE
              )
              # Rewrite every same-repository immutable URL to the matching file copied
              # from this exact dev/gvdev checkout. No GitHub branch/CDN URL remains at runtime.
              text = re.sub(
                  r"https://cdn\.jsdelivr\.net/gh/gear66me-ui/Galaxy_Viewer@(?:[0-9a-fA-F]{40}|dev/gvdev|release|beta|main)/",
                  ASSET_BASE,
                  text
              )
              text = re.sub(
                  r"https://raw\.githubusercontent\.com/gear66me-ui/Galaxy_Viewer/(?:[0-9a-fA-F]{40}|dev/gvdev|release|beta|main)/",
                  ASSET_BASE,
                  text
              )
              return text
          
          # Mirror the complete app-side dependency tree from this checked-out commit.
          if ASSETS.exists():
              shutil.rmtree(ASSETS)
          ASSETS.mkdir(parents=True)
          shutil.copytree('viewer', ASSETS / 'viewer')
          shutil.copytree('aladin-source-clone', ASSETS / 'aladin-source-clone')
          
          # The source branch contains the catalogs and app code but not the 1,848 binary
          # survey thumbnails. Seed the APK from the checksum-pinned local-thumbnail pack;
          # the runtime will read these files locally, never fetch thumbnail images remotely.
          thumbnail_source = ROOT / 'thumbnail-extract/assets/survey-thumbnails'
          if not (thumbnail_source / 'gv-survey-thumbnail-index.json').is_file():
              raise SystemExit('Thumbnail pack index missing from baseline APK')
          shutil.copytree(thumbnail_source, ASSETS / 'survey-thumbnails')
          
          # Generate the bridge schema expected by RC-V1.0.0.3 from the packaged index.
          current = json.loads((ASSETS / 'survey-thumbnails/gv-survey-thumbnail-current.json').read_text(encoding='utf-8'))
          index = json.loads((ASSETS / 'survey-thumbnails/gv-survey-thumbnail-index.json').read_text(encoding='utf-8'))
          records = index.get('records') or {}
          if len(records) != 1848 or int(index.get('failedCount', -1)) != 0:
              raise SystemExit(f'Unexpected thumbnail index: records={len(records)}, failed={index.get("failedCount")}')
          for key, record in records.items():
              rel = str(record.get('path') or '')
              prefix = 'viewer/artwork/runtime/survey-thumbnails/'
              if not rel.startswith(prefix):
                  raise SystemExit(f'Invalid thumbnail path for {key}: {rel}')
              local = ASSETS / 'survey-thumbnails' / rel[len(prefix):]
              if not local.is_file():
                  raise SystemExit(f'Bundled thumbnail missing for {key}: {local}')
          bridge = {
              'version': '0001',
              'packCommit': str(current.get('packCommit') or ''),
              'totalThumbnailBytes': int(index.get('totalThumbnailBytes') or 0),
              'records': records,
          }
          if not re.fullmatch(r'[0-9a-f]{40}', bridge['packCommit']):
              raise SystemExit('Thumbnail pack commit is invalid')
          bridge_path = ASSETS / 'viewer/artwork/runtime/gv-survey-thumbnail-bridge-0001.json'
          bridge_path.parent.mkdir(parents=True, exist_ok=True)
          bridge_path.write_text(json.dumps(bridge, separators=(',', ':')), encoding='utf-8')
          
          # Localize every text dependency in the mirrored tree, not just the entry script.
          text_suffixes = {'.html', '.js', '.css', '.json', '.svg', '.xml'}
          rewritten_files = 0
          for path in ASSETS.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              localized = rewrite_repo_urls(text)
              if localized != text:
                  path.write_text(localized, encoding='utf-8')
                  rewritten_files += 1
          
          # Use the exact same localized URL rules for the extracted viewer HTML/JS.
          html = rewrite_repo_urls(html)
          js = rewrite_repo_urls(js)
          
          # Hard fail if any source still tries to load app code/artwork/data from this repo
          # over GitHub/CDN, or if any absolute appassets URL points to a missing local file.
          leftover_repo_urls = []
          missing_local_urls = []
          for path in ASSETS.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if re.search(r'https://cdn\.jsdelivr\.net/gh/gear66me-ui/Galaxy_Viewer@|https://raw\.githubusercontent\.com/gear66me-ui/Galaxy_Viewer/', text):
                  leftover_repo_urls.append(str(path.relative_to(ASSETS)))
              for match in re.finditer(r'https://appassets\.androidplatform\.net/assets/([^\'"\s<>)]*)', text):
                  rel = unquote(match.group(1).split('?', 1)[0].split('#', 1)[0])
                  if not rel:
                      continue
                  candidate = ASSETS / rel
                  if not candidate.is_file() and not candidate.is_dir():
                      missing_local_urls.append((str(path.relative_to(ASSETS)), rel))
          if leftover_repo_urls:
              raise SystemExit('Runtime still references GitHub repo URLs: ' + repr(leftover_repo_urls[:30]))
          if missing_local_urls:
              raise SystemExit('Mirrored asset audit failed; missing local dependencies: ' + repr(missing_local_urls[:40]))
          
          required = ['gv-hamburger-host', 'gv-coordinate-host', 'gv-target-host', 'gv-navigation-host']
          missing_hosts = [item for item in required if item not in html]
          if missing_hosts:
              raise SystemExit('HTML extraction incomplete; missing hosts: ' + repr(missing_hosts))
          
          # Native mode routes survey thumbnails to the packaged assets/survey-thumbnails tree.
          page = (
              '<!doctype html><html><head><meta charset="utf-8">'
              '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">'
              '<meta name="color-scheme" content="dark">'
              '<style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}</style>'
              '</head><body><script>window.GVNative=true;</script>'
              + html + '<script>' + js + '</script></body></html>'
          )
          (ASSETS / 'index.html').write_text(page, encoding='utf-8')
          (ROOT / 'extracted-app.js').write_text(js, encoding='utf-8')
          file_count = sum(1 for p in ASSETS.rglob('*') if p.is_file())
          total_bytes = sum(p.stat().st_size for p in ASSETS.rglob('*') if p.is_file())
          print('GVDEV source commit:', commit)
          print('Mirrored runtime files:', file_count, 'bytes:', total_bytes)
          print('Localized source files:', rewritten_files)
          print('Bundled survey thumbnails:', len(records), 'mapped records; all files verified.')
          print('GVDEV MIRROR AUDIT PASSED: no GitHub repo runtime URLs and all appassets URLs resolve locally.')
          PY
          cat > "$ROOT/settings.gradle" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='GalaxyViewerGVDEV'
          include ':app'
          EOF
          cat > "$ROOT/build.gradle" <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > "$ROOT/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > "$ROOT/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.gear66me.galaxyviewer.lab'
            compileSdk 35
            defaultConfig {
              applicationId 'com.gear66me.galaxyviewer.lab'
              minSdk 29
              targetSdk 35
              versionCode 8
              versionName 'GVDEV-APK-008'
            }
            dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
          }
          EOF
          cat > "$ROOT/app/src/main/res/values/styles.xml" <<'EOF'
          <resources><style name="GVDEVTheme" parent="@android:style/Theme.Material.NoActionBar"><item name="android:windowBackground">#000000</item><item name="android:navigationBarColor">#000000</item><item name="android:statusBarColor">#000000</item><item name="android:windowLightStatusBar">false</item></style></resources>
          EOF
          cat > "$ROOT/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:allowBackup="false" android:hardwareAccelerated="true" android:label="Galaxy Viewer GVDEV" android:theme="@style/GVDEVTheme" android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity" android:configChanges="keyboardHidden|orientation|screenSize" android:exported="true" android:screenOrientation="portrait">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > "$ROOT/app/src/main/java/com/gear66me/galaxyviewer/lab/MainActivity.java" <<'EOF'
          package com.gear66me.galaxyviewer.lab;
          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;
          public final class MainActivity extends Activity {
            private WebView web;
            @Override public void onCreate(Bundle state) {
              super.onCreate(state);
              getWindow().getDecorView().setSystemUiVisibility(5894);
              getWindow().setStatusBarColor(Color.BLACK);
              getWindow().setNavigationBarColor(Color.BLACK);
              web=new WebView(this);
              web.setBackgroundColor(Color.BLACK);
              WebSettings s=web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setAllowFileAccess(false);
              s.setAllowContentAccess(false);
              s.setAllowFileAccessFromFileURLs(false);
              s.setAllowUniversalAccessFromFileURLs(false);
              WebViewAssetLoader loader=new WebViewAssetLoader.Builder()
                .addPathHandler("/assets/",new WebViewAssetLoader.AssetsPathHandler(this))
                .build();
              web.setWebViewClient(new WebViewClientCompat(){
                @Override public android.webkit.WebResourceResponse shouldInterceptRequest(WebView view, android.webkit.WebResourceRequest request) {
                  return loader.shouldInterceptRequest(request.getUrl());
                }
              });
              web.setWebChromeClient(new WebChromeClient());
              setContentView(web);
              web.loadUrl("https://appassets.androidplatform.net/assets/index.html");
            }
            @Override public void onBackPressed() { if(web!=null && web.canGoBack()) web.goBack(); else super.onBackPressed(); }
          }
          EOF
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Validate extracted JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check "$ROOT/extracted-app.js"

      - name: Build GVDEV debug APK
        run: gradle --no-daemon -p "$ROOT" :app:assembleDebug

      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.gear66me.galaxyviewer.lab'" apk-badging.txt
          grep -q "application-label:'Galaxy Viewer GVDEV'" apk-badging.txt
          mkdir -p dist
          cp "$APK" dist/Galaxy-Viewer-GVDEV-APK-008.apk
          sha256sum dist/Galaxy-Viewer-GVDEV-APK-008.apk > dist/Galaxy-Viewer-GVDEV-APK-008.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Viewer-GVDEV-APK-008
          path: |
            dist/Galaxy-Viewer-GVDEV-APK-008.apk
            dist/Galaxy-Viewer-GVDEV-APK-008.apk.sha256
            apk-badging.txt
          retention-days: 30
