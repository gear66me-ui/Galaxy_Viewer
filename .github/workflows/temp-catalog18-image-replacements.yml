name: TEMP Catalog 0018 image replacements
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/temp-catalog18-image-replacements.yml']
permissions:
  contents: write
jobs:
  replace-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy, json

          p = 'viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0018.json'
          with open(p, encoding='utf-8') as f:
              d = json.load(f)

          assert d.get('version') == 'full-0018'
          entries = d['entries']
          assert len(entries) == 1879
          by_id = {e['archiveId']: e for e in entries}
          assert len(by_id) == 1879

          before = copy.deepcopy(entries)

          image_keys = [
              'fieldOfView', 'orientation', 'imageType', 'releaseDate', 'pixelSize',
              'credit', 'sourceUrl', 'esaPublicationJpeg', 'jpegCandidates',
              'imageStatus', 'selectedImageUrl', 'assetName', 'bytes', 'sha256',
              'downloadErrors', 'githubImageUrl', 'releaseTag'
          ]
          size_keys = ['sizeKly', 'sizeMethod', 'sizeEstimated', 'sizeDisplay']
          stale_size_keys = [
              'fieldOfViewEstimated0012', 'fieldOfViewMethod0012',
              'fieldOfViewConfidence0012', 'pixelScaleArcsecPerPixel0012',
              'sizeConfidence0012'
          ]

          def replace_from_donor(target_id, donor_id, note):
              t = by_id[target_id]
              s = by_id[donor_id]
              for k in image_keys:
                  if k in s:
                      t[k] = copy.deepcopy(s[k])
                  else:
                      t.pop(k, None)
              ts = t.setdefault('science', {})
              ss = s.get('science', {})
              for k in size_keys:
                  if k in ss:
                      ts[k] = copy.deepcopy(ss[k])
                  else:
                      ts.pop(k, None)
              for k in stale_size_keys:
                  ts.pop(k, None)
              t['imageReplacement0018'] = {
                  'sourceArchiveId': donor_id,
                  'reason': note
              }

          # 1) Pixelated 255 px Cepheid crop -> full Hubble WFPC2 field of NGC 4603.
          replace_from_donor(
              'opo9919e', 'opo9919b',
              'Replace pixelated Cepheid cutout with full Hubble NGC 4603 field.'
          )

          # 2) Exact Einstein-ring object -> largest official ESA/Hubble browser-display derivative.
          ring = by_id['opo0532f']
          ring_url = 'https://cdn.esahubble.org/archives/images/wallpaper5/opo0532f.jpg'
          ring['selectedImageUrl'] = ring_url
          ring['githubImageUrl'] = ring_url
          ring['imageReplacement0018'] = {
              'sourceArchiveId': 'opo0532f',
              'reason': 'Use official ESA/Hubble 2048x1536 wallpaper derivative instead of the small catalog JPEG.'
          }

          # 3) Noisy 900 px magnified Abell 2744 cutout shown in Viewer -> full Frontier Fields cluster view.
          replace_from_donor(
              'heic1423d', 'heic1401a',
              'Replace noisy magnified cutout with full Hubble Frontier Fields view of Abell 2744.'
          )

          changed = []
          for old, new in zip(before, entries):
              if old != new:
                  changed.append(new['archiveId'])
          assert changed == ['opo9919e', 'heic1423d', 'opo0532f'] or set(changed) == {'opo9919e','opo0532f','heic1423d'}, changed
          assert set(changed) == {'opo9919e','opo0532f','heic1423d'}

          with open(p, 'w', encoding='utf-8', newline='\n') as f:
              json.dump(d, f, ensure_ascii=False, indent=2)
              f.write('\n')

          # Re-read final output and verify identity/order/count were preserved.
          with open(p, encoding='utf-8') as f:
              check = json.load(f)
          assert len(check['entries']) == 1879
          assert [e['archiveId'] for e in check['entries']] == [e['archiveId'] for e in before]
          print('changed=' + ','.join(changed))
          PY

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0018.json
          git commit -m 'Catalog 0018: replace three poor Hubble images'
          git pull --rebase origin beta
          git push origin HEAD:beta

          git rm .github/workflows/temp-catalog18-image-replacements.yml
          git commit -m 'Remove temporary Catalog 0018 image replacement workflow'
          git pull --rebase origin beta
          git push origin HEAD:beta