name: Optimize provider JPEGs

on:
  push:
    branches: [beta]
    paths:
      - tools/optimize-provider-icons.trigger

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Optimize provider JPEGs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          files = [
              Path("viewer/artwork/JWST/JWST.jpg"),
              Path("viewer/artwork/NoirLabs/NOIRLab.jpg"),
              Path("viewer/artwork/Spitzer/Spitzer.jpg"),
              Path("viewer/artwork/ESO/ESO.jpg"),
              Path("viewer/artwork/Chandra/Chandra.jpg"),
              Path("viewer/artwork/Hubble/Hubble.jpg"),
              Path("viewer/artwork/Euclid/Euclid.jpg"),
              Path("viewer/artwork/Herschel/Herschel.jpg"),
              Path("viewer/artwork/GALEX/GALEX.jpg"),
              Path("viewer/artwork/NuSTAR/NuSTAR.jpg"),
              Path("viewer/artwork/NRAO/NRAO.jpg"),
          ]

          total_before = total_after = 0
          for path in files:
              before = path.stat().st_size
              total_before += before
              with Image.open(path) as im:
                  im = ImageOps.exif_transpose(im).convert("RGB")
                  im.thumbnail((512, 512), Image.Resampling.LANCZOS)
                  im.save(
                      path,
                      "JPEG",
                      quality=82,
                      optimize=True,
                      progressive=True,
                      subsampling="4:2:0",
                  )
                  dims = im.size
              after = path.stat().st_size
              total_after += after
              print(f"{path}: {before} -> {after} bytes, {dims[0]}x{dims[1]}")

          print(f"TOTAL: {total_before} -> {total_after} bytes")
          print(f"REDUCTION: {(1-total_after/total_before)*100:.1f}%")
          PY

      - name: Commit optimized JPEGs
        shell: bash
        run: |
          if git diff --quiet -- viewer/artwork; then
            echo "No image changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             viewer/artwork/JWST/JWST.jpg             viewer/artwork/NoirLabs/NOIRLab.jpg             viewer/artwork/Spitzer/Spitzer.jpg             viewer/artwork/ESO/ESO.jpg             viewer/artwork/Chandra/Chandra.jpg             viewer/artwork/Hubble/Hubble.jpg             viewer/artwork/Euclid/Euclid.jpg             viewer/artwork/Herschel/Herschel.jpg             viewer/artwork/GALEX/GALEX.jpg             viewer/artwork/NuSTAR/NuSTAR.jpg             viewer/artwork/NRAO/NRAO.jpg
          git commit -m "Optimize provider JPEGs for launch page [skip ci]"
          git push origin HEAD:beta
