name: Build Galaxy Viewer Android APK 0063

on:
  push:
    branches: [release]
    paths:
      - 'android/galaxy-viewer-web-browser/**'
      - '.github/workflows/build-android-apk-0060.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galaxy-viewer-android-apk
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'

      - name: Verify Android release identity and provider cache policy
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "versionCode 63" android/galaxy-viewer-web-browser/app/build.gradle
          grep -Fq "versionName '0063'" android/galaxy-viewer-web-browser/app/build.gradle
          grep -Fq 'android:appCategory="game"' android/galaxy-viewer-web-browser/app/src/main/AndroidManifest.xml
          grep -Fq 'android:name="android.game_mode_config"' android/galaxy-viewer-web-browser/app/src/main/AndroidManifest.xml
          grep -Fq 'android:supportsPerformanceGameMode="true"' android/galaxy-viewer-web-browser/app/src/main/res/xml/game_mode_config.xml
          grep -Fq 'gm.getGameMode()' android/galaxy-viewer-web-browser/app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          grep -Fq 's.setCacheMode(WebSettings.LOAD_NO_CACHE)' android/galaxy-viewer-web-browser/app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          grep -Fq 'ps.setCacheMode(WebSettings.LOAD_NO_CACHE)' android/galaxy-viewer-web-browser/app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          grep -Fq 'web.clearCache(true)' android/galaxy-viewer-web-browser/app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          grep -Fq 'ROLL 0061: provider identity belongs to openProvider(requestedUrl, icon).' android/galaxy-viewer-web-browser/app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          ! grep -Fq 'launchSourceUrl(getIntent())' <(sed -n '/private void fetchPointer()/,/private boolean launchPrewarm/p' android/galaxy-viewer-web-browser/app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java)
          echo "APK 0061 identity, explicit URL priority, and provider no-cache checks passed."

      - name: Build installable debug APK
        working-directory: android/galaxy-viewer-web-browser
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK output and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=android/galaxy-viewer-web-browser/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Viewer-Android-APK-0063
          path: android/galaxy-viewer-web-browser/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
