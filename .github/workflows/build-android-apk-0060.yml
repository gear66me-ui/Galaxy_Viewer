name: Build Galaxy Viewer Android APK 0068

on:
  push:
    branches: [release]
    paths:
      - 'android/galaxy-viewer-web-browser/**'
      - '.github/workflows/build-android-apk-0060.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galaxy-viewer-android-apk
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'

      - name: Verify Android release identity and provider cache policy
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "versionCode 68" android/galaxy-viewer-web-browser/app/build.gradle
          grep -Fq "versionName 'APK 0068'" android/galaxy-viewer-web-browser/app/build.gradle
          grep -Fq '"build": "0136"' viewer/gv-current-viewer.json
          grep -Fq 'BUILD_NUMBER = "0136"' viewer/RC-V1.0.0.9-BLD-0136.py
          grep -Fq 'android:appCategory="game"' android/galaxy-viewer-web-browser/app/src/main/AndroidManifest.xml
          grep -Fq 'android:name="android.game_mode_config"' android/galaxy-viewer-web-browser/app/src/main/AndroidManifest.xml
          grep -Fq 'android:supportsPerformanceGameMode="true"' android/galaxy-viewer-web-browser/app/src/main/res/xml/game_mode_config.xml
          grep -Fq 'gm.getGameMode()' android/galaxy-viewer-web-browser/app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          grep -Fq 's.setCacheMode(WebSettings.LOAD_NO_CACHE)' android/galaxy-viewer-web-browser/app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          grep -Fq 'ps.setCacheMode(WebSettings.LOAD_NO_CACHE)' android/galaxy-viewer-web-browser/app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          grep -Fq 'web.clearCache(true)' android/galaxy-viewer-web-browser/app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          grep -Fq 'ROLL 0061: provider identity belongs to openProvider(requestedUrl, icon).' android/galaxy-viewer-web-browser/app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          ! grep -Fq 'launchSourceUrl(getIntent())' <(sed -n '/private void fetchPointer()/,/private boolean launchPrewarm/p' android/galaxy-viewer-web-browser/app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java)
          echo "Galaxy Viewer APK 0068 identity, explicit URL priority, and provider no-cache checks passed."

      - name: Bundle thumbnail lookup index for offline Android UI
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=android/galaxy-viewer-web-browser/app/src/main/assets
          mkdir -p "$ASSETS"
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/d85d91201ea52aa6524a62394fc81b450b15ac23/viewer/artwork/runtime/gv-survey-thumbnail-bridge-0001.json \
            -o "$ASSETS/gv-survey-thumbnail-bridge-0001.json"
          test -s "$ASSETS/gv-survey-thumbnail-bridge-0001.json"

      - name: Stage offline artwork before validation
        shell: bash
        run: |
          set -euo pipefail
          A=android/galaxy-viewer-web-browser/app/src/main/assets
          mkdir -p "$A/artwork" "$A"
          cp -a viewer/artwork/runtime/survey-thumbnails "$A/"
          cp -a viewer/artwork/Constellations "$A/artwork/"
          cp -a viewer/artwork/compass "$A/artwork/"
          mkdir -p "$A/artwork/startup"
          cp viewer/artwork/startup/galaxy-viewer-startup.png "$A/artwork/startup/"
          cp -a viewer/artwork/Fonts "$A/artwork/"
          mkdir -p "$A/releases/splash/Galaxy-Viewer-Singularity-FINAL"
          cp viewer/releases/splash/Galaxy-Viewer-Singularity-FINAL/Space-Age.otf "$A/releases/splash/Galaxy-Viewer-Singularity-FINAL/"
          for provider in Hubble JWST Chandra ESO NoirLabs Spitzer Euclid Herschel GALEX NuSTAR NRAO; do
            if [ -d "viewer/artwork/$provider" ]; then
              cp -a "viewer/artwork/$provider" "$A/artwork/"
            fi
          done
          mkdir -p "$A/artwork/runtime/navigation"
          cp viewer/artwork/runtime/navigation/gv-survey-satellite-icon.png "$A/artwork/runtime/navigation/"
          cp viewer/artwork/app_icon_4.png "$A/artwork/app_icon_4.png"
      - name: Verify bundled offline artwork inputs
        shell: bash
        run: |
          set -euo pipefail
          A=android/galaxy-viewer-web-browser/app/src/main/assets
          test "$(find "$A/survey-thumbnails" -type f -iname "*.webp" | wc -l)" -gt 1800
          test "$(find "$A/artwork/Constellations" -type f -iname "*.SVG" | wc -l)" -eq 88
          for f in Hubble/Hubble.jpg JWST/JWST.jpeg Chandra/Chandra.jpg ESO/ESO.jpg NoirLabs/NOIRLab.jpg Spitzer/Spitzer.jpg; do test -s "$A/artwork/$f"; done
          test -s "$A/artwork/runtime/navigation/gv-survey-satellite-icon.png"
          test -s "$A/artwork/compass/compass.png"
          test -s "$A/artwork/compass/gv-earth-pointer-yellow-final-1080-crisp.png"
          test -s "$A/artwork/startup/galaxy-viewer-startup.png"
          test -s "$A/artwork/app_icon_4.png"
          for f in Chandra/Chandra.jpg ESO/ESO.jpg Euclid/Euclid.jpg GALEX/GALEX.jpg Herschel/Herschel.jpg Hubble/Hubble.jpg JWST/JWST.jpeg NRAO/NRAO.jpg NoirLabs/NOIRLab.jpg NuSTAR/NuSTAR.jpg Spitzer/Spitzer.jpg; do test -s "$A/artwork/$f"; done
          test -s "$A/gv-survey-thumbnail-bridge-0001.json"
          test -s "$A/artwork/Fonts/Space Age Regular GV-9/Space Age GV-9A.otf"
          test -s "$A/artwork/Fonts/Space Age Regular GV-9/GV-Coordinate-Digits-0005.otf"
          test -s "$A/artwork/Fonts/Space Age Regular/Space Age Regular.otf"
          test -s "$A/releases/splash/Galaxy-Viewer-Singularity-FINAL/Space-Age.otf"
          echo "Bundled thumbnails, 88 constellations, 11 provider icons, launcher, startup, reticle, Earth pointer artwork, and all four font files verified."

      - name: Install the exact Galaxy Viewer launcher artwork
        shell: bash
        run: |
          set -euo pipefail
          R=android/galaxy-viewer-web-browser/app/src/main/res
          A=android/galaxy-viewer-web-browser/app/src/main/assets
          mkdir -p "$R/drawable-nodpi" "$A/artwork"
          cp viewer/artwork/app_icon_4.png "$R/drawable-nodpi/gv_launcher_art.png"
          cp viewer/artwork/app_icon_4.png "$A/artwork/app_icon_4.png"
          test -s "$R/drawable-nodpi/gv_launcher_art.png"
          test -s "$A/artwork/app_icon_4.png"
          echo "Launcher source verified: viewer/artwork/app_icon_4.png"
      - name: Build installable debug APK
        working-directory: android/galaxy-viewer-web-browser
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK output and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=android/galaxy-viewer-web-browser/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z1 "$APK" > /tmp/gv-apk-entries.txt
          echo "APK archive diagnostics:"
          echo "thumbnail_count=$(grep -Ec '^assets/survey-thumbnails/.*\.webp$' /tmp/gv-apk-entries.txt || true)"
          echo "constellation_svg_count=$(grep -Eic '^assets/artwork/Constellations/.*\.svg$' /tmp/gv-apk-entries.txt || true)"
          echo "launcher_resource_entries:"
          grep -E '^res/drawable(-nodpi)?(-v[0-9]+)?/gv_launcher_art\.png$' /tmp/gv-apk-entries.txt || true
          echo "bundled_fonts_and_artwork:"
          grep -E '^assets/(gv-survey-thumbnail-bridge-0001\.json|artwork/app_icon_4\.png|artwork/Fonts/|releases/splash/)' /tmp/gv-apk-entries.txt | head -30
          grep -Fqx "assets/gv-survey-thumbnail-bridge-0001.json" /tmp/gv-apk-entries.txt
          test "$(grep -Ec '^assets/survey-thumbnails/.*\.webp$' /tmp/gv-apk-entries.txt)" -gt 1800
          test "$(grep -Eic '^assets/artwork/Constellations/.*\.svg$' /tmp/gv-apk-entries.txt)" -eq 88
          grep -Eq '^res/drawable(-nodpi)?(-v[0-9]+)?/gv_launcher_art\.png$' /tmp/gv-apk-entries.txt
          grep -Fqx "assets/artwork/app_icon_4.png" /tmp/gv-apk-entries.txt
          grep -Fqx "assets/artwork/compass/compass.png" /tmp/gv-apk-entries.txt
          grep -Fqx "assets/artwork/compass/gv-earth-pointer-yellow-final-1080-crisp.png" /tmp/gv-apk-entries.txt
          grep -Fqx "assets/artwork/startup/galaxy-viewer-startup.png" /tmp/gv-apk-entries.txt
          for f in "assets/artwork/Fonts/Space Age Regular GV-9/Space Age GV-9A.otf" "assets/artwork/Fonts/Space Age Regular GV-9/GV-Coordinate-Digits-0005.otf" "assets/artwork/Fonts/Space Age Regular/Space Age Regular.otf" "assets/releases/splash/Galaxy-Viewer-Singularity-FINAL/Space-Age.otf"; do
            grep -Fqx "$f" /tmp/gv-apk-entries.txt || { echo "Missing APK entry: $f"; exit 1; }
          done
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Viewer-Android-APK-0068
          path: android/galaxy-viewer-web-browser/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
