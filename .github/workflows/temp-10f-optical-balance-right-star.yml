name: TEMP 10F Optical Balance Right Star

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/temp-10f-optical-balance-right-star.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Nudge right star/comet 2px left and pin 10F
        shell: bash
        run: |
          set -euo pipefail
          MOD='viewer/modules/gv-random-galaxy-0031.js'
          VIEW='viewer/GV-beta-0010F.py'
          test "$(git hash-object "$MOD")" = '119e5fd1442f6717ef2bb267dd2aed9ef1a5c840'
          test "$(git hash-object "$VIEW")" = '0747d6b281d0af80392ce15c0c567e7ab8148c15'
          python - <<'PY'
          from pathlib import Path
          p=Path('viewer/modules/gv-random-galaxy-0031.js')
          s=p.read_text(encoding='utf-8')
          old='#gv-random-galaxy .gvrg-random-star-wrap-right{grid-column:3}'
          new='#gv-random-galaxy .gvrg-random-star-wrap-right{grid-column:3;transform:translateX(-2px)}'
          if s.count(old)!=1: raise SystemExit(f'ABORT right-wrap match count={s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check "$MOD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$MOD"
          test "$(git diff --cached --name-only)" = "$MOD"
          git diff --cached --check
          git commit -m '10F optically balance right Random Galaxy star'
          MOD_COMMIT=$(git rev-parse HEAD)
          MOD_BLOB=$(git hash-object "$MOD")
          git push origin HEAD:beta
          python - "$MOD_COMMIT" "$MOD_BLOB" <<'PY'
          from pathlib import Path
          import re,sys
          commit,blob=sys.argv[1:3]
          p=Path('viewer/GV-beta-0010F.py')
          s=p.read_text(encoding='utf-8')
          pattern=r"const RANDOM_GALAXY_URL='https://raw\.githubusercontent\.com/gear66me-ui/Galaxy_Viewer/[0-9a-f]{40}/viewer/modules/gv-random-galaxy-0031\.js\?v=[0-9a-f]{40}';"
          repl=f"const RANDOM_GALAXY_URL='https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/{commit}/viewer/modules/gv-random-galaxy-0031.js?v={blob}';"
          s,n=re.subn(pattern,repl,s,count=1)
          if n!=1: raise SystemExit(f'ABORT pin count={n}')
          compile(s,str(p),'exec')
          p.write_text(s,encoding='utf-8')
          PY
          grep -Fq '.gvrg-random-star-wrap-right{grid-column:3;transform:translateX(-2px)}' "$MOD"
          grep -Fq 'grid-template-columns:20px auto 20px' "$MOD"
          grep -Fq 'gvrg-random-comet-left{animation-delay:-1.4s}' "$MOD"
          grep -Fq 'font:400 15.5px/1 "Space Age",sans-serif' "$VIEW"
          grep -Fq "bottom.random.addEventListener('click',launchRandomGalaxy);" "$VIEW"
          git add "$VIEW"
          test "$(git diff --cached --name-only)" = "$VIEW"
          git diff --cached --check
          git commit -m '10F pin optically balanced dual-comet module'
          git push origin HEAD:beta
      - name: Verify fetch-back
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin beta
          git reset --hard origin/beta
          grep -Fq '.gvrg-random-star-wrap-right{grid-column:3;transform:translateX(-2px)}' viewer/modules/gv-random-galaxy-0031.js
          node --check viewer/modules/gv-random-galaxy-0031.js
          python -m py_compile viewer/GV-beta-0010F.py
