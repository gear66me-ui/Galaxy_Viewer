name: GV Curator NGC4636 Runtime Validation

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/gv-curator-ngc4636-runtime-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy requests pillow opencv-python-headless playwright
          python -m playwright install --with-deps chromium

      - name: Fetch authoritative NGC 4636 source set and verify geometry
        run: |
          python - <<'PY'
          import io, json, re, requests
          from pathlib import Path
          from PIL import Image

          base='https://chandra.harvard.edu/photo/2001/0144/'
          urls={
            'xray': base+'0144_xray.jpg',
            'optical': base+'0144_opt.jpg',
            'composite': base+'0144_xray_opt_comp.jpg',
            'page': base,
          }
          out=Path('.tmp/gv-curator-ngc4636')
          out.mkdir(parents=True,exist_ok=True)
          sizes={}
          for kind,url in urls.items():
            if kind=='page':
              r=requests.get(url,timeout=60,headers={'User-Agent':'GalaxyViewerCuratorValidation/0001'})
              r.raise_for_status()
              text=r.text
              (out/'source-page.html').write_text(text,encoding='utf-8')
              if '5 x 4 arcmin' not in text:
                raise SystemExit('Authoritative source page did not expose expected 5 x 4 arcmin scale')
              if '12h 42m 50s' not in text or "+02" not in text:
                raise SystemExit('Authoritative source page coordinates missing/unexpected')
              continue
            r=requests.get(url,timeout=60,headers={'User-Agent':'GalaxyViewerCuratorValidation/0001'})
            r.raise_for_status()
            b=r.content
            (out/f'{kind}.jpg').write_bytes(b)
            im=Image.open(io.BytesIO(b)); im.load()
            sizes[kind]=im.size
            print(kind,url,'size=',im.size,'bytes=',len(b),'content-type=',r.headers.get('content-type'))
          print('sizes=',sizes)
          if sizes['optical'] != sizes['composite']:
            raise SystemExit(f'Optical/composite geometry mismatch: {sizes}')
          # X-ray may differ by a small border/annotation crop; record rather than assume.
          Path('.tmp/gv-curator-ngc4636/geometry.json').write_text(json.dumps({'urls':urls,'sizes':sizes},indent=2),encoding='utf-8')
          PY

      - name: Build one-record DSS optical bridge catalog
        run: |
          cat > .tmp/gv-curator-ngc4636/bridge-catalog.json <<'JSON'
          {
            "entries": [
              {
                "archiveId": "chandra-2001-0144",
                "name": "NGC 4636",
                "displayName": "NGC 4636",
                "ra": 190.7075,
                "dec": 2.6877777778,
                "fieldOfView": "5 x 4 arcminutes",
                "selectedImageUrl": "https://chandra.harvard.edu/photo/2001/0144/0144_opt.jpg",
                "sourceUrl": "https://chandra.harvard.edu/photo/2001/0144/"
              }
            ]
          }
          JSON

      - name: Register authoritative DSS optical bridge against real Aladin
        run: |
          python viewer/image-databases/master-database/orientation-review/gv-orientation-register-0003.py \
            --catalog 'Chandra=.tmp/gv-curator-ngc4636/bridge-catalog.json' \
            --limit 1 \
            --checkpoint-every 1 \
            --workdir .tmp/gv-curator-ngc4636/work \
            --output .tmp/gv-curator-ngc4636/prediction.json

      - name: Gate registration and publish server-side analysis record
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.load(open('.tmp/gv-curator-ngc4636/prediction.json',encoding='utf-8'))
          g=json.load(open('.tmp/gv-curator-ngc4636/geometry.json',encoding='utf-8'))
          if p.get('predictionCount') != 1:
            raise SystemExit(f"Expected one prediction, got {p.get('predictionCount')}")
          r=p['predictions'][0]
          print(json.dumps(r,indent=2))
          conf=float(r.get('confidence') or 0)
          if r.get('status') == 'failed':
            raise SystemExit('Optical bridge registration failed')
          if conf < 0.70:
            raise SystemExit(f'Optical bridge confidence too low: {conf:.3f}')
          out={
            'schema':'gv-curator-server-analysis-0001',
            'generatedBy':'GitHub Actions runtime validation',
            'records':[
              {
                'key':'Chandra:chandra-2001-0144',
                'catalog':'Chandra',
                'archiveId':'chandra-2001-0144',
                'name':'NGC 4636',
                'analysisMethod':'chandra-dss-optical-bridge-sift-ransac',
                'authoritativeSourcePage':'https://chandra.harvard.edu/photo/2001/0144/',
                'authoritativeImageUrl':'https://chandra.harvard.edu/photo/2001/0144/0144_xray.jpg',
                'bridgeImageUrl':'https://chandra.harvard.edu/photo/2001/0144/0144_opt.jpg',
                'compositeImageUrl':'https://chandra.harvard.edu/photo/2001/0144/0144_xray_opt_comp.jpg',
                'authoritativeScaleArcmin':[5.0,4.0],
                'catalogRaDeg':190.7075,
                'catalogDecDeg':2.6877777778,
                'selectedRaDeg':r['predictedRaDeg'],
                'selectedDecDeg':r['predictedDecDeg'],
                'selectedFovDeg':r['predictedFovDeg'],
                'selectedRotationDeg':r['predictedRotationDeg'],
                'confidence':conf,
                'registration':r.get('registration'),
                'imageGeometry':g.get('sizes'),
                'validated':True
              }
            ]
          }
          dst=Path('viewer/image-databases/master-database/orientation-review/gv-curator-server-analysis-0001.json')
          dst.write_text(json.dumps(out,indent=2),encoding='utf-8')
          PY

      - name: Commit validated analysis record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/image-databases/master-database/orientation-review/gv-curator-server-analysis-0001.json
          if git diff --cached --quiet; then
            echo 'No validated analysis changes to commit.'
          else
            git commit -m 'Publish validated NGC 4636 curator server analysis'
            git push origin HEAD:beta
          fi
