name: GV Curator NGC4636 Runtime Validation

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/gv-curator-ngc4636-runtime-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AVM and browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pillow defusedxml playwright
          python -m playwright install --with-deps chromium

      - name: Download real Chandra JPEG and extract embedded AVM
        run: |
          python - <<'PY'
          import io,json,re,requests
          from pathlib import Path
          from PIL import Image
          root=Path('.tmp/gv-avm-ngc4636'); root.mkdir(parents=True,exist_ok=True)
          image_url='https://chandra.harvard.edu/photo/2001/0144/0144_xray.jpg'
          source_url='https://chandra.harvard.edu/photo/2001/0144/'
          h={'User-Agent':'GalaxyViewerAVMValidation/0002'}
          r=requests.get(image_url,timeout=60,headers=h); r.raise_for_status(); (root/'source.jpg').write_bytes(r.content)
          p=requests.get(source_url,timeout=60,headers=h); p.raise_for_status(); (root/'source-page.html').write_text(p.text,encoding='utf-8')
          if '5 x 4 arcmin' not in p.text or '12h 42m 50s' not in p.text: raise SystemExit('Chandra Fast Facts gate failed')
          im=Image.open(io.BytesIO(r.content)); im.load(); raw=im.getxmp() or {}
          def clean(v):
            if isinstance(v,dict): return {str(k):clean(x) for k,x in v.items()}
            if isinstance(v,(list,tuple)): return [clean(x) for x in v]
            if isinstance(v,(str,int,float,bool)) or v is None: return v
            return str(v)
          obj=clean(raw)
          def walk(v,path=''):
            if isinstance(v,dict):
              for k,x in v.items():
                np=f'{path}.{k}' if path else str(k); yield np,x; yield from walk(x,np)
            elif isinstance(v,list):
              for i,x in enumerate(v): yield from walk(x,f'{path}[{i}]')
          targets=['Spatial.ReferenceValue','Spatial.ReferencePixel','Spatial.ReferenceDimension','Spatial.Scale','Spatial.Rotation','Spatial.CoordsystemProjection','Spatial.CoordinateFrame']
          wanted={}
          for path,v in walk(obj):
            for t in targets:
              if t.lower() in path.lower(): wanted.setdefault(t,[]).append({'path':path,'value':v})
          print('IMAGE SIZE',im.size)
          print('AVM FIELDS',json.dumps(wanted,indent=2))
          required=['Spatial.ReferenceValue','Spatial.Scale','Spatial.Rotation']
          missing=[x for x in required if x not in wanted]
          if missing: raise SystemExit('Missing required AVM fields: '+', '.join(missing))
          meta={'imageSize':list(im.size),'fields':wanted,'fastFacts':{'raDeg':190.70833333333334,'decDeg':2.6880555555555556,'frameArcmin':[5.0,4.0]}}
          (root/'avm.json').write_text(json.dumps(meta,indent=2),encoding='utf-8')
          PY

      - name: Create same-origin Aladin AVM probe
        run: |
          cat > .tmp/gv-avm-ngc4636/probe.html <<'HTML'
          <!doctype html><meta charset="utf-8"><style>html,body,#a{margin:0;width:640px;height:640px;background:#000}</style><div id="a"></div>
          <script src="https://aladin.cds.unistra.fr/AladinLite/api/v3/3.8.2/aladin.js"></script><script>
          window.probe={done:false,ok:false,error:null,callback:null,live:null};
          (async()=>{try{await A.init;const a=A.aladin('#a',{survey:'P/DSS2/color',target:'0 +0',fov:1,projection:'TAN',cooFrame:'ICRSd',lockNorthUp:false,showReticle:true,showCooGrid:true});
          a.displayJPG('/source.jpg',{label:'NGC 4636 Chandra AVM',nocache:true,transparency:.7},(ra,dec,fov)=>{try{window.probe.callback={ra:Number(ra),dec:Number(dec),fov:Number(fov)};a.gotoRaDec(Number(ra),Number(dec));a.setFoV(Number(fov));setTimeout(()=>{window.probe.live={radec:a.getRaDec(),fov:a.getFov(),rotation:a.getRotation()};window.probe.ok=true;window.probe.done=true;},1800)}catch(e){window.probe.error=String(e);window.probe.done=true}},e=>{window.probe.error='displayJPG '+String(e);window.probe.done=true});}catch(e){window.probe.error=String(e);window.probe.done=true}})();
          </script>
          HTML

      - name: Require Aladin to parse AVM and obey its own callback
        run: |
          python - <<'PY'
          import asyncio,json,math,subprocess
          from pathlib import Path
          from playwright.async_api import async_playwright
          root=Path('.tmp/gv-avm-ngc4636')
          srv=subprocess.Popen(['python','-m','http.server','8765','--bind','127.0.0.1'],cwd=root,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          async def main():
            try:
              async with async_playwright() as p:
                b=await p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage']); page=await b.new_page(viewport={'width':640,'height':640})
                await page.goto('http://127.0.0.1:8765/probe.html',wait_until='domcontentloaded',timeout=60000)
                q=None
                for _ in range(180):
                  q=await page.evaluate('window.probe')
                  if q and q.get('done'): break
                  await asyncio.sleep(.25)
                if not q or not q.get('done'): raise SystemExit('Aladin AVM probe timeout')
                print('ALADIN AVM PROBE',json.dumps(q,indent=2))
                if not q.get('ok'): raise SystemExit('displayJPG AVM failed: '+str(q.get('error')))
                cb=q['callback']; live=q['live']; ra=float(cb['ra']); dec=float(cb['dec']); fov=float(cb['fov'])
                if not all(math.isfinite(x) for x in (ra,dec,fov)): raise SystemExit('AVM callback non-finite')
                if abs(ra-190.70833333333334)>.03 or abs(dec-2.6880555555555556)>.03: raise SystemExit('AVM callback inconsistent with Chandra Fast Facts')
                if not (.04 <= fov <= .13): raise SystemExit('AVM callback FoV unreasonable')
                lr=live['radec']
                if abs(float(lr[0])-ra)>.003 or abs(float(lr[1])-dec)>.003: raise SystemExit('Live Aladin center did not follow AVM callback')
                (root/'aladin-probe.json').write_text(json.dumps(q,indent=2),encoding='utf-8')
                await page.screenshot(path=str(root/'probe.png'))
                await b.close()
            finally:
              srv.terminate(); srv.wait(timeout=10)
          asyncio.run(main())
          PY

      - name: Publish center and FoV only after AVM runtime PASS
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('.tmp/gv-avm-ngc4636'); avm=json.load(open(root/'avm.json',encoding='utf-8')); probe=json.load(open(root/'aladin-probe.json',encoding='utf-8')); cb=probe['callback']
          def nums(v):
            out=[]
            def rec(x):
              if isinstance(x,(int,float)) and not isinstance(x,bool): out.append(float(x))
              elif isinstance(x,str):
                for m in re.findall(r'[-+]?\d+(?:\.\d+)?(?:[Ee][-+]?\d+)?',x):
                  try: out.append(float(m))
                  except: pass
              elif isinstance(x,dict):
                for y in x.values(): rec(y)
              elif isinstance(x,list):
                for y in x: rec(y)
            rec(v); return out
          rotation=[]
          for hit in avm['fields']['Spatial.Rotation']: rotation += nums(hit['value'])
          source_rotation=rotation[0] if rotation else None
          out={'schema':'gv-curator-server-analysis-0001','generatedBy':'GitHub Actions + Aladin Lite 3.8.2 AVM parser','records':[{
            'key':'Chandra:chandra-2001-0144','catalog':'Chandra','archiveId':'chandra-2001-0144','name':'NGC 4636','analysisMethod':'aladin-displayJPG-avm-plus-chandra-fast-facts',
            'authoritativeSourcePage':'https://chandra.harvard.edu/photo/2001/0144/','authoritativeImageUrl':'https://chandra.harvard.edu/photo/2001/0144/0144_xray.jpg',
            'catalogRaDeg':190.7075,'catalogDecDeg':2.6877777778,'selectedRaDeg':float(cb['ra']),'selectedDecDeg':float(cb['dec']),'selectedFovDeg':float(cb['fov']),
            'sourceSpatialRotationDeg':source_rotation,'selectedRotationDeg':None,'rotationMethod':'manual-required-until-avm-to-aladin-rotation-convention-is-validated','orientationNeedsHumanValidation':True,
            'validatedCenterFov':True,'validatedRotation':False,'validated':True,'aladinAvmProbe':probe,'avmFields':avm['fields'],'sourceImageSize':avm['imageSize'],'authoritativeFrameArcmin':[5.0,4.0]
          }]}
          dst=Path('viewer/image-databases/master-database/orientation-review/gv-curator-server-analysis-0001.json'); dst.write_text(json.dumps(out,indent=2),encoding='utf-8'); print(json.dumps(out,indent=2))
          PY

      - name: Commit validated server analysis
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/image-databases/master-database/orientation-review/gv-curator-server-analysis-0001.json
          if git diff --cached --quiet; then echo 'No server analysis change.'; else git commit -m 'Publish Aladin AVM validated NGC 4636 curator analysis'; git push origin HEAD:beta; fi
