name: GV Curator NGC4636 Runtime Validation

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/gv-curator-ngc4636-runtime-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pillow defusedxml playwright
          python -m playwright install --with-deps chromium

      - name: Extract NGC 4636 AVM and calibrate rotation convention
        run: |
          python - <<'PY'
          import io,json,math,re,requests
          from pathlib import Path
          from PIL import Image
          root=Path('.tmp/gv-avm-ngc4636'); root.mkdir(parents=True,exist_ok=True)
          H={'User-Agent':'GalaxyViewerAVMValidation/0003'}

          def xmp_fields(url):
            r=requests.get(url,timeout=60,headers=H); r.raise_for_status()
            im=Image.open(io.BytesIO(r.content)); im.load(); x=im.getxmp() or {}
            desc=x.get('xmpmeta',{}).get('RDF',{}).get('Description',{})
            def seq(name):
              v=desc.get(name); 
              if isinstance(v,dict): v=v.get('Seq',{}).get('li',v)
              if not isinstance(v,list): v=[v] if v is not None else []
              return [float(z) for z in v]
            def scalar(name):
              v=desc.get(name); return float(v) if v is not None else None
            return {'url':url,'imageSize':list(im.size),'referenceValue':seq('Spatial.ReferenceValue'),'referencePixel':seq('Spatial.ReferencePixel'),'referenceDimension':seq('Spatial.ReferenceDimension'),'scale':seq('Spatial.Scale'),'rotation':scalar('Spatial.Rotation'),'projection':desc.get('Spatial.CoordsystemProjection'),'frame':desc.get('Spatial.CoordinateFrame')}

          # Independent high-confidence SIFT/RANSAC results already generated by the repository engine.
          calibrators=[
            ('M83','https://chandra.harvard.edu/photo/2026/m83/m83.jpg',0.047370137288879274,0.977360629392521),
            ('IC10','https://chandra.harvard.edu/photo/2017/ic10/ic10.jpg',39.66181155126448,0.9849511739531183),
            ('NGC5195','https://chandra.harvard.edu/photo/2016/ngc5195/ngc5195.jpg',-0.07142916842609298,0.9824377086774945),
          ]
          cal=[]
          for name,url,pred,conf in calibrators:
            m=xmp_fields(url); m.update({'name':name,'siftPredictedRotationDeg':pred,'siftConfidence':conf}); cal.append(m); print('CAL',json.dumps(m,indent=2))

          def adiff(a,b): return abs(((a-b+180)%360)-180)
          usable=[c for c in cal if c['rotation'] is not None]
          if len(usable)<2: raise SystemExit('Not enough AVM rotation calibrators')
          err_same=sum(adiff(c['rotation'],c['siftPredictedRotationDeg']) for c in usable)/len(usable)
          err_flip=sum(adiff(-c['rotation'],c['siftPredictedRotationDeg']) for c in usable)/len(usable)
          sign=1 if err_same<=err_flip else -1
          best=min(err_same,err_flip)
          print('ROTATION CALIBRATION same=',err_same,'flip=',err_flip,'selected sign=',sign,'mean error=',best)
          # If calibration is not compelling, do not invent a rotation.
          rotation_valid=best <= 8.0 and abs(err_same-err_flip) >= 3.0

          src='https://chandra.harvard.edu/photo/2001/0144/0144_xray.jpg'
          ngc=xmp_fields(src); print('NGC4636 AVM',json.dumps(ngc,indent=2))
          required=[ngc['referenceValue'],ngc['referencePixel'],ngc['referenceDimension'],ngc['scale']]
          if not all(len(v)>=2 for v in required) or ngc['rotation'] is None: raise SystemExit('Incomplete NGC4636 AVM')
          rw,rh=ngc['referenceDimension'][:2]; px,py=ngc['referencePixel'][:2]
          if abs(px-(rw+2)/2)>2 or abs(py-(rh+2)/2)>2: raise SystemExit('AVM reference pixel not at image center; center transform required')
          ra,dec=ngc['referenceValue'][:2]
          fov_w=abs(ngc['scale'][0]*rw); fov_h=abs(ngc['scale'][1]*rh); fov=max(fov_w,fov_h)
          if not (0.075 <= fov <= 0.095): raise SystemExit(f'AVM FoV outside Chandra 5x4 arcmin expectation: {fov}')
          # Chandra Fast Facts provide an independent coarse center check.
          if abs(ra-190.70833333333334)>.01 or abs(dec-2.6880555555555556)>.01: raise SystemExit('AVM center inconsistent with Chandra Fast Facts')
          rot=((sign*ngc['rotation']+180)%360)-180 if rotation_valid else None
          out={'ngc4636':ngc,'calibrators':cal,'calibration':{'sameSignMeanErrorDeg':err_same,'flippedSignMeanErrorDeg':err_flip,'selectedSign':sign,'meanErrorDeg':best,'validated':rotation_valid},'candidate':{'ra':ra,'dec':dec,'fov':fov,'fovWidthDeg':fov_w,'fovHeightDeg':fov_h,'rotation':rot,'sourceRotation':ngc['rotation'],'projection':ngc['projection'] or 'TAN'}}
          (root/'candidate.json').write_text(json.dumps(out,indent=2),encoding='utf-8'); print('CANDIDATE',json.dumps(out,indent=2))
          PY

      - name: Create direct Aladin placement probe
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.tmp/gv-avm-ngc4636'); d=json.load(open(root/'candidate.json')); c=d['candidate']; rot=c['rotation'] if c['rotation'] is not None else 0
          html=f'''<!doctype html><meta charset="utf-8"><style>html,body,#a{{margin:0;width:640px;height:640px;background:#000}}</style><div id="a"></div><script src="https://aladin.cds.unistra.fr/AladinLite/api/v3/3.8.2/aladin.js"></script><script>
          window.probe={{done:false,error:null,command:{json.dumps(c)},live:null}};(async()=>{{try{{await A.init;const a=A.aladin('#a',{{survey:'P/DSS2/color',target:'0 +0',fov:1,projection:'TAN',cooFrame:'ICRSd',lockNorthUp:false,showReticle:true,showCooGrid:true}});a.gotoRaDec({c['ra']},{c['dec']});a.setFoV({c['fov']});a.setRotation({rot});setTimeout(()=>{{window.probe.live={{radec:a.getRaDec(),fov:a.getFov(),rotation:a.getRotation()}};window.probe.done=true;}},2200);}}catch(e){{window.probe.error=String(e);window.probe.done=true;}}}})();</script>'''
          (root/'probe.html').write_text(html,encoding='utf-8')
          PY

      - name: Verify real Aladin obeys candidate and is not M31
        run: |
          python - <<'PY'
          import asyncio,json,math,subprocess
          from pathlib import Path
          from playwright.async_api import async_playwright
          root=Path('.tmp/gv-avm-ngc4636'); candidate=json.load(open(root/'candidate.json'))
          srv=subprocess.Popen(['python','-m','http.server','8765','--bind','127.0.0.1'],cwd=root,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          async def main():
            try:
              async with async_playwright() as p:
                b=await p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage']); page=await b.new_page(viewport={'width':640,'height':640}); await page.goto('http://127.0.0.1:8765/probe.html',wait_until='domcontentloaded',timeout=60000)
                q=None
                for _ in range(120):
                  q=await page.evaluate('window.probe')
                  if q and q.get('done'): break
                  await asyncio.sleep(.25)
                if not q or not q.get('done'): raise SystemExit('Aladin probe timeout')
                print('DIRECT ALADIN PROBE',json.dumps(q,indent=2))
                if q.get('error'): raise SystemExit(q['error'])
                c=q['command']; live=q['live']; lr=live['radec']; lf=live['fov']; lf=max(lf) if isinstance(lf,list) else float(lf)
                if abs(float(lr[0])-float(c['ra']))>.003 or abs(float(lr[1])-float(c['dec']))>.003: raise SystemExit('Aladin live center mismatch')
                if abs(float(lr[0])-10.6847)<1 and abs(float(lr[1])-41.2688)<1: raise SystemExit('Aladin still on M31')
                if not (.04 <= lf <= .13): raise SystemExit('Aladin live FoV invalid')
                if c.get('rotation') is not None and abs(((float(live['rotation'])-float(c['rotation'])+180)%360)-180)>.5: raise SystemExit('Aladin live rotation mismatch')
                (root/'aladin-probe.json').write_text(json.dumps(q,indent=2),encoding='utf-8'); await page.screenshot(path=str(root/'probe.png')); await b.close()
            finally: srv.terminate(); srv.wait(timeout=10)
          asyncio.run(main())
          PY

      - name: Publish validated server analysis
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.tmp/gv-avm-ngc4636'); d=json.load(open(root/'candidate.json')); p=json.load(open(root/'aladin-probe.json')); c=d['candidate']; cv=d['calibration']
          out={'schema':'gv-curator-server-analysis-0001','generatedBy':'Chandra embedded AVM + independent SIFT sign calibration + real Aladin readback','records':[{'key':'Chandra:chandra-2001-0144','catalog':'Chandra','archiveId':'chandra-2001-0144','name':'NGC 4636','analysisMethod':'embedded-avm-calibrated-and-live-aladin-verified','authoritativeSourcePage':'https://chandra.harvard.edu/photo/2001/0144/','authoritativeImageUrl':'https://chandra.harvard.edu/photo/2001/0144/0144_xray.jpg','selectedRaDeg':c['ra'],'selectedDecDeg':c['dec'],'selectedFovDeg':c['fov'],'sourceFovWidthDeg':c['fovWidthDeg'],'sourceFovHeightDeg':c['fovHeightDeg'],'sourceSpatialRotationDeg':c['sourceRotation'],'selectedRotationDeg':c['rotation'],'projection':c['projection'],'rotationCalibration':cv,'orientationNeedsHumanValidation':c['rotation'] is None,'validatedCenterFov':True,'validatedRotation':c['rotation'] is not None,'validated':True,'aladinReadback':p['live'],'sourceImageSize':d['ngc4636']['imageSize'],'referenceDimension':d['ngc4636']['referenceDimension'],'referencePixel':d['ngc4636']['referencePixel'],'scaleDegPerPixel':d['ngc4636']['scale']} ]}
          dst=Path('viewer/image-databases/master-database/orientation-review/gv-curator-server-analysis-0001.json'); dst.write_text(json.dumps(out,indent=2),encoding='utf-8'); print(json.dumps(out,indent=2))
          PY

      - name: Commit validated server analysis
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add viewer/image-databases/master-database/orientation-review/gv-curator-server-analysis-0001.json
          if git diff --cached --quiet; then echo 'No server analysis change.'; else git commit -m 'Publish calibrated AVM NGC 4636 curator analysis'; git push origin HEAD:beta; fi
