name: Reconcile AVM Runtime Catalog 0005 Published Distances and FLRW Redshifts

on:
  push:
    branches: [release]
    paths:
      - ".github/workflows/reconcile-avm-runtime-0005.yml"
      - ".github/scripts/update_runtime_published_distances_0005.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avm-runtime-0005-distance-redshift-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconcile published distances and FLRW redshifts
        run: python3 .github/scripts/update_runtime_published_distances_0005.py

      - name: Validate catalog and field synchronization
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math
          from pathlib import Path
          p = Path("viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0005.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d.get("schema") == "gv-avm-runtime-catalog-0005", d.get("schema")
          rows = d.get("records")
          assert isinstance(rows, list) and len(rows) == 1847, len(rows) if isinstance(rows, list) else type(rows)
          for i, e in enumerate(rows):
              s = e.get("science") if isinstance(e.get("science"), dict) else {}
              for k in ("distanceMly", "redshift"):
                  a = e.get(k)
                  b = s.get(k)
                  if a is not None:
                      assert isinstance(a, (int, float)) and math.isfinite(a), (i, k, a)
                  if b is not None:
                      assert isinstance(b, (int, float)) and math.isfinite(b), (i, "science."+k, b)
                  if a is not None and b is not None:
                      assert abs(float(a)-float(b)) <= max(1e-6, abs(float(a))*1e-6), (i, k, a, b)
              z = s.get("redshift", e.get("redshift"))
              if z is not None:
                  assert 0 <= z <= 20, (i, "redshift", z)
          report = json.loads(Path("ned-simbad-distance-verification-0005.json").read_text(encoding="utf-8"))
          assert report.get("runtimeRecordCount") == 1847
          print("Validated 1,847 records; schema 0005; numeric fields and top-level/science synchronization passed.")
          print(json.dumps(report.get("counters", {}), indent=2))
          PY
          git diff --check

      - name: Commit reconciled catalog and report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0005.json ned-simbad-distance-verification-0005.json
          if git diff --cached --quiet; then
            echo "No catalog changes generated."
            exit 0
          fi
          git commit -m "Reconcile AVM runtime 0005 published distances and FLRW redshifts"
          git push origin HEAD:release
