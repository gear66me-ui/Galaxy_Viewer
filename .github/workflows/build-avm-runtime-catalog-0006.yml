name: Build AVM Runtime Catalog 0006 from 0004

on:
  workflow_dispatch:
    inputs:
      target_manifest:
        description: "Committed JSON manifest of the 400 approved target records and their provider-page URLs"
        required: true
        default: ".github/data/runtime-distance-400-targets.json"
        type: string

permissions:
  contents: write

concurrency:
  group: avm-runtime-catalog-0006
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Build catalog 0006 from catalog 0004
        env:
          TARGET_MANIFEST: ${{ inputs.target_manifest }}
        run: |
          python - <<'PY'
          import json, math, os, re, sys, urllib.request
          from pathlib import Path

          source = Path("viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json")
          output = Path("viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0006.json")
          manifest_path = Path(os.environ["TARGET_MANIFEST"])
          if not source.is_file():
              raise SystemExit(f"Source catalog missing: {source}")
          if not manifest_path.is_file():
              raise SystemExit(f"Target manifest missing: {manifest_path}; refusing to guess or modify an arbitrary set of records.")

          catalog = json.loads(source.read_text(encoding="utf-8"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          targets = manifest.get("targets") if isinstance(manifest, dict) else None
          if not isinstance(targets, list) or len(targets) != 400:
              raise SystemExit("Manifest must contain exactly 400 explicit target records.")
          expected = {"chandra": 3, "eso": 55, "hubble": 295, "jwst": 20, "noirlab": 27}
          counts = {}
          for t in targets:
              if not isinstance(t, dict) or not all(t.get(k) for k in ("providerKey", "archiveId", "sourceUrl")):
                  raise SystemExit("Each target requires providerKey, archiveId, and sourceUrl.")
              p = str(t["providerKey"]).lower()
              counts[p] = counts.get(p, 0) + 1
          if counts != expected:
              raise SystemExit(f"Target-provider counts must be {expected}; received {counts}")
          records = catalog.get("records") if isinstance(catalog, dict) else catalog
          if not isinstance(records, list):
              raise SystemExit("Unexpected catalog schema.")
          index = {}
          for r in records:
              if isinstance(r, dict):
                  index[(str(r.get("providerKey", "")).lower(), str(r.get("archiveId", "")))] = r
          H0, OM, OL = 67.6, 0.315, 0.685
          def e(z):
              return math.sqrt(OM * (1 + z)**3 + OL)
          def comoving_distance_mpc(z):
              n = 1200
              h = z / n
              s = 1/e(0) + 1/e(z)
              for i in range(1, n):
                  s += (4 if i % 2 else 2) / e(i*h)
              return (299792.458/H0) * h*s/3
          def z_from_mly(mly):
              target_mpc = float(mly) / 3.26156
              lo, hi = 0.0, 20.0
              for _ in range(100):
                  mid = (lo + hi)/2
                  if comoving_distance_mpc(mid) < target_mpc: lo = mid
                  else: hi = mid
              return (lo + hi)/2
          number_re = re.compile(r"(?i)([0-9][0-9,.]*)\\s*(million|billion|thousand)?\\s*(light[- ]years?|Mly|Mpc|megaparsecs?|kpc|Gpc)")
          def to_mly(m):
              n = float(m.group(1).replace(",", ""))
              scale = (m.group(2) or "").lower()
              unit = m.group(3).lower().replace(" ", "")
              if unit == "mly": return n
              if unit in ("mpc", "megaparsecs"): return n*3.26156
              if unit == "kpc": return n*0.00326156
              if unit == "gpc": return n*3261.56
              if "light-year" in unit:
                  return n * (1000 if scale == "billion" else 1 if scale == "million" else 0.001 if scale == "thousand" else 0.000001)
              return None
          def page_text(url):
              req = urllib.request.Request(url, headers={"User-Agent":"GalaxyViewerCatalogRepair/1.0","Accept":"text/html"})
              with urllib.request.urlopen(req, timeout=25) as resp:
                  raw = resp.read(2_000_000).decode("utf-8", "replace")
              raw = re.sub(r"(?is)<(script|style|noscript)[^>]*>.*?</\\1>", " ", raw)
              return re.sub(r"\\s+", " ", re.sub(r"(?s)<[^>]+>", " ", raw))
          changes = []
          seen = set()
          for t in targets:
              key = (str(t["providerKey"]).lower(), str(t["archiveId"]))
              if key in seen: raise SystemExit(f"Duplicate target: {key}")
              seen.add(key)
              r = index.get(key)
              if r is None: raise SystemExit(f"Target not found in catalog 0004: {key}")
              quote = str(t.get("publishedDistanceQuote", "")).strip()
              mly = t.get("distanceMly")
              if mly is None:
                  if not quote:
                      raise SystemExit(f"Target lacks explicit publishedDistanceQuote or distanceMly: {key}")
                  matches = [(m, to_mly(m)) for m in number_re.finditer(quote)]
                  matches = [(m, v) for m, v in matches if v is not None]
                  if len(matches) != 1:
                      raise SystemExit(f"Quote must yield exactly one unambiguous distance: {key}: {quote}")
                  mly = matches[0][1]
              mly = float(mly)
              if not math.isfinite(mly) or mly <= 0:
                  raise SystemExit(f"Invalid published distance for {key}")
              source_url = str(t["sourceUrl"])
              if not quote:
                  txt = page_text(source_url)
                  # Require an explicit distance quote in the supplied provider page.
                  matches = [(m, to_mly(m)) for m in number_re.finditer(txt)]
                  matches = [(m, v) for m, v in matches if v is not None and abs(v-mly) <= max(0.01, mly*0.001)]
                  if not matches:
                      raise SystemExit(f"Provider page did not corroborate the supplied distance for {key}: {source_url}")
                  quote = matches[0][0].group(0)
              z = z_from_mly(mly)
              r["distanceMly"] = round(mly, 6)
              r["redshift"] = round(z, 8)
              science = r.setdefault("science", {})
              science["distanceMly"] = round(mly, 6)
              science["distanceDisplay"] = f"{mly:,.2f} million light-years"
              science["distanceMethod"] = "provider_published_distance_flrw_redshift"
              science["distanceSource"] = source_url
              science["distanceEvidence"] = quote
              science["distanceVerified"] = True
              science["redshift"] = round(z, 8)
              changes.append({"providerKey":key[0],"archiveId":key[1],"distanceMly":round(mly,6),"redshift":round(z,8),"sourceUrl":source_url})
          if len(changes) != 400:
              raise SystemExit(f"Expected 400 changes, got {len(changes)}")
          if isinstance(catalog, dict):
              catalog["schema"] = "gv-avm-runtime-catalog-0006"
              catalog["version"] = "0006"
              catalog["records"] = records
          output.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
          # Machine-readable summary is an Actions artifact only; no extra repository files.
          Path("/tmp/catalog-0006-summary.json").write_text(json.dumps({"source":"0004","output":"0006","updatedRecords":len(changes),"providerCounts":counts,"changes":changes},indent=2)+"\\n")
          print(f"Built {output} from {source}; updated exactly {len(changes)} target records.")
          PY

      - name: Validate catalog and show minimal diff summary
        run: |
          python - <<'PY'
          import json
          p="viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0006.json"
          o=json.load(open(p,encoding="utf-8"))
          r=o.get("records") if isinstance(o,dict) else o
          assert isinstance(r,list) and len(r)==1847, f"Unexpected record count: {len(r) if isinstance(r,list) else 'invalid'}"
          print(f"Validated catalog 0006: {len(r)} records")
          PY

      - name: Commit catalog 0006
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0006.json
          git commit -m "Build AVM runtime catalog 0006 from 0004 using provider-published distances"
          git push origin HEAD:release

      - name: Upload change summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avm-runtime-0006-change-summary
          path: /tmp/catalog-0006-summary.json
          if-no-files-found: ignore
