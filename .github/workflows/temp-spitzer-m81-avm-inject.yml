name: TEMP Spitzer M81 validated AVM injection

on:
  push:
    branches: [beta]
    paths:
      - ".github/workflows/temp-spitzer-m81-avm-inject.yml"

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download official Spitzer TIFF and create validated JPEG
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin beta
          mkdir -p viewer/image-databases/Spitzer/AVM-Catalog
          TIFF=/tmp/ssc2019-15a.tif
          OUT=viewer/image-databases/Spitzer/AVM-Catalog/ssc2019-15a-avm.jpg

          if ! curl -fL --retry 3 --retry-delay 2             'https://www.spitzer.caltech.edu/system/avm_images/binaries/6672/original/ssc2019-15a.tif?1603784767='             -o "$TIFF"; then
            curl -fL --retry 3 --retry-delay 2               'https://www.spitzer.caltech.edu/uploaded_files/images/0011/7143/ssc2019-15a.tif'               -o "$TIFF"
          fi

          python - <<'PY'
          from PIL import Image
          src="/tmp/ssc2019-15a.tif"
          dst="viewer/image-databases/Spitzer/AVM-Catalog/ssc2019-15a-avm.jpg"
          im=Image.open(src)
          if im.size != (3840,3840):
              raise SystemExit(f"Unexpected TIFF dimensions: {im.size}")
          if im.mode not in ("RGB","L"):
              im=im.convert("RGB")
          im.save(dst,"JPEG",quality=95,subsampling=0,optimize=True)
          chk=Image.open(dst)
          if chk.size != (3840,3840):
              raise SystemExit(f"Unexpected JPEG dimensions: {chk.size}")
          print("CREATED", dst, chk.size)
          PY

          sha256sum "$OUT"
          ls -lh "$OUT"

      - name: Patch source and runtime catalogs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib

          source_path = pathlib.Path("viewer/image-databases/Spitzer/databases/gv-spitzer-galaxies-full-0011.json")
          runtime_path = pathlib.Path("viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0001.json")
          raw_url = "https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/beta/viewer/image-databases/Spitzer/AVM-Catalog/ssc2019-15a-avm.jpg"

          source = json.loads(source_path.read_text(encoding="utf-8"))
          matches = [e for e in source["entries"] if e.get("archiveId") == "ssc2019-15a"]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one source ssc2019-15a record, found {len(matches)}")
          s = matches[0]
          s["jpegCandidates"] = [raw_url]
          s["selectedImageUrl"] = raw_url
          s["githubImageUrl"] = raw_url
          s["assetName"] = "ssc2019-15a-avm.jpg"
          s["astroPixSourceUrl"] = "https://www.astropix.org/image/spitzer/ssc2019-15a"

          runtime = json.loads(runtime_path.read_text(encoding="utf-8"))
          rmatches = [r for r in runtime["records"] if r.get("providerKey") == "spitzer" and r.get("archiveId") == "ssc2019-15a"]
          if len(rmatches) != 1:
              raise SystemExit(f"Expected exactly one runtime ssc2019-15a record, found {len(rmatches)}")
          r = rmatches[0]
          r.update({
              "imageUrl": raw_url,
              "authority": "PRECOMPUTED_IMAGE_AVM",
              "ra": 148.8873235,
              "dec": 69.0646392,
              "fovDegrees": 0.39995904,
              "fovXDegrees": 0.39995904,
              "fovYDegrees": 0.3999590016,
              "fovPolicy": "X",
              "spatialRotationDeg": -30.02,
              "aladinRotation": -30.02,
              "referencePixel": [1921, 1921],
              "referenceDimension": [3840, 3840],
              "scale": [-0.000104156, 0.00010415599],
              "cdMatrix": None,
              "projection": "TAN",
              "coordinateFrame": "ICRS"
          })

          sp = [x for x in runtime["records"] if x.get("providerKey") == "spitzer"]
          runtime["summary"]["spitzer"]["total"] = len(sp)
          runtime["summary"]["spitzer"]["imageAvm"] = sum(x.get("authority") == "PRECOMPUTED_IMAGE_AVM" for x in sp)
          runtime["summary"]["spitzer"]["catalogFallback"] = sum(x.get("authority") == "PRECOMPUTED_CATALOG_FALLBACK" for x in sp)
          runtime["summary"]["spitzer"]["failed"] = sum(x.get("authority") not in ("PRECOMPUTED_IMAGE_AVM","PRECOMPUTED_CATALOG_FALLBACK") for x in sp)

          source_path.write_text(json.dumps(source, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          runtime_path.write_text(json.dumps(runtime, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          print("SOURCE selectedImageUrl:", s["selectedImageUrl"])
          print("RUNTIME:", json.dumps(r, indent=2))
          print("SPITZER SUMMARY:", runtime["summary"]["spitzer"])
          PY

      - name: Commit validated M81 injection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             viewer/image-databases/Spitzer/AVM-Catalog/ssc2019-15a-avm.jpg             viewer/image-databases/Spitzer/databases/gv-spitzer-galaxies-full-0011.json             viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0001.json
          git diff --cached --stat
          git diff --cached --             viewer/image-databases/Spitzer/databases/gv-spitzer-galaxies-full-0011.json             viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0001.json
          git commit -m "Spitzer: inject validated 3840px AVM asset for ssc2019-15a"
          git push origin HEAD:beta
