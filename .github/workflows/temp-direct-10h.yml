# trigger: prepare BI dependency-tree repair
name: TEMP BI dependency tree repair

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/temp-direct-10h.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
          persist-credentials: true

      - name: Repair BI dependency tree and Random 0228 block
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          bi=Path('viewer/GV-12AR-132BI.py')
          rg227=Path('viewer/modules/random-galaxy/gv-random-galaxy-0227.js')
          rg228=Path('viewer/modules/random-galaxy/gv-random-galaxy-0228.js')
          ptr=Path('viewer/gv-current-viewer.json')

          for path in [bi, rg227, ptr]:
              if not path.exists():
                  raise SystemExit(f'FAIL missing required file: {path}')

          # --- BI viewer dependency tree ---
          bi_text=bi.read_text(encoding='utf-8')
          replacements=[
              ("const VERSION='12AR-132BD';", "const VERSION='12AR-132BI';", 'viewer VERSION BD->BI'),
              ("const DISPLAY_VERSION='12AR-132BD';", "const DISPLAY_VERSION='12AR-132BI';", 'viewer DISPLAY_VERSION BD->BI'),
              ("gv-random-galaxy-0227.js", "gv-random-galaxy-0228.js", 'viewer random module URL 0227->0228'),
              ("RANDOM_GALAXY_VERSION='0227'", "RANDOM_GALAXY_VERSION='0228'", 'viewer random version 0227->0228')
          ]
          for old,new,label in replacements:
              count=bi_text.count(old)
              print(f'CHECK {label}: {count}')
              if count==1:
                  bi_text=bi_text.replace(old,new,1)
              elif count==0 and new in bi_text:
                  print(f'ALREADY OK {label}')
              else:
                  raise SystemExit(f'FAIL {label}: old count {count}, new present={new in bi_text}')
          bi.write_text(bi_text, encoding='utf-8', newline='\n')

          # --- Random 0228 creation/repair from 0227 baseline ---
          rg_text=rg227.read_text(encoding='utf-8')
          old_block="""            const centerAuthority=gv0223ImageCenterFromWcs(wcs,actualWidth,actualHeight);
            const cameraRa=ra;
            const cameraDec=dec;"""
          new_block="""            const centerAuthority=gv0223ImageCenterFromWcs(wcs,actualWidth,actualHeight);
            const centerRa=Number(centerAuthority?.ra);
            const centerDec=Number(centerAuthority?.dec);
            const cameraRa=Number.isFinite(centerRa)?centerRa:ra;
            const cameraDec=Number.isFinite(centerDec)?centerDec:dec;"""
          count=rg_text.count(old_block)
          print(f'CHECK 0227 precomputed bad block count: {count}')
          if count!=1:
              raise SystemExit(f'FAIL random camera block count expected 1 got {count}')
          rg_new=rg_text.replace(old_block,new_block,1)
          vcount=rg_new.count("const VERSION='0227';")
          print(f'CHECK 0227 version count: {vcount}')
          if vcount!=1:
              raise SystemExit(f'FAIL random version count expected 1 got {vcount}')
          rg_new=rg_new.replace("const VERSION='0227';", "const VERSION='0228';", 1)

          header="""/*
RANDOM GALAXY 0228 — WCS IMAGE-CENTER CAMERA AUTHORITY REPAIR
BASELINE: RANDOM GALAXY 0227
AUTHORIZED CHANGE:
- Use derived WCS geometric image center for precomputed AVM camera RA/Dec when available.
- Keep CRVAL/CRPIX/WCS metadata intact.
- No HD download, queue, catalog, navigation, AVM, vignette, or UI changes.
*/
"""
          rg228.write_text(header+rg_new, encoding='utf-8', newline='\n')

          # --- active pointer ---
          ptr.write_text(json.dumps({'version':'12AR-132BI','viewer':'GV-12AR-132BI.py'}, indent=2)+'\n', encoding='utf-8', newline='\n')

          # --- exact dependency checks ---
          bi_final=bi.read_text(encoding='utf-8')
          rg_final=rg228.read_text(encoding='utf-8')
          ptr_final=ptr.read_text(encoding='utf-8')
          required=[
              (bi_final, "const VERSION='12AR-132BI';", 'BI VERSION'),
              (bi_final, "const DISPLAY_VERSION='12AR-132BI';", 'BI DISPLAY_VERSION'),
              (bi_final, "gv-random-galaxy-0228.js", 'BI random URL'),
              (bi_final, "RANDOM_GALAXY_VERSION='0228'", 'BI random version'),
              (rg_final, "const VERSION='0228';", 'Random 0228 VERSION'),
              (rg_final, "const centerRa=Number(centerAuthority?.ra);", 'Random 0228 centerRa'),
              (rg_final, "const centerDec=Number(centerAuthority?.dec);", 'Random 0228 centerDec'),
              (rg_final, "const cameraRa=Number.isFinite(centerRa)?centerRa:ra;", 'Random 0228 cameraRa center'),
              (rg_final, "const cameraDec=Number.isFinite(centerDec)?centerDec:dec;", 'Random 0228 cameraDec center'),
              (ptr_final, 'GV-12AR-132BI.py', 'Pointer BI file'),
              (ptr_final, '12AR-132BI', 'Pointer BI version')
          ]
          for text, marker, label in required:
              c=text.count(marker)
              print(f'REQUIRED {label}: {c}')
              if c < 1:
                  raise SystemExit(f'FAIL missing marker {label}: {marker}')
          print('BI_DEPENDENCY_TREE_REPAIR_WRITTEN=YES')
          PY

          git diff --check
          echo '=== CHANGED FILES ==='
          git status --short
          git add viewer/GV-12AR-132BI.py viewer/modules/random-galaxy/gv-random-galaxy-0228.js viewer/gv-current-viewer.json
          echo '=== CACHED FILES ==='
          git diff --cached --name-only | sort
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair 132BI dependency tree to Random 0228'
          git push origin HEAD:beta
