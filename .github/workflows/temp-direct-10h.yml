# trigger: run simple forward-only 132BJ Random 0229 now
name: TEMP forward-only 132BJ Random 0229 simple

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/temp-direct-10h.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
          persist-credentials: true

      - name: Write patch script
        shell: bash
        run: |
          cat > /tmp/forward_bj.py <<'PY'
from pathlib import Path
import json

source = Path('viewer/GV-12AR-132BI.py')
if not source.exists():
    source = Path('viewer/GV-12AR-132BD.py')
rg_src = Path('viewer/modules/random-galaxy/gv-random-galaxy-0227.js')
bj = Path('viewer/GV-12AR-132BJ.py')
rg229 = Path('viewer/modules/random-galaxy/gv-random-galaxy-0229.js')
ptr = Path('viewer/gv-current-viewer.json')

for path in (source, rg_src, ptr):
    if not path.exists():
        raise SystemExit('FAIL missing ' + str(path))

viewer = source.read_text(encoding='utf-8')
replacements = [
    ("const VERSION='12AR-132BD';", "const VERSION='12AR-132BJ';"),
    ("const VERSION='12AR-132BI';", "const VERSION='12AR-132BJ';"),
    ("const DISPLAY_VERSION='12AR-132BD';", "const DISPLAY_VERSION='12AR-132BJ';"),
    ("const DISPLAY_VERSION='12AR-132BI';", "const DISPLAY_VERSION='12AR-132BJ';"),
    ("gv-random-galaxy-0227.js", "gv-random-galaxy-0229.js"),
    ("gv-random-galaxy-0228.js", "gv-random-galaxy-0229.js"),
    ("RANDOM_GALAXY_VERSION='0227'", "RANDOM_GALAXY_VERSION='0229'"),
    ("RANDOM_GALAXY_VERSION='0228'", "RANDOM_GALAXY_VERSION='0229'"),
]
for old, new in replacements:
    c = viewer.count(old)
    print('VIEWER_REPLACE', old, c)
    if c > 1:
        raise SystemExit('FAIL viewer marker count >1: ' + old)
    if c == 1:
        viewer = viewer.replace(old, new, 1)
for marker in ["const VERSION='12AR-132BJ';", "const DISPLAY_VERSION='12AR-132BJ';", "gv-random-galaxy-0229.js", "RANDOM_GALAXY_VERSION='0229'", "gv-navigation-0022.js", "gv-avm-overlay-lab-0053.js"]:
    c = viewer.count(marker)
    print('VIEWER_REQUIRED', marker, c)
    if c < 1:
        raise SystemExit('FAIL missing viewer marker: ' + marker)
bj.write_text(viewer, encoding='utf-8', newline='\n')

rg = rg_src.read_text(encoding='utf-8')
old_block = """            const centerAuthority=gv0223ImageCenterFromWcs(wcs,actualWidth,actualHeight);
            const cameraRa=ra;
            const cameraDec=dec;"""
new_block = """            const centerAuthority=gv0223ImageCenterFromWcs(wcs,actualWidth,actualHeight);
            const centerRa=Number(centerAuthority&&centerAuthority.ra);
            const centerDec=Number(centerAuthority&&centerAuthority.dec);
            const cameraRa=Number.isFinite(centerRa)?centerRa:ra;
            const cameraDec=Number.isFinite(centerDec)?centerDec:dec;"""
c = rg.count(old_block)
print('RANDOM_BAD_BLOCK_COUNT', c)
if c != 1:
    raise SystemExit('FAIL random block count')
rg = rg.replace(old_block, new_block, 1)
vc = rg.count("const VERSION='0227';")
print('RANDOM_VERSION_0227_COUNT', vc)
if vc != 1:
    raise SystemExit('FAIL random version count')
rg = rg.replace("const VERSION='0227';", "const VERSION='0229';", 1)
header = """/*
RANDOM GALAXY 0229 - FORWARD-ONLY WCS IMAGE-CENTER CAMERA AUTHORITY REPAIR
BASELINE SOURCE: RANDOM GALAXY 0227
AUTHORIZED CHANGE:
- Use derived WCS geometric image center for precomputed AVM camera RA/Dec when available.
- Keep CRVAL/CRPIX/WCS metadata intact.
- No HD download, queue, catalog, navigation, AVM, vignette, or UI changes.
*/
"""
rg229.write_text(header + rg, encoding='utf-8', newline='\n')

ptr.write_text(json.dumps({'version':'12AR-132BJ','viewer':'GV-12AR-132BJ.py'}, indent=2) + '\n', encoding='utf-8', newline='\n')
print('FORWARD_ONLY_BJ_0229_SCRIPT_OK')
PY

      - name: Run forward patch
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/forward_bj.py
          git diff --check
          git status --short
          git add viewer/GV-12AR-132BJ.py viewer/modules/random-galaxy/gv-random-galaxy-0229.js viewer/gv-current-viewer.json
          git diff --cached --name-only | sort
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Advance to 132BJ with Random 0229 WCS camera authority repair'
          git push origin HEAD:beta
