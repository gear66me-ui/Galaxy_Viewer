name: Optimize Full Galaxy Image Collection

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/optimize-galaxy-image-collection.yml"

permissions:
  contents: read

concurrency:
  group: galaxy-image-full-optimization
  cancel-in-progress: false

jobs:
  optimize:
    name: Optimize shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Checkout release source of truth
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Download and optimize assigned mirrored images
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: "6"
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import collections, hashlib, io, json, os, pathlib, urllib.request, zipfile
          from PIL import Image, ImageOps
          manifest_path = pathlib.Path("viewer/image-databases/Hubble/mirror/image-mirror-manifest.json")
          raw_text = manifest_path.read_text(encoding="utf-8")
          decoder = json.JSONDecoder()
          manifest, end = decoder.raw_decode(raw_text.lstrip())
          records = [x for x in manifest.get("images", []) if x.get("sha256") and x.get("githubImageUrl")]
          shard, shards = int(os.environ["SHARD"]), int(os.environ["SHARDS"])
          assigned = [(idx, item) for idx, item in enumerate(records) if idx % shards == shard]
          out = pathlib.Path("optimized-output")
          out.mkdir(exist_ok=True)
          opener = urllib.request.build_opener()
          opener.addheaders = [("User-Agent", "GalaxyViewer-FullImageOptimizer/1.0")]
          report = []
          total_saved = 0
          with zipfile.ZipFile(out / f"galaxy-optimized-shard-{shard}.zip", "w", zipfile.ZIP_STORED, allowZip64=True) as zf:
            for index, item in assigned:
              url = item["githubImageUrl"]
              try:
                req = urllib.request.Request(url)
                with opener.open(req, timeout=60) as response:
                  raw = response.read(40*1024*1024 + 1)
                if len(raw) > 40*1024*1024:
                  raise ValueError("image exceeds 40 MiB safety limit")
                im = Image.open(io.BytesIO(raw))
                im.load()
                im = ImageOps.exif_transpose(im).convert("RGB")
                ow, oh = im.size
                resized = im.copy()
                resized.thumbnail((1536, 1536), Image.Resampling.LANCZOS)
                encoded, quality = None, None
                for q in (90, 87, 85, 82, 80, 77, 74, 70):
                  buf = io.BytesIO()
                  resized.save(buf, "JPEG", quality=q, optimize=True, progressive=True, subsampling=0)
                  candidate = buf.getvalue()
                  if encoded is None or len(candidate) < len(encoded):
                    encoded, quality = candidate, q
                  if len(candidate) <= 700*1024:
                    encoded, quality = candidate, q
                    break
                kept_original = len(encoded) >= len(raw)
                if kept_original:
                  encoded = raw
                  quality = "original-kept"
                  out_im = Image.open(io.BytesIO(raw))
                  out_im.load()
                  out_im = ImageOps.exif_transpose(out_im)
                  nw, nh = out_im.size
                else:
                  nw, nh = resized.size
                filename = item.get("filename") or (hashlib.sha256(url.encode()).hexdigest() + ".jpg")
                safe_name = pathlib.Path(filename).name
                # Hash-prefixed paths avoid collisions in the ZIP and keep deterministic mapping.
                digest = hashlib.sha256(url.encode()).hexdigest()
                zf.writestr(f"images/{digest}.jpg", encoded)
                entry = {
                  "manifestIndex": index, "provider": item.get("provider", "unknown"),
                  "sourceUrl": item.get("sourceUrl"), "originalMirrorUrl": url,
                  "optimizedFilename": f"images/{digest}.jpg", "sourceFilename": safe_name,
                  "originalWidth": ow, "originalHeight": oh, "optimizedWidth": nw, "optimizedHeight": nh,
                  "originalBytes": len(raw), "optimizedBytes": len(encoded), "quality": quality,
                  "keptOriginal": kept_original, "within700KiB": len(encoded) <= 700*1024,
                  "reductionPercent": round((1-len(encoded)/len(raw))*100, 1), "status": "ok"
                }
                total_saved += len(raw)-len(encoded)
              except Exception as e:
                entry = {"manifestIndex": index, "provider": item.get("provider", "unknown"),
                         "sourceUrl": item.get("sourceUrl"), "originalMirrorUrl": url,
                         "status": "error", "error": str(e)}
              report.append(entry)
              print(json.dumps(entry))
            zf.writestr("report.json", json.dumps(report, indent=2))
          (out / f"report-shard-{shard}.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          ok = [x for x in report if x.get("status") == "ok"]
          failed = [x for x in report if x.get("status") != "ok"]
          print(f"SHARD {shard} SUMMARY: assigned={len(assigned)} success={len(ok)} failed={len(failed)} under700KiB={sum(x['within700KiB'] for x in ok)} bytesSaved={total_saved}")
          if failed:
            print("Some images failed; artifacts and report retained for diagnosis.")
          PY

      - name: Upload optimized shard and audit report
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-optimized-shard-${{ matrix.shard }}
          path: optimized-output/
          retention-days: 30
          if-no-files-found: error
