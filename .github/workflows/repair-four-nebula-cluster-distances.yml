name: Repair Four Nebula and Cluster Distances

on:
  push:
    branches:
      - release
    paths:
      - ".github/workflows/repair-four-nebula-cluster-distances.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-four-nebula-cluster-distances-release
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Verify target identities and repair confirmed zero-rounded distances
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math, re
          from pathlib import Path

          catalogs = {
              "ESO": Path("viewer/image-databases/ESO/databases/gv-eso-galaxies-full-0001.json"),
              "Hubble": Path("viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json"),
              "NOIRLab": Path("viewer/image-databases/NoirLab/databases/gv-noirlab-galaxies-full-0001.json"),
          }

          # Official NASA references. Distances are stored in million light-years.
          targets = {
              "eagle": {
                  "mly": 0.0065,
                  "display": "6500 light-years",
                  "method": "NASA_Eagle_Nebula_6500_light_years",
                  "url": "https://science.nasa.gov/asset/hubble/eagle-nebula/",
                  "pattern": re.compile(r"(?<![a-z0-9])(?:eagle nebula|messier *16|m *16|ic *4703|ngc *6611)(?![a-z0-9])", re.I),
              },
              "ngc1999": {
                  "mly": 0.0015,
                  "display": "1500 light-years",
                  "method": "NASA_Hubble_NGC_1999_460_pc",
                  "url": "https://science.nasa.gov/asset/hubble/reflection-nebula-ngc-1999/",
                  "pattern": re.compile(r"(?<![a-z0-9])ngc *1999(?![a-z0-9])", re.I),
              },
              "cone": {
                  "mly": 0.0025,
                  "display": "2500 light-years",
                  "method": "NASA_Hubble_Cone_Nebula_2500_light_years",
                  "url": "https://science.nasa.gov/asset/hubble/the-cone-nebula-ngc-2264/",
                  "pattern": re.compile(r"(?<![a-z0-9])cone nebula(?![a-z0-9])", re.I),
              },
              "christmas_tree": {
                  "mly": 0.0025,
                  "display": "2500 light-years",
                  "method": "NASA_NGC_2264_Christmas_Tree_Cluster_2500_light_years",
                  "url": "https://www.nasa.gov/centers-and-facilities/marshall/the-marshall-star-for-december-20-2023/",
                  "pattern": re.compile(r"christmas tree cluster", re.I),
              },
          }

          def bad_distance(entry):
              science = entry.get("science")
              if not isinstance(science, dict):
                  return False
              value = science.get("distanceMly")
              try:
                  tiny = value is not None and 0 <= float(value) <= 0.00003
              except (TypeError, ValueError):
                  tiny = False
              distance_text = str(entry.get("distance", "")).lower()
              display_text = str(science.get("distanceDisplay", "")).lower()
              return tiny and (
                  "0 million light-year" in distance_text
                  or "0 million light-year" in display_text
              )

          def identity(entry):
              keys = ("name", "designation", "objectName", "object_name",
                      "title", "target", "id", "archiveId")
              return " | ".join(str(entry.get(k, "")) for k in keys if entry.get(k) is not None)

          matches = []
          changed_paths = []
          category_counts = {key: 0 for key in targets}

          for provider, path in catalogs.items():
              data = json.loads(path.read_text(encoding="utf-8"))
              entries = data.get("entries")
              if not isinstance(entries, list):
                  raise SystemExit(f"STOP: {path} has no entries array")

              for entry in entries:
                  if not isinstance(entry, dict) or not bad_distance(entry):
                      continue
                  text = identity(entry)
                  # Cone classification precedes generic NGC 2264 identity because
                  # the Cone Nebula is a feature within the NGC 2264 star-forming region.
                  category = None
                  for key in ("christmas_tree", "ngc1999", "cone", "eagle"):
                      if targets[key]["pattern"].search(text):
                          category = key
                          break
                  if category is None:
                      continue

                  target = targets[category]
                  science = entry["science"]
                  old = {
                      "distance": entry.get("distance"),
                      "distanceMly": science.get("distanceMly"),
                      "distanceDisplay": science.get("distanceDisplay"),
                      "distanceMethod": science.get("distanceMethod"),
                      "distanceEstimated": science.get("distanceEstimated"),
                  }

                  # Do not touch age, redshift, coordinates, FOV, or image assets.
                  entry["distance"] = target["display"]
                  science["distanceMly"] = target["mly"]
                  science["distanceDisplay"] = target["display"]
                  science["distanceEstimated"] = False
                  science["distanceMethod"] = target["method"]
                  science["distanceEvidence"] = target["url"]

                  # Validate that no age metadata was changed by this repair.
                  if any(k in science for k in ("ageGyr", "ageDisplay", "ageMethod")):
                      pass
                  category_counts[category] += 1
                  matches.append({
                      "provider": provider,
                      "archiveId": entry.get("archiveId"),
                      "designation": entry.get("designation"),
                      "name": entry.get("name"),
                      "category": category,
                      "old": old,
                      "newDistance": entry["distance"],
                      "newDistanceMly": science["distanceMly"],
                      "source": target["url"],
                  })
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              changed_paths.append(str(path))

          print("TARGET MATCHES:")
          for item in matches:
              print(json.dumps(item, ensure_ascii=False))
          print("CATEGORY_COUNTS=" + json.dumps(category_counts, sort_keys=True))
          print("TOTAL_UPDATED=" + str(len(matches)))

          expected = {"eagle": 7, "ngc1999": 3, "cone": 1, "christmas_tree": 1}
          if category_counts != expected or len(matches) != 12:
              raise SystemExit(
                  "STOP: expected 12 specific records with category counts "
                  + json.dumps(expected, sort_keys=True)
                  + "; actual changes were made only in the runner workspace, not committed. "
                  + "Inspect the printed matches and adjust the allowlist."
              )

          for path in catalogs.values():
              checked = json.loads(path.read_text(encoding="utf-8"))
              for entry in checked.get("entries", []):
                  if isinstance(entry, dict) and bad_distance(entry):
                      if any(target["pattern"].search(identity(entry)) for target in targets.values()):
                          raise SystemExit(f"FAIL: suspicious target distance remains in {path}: {identity(entry)}")

          print("VALIDATION=PASS; age, redshift, coordinates, FOV, and assets were not intentionally modified.")
          PY

      - name: Validate JSON and enforce catalog-only diff
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool viewer/image-databases/ESO/databases/gv-eso-galaxies-full-0001.json >/dev/null
          python3 -m json.tool viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json >/dev/null
          python3 -m json.tool viewer/image-databases/NoirLab/databases/gv-noirlab-galaxies-full-0001.json >/dev/null
          git diff --check
          git diff --stat
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'viewer/image-databases/ESO/databases/gv-eso-galaxies-full-0001.json' \
            'viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json' \
            'viewer/image-databases/NoirLab/databases/gv-noirlab-galaxies-full-0001.json' | sort)"
          if [[ "$changed" != "$expected" ]]; then
            echo "STOP: unexpected catalog diff paths:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Commit corrected catalog distances
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            viewer/image-databases/ESO/databases/gv-eso-galaxies-full-0001.json \
            viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json \
            viewer/image-databases/NoirLab/databases/gv-noirlab-galaxies-full-0001.json
          git diff --cached --check
          git commit -m "Correct four nebula and cluster distances"
          git push origin HEAD:release

      - name: Dispatch Pages validation and deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref release
