name: Mirror full Hubble galaxy archive to GitHub Releases

on:
  push:
    branches:
      - beta
    paths:
      - '.github/workflows/import-hubble-galaxy-archive.yml'

permissions:
  contents: write

env:
  RELEASE_A: 'hubble-galaxies-0001-a'
  RELEASE_B: 'hubble-galaxies-0001-b'
  CATALOG_PATH: 'viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0001.json'
  CATALOG_BASELINE_BLOB: 'e2de3105f1b5b82de0a4596c7de1cb0b0f111fd3'
  WORKFLOW_PATH: '.github/workflows/import-hubble-galaxy-archive.yml'
  RELEASE_A_CAP: '950'

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Mirror and verify all Hubble galaxy JPEGs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          TRIGGER_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet requests
          python3 - <<'PY'
          import base64
          import concurrent.futures
          import hashlib
          import json
          import os
          import tempfile
          import threading
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote

          import requests

          REPO = os.environ['GH_REPOSITORY']
          TOKEN = os.environ['GH_TOKEN']
          RELEASE_A = os.environ['RELEASE_A']
          RELEASE_B = os.environ['RELEASE_B']
          CATALOG_PATH = os.environ['CATALOG_PATH']
          CATALOG_BLOB = os.environ['CATALOG_BASELINE_BLOB']
          RELEASE_A_CAP = int(os.environ['RELEASE_A_CAP'])
          TRIGGER_COMMIT = os.environ['TRIGGER_COMMIT']

          API = f'https://api.github.com/repos/{REPO}'
          HEADERS = {
              'Authorization': f'Bearer {TOKEN}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          USER_AGENT = 'GalaxyViewerHubbleReleaseMirror/0001'
          lock = threading.Lock()

          def api_request(method, url, *, json_body=None, expected=(200,), retries=8):
              last = None
              for attempt in range(1, retries + 1):
                  try:
                      r = requests.request(
                          method, url, headers=HEADERS, json=json_body,
                          timeout=(30, 300), allow_redirects=True
                      )
                      if r.status_code in expected:
                          return r
                      last = RuntimeError(f'{method} {url} -> HTTP {r.status_code}: {r.text[:500]}')
                      if r.status_code not in (404, 408, 409, 429, 500, 502, 503, 504):
                          raise last
                  except requests.RequestException as exc:
                      last = exc
                  if attempt == retries:
                      break
                  retry_after = None
                  try:
                      retry_after = r.headers.get('Retry-After')
                  except Exception:
                      pass
                  delay = float(retry_after) if retry_after and retry_after.isdigit() else min(30, 2 ** min(attempt, 5))
                  time.sleep(delay)
              raise RuntimeError(f'GitHub API request failed after {retries} attempts: {last}')

          def load_catalog():
              r = api_request('GET', f'{API}/git/blobs/{CATALOG_BLOB}', expected=(200,))
              payload = r.json()
              if payload.get('sha') != CATALOG_BLOB:
                  raise RuntimeError(f'Catalog blob mismatch: {payload.get("sha")} != {CATALOG_BLOB}')
              raw = base64.b64decode(payload['content'])
              catalog = json.loads(raw.decode('utf-8'))
              entries = catalog.get('entries')
              if not isinstance(entries, list) or len(entries) != 1879:
                  raise RuntimeError(f'Catalog entries must equal 1879; got {len(entries) if isinstance(entries, list) else "invalid"}')
              names = []
              for entry in entries:
                  if entry.get('imageStatus') != 'downloaded':
                      raise RuntimeError(f'{entry.get("archiveId")}: catalog imageStatus is not downloaded')
                  name = entry.get('assetName') or f'{entry["archiveId"]}.jpg'
                  if not name.lower().endswith('.jpg'):
                      raise RuntimeError(f'{entry.get("archiveId")}: invalid asset name {name}')
                  if not entry.get('selectedImageUrl') or not entry.get('sha256') or not entry.get('bytes'):
                      raise RuntimeError(f'{entry.get("archiveId")}: incomplete source verification fields')
                  names.append(name)
              if len(set(names)) != 1879:
                  raise RuntimeError('Catalog asset names are not unique.')
              return catalog

          def get_release(tag):
              r = requests.get(f'{API}/releases/tags/{quote(tag)}', headers=HEADERS, timeout=(30, 120))
              if r.status_code == 404:
                  return None
              if r.status_code != 200:
                  raise RuntimeError(f'GET release {tag} -> HTTP {r.status_code}: {r.text[:500]}')
              return r.json()

          def create_release_b():
              body = (
                  'Galaxy Viewer mirror of official ESA/Hubble Galaxies archive JPEGs.\n\n'
                  'Files are exact-byte mirrors of the ESA/Hubble image variant recorded in '
                  f'`{CATALOG_PATH}`. Credits, source URLs, byte sizes and SHA-256 hashes are '
                  'preserved in that catalog. ESA/Hubble media usage: https://esahubble.org/copyright/ .'
              )
              payload = {
                  'tag_name': RELEASE_B,
                  'target_commitish': TRIGGER_COMMIT,
                  'name': 'Galaxy Viewer Hubble Galaxies 0001 B',
                  'body': body,
                  'draft': False,
                  'prerelease': False,
              }
              r = requests.post(f'{API}/releases', headers=HEADERS, json=payload, timeout=(30, 180))
              if r.status_code == 201:
                  release = r.json()
                  print(f'RELEASE_CREATED|{RELEASE_B}|id={release["id"]}')
                  return release
              if r.status_code == 422:
                  existing = get_release(RELEASE_B)
                  if existing:
                      print(f'RELEASE_RESUME|{RELEASE_B}|id={existing["id"]}')
                      return existing
              raise RuntimeError(f'Create release B -> HTTP {r.status_code}: {r.text[:500]}')

          def list_assets(release_id):
              assets = []
              page = 1
              while True:
                  r = api_request('GET', f'{API}/releases/{release_id}/assets?per_page=100&page={page}', expected=(200,))
                  batch = r.json()
                  assets.extend(batch)
                  if len(batch) < 100:
                      return assets
                  page += 1

          def hash_stream(response, *, write_path=None):
              h = hashlib.sha256()
              size = 0
              first = b''
              tail = b''
              f = open(write_path, 'wb') if write_path else None
              try:
                  for chunk in response.iter_content(chunk_size=1024 * 1024):
                      if not chunk:
                          continue
                      if not first:
                          first = chunk[:2]
                      tail = (tail + chunk)[-2:]
                      if f:
                          f.write(chunk)
                      h.update(chunk)
                      size += len(chunk)
              finally:
                  if f:
                      f.close()
              if first != b'\xff\xd8' or tail != b'\xff\xd9' or size <= 0:
                  raise RuntimeError('incomplete_or_empty_jpeg')
              return size, h.hexdigest()

          def download_esa(entry, path):
              expected_size = int(entry['bytes'])
              expected_sha = entry['sha256']
              url = entry['selectedImageUrl']
              last = None
              for attempt in range(1, 7):
                  try:
                      r = requests.get(
                          url,
                          headers={'User-Agent': USER_AGENT, 'Accept': 'image/jpeg', 'Cache-Control': 'no-cache'},
                          stream=True, timeout=(30, 600), allow_redirects=True
                      )
                      if r.status_code != 200:
                          raise RuntimeError(f'HTTP {r.status_code}')
                      ctype = (r.headers.get('Content-Type') or '').split(';', 1)[0].strip().lower()
                      if ctype and ctype not in ('image/jpeg', 'image/jpg'):
                          raise RuntimeError(f'content_type={ctype}')
                      size, sha = hash_stream(r, write_path=path)
                      if size != expected_size or sha != expected_sha:
                          raise RuntimeError(
                              f'ESA changed: expected {expected_size}/{expected_sha}, got {size}/{sha}'
                          )
                      return size, sha
                  except Exception as exc:
                      last = exc
                      try:
                          Path(path).unlink(missing_ok=True)
                      except Exception:
                          pass
                      if attempt < 6:
                          time.sleep(min(30, 2 ** attempt))
              raise RuntimeError(f'{entry["archiveId"]}: ESA verification failed: {last}')

          def upload_asset(release, path, name, asset_maps):
              upload_url = release['upload_url'].split('{', 1)[0]
              upload_headers = dict(HEADERS)
              upload_headers['Content-Type'] = 'image/jpeg'
              last = None
              for attempt in range(1, 7):
                  try:
                      with open(path, 'rb') as f:
                          r = requests.post(
                              upload_url, headers=upload_headers, params={'name': name},
                              data=f, timeout=(30, 1200)
                          )
                      if r.status_code == 201:
                          asset = r.json()
                          with lock:
                              asset_maps[release['tag_name']][name] = asset
                          return asset
                      if r.status_code == 422:
                          current = {a['name']: a for a in list_assets(release['id'])}
                          with lock:
                              asset_maps[release['tag_name']].update(current)
                          if name in current:
                              return current[name]
                      last = RuntimeError(f'HTTP {r.status_code}: {r.text[:500]}')
                      if r.status_code not in (408, 409, 422, 429, 500, 502, 503, 504):
                          raise last
                  except requests.RequestException as exc:
                      last = exc
                  if attempt < 6:
                      time.sleep(min(30, 2 ** attempt))
              raise RuntimeError(f'Upload failed for {name}: {last}')

          def verify_github_asset(entry, asset, expected_size, expected_sha):
              url = asset['browser_download_url']
              last = None
              for attempt in range(1, 9):
                  try:
                      r = requests.get(
                          url,
                          headers={'User-Agent': USER_AGENT, 'Cache-Control': 'no-cache'},
                          stream=True, timeout=(30, 600), allow_redirects=True
                      )
                      if r.status_code != 200:
                          raise RuntimeError(f'HTTP {r.status_code}')
                      size, sha = hash_stream(r)
                      if size != expected_size or sha != expected_sha:
                          raise RuntimeError(
                              f'GitHub mismatch: expected {expected_size}/{expected_sha}, got {size}/{sha}'
                          )
                      return url
                  except Exception as exc:
                      last = exc
                      if attempt < 8:
                          time.sleep(min(30, 2 ** attempt))
              raise RuntimeError(f'{entry["archiveId"]}: GitHub verification failed: {last}')

          catalog = load_catalog()
          entries = catalog['entries']
          by_name = {(e.get('assetName') or f'{e["archiveId"]}.jpg'): e for e in entries}

          release_a = get_release(RELEASE_A)
          if not release_a:
              raise RuntimeError(f'Required existing release is missing: {RELEASE_A}')
          release_b = get_release(RELEASE_B)
          if not release_b:
              release_b = create_release_b()

          assets_a = list_assets(release_a['id'])
          assets_b = list_assets(release_b['id'])
          maps = {
              RELEASE_A: {a['name']: a for a in assets_a},
              RELEASE_B: {a['name']: a for a in assets_b},
          }

          if len(maps[RELEASE_A]) != len(assets_a) or len(maps[RELEASE_B]) != len(assets_b):
              raise RuntimeError('Duplicate asset names detected in a release.')
          overlap = set(maps[RELEASE_A]) & set(maps[RELEASE_B])
          if overlap:
              raise RuntimeError(f'Assets duplicated across A and B: {sorted(overlap)[:10]}')
          unknown = (set(maps[RELEASE_A]) | set(maps[RELEASE_B])) - set(by_name)
          if unknown:
              raise RuntimeError(f'Existing release assets not present in catalog: {sorted(unknown)[:10]}')
          if len(maps[RELEASE_A]) > RELEASE_A_CAP:
              raise RuntimeError(f'Release A already exceeds safe cap {RELEASE_A_CAP}: {len(maps[RELEASE_A])}')

          assignment = {}
          for name in maps[RELEASE_A]:
              assignment[name] = RELEASE_A
          for name in maps[RELEASE_B]:
              assignment[name] = RELEASE_B

          a_slots = RELEASE_A_CAP - len(maps[RELEASE_A])
          for entry in entries:
              name = entry.get('assetName') or f'{entry["archiveId"]}.jpg'
              if name in assignment:
                  continue
              if a_slots > 0:
                  assignment[name] = RELEASE_A
                  a_slots -= 1
              else:
                  assignment[name] = RELEASE_B

          count_a = sum(1 for value in assignment.values() if value == RELEASE_A)
          count_b = sum(1 for value in assignment.values() if value == RELEASE_B)
          if count_a > RELEASE_A_CAP or count_a + count_b != 1879 or count_b >= 1000:
              raise RuntimeError(f'Unsafe release split: A={count_a}, B={count_b}')
          print(f'RELEASE_PLAN|A={count_a}|B={count_b}|existingA={len(assets_a)}|existingB={len(assets_b)}')

          releases = {RELEASE_A: release_a, RELEASE_B: release_b}
          results = [None] * len(entries)

          def process(item):
              index, entry = item
              name = entry.get('assetName') or f'{entry["archiveId"]}.jpg'
              tag = assignment[name]
              release = releases[tag]
              with tempfile.TemporaryDirectory(prefix='gv-hubble-mirror-') as td:
                  path = Path(td) / name
                  size, sha = download_esa(entry, path)
                  with lock:
                      asset = maps[tag].get(name)
                  if asset is None:
                      asset = upload_asset(release, path, name, maps)
                  elif int(asset.get('size') or 0) != size:
                      raise RuntimeError(
                          f'{entry["archiveId"]}: existing GitHub asset size {asset.get("size")} != ESA {size}'
                      )
                  digest = asset.get('digest')
                  if digest and digest != f'sha256:{sha}':
                      raise RuntimeError(
                          f'{entry["archiveId"]}: existing GitHub digest {digest} != sha256:{sha}'
                      )
                  github_url = verify_github_asset(entry, asset, size, sha)

              out = dict(entry)
              out['githubImageUrl'] = github_url
              out['releaseTag'] = tag
              out['assetName'] = name
              out['bytes'] = size
              out['sha256'] = sha
              return index, out

          completed = 0
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              future_map = {pool.submit(process, item): item for item in enumerate(entries)}
              for future in concurrent.futures.as_completed(future_map):
                  index, out = future.result()
                  results[index] = out
                  completed += 1
                  if completed % 25 == 0 or completed == len(entries):
                      with lock:
                          print(f'MIRROR_PROGRESS|{completed}/1879')

          if any(item is None for item in results):
              raise RuntimeError('Mirror result list contains missing records.')

          final_a = list_assets(release_a['id'])
          final_b = list_assets(release_b['id'])
          final_names = [a['name'] for a in final_a] + [a['name'] for a in final_b]
          if len(final_a) != count_a or len(final_b) != count_b:
              raise RuntimeError(
                  f'Final release counts differ from plan: A={len(final_a)}/{count_a}, B={len(final_b)}/{count_b}'
              )
          if len(final_names) != 1879 or len(set(final_names)) != 1879 or set(final_names) != set(by_name):
              raise RuntimeError('Final release asset set does not exactly equal the 1,879 catalog asset names.')

          catalog['entries'] = results
          catalog['githubMirror'] = {
              'verified': True,
              'verifiedAt': datetime.now(timezone.utc).isoformat(),
              'verifiedImageCount': 1879,
              'releaseA': {
                  'tag': RELEASE_A,
                  'assetCount': len(final_a),
                  'url': release_a['html_url'],
              },
              'releaseB': {
                  'tag': RELEASE_B,
                  'assetCount': len(final_b),
                  'url': release_b['html_url'],
              },
              'verification': 'ESA source bytes and GitHub download-back bytes match catalog SHA-256 and byte count for every image.',
          }

          out_path = Path('/tmp/gv-hubble-galaxies-full-0001-mirrored.json')
          out_path.write_text(json.dumps(catalog, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          sha = hashlib.sha256(out_path.read_bytes()).hexdigest()
          print(f'MIRROR_COMPLETE|verified=1879|A={len(final_a)}|B={len(final_b)}')
          print(f'CATALOG_READY|bytes={out_path.stat().st_size}|sha256={sha}')
          PY

      - name: Commit verified catalog and remove temporary importer
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/gv-hubble-galaxies-full-0001-mirrored.json

          rm -rf /tmp/gv-hubble-repo
          git init /tmp/gv-hubble-repo
          cd /tmp/gv-hubble-repo
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin beta
          git checkout -B beta FETCH_HEAD

          current_catalog_blob="$(git rev-parse HEAD:"$CATALOG_PATH")"
          if [ "$current_catalog_blob" != "$CATALOG_BASELINE_BLOB" ]; then
            echo "ERROR: catalog changed concurrently: $current_catalog_blob != $CATALOG_BASELINE_BLOB"
            exit 1
          fi

          current_workflow_blob="$(git rev-parse HEAD:"$WORKFLOW_PATH")"
          git fetch --depth=1 origin "${{ github.sha }}"
          trigger_workflow_blob="$(git rev-parse FETCH_HEAD:"$WORKFLOW_PATH")"
          if [ "$current_workflow_blob" != "$trigger_workflow_blob" ]; then
            echo "ERROR: importer changed concurrently: $current_workflow_blob != $trigger_workflow_blob"
            exit 1
          fi

          git checkout beta
          cp /tmp/gv-hubble-galaxies-full-0001-mirrored.json "$CATALOG_PATH"
          git rm "$WORKFLOW_PATH"
          git add "$CATALOG_PATH"

          mapfile -t changed < <(git diff --cached --name-only | sort)
          if [ "${#changed[@]}" -ne 2 ] || \
             [ "${changed[0]}" != "$WORKFLOW_PATH" ] || \
             [ "${changed[1]}" != "$CATALOG_PATH" ]; then
            echo "ERROR: staged paths outside authorized completion scope."
            printf '%s\n' "${changed[@]}"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete Hubble Galaxies GitHub Release mirror'

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:beta; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo 'ERROR: failed to push verified Hubble mirror catalog.'
              exit 1
            fi
            git fetch origin beta
            origin_catalog_blob="$(git rev-parse origin/beta:"$CATALOG_PATH")"
            origin_workflow_blob="$(git rev-parse origin/beta:"$WORKFLOW_PATH")"
            if [ "$origin_catalog_blob" != "$CATALOG_BASELINE_BLOB" ] || \
               [ "$origin_workflow_blob" != "$trigger_workflow_blob" ]; then
              echo 'ERROR: authorized Hubble paths changed concurrently; refusing rebase.'
              exit 1
            fi
            git rebase origin/beta
            mapfile -t delta < <(git diff --name-only origin/beta...HEAD | sort)
            if [ "${#delta[@]}" -ne 2 ] || \
               [ "${delta[0]}" != "$WORKFLOW_PATH" ] || \
               [ "${delta[1]}" != "$CATALOG_PATH" ]; then
              echo 'ERROR: post-rebase delta escaped authorized Hubble scope.'
              printf '%s\n' "${delta[@]}"
              exit 1
            fi
          done

          final_commit="$(git rev-parse HEAD)"
          catalog_blob="$(git rev-parse HEAD:"$CATALOG_PATH")"
          catalog_sha256="$(sha256sum "$CATALOG_PATH" | awk '{print $1}')"
          echo "FINAL_COMMIT|$final_commit"
          echo "CATALOG_BLOB|$catalog_blob"
          echo "CATALOG_SHA256|$catalog_sha256"
          echo "CHANGED_PATH|$WORKFLOW_PATH"
          echo "CHANGED_PATH|$CATALOG_PATH"
