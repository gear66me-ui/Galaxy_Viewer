name: Surgical 10E catalog repair
'on':
  push:
    branches: [beta]
    paths: [.github/workflows/surgical-10e-catalog-20260817.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Apply exact approved changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          cp=Path('viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0017.json')
          vp=Path('viewer/GV-beta-0010E.py')
          d=json.loads(cp.read_text())
          rs=d if isinstance(d,list) else next(v for k,v in d.items() if isinstance(v,list) and len(v)==1879)
          assert len(rs)==1879
          def aid(a):
              m=[r for r in rs if str(r.get('archiveId','')).lower()==a.lower()]
              assert len(m)==1,(a,len(m)); return m[0]
          pairs=[('potw1352a','potw1352a'),('opo9842a','heic0819b'),('potw2116a','potw2116a'),('opo9734c','potw1345a')]
          keys=('pixelWidth','pixelHeight','width','height','fovArcmin','fovWidthArcmin','fovHeightArcmin','fov','sourceUrl','esaUrl','publicationImage','imageUrl','selectedImageUrl','hdUrl','githubImageUrl','assetFilename','byteCount','imageSha256','downloadError','credit','orientation','sizeKly','sizeLightYears','sizeLy','imageSizeLy','imageSpanLightYears','imageSpanKly','sizeEstimated','sizeMethod','sizeSource')
          for dstid,srcid in pairs:
              dst,src=aid(dstid),aid(srcid)
              copied=[]
              for k in keys:
                  if k in src: dst[k]=src[k]; copied.append(k)
              dst['imageReplacement0017']={'replacementArchiveId':srcid,'replacesPresentationForArchiveId':dstid,'reason':'user-approved color/full-frame Hubble presentation','copiedImageMetadataFields':copied}
          cp.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          s=vp.read_text()
          marker="const DISPLAY_VERSION='10E';"
          assert s.count(marker)==1
          inject=marker+'''\n    const relabelImageSize=()=>{\n      document.querySelectorAll('.gvrg-field-label').forEach((el)=>{\n        if((el.textContent||'').trim().toUpperCase()==='SIZE'){\n          el.innerHTML='IMAGE SIZE<br><span style="font-size:.72em;letter-spacing:.25px">(FOV)</span>';\n        }\n      });\n    };\n    const imageSizeLabelObserver=new MutationObserver(relabelImageSize);\n    imageSizeLabelObserver.observe(document.documentElement,{subtree:true,childList:true});\n    relabelImageSize();'''
          vp.write_text(s.replace(marker,inject,1))
          PY
          python -m py_compile viewer/GV-beta-0010E.py
          grep -q 'IMAGE SIZE' viewer/GV-beta-0010E.py
          grep -q '(FOV)' viewer/GV-beta-0010E.py
          test "$(git hash-object viewer/modules/gv-random-galaxy-0030.js)" = c17d7c8d48e71b7e91ac3ed28ee3c55786a82385
          git status --short
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add viewer/GV-beta-0010E.py viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0017.json
          git diff --cached --name-only | sort > /tmp/a
          printf '%s\n' viewer/GV-beta-0010E.py viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0017.json | sort > /tmp/b
          diff -u /tmp/b /tmp/a
          git commit -m 'Update four Hubble presentations and image FOV label'
          git pull --rebase origin beta
          git push origin HEAD:beta
