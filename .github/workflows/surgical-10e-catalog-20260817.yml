name: Surgical 10E catalog repair
'on':
  push:
    branches:
      - beta
    paths:
      - .github/workflows/surgical-10e-catalog-20260817.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Apply approved changes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/repair.py <<'PY'
          import json
          from pathlib import Path
          cp=Path('viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0017.json')
          vp=Path('viewer/GV-beta-0010E.py')
          d=json.loads(cp.read_text())
          rs=d if isinstance(d,list) else d.get('records') or d.get('galaxies') or d.get('items')
          assert len(rs)==1879
          def text(r): return ' '.join(str(r.get(k,'')) for k in ('archiveId','name','title','designation','objectName','pseudoName')).lower()
          def one(pred,label):
              m=[r for r in rs if pred(r)]
              assert len(m)==1,(label,len(m),[(x.get('archiveId'),x.get('title')) for x in m[:12]])
              return m[0]
          def aid(a): return one(lambda r:str(r.get('archiveId','')).lower()==a.lower(),a)
          pairs=[
            (one(lambda r:'messier 65 through the years' in text(r),'M65'),aid('potw1352a')),
            (one(lambda r:'behind a dusty veil' in text(r),'NGC253'),aid('heic0819b')),
            (one(lambda r:'galactic close-up' in text(r) and '4603' in text(r),'NGC4603'),aid('potw2116a')),
            (one(lambda r:'ground-based image' in text(r) and ('4038' in text(r) or 'antennae' in text(r)),'Antennae'),aid('potw1345a')),
          ]
          keys=('pixelWidth','pixelHeight','width','height','fovArcmin','fovWidthArcmin','fovHeightArcmin','fov','sourceUrl','esaUrl','publicationImage','imageUrl','selectedImageUrl','hdUrl','githubImageUrl','assetFilename','byteCount','imageSha256','downloadError','credit','orientation','sizeKly','sizeLightYears','sizeLy','imageSizeLy','imageSpanLightYears','imageSpanKly','sizeEstimated','sizeMethod','sizeSource')
          for dst,src in pairs:
              old=dst.get('archiveId'); copied=[]
              for k in keys:
                  if k in src: dst[k]=src[k]; copied.append(k)
              dst['imageReplacement0017']={'replacementArchiveId':src['archiveId'],'replacesPresentationForArchiveId':old,'reason':'approved better color/full-frame Hubble presentation','copiedImageMetadataFields':copied}
          cp.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          s=vp.read_text()
          marker="const DISPLAY_VERSION='10E';"
          assert s.count(marker)==1
          inject=marker+"\n    const relabelImageSize=()=>{document.querySelectorAll('.gvrg-field-label').forEach((el)=>{if((el.textContent||'').trim().toUpperCase()==='SIZE'){el.innerHTML='IMAGE SIZE<br><span style=\\\"font-size:.72em;letter-spacing:.25px\\\">(FOV)</span>';}});};\n    const imageSizeLabelObserver=new MutationObserver(relabelImageSize);\n    imageSizeLabelObserver.observe(document.documentElement,{subtree:true,childList:true});\n    relabelImageSize();"
          vp.write_text(s.replace(marker,inject,1))
          PY
          python /tmp/repair.py
          python -m py_compile viewer/GV-beta-0010E.py
          test "$(git hash-object viewer/modules/gv-random-galaxy-0030.js)" = c17d7c8d48e71b7e91ac3ed28ee3c55786a82385
          test "$(git status --porcelain | grep -E '^ M viewer/' | wc -l)" -eq 2
          git status --short
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add viewer/GV-beta-0010E.py viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0017.json
          git commit -m 'Update four Hubble images and image FOV label'
          git pull --rebase origin beta
          git push origin HEAD:beta
