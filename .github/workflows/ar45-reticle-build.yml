name: AR45 Full Viewer Reticle Build
on:
  push:
    branches: [beta]
    paths: ['.github/ar45-reticle-trigger']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: beta}
      - name: Build AR45 from full AR41 baseline
        run: |
          python - <<'PY'
          from pathlib import Path

          src = Path('viewer/GV-beta-0012AR-41.py')
          dst = Path('viewer/GV-beta-0012AR-45.py')
          p = src.read_text()

          # AR45 must remain the readable/full AR41 lineage, not the compact AR44 formatting.
          if len(p.splitlines()) < 1300:
              raise SystemExit('AR41 baseline unexpectedly compact or incomplete')
          p = p.replace('12AR-41', '12AR-45')

          # Port only the validated AR44 reference-frame correction.
          old = "        cooFrame:'galactic',"
          new = "        cooFrame:'ICRSd',"
          if p.count(old) != 1:
              raise SystemExit(f'cooFrame anchor count {p.count(old)}')
          p = p.replace(old, new, 1)

          old = "    if(typeof aladin.setFrame==='function')aladin.setFrame('galactic');"
          new = "    if(typeof aladin.setFrame==='function')aladin.setFrame('ICRSd');"
          if p.count(old) != 1:
              raise SystemExit(f'initial frame anchor count {p.count(old)}')
          p = p.replace(old, new, 1)

          old = """    let frame='GAL',latestRa=HOME.ra,latestDec=HOME.dec;
    let coordinate=null;
    function renderCoordinates(){
        if(!coordinate)return;
        const shown=frame==='GAL'?equatorialToGalactic(latestRa,latestDec):[latestRa,latestDec];
        coordinate.setFrame(frame);
        coordinate.update(shown[0],shown[1]);
    }
    coordinate=window.GalaxyCoordinateOverlay.mount(coordinateHost,{onFrameChange(nextFrame){
        frame=nextFrame;
        try{if(typeof aladin.setFrame==='function')aladin.setFrame(frame==='GAL'?'galactic':'ICRSd')}catch(error){console.warn('GALAXY VIEWER FRAME CHANGE WARNING',error)}
        renderCoordinates();
    }});"""
          new = """    let frame='ICRSD',latestRa=HOME.ra,latestDec=HOME.dec;
    let coordinate=null;
    function renderCoordinates(){
        if(!coordinate)return;
        coordinate.setFrame('ICRSD');
        coordinate.update(latestRa,latestDec);
    }
    coordinate=window.GalaxyCoordinateOverlay.mount(coordinateHost,{onFrameChange(){
        frame='ICRSD';
        try{if(typeof aladin.setFrame==='function')aladin.setFrame('ICRSd')}catch(error){console.warn('GALAXY VIEWER FRAME CHANGE WARNING',error)}
        coordinate?.setFrame('ICRSD');
        renderCoordinates();
    }});"""
          if p.count(old) != 1:
              raise SystemExit(f'coordinate lock anchor count {p.count(old)}')
          p = p.replace(old, new, 1)

          # Production cosmic-blue reticle container replaces only the tiny presentation shell.
          old = '#gv-center-reticle{position:absolute;left:50%;top:50%;z-index:7050;width:32px;height:32px;transform:translate(-50%,-50%);pointer-events:none;user-select:none;-webkit-user-select:none}\n#gv-center-reticle img{display:block;width:32px;height:32px}'
          new = '#gv-center-reticle{position:absolute;left:50%;top:50%;z-index:7050;width:270px;height:270px;transform:translate(-50%,-50%);pointer-events:none;user-select:none;-webkit-user-select:none}\n#gv-center-reticle img{display:block;width:32px;height:32px}'
          if p.count(old) != 1:
              raise SystemExit(f'reticle css anchor count {p.count(old)}')
          p = p.replace(old, new, 1)

          old = """    function createCenterReticle(root){
        const reticle=document.createElement('div');
        reticle.id='gv-center-reticle';
        reticle.setAttribute('aria-hidden','true');
        const image=document.createElement('img');
        image.src=RETICLE_URL;
        image.alt='';
        image.width=32;
        image.height=32;
        reticle.appendChild(image);
        root.appendChild(reticle);
        return reticle;
    }"""
          new = """    function createCenterReticle(root){
        const COSMIC_BLUE='#58BFFF';
        const COSMIC_BLUE_SOFT='rgba(88,191,255,.72)';
        const SIZE=270;
        const CENTER=SIZE/2;
        const RING_RADIUS=125;
        const POINTER_CENTER_RADIUS=RING_RADIUS-6;
        const LABEL_RADIUS=RING_RADIUS+25;

        const reticle=document.createElement('div');
        reticle.id='gv-center-reticle';
        reticle.setAttribute('aria-hidden','true');

        const ring=document.createElement('div');
        ring.id='gv-direction-ring';
        Object.assign(ring.style,{
            position:'absolute',
            left:'50%',
            top:'50%',
            width:`${RING_RADIUS*2}px`,
            height:`${RING_RADIUS*2}px`,
            transform:'translate(-50%,-50%)',
            border:`1px solid ${COSMIC_BLUE_SOFT}`,
            borderRadius:'50%',
            boxShadow:'0 0 5px rgba(88,191,255,.28), inset 0 0 5px rgba(88,191,255,.10)',
            boxSizing:'border-box'
        });
        reticle.appendChild(ring);

        for(let angle=0;angle<360;angle+=30){
            const major=angle%90===0;
            const length=major?14:7;
            const radians=angle*Math.PI/180;
            const radius=RING_RADIUS-length/2;
            const tick=document.createElement('div');
            tick.className=major?'gv-reticle-tick gv-reticle-tick-major':'gv-reticle-tick gv-reticle-tick-minor';
            Object.assign(tick.style,{
                position:'absolute',
                left:`${CENTER+Math.sin(radians)*radius}px`,
                top:`${CENTER-Math.cos(radians)*radius}px`,
                width:major?'2px':'1px',
                height:`${length}px`,
                transform:`translate(-50%,-50%) rotate(${angle}deg)`,
                transformOrigin:'50% 50%',
                background:COSMIC_BLUE,
                boxShadow:major?'0 0 5px rgba(88,191,255,.72)':'0 0 3px rgba(88,191,255,.48)',
                borderRadius:'2px'
            });
            reticle.appendChild(tick);
        }

        const horizontal=document.createElement('div');
        const vertical=document.createElement('div');
        Object.assign(horizontal.style,{
            position:'absolute',left:'50%',top:'50%',width:'34px',height:'1px',
            transform:'translate(-50%,-50%)',background:COSMIC_BLUE,
            boxShadow:'0 0 4px rgba(88,191,255,.64)',opacity:'.86'
        });
        Object.assign(vertical.style,{
            position:'absolute',left:'50%',top:'50%',width:'1px',height:'34px',
            transform:'translate(-50%,-50%)',background:COSMIC_BLUE,
            boxShadow:'0 0 4px rgba(88,191,255,.64)',opacity:'.86'
        });
        reticle.append(horizontal,vertical);

        const image=document.createElement('img');
        image.src=RETICLE_URL;
        image.alt='';
        image.width=32;
        image.height=32;
        Object.assign(image.style,{
            position:'absolute',left:'50%',top:'50%',transform:'translate(-50%,-50%)',
            filter:'drop-shadow(0 0 4px rgba(88,191,255,.88))'
        });
        reticle.appendChild(image);

        const makeTriangle=id=>{
            const marker=document.createElement('div');
            marker.id=id;
            Object.assign(marker.style,{
                position:'absolute',width:'12px',height:'12px',
                background:COSMIC_BLUE,
                clipPath:'polygon(50% 0,100% 100%,0 100%)',
                filter:'drop-shadow(0 0 4px rgba(88,191,255,.95))',
                display:'none'
            });
            reticle.appendChild(marker);
            return marker;
        };

        const northPointer=makeTriangle('gv-north-pointer');
        const earthPointer=makeTriangle('gv-earth-pointer');

        const northLabel=document.createElement('div');
        northLabel.id='gv-north-label';
        northLabel.textContent='N';
        Object.assign(northLabel.style,{
            position:'absolute',display:'none',color:COSMIC_BLUE,
            font:'400 15px/1 "Space Age",sans-serif',letterSpacing:'1px',
            textShadow:'0 0 4px #dff7ff,0 0 8px rgba(88,191,255,.95)',
            whiteSpace:'nowrap',textAlign:'center'
        });
        reticle.appendChild(northLabel);

        const earthIcon=document.createElement('div');
        earthIcon.id='gv-earth-icon';
        earthIcon.textContent='🌎';
        Object.assign(earthIcon.style,{
            position:'absolute',display:'none',font:'18px/1 sans-serif',
            width:'22px',height:'22px',textAlign:'center',
            filter:'drop-shadow(0 0 3px #dff7ff) drop-shadow(0 0 7px rgba(88,191,255,.95))',
            whiteSpace:'nowrap'
        });
        reticle.appendChild(earthIcon);

        reticle.gvDirectional=Object.freeze({
            center:CENTER,
            pointerCenterRadius:POINTER_CENTER_RADIUS,
            labelRadius:LABEL_RADIUS,
            northPointer,
            northLabel,
            earthPointer,
            earthIcon
        });

        root.appendChild(reticle);
        return reticle;
    }"""
          if p.count(old) != 1:
              raise SystemExit(f'createCenterReticle anchor count {p.count(old)}')
          p = p.replace(old, new, 1)

          # Port the AR44 celestial-north calculation and add an independent Earth bearing.
          anchor = """        return null;
    }

    const galaxyCatalogPromise=loadCombinedGalaxyCatalog();"""
          insert = """        return null;
    }

    function readCelestialNorthBearing(aladin,root){
        try{
            if(typeof aladin.world2pix!=='function')return null;
            const center=readCurrentRaDec(aladin,root);
            if(!center)return null;
            const ra=Number(center[0]),dec=Number(center[1]);
            if(!Number.isFinite(ra)||!Number.isFinite(dec)||dec>=89.999999)return null;
            let fov=1;
            try{const value=aladin.getFov?.();fov=Number(Array.isArray(value)?value[0]:value)}catch(_){}
            if(!Number.isFinite(fov)||fov<=0)fov=1;
            const delta=Math.max(1e-6,Math.min(.01,fov*.08,(90-dec)*.25));
            const p0=aladin.world2pix(ra,dec,'ICRSd');
            const pN=aladin.world2pix(ra,dec+delta,'ICRSd');
            const x0=Number(p0?.[0]),y0=Number(p0?.[1]),xN=Number(pN?.[0]),yN=Number(pN?.[1]);
            if(![x0,y0,xN,yN].every(Number.isFinite))return null;
            const dx=xN-x0,dy=yN-y0;
            if(Math.hypot(dx,dy)<1e-9)return null;
            return (Math.atan2(dx,-dy)*180/Math.PI+360)%360;
        }catch(error){
            console.warn('GALAXY VIEWER NORTH POINTER WARNING',error);
            return null;
        }
    }

    function readEarthBearing(aladin,root){
        try{
            if(typeof aladin.world2pix!=='function')return null;
            const center=readCurrentRaDec(aladin,root);
            if(!center)return null;
            const ra1=Number(center[0]),dec1=Number(center[1]);
            const ra2=Number(HOME.ra),dec2=Number(HOME.dec);
            if(![ra1,dec1,ra2,dec2].every(Number.isFinite))return null;

            const d=Math.PI/180;
            const dec1r=dec1*d,dec2r=dec2*d;
            let dra=(ra2-ra1)*d;
            while(dra>Math.PI)dra-=Math.PI*2;
            while(dra<-Math.PI)dra+=Math.PI*2;

            const separationCos=
                Math.sin(dec1r)*Math.sin(dec2r)+
                Math.cos(dec1r)*Math.cos(dec2r)*Math.cos(dra);
            const separation=Math.acos(Math.max(-1,Math.min(1,separationCos)));
            if(separation<1e-10)return null;

            const pa=Math.atan2(
                Math.sin(dra)*Math.cos(dec2r),
                Math.cos(dec1r)*Math.sin(dec2r)-
                Math.sin(dec1r)*Math.cos(dec2r)*Math.cos(dra)
            );

            let fov=1;
            try{const value=aladin.getFov?.();fov=Number(Array.isArray(value)?value[0]:value)}catch(_){}
            if(!Number.isFinite(fov)||fov<=0)fov=1;
            const delta=Math.max(1e-6,Math.min(.01,fov*.08));
            const p0=aladin.world2pix(ra1,dec1,'ICRSd');
            const pN=aladin.world2pix(ra1,Math.min(89.999999,dec1+delta),'ICRSd');
            const cosDec=Math.max(.02,Math.abs(Math.cos(dec1r)));
            const pE=aladin.world2pix((ra1+delta/cosDec+360)%360,dec1,'ICRSd');
            const x0=Number(p0?.[0]),y0=Number(p0?.[1]);
            let nx=Number(pN?.[0])-x0,ny=Number(pN?.[1])-y0;
            let ex=Number(pE?.[0])-x0,ey=Number(pE?.[1])-y0;
            const nl=Math.hypot(nx,ny),el=Math.hypot(ex,ey);
            if(![nx,ny,ex,ey,nl,el].every(Number.isFinite)||nl<1e-9||el<1e-9)return null;
            nx/=nl;ny/=nl;ex/=el;ey/=el;

            const dx=Math.cos(pa)*nx+Math.sin(pa)*ex;
            const dy=Math.cos(pa)*ny+Math.sin(pa)*ey;
            if(Math.hypot(dx,dy)<1e-9)return null;
            return (Math.atan2(dx,-dy)*180/Math.PI+360)%360;
        }catch(error){
            console.warn('GALAXY VIEWER EARTH POINTER WARNING',error);
            return null;
        }
    }

    const galaxyCatalogPromise=loadCombinedGalaxyCatalog();"""
          if p.count(anchor) != 1:
              raise SystemExit(f'directional math anchor count {p.count(anchor)}')
          p = p.replace(anchor, insert, 1)

          # Start the two live, independent pointers after the production reticle exists.
          anchor = """    const reticle=createCenterReticle(root);
    const bottom=createBottomControls(root);

    // Generic Aladin physical field scale."""
          insert = """    const reticle=createCenterReticle(root);
    const bottom=createBottomControls(root);

    function setDirectionalMarker(pointer,label,bearing){
        const state=reticle.gvDirectional;
        if(!state||!Number.isFinite(bearing)){
            if(pointer)pointer.style.display='none';
            if(label)label.style.display='none';
            return;
        }
        const radians=bearing*Math.PI/180;
        const px=state.center+Math.sin(radians)*state.pointerCenterRadius;
        const py=state.center-Math.cos(radians)*state.pointerCenterRadius;
        pointer.style.left=`${px}px`;
        pointer.style.top=`${py}px`;
        pointer.style.transform=`translate(-50%,-50%) rotate(${bearing}deg)`;
        pointer.style.display='block';

        const lx=state.center+Math.sin(radians)*state.labelRadius;
        const ly=state.center-Math.cos(radians)*state.labelRadius;
        label.style.left=`${lx}px`;
        label.style.top=`${ly}px`;
        label.style.transform='translate(-50%,-50%)';
        label.style.display='block';
    }

    const updateDirectionalReticle=()=>{
        const state=reticle.gvDirectional;
        if(!state)return;
        setDirectionalMarker(
            state.northPointer,
            state.northLabel,
            readCelestialNorthBearing(aladin,root)
        );
        setDirectionalMarker(
            state.earthPointer,
            state.earthIcon,
            readEarthBearing(aladin,root)
        );
    };
    updateDirectionalReticle();
    const directionalReticleTimer=setInterval(updateDirectionalReticle,100);
    window.addEventListener('beforeunload',()=>clearInterval(directionalReticleTimer),{once:true});

    // Generic Aladin physical field scale."""
          if p.count(anchor) != 1:
              raise SystemExit(f'directional UI anchor count {p.count(anchor)}')
          p = p.replace(anchor, insert, 1)

          # The existing forensic rotation readout belongs to the same instrument palette.
          p = p.replace("  color:'#78FFAB',\n  font:'700 11px/1.2 monospace',", "  color:'#58BFFF',\n  font:'700 11px/1.2 monospace',", 1)
          p = p.replace("  textShadow:'0 0 4px rgba(120,255,171,.55)',", "  textShadow:'0 0 4px rgba(88,191,255,.72)',", 1)

          dst.write_text(p)

          # Static gates: full source preserved, frame fix present, no diagnostic NORTH banner.
          q = dst.read_text()
          checks = {
              'full-source line count': len(q.splitlines()) >= 1450,
              'AR45 version': "const VERSION='12AR-45';" in q,
              'ICRSd startup': "cooFrame:'ICRSd'" in q and "setFrame('ICRSd')" in q,
              'no galactic startup': "cooFrame:'galactic'" not in q,
              'north solver': 'function readCelestialNorthBearing' in q,
              'earth solver': 'function readEarthBearing' in q,
              'blue ring': "const COSMIC_BLUE='#58BFFF'" in q,
              'north marker': "northLabel.textContent='N'" in q,
              'earth icon': "earthIcon.textContent='🌎'" in q,
              'no AR44 north banner': "northMarker.textContent='NORTH'" not in q,
          }
          bad = [name for name, ok in checks.items() if not ok]
          if bad:
              raise SystemExit('AR45 STATIC GATE FAILED: ' + ', '.join(bad))
          print('AR45 BUILD STATIC GATES PASS')
          print('AR41 LINES:', len(src.read_text().splitlines()))
          print('AR45 LINES:', len(q.splitlines()))
          PY
          python -m py_compile viewer/GV-beta-0012AR-45.py
          git diff --check
          grep -q "const VERSION='12AR-45';" viewer/GV-beta-0012AR-45.py
          grep -q "function readCelestialNorthBearing" viewer/GV-beta-0012AR-45.py
          grep -q "function readEarthBearing" viewer/GV-beta-0012AR-45.py
          grep -q "northLabel.textContent='N'" viewer/GV-beta-0012AR-45.py
          grep -q "earthIcon.textContent='🌎'" viewer/GV-beta-0012AR-45.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/GV-beta-0012AR-45.py
          git commit -m 'AR45 full AR41 baseline with ICRSd and cosmic directional reticle'
          git push origin beta