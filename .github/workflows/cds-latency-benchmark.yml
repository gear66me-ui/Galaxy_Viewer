name: CDS latency benchmark

on:
  push:
    branches: [beta]
    paths:
      - ".github/workflows/cds-latency-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Run sequential CDS benchmark
        shell: bash
        run: |
          set -u
          OUT="$GITHUB_WORKSPACE/cds-latency-results.csv"
          echo 'endpoint,resource,attempt,http_code,remote_ip,dns_seconds,connect_seconds,tls_seconds,ttfb_seconds,total_seconds,bytes,error,url' > "$OUT"

          urls=(
            'CDS primary|DSS properties|https://alasky.cds.unistra.fr/DSS/DSSColor/properties'
            'CDS primary|Low-resolution sample tile|https://alasky.cds.unistra.fr/DSS/DSSColor/Norder3/Dir0/Npix0.jpg'
            'CDS primary|M31 order 6 tile|https://alasky.cds.unistra.fr/DSS/DSSColor/Norder6/Dir0/Npix2709.jpg'
            'CDS primary|M31 order 9 tile|https://alasky.cds.unistra.fr/DSS/DSSColor/Norder9/Dir170000/Npix173380.jpg'
            'CDS alternate|DSS properties|https://alasky.u-strasbg.fr/DSS/DSSColor/properties'
            'CDS alternate|Low-resolution sample tile|https://alasky.u-strasbg.fr/DSS/DSSColor/Norder3/Dir0/Npix0.jpg'
            'CDS alternate|M31 order 6 tile|https://alasky.u-strasbg.fr/DSS/DSSColor/Norder6/Dir0/Npix2709.jpg'
            'CDS alternate|M31 order 9 tile|https://alasky.u-strasbg.fr/DSS/DSSColor/Norder9/Dir170000/Npix173380.jpg'
          )

          for item in "${urls[@]}"; do
            IFS='|' read -r endpoint resource url <<< "$item"
            for attempt in 1 2 3 4 5; do
              echo "Testing: $endpoint | $resource | attempt $attempt"
              tmp_body="$(mktemp)"
              tmp_err="$(mktemp)"
              metrics="$(curl --silent --show-error --location \
                --connect-timeout 10 --max-time 30 \
                --output "$tmp_body" \
                --write-out '%{http_code},%{remote_ip},%{time_namelookup},%{time_connect},%{time_appconnect},%{time_starttransfer},%{time_total},%{size_download}' \
                "$url" 2>"$tmp_err")"
              rc=$?
              error="$(tr '\n' ' ' < "$tmp_err" | sed 's/"/""/g')"
              endpoint_csv="${endpoint//\"/\"\"}"
              resource_csv="${resource//\"/\"\"}"
              url_csv="${url//\"/\"\"}"
              printf '"%s","%s",%s,%s,"%s","%s"\n' \
                "$endpoint_csv" "$resource_csv" "$attempt" "$metrics" "$error" "$url_csv" >> "$OUT"
              echo "  curl exit=$rc metrics=$metrics error=$error"
              rm -f "$tmp_body" "$tmp_err"
            done
          done

          echo
          echo '===== CDS LATENCY RESULTS ====='
          column -s, -t "$OUT" || cat "$OUT"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: cds-latency-results
          path: cds-latency-results.csv
          if-no-files-found: error
