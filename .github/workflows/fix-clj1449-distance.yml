name: Fix CL J1449+0856 Distance

# Guarded repair for the Hubble image centered on CL J1449+0856.
# Published identity: RA 222.3083 deg, Dec +8.9392 deg, z ~= 1.99.
# Source: https://academic.oup.com/mnras/article/486/3/4304/5470973
# The published overview describes the cluster as about 10 billion light-years away.
# Store this documented approximate light-travel distance in Mly (10,000 Mly),
# matching Galaxy Viewer's catalog convention. Only exact coordinate/name matches
# may be changed; all unrelated fields are preserved.

on:
  push:
    branches: [release]
    paths:
      - ".github/workflows/fix-clj1449-distance.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-distance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Repair only the verified CL J1449+0856 record
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math
          from pathlib import Path

          paths = [
              Path("viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json"),
              Path("viewer/image-databases/JWST/databases/gv-jwst-galaxies-full-0007-AVM-ESA-FOV.json"),
              Path("viewer/image-databases/ESO/databases/gv-eso-galaxies-full-0001.json"),
              Path("viewer/image-databases/Chandra/databases/gv-chandra-galaxies-full-0007.json"),
              Path("viewer/image-databases/Spitzer/databases/gv-spitzer-galaxies-full-0011.json"),
              Path("viewer/image-databases/NoirLab/databases/gv-noirlab-galaxies-full-0001.json"),
          ]
          target_ra, target_dec = 222.3083, 8.9392
          tolerance_deg = 0.025
          found = []

          def angular_sep_deg(ra, dec):
              ra1, dec1, ra2, dec2 = map(math.radians, (target_ra, target_dec, ra, dec))
              a = math.sin((dec2-dec1)/2)**2 + math.cos(dec1)*math.cos(dec2)*math.sin((ra2-ra1)/2)**2
              return math.degrees(2*math.asin(min(1, math.sqrt(a))))

          for path in paths:
              if not path.exists():
                  continue
              data = json.loads(path.read_text(encoding="utf-8"))
              entries = data.get("entries")
              if not isinstance(entries, list):
                  continue
              for entry in entries:
                  try:
                      ra = float(entry.get("ra", entry.get("raDeg", entry.get("raDegrees"))))
                      dec = float(entry.get("dec", entry.get("decDeg", entry.get("decDegrees"))))
                  except (TypeError, ValueError):
                      continue
                  if angular_sep_deg(ra, dec) > tolerance_deg:
                      continue
                  identity = " ".join(str(entry.get(k, "")) for k in ("name", "designation", "displayName", "title", "archiveId", "id")).lower()
                  if "1449" not in identity and abs(ra-target_ra) > 0.003:
                      continue
                  found.append((path, entry, ra, dec, angular_sep_deg(ra, dec)))

          if len(found) != 1:
              summary = [(str(p), e.get("name"), e.get("designation"), ra, dec, sep) for p,e,ra,dec,sep in found]
              raise SystemExit(f"STOP: expected exactly one CL J1449+0856 record; found {len(found)}: {summary}")

          path, entry, ra, dec, sep = found[0]
          identity = " ".join(str(entry.get(k, "")) for k in ("name", "designation", "displayName", "title", "archiveId", "id")).lower()
          if not any(token in identity for token in ("1449", "cl j144", "clj144")):
              raise SystemExit(f"STOP: coordinate candidate does not identify CL J1449+0856: {identity!r}")

          old = {
              "name": entry.get("name"),
              "designation": entry.get("designation"),
              "ra": ra,
              "dec": dec,
              "distance": entry.get("distance"),
              "distanceMly": entry.get("distanceMly"),
              "scienceDistanceMly": (entry.get("science") or {}).get("distanceMly"),
              "scienceDistanceDisplay": (entry.get("science") or {}).get("distanceDisplay"),
          }

          # Published descriptions give an approximate distance of ~10 billion light-years.
          # This is a documented approximate light-travel distance, not luminosity distance.
          distance_mly = 10000.0
          entry["distance"] = "10 billion light-years (approx.; z=1.99)"
          if "distanceMly" in entry:
              entry["distanceMly"] = distance_mly
          science = entry.setdefault("science", {})
          science["distanceMly"] = distance_mly
          science["distanceDisplay"] = "10.0 billion light-years (approx.)"
          science["distanceEstimated"] = True
          science["distanceMethod"] = "published_CLJ1449_z1.99_approx_10_billion_light_years"
          science["distanceEvidence"] = "https://academic.oup.com/mnras/article/486/3/4304/5470973"
          science["redshift"] = 1.99
          science["redshiftDisplay"] = "z = 1.99"
          science["redshiftEstimated"] = False
          science["redshiftMethod"] = "spectroscopic_cluster_redshift_published_CLJ1449"
          entry["redshift"] = 1.99
          entry["redshiftDisplay"] = "z = 1.99"
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"catalog": str(path), "identity": identity, "separationDeg": sep, "old": old,
                            "newDistanceMly": science["distanceMly"], "newDistanceDisplay": science["distanceDisplay"],
                            "redshift": science["redshift"], "source": science["distanceEvidence"]}, ensure_ascii=False))
          PY

      - name: Validate corrected catalog and untouched catalog structure
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          files=[
            "viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json",
            "viewer/image-databases/JWST/databases/gv-jwst-galaxies-full-0007-AVM-ESA-FOV.json",
            "viewer/image-databases/ESO/databases/gv-eso-galaxies-full-0001.json",
            "viewer/image-databases/Chandra/databases/gv-chandra-galaxies-full-0007.json",
            "viewer/image-databases/Spitzer/databases/gv-spitzer-galaxies-full-0011.json",
            "viewer/image-databases/NoirLab/databases/gv-noirlab-galaxies-full-0001.json"]
          found=[]
          for f in files:
            p=Path(f)
            if not p.exists(): continue
            d=json.loads(p.read_text(encoding="utf-8"))
            for e in d.get("entries",[]):
              identity=" ".join(str(e.get(k,"")) for k in ("name","designation","displayName","title","archiveId","id")).lower()
              if "cl j1449+0856" in identity or "clj1449+0856" in identity:
                found.append((f,e,identity))
          assert len(found)==1, f"Expected one CL J1449+0856 record; got {[(f,i) for f,e,i in found]}"
          f,e,identity=found[0]; s=e.get("science",{})
          assert abs(float(s.get("distanceMly",-1))-10000.0)<1e-6, s.get("distanceMly")
          assert abs(float(s.get("redshift",-1))-1.99)<1e-6, s.get("redshift")
          assert "CLJ1449" in s.get("distanceMethod","").upper().replace("_",""), s.get("distanceMethod")
          print(f"VERIFIED {f}: {identity}, distance=10,000 Mly approx., redshift z=1.99")
          PY

      - name: Commit catalog correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases
          if git diff --cached --quiet; then
            echo "No catalog changes detected."
            exit 0
          fi
          git commit -m "Correct CL J1449+0856 distance from published redshift"
          git push origin HEAD:release
