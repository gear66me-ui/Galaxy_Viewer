name: Build 88 Constellation Audit PDF

on:
  push:
    branches: [release]
    paths:
      - ".github/workflows/build-constellation-audit.yml"
      - "tools/constellation_audit/build_constellation_audit.py"
      - "tools/constellation_audit/release_effective_edges.csv"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: release
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF and plotting dependencies
        run: python -m pip install --upgrade reportlab matplotlib numpy requests beautifulsoup4 pymupdf
      - name: Build comparison atlas and coordinate registers
        run: python tools/constellation_audit/build_constellation_audit.py
      - name: Validate non-empty PDF
        run: |
          test -s Galaxy_Viewer_88_Constellation_Audit.pdf
          python -c "import pymupdf; d=pymupdf.open('Galaxy_Viewer_88_Constellation_Audit.pdf'); print('Pages:', len(d)); print('Bytes:', __import__('os').path.getsize('Galaxy_Viewer_88_Constellation_Audit.pdf')); assert len(d) >= 100"
          ls -lh Galaxy_Viewer_88_Constellation_Audit.pdf
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Viewer-88-Constellation-Audit
          path: Galaxy_Viewer_88_Constellation_Audit.pdf
          if-no-files-found: error
          retention-days: 30
      - name: Publish the generated PDF on release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tools/constellation_audit/output
          cp Galaxy_Viewer_88_Constellation_Audit.pdf tools/constellation_audit/output/Galaxy_Viewer_88_Constellation_Audit.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/constellation_audit/output/Galaxy_Viewer_88_Constellation_Audit.pdf
          if git diff --cached --quiet; then
            echo "Generated PDF unchanged; no publication commit needed."
          else
            git commit -m "Publish regenerated 88-constellation audit PDF"
            git push origin HEAD:release
          fi
