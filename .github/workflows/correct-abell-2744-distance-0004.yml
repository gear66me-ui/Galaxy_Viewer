name: Correct Abell 2744 FLRW Distance — AVM Runtime 0004
on:
  workflow_dispatch:
  # Trigger this workflow when its guarded definition is updated on release.
  push:
    branches: [release]
    paths:
      - '.github/workflows/correct-abell-2744-distance-0004.yml'
permissions:
  contents: write
jobs:
  correct-distance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
      - name: Calculate and patch Abell 2744 in runtime catalog and distance map
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, math
          from pathlib import Path

          catalog_path = Path('viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json')
          map_path = Path('viewer/image-databases/master-database/avm-metadata/avm-runtime-distance-map-0004.csv')
          expected_mly = 4119.1906  # flat LCDM: z=0.308, H0=67.6, Omega_m=0.315; present-day comoving radial distance
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          records = catalog.get('records')
          if not isinstance(records, list) or len(records) != 1847:
              raise SystemExit(f'Expected 1847 runtime records; found {len(records) if isinstance(records, list) else type(records).__name__}')
          matches = [r for r in records if str(r.get('providerKey','')).lower() == 'hubble' and str(r.get('archiveId','')) == 'opo1443a']
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one Hubble/opo1443a record; found {len(matches)}')
          record = matches[0]
          if 'Abell 2744' not in str(record.get('name','')) and 'Abell 2744' not in str(record.get('title','')):
              raise SystemExit(f'Identity check failed: name={record.get("name")!r}, title={record.get("title")!r}')
          old = record.get('distanceMly')
          record['distanceMly'] = expected_mly
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + '\\n', encoding='utf-8')

          with map_path.open(newline='', encoding='utf-8') as f:
              reader = csv.DictReader(f)
              fieldnames = reader.fieldnames
              rows = list(reader)
          if not fieldnames or not {'catalog_record_number','providerKey','archiveId','distanceMly'}.issubset(fieldnames):
              raise SystemExit(f'Unexpected distance-map headers: {fieldnames}')
          map_matches = [r for r in rows if r['providerKey'].strip().lower() == 'hubble' and r['archiveId'].strip() == 'opo1443a']
          if len(map_matches) != 1 or map_matches[0]['catalog_record_number'].strip() != '541':
              raise SystemExit(f'Distance-map identity check failed: matches={len(map_matches)}')
          map_old = map_matches[0]['distanceMly']
          map_matches[0]['distanceMly'] = f'{expected_mly:.4f}'
          with map_path.open('w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames, lineterminator='\\n')
              writer.writeheader()
              writer.writerows(rows)
          print(json.dumps({
              'recordCount': len(records),
              'providerKey': record.get('providerKey'),
              'archiveId': record.get('archiveId'),
              'name': record.get('name'),
              'oldRuntimeDistanceMly': old,
              'newRuntimeDistanceMly': record['distanceMly'],
              'oldMapDistanceMly': map_old,
              'newMapDistanceMly': map_matches[0]['distanceMly'],
              'redshiftFieldsPresent': {k: record[k] for k in record if 'redshift' in k.lower() or k.lower() in ('z','zshift')}
          }, ensure_ascii=False))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json viewer/image-databases/master-database/avm-metadata/avm-runtime-distance-map-0004.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Correct Abell 2744 FLRW distance in AVM runtime 0004 [skip ci]'
            git push origin HEAD:release
          else
            echo 'No changes required.'
          fi
