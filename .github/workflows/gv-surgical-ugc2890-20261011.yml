name: Surgical UGC 2890 catalog correction
on:
  push:
    branches:
      - release
    paths:
      - ".github/workflows/gv-surgical-ugc2890-20261011.yml"
permissions:
  contents: write
jobs:
  patch-catalogs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0
      - name: Correct only UGC 2890 records in both JSON catalogs
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source_path = Path("viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json")
          runtime_path = Path("viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0003.json")

          def load(path):
              with path.open("r", encoding="utf-8") as f:
                  return json.load(f)

          source = load(source_path)
          runtime = load(runtime_path)

          source_matches = [r for r in source.get("entries", []) if r.get("archiveId") == "potw2314a"]
          runtime_matches = [r for r in runtime.get("records", []) if r.get("archiveId") == "potw2314a"]
          if len(source_matches) != 1 or len(runtime_matches) != 1:
              raise SystemExit(f"Safety stop: expected exactly one record in each file; source={len(source_matches)}, runtime={len(runtime_matches)}")

          s = source_matches[0]
          s["distance"] = "30 million light-years"
          science = s.setdefault("science", {})
          science.update({
              "distanceMly": 30,
              "distanceDisplay": "30 million light-years",
              "distanceEstimated": False,
              "sizeKly": [28.9, 24.9],
              "sizeDisplay": "EST. 28.9 × 24.9 KLY",
              "sizeEstimated": True,
              "ageGyr": 13.77,
              "ageDisplay": "13.77 GYR",
              "ageEstimated": False
          })
          for stale_key in ("distanceMinMly", "distanceMaxMly", "ageMinGyr", "ageMaxGyr", "redshiftEstMin", "redshiftEstMax", "redshiftDisplay", "redshiftEstimated", "redshiftMethod"):
              science.pop(stale_key, None)

          r = runtime_matches[0]
          r.update({
              "distanceMly": 30,
              "distanceDisplay": "30 million light-years",
              "distanceEstimated": False,
              "ageYears": 13770000000,
              "ageGyr": 13.77,
              "ageDisplay": "13.77 GYR",
              "ageEstimated": False,
              "sizeKly": [28.9, 24.9],
              "sizeDisplay": "EST. 28.9 × 24.9 KLY",
              "sizeEstimated": True,
              "physicalSizeLy": [28900, 24900],
              "scienceSource": "ESA/Hubble potw2314a: distance around 30 million light-years; age 13.77 Gyr; physical span estimated from published 3.31 × 2.86 arcmin field"
          })

          source_path.write_text(json.dumps(source, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          runtime_path.write_text(json.dumps(runtime, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # Re-read and validate the exact values before allowing a commit.
          s2 = [r for r in load(source_path)["entries"] if r.get("archiveId") == "potw2314a"]
          r2 = [r for r in load(runtime_path)["records"] if r.get("archiveId") == "potw2314a"]
          assert len(s2) == len(r2) == 1
          assert s2[0]["distance"] == "30 million light-years"
          assert s2[0]["science"]["distanceMly"] == 30
          assert s2[0]["science"]["ageGyr"] == 13.77
          assert s2[0]["science"]["sizeKly"] == [28.9, 24.9]
          assert r2[0]["distanceMly"] == 30 and r2[0]["ageYears"] == 13770000000
          assert r2[0]["sizeKly"] == [28.9, 24.9]
          print("VALIDATED: both target records contain the approved values.")
          PY
      - name: Commit only the two JSON catalogs and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/gv-surgical-ugc2890-20261011.yml
          git add viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0003.json .github/workflows/gv-surgical-ugc2890-20261011.yml
          git diff --cached --check
          git commit -m "Correct UGC 2890 distance age and physical size"
          git push origin HEAD:release
