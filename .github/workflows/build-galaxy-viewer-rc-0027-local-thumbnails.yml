               '      JSONObject c=getJson(config+(config.contains("?")?"&":"?")+"gv="+t);\n')
          s=s.replace(old,new,1)

          old='      String th=c.getString("topShell"), bh=c.getString("bottomShell");\n'
          assert s.count(old)==1
          new=old+'      browserRuntimeTop=th;browserRuntimeBottom=bh;\n'
          s=s.replace(old,new,1)

          old='  public final class ViewerBridge{\n    @JavascriptInterface public void prewarm(String url){runOnUiThread(()->prewarmProvider(url));}\n'
          assert s.count(old)==1
          new=('  public final class ViewerBridge{\n'
               '    @JavascriptInterface public String browserRuntimeBom(){try{JSONObject o=new JSONObject();o.put("version",browserRuntimeVersion);o.put("config",browserRuntimeConfig);o.put("topShell",browserRuntimeTop);o.put("bottomShell",browserRuntimeBottom);return o.toString();}catch(Exception ignored){return "{}";}}\n'
               '    @JavascriptInterface public void prewarm(String url){runOnUiThread(()->prewarmProvider(url));}\n')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY22

          # RC 0027 delta — ONLY serve Survey thumbnail pack from APK assets.
          # Provider browser/prewarm/progress/READY logic above remains byte-for-byte from APK 0022.
          python - "$MAIN" <<'PY27'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()

          anchor='  private WebView viewer(){\n'
          helper=r'''  private WebResourceResponse localSurveyThumbnail(Uri uri){
            if(uri!=null){
              String path=uri.getPath();
              String marker="/viewer/artwork/runtime/survey-thumbnails/";
              if(path!=null){
                int at=path.indexOf(marker);
                if(at>=0){
                  String rel=path.substring(at+marker.length());
                  if(!rel.isEmpty()&&!rel.contains("..")){
                    try{
                      String mime=rel.endsWith(".webp")?"image/webp":"application/json";
                      String enc=rel.endsWith(".json")?"UTF-8":null;
                      return new WebResourceResponse(mime,enc,getAssets().open("survey-thumbnails/"+rel));
                    }catch(Exception ignored){}
                  }
                }
              }
            }
            return null;
          }

          '''
          if s.count(anchor)!=1:
              raise SystemExit('viewer anchor mismatch')
          s=s.replace(anchor,helper+anchor,1)

          old1='@Override public WebResourceResponse shouldInterceptRequest(WebView view,WebResourceRequest request){ return assetLoader==null?null:assetLoader.shouldInterceptRequest(request.getUrl()); }'
          new1='@Override public WebResourceResponse shouldInterceptRequest(WebView view,WebResourceRequest request){ WebResourceResponse local=localSurveyThumbnail(request.getUrl()); return local!=null?local:(assetLoader==null?null:assetLoader.shouldInterceptRequest(request.getUrl())); }'
          old2='@Override public WebResourceResponse shouldInterceptRequest(WebView view,String url){ return assetLoader==null?null:assetLoader.shouldInterceptRequest(Uri.parse(url)); }'
          new2='@Override public WebResourceResponse shouldInterceptRequest(WebView view,String url){ Uri uri=Uri.parse(url); WebResourceResponse local=localSurveyThumbnail(uri); return local!=null?local:(assetLoader==null?null:assetLoader.shouldInterceptRequest(uri)); }'
          n1=s.count(old1); n2=s.count(old2)
          if n1<1 or n2<1:
              raise SystemExit(f'interceptor anchors missing: {n1=} {n2=}')
          s=s.replace(old1,new1)
          s=s.replace(old2,new2)

          p.write_text(s)
          PY27

          # Nanoscopic gates: APK 0022 = APK 0021 runtime + read-only browser BOM bridge only.
          grep -q 'GalaxyViewerWebBrowser/0057' "$MAIN"
          grep -q 'https://gear66me-ui.github.io/Galaxy_Viewer/viewer/releases/launch/Galaxy-Viewer-Launch/index.html?gv=' "$MAIN"
          grep -q 'https://gear66me-ui.github.io/Galaxy_Viewer/viewer/Web-Browser/web-browser-current.json' "$MAIN"
          grep -q 'browserRuntimeVersion=p.optString("version","");browserRuntimeConfig=config;' "$MAIN"
          grep -q 'browserRuntimeTop=th;browserRuntimeBottom=bh;' "$MAIN"
          grep -q '@JavascriptInterface public String browserRuntimeBom()' "$MAIN"
          grep -q 'POINTER+"?gv="+t' "$MAIN"
          grep -q 'c.setUseCaches(false)' "$MAIN"
          grep -q 'Cache-Control","no-cache, no-store, max-age=0' "$MAIN"
          grep -q 'onConfigurationChanged(Configuration c)' "$MAIN"
          grep -q 'if(browserMode)syncShell();' "$MAIN"
          grep -q 'if(browserMode){returnToViewer();}else{moveTaskToBack(true);}' "$MAIN"
          grep -q 'profile.preconnect(u)' "$MAIN"
          grep -q 'profile.warmUpRendererProcess()' "$MAIN"
          grep -q 'private void cancelProviderWork()' "$MAIN"
          grep -q 'private boolean isChandraProvider(String url)' "$MAIN"
          grep -q 'private void configureProviderViewport(String url)' "$MAIN"
          grep -q 'settings.setLoadWithOverviewMode(chandra)' "$MAIN"
          grep -q 'settings.setCacheMode(WebSettings.LOAD_DEFAULT)' "$MAIN"
          grep -q 'settings.setOffscreenPreRaster(true)' "$MAIN"
          grep -q 'if(chandra)web.setInitialScale(0);' "$MAIN"
          grep -q '@JavascriptInterface public void cancelProvider()' "$MAIN"
          grep -q '@JavascriptInterface public void prewarm(String url){runOnUiThread(()->prewarmProvider(url));}' "$MAIN"
          grep -q 'viewerWeb.addJavascriptInterface(new ViewerBridge(),"GVNative")' "$MAIN"
          grep -q 'prewarmLoading=true;prewarmFailed=false;providerLoadProgress=0;providerLoadReady=false' "$MAIN"
          grep -q 'web.loadUrl(u);' "$MAIN"
          grep -q 'browserLayer.setVisibility(View.INVISIBLE)' "$MAIN"
          grep -q 'boolean sameWarm=u!=null&&u.equals(prewarmedUrl)&&!prewarmFailed' "$MAIN"
          grep -q 'if(!sameWarm)prewarmProvider(u);' "$MAIN"
          grep -q 'browserLayer.setVisibility(View.VISIBLE);browserLayer.bringToFront();' "$MAIN"
          grep -q 'private void returnToViewer(){ browserMode=false; if(browserLayer!=null)browserLayer.setVisibility(View.GONE); notifyViewerResumed(); emitProviderWarmStatus(); }' "$MAIN"
          grep -q 'gv-provider-native-progress' "$MAIN"
          grep -q 'onProgressChanged(WebView view,int newProgress)' "$MAIN"
          grep -q 'providerLoadProgress=100;providerLoadReady=true' "$MAIN"
          grep -q 'private WebResourceResponse localSurveyThumbnail(Uri uri)' "$MAIN"
          grep -q 'getAssets().open("survey-thumbnails/"+rel)' "$MAIN"
          test "$THUMB_COUNT" = "1848"
          test -s "$ROOT/app/src/main/assets/survey-thumbnails/gv-survey-thumbnail-index.json"
          test -s "$ROOT/app/src/main/assets/survey-thumbnails/gv-survey-thumbnail-current.json"
          grep -q 'CookieManager.getInstance().flush();' "$MAIN"
          grep -q '@Override protected void onPause(){CookieManager.getInstance().flush();super.onPause();}' "$MAIN"
          grep -q 'setAcceptCookie(true)' "$MAIN"
          grep -q 'setAcceptThirdPartyCookies(v,true)' "$MAIN"
          grep -q 'setAcceptThirdPartyCookies(popup,true)' "$MAIN"
          grep -q "androidx.webkit:webkit:1.17.1" "$ROOT/app/build.gradle"
          grep -q "versionName 'RC-V1.0.0.27-LOCAL-THUMBS'" "$ROOT/app/build.gradle"
          ! grep -q 'startProviderNavigation(providerRevealGeneration,u);scheduleProviderWatchdog(providerRevealGeneration,u,10000L);' "$MAIN"
          ! grep -q '57 TEST' "$MAIN"
          ! grep -q 'test57' "$MAIN"
          test ! -e "$ROOT/app/src/main/assets/index.html"
          test ! -e "$ROOT/app/src/main/assets/rc-payload.js"

      - name: Build RC 0027 APK
        run: gradle --no-daemon -p /tmp/galaxy-viewer-dev :app:assembleRelease

      - name: Sign RC 0027 APK
        shell: bash
        env:
          GV_UPLOAD_KEYSTORE_BASE64: ${{ secrets.GALAXY_VIEWER_UPLOAD_KEYSTORE }}
          GV_UPLOAD_STORE_PASSWORD: ${{ secrets.GALAXY_VIEWER_UPLOAD_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE=/tmp/galaxy-viewer-upload.jks
          test -n "$GV_UPLOAD_KEYSTORE_BASE64"
          test -n "$GV_UPLOAD_STORE_PASSWORD"
          printf '%s' "$GV_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          APK_UNSIGNED=/tmp/galaxy-viewer-dev/app/build/outputs/apk/release/app-release-unsigned.apk
          APK=Galaxy-Viewer-RC-V1.0.0.27-Local-Survey-Thumbnails.apk
          test -s "$APK_UNSIGNED"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$APK_UNSIGNED" /tmp/app-release-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$KEYSTORE" --ks-key-alias galaxyviewer-upload --ks-pass env:GV_UPLOAD_STORE_PASSWORD --key-pass env:GV_UPLOAD_STORE_PASSWORD --out "$APK" /tmp/app-release-aligned.apk
          test -s "$APK"

      - name: Verify RC 0027 APK
        shell: bash
        run: |
          set -euo pipefail
          APK=Galaxy-Viewer-RC-V1.0.0.27-Local-Survey-Thumbnails.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-rc-signature.txt
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Verify APK contains exact local thumbnail payload
        shell: bash
        run: |
          set -euo pipefail
          APK=Galaxy-Viewer-RC-V1.0.0.27-Local-Survey-Thumbnails.apk
          COUNT="$(unzip -l "$APK" | awk '/assets\/survey-thumbnails\/.*[.]webp$/ {n++} END {print n+0}')"
          test "$COUNT" = "1848"
          unzip -l "$APK" | grep -q 'assets/survey-thumbnails/gv-survey-thumbnail-index.json'
          unzip -l "$APK" | grep -q 'assets/survey-thumbnails/gv-survey-thumbnail-current.json'
          echo "Verified bundled Survey thumbnails: $COUNT"

      - uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Viewer-RC-V1.0.0.27-Local-Survey-Thumbnails
          path: |
            Galaxy-Viewer-RC-V1.0.0.27-Local-Survey-Thumbnails.apk
            Galaxy-Viewer-RC-V1.0.0.27-Local-Survey-Thumbnails.apk.sha256
            apk-rc-signature.txt
          retention-days: 30
