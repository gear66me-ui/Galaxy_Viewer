name: Build Galaxy Viewer RC-V1.0.0.27 Exact 0022 Browser + Local Survey Thumbnails
# RC 1.0.0.27: exact known-good APK 0022 provider runtime + ONLY bundled Survey thumbnails/interception.

on:
  push:
    branches: [release]
    paths:
      - '.github/workflows/build-galaxy-viewer-rc-0027-local-thumbnails.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install launcher tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Generate current 0057 hosted shell + tablet fixes
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/galaxy-viewer-dev
          GOLD=e180f2d651a94f7e64497e07d8bc732c459ff276
          rm -rf "$ROOT"
          mkdir -p "$ROOT/app/src/main/java/com/gear66me/galaxyviewer"
          mkdir -p "$ROOT/app/src/main/res/drawable" "$ROOT/app/src/main/res/mipmap-anydpi-v26" "$ROOT/app/src/main/res/values" "$ROOT/app/src/main/res/values-v31"
          mkdir -p "$ROOT/app/src/main/assets/survey-thumbnails"
          THUMB_ROOT=viewer/artwork/runtime/survey-thumbnails
          test -s "$THUMB_ROOT/gv-survey-thumbnail-index.json"
          test -s "$THUMB_ROOT/gv-survey-thumbnail-current.json"
          THUMB_COUNT="$(find "$THUMB_ROOT" -type f -name '*.webp' | wc -l | tr -d ' ')"
          test "$THUMB_COUNT" = "1848"
          cp -a "$THUMB_ROOT"/. "$ROOT/app/src/main/assets/survey-thumbnails/"

          cat > "$ROOT/settings.gradle" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='GalaxyViewer'
          include ':app'
          EOF

          cat > "$ROOT/build.gradle" <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF

          cat > "$ROOT/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > "$ROOT/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.gear66me.galaxyviewer'
            compileSdk 36
            defaultConfig {
              applicationId 'com.gear66me.galaxyviewer'
              minSdk 29
              targetSdk 36
              versionCode 10027
              versionName 'RC-V1.0.0.27-LOCAL-THUMBS'
            }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.17.1' }
          EOF

          # Android launcher artwork only. Galaxy Viewer stays hosted and follows the current launch/pointers.
          test -s viewer/artwork/app_icon_4.png
          cp viewer/artwork/app_icon_4.png "$ROOT/app/src/main/res/drawable/app_icon_4.png"
          cat > "$ROOT/app/src/main/res/drawable/transparent_splash_icon.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <solid android:color="#00000000"/>
            <size android:width="1dp" android:height="1dp"/>
          </shape>
          XML
          cat > "$ROOT/app/src/main/res/drawable/gv_launcher_background.xml" <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="#000000"/></shape>
          EOF
          cat > "$ROOT/app/src/main/res/drawable/gv_launcher_foreground.xml" <<'EOF'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:gravity="center" android:width="66dp" android:height="66dp"><bitmap android:src="@drawable/app_icon_4" android:gravity="fill"/></item></layer-list>
          EOF
          cat > "$ROOT/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/gv_launcher_background"/><foreground android:drawable="@drawable/gv_launcher_foreground"/></adaptive-icon>
          EOF
          cp "$ROOT/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" "$ROOT/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml"
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"; px="${spec##*:}"; mkdir -p "$ROOT/app/src/main/res/mipmap-${density}"
            convert viewer/artwork/app_icon_4.png -resize "${px}x${px}" "$ROOT/app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp "$ROOT/app/src/main/res/mipmap-${density}/ic_launcher.png" "$ROOT/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done

          cat > "$ROOT/app/src/main/res/values/styles.xml" <<'EOF'
          <resources>
            <style name="GalaxyViewerTheme" parent="@android:style/Theme.Material.NoActionBar">
              <item name="android:windowBackground">#000000</item>
              <item name="android:navigationBarColor">#000000</item>
              <item name="android:statusBarColor">#000000</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowLightNavigationBar">false</item>
            </style>
          </resources>
          EOF
          cat > "$ROOT/app/src/main/res/values-v31/styles.xml" <<'EOF'
          <resources>
            <style name="GalaxyViewerTheme" parent="@android:style/Theme.Material.NoActionBar">
              <item name="android:windowBackground">#000000</item>
              <item name="android:windowSplashScreenBackground">#000000</item>
              <item name="android:windowSplashScreenAnimatedIcon">@drawable/transparent_splash_icon</item>
              <item name="android:windowSplashScreenAnimationDuration">0</item>
              <item name="android:navigationBarColor">#000000</item>
              <item name="android:statusBarColor">#000000</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowLightNavigationBar">false</item>
            </style>
          </resources>
          EOF

          cat > "$ROOT/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:allowBackup="false" android:hardwareAccelerated="true"
              android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"
              android:label="Galaxy Viewer" android:theme="@style/GalaxyViewerTheme"
              android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity"
                android:configChanges="keyboardHidden|orientation|screenSize|smallestScreenSize|screenLayout"
                android:exported="true" android:screenOrientation="portrait">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          # Freeze the current Browser 0057 source for this DEV experiment.
          git fetch origin beta --no-tags
          git show FETCH_HEAD:android/galaxy-viewer-web-browser/app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java > "$ROOT/app/src/main/java/com/gear66me/galaxyviewer/MainActivity.java"
          sed -i 's/package com\.gear66me\.galaxyviewer\.webbrowser;/package com.gear66me.galaxyviewer;/' "$ROOT/app/src/main/java/com/gear66me/galaxyviewer/MainActivity.java"

          MAIN="$ROOT/app/src/main/java/com/gear66me/galaxyviewer/MainActivity.java"

          # DEV 0016: exact APK 0008 runtime behavior; 0009 stale/restart experiment removed.
          # When the hosted top shell reloads after a prewarmed provider is already ready, immediately repopulate its browser state.
          python - "$MAIN" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()

          # Tablet fix 1: keep the Activity/WebViews alive across freeform-window resize.
          needle="import android.content.Intent;\n"
          assert needle in s
          s=s.replace(needle, needle+"import android.content.res.Configuration;\n", 1)
          old='  @Override public void onWindowFocusChanged(boolean h){super.onWindowFocusChanged(h);if(h)immersive();}\n'
          assert old in s
          s=s.replace(old,old+'  @Override public void onConfigurationChanged(Configuration c){super.onConfigurationChanged(c);immersive();if(top!=null)top.post(this::fitTopShell);}\n',1)

          # Add Android CookieManager; all existing 0005 WebView behavior stays intact.
          needle='import android.webkit.WebView;\n'
          assert needle in s
          s=s.replace(needle,needle+'import android.webkit.CookieManager;\nimport android.webkit.WebResourceError;\n',1)

          # Remove 0057 speculative-prerender imports. WebViewAssetLoader stays.
          for line in [
              'import androidx.webkit.WebViewCompat;\n',
              'import androidx.webkit.WebViewFeature;\n',
              'import androidx.webkit.PrerenderOperationCallback;\n',
              'import androidx.webkit.PrerenderException;\n',
          ]:
              assert line in s
              s=s.replace(line,'',1)

          # APK 0016 / proven 0008: if the hosted top shell finishes after the provider already loaded,
          # immediately repopulate URL/provider state instead of leaving its default LOADING… text.
          old='          fitTopShell();\n        }\n      }\n    }); return v;\n'
          assert old in s
          new='          fitTopShell();\n          if(browserMode)syncShell();\n        }\n      }\n    }); return v;\n'
          s=s.replace(old,new,1)

          # Track prewarm request separately from actual committed/ready content.
          old='  private String providerIcon="", sourceUrl="", pendingProviderUrl="", pendingProviderIcon="", providerHomeUrl="", prewarmedUrl="";\n'
          assert old in s
          new='  private String providerIcon="", sourceUrl="", pendingProviderUrl="", pendingProviderIcon="", providerHomeUrl="", prewarmedUrl="", prewarmReadyUrl="", prewarmCommittedUrl="";\n  private boolean prewarmLoading=false, prewarmFailed=false;\n'
          s=s.replace(old,new,1)

          # Provider cookie persistence: accept first-party + third-party cookies in the provider WebView.
          old='    WebView v=new WebView(this); WebSettings s=v.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true);\n    s.setDatabaseEnabled(true); s.setUseWideViewPort(true); s.setLoadWithOverviewMode(false); s.setSupportZoom(true);\n'
          assert old in s
          new='    WebView v=new WebView(this); WebSettings s=v.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true);\n    CookieManager.getInstance().setAcceptCookie(true); CookieManager.getInstance().setAcceptThirdPartyCookies(v,true);\n    s.setDatabaseEnabled(true); s.setUseWideViewPort(true); s.setLoadWithOverviewMode(false); s.setSupportZoom(true);\n'
          s=s.replace(old,new,1)

          # Popup WebViews must use the same cookie policy for consent/login flows.
          old='        WebView popup=new WebView(MainActivity.this); WebSettings ps=popup.getSettings(); ps.setJavaScriptEnabled(true); ps.setDomStorageEnabled(true); ps.setSupportZoom(true); ps.setBuiltInZoomControls(true); ps.setDisplayZoomControls(false);\n'
          assert old in s
          new='        WebView popup=new WebView(MainActivity.this); WebSettings ps=popup.getSettings(); ps.setJavaScriptEnabled(true); ps.setDomStorageEnabled(true); CookieManager.getInstance().setAcceptThirdPartyCookies(popup,true); ps.setSupportZoom(true); ps.setBuiltInZoomControls(true); ps.setDisplayZoomControls(false);\n'
          s=s.replace(old,new,1)

          # Provider readiness is recorded only after the main document commits/finishes.
          old='      @Override public void onPageFinished(WebView view,String url){ if(browserMode){ if(clearProviderEntryHistory){ web.clearHistory(); clearProviderEntryHistory=false; } sourceUrl=url; syncShell(); } }\n'
          assert old in s
          new=('      @Override public void onPageCommitVisible(WebView view,String url){ if(prewarmLoading&&!prewarmedUrl.isEmpty()){prewarmLoading=false;prewarmFailed=false;prewarmReadyUrl=prewarmedUrl;prewarmCommittedUrl=url==null?"":url;} }\n'
               '      @Override public void onReceivedError(WebView view,WebResourceRequest request,WebResourceError error){ if(prewarmLoading&&request!=null&&request.isForMainFrame()){prewarmLoading=false;prewarmFailed=true;prewarmReadyUrl="";prewarmCommittedUrl="";} }\n'
               '      @Override public void onPageFinished(WebView view,String url){ CookieManager.getInstance().flush(); if(prewarmLoading&&!prewarmedUrl.isEmpty()){prewarmLoading=false;prewarmFailed=false;prewarmReadyUrl=prewarmedUrl;prewarmCommittedUrl=url==null?"":url;} if(browserMode){ if(clearProviderEntryHistory){ web.clearHistory(); clearProviderEntryHistory=false; } sourceUrl=url; syncShell(); } }\n')
          s=s.replace(old,new,1)

          # Flush once more when Galaxy Viewer leaves the foreground.
          old='  @Override public void onWindowFocusChanged(boolean h){super.onWindowFocusChanged(h);if(h)immersive();}\n'
          assert old in s
          s=s.replace(old,old+'  @Override protected void onPause(){CookieManager.getInstance().flush();super.onPause();}\n',1)

          # Launch behavior: normal hosted viewer + provider deep-link, no prerender mode.
          old='    if(launchUrl!=null&&launchPrewarm(getIntent())){ prewarmProvider(launchUrl); moveTaskToBack(true); }\n    else { launchGalaxyViewer(); if(launchUrl!=null){ openProvider(launchUrl,launchProviderIcon(getIntent())); } }\n'
          assert old in s
          s=s.replace(old,'    launchGalaxyViewer(); if(launchUrl!=null){ openProvider(launchUrl,launchProviderIcon(getIntent())); }\n',1)

          # Remove launch-time prewarm mode; landing-time prewarm has explicit lifecycle state.
          start=s.index('  private boolean launchPrewarm(Intent intent){')
          end=s.index('  private String launchProviderIcon(Intent intent){',start)
          replacement=('  private void prewarmProvider(String u){\n'
                       '    if(u==null||!u.startsWith("https://"))return;\n'
                       '    String current=web==null?null:web.getUrl();\n'
                       '    boolean currentReady=u.equals(prewarmReadyUrl)&&current!=null&&!current.isEmpty()&&!"about:blank".equals(current)&&(current.equals(prewarmCommittedUrl)||current.equals(u));\n'
                       '    if(u.equals(prewarmedUrl)&&!prewarmFailed&&(prewarmLoading||currentReady))return;\n'
                       '    prewarmedUrl=u;prewarmReadyUrl="";prewarmCommittedUrl="";prewarmLoading=true;prewarmFailed=false;\n'
                       '    if(browserLayer!=null)browserLayer.setVisibility(View.GONE);\n'
                       '    if(web!=null)web.loadUrl(u);\n'
                       '  }\n')
          s=s[:start]+replacement+s[end:]

          # Browser 0057 fast provider handoff: visible immediately, no 4-second cover.
          old=("    if(browserLayer!=null)browserLayer.setVisibility(View.INVISIBLE);\n"
               "    if(web!=null&&!(u.equals(prewarmedUrl)&&u.equals(web.getUrl())))web.loadUrl(u);\n"
               "    fetchPointer();\n"
               "    new Handler(Looper.getMainLooper()).postDelayed(()->{if(browserMode&&browserLayer!=null){browserLayer.setVisibility(View.VISIBLE);immersive();}},4000);\n")
          assert old in s
          new=("    if(browserLayer!=null){browserLayer.setVisibility(View.VISIBLE);browserLayer.bringToFront();}\n"
               "    if(web!=null){web.requestFocus();String current=web.getUrl();boolean currentReady=u.equals(prewarmReadyUrl)&&current!=null&&!current.isEmpty()&&!\"about:blank\".equals(current)&&(current.equals(prewarmCommittedUrl)||current.equals(u));boolean currentLoading=u.equals(prewarmedUrl)&&prewarmLoading&&!prewarmFailed&&current!=null&&!current.isEmpty()&&!\"about:blank\".equals(current);if(!(currentReady||currentLoading)){prewarmedUrl=u;prewarmReadyUrl=\"\";prewarmCommittedUrl=\"\";prewarmLoading=true;prewarmFailed=false;web.loadUrl(u);}}\n"
               "    fetchPointer();\n"
               "    immersive();\n")
          s=s.replace(old,new,1)

          # New intents open directly; no prerender branch.
          old='  @Override protected void onNewIntent(Intent intent){ super.onNewIntent(intent); setIntent(intent); String u=launchSourceUrl(intent); if(u!=null){ if(launchPrewarm(intent)){prewarmProvider(u);moveTaskToBack(true);}else openProvider(u,launchProviderIcon(intent)); } }\n'
          assert old in s
          s=s.replace(old,'  @Override protected void onNewIntent(Intent intent){ super.onNewIntent(intent); setIntent(intent); String u=launchSourceUrl(intent); if(u!=null)openProvider(u,launchProviderIcon(intent)); }\n',1)

          # Tablet fix 2: Android Back must not cold-launch Galaxy Viewer.
          old='  @Override public void onBackPressed(){if(browserMode){escapeToFreshViewer();}else{launchGalaxyViewer();}}\n'
          assert old in s
          s=s.replace(old,'  @Override public void onBackPressed(){if(browserMode){returnToViewer();}else{moveTaskToBack(true);}}\n',1)

          # Diagnostic APK 0016: disable native provider-page prewarm completely.
          # Hosted GVNative.prewarm(url) calls remain harmless no-ops; provider pages load only on explicit WEB press.
          old='    @JavascriptInterface public void prewarm(String url){runOnUiThread(()->prewarmProvider(url));}\n'
          assert old in s
          s=s.replace(old,'    @JavascriptInterface public void prewarm(String url){}\n',1)

          # APK 0016 Lucky 13 — official AndroidX WebKit 1.17.1 prerender.
          # One provider WebView only. Prerender never navigates the visible WebView.
          # Each new destination cancels the previous speculative render.
          # Provider browser is revealed only after onPageCommitVisible confirms stale content is gone.

          # Re-enable official prerender imports removed by the 1.12 baseline transform.
          needle='import androidx.webkit.WebViewAssetLoader;\n'
          assert needle in s
          s=s.replace(needle,needle+'import androidx.webkit.WebViewCompat;\nimport androidx.webkit.WebViewFeature;\nimport androidx.webkit.PrerenderOperationCallback;\nimport androidx.webkit.PrerenderException;\n',1)
          needle='import android.os.Message;\n'
          assert needle in s
          s=s.replace(needle,needle+'import android.os.CancellationSignal;\n',1)

          # Add one cancellable prerender slot and a reveal gate.
          old='  private boolean prewarmLoading=false, prewarmFailed=false;\n'
          assert old in s
          new=('  private boolean prewarmLoading=false, prewarmFailed=false;\n'
               '  private CancellationSignal prerenderSignal=null; private int prerenderGeneration=0; private boolean awaitingProviderCommit=false;\n')
          s=s.replace(old,new,1)

          # Replace live hidden-navigation prewarm with official WebView speculative prerender.
          start=s.index('  private void prewarmProvider(String u){')
          end=s.index('  private String launchProviderIcon(Intent intent){',start)
          assert start>=0 and end>start
          replacement=('  private void prewarmProvider(String u){\n'
                       '    if(u==null||!u.startsWith("https://")||web==null)return;\n'
                       '    if(u.equals(prewarmedUrl)&&prewarmLoading&&!prewarmFailed)return;\n'
                       '    if(prerenderSignal!=null){try{prerenderSignal.cancel();}catch(Exception ignored){}prerenderSignal=null;}\n'
                       '    final int generation=++prerenderGeneration;\n'
                       '    prewarmedUrl=u;prewarmReadyUrl="";prewarmCommittedUrl="";prewarmLoading=true;prewarmFailed=false;\n'
                       '    if(browserLayer!=null)browserLayer.setVisibility(View.GONE);\n'
                       '    if(!WebViewFeature.isFeatureSupported(WebViewFeature.PRERENDER_WITH_URL)){prewarmLoading=false;prewarmFailed=true;return;}\n'
                       '    prerenderSignal=new CancellationSignal();\n'
                       '    try{\n'
                       '      WebViewCompat.prerenderUrlAsync(web,u,prerenderSignal,getMainExecutor(),new PrerenderOperationCallback(){\n'
                       '        @Override public void onPrerenderActivated(){if(generation!=prerenderGeneration||!u.equals(prewarmedUrl))return;prewarmLoading=false;prewarmFailed=false;prewarmReadyUrl=u;prewarmCommittedUrl=u;}\n'
                       '        @Override public void onError(PrerenderException e){if(generation!=prerenderGeneration||!u.equals(prewarmedUrl))return;prewarmLoading=false;prewarmFailed=true;prewarmReadyUrl="";prewarmCommittedUrl="";}\n'
                       '      });\n'
                       '    }catch(Exception e){if(generation==prerenderGeneration&&u.equals(prewarmedUrl)){prewarmLoading=false;prewarmFailed=true;prewarmReadyUrl="";prewarmCommittedUrl="";}}\n'
                       '  }\n')
          s=s[:start]+replacement+s[end:]

          # Reveal only after the newly requested main document is committed visible.
          old=('      @Override public void onPageCommitVisible(WebView view,String url){ if(prewarmLoading&&!prewarmedUrl.isEmpty()){prewarmLoading=false;prewarmFailed=false;prewarmReadyUrl=prewarmedUrl;prewarmCommittedUrl=url==null?"":url;} }\n'
               '      @Override public void onReceivedError(WebView view,WebResourceRequest request,WebResourceError error){ if(prewarmLoading&&request!=null&&request.isForMainFrame()){prewarmLoading=false;prewarmFailed=true;prewarmReadyUrl="";prewarmCommittedUrl="";} }\n'
               '      @Override public void onPageFinished(WebView view,String url){ CookieManager.getInstance().flush(); if(prewarmLoading&&!prewarmedUrl.isEmpty()){prewarmLoading=false;prewarmFailed=false;prewarmReadyUrl=prewarmedUrl;prewarmCommittedUrl=url==null?"":url;} if(browserMode){ if(clearProviderEntryHistory){ web.clearHistory(); clearProviderEntryHistory=false; } sourceUrl=url; syncShell(); } }\n')
          assert old in s
          new=('      @Override public void onPageCommitVisible(WebView view,String url){ if(browserMode&&awaitingProviderCommit){awaitingProviderCommit=false;if(clearProviderEntryHistory){web.clearHistory();clearProviderEntryHistory=false;}if(url!=null&&!url.isEmpty())sourceUrl=url;if(browserLayer!=null){browserLayer.setVisibility(View.VISIBLE);browserLayer.bringToFront();}syncShell();immersive();} }\n'
               '      @Override public void onReceivedError(WebView view,WebResourceRequest request,WebResourceError error){ if(browserMode&&awaitingProviderCommit&&request!=null&&request.isForMainFrame()){awaitingProviderCommit=false;if(browserLayer!=null){browserLayer.setVisibility(View.VISIBLE);browserLayer.bringToFront();}immersive();} }\n'
               '      @Override public void onPageFinished(WebView view,String url){ CookieManager.getInstance().flush(); if(browserMode){ if(url!=null&&!url.isEmpty())sourceUrl=url; syncShell(); } }\n')
          s=s.replace(old,new,1)

          # Pressing WEB activates the exact prerendered URL. Keep Galaxy Viewer visible until commit.
          old=("    if(browserLayer!=null){browserLayer.setVisibility(View.VISIBLE);browserLayer.bringToFront();}\n"
               "    if(web!=null){web.requestFocus();String current=web.getUrl();boolean currentReady=u.equals(prewarmReadyUrl)&&current!=null&&!current.isEmpty()&&!\"about:blank\".equals(current)&&(current.equals(prewarmCommittedUrl)||current.equals(u));boolean currentLoading=u.equals(prewarmedUrl)&&prewarmLoading&&!prewarmFailed&&current!=null&&!current.isEmpty()&&!\"about:blank\".equals(current);if(!(currentReady||currentLoading)){prewarmedUrl=u;prewarmReadyUrl=\"\";prewarmCommittedUrl=\"\";prewarmLoading=true;prewarmFailed=false;web.loadUrl(u);}}\n"
               "    fetchPointer();\n"
               "    immersive();\n")
          assert old in s
          new=("    awaitingProviderCommit=true;\n"
               "    if(browserLayer!=null)browserLayer.setVisibility(View.GONE);\n"
               "    if(web!=null){web.requestFocus();web.loadUrl(u);}\n"
               "    fetchPointer();\n"
               "    immersive();\n")
          s=s.replace(old,new,1)

          # Restore hosted landing-time bridge to start official prerender.
          old='    @JavascriptInterface public void prewarm(String url){}\n'
          assert old in s
          s=s.replace(old,'    @JavascriptInterface public void prewarm(String url){runOnUiThread(()->prewarmProvider(url));}\n',1)

          # Remove only the temporary red 57 TEST badge from the browser viewport.
          badge_start=s.index('    TextView test57=new TextView(this);')
          badge_end=s.index('    LinearLayout.LayoutParams fp=',badge_start)
          s=s[:badge_start]+s[badge_end:]

          p.write_text(s)
          PY

          # APK 0016 Lucky 15 — start from the proven Lucky 13 output and layer current WebKit 1.17.1 APIs.
          python - "$MAIN" <<'PY15'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()

          needle='import androidx.webkit.PrerenderException;\n'
          assert needle in s
          s=s.replace(needle,needle+
              'import androidx.webkit.Navigation;\n'
              'import androidx.webkit.NavigationListener;\n'
              'import androidx.webkit.NavigationParameters;\n'
              'import androidx.webkit.Page;\n'
              'import androidx.webkit.PrefetchCache;\n'
              'import androidx.webkit.PrefetchException;\n'
              'import androidx.webkit.PrefetchParameters;\n'
              'import androidx.webkit.PrefetchResult;\n'
              'import androidx.webkit.Profile;\n'
              'import androidx.webkit.WebViewOutcomeReceiver;\n',1)

