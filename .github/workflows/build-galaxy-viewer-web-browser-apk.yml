name: Build Galaxy Viewer Web Browser APK

on:
  workflow_dispatch:
  push:
    branches: [ beta ]
    paths:
      - 'android/galaxy-viewer-web-browser/**'
      - '.github/workflows/build-galaxy-viewer-web-browser-apk.yml'
      - 'viewer/gv-current-viewer.json'
      - 'viewer/GV-beta-200-019.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/galaxy-viewer-web-browser
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install SVG rasterizer and Galaxy Viewer launcher icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick
          mkdir -p app/src/main/res/drawable
          cp "../../viewer/artwork/Fonts/Space Age Regular GV-9/Space Age GV-9A.otf" app/src/main/assets/SpaceAge-GV-9A.otf
          test -s app/src/main/assets/SpaceAge-GV-9A.otf
          # 0055: authoritative launcher source. Do not copy/rename/redraw it.
          ICON="../../viewer/artwork/app_icon_4.png"
          test -s "$ICON"
          file "$ICON" | grep -q 'PNG image data'
          ln -sf "$GITHUB_WORKSPACE/viewer/artwork/app_icon_4.png" app/src/main/res/drawable/app_icon_4.png
          test -L app/src/main/res/drawable/app_icon_4.png
          test -s app/src/main/res/drawable/gv_launcher_foreground.xml
          # Legacy mipmaps are build outputs only; source remains app_icon_4.
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"; px="${spec##*:}"
            mkdir -p "app/src/main/res/mipmap-${density}"
            convert "$ICON" -resize "${px}x${px}" "app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp "app/src/main/res/mipmap-${density}/ic_launcher.png" "app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done
          test -s app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          echo '0055 adaptive Galaxy/reticle/Viewer launcher gate'
          echo '0055 ECO build retry gate'

      - name: Audit 0055 source before build
        run: |
          grep -q 'android.useAndroidX=true' gradle.properties
          grep -q "versionCode 55" app/build.gradle
          grep -q "versionName '0055'" app/build.gradle
          grep -q 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' app/src/main/AndroidManifest.xml
          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          grep -q '@drawable/gv_launcher_foreground' app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          grep -q 'android:src="@drawable/app_icon_4"' app/src/main/res/drawable/gv_launcher_foreground.xml
          grep -q 'android:width="66dp"' app/src/main/res/drawable/gv_launcher_foreground.xml
          grep -q 'launchProviderIcon' app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          ! grep -q 'providerIconForUrl' app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          grep -q 'Galaxy-Viewer-Launch/index.html' app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          grep -q 'WebViewAssetLoader' app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          grep -q 'private WebView top, web, bottom, viewerWeb;' app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          grep -q 'browserLayer.setVisibility(View.GONE)' app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          grep -q 'windowSplashScreenAnimatedIcon">@android:color/transparent' app/src/main/res/values-v31/styles.xml
          grep -q 'private void escapeToFreshViewer()' app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          grep -q 'if(browserMode){escapeToFreshViewer();}else{launchGalaxyViewer();}' app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          grep -q 's.setSupportZoom(true);' app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          grep -q 's.setBuiltInZoomControls(true);' app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          grep -q 's.setDisplayZoomControls(false);' app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          grep -q 'radial-gradient' app/src/main/assets/index.html
          grep -q 'VERSION ' app/src/main/assets/index.html
          grep -q "font-family:GV" app/src/main/assets/index.html
          grep -q "SpaceAge-GV-9A.otf" app/src/main/assets/index.html
          test -s app/src/main/assets/SpaceAge-GV-9A.otf
          grep -q 'Galaxy-Viewer-Singularity-FINAL' app/src/main/assets/index.html
          grep -q 'galaxy-viewer-target-icon.svg' app/src/main/assets/index.html
          ! grep -q 'file:///android_asset/index.html' app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          grep -q 'GalaxyViewerWebBrowser/0055' app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          grep -q 'restoreProviderHome();' app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          ! grep -Fq 'if(web.canGoBack())web.goBack()' app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Audit finished 0055 APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-0055-badging.txt
          grep -q "package: name='com.gear66me.galaxyviewer.webbrowser'" apk-0055-badging.txt
          grep -q "versionCode='55'" apk-0055-badging.txt
          grep -q "versionName='0055'" apk-0055-badging.txt
          grep -q "application-label:'Galaxy Viewer'" apk-0055-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Name APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Galaxy-Viewer-0055.apk
          test -s dist/Galaxy-Viewer-0055.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Viewer-0055
          path: android/galaxy-viewer-web-browser/dist/Galaxy-Viewer-0055.apk
          if-no-files-found: error
          retention-days: 30


      - name: Publish APK for direct GitHub download
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p releases/apk
          cp android/galaxy-viewer-web-browser/dist/Galaxy-Viewer-0055.apk releases/apk/Galaxy-Viewer-0055.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/apk/Galaxy-Viewer-0055.apk
          if git diff --cached --quiet; then
            echo "APK already published"
          else
            git commit -m "Publish Galaxy Viewer Web Browser 0055 APK"
            git push origin HEAD:beta
          fi
