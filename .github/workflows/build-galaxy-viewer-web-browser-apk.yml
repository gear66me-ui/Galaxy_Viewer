name: Build Galaxy Viewer Web Browser APK

on:
  workflow_dispatch:
  push:
    branches: [ beta ]
    paths:
      - 'android/galaxy-viewer-web-browser/**'
      - '.github/workflows/build-galaxy-viewer-web-browser-apk.yml'
      - 'viewer/gv-current-viewer.json'
      - 'viewer/GV-beta-200-014.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/galaxy-viewer-web-browser
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install SVG rasterizer and Galaxy Viewer launcher icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick
          mkdir -p app/src/main/res/drawable
          cp "../../viewer/artwork/Fonts/Space Age Regular GV-9/Space Age GV-9A.otf" app/src/main/assets/SpaceAge-GV-9A.otf
          test -s app/src/main/assets/SpaceAge-GV-9A.otf
          rsvg-convert -w 390 -h 390 ../../viewer/artwork/runtime/navigation/galaxy-viewer-target-icon.svg -o /tmp/gv_target.png
          convert -size 512x512 xc:black /tmp/gv_target.png -gravity center -composite app/src/main/res/drawable/gv_target_launcher.png
          test -s app/src/main/res/drawable/gv_target_launcher.png
          identify app/src/main/res/drawable/gv_target_launcher.png
          echo '0034 black launcher tile gate'

      - name: Audit 0034 source before build
        run: |
          grep -q 'android.useAndroidX=true' gradle.properties
          grep -q "versionCode 34" app/build.gradle
          grep -q "versionName '0034'" app/build.gradle
          grep -q 'android:icon="@drawable/gv_target_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@drawable/gv_target_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'Galaxy-Viewer-Launch/index.html' app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          grep -q 'WebViewAssetLoader' app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          grep -q 'private WebView top, web, bottom, viewerWeb;' app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          grep -q 'browserLayer.setVisibility(View.GONE)' app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          grep -q 'windowSplashScreenAnimatedIcon">@android:color/transparent' app/src/main/res/values-v31/styles.xml
          ! grep -q 'if(web.canGoBack()) web.goBack(); else launchGalaxyViewer();' app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          grep -q 's.setSupportZoom(false);' app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          grep -q 's.setBuiltInZoomControls(false);' app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          ! grep -q 's.setBuiltInZoomControls(true);' app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java
          grep -q 'radial-gradient' app/src/main/assets/index.html
          grep -q 'VERSION ' app/src/main/assets/index.html
          grep -q "font-family:GV" app/src/main/assets/index.html
          grep -q "SpaceAge-GV-9A.otf" app/src/main/assets/index.html
          test -s app/src/main/assets/SpaceAge-GV-9A.otf
          grep -q 'Galaxy-Viewer-Singularity-FINAL' app/src/main/assets/index.html
          grep -q 'galaxy-viewer-target-icon.svg' app/src/main/assets/index.html
          ! grep -q 'file:///android_asset/index.html' app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Audit finished 0034 APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-0034-badging.txt
          grep -q "package: name='com.gear66me.galaxyviewer.webbrowser'" apk-0034-badging.txt
          grep -q "versionCode='34'" apk-0034-badging.txt
          grep -q "versionName='0034'" apk-0034-badging.txt
          grep -q "application-label:'Galaxy Viewer'" apk-0034-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Name APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Galaxy-Viewer-Web-Browser-0034.apk
          test -s dist/Galaxy-Viewer-Web-Browser-0034.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Viewer-Web-Browser-0034
          path: android/galaxy-viewer-web-browser/dist/Galaxy-Viewer-Web-Browser-0034.apk
          if-no-files-found: error
          retention-days: 30


      - name: Publish APK for direct GitHub download
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p releases/apk
          cp android/galaxy-viewer-web-browser/dist/Galaxy-Viewer-Web-Browser-0034.apk releases/apk/Galaxy-Viewer-Web-Browser-0034.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/apk/Galaxy-Viewer-Web-Browser-0034.apk
          if git diff --cached --quiet; then
            echo "APK already published"
          else
            git commit -m "Publish Galaxy Viewer Web Browser 0034 APK"
            git push origin HEAD:beta
          fi
