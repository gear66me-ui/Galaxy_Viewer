name: Apply Hubble distance batch
on:
  push:
    branches: [release]
    paths:
      - .github/workflows/apply-hubble-distance-batch.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply guarded Hubble rows
        run: python .github/scripts/apply_hubble_distance_rows.py
      - name: Correct Arp 283 physical image footprint (guarded)
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          p = Path("viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          matches = [e for e in data["entries"] if e.get("archiveId") == "potw2042a"]
          if len(matches) != 1:
              raise SystemExit(f"Arp 283 guard failed: expected 1 archiveId potw2042a, found {len(matches)}")
          e = matches[0]
          s = e.get("science", {})
          if abs(float(s.get("distanceMly", -1)) - 73.3851) > 1e-4:
              raise SystemExit(f"Arp 283 distance guard failed: {s.get('distanceMly')}")
          fx = float(e.get("imageFovXDeg", -1))
          fy = float(e.get("imageFovYDeg", -1))
          if abs(fx - 0.0508333333) > 1e-6 or abs(fy - 0.0473333333) > 1e-6:
              raise SystemExit(f"Arp 283 FOV guard failed: x={fx}, y={fy}")
          old = s.get("sizeKly")
          if old != [887.209, 826.123] and old != [65.13, 60.65]:
              raise SystemExit(f"Arp 283 size guard failed: unexpected current sizeKly={old}")
          d_mly = float(s["distanceMly"])
          # Small-angle footprint: physical span (Kly) = distance (Mly) * angle (radians) * 1000.
          # Use the exact angular footprint recorded in the catalog.
          x_kly = d_mly * math.radians(fx) * 1000
          y_kly = d_mly * math.radians(fy) * 1000
          s["sizeKly"] = [round(x_kly, 3), round(y_kly, 3)]
          s["sizeMethod"] = "image_footprint_fov_distance_estimate_0035_corrected_Arp283"
          s["sizeEstimated"] = True
          s["sizeDisplay"] = f"EST. {x_kly:.1f} × {y_kly:.1f} KLY"
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(f"Arp 283 corrected: {old} Kly -> {s['sizeKly']} Kly; display={s['sizeDisplay']}")
          PY
      - name: Validate Hubble catalog
        run: |
          python - <<'PY'
          import json
          p = "viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json"
          d = json.load(open(p, encoding="utf-8"))
          assert len(d["entries"]) >= 988
          assert all(isinstance(e.get("science", {}).get("distanceMly"), (int, float)) and e["science"]["distanceMly"] > 0 for e in d["entries"])
          arp = [e for e in d["entries"] if e.get("archiveId") == "potw2042a"]
          assert len(arp) == 1, f"Expected one Arp 283 record, found {len(arp)}"
          s = arp[0]["science"]
          assert all(abs(a-b) < 0.001 for a,b in zip(s["sizeKly"], [65.108, 60.625])), f"Arp 283 size mismatch: {s['sizeKly']}"
          assert s["sizeMethod"] == "image_footprint_fov_distance_estimate_0035_corrected_Arp283"
          print("Arp 283 physical footprint verified:", s["sizeKly"], "Kly")
          print("Hubble JSON valid:", len(d["entries"]), "entries")
          PY
      - name: Commit Hubble catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json
          git diff --cached --quiet || git commit -m "Apply guarded Hubble distance batch"
          git push
