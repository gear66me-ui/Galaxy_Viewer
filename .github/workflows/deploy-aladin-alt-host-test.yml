name: Deploy Aladin alternate-host test

on:
  push:
    branches: [beta]
    paths:
      - ".github/workflows/deploy-aladin-alt-host-test.yml"
      - "viewer/aladin-alternate-host-test.html"
      - "aladin-source-clone/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: aladin-source-clone/package.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build local Aladin
        working-directory: aladin-source-clone
        run: |
          npm install
          npm run build:npm
      - name: Assemble site
        run: |
          mkdir -p _site/local
          cp -R aladin-source-clone/dist/. _site/local/
          cp viewer/aladin-alternate-host-test.html _site/index.html
          cp viewer/aladin-alternate-host-test.html _site/alternate-host.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
