name: Repair and Diagnose Galaxy Image Manifest

on:
  workflow_dispatch:
  push:
    branches: [release]
    paths:
      - ".github/workflows/repair-audit-galaxy-image-manifest.yml"

permissions:
  contents: write

concurrency:
  group: galaxy-image-manifest-repair
  cancel-in-progress: false

jobs:
  repair-and-diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release source of truth
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Validate, normalize manifest, and diagnose failed URLs
        run: |
          python - <<'PY'
          import collections, json, pathlib, urllib.parse
          root = pathlib.Path("viewer/image-databases/Hubble/mirror")
          manifest_path = root / "image-mirror-manifest.json"
          failures_path = root / "image-mirror-failures.json"
          raw = manifest_path.read_text(encoding="utf-8")
          decoder = json.JSONDecoder()
          manifest, end = decoder.raw_decode(raw.lstrip())
          leading = len(raw) - len(raw.lstrip())
          trailing = raw[leading + end:].strip()
          images = manifest.get("images", [])
          if not images:
              raise SystemExit("Refusing to repair: no image entries in main manifest object.")
          downloaded = [x for x in images if x.get("sha256") and x.get("filename")]
          failed = [x for x in images if not (x.get("sha256") and x.get("filename"))]
          if len(downloaded) != int(manifest.get("imageCount", -1)):
              raise SystemExit(f"Count mismatch: imageCount={manifest.get('imageCount')} but valid downloaded entries={len(downloaded)}; refusing to rewrite.")
          print("=== BEFORE REPAIR ===")
          print(f"Trailing non-JSON characters: {len(trailing)}")
          print(f"Image entries: {len(images)}; successfully mirrored: {len(downloaded)}; failed: {len(failed)}")
          print(f"Manifest imageCount={manifest.get('imageCount')}; failedCount={manifest.get('failedCount')}")
          print("=== FAILED ENTRY DIAGNOSIS ===")
          providers = collections.Counter(x.get("provider", "MISSING") for x in failed)
          errors = collections.Counter(x.get("error", "NO ERROR FIELD") for x in failed)
          hosts = collections.Counter(urllib.parse.urlsplit(x.get("sourceUrl", "")).netloc or "NO SOURCE URL" for x in failed)
          print("Providers:")
          for k,v in sorted(providers.items()): print(f"  {k}: {v}")
          print("Error categories:")
          for k,v in errors.most_common(20): print(f"  {v} x {k}")
          print("Source hosts:")
          for k,v in hosts.most_common(20): print(f"  {v} x {k}")
          print("First 12 failed entries:")
          for x in failed[:12]:
              print(json.dumps({"provider":x.get("provider"),"sourceUrl":x.get("sourceUrl"),"error":x.get("error"),"catalogRefs":x.get("catalogRefs")},ensure_ascii=False))
          print("=== FAILURE REPORT CROSS-CHECK ===")
          if failures_path.exists():
              failures = json.loads(failures_path.read_text(encoding="utf-8"))
              print(f"Failure report rows: {len(failures)}")
              print("Failure report error categories:")
              for k,v in collections.Counter(x.get("error","NO ERROR FIELD") for x in failures).most_common(20):
                  print(f"  {v} x {k}")
          else:
              print("No separate failure report found.")
          # Re-serialize the valid first object as strict JSON; do not alter image mappings.
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          # Read back and validate before any commit.
          checked = json.loads(manifest_path.read_text(encoding="utf-8"))
          if len(checked.get("images", [])) != len(images):
              raise SystemExit("Post-repair validation failed: image record count changed.")
          if sum(bool(x.get("sha256") and x.get("filename")) for x in checked["images"]) != len(downloaded):
              raise SystemExit("Post-repair validation failed: downloaded image count changed.")
          print(f"REPAIR VALIDATED: strict JSON; {len(images)} records retained; {len(downloaded)} mirrored images; {len(failed)} failed records.")
          PY

      - name: Commit repaired manifest only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases/Hubble/mirror/image-mirror-manifest.json
          if git diff --cached --quiet; then
            echo "Manifest already valid; no commit required."
            exit 0
          fi
          git commit -m "Repair Galaxy image mirror manifest JSON"
          for attempt in 1 2 3 4 5; do
            git fetch origin release
            git rebase origin/release
            if git push origin HEAD:release; then
              echo "Strict JSON manifest repair committed. No viewer code or catalog source files changed."
              exit 0
            fi
          done
          echo "Failed to push manifest repair after five attempts."
          exit 1
