name: Repair NGC 5668 canonical distance and redshift

on:
  push:
    branches: [release]
    paths:
      - .github/workflows/repair-ngc5668-canonical-distance-redshift.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-ngc5668-canonical-distance-redshift
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Repair canonical source and AVM runtime records
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path

          SOURCE = Path("viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json")
          RUNTIME = Path("viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json")
          DISTANCE_MAP = Path("viewer/image-databases/master-database/avm-metadata/avm-runtime-distance-map-0004.csv")
          REVIEW = Path("viewer/image-databases/master-database/avm-metadata/AVM-METADATA-GEMINI-NED-SIMBAD/Galaxy_Viewer_v0004a_Distance_Review_Workbook.csv")
          ARCHIVE_ID = "potw2437a"
          PROVIDER = "hubble"
          DISTANCE_MLY = 90.0
          # SIMBAD reports the heliocentric emission redshift and uncertainty below.
          REDSHIFT_Z = 0.005291
          REDSHIFT_ERROR = 0.000010
          DISTANCE_SOURCE = "https://esahubble.org/images/potw2437a/"
          REDSHIFT_SOURCE = "SIMBAD 2022ApJS..261...21Y; heliocentric z(emission)=0.005291 +/- 0.000010; https://simbad.u-strasbg.fr/simbad/sim-id?Ident=%402272923"

          if not SOURCE.is_file() or not RUNTIME.is_file() or not DISTANCE_MAP.is_file():
              raise SystemExit("STOP: one or more canonical catalog files are missing.")

          source = json.loads(SOURCE.read_text(encoding="utf-8"))
          runtime = json.loads(RUNTIME.read_text(encoding="utf-8"))
          source_matches = [e for e in source.get("entries", []) if str(e.get("archiveId", "")).strip().lower() == ARCHIVE_ID]
          runtime_matches = [r for r in runtime.get("records", []) if str(r.get("providerKey", "")).strip().lower() == PROVIDER and str(r.get("archiveId", "")).strip().lower() == ARCHIVE_ID]
          source_name_matches = [e for e in source.get("entries", []) if str(e.get("name", "")).strip().casefold() == "ngc 5668"]
          runtime_name_matches = [r for r in runtime.get("records", []) if str(r.get("name", "")).strip().casefold() == "ngc 5668"]

          if len(source_matches) != 1:
              raise SystemExit(f"STOP: expected exactly one Hubble source entry {ARCHIVE_ID}; found {len(source_matches)}")
          if len(runtime_matches) != 1:
              raise SystemExit(f"STOP: expected exactly one Hubble runtime record {ARCHIVE_ID}; found {len(runtime_matches)}")
          if len(source_name_matches) != 1:
              raise SystemExit(f"STOP: source catalog lists NGC 5668 {len(source_name_matches)} times; no automatic deletion performed")
          if len(runtime_name_matches) != 1:
              raise SystemExit(f"STOP: runtime catalog lists NGC 5668 {len(runtime_name_matches)} times; no automatic deletion performed")

          entry = source_matches[0]
          science = entry.setdefault("science", {})
          if not isinstance(science, dict):
              raise SystemExit("STOP: source entry science field is not an object.")
          entry["distance"] = DISTANCE_MLY
          science.update({
              "distanceMly": DISTANCE_MLY,
              "distanceMethod": "published_distance_ESA_Hubble_potw2437a_90_Mly",
              "distanceSource": DISTANCE_SOURCE,
              "distanceEstimated": False,
              "distanceDisplay": "90 million light-years",
              "redshift": REDSHIFT_Z,
              "redshiftDisplay": "z = 0.005291",
              "redshiftEstimated": False,
              "redshiftMethod": "SIMBAD_2022ApJS_261_21Y_heliocentric_spectroscopic_redshift",
              "redshiftSource": REDSHIFT_SOURCE,
              "redshiftFrame": "heliocentric",
              "redshiftUncertainty": REDSHIFT_ERROR
          })

          record = runtime_matches[0]
          record.update({
              "distanceMly": DISTANCE_MLY,
              "redshift": REDSHIFT_Z,
              "distanceMethod": "published_distance_ESA_Hubble_potw2437a_90_Mly",
              "distanceSource": DISTANCE_SOURCE,
              "redshiftMethod": "SIMBAD_2022ApJS_261_21Y_heliocentric_spectroscopic_redshift",
              "redshiftSource": REDSHIFT_SOURCE,
              "redshiftFrame": "heliocentric",
              "redshiftUncertainty": REDSHIFT_ERROR
          })

          with DISTANCE_MAP.open("r", encoding="utf-8", newline="") as f:
              rows = list(csv.reader(f))
          map_matches = [i for i, row in enumerate(rows) if len(row) >= 4 and row[1].strip().lower() == PROVIDER and row[2].strip().lower() == ARCHIVE_ID]
          if len(map_matches) != 1:
              raise SystemExit(f"STOP: expected exactly one distance-map row for {PROVIDER}/{ARCHIVE_ID}; found {len(map_matches)}")
          rows[map_matches[0]][3] = "90"
          with DISTANCE_MAP.open("w", encoding="utf-8", newline="") as f:
              csv.writer(f, lineterminator="\\n").writerows(rows)

          # Align the existing review row; leave all independent literature measurements intact.
          if REVIEW.is_file():
              with REVIEW.open("r", encoding="utf-8", newline="") as f:
                  review_rows = list(csv.reader(f))
              review_matches = [r for r in review_rows if len(r) >= 5 and r[1].strip().lower() == PROVIDER and r[2].strip().lower() == ARCHIVE_ID]
              if len(review_matches) != 1:
                  raise SystemExit(f"STOP: expected exactly one review row for {PROVIDER}/{ARCHIVE_ID}; found {len(review_matches)}")
              review_matches[0][4] = "90"
              with REVIEW.open("w", encoding="utf-8", newline="") as f:
                  csv.writer(f, lineterminator="\\n").writerows(review_rows)

          SOURCE.write_text(json.dumps(source, indent=2, ensure_ascii=False) + "\\n", encoding="utf-8")
          RUNTIME.write_text(json.dumps(runtime, indent=2, ensure_ascii=False) + "\\n", encoding="utf-8")

          # Re-read persisted data and assert the requested values and single canonical entry.
          source_check = json.loads(SOURCE.read_text(encoding="utf-8"))
          runtime_check = json.loads(RUNTIME.read_text(encoding="utf-8"))
          s = [e for e in source_check["entries"] if e.get("archiveId") == ARCHIVE_ID]
          r = [x for x in runtime_check["records"] if x.get("providerKey") == PROVIDER and x.get("archiveId") == ARCHIVE_ID]
          assert len(s) == 1 and len(r) == 1
          assert float(s[0]["science"]["distanceMly"]) == DISTANCE_MLY
          assert abs(float(s[0]["science"]["redshift"]) - REDSHIFT_Z) < 1e-12
          assert float(r[0]["distanceMly"]) == DISTANCE_MLY
          assert abs(float(r[0]["redshift"]) - REDSHIFT_Z) < 1e-12
          with DISTANCE_MAP.open("r", encoding="utf-8", newline="") as f:
              final_map = list(csv.reader(f))
          assert sum(1 for row in final_map if len(row) >= 4 and row[1].strip().lower() == PROVIDER and row[2].strip().lower() == ARCHIVE_ID and row[3].strip() == "90") == 1
          report = {
              "object": "NGC 5668",
              "providerKey": PROVIDER,
              "archiveId": ARCHIVE_ID,
              "distanceMly": DISTANCE_MLY,
              "redshiftHeliocentric": REDSHIFT_Z,
              "redshiftUncertainty": REDSHIFT_ERROR,
              "sourceCatalogMatchingEntries": len(s),
              "runtimeCatalogMatchingRecords": len(r),
              "sourceCatalogNameMatches": sum(1 for e in source_check["entries"] if str(e.get("name", "")).strip().casefold() == "ngc 5668"),
              "runtimeCatalogNameMatches": sum(1 for x in runtime_check["records"] if str(x.get("name", "")).strip().casefold() == "ngc 5668"),
              "distanceMapMatchingRows": sum(1 for row in final_map if len(row) >= 3 and row[1].strip().lower() == PROVIDER and row[2].strip().lower() == ARCHIVE_ID),
              "distanceSource": DISTANCE_SOURCE,
              "redshiftSource": REDSHIFT_SOURCE,
              "updatedFiles": [str(SOURCE), str(RUNTIME), str(DISTANCE_MAP)] + ([str(REVIEW)] if REVIEW.is_file() else [])
          }
          Path("ngc5668-distance-redshift-repair-report.json").write_text(json.dumps(report, indent=2) + "\\n", encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY

      - name: Validate changes
        run: |
          python3 -m json.tool viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json >/dev/null
          python3 -m json.tool viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json >/dev/null
          git diff --check

      - name: Commit catalog corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json viewer/image-databases/master-database/avm-metadata/avm-runtime-distance-map-0004.csv viewer/image-databases/master-database/avm-metadata/AVM-METADATA-GEMINI-NED-SIMBAD/Galaxy_Viewer_v0004a_Distance_Review_Workbook.csv
          git diff --cached --check
          git commit -m "Correct NGC 5668 published distance and redshift"
          git push origin HEAD:release

      - name: Upload repair report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ngc5668-distance-redshift-repair-report
          path: ngc5668-distance-redshift-repair-report.json
          if-no-files-found: warn
