name: TEMP 10F Two-Space Star Gap

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/temp-10f-two-space-star-gap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact beta head
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Apply exactly two NBSP characters to 0031
        shell: bash
        run: |
          set -euo pipefail
          MOD='viewer/modules/gv-random-galaxy-0031.js'
          VIEWER='viewer/GV-beta-0010F.py'
          TEN_E='viewer/GV-beta-0010E.py'
          CAT='viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0017.json'
          BOOT='viewer/bootstrap/gv-generic-bootstrap-current.js'

          test "$(git hash-object "$MOD")" = 'eaf76aa364853e1f997c5ec439bd8e0205a5e0c8'
          test "$(git hash-object "$VIEWER")" = '464db7f120143012df24023f23f0ba8787e1f05d'
          KEEP_10E=$(git hash-object "$TEN_E")
          KEEP_CAT=$(git hash-object "$CAT")
          KEEP_BOOT=$(git hash-object "$BOOT")

          python - <<'PY'
          from pathlib import Path
          p=Path('viewer/modules/gv-random-galaxy-0031.js')
          s=p.read_text(encoding='utf-8')
          old='<span class="gvrg-random-label">RANDOM GALAXY</span><span class="gvrg-random-star-wrap"'
          new='<span class="gvrg-random-label">RANDOM GALAXY\u00a0\u00a0</span><span class="gvrg-random-star-wrap"'
          if s.count(old) != 1:
              raise SystemExit(f'ABORT: exact star-gap anchor count is {s.count(old)}, expected 1')
          s2=s.replace(old,new,1)
          if len(s2) != len(s)+2:
              raise SystemExit(f'ABORT: expected exactly +2 characters, got {len(s2)-len(s)}')
          # Prove the only textual delta is insertion of two NBSP characters.
          i=0
          while i < len(s) and s[i] == s2[i]: i += 1
          if s2[i:i+2] != '\u00a0\u00a0' or s[i:] != s2[i+2:]:
              raise SystemExit('ABORT: module delta is not exactly two NBSP characters')
          p.write_text(s2,encoding='utf-8')
          print('MODULE CHAR DELTA:',len(s2)-len(s))
          print('INSERTED CODEPOINTS:',[hex(ord(c)) for c in s2[i:i+2]])
          PY
          node --check "$MOD"

          test "$(git hash-object "$TEN_E")" = "$KEEP_10E"
          test "$(git hash-object "$CAT")" = "$KEEP_CAT"
          test "$(git hash-object "$BOOT")" = "$KEEP_BOOT"

          mapfile -t CHANGED < <(git status --porcelain | sed -E 's/^.. //')
          test "${#CHANGED[@]}" -eq 1
          test "${CHANGED[0]}" = "$MOD"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$MOD"
          git diff --cached --check
          git commit -m '10F add two-character gap before star icon'
          git push origin HEAD:beta

          MOD_COMMIT=$(git rev-parse HEAD)
          MOD_BLOB=$(git hash-object "$MOD")
          printf '%s\n' "$MOD_COMMIT" > /tmp/mod_commit
          printf '%s\n' "$MOD_BLOB" > /tmp/mod_blob
          echo "MODULE_COMMIT=$MOD_COMMIT"
          echo "MODULE_BLOB=$MOD_BLOB"

      - name: Update only 10F immutable 0031 pin
        shell: bash
        run: |
          set -euo pipefail
          MOD='viewer/modules/gv-random-galaxy-0031.js'
          VIEWER='viewer/GV-beta-0010F.py'
          TEN_E='viewer/GV-beta-0010E.py'
          CAT='viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0017.json'
          BOOT='viewer/bootstrap/gv-generic-bootstrap-current.js'
          MOD_COMMIT=$(cat /tmp/mod_commit)
          MOD_BLOB=$(cat /tmp/mod_blob)
          KEEP_MOD=$(git hash-object "$MOD")
          KEEP_10E=$(git hash-object "$TEN_E")
          KEEP_CAT=$(git hash-object "$CAT")
          KEEP_BOOT=$(git hash-object "$BOOT")

          python - "$MOD_COMMIT" "$MOD_BLOB" <<'PY'
          from pathlib import Path
          import sys
          commit,blob=sys.argv[1:3]
          p=Path('viewer/GV-beta-0010F.py')
          s=p.read_text(encoding='utf-8')
          old="const RANDOM_GALAXY_URL='https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/1e6e2de79c24164003dd313132134b3866c2ca36/viewer/modules/gv-random-galaxy-0031.js?v=eaf76aa364853e1f997c5ec439bd8e0205a5e0c8';"
          new=f"const RANDOM_GALAXY_URL='https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/{commit}/viewer/modules/gv-random-galaxy-0031.js?v={blob}';"
          if s.count(old) != 1:
              raise SystemExit(f'ABORT: exact old 0031 pin count is {s.count(old)}, expected 1')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          compile(s,str(p),'exec')
          print('NEW PIN:',new)
          PY

          test "$(git hash-object "$MOD")" = "$KEEP_MOD"
          test "$(git hash-object "$TEN_E")" = "$KEEP_10E"
          test "$(git hash-object "$CAT")" = "$KEEP_CAT"
          test "$(git hash-object "$BOOT")" = "$KEEP_BOOT"

          mapfile -t CHANGED < <(git status --porcelain | sed -E 's/^.. //')
          test "${#CHANGED[@]}" -eq 1
          test "${CHANGED[0]}" = "$VIEWER"

          git add "$VIEWER"
          git diff --cached --check
          git commit -m '10F pin two-space Random Galaxy 0031 module'
          git push origin HEAD:beta

      - name: Fetch-back exact verification
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin beta
          git reset --hard origin/beta
          MOD='viewer/modules/gv-random-galaxy-0031.js'
          VIEWER='viewer/GV-beta-0010F.py'
          python - <<'PY'
          from pathlib import Path
          m=Path('viewer/modules/gv-random-galaxy-0031.js').read_text(encoding='utf-8')
          v=Path('viewer/GV-beta-0010F.py').read_text(encoding='utf-8')
          needle='RANDOM GALAXY\u00a0\u00a0</span><span class="gvrg-random-star-wrap"'
          if m.count(needle)!=1: raise SystemExit('ABORT: two-NBSP label not present exactly once')
          if "gvRandomGalaxy0031" not in v or "VERSION!=='0031'" not in v: raise SystemExit('ABORT: 0031 verifier/click path drift')
          compile(v,'viewer/GV-beta-0010F.py','exec')
          print('FINAL MODULE BLOB VERIFIED BY WORKTREE')
          print('TWO NBSP COUNT:',m.count('\u00a0\u00a0'))
          PY
          node --check "$MOD"
