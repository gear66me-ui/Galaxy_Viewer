name: Enrich Hubble sandbox 0002

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/enrich-hubble-sandbox-0002.yml'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Install constellation resolver
        run: python -m pip install --quiet astropy
      - name: Enrich deterministic science fields
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, pathlib, re
          from astropy.coordinates import SkyCoord, get_constellation
          import astropy.units as u

          p = pathlib.Path('viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0002.json')
          data = json.loads(p.read_text())
          assert data.get('version') == 'full-0002'
          assert data.get('metadataRecordCount') == 1879
          entries = data.get('entries', [])
          assert len(entries) == 1879
          ids = [e.get('archiveId') for e in entries]
          assert len(ids) == len(set(ids))

          fov_re = re.compile(r'^\s*([0-9]+(?:\.[0-9]+)?)\s*x\s*([0-9]+(?:\.[0-9]+)?)\s*arcminutes\s*$', re.I)
          counts = {
              'totalRecords': len(entries),
              'constellationDerived': 0,
              'constellationPreserved': 0,
              'constellationUnresolved': 0,
              'sizeEstimated': 0,
              'sizePreservedManual': 0,
              'sizeUnresolved': 0,
          }

          for e in entries:
              # Preserve manually approved Antennae science record.
              manual = e.get('archiveId') == 'potw1345a' or str(e.get('science', {}).get('sizeMethod','')).startswith('manual_')

              ra, dec = e.get('ra'), e.get('dec')
              if isinstance(ra, (int,float)) and isinstance(dec, (int,float)) and math.isfinite(ra) and math.isfinite(dec):
                  derived = get_constellation(SkyCoord(ra=ra*u.deg, dec=dec*u.deg), short_name=False)
                  if e.get('constellation') != derived:
                      e['constellation'] = derived
                      e['constellationMethod'] = 'iau_boundary_from_radec'
                      counts['constellationDerived'] += 1
                  else:
                      e.setdefault('constellationMethod', 'catalog_or_iau_consistent')
                      counts['constellationPreserved'] += 1
              elif e.get('constellation'):
                  counts['constellationPreserved'] += 1
              else:
                  counts['constellationUnresolved'] += 1

              s = e.setdefault('science', {})
              if manual:
                  counts['sizePreservedManual'] += 1
                  continue

              d = s.get('distanceMly')
              m = fov_re.match(str(e.get('fieldOfView') or ''))
              if isinstance(d, (int,float)) and d > 0 and m:
                  ax, ay = float(m.group(1)), float(m.group(2))
                  # Small-angle physical span: D(kly) * theta(rad).
                  sx = d * 1000.0 * math.radians(ax / 60.0)
                  sy = d * 1000.0 * math.radians(ay / 60.0)
                  # Keep two decimals internally; display rounds to nearest KLY.
                  sx, sy = round(sx, 2), round(sy, 2)
                  s['sizeKly'] = [sx, sy]
                  s['sizeEstimated'] = True
                  s['sizeMethod'] = 'distance_fov_estimate'
                  s['sizeDisplay'] = f"EST. {round(sx):g} x {round(sy):g} KLY"
                  counts['sizeEstimated'] += 1
              else:
                  counts['sizeUnresolved'] += 1

          data.setdefault('manualEnrichment', {})['sandbox'] = True
          data['manualEnrichment']['deterministicEnrichment'] = counts
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          chk = json.loads(p.read_text())
          assert len(chk['entries']) == 1879
          ant = next(e for e in chk['entries'] if e.get('archiveId') == 'potw1345a')
          assert ant['science']['ageDisplay'] == 'EST. 0.1-1 GYR'
          assert ant['science']['sizeKly'] == [53.0, 53.0]
          assert ant['imageReview'] == 'PASS'
          print(json.dumps(counts, indent=2))
          PY
      - name: Commit enriched sandbox catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0002.json
          git commit -m 'Enrich Hubble sandbox 0002 deterministic science fields'
          for i in 1 2 3 4 5; do
            git fetch origin beta
            git rebase origin/beta
            if git push origin HEAD:beta; then exit 0; fi
            sleep 2
          done
          exit 1
