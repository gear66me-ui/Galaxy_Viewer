name: Create Galaxy Viewer 9J JSON 0002 group designation
on:
  push:
    paths:
      - '.github/workflows/create-9j-json0002-group-designation.yml'
permissions:
  contents: write
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Build 9J from frozen 9I
        run: python .github/scripts/create_9j_json0002.py
      - name: Verify frozen 9I and commit 9J
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- viewer/GV-beta-0009I.py mobile/beta/9I.html
          grep -F 'gv-hubble-galaxies-full-0002.json' viewer/GV-beta-0009J.py
          grep -F 'HCG 92' viewer/GV-beta-0009J.py
          grep -F './9J.html' mobile/beta/index.html
          git config user.name 'Galaxy Viewer Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add viewer/GV-beta-0009J.py mobile/beta/9J.html mobile/beta/index.html
          git commit -m 'Create 9J with JSON 0002 and group-aware designation'
          git fetch origin beta
          git rebase origin/beta
          git push origin HEAD:beta
          echo "COMMIT=$(git rev-parse HEAD)"
