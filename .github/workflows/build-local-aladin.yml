name: Build Local Aladin

on:
  workflow_dispatch:
  push:
    branches:
      - beta
    paths:
      - '.github/workflows/build-local-aladin.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out beta
        uses: actions/checkout@v4
        with:
          ref: beta

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack and wasm-opt
        run: |
          cargo install wasm-pack --locked
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Install Aladin dependencies
        working-directory: aladin-source-clone
        run: npm install

      - name: Build unmodified Aladin distribution
        working-directory: aladin-source-clone
        run: npm run build:prod

      - name: Commit generated distribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f aladin-source-clone/dist
          if git diff --cached --quiet; then
            echo "No distribution changes to commit."
          else
            git commit -m "Build local Aladin distribution"
            git push origin beta
          fi
