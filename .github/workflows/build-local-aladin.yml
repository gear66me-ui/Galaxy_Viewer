name: Build Local Aladin

on:
  workflow_dispatch:
  push:
    branches:
      - beta
    paths:
      - '.github/workflows/build-local-aladin.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out beta
        uses: actions/checkout@v4
        with:
          ref: beta

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack and wasm-opt
        run: |
          cargo install wasm-pack --locked
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Install Aladin dependencies
        working-directory: aladin-source-clone
        run: npm install

      - name: Build unmodified Aladin distribution with diagnostic log
        working-directory: aladin-source-clone
        env:
          CARGO_BUILD_JOBS: '1'
          CARGO_TERM_COLOR: never
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm run build:npm 2>&1 | tee aladin-build.log
          build_status=${PIPESTATUS[0]}

          if [ "$build_status" -ne 0 ]; then
            echo
            echo "================ FIRST COMPILER ERRORS ================"
            grep -n -B 20 -A 50 -E '(^|[[:space:]])error(\[[A-Z0-9]+\])?:' aladin-build.log | head -n 300 || true
            echo
            echo "================ FINAL 250 LOG LINES =================="
            tail -n 250 aladin-build.log
            echo
            echo "Build failed with status $build_status"
            exit "$build_status"
          fi

      - name: Commit generated distribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f aladin-source-clone/dist
          if git diff --cached --quiet; then
            echo "No distribution changes to commit."
          else
            git commit -m "Build local Aladin distribution"
            git push origin beta
          fi
