name: Enrich AVM Runtime Distances and Redshifts from NED

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "audit reports proposed changes; apply writes the canonical fields"
        required: true
        type: choice
        options:
          - audit
          - apply
        default: audit

permissions:
  contents: write

concurrency:
  group: ned-runtime-distance-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Query NED API and audit proposed canonical distance/redshift values
        env:
          MODE: ${{ inputs.mode }}
        run: python .github/scripts/enrich_avm_runtime_from_ned.py

      - name: Upload full NED lookup audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ned-runtime-distance-audit
          path: ned-runtime-distance-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate updated runtime JSON
        if: inputs.mode == 'apply'
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          p = Path("viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0003.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          if isinstance(data, list):
              rows = data
          else:
              rows = next((data[k] for k in ("records", "entries", "galaxies", "items", "data") if isinstance(data.get(k), list)), None)
          if not isinstance(rows, list) or len(rows) < 100:
              raise SystemExit("Runtime catalog schema/count validation failed.")
          invalid = [i for i, r in enumerate(rows) if r.get("distanceMly") is not None and (not isinstance(r["distanceMly"], (int, float)) or not math.isfinite(r["distanceMly"]) or r["distanceMly"] <= 0)]
          if invalid:
              raise SystemExit(f"Invalid canonical distanceMly values at rows: {invalid[:20]}")
          print(f"Validated {len(rows)} runtime records; canonical distanceMly values are valid.")
          PY

      - name: Commit runtime enrichment only in apply mode
        if: inputs.mode == 'apply'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0003.json
          if git diff --cached --quiet; then
            echo "No runtime changes to commit."
          else
            git diff --cached --stat
            git commit -m "Enrich AVM runtime distances and redshifts from NED"
            git push origin HEAD:${{ github.ref_name }}
          fi
