name: TEMP Catalog 0018 one-word chunks
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/temp-catalog18-oneword-chunks.yml']
permissions:
  contents: write
jobs:
  chunks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: beta}
      - shell: bash
        run: |
          python - <<'PY'
          import json,csv
          p='viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0018.json'
          d=json.load(open(p,encoding='utf-8'))
          rows=[]
          for i,e in enumerate(d['entries']):
              n=(e.get('displayName') or '').strip()
              if n and len(n.split())==1:
                  rows.append([i,e.get('archiveId',''),n,e.get('designation',''),e.get('name',''),e.get('title',''),e.get('sourceUrl','')])
          for c in range(4):
              q=f'viewer/image-databases/Hubble/databases/temp-catalog18-oneword-{c+1}.tsv'
              with open(q,'w',encoding='utf-8',newline='') as f:
                  w=csv.writer(f,delimiter='\t'); w.writerow(['index','archiveId','displayName','designation','name','title','sourceUrl'])
                  w.writerows(rows[c*24:(c+1)*24])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add viewer/image-databases/Hubble/databases/temp-catalog18-oneword-*.tsv
          git commit -m 'TEMP split Catalog 0018 one-word summary'
          git push origin HEAD:beta
