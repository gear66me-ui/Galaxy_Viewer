name: TEMP Forward 132BJ 0229 AVM0056

on:
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forward_patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
          persist-credentials: true

      - name: Create 132BJ / Random 0229 / AVM 0056
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          viewer_source=Path('viewer/GV-12AR-132BI.py')
          if not viewer_source.exists():
              viewer_source=Path('viewer/GV-12AR-132BD.py')
          random_source=Path('viewer/modules/random-galaxy/gv-random-galaxy-0227.js')
          avm_source=Path('viewer/modules/lab/gv-avm-overlay-lab-0053.js')
          bj=Path('viewer/GV-12AR-132BJ.py')
          rg229=Path('viewer/modules/random-galaxy/gv-random-galaxy-0229.js')
          avm56=Path('viewer/modules/lab/gv-avm-overlay-lab-0056.js')
          ptr=Path('viewer/gv-current-viewer.json')

          for p in [viewer_source, random_source, avm_source, ptr]:
              if not p.exists():
                  raise SystemExit('FAIL missing baseline: '+str(p))

          # Viewer BJ dependency tree
          viewer=viewer_source.read_text(encoding='utf-8')
          viewer_replacements=[
              ("const VERSION='12AR-132BD';", "const VERSION='12AR-132BJ';"),
              ("const VERSION='12AR-132BI';", "const VERSION='12AR-132BJ';"),
              ("const DISPLAY_VERSION='12AR-132BD';", "const DISPLAY_VERSION='12AR-132BJ';"),
              ("const DISPLAY_VERSION='12AR-132BI';", "const DISPLAY_VERSION='12AR-132BJ';"),
              ("gv-random-galaxy-0227.js", "gv-random-galaxy-0229.js"),
              ("gv-random-galaxy-0228.js", "gv-random-galaxy-0229.js"),
              ("RANDOM_GALAXY_VERSION='0227'", "RANDOM_GALAXY_VERSION='0229'"),
              ("RANDOM_GALAXY_VERSION='0228'", "RANDOM_GALAXY_VERSION='0229'"),
              ("gv-avm-overlay-lab-0053.js", "gv-avm-overlay-lab-0056.js"),
              ("AVM_OVERLAY_LAB_VERSION='0053'", "AVM_OVERLAY_LAB_VERSION='0056'"),
          ]
          for old,new in viewer_replacements:
              c=viewer.count(old)
              print('VIEWER_REPLACE', old, c)
              if c>1:
                  raise SystemExit('FAIL viewer marker >1: '+old)
              if c==1:
                  viewer=viewer.replace(old,new,1)
          for marker in ["const VERSION='12AR-132BJ';", "const DISPLAY_VERSION='12AR-132BJ';", "gv-random-galaxy-0229.js", "RANDOM_GALAXY_VERSION='0229'", "gv-navigation-0022.js", "gv-avm-overlay-lab-0056.js"]:
              c=viewer.count(marker)
              print('VIEWER_REQUIRED', marker, c)
              if c<1:
                  raise SystemExit('FAIL missing viewer marker: '+marker)
          bj.write_text(viewer, encoding='utf-8', newline='\n')

          # Random 0229 WCS center authority repair
          rg=random_source.read_text(encoding='utf-8')
          old_block="""            const centerAuthority=gv0223ImageCenterFromWcs(wcs,actualWidth,actualHeight);
            const cameraRa=ra;
            const cameraDec=dec;"""
          new_block="""            const centerAuthority=gv0223ImageCenterFromWcs(wcs,actualWidth,actualHeight);
            const centerRa=Number(centerAuthority&&centerAuthority.ra);
            const centerDec=Number(centerAuthority&&centerAuthority.dec);
            const cameraRa=Number.isFinite(centerRa)?centerRa:ra;
            const cameraDec=Number.isFinite(centerDec)?centerDec:dec;"""
          c=rg.count(old_block)
          print('RANDOM_BAD_BLOCK_COUNT', c)
          if c!=1:
              raise SystemExit('FAIL random camera block count expected 1 got '+str(c))
          rg=rg.replace(old_block,new_block,1)
          vc=rg.count("const VERSION='0227';")
          print('RANDOM_VERSION_0227_COUNT', vc)
          if vc!=1:
              raise SystemExit('FAIL random version count expected 1 got '+str(vc))
          rg=rg.replace("const VERSION='0227';", "const VERSION='0229';", 1)
          rg_header="""/*
RANDOM GALAXY 0229 — FORWARD-ONLY WCS IMAGE-CENTER CAMERA AUTHORITY REPAIR
BASELINE SOURCE: RANDOM GALAXY 0227
AUTHORIZED CHANGE:
- Use derived WCS geometric image center for precomputed AVM camera RA/Dec when available.
- Keep CRVAL/CRPIX/WCS metadata intact.
- No HD download, queue, catalog, navigation, AVM, vignette, or UI changes.
*/
"""
          rg229.write_text(rg_header+rg, encoding='utf-8', newline='\n')

          # AVM 0056 arrival gate repair
          avm=avm_source.read_text(encoding='utf-8')
          avm=avm.replace('const VERSION="0053";', 'const VERSION="0056";', 1)
          old_gate='function isArrivedStable(){const st=stateOf(),open=hdOpen(),result=!open&&navigationSeen===true&&st.arrived===true&&st.busy!==true;trace("AVM_ARRIVAL_STATE",{arrived:st.arrived,busy:st.busy,hdOpen:open,navigationSeen,result});if(!result)trace("AVM_ARRIVAL_GATE_FALSE",{arrived:st.arrived,busy:st.busy,hdOpen:open,navigationSeen});return result}'
          new_gate='function isArrivedStable(){const st=stateOf(),open=hdOpen();const randomArrived=st.arrived===true&&st.busy!==true;const pendingPrepared=pendingReady===true&&!!pendingOverlay&&!!pendingKey;const result=!open&&randomArrived&&(navigationSeen===true||pendingPrepared);trace("AVM_ARRIVAL_STATE",{arrived:st.arrived,busy:st.busy,hdOpen:open,navigationSeen,pendingPrepared,result});if(!result)trace("AVM_ARRIVAL_GATE_FALSE",{arrived:st.arrived,busy:st.busy,hdOpen:open,navigationSeen,pendingPrepared});return result}'
          gc=avm.count(old_gate)
          print('AVM_OLD_GATE_COUNT', gc)
          if gc!=1:
              raise SystemExit('FAIL AVM old gate count expected 1 got '+str(gc))
          avm=avm.replace(old_gate,new_gate,1)
          avm_header="""/*
AVM 0056 — ARRIVAL PRESENTATION GATE REPAIR
BASELINE: AVM 0053
AUTHORIZED CHANGE:
- Allows a fully prepared pending AVM overlay to satisfy arrival presentation when Random says arrived and not busy, even if navigationSeen is stale false.
- Preserves HD-open suppression, Random arrival authority, and busy-state suppression.
- No vignette math, image transport, WCS, Navigation, Random, catalog, or HD UI layout changes.
*/
"""
          avm56.write_text(avm_header+avm, encoding='utf-8', newline='\n')

          ptr.write_text(json.dumps({'version':'12AR-132BJ','viewer':'GV-12AR-132BJ.py'}, indent=2)+'\n', encoding='utf-8', newline='\n')

          checks={
              'BJ_VERSION': bj.read_text(encoding='utf-8').count("const VERSION='12AR-132BJ';"),
              'BJ_RANDOM_0229': bj.read_text(encoding='utf-8').count('gv-random-galaxy-0229.js'),
              'BJ_AVM_0056': bj.read_text(encoding='utf-8').count('gv-avm-overlay-lab-0056.js'),
              'RG_VERSION_0229': rg229.read_text(encoding='utf-8').count("const VERSION='0229';"),
              'RG_CENTER_RA': rg229.read_text(encoding='utf-8').count('const centerRa=Number(centerAuthority&&centerAuthority.ra);'),
              'AVM_VERSION_0056': avm56.read_text(encoding='utf-8').count('const VERSION="0056";'),
              'AVM_PENDING_PREPARED': avm56.read_text(encoding='utf-8').count('pendingPrepared'),
              'AVM_OLD_GATE': avm56.read_text(encoding='utf-8').count('navigationSeen===true&&st.arrived===true')
          }
          print('=== FINAL INTERNAL CHECKS ===')
          for k,v in checks.items(): print(k, v)
          if checks['BJ_VERSION']!=1 or checks['BJ_RANDOM_0229']<1 or checks['BJ_AVM_0056']<1: raise SystemExit('FAIL BJ checks')
          if checks['RG_VERSION_0229']!=1 or checks['RG_CENTER_RA']<1: raise SystemExit('FAIL Random checks')
          if checks['AVM_VERSION_0056']!=1 or checks['AVM_PENDING_PREPARED']<2 or checks['AVM_OLD_GATE']!=0: raise SystemExit('FAIL AVM checks')
          print('FORWARD_132BJ_0229_AVM0056_PATCH_OK')
          PY

          git diff --check
          echo '=== CHANGED FILES ==='
          git status --short
          git add viewer/GV-12AR-132BJ.py viewer/modules/random-galaxy/gv-random-galaxy-0229.js viewer/modules/lab/gv-avm-overlay-lab-0056.js viewer/gv-current-viewer.json
          echo '=== STAGED FILES ==='
          git diff --cached --name-only | sort
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Advance to 132BJ with Random 0229 and AVM 0056 arrival presentation repair'
          git push origin HEAD:beta
