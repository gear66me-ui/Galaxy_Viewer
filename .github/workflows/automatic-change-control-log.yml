name: Automatic Change Control Log

# ================================================================
# GALAXY VIEWER — MANDATORY RUNTIME AND VISUAL VERIFICATION POLICY
# ================================================================
#
# This policy is a standing requirement for every future Galaxy Viewer
# Engineering Change Order.
#
# IMPLEMENTATION IS NOT VERIFICATION.
#
# A source-code change is not considered successful merely because:
#
# - the requested lines were changed;
# - formulas appear correct;
# - telemetry values change;
# - JavaScript parses;
# - GLSL source appears valid;
# - a commit succeeded;
# - a blob SHA matches;
# - a static/source comparison passes.
#
# Every Engineering Change Order must verify BOTH:
#
# 1. IMPLEMENTATION:
#    The authorized source changes were made exactly and no unauthorized
#    content changed.
#
# 2. BEHAVIOR:
#    The resulting artifact actually performs the requested behavior.
#
#
# ------------------------------------------------
# MANDATORY HTML RUNTIME TEST
# ------------------------------------------------
#
# After every authorized HTML creation or modification, ChatGPT MUST:
#
# 1. Fetch the committed HTML back from the repository.
#
# 2. Verify that the fetched bytes are the exact bytes intended for
#    testing.
#
# 3. Run/open that exact HTML.
#
# 4. Load the actual production assets referenced by that HTML.
#
# 5. Verify that JavaScript/runtime initialization succeeds.
#
# 6. Check for visible/runtime errors.
#
# 7. Exercise the relevant controls, timing, states and interactions
#    required by the ECO.
#
# 8. Observe the actual rendered result.
#
# 9. Compare the observed result directly against every behavioral
#    acceptance criterion in the ECO.
#
# 10. Record which criteria visibly passed and which visibly failed.
#
#
# ------------------------------------------------
# MANDATORY VISUAL TEST
# ------------------------------------------------
#
# Any requirement describing appearance, movement, animation, timing,
# geometry, positioning, deformation, rotation, smear, fade, color,
# size, alignment, visibility or interaction requires actual visual
# observation.
#
# Source inspection alone MUST NOT be classified as a visual PASS.
#
# Mathematical calculations alone MUST NOT be classified as a visual
# PASS.
#
# Telemetry alone MUST NOT be classified as a visual PASS.
#
# Multiple shader/history samples alone MUST NOT be classified as proof
# that a visible smear exists.
#
# A changing rotation variable alone MUST NOT be classified as proof
# that an object visibly rotates.
#
# The behavior itself must be visible in the rendered artifact.
#
#
# ------------------------------------------------
# ANIMATION-SPECIFIC TESTING
# ------------------------------------------------
#
# For animation changes, ChatGPT MUST inspect the actual requested
# timeline.
#
# If an ECO specifies frames, times or milestones, those exact regions
# must be inspected.
#
# Example:
#
# If the ECO requires behavior between frames 314 and 330, ChatGPT must
# actually inspect frames 314 through 330, or their exact corresponding
# times, in the rendered artifact.
#
# It is insufficient to calculate what should occur at those frames.
#
# Frame controls supplied for inspection must be exercised when they are
# relevant to acceptance testing.
#
#
# ------------------------------------------------
# LIVE-SITE VERIFICATION
# ------------------------------------------------
#
# When the artifact is served through GitHub Pages and live-site testing
# is technically possible, ChatGPT MUST open the actual GitHub Pages
# artifact after the repository write.
#
# Use a cache-busting query based on the exact verified commit SHA when
# appropriate so stale content is not mistaken for the current release.
#
# The committed/fetch-back repository artifact and the artifact being
# visually tested must represent the same release.
#
#
# ------------------------------------------------
# ACTUAL ASSETS REQUIRED
# ------------------------------------------------
#
# Visual acceptance testing must use the actual production assets.
#
# A synthetic image, mock target, simplified drawing or reconstructed
# scene may be used only as a diagnostic aid.
#
# It MUST NOT substitute for testing the real HTML with its real assets.
#
#
# ------------------------------------------------
# FAILURE / UNAVAILABLE-TEST RULE
# ------------------------------------------------
#
# If ChatGPT cannot run, open, render or visually inspect the actual
# artifact:
#
# - do not claim visual success;
# - do not claim runtime success;
# - do not claim the behavioral requirement passed;
# - do not call the ECO fully complete;
# - explicitly state what could not be tested;
# - classify affected requirements as UNVERIFIED,
#   REQUIRES VISUAL TESTING, or REQUIRES LIVE-SITE TESTING.
#
# A lower level of evidence must never be promoted into a higher level
# of verification.
#
#
# ------------------------------------------------
# OBSERVED FAILURE RULE
# ------------------------------------------------
#
# If actual runtime or visual behavior does not satisfy an authorized
# acceptance criterion, classify that requirement as FAIL.
#
# A mathematically plausible implementation does not override an
# observed visual failure.
#
# Do not silently repair a failed test.
#
# Any additional repository modification requires authorization under
# the controlled Engineering Change Order process.
#
#
# ------------------------------------------------
# COMPLETION GATE
# ------------------------------------------------
#
# Before calling any ECO complete, ChatGPT must ask internally:
#
# A. Did I verify the exact committed/fetch-back source?
#
# B. Did I run the actual executable artifact where the request requires
#    runtime behavior?
#
# C. Did I use the real production assets?
#
# D. Did I inspect the exact relevant frames/states/interactions?
#
# E. Did I visually observe every visual acceptance requirement?
#
# F. Did I check for runtime errors?
#
# G. Does the observed behavior actually match the user's request?
#
# H. Am I clearly distinguishing source, syntax, runtime, visual,
#    live-site and device testing?
#
# If any required answer is NO, the ECO may not be reported as a full
# PASS.
#
#
# ------------------------------------------------
# REQUIRED COMPLETION REPORT LANGUAGE
# ------------------------------------------------
#
# Every completion report must separately identify:
#
# - SOURCE INSPECTION
# - EXACT TEXT/BLOB COMPARISON
# - SYNTAX VALIDATION
# - RUNTIME TESTING
# - VISUAL TESTING
# - LIVE-SITE TESTING
# - PHYSICAL-DEVICE TESTING
#
# Only testing actually performed may receive PASS.
#
# CORE RULE:
#
# DO NOT VERIFY ONLY THAT THE CODE CHANGED.
# VERIFY THAT THE RESULT ACTUALLY WORKS.
#
# ================================================================
# END MANDATORY RUNTIME AND VISUAL VERIFICATION POLICY
# ================================================================


on:
  push:
    branches:
      - beta

permissions:
  contents: write

concurrency:
  group: galaxy-viewer-change-control-beta
  cancel-in-progress: false

jobs:
  record-change:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Fetch exact pushed revision
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Forensic account every changed file
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          python3 <<'PY'
          import difflib
          import hashlib
          import os
          import pathlib
          import re
          import subprocess
          import sys
          from datetime import datetime, timezone

          log_path = pathlib.Path('docs/GALAXY-VIEWER-CHANGE-CONTROL-LOG.md')
          log_path.parent.mkdir(parents=True, exist_ok=True)
          commit_sha = os.environ['COMMIT_SHA']
          before_sha = os.environ.get('BEFORE_SHA', '')
          zero_sha = '0' * 40

          def git_text(*args):
              return subprocess.check_output(['git', *args], text=True).rstrip('\n')

          def git_bytes(*args):
              return subprocess.check_output(['git', *args])

          if not before_sha or before_sha == zero_sha:
              try:
                  before_sha = git_text('rev-parse', f'{commit_sha}^')
              except subprocess.CalledProcessError:
                  before_sha = commit_sha

          def blob_at(ref, path):
              if not path:
                  return b''
              try:
                  return git_bytes('show', f'{ref}:{path}')
              except subprocess.CalledProcessError:
                  return b''

          def sha256(data):
              return hashlib.sha256(data).hexdigest()

          def utf8_text(data):
              if b'\x00' in data:
                  return None
              try:
                  return data.decode('utf-8')
              except UnicodeDecodeError:
                  return None

          def audit_text(old_text, new_text):
              old_lines = old_text.splitlines(keepends=True)
              new_lines = new_text.splitlines(keepends=True)
              matcher = difflib.SequenceMatcher(a=old_lines, b=new_lines, autojunk=False)
              inserted_lines = deleted_lines = inserted_blocks = deleted_blocks = changed_blocks = 0
              for tag, i1, i2, j1, j2 in matcher.get_opcodes():
                  if tag == 'equal':
                      continue
                  changed_blocks += 1
                  if tag in ('insert', 'replace'):
                      inserted_lines += j2 - j1
                      inserted_blocks += 1
                  if tag in ('delete', 'replace'):
                      deleted_lines += i2 - i1
                      deleted_blocks += 1
              chars = difflib.SequenceMatcher(a=old_text, b=new_text, autojunk=False)
              inserted_chars = deleted_chars = 0
              for tag, i1, i2, j1, j2 in chars.get_opcodes():
                  if tag in ('insert', 'replace'):
                      inserted_chars += j2 - j1
                  if tag in ('delete', 'replace'):
                      deleted_chars += i2 - i1
              return {
                  'old_lines': len(old_text.splitlines()),
                  'new_lines': len(new_text.splitlines()),
                  'old_chars': len(old_text),
                  'new_chars': len(new_text),
                  'inserted_lines': inserted_lines,
                  'deleted_lines': deleted_lines,
                  'inserted_chars': inserted_chars,
                  'deleted_chars': deleted_chars,
                  'inserted_blocks': inserted_blocks,
                  'deleted_blocks': deleted_blocks,
                  'changed_blocks': changed_blocks,
              }

          def hunk_count(old_path, new_path):
              path = new_path or old_path
              if not path:
                  return 0
              try:
                  patch = git_text('diff', '--no-ext-diff', '--unified=0', before_sha, commit_sha, '--', path)
              except subprocess.CalledProcessError:
                  return 0
              return sum(1 for line in patch.splitlines() if line.startswith('@@'))

          name_status = git_text('diff', '--name-status', '-M', before_sha, commit_sha)
          changed = []
          for raw in name_status.splitlines():
              parts = raw.split('\t')
              if not parts:
                  continue
              code = parts[0]
              kind = code[0]
              if kind == 'R' and len(parts) >= 3:
                  changed.append((f'RENAMED {code[1:]}%', parts[1], parts[2]))
              elif kind == 'C' and len(parts) >= 3:
                  changed.append((f'COPIED {code[1:]}%', parts[1], parts[2]))
              elif len(parts) >= 2:
                  status = {'A':'ADDED','M':'MODIFIED','D':'DELETED','T':'TYPE CHANGED','U':'UNMERGED'}.get(kind, code)
                  path = parts[1]
                  changed.append((status, path if kind == 'D' else None, path if kind != 'D' else None))

          marker_terms = (
              'GALAXY VIEWER CHANGE ORDER', 'ENGINEERING CHANGE ORDER', 'CHANGE ORDER:',
              'USER REQUEST:', 'USER INSTRUCTION:', 'AUTHORIZED CHANGES:', 'AUTHORIZED PATHS:',
              'PRESERVED BEHAVIOR:', 'PURPOSE:'
          )

          audits = []
          failures = []
          evidence = []

          for status, old_path, new_path in changed:
              display_path = f'{old_path} → {new_path}' if old_path and new_path and old_path != new_path else (new_path or old_path)
              old_data = b'' if status == 'ADDED' else blob_at(before_sha, old_path or new_path)
              new_data = b'' if status == 'DELETED' else blob_at(commit_sha, new_path or old_path)
              old_text = utf8_text(old_data)
              new_text = utf8_text(new_data)
              text_mode = old_text is not None and new_text is not None
              item = {
                  'status': status,
                  'path': display_path,
                  'old_bytes': len(old_data),
                  'new_bytes': len(new_data),
                  'old_sha': sha256(old_data),
                  'new_sha': sha256(new_data),
                  'text': text_mode,
              }
              if text_mode:
                  delta = audit_text(old_text, new_text)
                  item.update(delta)
                  item['hunks'] = hunk_count(old_path, new_path)
                  item['line_ok'] = delta['old_lines'] + delta['inserted_lines'] - delta['deleted_lines'] == delta['new_lines']
                  item['char_ok'] = delta['old_chars'] + delta['inserted_chars'] - delta['deleted_chars'] == delta['new_chars']
                  if not (item['line_ok'] and item['char_ok']):
                      failures.append(display_path)
                  if new_text:
                      matches = []
                      for line in new_text.splitlines():
                          stripped = line.strip()
                          if any(term in stripped.upper() for term in marker_terms):
                              matches.append(stripped[:500])
                          if len(matches) >= 30:
                              break
                      if matches:
                          evidence.append((display_path, matches))
              audits.append(item)

          timestamp = os.environ.get('COMMIT_TIMESTAMP') or datetime.now(timezone.utc).isoformat()
          author = os.environ.get('COMMIT_AUTHOR') or 'Not recorded'
          message = os.environ.get('COMMIT_MESSAGE') or 'No commit message recorded'
          commit_url = os.environ.get('COMMIT_URL') or f"https://github.com/{os.environ['REPOSITORY']}/commit/{commit_sha}"
          compare_url = f"https://github.com/{os.environ['REPOSITORY']}/compare/{before_sha}...{commit_sha}"
          overall = 'PASS' if not failures else 'FAIL'

          entry = [
              f'## AUTO-{commit_sha[:12]} — {message.splitlines()[0]}', '',
              f'**Recorded:** {timestamp}  ',
              f"**Repository:** `{os.environ['REPOSITORY']}`  ",
              f"**Branch:** `{os.environ['BRANCH_NAME']}`  ",
              f'**Source commit:** [`{commit_sha}`]({commit_url})  ',
              f'**Parent/baseline:** `{before_sha}`  ',
              f'**Comparison:** [View exact diff]({compare_url})  ',
              f'**Author:** {author}  ',
              f'**Changed-path count:** `{len(audits)}`  ',
              f'**Forensic reconciliation:** **{overall}**', '',
              '### Commit message', '', '```text', *message.splitlines(), '```', '',
              '### Complete changed-path accounting', ''
          ]

          if not audits:
              entry.append('- No changed paths detected.')

          for a in audits:
              entry.extend([
                  f"#### `{a['path']}`", '',
                  f"- Status: **{a['status']}**",
                  f"- SHA-256 before: `{a['old_sha']}`",
                  f"- SHA-256 after: `{a['new_sha']}`",
                  f"- Bytes: `{a['old_bytes']}` → `{a['new_bytes']}`",
              ])
              if a['text']:
                  entry.extend([
                      f"- Lines: `{a['old_lines']}` → `{a['new_lines']}`",
                      f"- Characters: `{a['old_chars']}` → `{a['new_chars']}`",
                      f"- Inserted lines: `{a['inserted_lines']}`",
                      f"- Deleted lines: `{a['deleted_lines']}`",
                      f"- Inserted characters: `{a['inserted_chars']}`",
                      f"- Deleted characters: `{a['deleted_chars']}`",
                      f"- Unified diff hunks: `{a['hunks']}`",
                      f"- Inserted blocks: `{a['inserted_blocks']}`",
                      f"- Deleted blocks: `{a['deleted_blocks']}`",
                      f"- Changed blocks: `{a['changed_blocks']}`",
                      f"- Line balance: `{a['old_lines']} + {a['inserted_lines']} - {a['deleted_lines']} = {a['new_lines']}` — **{'PASS' if a['line_ok'] else 'FAIL'}**",
                      f"- Character balance: `{a['old_chars']} + {a['inserted_chars']} - {a['deleted_chars']} = {a['new_chars']}` — **{'PASS' if a['char_ok'] else 'FAIL'}**",
                  ])
              else:
                  entry.append('- Binary/non-UTF-8 file: accounted by byte count and SHA-256 before/after.')
              entry.append('')

          entry.extend(['### Recorded instruction evidence', ''])
          if evidence:
              for path, lines in evidence:
                  entry.extend([f'**`{path}`**', '', '```text', *lines, '```', ''])
          else:
              entry.extend(['No supported change-order marker was found in the changed text files.', 'The commit message and exact diff remain authoritative; intent has not been invented.', ''])

          entry.extend([
              '### Audit rule', '',
              'Every changed path must appear above. Text-file line and character arithmetic must reconcile exactly.',
              'A reconciliation failure fails this workflow before the automated log commit is created.', '', '---', ''
          ])

          new_entry = '\n'.join(entry).rstrip() + '\n'
          existing = log_path.read_text(encoding='utf-8') if log_path.exists() else ''
          first_auto = re.search(r'(?m)^## AUTO-', existing)
          if first_auto:
              fixed_header = existing[:first_auto.start()].rstrip()
              automated_text = existing[first_auto.start():].strip()
              automated_entries = [b.strip() for b in re.split(r'(?m)(?=^## AUTO-)', automated_text) if b.strip()]
          else:
              fixed_header = existing.rstrip()
              automated_entries = []
          automated_entries = [b for b in automated_entries if not b.startswith(f'## AUTO-{commit_sha[:12]} ')]
          automated_entries.insert(0, new_entry.strip())
          log_path.write_text(fixed_header + '\n\n' + '\n\n'.join(automated_entries).rstrip() + '\n', encoding='utf-8', newline='\n')

          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as summary:
                  summary.write('# Galaxy Viewer forensic change audit\n\n')
                  summary.write(f'- Commit: `{commit_sha}`\n- Baseline: `{before_sha}`\n- Changed paths: `{len(audits)}`\n- Reconciliation: **{overall}**\n\n')
                  for a in audits:
                      summary.write(f"## `{a['path']}`\n- Status: {a['status']}\n- Bytes: {a['old_bytes']} → {a['new_bytes']}\n")
                      if a['text']:
                          summary.write(f"- Lines: {a['old_lines']} → {a['new_lines']}\n- Characters: {a['old_chars']} → {a['new_chars']}\n- Blocks +/−: {a['inserted_blocks']}/{a['deleted_blocks']}\n- Balance: {'PASS' if a['line_ok'] and a['char_ok'] else 'FAIL'}\n")
                      summary.write('\n')

          if failures:
              print('FORENSIC RECONCILIATION FAILURE: ' + ', '.join(failures), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Commit only the forensic log
        run: |
          if git diff --quiet -- docs/GALAXY-VIEWER-CHANGE-CONTROL-LOG.md; then
            echo "No log change detected."
            exit 0
          fi

          changed_paths="$(git diff --name-only)"
          if [ "$changed_paths" != "docs/GALAXY-VIEWER-CHANGE-CONTROL-LOG.md" ]; then
            echo "Unexpected workflow-side modification detected:"
            printf '%s\n' "$changed_paths"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/GALAXY-VIEWER-CHANGE-CONTROL-LOG.md
          git commit -m "Forensic log for ${{ github.sha }}"
          git push origin HEAD:beta
