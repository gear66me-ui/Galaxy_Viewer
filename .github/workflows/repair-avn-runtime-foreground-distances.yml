name: Repair AVN Runtime Catalog — Foreground Redshifts

on:
  workflow_dispatch:
  push:
    branches: [release]
    paths:
      - ".github/workflows/repair-avn-runtime-foreground-distances.yml"

permissions:
  contents: write

concurrency:
  group: repair-avn-runtime-foreground-distances
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Repair verified foreground/lens distances
        env:
          RUNTIME_PATH: viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json
        run: |
          python - <<'PY'
          import json, math, os, pathlib, sys
          from datetime import datetime, timezone

          path = pathlib.Path(os.environ["RUNTIME_PATH"])
          if not path.exists():
              raise SystemExit(f"Runtime catalog not found: {path}")
          raw = json.loads(path.read_text(encoding="utf-8"))
          records = raw if isinstance(raw, list) else raw.get("records")
          if not isinstance(records, list):
              raise SystemExit("Unexpected runtime JSON schema: expected a list or an object with records[]")

          # Published redshifts for the foreground galaxy/lens/cluster, never the
          # lensed background source. Distances are calculated consistently below.
          # Entries lacking an adequately verified foreground redshift are reported
          # but intentionally not overwritten.
          targets = {
            "eso2304a": {"name":"Spiderweb Galaxy", "z":2.156, "source":"published Spiderweb Galaxy redshift"},
            "eso0847a": {"name":"Einstein Cross", "z":0.0394, "source":"foreground lens galaxy redshift; not background quasar"},
            "heic1702e": {"name":"HE0435-1223", "z":0.4546, "source":"foreground lens galaxy redshift; not background quasar"},
            "heic1702c": {"name":"CLASS B1608+656", "z":0.6304, "source":"foreground lens-system redshift"},
            "heic1702d": {"name":"2MASX J11315154-1231587 / RX J1131-1231", "z":0.295, "source":"foreground lens galaxy redshift; not background quasar"},
            "opo1208b": {"name":"RCS2 032727-132623", "z":0.564, "source":"foreground galaxy cluster redshift; not lensed background galaxy"},
            "potw1506a": {"name":"SDSSCGB 8842.3", "z":0.4256, "source":"foreground lens redshift for SDSS J1038+4849; not background arc"},
            "heic1506d": {"name":"MACS J0152.5-2852", "z":0.413, "source":"foreground galaxy-cluster redshift"},
            "heic1507b": {"name":"2MASX J14302986+1339117 / Teacup Galaxy", "z":0.0852, "source":"NASA/ESA Hubble object redshift"},
            "heic1507g": {"name":"Mrk 1498", "z":0.0547, "source":"NASA/ESA Hubble object redshift"},
            "heic1507e": {"name":"UGC 7342", "z":0.0477, "source":"NASA/ESA Hubble object redshift"},
            "eso0755a": {"name":"ESO 593-IG 008", "z":0.048834, "source":"published spectroscopic redshift"},
            "heic1507d": {"name":"2MASX J15100402+0740370", "z":0.04584, "source":"NASA/ESA Hubble object redshift"},
            "heic1507h": {"name":"UGC 11185", "z":0.0412, "source":"NASA/ESA Hubble object redshift"},
            "heic1507c": {"name":"NGC 5972", "z":0.0297, "source":"NASA/ESA Hubble object redshift"},
            "gemini0302a": {"name":"HCG 87", "z":None, "source":"requires component-specific redshift verification"},
            "iotw2342c": {"name":"NGC 6240", "z":0.02448, "source":"published nearby-galaxy redshift; foreground galaxy"},
            "potw2024a": {"name":"PLCK G045.1+61.1", "z":3.436761, "source":"published high-redshift cluster redshift"},
            "noao-n4935mandel": {"name":"NGC 4935", "z":0.021329, "source":"published galaxy redshift"}
          }

          # Flat Lambda-CDM, H0=67.6 km/s/Mpc, Omega_m=0.315, Omega_Lambda=0.685.
          # Integrate comoving radial distance D_C = c/H0 * integral dz/E(z),
          # then convert Mpc to million light-years (1 Mpc = 3.261563777 Mly).
          C = 299792.458
          H0 = 67.6
          OM = 0.315
          OL = 1.0 - OM
          MLY_PER_MPC = 3.261563777
          def comoving_mly(z):
              if z < 0: raise ValueError("redshift must be non-negative")
              n = max(2000, int(2000*z))
              if n % 2: n += 1
              h = z/n
              total = 1.0/math.sqrt(OM*(1+0)**3+OL) + 1.0/math.sqrt(OM*(1+z)**3+OL)
              for i in range(1,n):
                  x = i*h
                  e = math.sqrt(OM*(1+x)**3+OL)
                  total += (4 if i%2 else 2)/e
              return (C/H0)*(h/3)*total*MLY_PER_MPC

          def get_archive_id(r):
              return str(r.get("archiveId") or r.get("archive_id") or r.get("id") or "")
          def get_name(r):
              return str(r.get("name") or r.get("objectName") or r.get("title") or "")

          changed, found, unresolved = [], set(), []
          for r in records:
              aid = get_archive_id(r)
              if aid not in targets:
                  continue
              target = targets[aid]
              found.add(aid)
              z = target["z"]
              if z is None:
                  unresolved.append({"archiveId":aid,"name":target["name"],"reason":target["source"]})
                  continue
              dist = round(comoving_mly(z), 4)
              old_z = r.get("redshift")
              old_d = r.get("distanceMly")
              r["redshift"] = z
              r["distanceMly"] = dist
              science = r.get("science")
              if isinstance(science, dict):
                  science["redshift"] = z
                  science["distanceMly"] = dist
              changed.append({
                "archiveId":aid, "name":target["name"],
                "oldRedshift":old_z, "newRedshift":z,
                "oldDistanceMly":old_d, "newDistanceMly":dist,
                "sourceNote":target["source"]
              })

          missing = sorted(set(targets)-found)
          if not changed:
              raise SystemExit("No matching verified records found; refusing to write.")
          if isinstance(raw, list):
              output = records
          else:
              output = raw
              output["records"] = records
          path.write_text(json.dumps(output, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          report = {
            "generatedUtc": datetime.now(timezone.utc).isoformat(),
            "catalog": str(path),
            "cosmology": {"model":"flat Lambda-CDM","H0_km_s_Mpc":H0,"Omega_m":OM,"Omega_Lambda":OL},
            "distanceConvention":"comoving radial distance",
            "foregroundRule":"For lens systems, store foreground lens/cluster redshift and distance, never the background lensed source redshift.",
            "changedCount":len(changed), "changed":changed,
            "unresolved":unresolved, "targetArchiveIdsNotFound":missing
          }
          pathlib.Path("avn-runtime-repair-report.json").write_text(json.dumps(report,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"changedCount":len(changed),"unresolved":unresolved,"targetArchiveIdsNotFound":missing,"changes":changed},indent=2))
          PY

      - name: Validate JSON and report
        run: |
          python -m json.tool viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json >/dev/null
          python -m json.tool avn-runtime-repair-report.json >/dev/null

      - name: Commit repaired catalog and audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json avn-runtime-repair-report.json
          if git diff --cached --quiet; then
            echo "No catalog changes required."
          else
            git commit -m "Repair AVN runtime distances using foreground redshifts"
            git push origin HEAD:release
          fi
