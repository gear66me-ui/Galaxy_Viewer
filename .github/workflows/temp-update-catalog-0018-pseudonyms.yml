name: Temporary Catalog 0018 pseudonym updater

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/temp-update-catalog-0018-pseudonyms.yml'

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
      - name: Update first 100 display names only
        shell: bash
        run: |
