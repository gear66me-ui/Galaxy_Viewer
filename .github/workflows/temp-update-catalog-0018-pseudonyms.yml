          data = json.loads(path.read_text(encoding='utf-8'))
          entries = data['entries']
          assert len(expected) == len(proposed) == 100
          assert len(entries) >= 100

          mismatches = []
          for i, old in enumerate(expected):
              actual = entries[i].get('displayName')
              if actual != old:
                  mismatches.append((i + 1, old, actual))
          if mismatches:
              raise SystemExit('Baseline mismatch; refusing to write: ' + repr(mismatches[:10]))

          changed = 0
          for i, new in enumerate(proposed):
              if entries[i].get('displayName') != new:
                  entries[i]['displayName'] = new
                  changed += 1

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Validated 100 records; changed {changed} displayName values')
          PY

