          test "$(git diff --name-only)" = "viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0018.json"
          git diff --check
      - name: Commit catalog only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0018.json
          git commit -m 'Catalog 0018: shorten first 100 pseudonyms'
          git push origin HEAD:beta
