name: Build Galaxy Viewer Generic APK
# ECO GV-ICON-CANONICAL-005A icon-only rebuild trigger

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/build-galaxy-viewer-generic-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 1

      - name: Verify generic runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import pathlib
          import re

          pointer_path = pathlib.Path('viewer/gv-current-viewer.json')
          pointer = json.loads(pointer_path.read_text(encoding='utf-8'))
          version = str(pointer.get('version', '')).strip()
          viewer = str(pointer.get('viewer', '')).strip()

          if not version:
              raise SystemExit('current-viewer version is empty')
          if not re.fullmatch(r'GV-beta-[A-Za-z0-9.-]+\.py', viewer):
              raise SystemExit(f'invalid active Viewer filename: {viewer!r}')
          if '/' in viewer or 'archive' in viewer.lower():
              raise SystemExit(f'active Viewer must be a root viewer/ file: {viewer!r}')

          active = pathlib.Path('viewer') / viewer
          if not active.is_file():
              raise SystemExit(f'active Viewer missing: {active}')
          source = active.read_text(encoding='utf-8')
          if 'viewer/archive/' in source:
              raise SystemExit('active Viewer references viewer/archive/')

          launcher = pathlib.Path('mobile/beta/generic-app.html').read_text(encoding='utf-8')
          required = [
              'const ICON_HOLD_MS=3000;',
              'gv-loading-comet-orbit 2.8s linear infinite',
              '../../viewer/artwork/icon.svg',
              'const splashReadyPromise=preloadSplash();',
              'await runSplash(preloadedSplash);',
              'initializeViewer(preparedViewer)',
          ]
          for marker in required:
              if marker not in launcher:
                  raise SystemExit(f'generic launcher marker missing: {marker}')
          if 'viewer/archive/' in launcher:
              raise SystemExit('generic launcher references viewer/archive/')

          canonical_svg = pathlib.Path('viewer/artwork/icon.svg')
          canonical_png = pathlib.Path('viewer/artwork/icon_transparent.png')
          if not canonical_svg.is_file():
              raise SystemExit('canonical web icon missing')
          if not canonical_png.is_file():
              raise SystemExit('canonical Android icon missing')
          if pathlib.Path('android/galaxy-viewer/app/src/main/res/drawable/gv_app_icon.png').exists():
              raise SystemExit('duplicate static Android icon must not exist')

          gradle = pathlib.Path('android/galaxy-viewer/app/build.gradle').read_text(encoding='utf-8')
          for marker in ('icon_transparent.png', 'prepareCanonicalIcon', "rename { 'gv_app_icon.png' }"):
              if marker not in gradle:
                  raise SystemExit(f'canonical Android icon build marker missing: {marker}')

          manifest = pathlib.Path('android/galaxy-viewer/app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          if 'android:theme="@style/GalaxyViewerTheme"' not in manifest:
              raise SystemExit('GalaxyViewerTheme not active in manifest')
          if 'android:icon="@drawable/gv_app_icon_black"' not in manifest:
              raise SystemExit('black launcher icon resource not active')

          styles = pathlib.Path('android/galaxy-viewer/app/src/main/res/values/styles.xml').read_text(encoding='utf-8')
          for marker in (
              '<item name="android:windowBackground">@android:color/black</item>',
              '<item name="android:colorBackground">@android:color/black</item>',
              '<item name="android:windowSplashScreenBackground">@android:color/black</item>',
              '<item name="android:windowSplashScreenIconBackgroundColor">@android:color/black</item>',
          ):
              if marker not in styles:
                  raise SystemExit(f'black startup theme marker missing: {marker}')

          main = pathlib.Path('android/galaxy-viewer/app/src/main/java/com/gear66me/galaxyviewer/MainActivity.java').read_text(encoding='utf-8')
          if 'mobile/beta/generic-app.html?source=android-app' not in main:
              raise SystemExit('Android wrapper does not use stable generic launcher')
          if re.search(r'GV-beta-[A-Za-z0-9.-]+\.py', main):
              raise SystemExit('Android wrapper hardcodes a Viewer revision')
          if 'viewer/archive/' in main:
              raise SystemExit('Android wrapper references viewer/archive/')

          print(f'GENERIC_RUNTIME_OK version={version} viewer={viewer}')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build generic APK
        shell: bash
        run: gradle --no-daemon -p android/galaxy-viewer :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='android/galaxy-viewer/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/gv-badging.txt
          grep -q "package: name='com.gear66me.galaxyviewer'" /tmp/gv-badging.txt
          grep -q "versionName='generic-1'" /tmp/gv-badging.txt
          grep -q "launchable-activity: name='com.gear66me.galaxyviewer.MainActivity'" /tmp/gv-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          unzip -t "$APK"
          cp "$APK" Galaxy-Viewer-Generic.apk
          sha256sum Galaxy-Viewer-Generic.apk | tee Galaxy-Viewer-Generic.apk.sha256

      - name: Upload verified generic APK
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Viewer-Generic
          path: |
            Galaxy-Viewer-Generic.apk
            Galaxy-Viewer-Generic.apk.sha256
          if-no-files-found: error
          retention-days: 30
