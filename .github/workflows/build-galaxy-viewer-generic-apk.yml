name: Build Galaxy Viewer Generic APK
# ECO GV-ICON-CANONICAL-005A icon-only rebuild trigger

on:
  workflow_dispatch:
  push:
    branches: [beta]
    paths:
      - 'android/galaxy-viewer/**'
      - 'mobile/beta/generic-app.html'
      - '.github/workflows/build-galaxy-viewer-generic-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 1

      - name: Verify generic runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, pathlib, re
          pointer=json.loads(pathlib.Path('viewer/gv-current-viewer.json').read_text())
          viewer=pathlib.Path('viewer')/pointer['viewer']
          source=viewer.read_text()
          build=re.search(r"const GV200001_BUILD='(\d{4})';",source)
          if not build or build.group(1)!=str(pointer.get('build')): raise SystemExit('viewer/pointer build mismatch')
          launcher=pathlib.Path('mobile/beta/generic-app.html').read_text()
          for marker in ("GV-GENERIC-APP-0089","attempt<=8","cache:'no-store'","RAW_VIEWER_BASE"):
              if marker not in launcher: raise SystemExit('launcher marker missing: '+marker)
          main=pathlib.Path('android/galaxy-viewer/app/src/main/java/com/gear66me/galaxyviewer/MainActivity.java').read_text()
          for marker in ('WebSettings.LOAD_NO_CACHE','clearCache(true)','WebStorage.getInstance().deleteAllData()','apk=fresh-2'):
              if marker not in main: raise SystemExit('Android fresh-launch marker missing: '+marker)
          for required in ('android/galaxy-viewer/app/build.gradle','android/galaxy-viewer/app/src/main/AndroidManifest.xml','android/galaxy-viewer/settings.gradle'):
              if not pathlib.Path(required).is_file(): raise SystemExit('Android build input missing: '+required)
          print('GENERIC_RUNTIME_OK build='+build.group(1))
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform and build tools
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build generic APK
        shell: bash
        run: gradle --no-daemon -p android/galaxy-viewer :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='android/galaxy-viewer/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/gv-badging.txt
          grep -q "package: name='com.gear66me.galaxyviewer'" /tmp/gv-badging.txt
          grep -q "versionName='generic-1'" /tmp/gv-badging.txt
          grep -q "launchable-activity: name='com.gear66me.galaxyviewer.MainActivity'" /tmp/gv-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          unzip -t "$APK"
          cp "$APK" Galaxy-Viewer-Generic.apk
          sha256sum Galaxy-Viewer-Generic.apk | tee Galaxy-Viewer-Generic.apk.sha256

      - name: Upload verified generic APK
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Viewer-Generic
          path: |
            Galaxy-Viewer-Generic.apk
            Galaxy-Viewer-Generic.apk.sha256
          if-no-files-found: error
          retention-days: 30
