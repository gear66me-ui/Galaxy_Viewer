name: HUBBLE 0029 — NUMERIC ALADIN ROTATION

on:
  push:
    paths:
      - '.github/workflows/temp-hubble-0029-aladin-rotation.yml'

permissions:
  contents: write

jobs:
  build-hubble-0029:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v5
        with:
          ref: beta
          fetch-depth: 0
          token: ${{ secrets.GV_GITHUB_TOKEN || github.token }}

      - name: Build and validate Hubble 0029
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path
          from datetime import datetime, timezone

          src = Path('viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0028.json')
          dst = Path('viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0029.json')

          if not src.is_file():
              raise SystemExit(f'STOP: source missing: {src}')
          if dst.exists():
              raise SystemExit(f'STOP: destination already exists: {dst}')

          root = json.loads(src.read_text(encoding='utf-8'))

          def find_records(x):
              if isinstance(x, dict):
                  for key in ('entries','galaxies','records','objects','data','items'):
                      v=x.get(key)
                      if isinstance(v,list) and v and all(isinstance(i,dict) for i in v):
                          return v
                  candidates=[]
                  for v in x.values():
                      r=find_records(v)
                      if r:
                          candidates.append(r)
                  return max(candidates,key=len) if candidates else None
              if isinstance(x,list) and x and all(isinstance(i,dict) for i in x):
                  return x
              return None

          records=find_records(root) or []
          if not records:
              raise SystemExit('STOP: no catalog records found')

          pat=re.compile(r'^\s*North\s+is\s+([+-]?\d+(?:\.\d+)?)\s*°?\s*(right|left)\s+of\s+vertical\s*$',re.I)
          failures=[]
          converted=0
          examples=[]

          for i,r in enumerate(records):
              raw=r.get('orientation')
              existing=r.get('aladinRotation')
              value=None

              # Existing numeric curated value wins. Otherwise convert provider orientation.
              if isinstance(existing,(int,float)) and not isinstance(existing,bool):
                  value=float(existing)%360.0
              elif isinstance(existing,str):
                  try:
                      value=float(existing.strip())%360.0
                  except Exception:
                      value=None

              if value is None and isinstance(raw,(int,float)) and not isinstance(raw,bool):
                  value=float(raw)%360.0
              elif value is None and isinstance(raw,str):
                  text=raw.strip()
                  try:
                      value=float(text)%360.0
                  except ValueError:
                      m=pat.match(text)
                      if m:
                          deg=float(m.group(1))
                          value=(deg if m.group(2).lower()=='right' else -deg)%360.0

              if value is None:
                  failures.append({
                      'index':i,
                      'archiveId':r.get('archiveId'),
                      'name':r.get('name'),
                      'orientation':raw,
                      'existingAladinRotation':existing,
                  })
                  continue

              value=round(value,6)
              if value==360.0 or abs(value)<1e-12:
                  value=0.0
              r['aladinRotation']=value
              converted+=1
              if len(examples)<12:
                  examples.append((r.get('archiveId'),raw,value))

          if failures:
              print('UNCONVERTED RECORDS:')
              for row in failures[:50]:
                  print(row)
              raise SystemExit(f'STOP: {len(failures)} record(s) lack a usable rotation')

          if converted!=len(records):
              raise SystemExit(f'STOP: converted {converted} of {len(records)} records')

          if isinstance(root,dict):
              if 'version' in root:
                  root['version']='full-0029'
              if 'generatedAt' in root:
                  root['generatedAt']=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')

          dst.write_text(json.dumps(root,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          check=json.loads(dst.read_text(encoding='utf-8'))
          out_records=find_records(check) or []
          bad=[]
          for i,r in enumerate(out_records):
              v=r.get('aladinRotation')
              if not isinstance(v,(int,float)) or isinstance(v,bool) or not (0.0<=float(v)<360.0):
                  bad.append((i,r.get('archiveId'),v))

          if len(out_records)!=len(records) or bad:
              raise SystemExit(f'STOP: validation failed records={len(out_records)}/{len(records)} badRotations={len(bad)}')

          print('=== HUBBLE 0029 MIGRATION ===')
          print('SOURCE:',src)
          print('OUTPUT:',dst)
          print('RECORDS:',len(records))
          print('NUMERIC aladinRotation:',converted)
          print('RANGE 0 <= rotation < 360: PASS')
          print('ORIGINAL orientation FIELD: PRESERVED')
          print('EXAMPLES:')
          for archive_id,raw,value in examples:
              print(f'  {archive_id}: {raw!r} -> {value}')
          print('VALIDATION: PASS')
          PY

      - name: Commit Hubble 0029
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0029.json
          git rm .github/workflows/temp-hubble-0029-aladin-rotation.yml
          git commit -m 'data: add Hubble 0029 numeric aladinRotation'
          git push origin HEAD:beta
          echo 'HUBBLE 0029 COMMIT COMPLETE'
