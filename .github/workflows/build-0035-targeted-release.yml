name: Validate and Deploy RC-V1.0.0.9 Build 0074

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: galaxy-viewer-release-pages
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages-release
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 1

      - name: Validate Build 0074 and bundled closed IAU constellation polygons
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re
          root = pathlib.Path(".")
          pointer = json.loads((root / "viewer/gv-current-viewer.json").read_text())
          manifest = json.loads((root / "release-manifest.json").read_text())
          assert pointer == {"version":"RC-V1.0.0.9","viewer":"RC-V1.0.0.9-BLD-0074.py","build":"0074"}, pointer
          assert manifest.get("release") == "RC-V1.0.0.9" and manifest.get("build") == "0074", manifest
          assert manifest.get("runtime") == ["viewer/RC-V1.0.0.9-BLD-0074.py"], manifest
          assert manifest.get("sourceBranch") == "release", manifest
          rc = (root / "viewer" / pointer["viewer"]).read_text()
          assert 'VIEWER_VERSION = "RC-V1.0.0.9"' in rc and 'BUILD_NUMBER = "0074"' in rc
          assert "const GV200001_BUILD='0074'" in rc
          assert "const GV_RUNTIME='0136'" in rc, "Build 0074 runtime revision must be rolled to 0136"
          assert "onRandom:()=>{gvSetTripCycle(true);return navigateRandom()}" in rc
          assert "const data=JSON.parse(" in rc, "Boundary data must be bundled, not fetched at runtime"
          assert "precessB1875ToJ2000" not in rc, "Do not double-precess the already J2000-aligned GeoJSON"
          assert "GV_IAU_BOUNDARY_WIDTH=0.5" in rc and "GV_IAU_BOUNDARY_OPACITY=0.58" in rc
          assert "closedRingCount<80" in rc and "geometry.type==='Polygon'" in rc
          assert "aladin.addOverlay(overlay)" in rc and "overlay.show()" in rc
          pins = set(re.findall(r"https://cdn\.jsdelivr\.net/gh/gear66me-ui/Galaxy_Viewer@([0-9a-f]{40})", rc))
          assert len(pins) == 10, f"Expected 10 immutable dependency pins; found {len(pins)}"
          required = {
            "34d6f9b9417438afd56317bc838b93eb655c7d15",
            "d85d91201ea52aa6524a62394fc81b450b15ac23",
            "f5b26bd7a317a57a76a4b68adc05b50ec3f0567e",
            "f7740afe20a1dccd0e58644e8c154f4e6396ed83",
            "e38bfcc36a2f156517f9a77865da0c1c13d49175",
          }
          assert required.issubset(pins), f"Required stable dependency pin missing: {sorted(required-pins)}"
          assert "https://cdn.jsdelivr.net/gh/gear66me-ui/Galaxy_Viewer@d85d91201ea52aa6524a62394fc81b450b15ac23/viewer/vendor/aladin-lite/3.8.2/aladin.js" in rc
          assert "https://cdn.jsdelivr.net/gh/gear66me-ui/Galaxy_Viewer@d85d91201ea52aa6524a62394fc81b450b15ac23/aladin-source-clone/src/css/aladin.css" in rc
          assert "https://aladin.cds.unistra.fr/AladinLite/api/v3/3.8.2/aladin.js" not in rc and "https://aladin.cds.unistra.fr/AladinLite/api/v3/3.8.2/aladin.css" not in rc
          assert "survey:'https://skies.esac.esa.int/DSSColor'" in rc, "Build 0074 must use the requested ESA DSS2 Color HiPS endpoint"
          assert "survey:'https://casda.csiro.au/hips/DSS2/color/'" not in rc, "Build 0074 must not retain CASDA as the active survey"
          assert rc.count("1-9/durationSeconds") == 2, "Build 0074 must release HiPS tile fetching at T-minus nine seconds in both navigation paths"
          assert "1-2/durationSeconds" not in rc, "Build 0074 must not retain the old T-minus-two tile-fetch gate"
          print("BUILD 0074 STATIC VALIDATION PASSED: requested ESA DSS2 Color source, release identity, bundled closed IAU polygon data, no runtime fetch, no double precession, overlay attach/show, closed-ring geometry validation, Random Galaxy handler, T-minus-nine HiPS tile-fetch timing, and immutable pins.")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage production site excluding thumbnail and mirror assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='_site/' --exclude='viewer/artwork/runtime/survey-thumbnails/' --exclude='viewer/artwork/runtime/mirrors/' --exclude='**/[Mm]irror/' --exclude='**/[Mm]irrors/' --exclude='**/[Tt]humbnail*/' --exclude='**/[Tt]humbnails/' --exclude='**/[Tt]humbnails/' ./ _site/
          if find _site -type d | grep -Ei '/(mirror|mirrors|thumbnail|thumbnails|survey-thumbnails)$'; then
            echo "ERROR: thumbnail or mirror directories leaked into deployment staging"
            exit 1
          fi
          echo "Staged production site excluding thumbnail and mirror directories."
          du -sh _site

      - name: Upload production site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy production site
        id: deployment
        uses: actions/deploy-pages@v4
