name: Validate and Deploy RC-V1.0.0.9 Build 0039

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: galaxy-viewer-release-pages
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages-release
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 1

      - name: Validate Build 0039 and IAU boundary renderer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re
          root = pathlib.Path(".")
          pointer = json.loads((root / "viewer/gv-current-viewer.json").read_text())
          manifest = json.loads((root / "release-manifest.json").read_text())
          assert pointer == {"version":"RC-V1.0.0.9","viewer":"RC-V1.0.0.9-BLD-0039.py","build":"0039"}, f"Unexpected production pointer: {pointer}"
          assert manifest.get("release") == "RC-V1.0.0.9" and manifest.get("build") == "0039", "Manifest release/build mismatch"
          assert manifest.get("sourceBranch") == "release", "Manifest source branch is not release"
          assert manifest.get("runtime") == ["viewer/RC-V1.0.0.9-BLD-0039.py"], "Manifest runtime file mismatch"
          rc = (root / "viewer" / pointer["viewer"]).read_text()
          assert 'VIEWER_VERSION = "RC-V1.0.0.9"' in rc and 'BUILD_NUMBER = "0039"' in rc
          assert "const GV200001_BUILD='0039';" in rc, "JavaScript build identity mismatch"
          assert "onRandom:()=>{gvSetTripCycle(true);return navigateRandom()}" in rc, "Stable Random Galaxy handler is missing"
          assert "constellations.borders.json" in rc, "IAU boundary dataset URL missing"
          assert "precessB1875ToJ2000" in rc, "B1875-to-J2000 coordinate conversion missing"
          assert "GV_IAU_BOUNDARY_WIDTH=0.9" in rc and "GV_IAU_BOUNDARY_OPACITY=0.38" in rc, "Visible faint-red style missing"
          assert "aladin.addOverlay(overlay)" in rc and "overlay.show()" in rc, "Overlay attach/show calls missing"
          assert "rendered<80||vertices<500" in rc, "Runtime line/vertex validation missing"
          pins = set(re.findall(r"https://cdn\.jsdelivr\.net/gh/gear66me-ui/Galaxy_Viewer@([0-9a-f]{40})", rc))
          assert len(pins) == 10, f"Expected 10 immutable dependency pins; found {len(pins)}"
          required = {
            "34d6f9b9417438afd56317bc838b93eb655c7d15",
            "d85d91201ea52aa6524a62394fc81b450b15ac23",
            "f5b26bd7a317a57a76a4b68adc05b50ec3f0567e",
            "f7740afe20a1dccd0e58644e8c154f4e6396ed83",
            "e38bfcc36a2f156517f9a77865da0c1c13d49175",
          }
          assert required.issubset(pins), f"Required stable dependency pin missing: {sorted(required-pins)}"
          print("BUILD 0039 VALIDATION PASSED: release identity, stable Random Galaxy handler, B1875→J2000 conversion, line style, overlay attachment, runtime geometry checks, and immutable dependency pins.")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage production site excluding thumbnail and mirror assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='_site/' --exclude='viewer/artwork/runtime/survey-thumbnails/' --exclude='viewer/artwork/runtime/mirrors/' --exclude='**/[Mm]irror/' --exclude='**/[Mm]irrors/' --exclude='**/[Tt]humbnail*/' --exclude='**/[Tt]humbnails/' --exclude='**/[Tt]humbnails/' --exclude='**/[Tt]humbnails/' ./ _site/
          if find _site -type d | grep -Ei '/(mirror|mirrors|thumbnail|thumbnails|survey-thumbnails)$'; then
            echo "ERROR: thumbnail or mirror directories leaked into deployment staging"
            exit 1
          fi
          echo "Staged production site excluding thumbnail and mirror directories."
          du -sh _site

      - name: Upload production site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy production site
        id: deployment
        uses: actions/deploy-pages@v4
