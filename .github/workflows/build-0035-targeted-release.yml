name: Validate and Deploy RC-V1.0.0.9 Build 0098
# BUILD 0098: validate emission-distance display and preserve existing release checks.

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: galaxy-viewer-release-pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages-release
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 1

      - name: Validate Build 0098 emission distance cards and preserved release behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re
          root = pathlib.Path(".")
          pointer = json.loads((root / "viewer/gv-current-viewer.json").read_text())
          manifest = json.loads((root / "release-manifest.json").read_text())
          assert pointer == {"version":"RC-V1.0.0.9","viewer":"RC-V1.0.0.9-BLD-0098.py","build":"0098"}, pointer
          assert manifest.get("release") == "RC-V1.0.0.9" and manifest.get("build") == "0098", manifest
          assert manifest.get("runtime") == ["viewer/RC-V1.0.0.9-BLD-0098.py"], manifest
          assert manifest.get("sourceBranch") == "release", manifest
          rc = (root / "viewer" / pointer["viewer"]).read_text()
          assert 'VIEWER_VERSION = "RC-V1.0.0.9"' in rc and 'BUILD_NUMBER = "0098"' in rc
          assert "const GV200001_BUILD='0098'" in rc
          assert "const GV_RUNTIME='0098';" in rc, "BUILD 0097 marker missing"
          assert "GV RANDOM NAVIGATION NO-MOTION WATCHDOG ARMED" in rc, "Random navigation watchdog missing"
          assert "GV_RANDOM_NO_MOTION_LIMIT_MS" in rc and "10000" in rc, "Random navigation watchdog must be capped at 10 seconds"
          assert "gvStartRandomNavigationWatchdog(randomAttempt)" in rc, "Random navigation watchdog is not armed"
          assert r"normalize('NFD').replace(/[\u0300-\u036f]/g,'')" in rc, "Embedded constellation normalizer must preserve ASCII names"
          assert "window.GalaxyRouteEngine?.VERSION!=='0002'" in rc, "Build 0097 must preserve the pinned Route Engine 002 export"
          assert "const data=JSON.parse(" in rc, "Boundary data must remain bundled"
          assert "function getConstellationAt(ra,dec)" in rc, "Live IAU reticle lookup missing"
          overlay = (root / "viewer/modules/constellation-overlay/gv-constellation-overlay-0023.js").read_text()
          assert 'const VERSION = "0023"' in overlay, "Constellation overlay 0023 missing"
          assert 'TRIANGULUMAUSTRALE:"TRA"' in overlay, "Triangulum Australe alias must resolve to TrA for yellow highlight"
          assert "gv-constellation-overlay-0023.js" in rc and "VERSION!=='0023'" in rc, "Build 0097 must pin and require overlay 0023"
          assert "gv-constellation-center-label" in rc and "(top+38+10)+'px'" in rc, "Constellation label placement must remain 10px below SELECT SURVEY"
          assert "labelLetterCount>12" in rc, "Main-screen names above 12 letters must use two centered rows"
          assert "gvConstellationCenterLabel.append(prefix,constellation)" in rc, "Long main-screen labels must render as separate centered rows"
          assert "function gvUpdateTravelConstellationAt(ra,dec,force=false)" in rc, "Live travel-boundary constellation tracking missing"
          assert "now-gvTravelConstellationLastCheck<80" in rc, "Travel constellation checks must be coalesced to 80ms"
          assert "layer.setCenterConstellation(null)" in rc, "Old reticle highlight must clear at travel start and boundary changes"
          assert "gvUpdateTravelConstellationAt(pos[0],pos[1])" in rc, "First-trip path must update the active travel constellation"
          assert "gvUpdateTravelConstellationAt(ra1,dec1,true)" in rc, "Standard travel must refresh the final path constellation"
          assert "let arrivalHdPreparationStarted=false;" in rc, "Mid-trip AVM preparation must be idempotent"
          assert "const startArrivalHdPreparation=()=>" in rc, "Mid-trip AVM preparation callback missing"
          assert "onZoomOutComplete:startArrivalHdPreparation" in rc, "Standard trip must start AVM preparation at translation start"
          assert "onTMinusEight:startArrivalHdPreparation" in rc, "T-minus-eight must remain a fallback/first-trip preparation trigger"
          assert "GV MID-TRIP AVM IMAGE ACTIVATED" in rc, "Incoming AVM image must activate as soon as the staged layer loads"
          assert "function gvRestoreAfterForeground(reason='foreground')" in rc, "Bounded foreground AVM restoration retry missing"
          assert "GV FOREGROUND HD RESTORE REQUEST ACCEPTED" in rc, "Foreground AVM restore diagnostics missing"
          assert "window.addEventListener('pageshow'" in rc, "Page-show AVM and artwork recovery hook missing"
          assert "GV PREPARED AVM IMAGE WAS RELEASED; REBUILDING FOR RESUME" in rc, "Released prewarm AVM image must be rebuilt after resume"
          assert "function gvRefreshTravelConstellationArtwork()" in rc, "Foreground constellation icon refresh missing"
          assert "GV FOREGROUND CONSTELLATION ART REFRESH REQUESTED" in rc, "Foreground constellation artwork refresh diagnostics missing"
          assert "window.GV_RETRY_MID_TRIP_AVM?.()" in rc, "Mid-trip AVM handoff must restart after background resource release"
          assert "gvActivateStagedHd(presentationDestination)" in rc, "Mid-trip staged AVM activation missing"
          assert "GV_CONSTELLATION_MOVE_THRESHOLD_DEG=1" in rc, "Constellation center tracking must use a one-degree movement threshold"
          assert "GV_CONSTELLATION_CHECK_DELAY_MS=250" in rc and "GV_CONSTELLATION_SETTLE_DELAY_MS=350" in rc, "Constellation refresh must be coalesced and settled"
          assert "gvNavigationTravelActive||document.visibilityState!=='visible'" in rc, "Constellation tracking must suspend during scripted travel and hidden pages"
          assert "setInterval(()=>{if(document.visibilityState==='visible')gvSyncConstellationCenterLabel()},250)" not in rc, "Remove continuous constellation center polling"
          assert "setTimeout(()=>gvSyncConstellationCenterLabel(true),0)" in rc, "Refresh constellation highlight after navigation arrival"
          overlay = (root / "viewer/modules/constellation-overlay/gv-constellation-overlay-0023.js").read_text()
          assert 'const VERSION = "0023"' in overlay, "Constellation overlay 0023 missing"
          assert "const NAME_ALIASES=Object.freeze({" in overlay, "Constellation alias map must be allocated once, not per center update"
          assert "if(centerEntry===found&&centerName===(name||null))return !!found;" in overlay, "Avoid redundant center highlight redraws"
          assert "color:'#FFE066'" in rc and 'font:\'400 12.6px/1 "GV Space Age",sans-serif\'' in rc, "Constellation label must use Random Galaxy highlight gold and SELECT SURVEY typography"
          assert "precessB1875ToJ2000" not in rc, "Do not double-precess already aligned GeoJSON"
          assert "GV_IAU_BOUNDARY_WIDTH=0.5" in rc and "GV_IAU_BOUNDARY_OPACITY=0.58" in rc
          assert "closedRingCount<80" in rc and "geometry.type==='Polygon'" in rc
          assert "aladin.addOverlay(overlay)" in rc and "overlay.show()" in rc
          pins = set(re.findall(r"https://cdn\.jsdelivr\.net/gh/gear66me-ui/Galaxy_Viewer@([0-9a-f]{40})", rc))
          assert len(pins) == 11, f"Expected 11 immutable dependency pins in BLD 0098; found {len(pins)}"
          assert "https://cdn.jsdelivr.net/gh/gear66me-ui/Galaxy_Viewer@d85d91201ea52aa6524a62394fc81b450b15ac23/viewer/vendor/aladin-lite/3.8.2/aladin.js" in rc
          assert "https://cdn.jsdelivr.net/gh/gear66me-ui/Galaxy_Viewer@d85d91201ea52aa6524a62394fc81b450b15ac23/aladin-source-clone/src/css/aladin.css" in rc
          assert "function gvUpdateLivePhysicalScale()" in rc
          ruler = rc[rc.index("function gvUpdateLivePhysicalScale()"):rc.index("function gvHideEarthDistance")]
          assert "rawFovX>10" in ruler and "limitDegrees:10" in ruler, "Physical ruler must hide above 10-degree horizontal FOV"
          assert "aladin.angularDist(0,height/2,width,height/2)" in ruler, "Ruler must use Aladin projection-aware endpoint angular separation"
          assert "gvEarthDistanceRulerAvmFovXDegrees" in rc and "gvEarthDistanceRulerReferenceMly" in rc, "Fixed arrival AVM calibration must be captured"
          assert "GV0097 AVM-ANCHORED PROJECTION-AWARE RULER" in ruler, "Build 0097 ruler diagnostics missing"
          assert "gvEarthPointerFovVisible" in rc and "x<=30" in rc, "Earth pointer must share the 30-degree visibility threshold"
          assert "GV0097 LIVE CENTER OUTSIDE CATALOG FOV" in rc, "Out-of-field pan must retain and update nearest catalog distance"
          assert "GV0097 EARTH DISTANCE CATALOG EMPTY" in rc, "Empty catalog must preserve last valid pointer state"
          assert "46.5e9*Math.sin" not in ruler, "Remove universal cosmic ruler formula"
          assert "gvEarthDistanceTarget" not in ruler, "Live-center matches must not alter fixed ruler calibration"
          assert "gvPreloadConstellationArtwork(presentation?.constellation)" in rc, "Next-destination constellation preload must run during trip planning"
          assert "gvPreloadConstellationArtwork(destination?.constellation)" in rc, "First destination constellation must preload before the first trip"
          assert "gvPreloadConstellationArtwork(presentationBase?.constellation)" in rc, "Selected constellation preload must start before travel"
          assert "const GV_CONSTELLATION_ARTWORK_CACHE_LIMIT=12" in rc
          artwork = (root / "viewer/modules/provider-artwork/gv-provider-artwork-0005.js").read_text()
          assert "const VERSION='0010'" in artwork
          assert r"normalize('NFD').replace(/[\u0300-\u036f]/g,'')" in artwork, "Shared constellation normalizer must use valid Unicode escapes"
          assert "return [...new Set([" in artwork and "raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/release/viewer/artwork/" in artwork and "gear66me-ui.github.io/Galaxy_Viewer/viewer/artwork/" in artwork, "Constellation art must include CDN, raw GitHub, and GitHub Pages fallback sources"
          assert "preloadConstellations" in artwork and "preloadAllConstellations" in artwork, "All-constellation preload API must be exported"
          assert "function preloadConstellation(name)" in artwork, "Selected constellation preload API missing"
          assert "const IMAGE_CACHE_LIMIT=96;" in artwork, "Icon cache must hold the complete constellation set"
          loader_pins = re.findall(r"https://cdn\.jsdelivr\.net/gh/gear66me-ui/Galaxy_Viewer@([0-9a-f]{40})/viewer/modules/provider-artwork/gv-provider-artwork-0005\.js", rc)
          loader_fallback_pins = re.findall(r"https://raw\.githubusercontent\.com/gear66me-ui/Galaxy_Viewer/([0-9a-f]{40})/viewer/modules/provider-artwork/gv-provider-artwork-0005\.js", rc)
          assert len(loader_pins) == 1 and len(loader_fallback_pins) == 1 and loader_pins[0] == loader_fallback_pins[0], "Build must pin the repaired artwork loader to one matching immutable commit"
          assert "preloadConstellations?.(88)" in rc, "All 88 constellation icons must preload on viewer startup"
          assert "GV CONSTELLATION ART SOURCE FAILED; TRYING FALLBACK" in rc, "Destination artwork preloader must recover from a failed source"
          assert "GV CONSTELLATION ART ALL SOURCES FAILED" in rc, "All-source failures must be diagnosed"
          travel = (root / "viewer/modules/random-galaxy/gv-random-travel-presentation-006.js").read_text()
          assert "const VERSION='006'" in travel
          assert "letterCount>12" in travel, "Constellation names above 12 letters must use the centered two-line layout"
          assert "gv-course-two-line .gv-travel-course-prefix" in travel and "gv-course-two-line .gv-travel-course-name" in travel, "Both trip-planner lines must be centered"
          assert "travelPresentationUrl:'https://cdn.jsdelivr.net/gh/gear66me-ui/Galaxy_Viewer@8ab7dbb04a42145dc972c600cb808bc73cec70bc/viewer/modules/random-galaxy/gv-random-travel-presentation-006.js'" in rc, "Build 0097 must pin the new trip-planner presentation"
          destination = (root / "viewer/modules/destination-presentation/gv-destination-presentation-0062.js").read_text()
          assert "const VERSION='0062';" in destination, "Destination presentation 0062 missing"
          assert "presentMly*1_000_000/(1+z)" in destination, "Emission distance must use distance divided by (1 + redshift)"
          assert "gvdp-emission-distance-key" in destination, "Emission distance must render below emission age"
          assert all(f"DISTANCE ({unit})" in destination for unit in ("GLY","MLY","KLY")), "Compact distance units missing"
          assert "destination-presentation-0062.js" in rc and "VERSION" in destination, "Build 0098 must pin destination presentation 0062"
          print("BUILD 0098 RELEASE VALIDATION PASSED: pointer, manifest, emission distance cards, preserved IAU and AVM behavior, and immutable dependency pins.")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage production site excluding thumbnail and mirror assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='_site/' --exclude='viewer/artwork/runtime/survey-thumbnails/' --exclude='viewer/artwork/runtime/mirrors/' --exclude='**/[Mm]irror/' --exclude='**/[Mm]irrors/' --exclude='**/[Tt]humbnail*/' --exclude='**/[Tt]humbnails/' --exclude='**/[Tt]humbnails/' ./ _site/
          if find _site -type d | grep -Ei '/(mirror|mirrors|thumbnail|thumbnails|survey-thumbnails)$'; then
            echo "ERROR: thumbnail or mirror directories leaked into deployment staging"
            exit 1
          fi
          echo "Staged production site excluding thumbnail and mirror directories."
          du -sh _site

      - name: Upload production site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy production site
        id: deployment
        uses: actions/deploy-pages@v4
