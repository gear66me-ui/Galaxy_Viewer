name: Validate and Deploy RC-V1.0.0.9 Build 0058

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: galaxy-viewer-release-pages
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages-release
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 1

      - name: Validate Build 0058 provider readiness handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re
          root = pathlib.Path(".")
          pointer = json.loads((root / "viewer/gv-current-viewer.json").read_text())
          manifest = json.loads((root / "release-manifest.json").read_text())
          assert pointer == {"version":"RC-V1.0.0.9","viewer":"RC-V1.0.0.9-BLD-0058.py","build":"0058"}, pointer
          assert manifest.get("release") == "RC-V1.0.0.9" and manifest.get("build") == "0058", manifest
          assert manifest.get("runtime") == ["viewer/RC-V1.0.0.9-BLD-0058.py"], manifest
          assert manifest.get("sourceBranch") == "release", manifest
          rc = (root / "viewer" / pointer["viewer"]).read_text()
          assert 'VIEWER_VERSION = "RC-V1.0.0.9"' in rc and 'BUILD_NUMBER = "0058"' in rc
          assert "const GV200001_BUILD='0058'" in rc
          assert "onRandom:()=>{gvSetTripCycle(true);return navigateRandom()}" in rc
          assert "const data=JSON.parse(" in rc, "Boundary data must be bundled, not fetched at runtime"
          assert "precessB1875ToJ2000" not in rc, "Do not double-precess the already J2000-aligned GeoJSON"
          assert "GV_IAU_BOUNDARY_WIDTH=0.7" in rc and "GV_IAU_BOUNDARY_OPACITY=0.58" in rc
          assert "closedRingCount<80" in rc and "geometry.type==='Polygon'" in rc
          assert "aladin.addOverlay(overlay)" in rc and "overlay.show()" in rc
          pins = set(re.findall(r"https://cdn\.jsdelivr\.net/gh/gear66me-ui/Galaxy_Viewer@([0-9a-f]{40})", rc))
          assert len(pins) == 10, f"Expected 10 immutable dependency pins; found {len(pins)}"
          required = {
            "34d6f9b9417438afd56317bc838b93eb655c7d15",
            "d85d91201ea52aa6524a62394fc81b450b15ac23",
            "f5b26bd7a317a57a76a4b68adc05b50ec3f0567e",
            "f7740afe20a1dccd0e58644e8c154f4e6396ed83",
            "e38bfcc36a2f156517f9a77865da0c1c13d49175",
          }
          assert required.issubset(pins), f"Required stable dependency pin missing: {sorted(required-pins)}"
          assert "function gvClearProviderPortalState(" in rc
          assert "GV ROLL 0058: provider website prewarm started immediately for selected galaxy" in rc
          assert "providerPrewarmStarted=gvPrewarmProviderWebsite(destination);" in rc
          assert "ROLL 0056: do not asynchronously delete broad Cache API buckets here." in rc
          assert "prewarm BEFORE awaiting the unrelated HD-image" in rc
          assert "providerPrewarmStarted" in rc
          assert "window.dispatchEvent(new Event('gv-provider-progress-reset'))" in rc
          assert "@4508a3a43017859afe7798b11ed79ac3055efc48/viewer/modules/destination-presentation/gv-destination-presentation-0066.js" in rc
          presentation = (root / "viewer/modules/destination-presentation/gv-destination-presentation-0066.js").read_text()
          assert "const VERSION='0066';" in presentation
          assert "gv-provider-progress-reset" in presentation
          assert "if(providerProgressSuppressed){providerProgressHdFill.style.width='0%';providerProgressHd.classList.remove('gv-ready');return}" in presentation
          assert "retired matching prewarmed provider WebView" not in presentation
          assert "/* ROLL 0066: preserve the selected galaxy's prewarmed provider portal." in presentation
          assert "gvClearProviderPortalState(\'Random Galaxy pressed\')" in rc
          print("BUILD 0057 STATIC VALIDATION PASSED: release identity, provider portal invalidation and fresh selected-galaxy portal loading on navigation, bundled closed IAU polygon data, overlay attach/show, geometry validation, and immutable pins.")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage production site excluding thumbnail and mirror assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='_site/' --exclude='viewer/artwork/runtime/survey-thumbnails/' --exclude='viewer/artwork/runtime/mirrors/' --exclude='**/[Mm]irror/' --exclude='**/[Mm]irrors/' --exclude='**/[Tt]humbnail*/' --exclude='**/[Tt]humbnails/' ./ _site/
          if find _site -type d | grep -Ei '/(mirror|mirrors|thumbnail|thumbnails|survey-thumbnails)$'; then
            echo "ERROR: thumbnail or mirror directories leaked into deployment staging"
            exit 1
          fi
          echo "Staged production site excluding thumbnail and mirror directories."
          du -sh _site

      - name: Upload production site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy production site
        id: deployment
        uses: actions/deploy-pages@v4
