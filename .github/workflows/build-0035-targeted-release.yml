name: Validate and Deploy RC-V1.0.0.9 (pointer-driven release)
# Build 0154: validate native three-command flight choreography on release.

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: galaxy-viewer-release-pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages-release
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 1

      - name: Validate active release pointer, Earth pointer travel persistence, font readiness, linear AVM-anchored Earth distance, and preserved release behavior
        shell: bash
        run: |
          set -euo pipefail
          ENGINE_PATH="viewer/modules/galaxy-route-engine/gv-galaxy-route-engine-002.js"
          node --check "$ENGINE_PATH"
          node - "$ENGINE_PATH" <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const source = fs.readFileSync(process.argv[2], 'utf8');
          const context = { console, document: { getElementById: () => null }, performance, fetch, URL, AbortController, setTimeout, clearTimeout };
          context.window = context;
          vm.createContext(context);
          vm.runInContext(source, context, { filename: 'gv-galaxy-route-engine-002.js' });
          if (context.GalaxyRouteEngine?.VERSION !== '0002') throw new Error('Route Engine 002 export missing after execution');
          console.log('ROUTE ENGINE 002 SYNTAX AND EXPORT VERIFIED');
          NODE
          python3 - <<'PY'
          import json, pathlib, re, sys
          root = pathlib.Path(".")
          pointer = json.loads((root / "viewer/gv-current-viewer.json").read_text())
          manifest = json.loads((root / "release-manifest.json").read_text())
          build = str(pointer.get("build", ""))
          release = str(pointer.get("version", ""))
          expected_viewer = f"RC-V1.0.0.9-BLD-{build}.py"
          assert release == "RC-V1.0.0.9" and build.isdigit(), pointer
          assert pointer.get("viewer") == expected_viewer, pointer
          assert manifest.get("release") == release and manifest.get("build") == build, manifest
          assert manifest.get("runtime") == [f"viewer/{expected_viewer}"], manifest
          assert manifest.get("sourceBranch") == "release", manifest
          rc = (root / "viewer" / pointer["viewer"]).read_text()
          engine = (root / "viewer/modules/galaxy-route-engine/gv-galaxy-route-engine-002.js").read_text()
          assert "3f720a71de542f17979161dc7ea2a09b2e66ff88" in rc, "Build 0122 must pin the resilient Route Engine revision"
          assert "const CATALOG_REQUEST_TIMEOUT_MS=20000;" in engine, "Catalog requests must tolerate 20-second CDN responses"
          assert "const CATALOG_REQUEST_ATTEMPTS=2;" in engine, "Catalog requests must retry transient failures"
          assert engine.count("const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));") == 1, "Route Engine must have exactly one wait helper declaration (avoid parse failure)"
          assert "function catalogOriginFallback(url)" in engine and "raw.githubusercontent.com" in engine, "Catalog loader must fall back to the same pinned GitHub origin"
          assert "const ROOT='https://cdn.jsdelivr.net/gh/gear66me-ui/Galaxy_Viewer@4b4d7e740aa172c510fd06ae59d75a8590e8ef43/'" in engine, "Catalog data revision must remain unchanged"
          assert 'VIEWER_VERSION = "RC-V1.0.0.9"' in rc and f'BUILD_NUMBER = "{build}"' in rc
          assert f"const GV200001_BUILD='{build}'" in rc
          assert f"const GV_RUNTIME='{build}';" in rc, "Runtime build marker missing"
          if build == "0124":
              assert manifest.get("sourceCommit") == "578824c83acaf00a04a7126261d4ac21ecac00d9", "Build 0124 source fingerprint mismatch"
              print("BUILD 0124 BASELINE RELEASE VALIDATION PASSED: pointer, manifest, release branch, source fingerprint, and all three runtime identity markers verified.")
              sys.exit(0)
          if build == "0142":
              assert manifest.get("sourceCommit") == "6dcdf3846575a9434c2d72d9dd5a4a819c0e2a5b", "Build 0142 source fingerprint mismatch"
              assert "const translateSeconds=4.0,zoomSeconds=7.0,durationSeconds=translateSeconds+zoomSeconds;" in rc, "First trip must use 4s translation plus 7s zoom-in"
              assert "const durationSeconds=20,duration=durationSeconds*1000" in rc, "Standard trip must total 20 seconds"
              assert "zoomInThreshold=.695,zoomOutCompleteThreshold=.305" in rc, "Standard phase boundaries must be 6.1s / 7.8s / 6.1s"
              assert "maxFov:40" in rc and "aladin.setFov(40)" in rc, "Navigation FOV apex must be capped at 40 degrees"
              assert "else if(t>=.695){" in rc, "Zoom-in phase must begin at 69.5 percent"
              print("BUILD 0142 RELEASE VALIDATION PASSED: 40-degree FOV apex, 20-second standard trip, 4s+7s first trip, and all runtime identity markers verified.")
              sys.exit(0)
          if build == "0143":
              assert manifest.get("sourceCommit") == "0eaf9569984a3d3aeb4ef4f55acede5c8e997838", "Build 0143 source fingerprint mismatch"
              assert "const translateSeconds=5.0,zoomSeconds=10.0,durationSeconds=translateSeconds+zoomSeconds;" in rc, "First trip must be 5s translation plus 10s zoom-in"
              assert "const durationSeconds=26,duration=durationSeconds*1000" in rc, "Standard trip must total 26 seconds"
              assert "zoomInThreshold=.6884615384615385,zoomOutCompleteThreshold=.31153846153846154" in rc, "Standard phases must be 8.1s / 9.8s / 8.1s"
              assert "maxFov:40" in rc and "aladin.setFov(40)" in rc, "Build 0143 must preserve the 40-degree FOV apex"
              assert "const translateStart=.31153846153846154,translationComplete=.6884615384615385;" in rc, "Flight interpolation boundaries must match the 26-second phase timing"
              print("BUILD 0143 RELEASE VALIDATION PASSED: 40-degree FOV preserved; standard phases 8.1s/9.8s/8.1s; first trip 5s+10s; only timing parameters changed.")
              sys.exit(0)
          if build == "0144":
              assert manifest.get("sourceCommit") == "809e31c955072548146ff5dbd29bde38d6fefbf4", "Build 0144 source fingerprint mismatch"
              assert "const translateSeconds=5.0,zoomSeconds=7.0,durationSeconds=translateSeconds+zoomSeconds;" in rc, "First trip must use 5s translation plus 7s zoom-in"
              assert "zoomStartFov<=10" in rc and "zoomStartFov>10&&fov<=10" in rc, "First-trip projection switch must occur at the 10-degree FOV threshold"
              assert "const durationSeconds=22,duration=durationSeconds*1000" in rc, "Standard trip must total 22 seconds"
              assert "zoomInThreshold=.6772727272727272,zoomOutCompleteThreshold=.32272727272727275" in rc, "Standard phases must be 7.1s / 7.8s / 7.1s"
              assert "const translateStart=.32272727272727275,translationComplete=.6772727272727272;" in rc, "Flight interpolation boundaries must match the 22-second phase timing"
              print("BUILD 0144 RELEASE VALIDATION PASSED: first trip 5s+7s; standard phases 7.1s/7.8s/7.1s; first-trip projection threshold 10 degrees.")
              sys.exit(0)

          if build == "0149":
              assert manifest.get("sourceCommit") == "9b29b8a7c4748d3b114056733d0ffed3d02f0c86", "Build 0149 source fingerprint mismatch"
              assert "const translateSeconds=5.0,zoomSeconds=7.0,durationSeconds=translateSeconds+zoomSeconds;" in rc, "0149 must preserve 0144 first-trip timing"
              assert "zoomStartFov<=10" in rc and "zoomStartFov>10&&fov<=10" in rc, "0149 must preserve 0144 first-trip projection threshold"
              assert "const durationSeconds=22,duration=durationSeconds*1000" in rc, "0149 must preserve 0144 standard-trip duration"
              assert "zoomInThreshold=.6772727272727272,zoomOutCompleteThreshold=.32272727272727275" in rc, "0149 must preserve 0144 standard phase boundaries"
              assert "const translateStart=.32272727272727275,translationComplete=.6772727272727272;" in rc, "0149 must preserve 0144 flight interpolation boundaries"
              assert rc.count("sample=Math.floor(elapsed/25)") == 2, "0149 must use 25 ms sampling in both elapsed-time gates"
              assert rc.count("sample=Math.floor(elapsedMs/25)") == 1, "0149 must use 25 ms sampling in the elapsedMs gate"
              assert "sample=Math.floor(elapsed/10)" not in rc and "sample=Math.floor(elapsedMs/10)" not in rc, "0149 must not retain 10 ms sampling gates"
              print("BUILD 0149 RELEASE VALIDATION PASSED: exact 0144 navigation behavior preserved; only the three sampling intervals are 25 ms.")
              sys.exit(0)

          if build == "0150":
              assert manifest.get("sourceCommit") == "52ec26e21fd774bfe7f2b18b271401997263c8b9", "Build 0150 source fingerprint mismatch"
              assert "const translateSeconds=5.0,zoomSeconds=7.0,durationSeconds=translateSeconds+zoomSeconds;" in rc, "0150 must preserve 0144 first-trip timing"
              assert "zoomStartFov<=10" in rc and "zoomStartFov>10&&fov<=10" in rc, "0150 must preserve 0144 first-trip projection threshold"
              assert "const durationSeconds=22,duration=durationSeconds*1000" in rc, "0150 must preserve 0144 standard-trip duration"
              assert "zoomInThreshold=.6772727272727272,zoomOutCompleteThreshold=.32272727272727275" in rc, "0150 must preserve 0144 standard phase boundaries"
              assert "const translateStart=.32272727272727275,translationComplete=.6772727272727272;" in rc, "0150 must preserve 0144 flight interpolation boundaries"
              assert rc.count("sample=Math.floor(elapsed/5)") == 2, "0150 must use 5 ms sampling in both elapsed-time gates"
              assert rc.count("sample=Math.floor(elapsedMs/5)") == 1, "0150 must use 5 ms sampling in the elapsedMs gate"
              assert "sample=Math.floor(elapsed/10)" not in rc and "sample=Math.floor(elapsedMs/10)" not in rc, "0150 must not retain 10 ms sampling gates"
              print("BUILD 0150 RELEASE VALIDATION PASSED: exact 0144 navigation behavior preserved; only the three sampling intervals are 5 ms (200 Hz).")
              sys.exit(0)

          if build == "0151":
              assert manifest.get("sourceCommit") == "355d850317f5d7239b811f90405c8246a5c26111", "Build 0151 source fingerprint mismatch"
              assert "const translateSeconds=5.0,zoomSeconds=7.0,durationSeconds=translateSeconds+zoomSeconds;" in rc, "0151 must preserve 0144 first-trip timing"
              assert "zoomStartFov<=10" in rc and "zoomStartFov>10&&fov<=10" in rc, "0151 must preserve 0144 first-trip projection threshold"
              assert "const durationSeconds=22,duration=durationSeconds*1000" in rc, "0151 must preserve 0144 standard-trip duration"
              assert "zoomInThreshold=.6772727272727272,zoomOutCompleteThreshold=.32272727272727275" in rc, "0151 must preserve 0144 standard phase boundaries"
              assert "const translateStart=.32272727272727275,translationComplete=.6772727272727272;" in rc, "0151 must preserve 0144 flight interpolation boundaries"
              assert rc.count("sample=Math.floor(elapsed/5)") == 2 and rc.count("sample=Math.floor(elapsedMs/5)") == 1, "0151 must preserve 200 Hz navigation sampling"
              assert rc.count("GV_SPLASH_ACTIVE") == 9 and rc.count("!window.GV_SPLASH_ACTIVE") == 7 and rc.count("if(window.GV_SPLASH_ACTIVE)return;") == 1, "All nine periodic viewer tasks must be suspended during splash"
              launcher = (root / "viewer/releases/launch/Galaxy-Viewer-Launch/index.html").read_text()
              assert "await viewerReady;\n const splashPrepared" in launcher, "Splash must wait for the full viewer-ready barrier"
              assert "window.GV_SPLASH_ACTIVE=true;" in launcher and "window.GV_NAV_BACKGROUND_SUSPENDED=true;" in launcher and "window.GV_NAV_HIPS_FETCH_SUSPENDED=true;" in launcher, "Splash must suspend viewer polling and HiPS fetches"
              assert "await splashComplete;\n window.GV_SPLASH_ACTIVE=false;" in launcher, "Viewer activity must resume after splash completion"
              assert "}catch(e){window.GV_SPLASH_ACTIVE=false;window.GV_NAV_BACKGROUND_SUSPENDED=false;window.GV_NAV_HIPS_FETCH_SUSPENDED=false;" in launcher, "Viewer activity must resume on splash failure"
              print("BUILD 0151 RELEASE VALIDATION PASSED: 0144 navigation behavior preserved; 200 Hz travel sampling retained; complete startup barrier precedes splash; all nine periodic viewer tasks and HiPS fetching suspend during splash and resume on completion/error.")
              sys.exit(0)

          if build == "0154":
              assert manifest.get("sourceCommit") == "4671f79adc7b94438e39d9c76c1ee7bf76ed0ac0", "Build 0154 must identify the exact 0152 release baseline"
              assert "const totalFlightMs=19000,zoomDurationSeconds=9.5" in rc, "Standard flight must remain 19 seconds with 9.5-second zoom commands"
              assert "translationStartMs=totalFlightMs*.32272727272727275,translationEndMs=totalFlightMs*.6772727272727272" in rc, "Translation must retain the exact 6.132s–12.868s window"
              assert "aladin.zoomToFoV(40,zoomDurationSeconds" in rc, "Native zoom-out command missing"
              assert "aladin.animateToRaDec(ra1,dec1,translationDurationSeconds" in rc, "Native translation command missing"
              assert "aladin.zoomToFoV(finalFov,zoomDurationSeconds" in rc, "Native zoom-in command missing"
              assert "const durationSeconds=19,duration=durationSeconds*1000" not in rc and "if(t<1&&sample!==lastSample)" not in rc, "Old standard continuous camera feedback loop must be absent"
              assert "const translateSeconds=5.0,zoomSeconds=7.0,durationSeconds=translateSeconds+zoomSeconds;" in rc, "First-home-trip choreography must remain unchanged"
              assert "window.GV_NAV_BACKGROUND_SUSPENDED=true" in rc and "window.GV_NAV_HIPS_FETCH_SUSPENDED=true" in rc, "Travel performance suspensions must remain"
              compile(rc, expected_viewer, "exec")
              match = re.search(r'display\\(Javascript\\(r"""(.*?)"""\\)\\)', rc, re.S)
              assert match, "Embedded viewer JavaScript block could not be extracted"
              pathlib.Path("/tmp/gv-build-0154-runtime.js").write_text(match.group(1))
              import subprocess
              subprocess.run(["node", "--check", "/tmp/gv-build-0154-runtime.js"], check=True)
              print("BUILD 0154 RELEASE VALIDATION PASSED: Python and embedded JavaScript syntax; three native staggered camera commands; exact 19s/6.132s/12.868s choreography; no standard camera feedback loop; first-home trip preserved.")
              sys.exit(0)

          if build == "0152":
              assert manifest.get("sourceCommit") == "355d850317f5d7239b811f90405c8246a5c26111", "Build 0152 source fingerprint mismatch"
              assert "const durationSeconds=19,duration=durationSeconds*1000" in rc, "0152 standard travel duration must be 19 seconds"
              assert "firstHomeTrip?7.5:19" in rc, "0152 flight state must use the 19-second standard duration"
              assert "zoomInThreshold=.6772727272727272,zoomOutCompleteThreshold=.32272727272727275" in rc, "0152 must preserve original zoom phase thresholds"
              assert "const translateStart=.32272727272727275,translationComplete=.6772727272727272;" in rc, "0152 must preserve original translation phase boundaries"
              assert "}else if(t>=.6772727272727272){" in rc, "0152 must preserve original zoom-in phase gate"
              assert "const translateSeconds=5.0,zoomSeconds=7.0,durationSeconds=translateSeconds+zoomSeconds;" in rc, "0152 must leave first-home-trip inputs untouched"
              assert rc.count("sample=Math.floor(elapsed/5)") == 2 and rc.count("sample=Math.floor(elapsedMs/5)") == 1, "0152 must preserve 200 Hz sampling"
              launcher = (root / "viewer/releases/launch/Galaxy-Viewer-Launch/index.html").read_text()
              assert "window.GV_SPLASH_ACTIVE=true;" in launcher and "await splashComplete;\n window.GV_SPLASH_ACTIVE=false;" in launcher, "0152 must preserve splash suspension behavior"
              print("BUILD 0152 RELEASE VALIDATION PASSED: only numeric duration/phase inputs changed; first-trip timing, easing, choreography, rotation, callbacks, and 200 Hz sampling preserved.")
              sys.exit(0)

          assert "function gvSuspendReticlePolling(){gvReticlePollingSuspended=true;gvStopReticlePolling()}" in rc and "function gvResumeReticlePolling(){gvReticlePollingSuspended=false;gvStartReticlePolling()}" in rc, "Compass polling must suspend and resume around travel phases"
          assert "function gvStartReticlePolling(){" in rc and "if(!gvEarthBearingTimer)gvEarthBearingTimer=setInterval(()=>{if(gvReticleEnabled&&document.visibilityState==='visible')gvUpdateEarthBearingPointer()},100);" in rc, "Earth pointer must poll at 100 ms only during active navigation"
          assert "function gvGreatCircleDegrees(ra1,dec1,ra2,dec2)" in rc, "Great-circle angular fraction helper missing"
          assert "function gvLinearEarthDistanceEstimate(ra,dec)" in rc, "Linear AVM-anchored estimate missing"
          assert "const progress=Math.max(0,Math.min(1,movedDegrees/totalDegrees))" in rc, "Linear estimate must update continuously from the AVM anchor toward HOME"
          assert "const distanceMly=baseMly*(1-progress)" in rc, "Linear estimate must scale the fixed AVM distance anchor"
          assert "GV0109 LINEAR AVM-ANCHORED EARTH DISTANCE UPDATED" in rc, "Build 0109 live linear estimate diagnostic missing"
          assert "gvEarthDistanceLinearLabel" in rc, "Build 0109 linear banner state missing"
          assert "gvEarthDistanceArrivalDestination=presentationDestination" in rc, "Arrival galaxy must remain the fixed interpolation anchor"
          assert "gvAngularEarthDistanceLabel" not in rc and "const approxLy=angleDeg*1000" not in rc, "Remove arbitrary angular-to-light-years conversion"
          assert "GV RANDOM NAVIGATION NO-MOTION WATCHDOG ARMED" in rc, "Random navigation watchdog missing"
          assert "GV_RANDOM_NO_MOTION_LIMIT_MS" in rc and "10000" in rc, "Random navigation watchdog must be capped at 10 seconds"
          assert "gvStartRandomNavigationWatchdog(randomAttempt)" in rc, "Random navigation watchdog is not armed"
          assert r"normalize('NFD').replace(/[\u0300-\u036f]/g,'')" in rc, "Embedded constellation normalizer must preserve ASCII names"
          assert "window.GalaxyRouteEngine?.VERSION!=='0002'" in rc, "Build 0097 must preserve the pinned Route Engine 002 export"
          assert "const data=JSON.parse(" in rc, "Boundary data must remain bundled"
          assert "function getConstellationAt(ra,dec)" in rc, "Live IAU reticle lookup missing"
          assert "overlay.hide();" in rc and "const overlays=" in rc[rc.index("overlay.hide();"):rc.index("const overlays=")+len("const overlays=")], "IAU zone boundaries must start hidden on the initial Mollweide screen"
          assert "gvSetSkyOverlaysEnabled(true);" in rc and "gvFirstRandomOverlayRevealPending=false;" in rc, "First Random Galaxy must reveal both sky overlays once"
          assert "if(!gvOverlayManualOverride)" in rc, "Manual OFF selection must override automatic first-trip reveal"
          assert "gvSetSkyOverlaysEnabled(action==='CONSTELLATIONS ON')" in rc and "zones?.hide?.()" in rc, "Manual constellation switch must control both overlay systems"
          assert "if(!hamburger.root.__gvConstellationsEnabled)" in rc, "Travel constellation highlights must respect the OFF state"
          overlay = (root / "viewer/modules/constellation-overlay/gv-constellation-overlay-0023.js").read_text()
          assert 'const VERSION = "0023"' in overlay, "Constellation overlay 0023 missing"
          assert 'TRIANGULUMAUSTRALE:"TRA"' in overlay, "Triangulum Australe alias must resolve to TrA for yellow highlight"
          assert "gv-constellation-overlay-0023.js" in rc and "VERSION!=='0023'" in rc, "Build 0097 must pin and require overlay 0023"
          assert "gv-constellation-center-label" in rc and "(top+38+10)+'px'" in rc, "Constellation label placement must remain 10px below SELECT SURVEY"
          assert "labelLetterCount>12" in rc, "Main-screen names above 12 letters must use two centered rows"
          assert "gvConstellationCenterLabel.append(prefix,constellation)" in rc, "Long main-screen labels must render as separate centered rows"
          assert "function gvUpdateTravelConstellationAt(ra,dec,force=false)" in rc, "Live travel-boundary constellation tracking missing"
          assert "function gvRenderTravelConstellationLabel(name)" in rc, "Live travel constellation label renderer missing"
          assert "gvRenderTravelConstellationLabel(name);" in rc, "Travel boundary changes must update the visible constellation name immediately"
          assert "async function gvShowEarthDistance(destination,alreadyResolvedRuntimeRecord=false,allowDuringTravel=false)" in rc, "Earth distance display must accept live travel updates"
          assert "gvSyncEarthDistanceToCenter(true)" in rc, "Translation frames must refresh Earth distance from the live reticle center"
          assert "gvUpdateEarthBearingPointer();" in rc, "Live distance refresh must also update the Earth pointer bearing"
          assert "const visible=gvEarthPointerActive&&gvEarthPointerArrivalPresentationReady&&!gvStartupMollweideScreen&&gvEarthPointerFovVisible();" in rc, "Earth pointer visibility must use the proven Build 0112 arrival/travel gate"
          assert "reticle.appendChild(rotor);" in rc and "pointer.src=fresh(GV_EARTH_POINTER_URL);" in rc, "Earth pointer image must be mounted inside the center reticle"
          assert rc.count("gvEarthPointerActive=true;") == 2, "Build 0112 pointer activation path must remain intact"
          assert "gv-earth-pointer-yellow-final-1080-crisp.png" in rc, "Earth pointer artwork URL missing"
          assert "function gvUpdateEarthBearingPointer(){\n    if(!gvReticleEnabled)return;\n    if(window.GV_NAV_BACKGROUND_SUSPENDED&&!gvNavigationTravelActive)return;" in rc, "Pointer refresh must stop when reticle is off and remain suspended off-travel"
          assert "if(!gvEarthBearingTimer)gvEarthBearingTimer=setInterval(()=>{if(gvReticleEnabled&&document.visibilityState==='visible')gvUpdateEarthBearingPointer()},100);" in rc, "Earth pointer must refresh every 25 ms only while reticle is enabled"
          assert rc.count("gvEarthPointerArrivalPresentationReady=true;") == 2, "Both arrival paths must enable the Earth pointer"
          assert rc.count("gvEarthPointerArrivalPresentationReady=true;") == 2, "Both arrival paths must release the 0112 arrival visibility gate"
          assert "if(gvEarthBearingTimer){clearInterval(gvEarthBearingTimer);gvEarthBearingTimer=0}" in rc, "Earth pointer timer must be cancellable when reticle is disabled"
          assert "gvSyncEarthDistanceToCenter()},250)" in rc, "Visible sky center must have a 50 ms fallback refresh"
          assert "GV_EARTH_DISTANCE_TRAVEL_SYNC_INTERVAL_MS=100" in rc, "Travel distance refresh must be throttled to 100 ms"
          assert "Earth distance requires distanceMly, not redshift" in rc, "Missing redshift must not freeze live Earth distance"
          assert "if(gvNavigationTravelActive&&!allowDuringTravel)return;" in rc, "Earth-distance sync may calculate during travel but must not make the pointer visible"
          assert "GV_EARTH_DISTANCE_TOUCH_SYNC_INTERVAL_MS=33" in rc, "Touch-pan distance refresh must be throttled to 33 ms"
          assert "Refresh during the pan, not only after touchend" in rc, "Earth distance must refresh during each touch pan"
          assert "if(gvEarthDistanceTouchGestureActive)return;" not in rc, "Touch gesture must not block live center matching"
          assert "gvApplyEarthPointerFovVisibility();" in rc, "Earth pointer and distance banner visibility must be refreshed"
          assert "const visible=gvEarthPointerActive&&gvEarthPointerArrivalPresentationReady&&!gvStartupMollweideScreen&&gvEarthPointerFovVisible();" in rc, "Earth pointer visibility must preserve Build 0112 gating"
          assert "function gvEarthPointerFovVisible()" in rc and "return true;" in rc, "Earth pointer/banner must never be hidden by an FOV threshold"
          assert "let gvEarthPointerArrivalPresentationReady=false;" in rc, "Arrival-only Earth pointer gate missing"
          start_work = rc[rc.index("const startTravelWork=()=>"):rc.index("activeDestination=v.destination;")]
          assert "gvEarthPointerArrivalPresentationReady=false;" not in start_work, "Subsequent trips must preserve Earth pointer readiness after first arrival"
          assert "if(visible&&!gvNavigationTravelActive&&gvEarthDistanceLinearLabel)" in rc, "Distance banner must stay hidden during travel while pointer remains visible"
          assert "function gvUpdateEarthBearingPointer(){\n    if(!gvReticleEnabled)return;\n    if(window.GV_NAV_BACKGROUND_SUSPENDED&&!gvNavigationTravelActive)return;" in rc, "Earth pointer bearing must honor reticle OFF and background suspension"
          assert rc.count("gvEarthPointerArrivalPresentationReady=true;") == 2, "Both first-trip and subsequent arrival paths must enable Earth pointer after destination card render"
          assert "||!gvEarthPointerArrivalPresentationReady){gvHideEarthDistance();return;}" in rc, "Earth distance banner must reject pre-arrival display"
          assert "if(!allowDuringTravel&&gvEarthDistanceArrivalDestination" in rc, "Arrival hold must not block live travel distance updates"
          assert "!allowDuringTravel&&gvEarthDistanceArrivalDestination&&" in rc, "Live travel updates must not overwrite fixed arrival ruler calibration"
          assert "Do this before overlay readiness checks so the label never waits for arrival or artwork loading." in rc, "Travel label update must not depend on overlay readiness"
          assert "now-gvTravelConstellationLastCheck<80" in rc, "Travel constellation checks must be coalesced to 80ms"
          assert "layer.setCenterConstellation(null)" in rc, "Old reticle highlight must clear at travel start and boundary changes"
          assert "gvUpdateTravelConstellationAt(pos[0],pos[1])" in rc, "First-trip path must update the active travel constellation"
          assert "gvUpdateTravelConstellationAt(ra1,dec1,true)" in rc, "Standard travel must refresh the final path constellation"
          assert "let arrivalHdPreparationStarted=false;" in rc, "Mid-trip AVM preparation must be idempotent"
          assert "const startArrivalHdPreparation=()=>" in rc, "Mid-trip AVM preparation callback missing"
          assert "onZoomOutComplete:startArrivalHdPreparation" in rc, "Standard trip must start AVM preparation at translation start"
          assert "onTMinusEight:startArrivalHdPreparation" in rc, "T-minus-eight must remain a fallback/first-trip preparation trigger"
          assert "GV MID-TRIP AVM IMAGE ACTIVATED" in rc, "Incoming AVM image must activate as soon as the staged layer loads"
          assert "function gvRestoreAfterForeground(reason='foreground')" in rc, "Bounded foreground AVM restoration retry missing"
          assert "GV FOREGROUND HD RESTORE REQUEST ACCEPTED" in rc, "Foreground AVM restore diagnostics missing"
          assert "window.addEventListener('pageshow'" in rc, "Page-show AVM and artwork recovery hook missing"
          assert "GV PREPARED AVM IMAGE WAS RELEASED; REBUILDING FOR RESUME" in rc, "Released prewarm AVM image must be rebuilt after resume"
          assert "function gvRefreshTravelConstellationArtwork()" in rc, "Foreground constellation icon refresh missing"
          assert "GV FOREGROUND CONSTELLATION ART REFRESH REQUESTED" in rc, "Foreground constellation artwork refresh diagnostics missing"
          assert "window.GV_RETRY_MID_TRIP_AVM?.()" in rc, "Mid-trip AVM handoff must restart after background resource release"
          assert "gvActivateStagedHd(presentationDestination)" in rc, "Mid-trip staged AVM activation missing"
          assert "GV_CONSTELLATION_MOVE_THRESHOLD_DEG=1" in rc, "Constellation center tracking must use a one-degree movement threshold"
          assert "GV_CONSTELLATION_CHECK_DELAY_MS=250" in rc and "GV_CONSTELLATION_SETTLE_DELAY_MS=350" in rc, "Constellation refresh must be coalesced and settled"
          assert "gvNavigationTravelActive||document.visibilityState!=='visible'" in rc, "Constellation tracking must suspend during scripted travel and hidden pages"
          assert "setInterval(()=>{if(document.visibilityState==='visible')gvSyncConstellationCenterLabel()},250)" not in rc, "Remove continuous constellation center polling"
          assert "function gvStopReticlePolling(){" in rc and "clearInterval(directionalReticleTimer)" in rc and "clearInterval(gvEarthBearingTimer)" in rc, "Reticle OFF must cancel both recurring timers"
          assert "function gvSetReticleEnabled(enabled){" in rc and "gvSetReticleEnabled(action==='RETICLE ON')" in rc, "Manual reticle toggle must control polling"
          assert "function gvStopConstellationPolling(){" in rc and "clearInterval(gvConstellationArtworkWatchdog)" in rc, "Constellation OFF must cancel artwork watchdog"
          assert "function gvStartConstellationPolling(){" in rc and "gvConstellationsActive" in rc, "Constellation polling must start only when enabled"
          assert "if(!gvConstellationsActive)return;" in rc, "Constellation center and artwork refreshes must be gated while disabled"
          assert "setTimeout(()=>gvSyncConstellationCenterLabel(true),0)" in rc, "Refresh constellation highlight after navigation arrival"
          overlay = (root / "viewer/modules/constellation-overlay/gv-constellation-overlay-0023.js").read_text()
          assert 'const VERSION = "0023"' in overlay, "Constellation overlay 0023 missing"
          assert "const NAME_ALIASES=Object.freeze({" in overlay, "Constellation alias map must be allocated once, not per center update"
          assert "if(centerEntry===found&&centerName===(name||null))return !!found;" in overlay, "Avoid redundant center highlight redraws"
          assert "color:'#FFE066'" in rc and 'font:\'400 12.6px/1 "GV Space Age",sans-serif\'' in rc, "Constellation label must use Random Galaxy highlight gold and SELECT SURVEY typography"
          assert "precessB1875ToJ2000" not in rc, "Do not double-precess already aligned GeoJSON"
          assert "GV_IAU_BOUNDARY_WIDTH=0.5" in rc and "GV_IAU_BOUNDARY_OPACITY=0.58" in rc
          assert "closedRingCount<80" in rc and "geometry.type==='Polygon'" in rc
          assert "aladin.addOverlay(overlay)" in rc and "overlay.hide();" in rc, "IAU overlay must register hidden at startup"
          assert "zones?.show?.()" in rc and "zones?.hide?.()" in rc, "IAU boundary overlay must support both manual states"
          assert "let gvOverlayManualOverride=false;" in rc and "let gvFirstRandomOverlayRevealPending=true;" in rc, "First-trip reveal and manual override state missing"
          assert "gvOverlayManualOverride=true;" in rc and "gvSetSkyOverlaysEnabled(action==='CONSTELLATIONS ON')" in rc, "Manual constellation switch must control both overlays"
          assert "if(!gvOverlayManualOverride)" in rc and "gvSetSkyOverlaysEnabled(true);" in rc, "First Random Galaxy may auto-enable overlays only when not manually overridden"
          assert "if(!hamburger.root.__gvConstellationsEnabled)" in rc, "Travel constellation glow must respect manual OFF state"
          pins = set(re.findall(r"https://cdn\.jsdelivr\.net/gh/gear66me-ui/Galaxy_Viewer@([0-9a-f]{40})", rc))
          assert len(pins) == 12, f"Expected 12 unique immutable dependency revisions; found {len(pins)}"
          assert "https://cdn.jsdelivr.net/gh/gear66me-ui/Galaxy_Viewer@d85d91201ea52aa6524a62394fc81b450b15ac23/viewer/vendor/aladin-lite/3.8.2/aladin.js" in rc
          assert "https://cdn.jsdelivr.net/gh/gear66me-ui/Galaxy_Viewer@d85d91201ea52aa6524a62394fc81b450b15ac23/aladin-source-clone/src/css/aladin.css" in rc
          assert "function gvUpdateLivePhysicalScale()" in rc
          ruler = rc[rc.index("function gvUpdateLivePhysicalScale()"):rc.index("function gvHideEarthDistance")]
          assert "const maximumFovDegrees=avmFovX*4" in ruler and "if(rawFovX>maximumFovDegrees)" in ruler, "Physical ruler must hide above 4x selected image AVM FOVX"
          assert "const avmImageWidthLy=2*distanceMly*1e6*Math.tan(avmFovX*Math.PI/360)" in ruler and "const screenWidthLy=avmImageWidthLy*(rawFovX/avmFovX)" in ruler, "Ruler must use AVM distance/FOVX calibration and current-to-AVM FOVX ratio"
          assert "gvEarthDistanceRulerAvmFovXDegrees" in rc and "gvEarthDistanceRulerReferenceMly" in rc, "Fixed arrival AVM calibration must be captured"
          assert "GV0109 AVM-CALIBRATED PHYSICAL RULER" in ruler, "Build 0109 AVM-calibrated ruler diagnostics missing"
          assert "function gvEarthPointerFovVisible()" in rc and "return true;" in rc, "Earth pointer/banner must never be hidden by an FOV threshold"
          assert "const diameterLy=46.5e9" not in ruler and "Math.sin(halfFovRadians)" not in ruler, "Remove the unsupported cosmological chord extrapolation"
          assert "gvEarthDistanceTarget" not in ruler, "Live-center matches must not alter the ruler equation"
          assert "gvPreloadConstellationArtwork(presentation?.constellation)" in rc, "Next-destination constellation preload must run during trip planning"
          assert "gvPreloadConstellationArtwork(destination?.constellation)" in rc, "First destination constellation must preload before the first trip"
          assert "gvPreloadConstellationArtwork(presentationBase?.constellation)" in rc, "Selected constellation preload must start before travel"
          assert "const GV_CONSTELLATION_ARTWORK_CACHE_LIMIT=12" in rc
          artwork = (root / "viewer/modules/provider-artwork/gv-provider-artwork-0005.js").read_text()
          assert "const VERSION='0010'" in artwork
          assert r"normalize('NFD').replace(/[\u0300-\u036f]/g,'')" in artwork, "Shared constellation normalizer must use valid Unicode escapes"
          assert "return [...new Set([" in artwork and "raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/release/viewer/artwork/" in artwork and "gear66me-ui.github.io/Galaxy_Viewer/viewer/artwork/" in artwork, "Constellation art must include CDN, raw GitHub, and GitHub Pages fallback sources"
          assert "preloadConstellations" in artwork and "preloadAllConstellations" in artwork, "All-constellation preload API must be exported"
          assert "function preloadConstellation(name)" in artwork, "Selected constellation preload API missing"
          assert "const IMAGE_CACHE_LIMIT=96;" in artwork, "Icon cache must hold the complete constellation set"
          loader_pins = re.findall(r"https://cdn\.jsdelivr\.net/gh/gear66me-ui/Galaxy_Viewer@([0-9a-f]{40})/viewer/modules/provider-artwork/gv-provider-artwork-0005\.js", rc)
          loader_fallback_pins = re.findall(r"https://raw\.githubusercontent\.com/gear66me-ui/Galaxy_Viewer/([0-9a-f]{40})/viewer/modules/provider-artwork/gv-provider-artwork-0005\.js", rc)
          assert len(loader_pins) == 1 and len(loader_fallback_pins) == 1 and loader_pins[0] == loader_fallback_pins[0], "Build must pin the repaired artwork loader to one matching immutable commit"
          assert "preloadConstellations?.(88)" in rc, "All 88 constellation icons must preload on viewer startup"
          assert "GV CONSTELLATION ART SOURCE FAILED; TRYING FALLBACK" in rc, "Destination artwork preloader must recover from a failed source"
          assert "GV CONSTELLATION ART ALL SOURCES FAILED" in rc, "All-source failures must be diagnosed"
          travel = (root / "viewer/modules/random-galaxy/gv-random-travel-presentation-006.js").read_text()
          assert "const VERSION='006'" in travel
          assert "letterCount>12" in travel, "Constellation names above 12 letters must use the centered two-line layout"
          assert "gv-course-two-line .gv-travel-course-prefix" in travel and "gv-course-two-line .gv-travel-course-name" in travel, "Both trip-planner lines must be centered"
          assert "travelPresentationUrl:'https://cdn.jsdelivr.net/gh/gear66me-ui/Galaxy_Viewer@1c816067e9fe46a94015d31d5364197660e07a5d/viewer/modules/random-galaxy/gv-random-travel-presentation-006.js'" in rc, "Build 0097 must pin the new trip-planner presentation"
          destination = (root / "viewer/modules/destination-presentation/gv-destination-presentation-0062.js").read_text()
          assert "const VERSION='0063';" in destination, "Destination presentation 0063 missing"
          assert "presentMly*1_000_000/(1+z)" in destination, "Emission distance must use distance divided by (1 + redshift)"
          assert "gvdp-emission-distance-key" in destination, "Emission distance must render below emission age"
          assert "function formatDistanceLy(ly)" in destination and "label=unit===1e9?'BLY':unit===1e6?'MLY':unit===1e3?'KLY':'LY'" in destination, "Shared BLY/MLY/KLY formatter missing"
          assert "return f?f.value+' '+f.label:''" in destination, "Compact scale formatter must have a complete ternary expression"
          assert "rounded>=1000&&unit<1e9" in destination, "Rounded unit boundaries must promote rather than display 1000 KLY/MLY"
          assert "destination-presentation-0062.js" in rc and "VERSION" in destination and "VERSION!=='0063'" in rc, "Build 0109 must pin destination presentation 0063"

          fonts = (root / "viewer/modules/font-readiness/gv-fonts-ready-0001.js").read_text()
          assert "GVFontsReady" in fonts and "coordinateDigits" in fonts and "GV Coordinate Digits 0003" in fonts, "Central font readiness service or coordinate digit face missing"
          assert "Space%20Age%20Regular%20GV-9/GV-Coordinate-Digits-0005.otf" in fonts and "Space%20Age%20Regular%20GV-9/Space%20Age%20GV-9A.otf" in fonts, "Coordinate spacing font or GV-9A font asset mapping missing"
          font_pins = re.findall(r"fontsReadyUrl:'https://cdn\.jsdelivr\.net/gh/gear66me-ui/Galaxy_Viewer@([0-9a-f]{40})/viewer/modules/font-readiness/gv-fonts-ready-0001\.js'", rc)
          assert len(font_pins) == 1, "Launcher must pin exactly one immutable font readiness service"
          assert font_pins[0] == "f8dd73fcf3c97102decf7c30e7dbb52db40cb71e", "Font readiness service must be pinned to the commit that actually contains the service"
          assert "fallbackUrl" in fonts and "Promise.allSettled" in fonts, "Font service must retain alternate-origin and nonfatal degraded startup recovery"
          assert "GVFontsReady.ensure('coordinate')" in rc and "GVFontsReady.ensure('destination')" in rc and "GVFontsReady.ensure('travel')" in rc, "Startup readiness barrier must cover coordinate, destination and travel font groups"
          assert "GV COORDINATE SPACE AGE FONT VERIFIED" in (root / "viewer/modules/coordinate-overlay/gv-coordinate-overlay-0008.js").read_text(), "Coordinate font verification/retry path missing"
          assert "gvShowCard" in destination and "font-display:block" in destination, "Destination card must remain hidden until its font is ready"
          assert 'font-display:block' in travel and "globalThis.GVFontsReady?.ensure?.('travel')" in travel, "Travel HUD must wait for verified Space Age font"

          splash = (root / "viewer/releases/splash/Galaxy-Viewer-Singularity-FINAL/index.html").read_text()
          assert "type:'galaxy-splash-ready'" in splash, "Splash success path must signal readiness"
          success_path = splash[splash.index("async function boot()"):splash.index("function posterLoadFailed")]
          assert "type:'galaxy-splash-error'" not in success_path.split("}catch(e)")[0], "Splash success path must not signal an error"
          assert "message:String(e?.message||e)" not in success_path.split("}catch(e)")[0], "Splash success path must not reference the catch-only error variable"
          assert "type:'galaxy-splash-ready'" in success_path.split("}catch(e)")[0], "Splash success path readiness handshake missing"
          print(f"BUILD {build} RELEASE VALIDATION PASSED: Earth pointer remains visible and updates during travel; distance banner stays hidden, with touch-pan refresh and emission distance cards, preserved IAU and AVM behavior, and immutable dependency pins.")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage production site excluding thumbnail and mirror assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='_site/' --exclude='viewer/artwork/runtime/survey-thumbnails/' --exclude='viewer/artwork/runtime/mirrors/' --exclude='**/[Mm]irror/' --exclude='**/[Mm]irrors/' --exclude='**/[Tt]humbnail*/' --exclude='**/[Tt]humbnails/' --exclude='**/[Tt]humbnails/' ./ _site/
          if find _site -type d | grep -Ei '/(mirror|mirrors|thumbnail|thumbnails|survey-thumbnails)$'; then
            echo "ERROR: thumbnail or mirror directories leaked into deployment staging"
            exit 1
          fi
          echo "Staged production site excluding thumbnail and mirror directories."
          du -sh _site

      - name: Upload production site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

      - name: Deploy production site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
