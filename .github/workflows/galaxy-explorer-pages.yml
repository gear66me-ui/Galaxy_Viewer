name: Deploy Galaxy Explorer

on:
  push:
    branches: [release]
    paths:
      - "temporary-demos/galaxy-explorer-0001/**"
      - "temporary-demos/galaxy-explorer-0002/**"\n      - "temporary-demos/galaxy-explorer-0003/**"
      - ".github/workflows/galaxy-explorer-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages-release
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
