name: Temporary Hubble Science Catalog Publisher

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: temporary-hubble-science-catalog-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.id == 31911566830 && github.event.workflow_run.head_branch == 'beta'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact beta branch
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Verify baseline and build exact enriched catalog
        run: |
          python3 <<'PY'
          import base64
          import copy
          import json
          import pathlib
          import subprocess
          import zlib

          path = pathlib.Path("viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0001.json")
          expected_baseline_blob = "060f0abadd103e320c70f035ac93f42d200eda0f"
          expected_candidate_blob = "d02cfaae7c690b75db70010a7a5fa87c917d2f37"

          current_blob = subprocess.check_output(
              ["git", "hash-object", str(path)], text=True
          ).strip()
          if current_blob != expected_baseline_blob:
              raise SystemExit(
                  f"Baseline blob {current_blob} != authorized {expected_baseline_blob}"
              )

          original = json.loads(path.read_text(encoding="utf-8"))
          if len(original.get("entries", [])) != 1879:
              raise SystemExit("Baseline does not contain exactly 1,879 entries")
          original_ids = [entry.get("archiveId") for entry in original["entries"]]
          if len(set(original_ids)) != 1879:
              raise SystemExit("Baseline archive IDs are not 1,879 unique values")

          encoded = ""
          enrichment = json.loads(zlib.decompress(base64.b64decode(encoded)).decode("utf-8"))
          science_rows = enrichment["science"]
          if len(science_rows) != 1879:
              raise SystemExit("Enrichment payload does not contain 1,879 science rows")

          candidate = copy.deepcopy(original)
          for entry, science in zip(candidate["entries"], science_rows):
              entry["science"] = science
          candidate["scientificEnrichment"] = enrichment["scientificEnrichment"]

          candidate_ids = [entry.get("archiveId") for entry in candidate["entries"]]
          if candidate_ids != original_ids:
              raise SystemExit("Archive ID order changed")
          if len(set(candidate_ids)) != 1879:
              raise SystemExit("Candidate archive IDs are not unique")

          for before, after in zip(original["entries"], candidate["entries"]):
              stripped = dict(after)
              stripped.pop("science", None)
              if stripped != before:
                  raise SystemExit(f"Unauthorized pre-existing record change: {before.get('archiveId')}")

          candidate_top = dict(candidate)
          candidate_top.pop("entries")
          candidate_top.pop("scientificEnrichment", None)
          original_top = dict(original)
          original_top.pop("entries")
          if candidate_top != original_top:
              raise SystemExit("Unauthorized top-level catalog metadata change")

          stats = candidate["scientificEnrichment"]["statistics"]
          expected_stats = {
              "records": 1879,
              "distance_esa": 1078,
              "distance_xref": 148,
              "distance_redshift_estimate": 156,
              "distance_unresolved": 497,
              "distance_malformed_preserved_unresolved": 2,
              "size_approx_fov_upper": 1070,
              "size_unresolved": 809,
              "age_unresolved": 1879,
          }
          if stats != expected_stats:
              raise SystemExit(f"Unexpected enrichment statistics: {stats}")

          path.write_text(
              json.dumps(candidate, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          parsed = json.loads(path.read_text(encoding="utf-8"))
          if len(parsed.get("entries", [])) != 1879:
              raise SystemExit("Written JSON does not contain 1,879 entries")

          candidate_blob = subprocess.check_output(
              ["git", "hash-object", str(path)], text=True
          ).strip()
          if candidate_blob != expected_candidate_blob:
              raise SystemExit(
                  f"Candidate blob {candidate_blob} != authorized {expected_candidate_blob}"
              )

          print(f"BASELINE_BLOB={current_blob}")
          print(f"CANDIDATE_BLOB={candidate_blob}")
          print("RECORDS=1879")
          print("UNIQUE_ARCHIVE_IDS=1879")
          print(f"STATISTICS={json.dumps(stats, sort_keys=True)}")
          PY

      - name: Commit catalog and remove temporary publisher
        run: |
          set -euo pipefail
          CATALOG="viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0001.json"
          WORKFLOW=".github/workflows/enrich-hubble-science-catalog.yml"
          EXPECTED_BLOB="d02cfaae7c690b75db70010a7a5fa87c917d2f37"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "$CATALOG"
          git rm -- "$WORKFLOW"

          mapfile -t paths < <(git diff --cached --name-only)
          printf 'STAGED_PATH=%s\n' "${paths[@]}"
          if [[ "${#paths[@]}" -ne 2 ]]; then
            echo "Expected exactly two staged paths, got ${#paths[@]}" >&2
            exit 1
          fi
          if [[ "${paths[0]}" != "$WORKFLOW" || "${paths[1]}" != "$CATALOG" ]]; then
            printf 'Unexpected staged paths:\n%s\n' "${paths[*]}" >&2
            exit 1
          fi

          CANDIDATE_BLOB="$(git hash-object "$CATALOG")"
          if [[ "$CANDIDATE_BLOB" != "$EXPECTED_BLOB" ]]; then
            echo "Pre-commit candidate blob mismatch: $CANDIDATE_BLOB" >&2
            exit 1
          fi

          git commit -m "Enrich full Hubble science catalog [skip ci]"
          COMMIT_SHA="$(git rev-parse HEAD)"
          COMMITTED_BLOB="$(git rev-parse "HEAD:$CATALOG")"
          if [[ "$COMMITTED_BLOB" != "$EXPECTED_BLOB" ]]; then
            echo "Committed blob mismatch: $COMMITTED_BLOB" >&2
            exit 1
          fi

          printf 'COMMIT_SHA=%s\n' "$COMMIT_SHA"
          printf 'CATALOG_BLOB=%s\n' "$COMMITTED_BLOB"
          printf 'CHANGED_PATH=%s\n' "$WORKFLOW"
          printf 'CHANGED_PATH=%s\n' "$CATALOG"

          git push origin HEAD:beta
