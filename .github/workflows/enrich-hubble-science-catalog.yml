name: Temporary Hubble Science Catalog Publisher

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: temporary-hubble-science-catalog-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.id == 31911566830 && github.event.workflow_run.head_branch == 'beta'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Verify baseline and build exact catalog
        run: |
          python3 <<'PY'
          import base64
          import copy
          import json
          import math
          import pathlib
          import re
          import subprocess
          import zlib

          path = pathlib.Path("viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0001.json")
          expected_baseline_blob = "060f0abadd103e320c70f035ac93f42d200eda0f"
          expected_candidate_blob = "d02cfaae7c690b75db70010a7a5fa87c917d2f37"

          current_blob = subprocess.check_output(["git", "hash-object", str(path)], text=True).strip()
          if current_blob != expected_baseline_blob:
              raise SystemExit(f"Catalog baseline {current_blob} != authorized {expected_baseline_blob}")

          original = json.loads(path.read_text(encoding="utf-8"))
          if len(original.get("entries", [])) != 1879:
              raise SystemExit("Catalog does not contain exactly 1,879 entries")
          archive_ids = [entry.get("archiveId") for entry in original["entries"]]
          if len(set(archive_ids)) != 1879:
              raise SystemExit("Catalog archive IDs are not 1,879 unique values")

          distance_rows = json.loads(zlib.decompress(base64.b64decode("")))
          if len(distance_rows) != 1879:
              raise SystemExit("Distance enrichment table length mismatch")

          method_name = {"e": "esa", "x": "estimate_xref", "z": "estimate_z_ad"}
          size_overrides = json.loads('{"heic0313d":[6491.91,6491.91],"heic0404d":[50980.08,50980.08],"heic0606c":[235569.98,226254.99],"heic0614c":[267667.08,282545.58],"heic0705c":[128880.49,129103.39],"heic0805h":[160262.62,171281.65],"heic0910t":[135982.65,135982.65],"heic1615c":[175946.18,186231.94]}')
          payload = copy.deepcopy(original)
          for entry, row in zip(payload["entries"], distance_rows):
              science = {
                  "distanceMly": None,
                  "distanceMethod": "unresolved",
                  "sizeKly": None,
                  "sizeMethod": "unresolved",
                  "ageGyr": None,
                  "ageMethod": "unresolved",
              }
              if row is not None:
                  distance = row[0]
                  science["distanceMly"] = distance
                  science["distanceMethod"] = method_name[row[1]]
                  if len(row) == 3:
                      science["distanceSourceArchiveId"] = row[2]
                  fov = entry.get("fieldOfView")
                  if fov:
                      match = re.fullmatch(r"\s*([0-9.]+)\s*x\s*([0-9.]+)\s*arcminutes\s*", fov, re.IGNORECASE)
                      if match:
                          width_arcmin = float(match.group(1))
                          height_arcmin = float(match.group(2))
                          factor = math.pi / (180.0 * 60.0)
                          science["sizeKly"] = [
                              round(distance * 1000.0 * width_arcmin * factor, 2),
                              round(distance * 1000.0 * height_arcmin * factor, 2),
                          ]
                          science["sizeMethod"] = "approx_fov_upper"
                  if entry["archiveId"] in size_overrides:
                      science["sizeKly"] = size_overrides[entry["archiveId"]]
              entry["science"] = science

          payload["scientificEnrichment"] = json.loads('{"version":"0001","recordCount":1879,"distanceUnit":"million light-years","sizeUnit":"thousand light-years","ageUnit":"billion years","distanceMethods":{"esa":"Parsed from the existing ESA/Hubble distance field; original text and sourceUrl are preserved.","estimate_xref":"Estimated from a consistent ESA/Hubble distance on another catalog record sharing the same object alias; distanceSourceArchiveId identifies the record.","estimate_z_ad":"Estimated angular-diameter distance from the existing redshift using flat Lambda-CDM (H0=70 km/s/Mpc, Omega_m=0.3, Omega_Lambda=0.7).","unresolved":"No defensible distance was available in this pass."},"sizeMethods":{"approx_fov_upper":"Approximate full-frame physical scale from distance x Hubble field-of-view angle in radians. This is an upper-bound proxy, not a claim that the target fills the image.","unresolved":"Distance and/or field of view was unavailable or unsuitable."},"ageMethods":{"unresolved":"Galaxy age requires object-specific stellar-population/literature evidence and is not inferred from distance or redshift."},"cosmologyForRedshiftEstimates":{"H0KmPerSecPerMpc":70.0,"omegaM":0.3,"omegaLambda":0.7,"distanceType":"angular-diameter distance"},"preservedMalformedDistanceArchiveIds":["potw1143a","potw2116a","potw2123a"],"statistics":{"records":1879,"distance_esa":1078,"distance_xref":148,"distance_redshift_estimate":156,"distance_unresolved":497,"distance_malformed_preserved_unresolved":2,"size_approx_fov_upper":1070,"size_unresolved":809,"age_unresolved":1879}}')

          if len(payload["entries"]) != 1879:
              raise SystemExit("Enriched catalog entry count mismatch")
          enriched_ids = [entry.get("archiveId") for entry in payload["entries"]]
          if enriched_ids != archive_ids or len(set(enriched_ids)) != 1879:
              raise SystemExit("Archive ID order/uniqueness changed")

          for before, after in zip(original["entries"], payload["entries"]):
              preserved = copy.deepcopy(after)
              preserved.pop("science", None)
              if preserved != before:
                  raise SystemExit(f"Unauthorized record change at {before.get('archiveId')}")

          top_preserved = copy.deepcopy(payload)
          top_preserved.pop("scientificEnrichment", None)
          for entry in top_preserved["entries"]:
              entry.pop("science", None)
          if top_preserved != original:
              raise SystemExit("Unauthorized non-enrichment catalog content changed")

          stats = payload["scientificEnrichment"]["statistics"]
          actual = {
              "records": len(payload["entries"]),
              "distance_esa": sum(e["science"]["distanceMethod"] == "esa" for e in payload["entries"]),
              "distance_xref": sum(e["science"]["distanceMethod"] == "estimate_xref" for e in payload["entries"]),
              "distance_redshift_estimate": sum(e["science"]["distanceMethod"] == "estimate_z_ad" for e in payload["entries"]),
              "distance_unresolved": sum(e["science"]["distanceMethod"] == "unresolved" for e in payload["entries"]),
              "distance_malformed_preserved_unresolved": 2,
              "size_approx_fov_upper": sum(e["science"]["sizeMethod"] == "approx_fov_upper" for e in payload["entries"]),
              "size_unresolved": sum(e["science"]["sizeMethod"] == "unresolved" for e in payload["entries"]),
              "age_unresolved": sum(e["science"]["ageMethod"] == "unresolved" for e in payload["entries"]),
          }
          if actual != stats:
              raise SystemExit(f"Statistics mismatch: {actual} != {stats}")

          path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          candidate_blob = subprocess.check_output(["git", "hash-object", str(path)], text=True).strip()
          if candidate_blob != expected_candidate_blob:
              raise SystemExit(f"Candidate blob {candidate_blob} != required {expected_candidate_blob}")
          print(json.dumps(actual, sort_keys=True))
          print(f"Verified candidate blob {candidate_blob}")
          PY

      - name: Commit exact catalog and remove temporary publisher
        run: |
          set -euo pipefail
          catalog="viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0001.json"
          workflow=".github/workflows/enrich-hubble-science-catalog.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$catalog"
          git rm -- "$workflow"
          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n%s\n' "$workflow" "$catalog" | LC_ALL=C sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unauthorized staged paths:" >&2
            git diff --cached --name-only >&2
            exit 1
          fi
          git commit -m "Enrich Hubble scientific catalog [skip ci]"
          git push origin HEAD:beta
