name: Build Galaxy Viewer 10C Recovery

on:
  push:
    branches:
      - beta
    paths:
      - '.github/workflows/build-galaxy-viewer-10C-recovery.yml'

permissions:
  contents: write

jobs:
  build-10c:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Verify exact 10B baseline catalog and protected assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object viewer/GV-beta-0010B.py)" = "0e6121eaf299be8f12fc86a5e3058c91769b5edf"
          test "$(git hash-object viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0006.json)" = "74bae1c45befeefe73c3cc68771f531574c0c8e2"
          test "$(git hash-object viewer/artwork/icon.svg)" = "829faf3594e85d4ff529d3c2b069a309d580b054"
          test "$(git hash-object viewer/artwork/Hubble/Hubble-NASA-ESA-logo.png)" = "9283e83cfbacd230551e9fc005794138be59709b"
          test "$(git hash-object viewer/artwork/Hubble/Hubble-NASA-ESA-BW.png)" = "5b597839833f4b7a7d477e720fd12949e8515ac6"
          test "$(git hash-object viewer/modules/gv-random-galaxy-0028.js)" = "625b8d889f67652fa19a39b8689e306ea1c1fb91"
          test "$(git hash-object android/galaxy-viewer-9i/app/src/main/res/drawable/gv_app_icon.png)" = "47b3e714053bfd64f835d3f1a2510e13618dbede"
          test ! -e viewer/GV-beta-0010C.py
          python - <<'PY'
          import json
          p='viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0006.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['version']=='full-0006'
          assert d['categoryEntryCount']==1879
          assert d['metadataRecordCount']==1879
          assert d['downloadedImageCount']==1879
          assert len(d['entries'])==1879
          print('0006 catalog verified:',d['version'],len(d['entries']))
          PY

      - name: Generate exact standalone 10C and forensic audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import difflib, hashlib, json, subprocess

          src=Path('viewer/GV-beta-0010B.py')
          dst=Path('viewer/GV-beta-0010C.py')
          raw=src.read_bytes(); before=raw.decode('utf-8'); text=before
          assert subprocess.check_output(['git','hash-object',str(src)],text=True).strip()=='0e6121eaf299be8f12fc86a5e3058c91769b5edf'
          assert not text.endswith('\n')
          changes=[]
          def once(old,new,label,req):
              global text
              c=text.count(old)
              if c!=1: raise SystemExit(f'{label}: expected 1 occurrence, got {c}')
              text=text.replace(old,new,1)
              changes.append({'label':label,'requirement':req,'old':old,'new':new})

          once('# GV-beta-0010B\n','# GV-beta-0010C\n','header identity',1)
          once('.gv-10b-version','.gv-10c-version','startup CSS class',11)
          once("version.className='gv-10b-version';version.textContent='VERSION 10B'","version.className='gv-10c-version';version.textContent='VERSION 10C'",'startup version label',11)
          once("    const VERSION='10B';\n    const DISPLAY_VERSION='10B';","    const VERSION='10C';\n    const DISPLAY_VERSION='10C';",'runtime identity',1)
          once("    const HUBBLE_CATALOG_URL='https://gear66me-ui.github.io/Galaxy_Viewer/viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0002.json?v=c1e850ee3f9476882e7efde5fa24d0a36290a1b3';","    const HUBBLE_CATALOG_URL='https://gear66me-ui.github.io/Galaxy_Viewer/viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0006.json?v=74bae1c45befeefe73c3cc68771f531574c0c8e2';",'catalog 0006',5)

          old_nav="#gv-random-galaxy{font-size:15.5px!important;border:3px solid #4F8CFF!important;box-shadow:inset 0 0 9px rgba(167,255,203,.42),0 0 12px rgba(79,140,255,.92),0 0 20px rgba(79,140,255,.50)!important;filter:brightness(1.10)}.gv-galaxy-history{border:3px solid #4F8CFF!important;box-shadow:inset 0 0 9px rgba(167,255,203,.42),0 0 12px rgba(79,140,255,.92),0 0 20px rgba(79,140,255,.50)!important;filter:brightness(1.10)}"
          new_nav="#gv-random-galaxy{font-size:15.5px!important;border:3px solid #ff8214!important;box-shadow:inset 0 0 9px rgba(167,255,203,.42),0 0 12px rgba(255,130,20,.92),0 0 20px rgba(255,130,20,.50)!important;filter:brightness(1.10)}.gv-galaxy-history{border:3px solid #ff8214!important;box-shadow:inset 0 0 9px rgba(167,255,203,.42),0 0 12px rgba(255,130,20,.92),0 0 20px rgba(255,130,20,.50)!important;filter:brightness(1.10)}"
          once(old_nav,new_nav,'navigation accent blue to Hubble orange-red',2)
          once('# GV-beta-0010B staged','# GV-beta-0010C staged','staged identity',1)

          out=text.encode('utf-8'); dst.write_bytes(out)
          subprocess.run(['python','-m','py_compile',str(dst)],check=True)
          assert not text.endswith('\n')

          for marker in ["const VERSION='10C';","const DISPLAY_VERSION='10C';","version.textContent='VERSION 10C'",'border:3px solid #ff8214!important','rgba(255,130,20,.92)','gv-hubble-galaxies-full-0006.json?v=74bae1c45befeefe73c3cc68771f531574c0c8e2','border:2px solid #ff8214!important','.gvrg-hd img{scale:1.052632}','HUBBLE_PREFETCH_TARGET=10','suspendBackgroundWork();','resumeBackgroundWork();',"img.src='artwork/icon.svg'"]:
              assert marker in text, marker
          assert 'border:3px solid #4F8CFF!important' not in text
          assert 'gv-hubble-galaxies-full-0002.json?v=c1e850ee3f9476882e7efde5fa24d0a36290a1b3' not in text

          sm=difflib.SequenceMatcher(a=before,b=text,autojunk=False)
          ins=dele=0; opcodes=[]
          for tag,i1,i2,j1,j2 in sm.get_opcodes():
              if tag!='equal': opcodes.append({'tag':tag,'before':[i1,i2],'after':[j1,j2],'old':before[i1:i2],'new':text[j1:j2]})
              if tag in ('insert','replace'): ins+=j2-j1
              if tag in ('delete','replace'): dele+=i2-i1
          audit={
            'baseline_blob':subprocess.check_output(['git','hash-object',str(src)],text=True).strip(),
            'candidate_blob':subprocess.check_output(['git','hash-object',str(dst)],text=True).strip(),
            'bytes_before':len(raw),'bytes_after':len(out),'byte_delta':len(out)-len(raw),
            'chars_before':len(before),'chars_after':len(text),'char_delta':len(text)-len(before),
            'lines_before':raw.count(b'\n')+1,'lines_after':out.count(b'\n')+1,
            'newlines_before':raw.count(b'\n'),'newlines_after':out.count(b'\n'),
            'spaces_before':before.count(' '),'spaces_after':text.count(' '),
            'tabs_before':before.count('\t'),'tabs_after':text.count('\t'),
            'final_newline_before':before.endswith('\n'),'final_newline_after':text.endswith('\n'),
            'inserted_characters':ins,'deleted_characters':dele,
            'sha256':hashlib.sha256(out).hexdigest(),
            'authorized_replacements':changes,'diff_opcode_count':len(opcodes)
          }
          Path('/tmp/gv10c-audit.json').write_text(json.dumps(audit,indent=2)+'\n',encoding='utf-8')
          Path('/tmp/gv10c-opcodes.json').write_text(json.dumps(opcodes,indent=2)+'\n',encoding='utf-8')
          Path('/tmp/gv10c.diff').write_text(''.join(difflib.unified_diff(before.splitlines(True),text.splitlines(True),fromfile='GV-beta-0010B.py',tofile='GV-beta-0010C.py')),encoding='utf-8')
          print(json.dumps(audit,indent=2)); print(Path('/tmp/gv10c.diff').read_text(encoding='utf-8'))
          PY
          git diff --no-index --check viewer/GV-beta-0010B.py viewer/GV-beta-0010C.py || rc=$?; test "${rc:-1}" = 1

      - name: Build standalone Android working tree from audited 10C
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import importlib.util, re, shutil, sys, subprocess, json
          root=Path('.').resolve(); sys.path.insert(0,str(root/'.github/scripts'))
          spec=importlib.util.spec_from_file_location('gv9im',root/'.github/scripts/prepare_galaxy_viewer_9im.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          mod.VIEWER=root/'viewer/GV-beta-0010C.py'
          mod.copy_assets()
          oldcat=mod.ASSETS/'data/gv-hubble-galaxies-full-0002.json'
          if oldcat.exists(): oldcat.unlink()
          shutil.copy2(root/'viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0006.json',mod.ASSETS/'data/gv-hubble-galaxies-full-0006.json')
          shutil.copy2(root/'viewer/artwork/icon.svg',mod.ASSETS/'artwork/icon.svg')
          mod.patch_packaged_splash(); mod.build_standalone()
          index=mod.ASSETS/'index.html'
          s=index.read_text(encoding='utf-8')
          s=s.replace('<title>GALAXY VIEWER 9I-M</title>','<title>GALAXY VIEWER 10C</title>',1)
          s=s.replace('data/gv-hubble-galaxies-full-0002.json','data/gv-hubble-galaxies-full-0006.json')
          index.write_text(s,encoding='utf-8')
          mod.base.patch_android()

          gradle=mod.ANDROID/'app/build.gradle'; g=gradle.read_text(encoding='utf-8')
          g=re.sub(r'versionCode\s+\d+','versionCode 22',g,count=1)
          g=re.sub(r"versionName\s+'[^']+'","versionName '10C'",g,count=1); gradle.write_text(g,encoding='utf-8')

          # Build-time-only adaptive launcher icon: untouched existing PNG foreground on explicit black Android background.
          values=mod.ANDROID/'app/src/main/res/values'; values.mkdir(parents=True,exist_ok=True)
          (values/'gv_10c_launcher.xml').write_text('<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="gv_launcher_black">#000000</color></resources>\n',encoding='utf-8')
          mip=mod.ANDROID/'app/src/main/res/mipmap-anydpi-v26'; mip.mkdir(parents=True,exist_ok=True)
          (mip/'gv_app_icon_10c.xml').write_text('<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/gv_launcher_black"/><foreground android:drawable="@drawable/gv_app_icon"/></adaptive-icon>\n',encoding='utf-8')

          manifest=mod.ANDROID/'app/src/main/AndroidManifest.xml'; m=manifest.read_text(encoding='utf-8')
          m=re.sub(r'android:label="[^"]+"','android:label="GALAXY VIEWER 10C"',m,count=1)
          m=re.sub(r'android:icon="[^"]+"','android:icon="@mipmap/gv_app_icon_10c"',m,count=1)
          if 'android:roundIcon=' in m:
              m=re.sub(r'android:roundIcon="[^"]+"','android:roundIcon="@mipmap/gv_app_icon_10c"',m,count=1)
          else:
              m=m.replace('android:icon="@mipmap/gv_app_icon_10c"','android:icon="@mipmap/gv_app_icon_10c"\n        android:roundIcon="@mipmap/gv_app_icon_10c"',1)
          manifest.write_text(m,encoding='utf-8')

          s=index.read_text(encoding='utf-8')
          for marker in ["DISPLAY_VERSION='10C'","version.textContent='VERSION 10C'",'border:3px solid #ff8214!important','rgba(255,130,20,.92)','border:2px solid #ff8214!important','Hubble-NASA-ESA-logo.png?v=9283e83cfbacd230551e9fc005794138be59709b','.gvrg-hd img{scale:1.052632}','data/gv-hubble-galaxies-full-0006.json',"splash.src='splash/index.html'",'},3500);']:
              assert marker in s, marker
          assert 'border:3px solid #4F8CFF!important' not in s
          assert 'data/gv-hubble-galaxies-full-0002.json' not in s
          assert (mod.ASSETS/'artwork/icon.svg').read_bytes()==(root/'viewer/artwork/icon.svg').read_bytes()
          assert subprocess.check_output(['git','hash-object',str(mod.ANDROID/'app/src/main/res/drawable/gv_app_icon.png')],text=True).strip()=='47b3e714053bfd64f835d3f1a2510e13618dbede'
          cat=json.load(open(mod.ASSETS/'data/gv-hubble-galaxies-full-0006.json',encoding='utf-8')); assert len(cat['entries'])==1879
          assert '@mipmap/gv_app_icon_10c' in manifest.read_text(encoding='utf-8')
          assert '#000000' in (values/'gv_10c_launcher.xml').read_text(encoding='utf-8')
          PY

      - name: Browser smoke test 10C Viewer
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"; test -n "$CHROME"
          python -m http.server 8765 --bind 127.0.0.1 --directory android/galaxy-viewer-9i/app/src/main/assets >/tmp/gv10c-http.log 2>&1 &
          SERVER_PID=$!; trap 'kill $SERVER_PID >/dev/null 2>&1 || true' EXIT; sleep 1
          set +e
          timeout 100s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --enable-webgl --ignore-gpu-blocklist --virtual-time-budget=70000 --dump-dom 'http://127.0.0.1:8765/index.html?smoke=1' >/tmp/gv10c-dom.html 2>/tmp/gv10c-chrome.log
          RC=$?; set -e
          grep -q 'data-viewer-status="ready"' /tmp/gv10c-dom.html
          echo "10C browser smoke PASS rc=$RC"

      - name: Commit only 10C source and remove temporary workflow
        id: source_commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Galaxy Viewer Build Bot'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git stash push --include-untracked -m 10c-android-working-tree -- android/galaxy-viewer-9i
          git fetch origin beta; git rebase origin/beta
          test "$(git hash-object viewer/GV-beta-0010B.py)" = "0e6121eaf299be8f12fc86a5e3058c91769b5edf"
          test "$(git hash-object viewer/GV-beta-0010C.py)" = "$(python -c "import json;print(json.load(open('/tmp/gv10c-audit.json'))['candidate_blob'])")"
          git add viewer/GV-beta-0010C.py
          git rm .github/workflows/build-galaxy-viewer-10C-recovery.yml
          git diff --cached --check
          CHANGED="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n%s\n' '.github/workflows/build-galaxy-viewer-10C-recovery.yml' 'viewer/GV-beta-0010C.py' | sort)"
          test "$CHANGED" = "$EXPECTED"
          git commit -m 'Release standalone Galaxy Viewer 10C'
          git push origin HEAD:beta
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_blob=$(git hash-object viewer/GV-beta-0010C.py)" >> "$GITHUB_OUTPUT"
          git stash pop
          test "$(git hash-object viewer/GV-beta-0010B.py)" = "0e6121eaf299be8f12fc86a5e3058c91769b5edf"
          test "$(git hash-object viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0006.json)" = "74bae1c45befeefe73c3cc68771f531574c0c8e2"
          test "$(git hash-object viewer/artwork/icon.svg)" = "829faf3594e85d4ff529d3c2b069a309d580b054"
          test "$(git hash-object android/galaxy-viewer-9i/app/src/main/res/drawable/gv_app_icon.png)" = "47b3e714053bfd64f835d3f1a2510e13618dbede"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build 10C APK
        working-directory: android/galaxy-viewer-9i
        run: gradle --no-daemon :app:assembleDebug

      - name: Inspect exact APK payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from zipfile import ZipFile
          apk='android/galaxy-viewer-9i/app/build/outputs/apk/debug/app-debug.apk'
          with ZipFile(apk) as z:
              names=set(z.namelist())
              for required in ['assets/index.html','assets/splash/index.html','assets/data/gv-hubble-galaxies-full-0006.json','assets/artwork/icon.svg']:
                  assert required in names, required
              assert 'assets/data/gv-hubble-galaxies-full-0002.json' not in names
              s=z.read('assets/index.html').decode('utf-8')
              for marker in ["DISPLAY_VERSION='10C'","version.textContent='VERSION 10C'",'border:3px solid #ff8214!important','rgba(255,130,20,.92)','border:2px solid #ff8214!important','Hubble-NASA-ESA-logo.png?v=9283e83cfbacd230551e9fc005794138be59709b','.gvrg-hd img{scale:1.052632}','data/gv-hubble-galaxies-full-0006.json',"splash.src='splash/index.html'",'},3500);']:
                  assert marker in s, marker
              assert 'border:3px solid #4F8CFF!important' not in s
              assert z.read('assets/artwork/icon.svg')==open('viewer/artwork/icon.svg','rb').read()
          PY
          grep -q '@mipmap/gv_app_icon_10c' android/galaxy-viewer-9i/app/src/main/AndroidManifest.xml
          grep -q '#000000' android/galaxy-viewer-9i/app/src/main/res/values/gv_10c_launcher.xml
          grep -q '@color/gv_launcher_black' android/galaxy-viewer-9i/app/src/main/res/mipmap-anydpi-v26/gv_app_icon_10c.xml
          test "$(git hash-object android/galaxy-viewer-9i/app/src/main/res/drawable/gv_app_icon.png)" = "47b3e714053bfd64f835d3f1a2510e13618dbede"

      - name: Stage hash and upload APK
        shell: bash
        run: |
          set -euo pipefail
          cp android/galaxy-viewer-9i/app/build/outputs/apk/debug/app-debug.apk Galaxy-Viewer-10C.apk
          sha256sum Galaxy-Viewer-10C.apk | tee Galaxy-Viewer-10C.sha256
          cat /tmp/gv10c-audit.json

      - name: Upload 10C artifact
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Viewer-10C
          path: |
            Galaxy-Viewer-10C.apk
            Galaxy-Viewer-10C.sha256
          if-no-files-found: error

      - name: Publish immutable 10C release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.source_commit.outputs.source_commit }}
          SOURCE_BLOB: ${{ steps.source_commit.outputs.source_blob }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view galaxy-viewer-10c >/dev/null 2>&1; then echo '10C release already exists; refusing overwrite.' >&2; exit 1; fi
          gh release create galaxy-viewer-10c Galaxy-Viewer-10C.apk Galaxy-Viewer-10C.sha256 --target "$SOURCE_COMMIT" --title 'Galaxy Viewer 10C — Android' --notes "Standalone Galaxy Viewer 10C from frozen 10B blob 0e6121eaf299be8f12fc86a5e3058c91769b5edf. Changes only navigation accent blue-to-Hubble-orange-red, Hubble catalog to verified full-0006, 10C identity, and build-time adaptive launcher background black while preserving the icon foreground bytes. 10C source blob: $SOURCE_BLOB."
