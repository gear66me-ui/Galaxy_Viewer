name: Temporary audit remaining Catalog 0018 pseudonyms

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/temp-catalog-0018-audit-remaining.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
      - name: Build remaining pseudonym audit report
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0018.json')
          d=json.loads(p.read_text())
          out=[]
          for i,e in enumerate(d['entries'],1):
              dn=(e.get('displayName') or '').strip()
              des=(e.get('designation') or '').strip()
              title=(e.get('title') or '').strip()
              name=(e.get('name') or '').strip()
              reasons=[]
              if not dn: reasons.append('missing')
              if re.search(r'\d',dn): reasons.append('number')
              low=dn.lower()
              if 'hubble' in low: reasons.append('hubble')
              if 'image' in low: reasons.append('image')
              if des and des.lower() in low and dn.lower()!=des.lower(): reasons.append('designation_embedded')
              # catalog-like tokens inside display name
              if re.search(r'\b(?:NGC|IC|UGC|UGCA|MACS|RXC|RCS|Abell|ESO|SDSS|2XMM|PSZ|ACT-CL|IRAS|LMC)\b',dn,re.I): reasons.append('catalog_token')
              if len(dn.split())>8: reasons.append('over8')
              # rows already covered by prior audited set are omitted if currently acceptable
              if reasons:
                  out.append({'row':i,'archiveId':e.get('archiveId'),'designation':des,'displayName':dn,'title':title,'name':name,'sourceUrl':e.get('sourceUrl'),'reasons':sorted(set(reasons))})
          report={'totalEntries':len(d['entries']),'flaggedCount':len(out),'flagged':out}
          rp=Path('viewer/image-databases/Hubble/databases/catalog-0018-pseudonym-audit-remaining.json')
          rp.write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n')
          print('flagged',len(out),'of',len(d['entries']))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/image-databases/Hubble/databases/catalog-0018-pseudonym-audit-remaining.json
          git commit -m 'TEMP Catalog 0018 remaining pseudonym audit report'
          git push origin HEAD:beta
