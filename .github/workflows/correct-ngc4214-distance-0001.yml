name: Correct NGC 4214 distance to Hubble publication value
# Trigger run 2026-10-23: explicitly queue guarded NGC 4214 distance correction.
on:
  push:
    branches: [release]
    paths:
      - ".github/workflows/correct-ngc4214-distance-0001.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: correct-ngc4214-distance-0001
  cancel-in-progress: false
jobs:
  correct-distance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: release
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set NGC 4214 Hubble and NOIRLab records to 13 Mly
        run: |
          python3 - <<'PY'
          import json, csv
          from pathlib import Path

          catalog = Path("viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json")
          data = json.loads(catalog.read_text(encoding="utf-8"))
          targets = {
              ("hubble", "opo0001a"),
              ("noirlab", "noao-ngc4214"),
          }

          def walk(node, path="$"):
              if isinstance(node, dict):
                  yield node, path
                  for key, value in node.items():
                      if isinstance(value, (dict, list)):
                          yield from walk(value, f"{path}.{key}")
              elif isinstance(node, list):
                  for i, value in enumerate(node):
                      yield from walk(value, f"{path}[{i}]")

          def scalar_pairs(obj):
              return [(str(k).lower(), str(v).strip().lower())
                      for k, v in obj.items()
                      if isinstance(v, (str, int, float)) and not isinstance(v, bool)]

          nodes = list(walk(data))
          changed = []
          for provider, archive in sorted(targets):
              matches = []
              for obj, path in nodes:
                  pairs = scalar_pairs(obj)
                  vals = [v for _, v in pairs]
                  if not any(v == archive or v.endswith("/" + archive) for v in vals):
                      continue
                  if not any(provider == v or provider in v for k, v in pairs
                             if any(t in k for t in ("provider", "catalog", "source"))):
                      continue
                  key = next((k for k in obj if k.lower() in ("distancemly", "distance_mly")), None)
                  if key is not None:
                      matches.append((obj, path, key))
              matches = [(o,p,k) for o,p,k in matches
                         if not any(p.startswith(q + ".") or p.startswith(q + "[")
                                    for _,q,_ in matches if q != p)]
              if len(matches) != 1:
                  raise SystemExit(f"STOP: expected exactly one runtime record for {provider}/{archive}; found {len(matches)}. No catalog changes written.")
              obj, path, key = matches[0]
              old = obj[key]
              obj[key] = 13.0
              changed.append((provider, archive, path, key, old))

          catalog.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("Runtime JSON updated; redshift fields intentionally unchanged.")
          for provider, archive, path, key, old in changed:
              print(f"{provider}/{archive}: {old} -> 13.0 Mly at {path}.{key}")

          distance_map = Path("viewer/image-databases/master-database/avm-metadata/avm-runtime-distance-map-0004.csv")
          with distance_map.open(encoding="utf-8", newline="") as f:
              reader = csv.DictReader(f)
              fields = reader.fieldnames
              rows = list(reader)
          if not fields or not {"providerKey", "archiveId", "distanceMly"}.issubset(fields):
              raise SystemExit(f"Unexpected distance map columns: {fields}")
          for provider, archive in sorted(targets):
              found = [r for r in rows if r["providerKey"].strip().lower() == provider and r["archiveId"].strip().lower() == archive]
              if len(found) != 1:
                  raise SystemExit(f"STOP: expected exactly one distance-map row for {provider}/{archive}; found {len(found)}.")
              found[0]["distanceMly"] = "13"
          with distance_map.open("w", encoding="utf-8", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=fields, lineterminator="\n")
              writer.writeheader()
              writer.writerows(rows)
          print("PASS: Hubble opo0001a and NOIRLab noao-ngc4214 distance-map rows both equal 13 Mly.")
          PY
      - name: Validate and commit correction
        run: |
          python3 -m json.tool viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json >/dev/null
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json viewer/image-databases/master-database/avm-metadata/avm-runtime-distance-map-0004.csv
          if git diff --cached --quiet; then
            echo "No file changes required; requested values already present."
          else
            git commit -m "Correct NGC 4214 distance to 13 Mly"
            git push origin HEAD:release
          fi
