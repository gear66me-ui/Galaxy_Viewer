name: TEMP 10F dual-icon runtime repair

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/temp-10f-dual-icon-runtime-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Repair 0031 runtime layout guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('viewer/modules/gv-random-galaxy-0031.js')
          s=p.read_text()
          old="  if (!button.querySelector('.gvrg-random-star-wrap')) {"
          new="  const layoutReady=button.querySelector('.gvrg-random-layout .gvrg-random-star-wrap-left')&&button.querySelector('.gvrg-random-layout .gvrg-random-label')&&button.querySelector('.gvrg-random-layout .gvrg-random-star-wrap-right');\n  if (!layoutReady) {"
          assert s.count(old)==1, f'expected one old guard, found {s.count(old)}'
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add viewer/modules/gv-random-galaxy-0031.js
          git commit -m '10F repair dual-icon runtime layout detection'
          MODULE_COMMIT=$(git rev-parse HEAD)
          MODULE_BLOB=$(git hash-object viewer/modules/gv-random-galaxy-0031.js)
          echo "MODULE_COMMIT=$MODULE_COMMIT" >> "$GITHUB_ENV"
          echo "MODULE_BLOB=$MODULE_BLOB" >> "$GITHUB_ENV"

      - name: Repin frozen 10F to repaired 0031
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('viewer/GV-beta-0010F.py')
          s=p.read_text()
          pattern=r"const RANDOM_GALAXY_URL='https://raw\.githubusercontent\.com/gear66me-ui/Galaxy_Viewer/[0-9a-f]{40}/viewer/modules/gv-random-galaxy-0031\.js\?v=[0-9a-f]{40}';"
          repl=f"const RANDOM_GALAXY_URL='https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/{os.environ['MODULE_COMMIT']}/viewer/modules/gv-random-galaxy-0031.js?v={os.environ['MODULE_BLOB']}';"
          ns,n=re.subn(pattern,repl,s,count=1)
          assert n==1, f'expected one 10F module pin, found {n}'
          p.write_text(ns)
          PY
          git add viewer/GV-beta-0010F.py
          git commit -m '10F pin runtime-safe symmetric dual-icon module'
          VIEWER_BLOB=$(git hash-object viewer/GV-beta-0010F.py)
          echo "VIEWER_BLOB=$VIEWER_BLOB" >> "$GITHUB_ENV"

      - name: Refresh browser launcher 10F cache identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('mobile/beta/9I.html')
          s=p.read_text()
          pattern=r"const VIEWER_URL='\.\./\.\./viewer/GV-beta-0010F\.py\?v=10f-[0-9a-f]{40}';"
          repl=f"const VIEWER_URL='../../viewer/GV-beta-0010F.py?v=10f-{os.environ['VIEWER_BLOB']}';"
          s,n=re.subn(pattern,repl,s,count=1)
          assert n==1, f'expected one launcher 10F cache key, found {n}'
          old="fetch(VIEWER_URL,{cache:'force-cache'})"
          assert s.count(old)==1, f'expected one force-cache fetch, found {s.count(old)}'
          s=s.replace(old,"fetch(VIEWER_URL,{cache:'no-store'})",1)
          p.write_text(s)
          PY
          git add mobile/beta/9I.html
          git commit -m 'Bypass stale 10F browser cache after dual-icon repair'
          git push origin HEAD:beta
