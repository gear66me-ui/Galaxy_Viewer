name: Audit and Normalize AVM Runtime Distances

on:
  push:
    branches:
      - release
    paths:
      - '.github/workflows/audit-normalize-avm-runtime-distances.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: "audit reports discrepancies without edits; apply injects only unambiguous validated distances"
        required: true
        type: choice
        options:
          - audit
          - apply
        default: audit

permissions:
  contents: write

concurrency:
  group: avm-runtime-distance-normalization
  cancel-in-progress: false

jobs:
  normalize-distance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Audit six provider catalogs and optionally inject runtime distance
        env:
          MODE: ${{ inputs.mode || 'apply' }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          from collections import defaultdict

          ROOT = pathlib.Path(".")
          RUNTIME = ROOT / "viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0003.json"
          CATALOGS = {
              "Hubble": ROOT / "viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json",
              "JWST": ROOT / "viewer/image-databases/JWST/databases/gv-jwst-galaxies-full-0007-AVM-ESA-FOV.json",
              "ESO": ROOT / "viewer/image-databases/ESO/databases/gv-eso-galaxies-full-0001.json",
              "Chandra": ROOT / "viewer/image-databases/Chandra/databases/gv-chandra-galaxies-full-0007.json",
              "Spitzer": ROOT / "viewer/image-databases/Spitzer/databases/gv-spitzer-galaxies-full-0011.json",
              "NOIRLab": ROOT / "viewer/image-databases/NoirLab/databases/gv-noirlab-galaxies-full-0001.json",
          }
          MODE = os.environ.get("MODE", "audit")
          REPORT = ROOT / "avm-runtime-distance-audit.json"

          def load(path):
              if not path.is_file():
                  raise SystemExit(f"Required file missing: {path}")
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  raise SystemExit(f"Invalid JSON in {path}: {exc}")

          def records(node):
              if isinstance(node, dict):
                  # Catalog formats may wrap records in a provider-specific array.
                  for key, value in node.items():
                      if isinstance(value, list) and value and all(isinstance(x, dict) for x in value):
                          if any(any(k in x for k in ("science", "archiveId", "providerKey", "imageUrl", "ra", "dec")) for x in value):
                              yield from value
                  # A direct record object.
                  if any(k in node for k in ("archiveId", "providerKey", "imageUrl")):
                      yield node
              elif isinstance(node, list):
                  for item in node:
                      yield from records(item)

          def positive_number(value):
              if isinstance(value, bool) or value is None:
                  return None
              try:
                  n = float(value)
              except (TypeError, ValueError):
                  return None
              return n if n > 0 and n < 1e9 else None

          def canonical_source_distance(record):
              science = record.get("science")
              if not isinstance(science, dict):
                  return None
              # Strict source contract: do not silently fall back to distance aliases.
              return positive_number(science.get("distanceMly"))

          def text_value(record, keys):
              for key in keys:
                  value = record.get(key)
                  if value is not None and str(value).strip():
                      return str(value).strip()
              return ""

          def identity(record, provider):
              # Match only by explicit provider/archive identity. Never match by name alone.
              provider_key = text_value(record, ("providerKey", "provider", "survey", "catalogProvider"))
              archive_id = text_value(record, ("archiveId", "archive_id", "observationId", "obsid", "datasetId", "imageId", "id"))
              if not archive_id:
                  return None
              p = provider_key.upper().replace(" ", "")
              expected = provider.upper().replace(" ", "")
              if p and expected not in p and p not in expected:
                  return None
              return (expected, archive_id.casefold())

          def runtime_provider(record):
              return text_value(record, ("providerKey", "provider", "survey", "catalogProvider", "sourceCatalog"))

          def fov_status(record):
              x = positive_number(record.get("fovXDegrees"))
              y = positive_number(record.get("fovYDegrees"))
              if x and y:
                  return "ok_degrees"
              return "missing_or_invalid_axis_degrees"

          if MODE not in ("audit", "apply"):
              raise SystemExit(f"Unknown mode: {MODE}")

          runtime_data = load(RUNTIME)
          runtime_records = list(records(runtime_data))
          if not runtime_records:
              raise SystemExit("Could not locate runtime records; refusing to modify an unknown schema.")

          source_by_key = defaultdict(list)
          source_stats = {}
          source_objects = {}
          for provider, path in CATALOGS.items():
              data = load(path)
              source_records = list(records(data))
              valid = 0
              missing = 0
              ambiguous = 0
              for rec in source_records:
                  key = identity(rec, provider)
                  distance = canonical_source_distance(rec)
                  if distance is not None:
                      valid += 1
                  else:
                      missing += 1
                  if key:
                      source_by_key[key].append((provider, rec, distance, str(path)))
              for key, entries in source_by_key.items():
                  if key[0] == provider.upper().replace(" ", "") and len(entries) > 1:
                      ambiguous += 1
              source_stats[provider] = {
                  "path": str(path), "records_detected": len(source_records),
                  "valid_science_distanceMly": valid, "missing_invalid_or_nonpositive": missing,
                  "duplicate_provider_archive_keys": ambiguous,
              }
              source_objects[provider] = source_records

          runtime_stats = {
              "records_detected": len(runtime_records),
              "already_has_valid_top_level_distanceMly": 0,
              "matched_source_distance": 0,
              "missing_source_match": 0,
              "ambiguous_source_match": 0,
              "source_distance_missing": 0,
              "fov_axes_valid_degrees": 0,
              "fov_axes_invalid_or_missing": 0,
              "updates_planned_or_applied": 0,
          }
          issues = []
          updates = []
          seen_runtime = set()

          for rec in runtime_records:
              provider = runtime_provider(rec)
              # Provider names are normalized against the six source catalog labels.
              normalized = provider.upper().replace(" ", "")
              provider_name = next((p for p in CATALOGS if p.upper().replace(" ", "") in normalized or normalized in p.upper().replace(" ", "")), None)
              key = identity(rec, provider_name) if provider_name else None
              current = positive_number(rec.get("distanceMly"))
              if current:
                  runtime_stats["already_has_valid_top_level_distanceMly"] += 1
              if fov_status(rec) == "ok_degrees":
                  runtime_stats["fov_axes_valid_degrees"] += 1
              else:
                  runtime_stats["fov_axes_invalid_or_missing"] += 1
              if not key:
                  runtime_stats["missing_source_match"] += 1
                  issues.append({"kind":"runtime_identity_missing","provider":provider,"record":text_value(rec,("name","title","displayName"))})
                  continue
              if key in seen_runtime:
                  issues.append({"kind":"duplicate_runtime_key","provider":provider,"archiveId":key[1]})
              seen_runtime.add(key)
              matches = source_by_key.get(key, [])
              if len(matches) == 0:
                  runtime_stats["missing_source_match"] += 1
                  issues.append({"kind":"source_match_missing","provider":provider,"archiveId":key[1]})
                  continue
              if len(matches) != 1:
                  runtime_stats["ambiguous_source_match"] += 1
                  issues.append({"kind":"source_match_ambiguous","provider":provider,"archiveId":key[1],"match_count":len(matches)})
                  continue
              source_provider, source_rec, distance, source_path = matches[0]
              if distance is None:
                  runtime_stats["source_distance_missing"] += 1
                  issues.append({"kind":"canonical_source_distance_missing","provider":provider,"archiveId":key[1],"source":source_path})
                  continue
              runtime_stats["matched_source_distance"] += 1
              if current is not None and abs(current-distance) > max(0.01, distance*0.01):
                  issues.append({"kind":"runtime_source_distance_conflict","provider":provider,"archiveId":key[1],"runtime_distanceMly":current,"source_science_distanceMly":distance,"source":source_path})
              if current is None:
                  updates.append((rec, distance, provider, key[1], source_path))

          runtime_stats["updates_planned_or_applied"] = len(updates)
          report = {
              "schema":"gv-avm-runtime-distance-audit-0001",
              "mode":MODE,
              "canonical_source_field":"science.distanceMly",
              "canonical_unit":"Mly",
              "runtime_field":"distanceMly",
              "runtime_fov_fields":["fovXDegrees","fovYDegrees"],
              "runtime_fov_unit":"degrees",
              "provider_catalogs":source_stats,
              "runtime":runtime_stats,
              "issues":issues,
              "updates": [
                  {"provider":p,"archiveId":a,"distanceMly":d,"source":s}
                  for _,d,p,a,s in updates
              ],
          }

          # Apply mode is deliberately conservative: never overwrite an existing valid
          # runtime distance, never choose among ambiguous source records, never guess by name.
          if MODE == "apply":
              for rec, distance, provider, archive_id, source_path in updates:
                  rec["distanceMly"] = distance
              if updates:
                  RUNTIME.write_text(json.dumps(runtime_data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                  check = load(RUNTIME)
                  check_records = list(records(check))
                  if len(check_records) != len(runtime_records):
                      raise SystemExit("Runtime record count changed after write; refusing commit.")
                  for _, distance, provider, archive_id, _ in updates:
                      found = [r for r in check_records if identity(r, provider) == (provider.upper().replace(" ",""), archive_id.casefold()) and positive_number(r.get("distanceMly")) == distance]
                      if not found:
                          raise SystemExit(f"Post-write verification failed for {provider}/{archive_id}")
              elif not RUNTIME.exists():
                  raise SystemExit("Runtime missing after apply.")

          REPORT.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"mode":MODE,"provider_catalogs":source_stats,"runtime":runtime_stats,"issue_count":len(issues),"report":str(REPORT)},indent=2))
          PY

      - name: Validate JSON and show runtime diff
        run: |
          python3 -m json.tool viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0003.json >/dev/null
          python3 -m json.tool avm-runtime-distance-audit.json >/dev/null
          git diff --check
          git diff --stat
          git diff -- viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0003.json

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: avm-runtime-distance-audit
          path: avm-runtime-distance-audit.json
          if-no-files-found: error

      - name: Commit normalized runtime distances
        if: ${{ inputs.mode == 'apply' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0003.json
          if git diff --cached --quiet; then
            echo "No runtime distances were injected; audit report is still available as an artifact."
            exit 0
          fi
          git commit -m "Normalize validated distances in AVM runtime catalog"
          git push origin HEAD:release
