name: Audit and Normalize AVM Runtime Distances

on:
  push:
    branches: [release]
    paths:
      - '.github/workflows/audit-normalize-avm-runtime-distances.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: "audit reports only; apply updates the runtime catalog using reviewed corrections"
        required: true
        type: choice
        options: [audit, apply]
        default: audit

permissions:
  contents: write

concurrency:
  group: avm-runtime-distance-normalization
  cancel-in-progress: false

jobs:
  audit-and-correct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Audit all 1,847 runtime distances and apply reviewed corrections
        env:
          MODE: ${{ inputs.mode || 'audit' }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, math
          from collections import Counter, defaultdict

          ROOT = pathlib.Path(".")
          RUNTIME = ROOT / "viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0003.json"
          CATALOGS = {
              "hubble": ROOT / "viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json",
              "jwst": ROOT / "viewer/image-databases/JWST/databases/gv-jwst-galaxies-full-0007-AVM-ESA-FOV.json",
              "eso": ROOT / "viewer/image-databases/ESO/databases/gv-eso-galaxies-full-0001.json",
              "chandra": ROOT / "viewer/image-databases/Chandra/databases/gv-chandra-galaxies-full-0007.json",
              "spitzer": ROOT / "viewer/image-databases/Spitzer/databases/gv-spitzer-galaxies-full-0011.json",
              "noirlab": ROOT / "viewer/image-databases/NoirLab/databases/gv-noirlab-galaxies-full-0001.json",
          }
          MODE = os.environ.get("MODE", "audit").strip().lower()
          REPORT_PATH = ROOT / "avm-runtime-distance-audit.json"

          # Reviewed corrections from the current distance audit.
          # Einstein Cross uses the quasar host distance, not the foreground lens distance.
          REVIEWED = {
              "eso0847a": {"distanceMly": 16600.0, "object": "Einstein Cross (quasar host)", "basis": "reviewed override; z=1.695 host"},
              "eso2304a": {"distanceMly": 10600.0, "object": "Spiderweb Galaxy", "basis": "reviewed override; z~2.16 light-travel distance"},
              "eso0413a": {"distanceMly": 160.0, "object": "NGC 6769", "basis": "reviewed local-galaxy distance"},
              "eso0422a": {"distanceMly": None, "object": "K20 Field", "basis": "field, not a single galaxy; do not assign a fabricated single-object distance"},
              "eso0755a": {"distanceMly": 650.0, "object": "ESO 593-IG 008", "basis": "reviewed nearby-galaxy distance"},
              "eso0911a": {"distanceMly": 78.0, "object": "Arp 261", "basis": "reviewed nearby-galaxy distance"},
              "eso1724i": {"distanceMly": 125.0, "object": "ESO 338-4", "basis": "reviewed nearby-galaxy distance"},
              "eso1126a": {"distanceMly": 35.0, "object": "Leo Triplet", "basis": "reviewed local-group distance"},
              "potw1619a": {"distanceMly": 130.0, "object": "ESO 316-33", "basis": "reviewed nearby-galaxy distance"},
          }

          def load(path):
              if not path.is_file():
                  raise SystemExit(f"Required catalog missing: {path}")
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception as e:
                  raise SystemExit(f"Invalid JSON {path}: {e}")

          def get_records(obj):
              if isinstance(obj, dict):
                  if isinstance(obj.get("records"), list):
                      return [r for r in obj["records"] if isinstance(r, dict)]
                  for key in ("entries", "galaxies", "catalog", "items", "data"):
                      if isinstance(obj.get(key), list) and obj[key] and all(isinstance(r, dict) for r in obj[key]):
                          return obj[key]
              if isinstance(obj, list):
                  return [r for r in obj if isinstance(r, dict)]
              raise SystemExit("Unrecognized catalog schema; refusing to guess record collection.")

          def num(v):
              if isinstance(v, bool) or v is None:
                  return None
              try:
                  x = float(v)
              except (TypeError, ValueError):
                  return None
              return x if math.isfinite(x) and x > 0 else None

          def archive_id(r):
              for k in ("archiveId", "archive_id", "observationId", "datasetId", "imageId", "id"):
                  v = r.get(k)
                  if v is not None and str(v).strip():
                      return str(v).strip()
              return ""

          def provider_key(r):
              v = r.get("providerKey") or r.get("provider") or r.get("survey") or ""
              if not v:
                  src = str(r.get("sourceCatalog") or "").lower()
                  for p in CATALOGS:
                      if f"/{p}/" in src:
                          return p
              return str(v).strip().lower().replace(" ", "")

          def source_distance(r):
              s = r.get("science")
              return num(s.get("distanceMly")) if isinstance(s, dict) else None

          if MODE not in ("audit", "apply"):
              raise SystemExit(f"Unsupported mode {MODE}")

          runtime_data = load(RUNTIME)
          runtime = get_records(runtime_data)
          if len(runtime) != 1847:
              raise SystemExit(f"Expected exactly 1847 runtime records, found {len(runtime)}; no changes made.")

          sources = {}
          source_index = defaultdict(list)
          source_stats = {}
          for provider, path in CATALOGS.items():
              data = load(path)
              rows = get_records(data)
              sources[provider] = rows
              good = missing = 0
              for row in rows:
                  aid = archive_id(row)
                  d = source_distance(row)
                  good += d is not None
                  missing += d is None
                  if aid:
                      source_index[(provider, aid.casefold())].append((row, d, str(path)))
              source_stats[provider] = {
                  "path": str(path), "recordCount": len(rows),
                  "validScienceDistanceMly": good, "missingInvalidOrNonpositive": missing
              }

          counts = Counter()
          issues = []
          corrections = []
          seen = set()
          runtime_by_id = defaultdict(list)

          for r in runtime:
              aid = archive_id(r)
              provider = provider_key(r)
              if not aid:
                  counts["missingArchiveId"] += 1
                  issues.append({"type":"missing_archive_id","name":r.get("name")})
                  continue
              runtime_by_id[aid.casefold()].append(r)
              key = (provider, aid.casefold())
              if key in seen:
                  counts["duplicateProviderArchiveId"] += 1
                  issues.append({"type":"duplicate_runtime_identity","provider":provider,"archiveId":aid})
              seen.add(key)

              current = num(r.get("distanceMly"))
              counts["validRuntimeDistanceMly" if current is not None else "missingOrInvalidRuntimeDistanceMly"] += 1
              fx, fy = num(r.get("fovXDegrees")), num(r.get("fovYDegrees"))
              counts["validFovAxes" if fx is not None and fy is not None else "invalidFovAxes"] += 1

              # Match provider source by provider + archive ID only; never by name alone.
              source_matches = source_index.get((provider, aid.casefold()), [])
              if len(source_matches) == 1:
                  src, sd, srcpath = source_matches[0]
                  counts["matchedProviderSource"] += 1
                  if sd is None:
                      counts["sourceDistanceMissing"] += 1
                  elif current is not None and abs(current - sd) > max(0.01, sd * 0.01):
                      counts["runtimeSourceConflict"] += 1
                      issues.append({"type":"runtime_source_conflict","provider":provider,"archiveId":aid,"runtimeMly":current,"sourceScienceMly":sd,"source":srcpath})
              elif len(source_matches) == 0:
                  counts["noProviderSourceMatch"] += 1
                  issues.append({"type":"no_provider_source_match","provider":provider,"archiveId":aid})
              else:
                  counts["ambiguousProviderSourceMatch"] += 1
                  issues.append({"type":"ambiguous_provider_source_match","provider":provider,"archiveId":aid,"matchCount":len(source_matches)})

              override = REVIEWED.get(aid.casefold()) if provider == "eso" else None
              if override:
                  desired = override["distanceMly"]
                  if desired is None:
                      issues.append({"type":"non_single_object_distance_review","archiveId":aid,"object":override["object"],"currentMly":current,"action":"flagged; preserve numeric value pending a dedicated field/curation decision"})
                  elif current is None or abs(current-desired) > max(0.01, desired*0.001):
                      corrections.append({"archiveId":aid,"object":override["object"],"oldDistanceMly":current,"newDistanceMly":desired,"basis":override["basis"]})
                      if MODE == "apply":
                          r["distanceMly"] = desired
                  counts["reviewedOverrideFound"] += 1

              # Heuristic flags are diagnostic only; never auto-correct from a name regex.
              name = str(r.get("name") or "")
              if re.search(r"\b(NGC|IC|M\s*\d+|MESSIER|ARP)\b", name, re.I) and current and current > 1000:
                  counts["localDesignationOver1000MlyFlagged"] += 1
                  issues.append({"type":"local_designation_over_1000_mly_manual_review","provider":provider,"archiveId":aid,"name":name,"distanceMly":current})
              if current and current > 100000:
                  counts["extremeDistanceOver100000MlyFlagged"] += 1
                  issues.append({"type":"extreme_distance_over_100000_mly_manual_review","provider":provider,"archiveId":aid,"name":name,"distanceMly":current})

          for aid, rows in runtime_by_id.items():
              if len(rows) > 1 and aid not in REVIEWED:
                  counts["archiveIdRepeatedAcrossProviders"] += 1

          report = {
              "schema":"gv-avm-runtime-distance-audit-0002",
              "mode":MODE,
              "runtimePath":str(RUNTIME),
              "runtimeRecordCount":len(runtime),
              "sourceDistanceContract":"provider science.distanceMly in Mly; source/runtime disagreements are reported, never silently overwritten",
              "runtimeDistanceContract":"top-level distanceMly in Mly",
              "fovContract":{"fovXDegrees":"degrees","fovYDegrees":"degrees"},
              "providerCatalogs":source_stats,
              "counts":dict(counts),
              "reviewedCorrections":corrections,
              "issues":issues,
              "notes":[
                  "The audit does not treat a positive number as proof of astronomical correctness.",
                  "Heuristic outliers are flagged for review and are never automatically changed.",
                  "K20 Field is not a single galaxy; its distance is not automatically replaced with a galaxy distance.",
                  "Einstein Cross correction selects the quasar host; the foreground lens is a different object."
              ]
          }
          REPORT_PATH.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          if MODE == "apply":
              RUNTIME.write_text(json.dumps(runtime_data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              check = load(RUNTIME)
              checked = get_records(check)
              if len(checked) != 1847:
                  raise SystemExit("Post-write record-count validation failed.")
              check_by_id = defaultdict(list)
              for row in checked:
                  check_by_id[archive_id(row).casefold()].append(row)
              for aid, item in REVIEWED.items():
                  if item["distanceMly"] is not None:
                      hits = check_by_id.get(aid.casefold(), [])
                      if not hits or not any(provider_key(x) == "eso" and num(x.get("distanceMly")) == item["distanceMly"] for x in hits):
                          raise SystemExit(f"Post-write verification failed for {aid}")
              json.loads(RUNTIME.read_text(encoding="utf-8"))
              print("Applied reviewed distance corrections and verified JSON + 1,847 record count.")

          print(json.dumps({
              "mode":MODE,
              "runtimeRecordCount":len(runtime),
              "providerCatalogs":source_stats,
              "counts":dict(counts),
              "reviewedCorrections":corrections,
              "issueCount":len(issues),
              "report":str(REPORT_PATH)
          }, indent=2))
          PY

      - name: Validate JSON and diff
        run: |
          python3 -m json.tool viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0003.json >/dev/null
          python3 -m json.tool avm-runtime-distance-audit.json >/dev/null
          git diff --check
          git diff --stat

      - name: Upload full audit report
        uses: actions/upload-artifact@v4
        with:
          name: avm-runtime-distance-audit
          path: avm-runtime-distance-audit.json
          if-no-files-found: error

      - name: Commit runtime corrections
        if: ${{ inputs.mode == 'apply' || github.event_name == 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0003.json
          if git diff --cached --quiet; then
            echo "No runtime changes required."
            exit 0
          fi
          git commit -m "Correct reviewed distances in AVM runtime catalog"
          git push origin HEAD:release
