name: Repair NGC 1087 Runtime Catalog 0004
on:
  workflow_dispatch:
  push:
    branches: [release]
    paths:
      - ".github/workflows/repair-ngc1087-runtime-0004.yml"

permissions:
  contents: write

concurrency:
  group: repair-ngc1087-runtime-0004
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release
      - name: Correct NGC 1087 distance and published redshift
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json")
          raw = json.loads(path.read_text(encoding="utf-8"))

          target_distance = 73.25
          target_redshift = 0.005070
          aliases = ("ngc 1087", "ngc1087")

          def walk(node, parent_path="$"):
              if isinstance(node, dict):
                  yield node, parent_path
                  for key, value in node.items():
                      if isinstance(value, (dict, list)):
                          yield from walk(value, f"{parent_path}.{key}")
              elif isinstance(node, list):
                  for index, value in enumerate(node):
                      if isinstance(value, (dict, list)):
                          yield from walk(value, f"{parent_path}[{index}]")

          def text_values(obj):
              return [str(v).strip().casefold() for v in obj.values()
                      if isinstance(v, (str, int, float)) and not isinstance(v, bool)]

          nodes = list(walk(raw))
          candidates = []
          for obj, p in nodes:
              vals = text_values(obj)
              has_name = any(any(alias in v for alias in aliases) for v in vals)
              has_distance = any(k.casefold() in ("distancemly", "distance_mly") for k in obj)
              has_redshift = any(k.casefold() in ("redshift", "redshiftz", "z") for k in obj)
              if has_name and has_distance and has_redshift:
                  candidates.append((obj, p))

          # Keep only the deepest matching record objects, not their enclosing containers.
          candidates = [(o, p) for o, p in candidates
                        if not any(p != q and p.startswith(q + ".") or
                                   p != q and p.startswith(q + "[")
                                   for _, q in candidates)]
          if len(candidates) != 1:
              raise SystemExit(f"STOP: expected exactly one NGC 1087 record, found {len(candidates)}; catalog not written. Paths={[p for _,p in candidates]}")

          record, record_path = candidates[0]
          distance_key = next(k for k in record if k.casefold() in ("distancemly", "distance_mly"))
          redshift_key = next(k for k in record if k.casefold() in ("redshift", "redshiftz", "z"))
          before = {"distanceMly": record[distance_key], "redshift": record[redshift_key]}

          record[distance_key] = target_distance
          record[redshift_key] = target_redshift

          # Keep duplicated science metadata synchronized when present.
          science = record.get("science")
          if isinstance(science, dict):
              for key in science:
                  if key.casefold() in ("distancemly", "distance_mly"):
                      science[key] = target_distance
                  elif key.casefold() in ("redshift", "redshiftz", "z"):
                      science[key] = target_redshift
          # Preserve catalog schema; update method annotations only if those fields already exist.
          for key in list(record):
              if key.casefold() == "distancemethod":
                  record[key] = "FLRW comoving distance calculated from published redshift z=0.005070 using H0=67.6 km/s/Mpc, Omega_m=0.315, Omega_Lambda=0.685"
              elif key.casefold() == "redshiftmethod":
                  record[key] = "Published heliocentric redshift z=0.005070; verify reference frame when comparing with cosmological distances"

          encoded = json.dumps(raw, ensure_ascii=False, indent=2) + "\n"
          checked = json.loads(encoded)
          path.write_text(encoded, encoding="utf-8")

          # Read-after-write verification.
          persisted = json.loads(path.read_text(encoding="utf-8"))
          persisted_nodes = list(walk(persisted))
          matches = []
          for obj, p in persisted_nodes:
              vals = text_values(obj)
              if any(any(alias in v for alias in aliases) for v in vals):
                  dk = next((k for k in obj if k.casefold() in ("distancemly", "distance_mly")), None)
                  zk = next((k for k in obj if k.casefold() in ("redshift", "redshiftz", "z")), None)
                  if dk is not None and zk is not None and abs(float(obj[dk])-target_distance)<1e-9 and abs(float(obj[zk])-target_redshift)<1e-9:
                      matches.append((obj,p))
          if not matches:
              raise SystemExit("STOP: post-write verification failed for NGC 1087")
          print(json.dumps({
              "verified": True,
              "recordPath": record_path,
              "before": before,
              "after": {"distanceMly": target_distance, "redshift": target_redshift},
              "distanceModel": "flat Lambda-CDM comoving radial distance",
              "cosmology": {"H0_km_s_Mpc": 67.6, "Omega_m": 0.315, "Omega_Lambda": 0.685},
              "recordMatchesVerified": len(matches)
          }, indent=2))
          PY
      - name: Validate JSON and commit catalog
        run: |
          python3 -m json.tool viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json
          if git diff --cached --quiet; then
            echo "NGC 1087 already has the approved values; no catalog commit needed."
          else
            git commit -m "Correct NGC 1087 distance and redshift in AVM runtime 0004"
            git push origin HEAD:release
          fi
