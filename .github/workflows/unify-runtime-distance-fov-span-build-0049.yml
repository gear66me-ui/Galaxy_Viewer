name: Unify Runtime Distance-FOV Span (Build 0049)

on:
  push:
    branches:
      - release
    paths:
      - ".github/workflows/unify-runtime-distance-fov-span-build-0049.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gv-distance-fov-build-0049
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
      - name: Validate runtime catalog and Build 0048 source inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0003.json >/dev/null
          test -f viewer/RC-V1.0.0.8-BLD-0048.py
          test -f viewer/modules/destination-presentation/gv-destination-presentation-0055.js
          test -f viewer/gv-current-viewer.json
          python3 -m json.tool viewer/gv-current-viewer.json >/dev/null
          python3 -m json.tool release-manifest.json >/dev/null
          git diff --check
          echo "PASS: runtime JSON and Build 0048 inputs are present and parse cleanly."
