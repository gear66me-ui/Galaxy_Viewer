name: Recover Hubble 0002 Gemini review batch

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/recover-hubble-0002-gemini-jet.yml'

permissions:
  contents: read

jobs:
  review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CATALOG: viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0002.json
      EXPECTED_CATALOG_BLOB: 2642f81084deb211e4f18cc8bdd874a878f6e4f0
      GEMINI_MODEL: gemini-3.5-flash-lite
    steps:
      - name: Checkout exact beta baseline
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 1

      - name: Verify authorized baseline and select first 15 unresolved
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY:-}" || { echo 'GEMINI_API_KEY secret missing'; exit 1; }
          ACTUAL="$(git hash-object "$CATALOG")"
          test "$ACTUAL" = "$EXPECTED_CATALOG_BLOB" || { echo "Catalog blob mismatch: $ACTUAL"; exit 1; }
          python3 - <<'PY'
          import json, math, os, pathlib
          p=pathlib.Path(os.environ['CATALOG'])
          d=json.loads(p.read_text(encoding='utf-8'))
          entries=d['entries']
          def valid(e):
              ra=e.get('ra'); dec=e.get('dec')
              return isinstance(ra,(int,float)) and not isinstance(ra,bool) and isinstance(dec,(int,float)) and not isinstance(dec,bool) and math.isfinite(ra) and math.isfinite(dec) and 0 <= ra < 360 and -90 <= dec <= 90
          unresolved=[e for e in entries if not valid(e)]
          assert len(entries)==1879
          assert len({e.get('archiveId') for e in entries})==1879
          assert len(unresolved)==152
          selected=unresolved[:15]
          assert len(selected)==15
          keep=('archiveId','name','title','designation','sourceUrl','imageType','credit','description','caption')
          compact=[]
          for e in selected:
              row={}
              for k in keep:
                  v=e.get(k)
                  if v is not None and str(v).strip(): row[k]=v
              compact.append(row)
          pathlib.Path('/tmp/hubble15.json').write_text(json.dumps(compact,ensure_ascii=False),encoding='utf-8')
          print('BASELINE_PASS total=1879 resolved=1727 unresolved=152 selected=15')
          print('SELECTED_IDS='+','.join(e['archiveId'] for e in selected))
          PY

      - name: Query Gemini once for exactly 15 records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, urllib.error, urllib.request
          key=os.environ['GEMINI_API_KEY']
          model=os.environ['GEMINI_MODEL']
          records=json.loads(pathlib.Path('/tmp/hubble15.json').read_text(encoding='utf-8'))
          assert len(records)==15
          instructions=[
              'You are doing forensic astronomical catalog research for ESA/Hubble archive records.',
              'Research each of the 15 supplied records using Google Search when useful.',
              'Return JSON only, with top-level key records and exactly 15 results in the same archiveId order.',
              'For each result return: archiveId, galaxy_name, canonical_target, aliases, right_ascension, declination, constellation, classification, confidence, evidence.',
              'classification must be POSITIONAL, NON_POSITIONAL, or UNRESOLVED.',
              'POSITIONAL means a real celestial object, cluster, or named sky field with a defensible sky position.',
              'NON_POSITIONAL means artwork, concept, diagram, mission image, multi-object composition, or material with no single defensible sky position.',
              'UNRESOLVED means evidence is insufficient.',
              'Do not invent coordinates or identity.',
              'Prefer exact astronomical catalog identifiers such as NGC, IC, Messier, UGC, PGC, Abell, MACS, SDSS, 2MASS, RXJ, SpARCS, or a specific named survey field.',
              'right_ascension and declination may be null when unsupported.',
              'constellation may be null when unsupported.',
              'evidence must concisely explain why the proposed identity is associated with this Hubble record.',
              'Do not use Hubble, Webb, NASA, ESA, galaxy, image, or a constellation name alone as canonical_target.'
          ]
          prompt='\n'.join(instructions)+'\nINPUT:\n'+json.dumps(records,ensure_ascii=False)
          url=f'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent'
          body={
              'contents':[{'parts':[{'text':prompt}]}],
              'tools':[{'google_search':{}}],
              'generationConfig':{'temperature':0.0,'maxOutputTokens':8000},
          }
          req=urllib.request.Request(url,data=json.dumps(body).encode('utf-8'),method='POST',headers={'Content-Type':'application/json','x-goog-api-key':key})
          try:
              with urllib.request.urlopen(req,timeout=180) as r:
                  resp=json.loads(r.read().decode('utf-8'))
          except urllib.error.HTTPError as exc:
              detail=exc.read().decode('utf-8','replace')
              raise SystemExit(f'GEMINI_HTTP_{exc.code}: {detail[:2000]}')
          cand=(resp.get('candidates') or [{}])[0]
          text=''.join(p.get('text','') for p in ((cand.get('content') or {}).get('parts') or []))
          cleaned=text.strip()
          cleaned=re.sub(r'^```(?:json)?\s*','',cleaned,flags=re.I)
          cleaned=re.sub(r'\s*```$','',cleaned)
          a=cleaned.find('{'); b=cleaned.rfind('}')
          if a<0 or b<a: raise SystemExit('Gemini returned no JSON object')
          payload=json.loads(cleaned[a:b+1])
          got=payload.get('records') or []
          expected=[r['archiveId'] for r in records]
          if len(got)!=15: raise SystemExit(f'Expected 15 Gemini results, got {len(got)}')
          if [x.get('archiveId') for x in got] != expected: raise SystemExit('Gemini archiveId/order mismatch')
          md=cand.get('groundingMetadata') or {}
          sources=[]; seen=set()
          for ch in md.get('groundingChunks') or []:
              web=(ch or {}).get('web') or {}
              uri=web.get('uri')
              if uri and uri not in seen:
                  seen.add(uri); sources.append({'url':uri,'title':web.get('title')})
          print('GEMINI_BATCH15_RESULT='+json.dumps(payload,ensure_ascii=False,separators=(',',':')))
          print('GEMINI_BATCH15_SOURCES='+json.dumps(sources[:40],ensure_ascii=False,separators=(',',':')))
          print('REVIEW_ONLY_PASS results=15 catalog_write=false api_calls=1')
          PY

      - name: Confirm catalog untouched
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git hash-object "$CATALOG")"
          test "$ACTUAL" = "$EXPECTED_CATALOG_BLOB" || { echo "Catalog changed unexpectedly: $ACTUAL"; exit 1; }
          test -z "$(git status --porcelain -- "$CATALOG")" || { echo 'Catalog working tree changed unexpectedly'; exit 1; }
          echo "CATALOG_UNCHANGED blob=$ACTUAL"
