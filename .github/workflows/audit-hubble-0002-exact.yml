name: Audit Hubble 0002 exact
on:
  push:
    paths:
      - '.github/workflows/audit-hubble-0002-exact.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
      - name: Exact audit
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, re, math
          p=pathlib.Path('viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0002.json')
          E=json.loads(p.read_text())['entries']
          def present(v): return v is not None and (not isinstance(v,str) or bool(v.strip()))
          def num(v): return isinstance(v,(int,float)) and not isinstance(v,bool) and math.isfinite(v)
          def usable_distance(e):
              v=e.get('science',{}).get('distanceMly')
              if num(v) and v>0: return True
              s=e.get('distance')
              if not isinstance(s,str): return False
              m=re.search(r'([0-9]+(?:\.[0-9]+)?)\s*(million|billion)?\s*light',s,re.I)
              return bool(m and float(m.group(1))>0)
          def usable_fov(e):
              s=e.get('fieldOfView')
              if not isinstance(s,str): return False
              nums=re.findall(r'([0-9]+(?:\.[0-9]+)?)',s)
              return len(nums)>=1 and all(float(x)>0 for x in nums[:2])
          def usable_size(e):
              v=e.get('science',{}).get('sizeKly')
              return isinstance(v,list) and len(v)>=2 and all(num(x) and x>0 for x in v[:2])
          def age(e):
              s=e.get('science',{})
              return (num(s.get('ageGyr')) and s['ageGyr']>=0) or (num(s.get('ageMinGyr')) and num(s.get('ageMaxGyr'))) or present(s.get('ageDisplay'))
          total=len(E)
          ud=sum(usable_distance(e) for e in E)
          uf=sum(usable_fov(e) for e in E)
          us=sum(usable_size(e) for e in E)
          both=sum(usable_distance(e) and usable_fov(e) for e in E)
          miss=[e for e in E if not usable_size(e)]
          print('TOTAL',total)
          print('NAME',sum(present(e.get('name')) for e in E))
          print('TITLE',sum(present(e.get('title')) for e in E))
          print('IMAGE_URL',sum(present(e.get('selectedImageUrl')) for e in E))
          print('PIXEL_SIZE',sum(present(e.get('pixelSize')) for e in E))
          print('RA_DEC',sum(num(e.get('ra')) and num(e.get('dec')) for e in E))
          print('CONSTELLATION',sum(present(e.get('constellation')) for e in E))
          print('DISTANCE_USABLE',ud)
          print('FOV_USABLE',uf)
          print('DISTANCE_AND_FOV',both)
          print('SIZE_USABLE',us)
          print('AGE_USABLE',sum(age(e) for e in E))
          print('MISSING_SIZE',len(miss))
          print('MISSING_SIZE_WITH_DISTANCE',sum(usable_distance(e) for e in miss))
          print('MISSING_SIZE_WITH_FOV',sum(usable_fov(e) for e in miss))
          print('MISSING_SIZE_WITH_DISTANCE_AND_FOV',sum(usable_distance(e) and usable_fov(e) for e in miss))
          print('MISSING_SIZE_NO_DISTANCE',sum(not usable_distance(e) for e in miss))
          print('MISSING_SIZE_NO_FOV',sum(not usable_fov(e) for e in miss))
          print('MISSING_SIZE_NEITHER',sum((not usable_distance(e)) and (not usable_fov(e)) for e in miss))
          print('DISTANCE_TEXT',sum(present(e.get('distance')) for e in E))
          print('DISTANCE_MLY',sum(num(e.get('science',{}).get('distanceMly')) and e['science']['distanceMly']>0 for e in E))
          print('FIELD_OF_VIEW_RAW',sum(present(e.get('fieldOfView')) for e in E))
          print('SIZE_KLY_RAW',sum(isinstance(e.get('science',{}).get('sizeKly'),list) for e in E))
          PY
