name: Render Earth Pointer Final PNG

on:
  push:
    branches: [release]
    paths:
      - '.github/workflows/render-earth-pointer-final-20261004.yml'

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Build exact browser renderer
        shell: bash
        run: |
          mkdir -p temporary-demos/earth-pointer-final-0001
          cat > temporary-demos/earth-pointer-final-0001/render-309.html <<'HTML'
          <!doctype html>
          <html>
          <head>
          <meta charset="utf-8">
          <style>
          @font-face{
            font-family:"GV Space Age";
            src:url("../../viewer/artwork/Fonts/Space%20Age%20Regular%20GV-9/Space%20Age%20GV-9A.otf") format("opentype");
            font-weight:400;
            font-style:normal;
            font-display:block;
          }
          html,body{margin:0;width:270px;height:270px;overflow:hidden;background:transparent}
          svg{display:block;width:270px;height:270px;overflow:visible}
          </style>
          </head>
          <body>
          <svg viewBox="0 0 270 270" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="yellowGlowPointer" x="-80%" y="-80%" width="260%" height="260%">
                <feGaussianBlur stdDeviation="1.3" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
              <filter id="yellowGlowText" x="-80%" y="-80%" width="260%" height="260%">
                <feGaussianBlur stdDeviation="1.0" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>

            <!-- Exact Lab 0008 accepted screenshot settings:
                 bearing 309, font 9.75, gap 3.25,
                 Earth radial +1.75, pointer radial 0.00.
                 Pointer base R=118.76, tip R=128.714.
                 Earth outer R=112.51, center R=107.05. -->
            <g transform="rotate(309 135 135)">
              <polygon
                points="129.375,16.24 140.625,16.24 135,6.286"
                fill="#FFD84A"
                filter="url(#yellowGlowPointer)"/>

              <text x="116.3112587734" y="29.5939591325"
                    font-family="GV Space Age" font-size="9.75" font-weight="400"
                    text-anchor="middle" dominant-baseline="middle"
                    fill="#FFD84A" filter="url(#yellowGlowText)"
                    transform="rotate(-10.0541916689 116.3112587734 29.5939591325)">E</text>

              <text x="125.6195462494" y="28.3617817692"
                    font-family="GV Space Age" font-size="9.75" font-weight="400"
                    text-anchor="middle" dominant-baseline="middle"
                    fill="#FFD84A" filter="url(#yellowGlowText)"
                    transform="rotate(-5.0270958344 125.6195462494 28.3617817692)">A</text>

              <text x="135" y="27.95"
                    font-family="GV Space Age" font-size="9.75" font-weight="400"
                    text-anchor="middle" dominant-baseline="middle"
                    fill="#FFD84A" filter="url(#yellowGlowText)">R</text>

              <text x="144.3804537506" y="28.3617817692"
                    font-family="GV Space Age" font-size="9.75" font-weight="400"
                    text-anchor="middle" dominant-baseline="middle"
                    fill="#FFD84A" filter="url(#yellowGlowText)"
                    transform="rotate(5.0270958344 144.3804537506 28.3617817692)">T</text>

              <text x="153.6887412266" y="29.5939591325"
                    font-family="GV Space Age" font-size="9.75" font-weight="400"
                    text-anchor="middle" dominant-baseline="middle"
                    fill="#FFD84A" filter="url(#yellowGlowText)"
                    transform="rotate(10.0541916689 153.6887412266 29.5939591325)">H</text>
            </g>
          </svg>
          <script>
          document.fonts.ready.then(()=>document.documentElement.dataset.ready="1");
          </script>
          </body>
          </html>
          HTML

          # Canonical NORTH rotor version for the app to rotate dynamically.
          sed 's/rotate(309 135 135)/rotate(0 135 135)/'             temporary-demos/earth-pointer-final-0001/render-309.html             > temporary-demos/earth-pointer-final-0001/render-north.html

      - name: Render with Chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found"
            exit 1
          fi
          echo "Using $CHROME"

          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/earth-render-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1

          COMMON_FLAGS=(
            --headless=new
            --no-sandbox
            --disable-gpu
            --hide-scrollbars
            --force-device-scale-factor=1
            --default-background-color=00000000
            --window-size=270,270
            --virtual-time-budget=3000
          )

          "$CHROME" "${COMMON_FLAGS[@]}"             --screenshot="temporary-demos/earth-pointer-final-0001/earth-pointer-yellow-bearing-309-270.png"             "http://127.0.0.1:8765/temporary-demos/earth-pointer-final-0001/render-309.html"

          "$CHROME" "${COMMON_FLAGS[@]}"             --screenshot="temporary-demos/earth-pointer-final-0001/earth-pointer-yellow-north-270.png"             "http://127.0.0.1:8765/temporary-demos/earth-pointer-final-0001/render-north.html"

          python3 - <<'PY'
          from PIL import Image
          p="temporary-demos/earth-pointer-final-0001/earth-pointer-yellow-bearing-309-270.png"
          im=Image.open(p).convert("RGBA")
          assert im.size==(270,270), im.size
          bbox=im.getchannel("A").getbbox()
          assert bbox is not None
          pad=4
          l,t,r,b=bbox
          l=max(0,l-pad);t=max(0,t-pad);r=min(270,r+pad);b=min(270,b+pad)
          im.crop((l,t,r,b)).save("temporary-demos/earth-pointer-final-0001/earth-pointer-yellow-bearing-309-tight.png")
          print("309 bbox",bbox)
          print("tight",(l,t,r,b))
          PY

      - name: Commit browser-rendered PNGs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temporary-demos/earth-pointer-final-0001/
          if git diff --cached --quiet; then
            echo "No PNG changes to commit"
          else
            git commit -m "Render exact browser yellow Earth pointer PNG"
            git push origin HEAD:release
          fi
