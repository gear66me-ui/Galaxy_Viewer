name: Render Crisp Earth Pointer PNG

on:
  push:
    branches: [release]
    paths:
      - '.github/workflows/render-earth-pointer-final-20261004.yml'

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Render crisp high-density pointer
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import math, os

          OUT = "viewer/artwork/compass/gv-earth-pointer-yellow-final-1080-crisp.png"
          FONT = "viewer/artwork/Fonts/Space Age Regular GV-9/Space Age GV-9A.otf"

          # Exact accepted Lab 0009 geometry.
          SCALE = 4
          SIZE = 270
          C = 135.0
          RING_R = 114.26
          PTR_W = 11.25
          PTR_D = 9.954
          PTR_BASE_R = 118.76
          PTR_TIP_R = 128.714

          FONT_PX = 9.75
          LETTER_GAP = 2.00
          EARTH_OUTER_ZERO = 110.76
          EARTH_RADIAL = 2.75
          EARTH_OUTER_R = EARTH_OUTER_ZERO + EARTH_RADIAL  # 113.51
          EARTH_CENTER_R = EARTH_OUTER_R - FONT_PX * 0.56

          YELLOW = (255, 216, 74, 255)

          canvas = Image.new("RGBA", (SIZE*SCALE, SIZE*SCALE), (0,0,0,0))
          draw = ImageDraw.Draw(canvas)
          font = ImageFont.truetype(FONT, round(FONT_PX*SCALE))

          # Pointer: hard-edged solid RGBA, no glow.
          half = PTR_W/2
          pts = [
              ((C-half)*SCALE, (C-PTR_BASE_R)*SCALE),
              ((C+half)*SCALE, (C-PTR_BASE_R)*SCALE),
              (C*SCALE, (C-PTR_TIP_R)*SCALE),
          ]
          draw.polygon(pts, fill=YELLOW)

          # EARTH: five exact Space Age glyphs, solid yellow, no blur/glow.
          pitch = FONT_PX*0.63 + LETTER_GAP
          step = pitch / EARTH_CENTER_R
          chars = list("EARTH")
          start = -math.pi/2 - step*(len(chars)-1)/2

          for i,ch in enumerate(chars):
              theta = start + i*step
              x = C + EARTH_CENTER_R*math.cos(theta)
              y = C + EARTH_CENTER_R*math.sin(theta)
              rot_deg = math.degrees(theta + math.pi/2)

              tile = Image.new("RGBA", (80*SCALE,80*SCALE), (0,0,0,0))
              td = ImageDraw.Draw(tile)
              bbox = td.textbbox((0,0), ch, font=font)
              tw,th = bbox[2]-bbox[0], bbox[3]-bbox[1]
              pos = ((tile.width-tw)/2-bbox[0], (tile.height-th)/2-bbox[1])
              td.text(pos, ch, font=font, fill=YELLOW)

              # Match browser y-down SVG rotation.
              tile = tile.rotate(-rot_deg, resample=Image.Resampling.BICUBIC, expand=False)
              px = int(round(x*SCALE - tile.width/2))
              py = int(round(y*SCALE - tile.height/2))
              canvas.alpha_composite(tile, (px,py))

          # Keep native 1080x1080. Browser displays it at 270 CSS px for 4× source density.
          canvas.save(OUT, optimize=True)

          alpha = canvas.getchannel("A")
          print("Rendered", OUT)
          print("size", canvas.size)
          print("alpha extrema", alpha.getextrema())
          print("pointer base radius", PTR_BASE_R)
          print("pointer tip radius", PTR_TIP_R)
          print("earth outer radius", EARTH_OUTER_R)
          print("NO GLOW / NO BLUR / NO OPACITY REDUCTION")
          PY

      - name: Commit crisp asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/artwork/compass/gv-earth-pointer-yellow-final-1080-crisp.png
          if git diff --cached --quiet; then
            echo "No asset change"
          else
            git commit -m "Render crisp high-density Earth pointer"
            git push origin HEAD:release
          fi
