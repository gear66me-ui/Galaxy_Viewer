name: Repair NGC 2336 Distance and FLRW Redshift in AVM Runtime Catalog 0006
on:
  push:
    branches: [release]
    paths:
      - ".github/workflows/repair-ngc2336-distance-redshift-0006.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repair-ngc2336-distance-redshift-0006
  cancel-in-progress: false
jobs:
  repair-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: release
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Correct NGC 2336 and derive flat Lambda-CDM redshift
        run: |
          python3 - <<'PY'
          import json, math
          from pathlib import Path

          path = Path("viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0006.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          target_mly = 100.0
          target_mpc = target_mly / 3.26156
          H0, omega_m, c = 67.6, 0.315, 299792.458
          omega_l = 1.0 - omega_m

          def luminosity_distance_mpc(z):
              n = 4000
              h = z / n
              total = 1.0 + 1.0 / math.sqrt(omega_m * (1+h)**3 + omega_l)
              for i in range(1, n):
                  x = i*h
                  f = 1.0 / math.sqrt(omega_m * (1+x)**3 + omega_l)
                  total += (4 if i % 2 else 2) * f
              integral = total * h / 3.0
              return (c / H0) * (1+z) * integral

          lo, hi = 0.0, 0.1
          for _ in range(100):
              mid = (lo + hi) / 2
              if luminosity_distance_mpc(mid) < target_mpc:
                  lo = mid
              else:
                  hi = mid
          z = (lo + hi) / 2

          def walk(node, p="$"):
              if isinstance(node, dict):
                  yield node, p
                  for k, v in node.items():
                      if isinstance(v, (dict, list)):
                          yield from walk(v, f"{p}.{k}")
              elif isinstance(node, list):
                  for i, v in enumerate(node):
                      yield from walk(v, f"{p}[{i}]")

          records = list(walk(data))
          matches = []
          for obj, p in records:
              vals = [str(v).strip().lower() for v in obj.values()
                      if isinstance(v, (str, int, float)) and not isinstance(v, bool)]
              if not any(v in ("ngc 2336", "ngc2336") for v in vals):
                  continue
              dk = next((k for k in obj if k.lower() in ("distancemly", "distance_mly")), None)
              zk = next((k for k in obj if k.lower() in ("redshift", "redshiftz")), None)
              if dk and zk:
                  matches.append((obj, p, dk, zk))

          # Keep only outermost matching records to avoid editing the same record via nested aliases.
          matches = [(o,p,dk,zk) for o,p,dk,zk in matches
                     if not any(p.startswith(q + ".") or p.startswith(q + "[")
                                for _,q,_,_ in matches if q != p)]
          if not matches:
              raise SystemExit("STOP: no NGC 2336 records with distance/redshift fields found; catalog unchanged.")

          updated = []
          for obj, p, dk, zk in matches:
              old_d, old_z = obj[dk], obj[zk]
              obj[dk] = round(target_mly, 6)
              obj[zk] = round(z, 8)
              for k in list(obj):
                  if k.lower() == "sciencedistancemly":
                      obj[k] = round(target_mly, 6)
              updated.append((p, old_d, old_z))

          encoded = json.dumps(data, ensure_ascii=False, indent=2) + "\n"
          json.loads(encoded)
          path.write_text(encoded, encoding="utf-8")
          print(f"Updated {len(updated)} NGC 2336 record(s)")
          for p, old_d, old_z in updated:
              print(f"{p}: distance {old_d} -> {target_mly:.6f} Mly; redshift {old_z} -> {z:.8f}")
          print(f"Approved source distance: {target_mly:.6f} Mly = {target_mpc:.6f} Mpc")
          print(f"Flat Lambda-CDM: H0={H0}, Omega_m={omega_m}; derived luminosity-distance redshift z={z:.8f}")
          print("JSON serialization validation passed.")
          PY
      - name: Validate and commit repaired catalog
        run: |
          python3 -m json.tool viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0006.json >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0006.json
          if git diff --cached --quiet; then
            echo "No catalog changes were needed."
          else
            git commit -m "Correct NGC 2336 distance to 100 Mly and derive FLRW redshift"
            git push origin HEAD:release
          fi
