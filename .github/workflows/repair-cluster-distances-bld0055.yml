name: One-time BLD-0055 Earth pointer and cluster distance repair
on:
  push:
    branches:
      - release
permissions:
  contents: write
jobs:
  repair:
    if: contains(github.event.head_commit.message, 'Activate build 0055')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Correct exact Hubble source and runtime records
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          hubble_path = Path("viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json")
          runtime_path = Path("viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json")
          map_path = Path("viewer/image-databases/master-database/avm-metadata/avm-runtime-distance-map-0004.csv")

          def update_object_blocks(text, id_updates):
              for archive_id, updater in id_updates.items():
                  marker = '"archiveId": "' + archive_id + '"'
                  idx = text.find(marker)
                  if idx < 0:
                      raise RuntimeError("Missing archive ID: " + archive_id)
                  start = text.rfind("\n    {", 0, idx)
                  if start < 0:
                      raise RuntimeError("Cannot locate record start: " + archive_id)
                  depth = 0
                  quoted = escaped = False
                  end = -1
                  for pos in range(start + 5, len(text)):
                      ch = text[pos]
                      if quoted:
                          if escaped:
                              escaped = False
                          elif ch == "\\":
                              escaped = True
                          elif ch == '"':
                              quoted = False
                          continue
                      if ch == '"':
                          quoted = True
                      elif ch == "{":
                          depth += 1
                      elif ch == "}":
                          depth -= 1
                          if depth == 0:
                              end = pos + 1
                              break
                  if end < 0:
                      raise RuntimeError("Cannot locate record end: " + archive_id)
                  old_block = text[start:end]
                  record = json.loads(old_block.strip().rstrip(","))
                  updater(record)
                  dumped = json.dumps(record, ensure_ascii=False, indent=2)
                  new_block = "\n" + "\n".join("    " + line for line in dumped.splitlines())
                  text = text[:start] + new_block + text[end:]
              return text

          hubble = hubble_path.read_text(encoding="utf-8")
          hdata = json.loads(hubble)
          def patch_hubble(archive_id, distance, distance_display, z):
              def update(record):
                  if record.get("archiveId") != archive_id:
                      raise RuntimeError("Archive ID mismatch in source record")
                  science = record.get("science", {})
                  expected = {
                      "heic1111a": 298085.408042,
                      "heic1506c": 298085.408042,
                      "potw1319a": 308716.98717,
                  }[archive_id]
                  current_distance = float(science.get("distanceMly", -1))
                  if abs(current_distance - expected) > 0.01 and abs(current_distance - distance) > 0.01:
                      raise RuntimeError(f"Unexpected source distance for {archive_id}: {science.get('distanceMly')}")
                  science["distanceMly"] = distance
                  science["distanceMethod"] = f"FLRW_comoving_radial_distance_flat_lcdm_H0_67.6_Om_0.315_from_z_{z:.3f}"
                  science["distanceDisplay"] = distance_display
                  science["redshift"] = z
                  science["redshiftDisplay"] = f"z={z:.3f}"
                  science["redshiftEstimated"] = False
                  science["redshiftMethod"] = "ESA_Hubble_authoritative_redshift"
                  record["science"] = science
                  record["distance"] = distance_display
              return update
          h_updates = {
              "heic1111a": patch_hubble("heic1111a", 4119.1906, "4.119 billion light-years", 0.308),
              "heic1506c": patch_hubble("heic1506c", 4119.1906, "4.119 billion light-years", 0.308),
              "potw1319a": patch_hubble("potw1319a", 4168.209233, "4.168 billion light-years", 0.312),
          }
          hubble = update_object_blocks(hubble, h_updates)
          hdata = json.loads(hubble)
          assert len(hdata["entries"]) == 1103
          for archive_id, distance, z in [("heic1111a", 4119.1906, .308), ("heic1506c", 4119.1906, .308), ("potw1319a", 4168.209233, .312)]:
              record = next(r for r in hdata["entries"] if r["archiveId"] == archive_id)
              assert abs(record["science"]["distanceMly"] - distance) < 1e-6 and record["science"]["redshift"] == z
          hubble_path.write_text(hubble, encoding="utf-8")

          runtime = runtime_path.read_text(encoding="utf-8")
          rdata = json.loads(runtime)
          def patch_runtime(archive_id, old_distance, new_distance, z):
              def update(record):
                  if record.get("archiveId") != archive_id:
                      raise RuntimeError("Archive ID mismatch in runtime record")
                  current_distance = float(record.get("distanceMly", -1))
                  current_z = float(record.get("redshift", -1))
                  old_record = abs(current_distance - old_distance) <= 0.01 and current_z == 100
                  already_correct = abs(current_distance - new_distance) <= 0.01 and current_z == z
                  if not (old_record or already_correct):
                      raise RuntimeError(f"Unexpected runtime values for {archive_id}: {record.get('distanceMly')}, z={record.get('redshift')}")
                  record["distanceMly"] = new_distance
                  record["redshift"] = z
              return update
          r_updates = {
              "heic1111a": patch_runtime("heic1111a", 298085.408, 4119.1906, .308),
              "heic1506c": patch_runtime("heic1506c", 298085.408, 4119.1906, .308),
              "potw1319a": patch_runtime("potw1319a", 308716.9872, 4168.209233, .312),
          }
          runtime = update_object_blocks(runtime, r_updates)
          rdata = json.loads(runtime)
          assert len(rdata["records"]) == 1847
          for archive_id, distance, z in [("heic1111a", 4119.1906, .308), ("heic1506c", 4119.1906, .308), ("potw1319a", 4168.209233, .312)]:
              record = next(r for r in rdata["records"] if r["archiveId"] == archive_id)
              assert abs(record["distanceMly"] - distance) < 1e-6 and record["redshift"] == z
          runtime_path.write_text(runtime, encoding="utf-8")

          lines = map_path.read_text(encoding="utf-8").splitlines()
          map_updates = {
              "heic1111a": ("298085.408042", "4119.1906"),
              "heic1506c": ("298085.408042", "4119.1906"),
              "potw1319a": ("308716.98717", "4168.209233"),
          }
          for archive_id, (old_value, new_value) in map_updates.items():
              matches = [i for i, line in enumerate(lines) if f",{archive_id}," in line]
              if len(matches) != 1:
                  raise RuntimeError(f"Expected one distance-map row for {archive_id}; found {len(matches)}")
              i = matches[0]
              if lines[i].endswith("," + old_value):
                  lines[i] = lines[i][:-len(old_value)] + new_value
              elif not lines[i].endswith("," + new_value):
                  raise RuntimeError(f"Unexpected distance-map value for {archive_id}: {lines[i]")
          map_path.write_text("\r\n".join(lines) + "\r\n", encoding="utf-8")

          print("Verified 1847 runtime records; corrected Abell 2744 heic1111a/heic1506c and Abell S1077 potw1319a.")
          PY
      - name: Commit exact corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json viewer/image-databases/master-database/avm-metadata/avm-runtime-distance-map-0004.csv
          if git diff --cached --quiet; then
            echo "No catalog changes were needed."
          else
            git commit -m "Correct Abell 2744 and Abell S1077 distances [skip ci]"
            git pull --rebase origin release
            git push origin HEAD:release
          fi
