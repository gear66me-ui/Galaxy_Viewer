name: TEMP 10F Shift Random Galaxy Group Right

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/temp-10f-shift-random-group-right.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Patch module only
        shell: bash
        run: |
          set -euo pipefail
          MOD='viewer/modules/gv-random-galaxy-0031.js'
          VIEW='viewer/GV-beta-0010F.py'
          BEFORE_VIEW=$(git hash-object "$VIEW")
          python - <<'PY'
          from pathlib import Path
          p=Path('viewer/modules/gv-random-galaxy-0031.js')
          s=p.read_text(encoding='utf-8')
          original=s
          # Undo the previous internal two-space insertion, regardless of whether it was literal NBSP or entity text.
          candidates=[
              'RANDOM GALAXY\u00a0\u00a0</span><span class="gvrg-random-star-wrap"',
              'RANDOM GALAXY&nbsp;&nbsp;</span><span class="gvrg-random-star-wrap"',
          ]
          hits=sum(s.count(x) for x in candidates)
          if hits != 1:
              raise SystemExit(f'ABORT: expected exactly one prior two-space insertion, found {hits}')
          for x in candidates:
              s=s.replace(x,'RANDOM GALAXY</span><span class="gvrg-random-star-wrap"',1)
          # Shift text + star/comet together by exactly two character widths, preserving their original internal spacing.
          old='#gv-random-galaxy .gvrg-random-label{display:inline-block}#gv-random-galaxy .gvrg-random-star-wrap{position:relative;'
          new='#gv-random-galaxy .gvrg-random-label{display:inline-block;position:relative;left:2ch}#gv-random-galaxy .gvrg-random-star-wrap{position:relative;left:2ch;'
          if s.count(old) != 1:
              raise SystemExit(f'ABORT: expected exact comet style anchor once, found {s.count(old)}')
          s=s.replace(old,new,1)
          if s==original:
              raise SystemExit('ABORT: module unchanged')
          p.write_text(s,encoding='utf-8')
          PY
          test "$(git hash-object "$VIEW")" = "$BEFORE_VIEW"
          node --check "$MOD"
          mapfile -t CHANGED < <(git status --porcelain | sed -E 's/^.. //')
          if [ "${#CHANGED[@]}" -ne 1 ] || [ "${CHANGED[0]}" != "$MOD" ]; then
            printf 'ABORT changed paths:\n%s\n' "${CHANGED[@]}"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$MOD"
          git diff --cached --check
          git commit -m 'Shift Random Galaxy star group two characters right'
          MODULE_COMMIT=$(git rev-parse HEAD)
          MODULE_BLOB=$(git rev-parse HEAD:"$MOD")
          git push origin HEAD:beta
          echo "MODULE_COMMIT=$MODULE_COMMIT" >> "$GITHUB_ENV"
          echo "MODULE_BLOB=$MODULE_BLOB" >> "$GITHUB_ENV"

      - name: Pin 10F to repaired module
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin beta
          git reset --hard origin/beta
          MOD='viewer/modules/gv-random-galaxy-0031.js'
          VIEW='viewer/GV-beta-0010F.py'
          BEFORE_MOD=$(git hash-object "$MOD")
          python - <<'PY'
          import os,re
          from pathlib import Path
          p=Path('viewer/GV-beta-0010F.py')
          s=p.read_text(encoding='utf-8')
          commit=os.environ['MODULE_COMMIT']
          blob=os.environ['MODULE_BLOB']
          pattern=r"const RANDOM_GALAXY_URL='https://raw\.githubusercontent\.com/gear66me-ui/Galaxy_Viewer/[0-9a-f]{40}/viewer/modules/gv-random-galaxy-0031\.js\?v=[0-9a-f]{40}';"
          repl=f"const RANDOM_GALAXY_URL='https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/{commit}/viewer/modules/gv-random-galaxy-0031.js?v={blob}';"
          matches=re.findall(pattern,s)
          if len(matches)!=1:
              raise SystemExit(f'ABORT: expected one immutable 0031 pin, found {len(matches)}')
          s=re.sub(pattern,repl,s,count=1)
          p.write_text(s,encoding='utf-8')
          compile(s,str(p),'exec')
          PY
          test "$(git hash-object "$MOD")" = "$BEFORE_MOD"
          mapfile -t CHANGED < <(git status --porcelain | sed -E 's/^.. //')
          if [ "${#CHANGED[@]}" -ne 1 ] || [ "${CHANGED[0]}" != "$VIEW" ]; then
            printf 'ABORT changed paths:\n%s\n' "${CHANGED[@]}"
            exit 1
          fi
          git add "$VIEW"
          git diff --cached --check
          git commit -m 'Pin 10F to shifted Random Galaxy 0031 module'
          git push origin HEAD:beta

      - name: Fetch-back verification
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin beta
          git reset --hard origin/beta
          grep -Fq 'gvrg-random-label{display:inline-block;position:relative;left:2ch}' viewer/modules/gv-random-galaxy-0031.js
          grep -Fq 'gvrg-random-star-wrap{position:relative;left:2ch;' viewer/modules/gv-random-galaxy-0031.js
          python - <<'PY'
          from pathlib import Path
          s=Path('viewer/modules/gv-random-galaxy-0031.js').read_text(encoding='utf-8')
          assert 'RANDOM GALAXY\u00a0\u00a0</span>' not in s
          assert 'RANDOM GALAXY&nbsp;&nbsp;</span>' not in s
          assert s.count('left:2ch') == 2
          print('PASS: whole Random Galaxy + star/comet group shifted exactly 2ch right; internal gap restored')
          PY
