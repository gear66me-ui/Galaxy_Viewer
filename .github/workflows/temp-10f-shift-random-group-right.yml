name: TEMP 10F Shift Random Group Right

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/temp-10f-shift-random-group-right.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact beta head
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Shift complete Random Galaxy visual group two character widths right
        shell: bash
        run: |
          set -euo pipefail
          MOD='viewer/modules/gv-random-galaxy-0031.js'
          VIEW='viewer/GV-beta-0010F.py'
          BEFORE_VIEW=$(git hash-object "$VIEW")

          python - <<'PY'
          from pathlib import Path
          p=Path('viewer/modules/gv-random-galaxy-0031.js')
          s=p.read_text(encoding='utf-8')
          old_label='#gv-random-galaxy .gvrg-random-label{display:inline-block}'
          new_label='#gv-random-galaxy .gvrg-random-label{display:inline-block;transform:translateX(2ch)}'
          old_wrap='width:20px;height:20px;margin-left:13px;flex:0 0 20px;line-height:20px}'
          new_wrap='width:20px;height:20px;margin-left:13px;flex:0 0 20px;line-height:20px;transform:translateX(2ch)}'
          old_html='<span class="gvrg-random-label">RANDOM GALAXY\u00a0\u00a0</span>'
          new_html='<span class="gvrg-random-label">RANDOM GALAXY</span>'
          for old in (old_label,old_wrap,old_html):
              if s.count(old)!=1: raise SystemExit(f'ABORT exact source mismatch for {old!r}: {s.count(old)}')
          s=s.replace(old_label,new_label,1).replace(old_wrap,new_wrap,1).replace(old_html,new_html,1)
          p.write_text(s,encoding='utf-8')
          PY

          # Only module may differ at this stage.
          test "$(git hash-object "$VIEW")" = "$BEFORE_VIEW"
          mapfile -t CHANGED < <(git status --porcelain | sed -E 's/^.. //')
          test "${#CHANGED[@]}" -eq 1
          test "${CHANGED[0]}" = "$MOD"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$MOD"
          git diff --cached --check
          git commit -m '10F shift Random Galaxy group two characters right'
          MOD_COMMIT=$(git rev-parse HEAD)
          MOD_BLOB=$(git hash-object "$MOD")
          git push origin HEAD:beta

          # Pin 10F to the exact new immutable module commit/blob; no other Viewer changes.
          python - "$MOD_COMMIT" "$MOD_BLOB" <<'PY'
          from pathlib import Path
          import re,sys
          commit,blob=sys.argv[1:]
          p=Path('viewer/GV-beta-0010F.py')
          s=p.read_text(encoding='utf-8')
          pattern=r"const RANDOM_GALAXY_URL='https://raw\.githubusercontent\.com/gear66me-ui/Galaxy_Viewer/[0-9a-f]{40}/viewer/modules/gv-random-galaxy-0031\.js\?v=[0-9a-f]{40}';"
          repl=f"const RANDOM_GALAXY_URL='https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/{commit}/viewer/modules/gv-random-galaxy-0031.js?v={blob}';"
          out,n=re.subn(pattern,repl,s,count=1)
          if n!=1: raise SystemExit(f'ABORT pin replacement count {n}')
          p.write_text(out,encoding='utf-8')
          compile(out,str(p),'exec')
          PY

          mapfile -t CHANGED2 < <(git status --porcelain | sed -E 's/^.. //')
          test "${#CHANGED2[@]}" -eq 1
          test "${CHANGED2[0]}" = "$VIEW"
          git add "$VIEW"
          git diff --cached --check
          git commit -m '10F pin right-shift Random Galaxy 0031 module'
          git push origin HEAD:beta

      - name: Fetch-back verification
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin beta
          git reset --hard origin/beta
          MOD='viewer/modules/gv-random-galaxy-0031.js'
          VIEW='viewer/GV-beta-0010F.py'
          grep -Fq 'gvrg-random-label{display:inline-block;transform:translateX(2ch)}' "$MOD"
          grep -Fq 'line-height:20px;transform:translateX(2ch)}' "$MOD"
          if grep -q $'RANDOM GALAXY\u00a0\u00a0</span>' "$MOD"; then echo 'ABORT old internal spaces remain'; exit 1; fi
          grep -Fq '<span class="gvrg-random-label">RANDOM GALAXY</span>' "$MOD"
          grep -Fq "GalaxyRandomGalaxy?.VERSION!=='0031'" "$VIEW"
          grep -Fq "bottom.random.addEventListener('click',launchRandomGalaxy);" "$VIEW"
          echo "MODULE_BLOB=$(git hash-object "$MOD")"
          echo "VIEWER_BLOB=$(git hash-object "$VIEW")"
