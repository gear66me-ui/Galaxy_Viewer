name: Enforce Distance-FOV Image Span

on:
  workflow_dispatch:
  push:
    branches:
      - release
    paths:
      - .github/workflows/enforce-distance-fov-span.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: enforce-distance-fov-span
  cancel-in-progress: false

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Replace image-span fallback with the single distance-FOV equation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          module = Path("viewer/modules/destination-presentation/gv-destination-presentation-0055.js")
          source = module.read_text(encoding="utf-8")
          old = "function size(d){const fromKly=Array.isArray(d?.sizeKly)?d.sizeKly.map(finite).filter(v=>v>0).map(v=>v*1000):[],raw=fromKly.length?fromKly:(Array.isArray(d?.physicalSizeLy)?d.physicalSizeLy:[d?.physicalSizeLy]),a=raw.map(finite).filter(v=>v>0);if(!a.length)return['IMG SPAN','(FOV)'];const m=Math.min(...a),unit=m>=1e6?'MLY':m>=1e3?'KLY':'LY',scale=unit==='MLY'?1e6:unit==='KLY'?1e3:1;return['IMG SPAN ('+unit+')',a.map(v=>unit==='LY'?Number(v.toFixed(2)).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):Number((v/scale).toFixed(2)).toLocaleString('en-US',{maximumFractionDigits:2})).join(' × ')]}"
          new = "function size(d){const distanceMly=finite(d?.distanceMly??d?.distance),fx=finite(d?.imageFovXArcmin??(finite(d?.fovXDegrees??d?.avmHorizontalFovDegrees??d?.imageFovXDeg)*60)),fy=finite(d?.imageFovYArcmin??(finite(d?.fovYDegrees??d?.avmVerticalFovDegrees??d?.imageFovYDeg)*60));if(!(distanceMly>0)||!(fx>0)||!(fy>0))return['IMG SPAN (KLY)','N/A'];const x=distanceMly*0.291*fx,y=distanceMly*0.291*fy;if(!Number.isFinite(x)||!Number.isFinite(y)||!(x>0)||!(y>0))return['IMG SPAN (KLY)','N/A'];return['IMG SPAN (KLY)',x.toFixed(2)+' × '+y.toFixed(2)]}"
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"STOP: expected exactly one old size() function, found {count}; no changes made")
          source = source.replace(old, new)
          # Keep the module available to the release runtime after this commit.
          source = source.replace("const VERSION='0055';", "const VERSION='0055';")
          module.write_text(source, encoding="utf-8")

          runtime = Path("viewer/RC-V1.0.0.8.py")
          text = runtime.read_text(encoding="utf-8")
          import re
          pattern = r"destinationPresentationUrl:'[^']*gv-destination-presentation-[^']*'"
          replacement = "destinationPresentationUrl:'https://cdn.jsdelivr.net/gh/gear66me-ui/Galaxy_Viewer@release/viewer/modules/destination-presentation/gv-destination-presentation-0055.js'"
          text, replacements = re.subn(pattern, replacement, text)
          if replacements != 1:
              raise SystemExit(f"STOP: expected exactly one destinationPresentationUrl entry, found {replacements}")
          runtime.write_text(text, encoding="utf-8")

          # Static guards: size calculation must not read precomputed physical sizes.
          check = module.read_text(encoding="utf-8")
          start = check.index("function size(d){")
          end = check.index("\n", start)
          fn = check[start:end]
          for forbidden in ("d?.sizeKly", "d?.physicalSizeLy"):
              if forbidden in fn:
                  raise SystemExit(f"STOP: forbidden size fallback remains: {forbidden}")
          for required in ("distanceMly*0.291*fx", "distanceMly*0.291*fy", "'N/A'"):
              if required not in fn:
                  raise SystemExit(f"STOP: required equation/invalid-input behavior missing: {required}")
          print("PASS: one equation, independent X/Y FOV, N/A for invalid inputs, no precomputed-size fallback.")
          PY

      - name: Validate changes and commit only the two runtime files
        shell: bash
        run: |
          set -euo pipefail
          node --check viewer/modules/destination-presentation/gv-destination-presentation-0055.js
          python3 -m py_compile viewer/RC-V1.0.0.8.py
          git diff --check
          expected="$(printf '%s\n' 'viewer/RC-V1.0.0.8.py' 'viewer/modules/destination-presentation/gv-destination-presentation-0055.js' | sort)"
          actual="$(git diff --name-only | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "STOP: unexpected changed paths:"
            printf '%s\n' "$actual"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/RC-V1.0.0.8.py viewer/modules/destination-presentation/gv-destination-presentation-0055.js
          git diff --cached --check
          git commit -m "Use distance and image FOV as sole span calculation"
          git push origin HEAD:release

      - name: Trigger Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref release
