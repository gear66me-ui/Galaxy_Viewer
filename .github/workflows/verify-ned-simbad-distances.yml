name: Verify and Populate Published Galaxy Distances and Redshifts

on:
  push:
    branches: [release]
    paths:
      - '.github/workflows/verify-ned-simbad-distances.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: "audit reports only; apply updates the authoritative runtime catalog"
        required: true
        type: choice
        options: [audit, apply]
        default: audit

permissions:
  contents: write

concurrency:
  group: ned-simbad-distance-verification
  cancel-in-progress: false

jobs:
  verify-distances:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Run published-distance and redshift reconciliation
        env:
          # A release-branch workflow change runs the real update automatically.
          # Manual dispatch defaults to audit unless the user explicitly selects apply.
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'apply' }}
        run: |
          set -euo pipefail
          python3 .github/scripts/update_runtime_published_distances.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("ned-simbad-distance-verification.json")
          r=json.loads(p.read_text(encoding="utf-8"))
          print(json.dumps(r["counters"], indent=2))
          print("Runtime records:", r["runtimeRecordCount"])
          PY
          if [[ "$MODE" == "audit" ]]; then
            git checkout -- viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0003.json
          fi

      - name: Upload reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ned-simbad-distance-verification
          path: ned-simbad-distance-verification.json
          if-no-files-found: warn
          retention-days: 90

      - name: Validate and commit runtime catalog updates
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'apply' }}
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'apply' }}
        run: |
          set -euo pipefail
          CATALOG="viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0003.json"
          REPORT="ned-simbad-distance-verification.json"
          python3 -m json.tool "$CATALOG" >/dev/null
          python3 -m json.tool "$REPORT" >/dev/null
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$CATALOG" "$REPORT"
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n%s' "$CATALOG" "$REPORT" | sort)"
          [[ "$staged" == "$expected" ]] || { echo "Unexpected staged paths: $staged"; exit 1; }
          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
            exit 0
          fi
          git commit -m "Populate runtime with published distances and redshifts"
          git push origin HEAD:release
