name: Publish Galaxy Viewer 10A Recovery

on:
  push:
    branches:
      - beta
    paths:
      - '.github/workflows/publish-galaxy-viewer-10A-recovery.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish-10a:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Verify exact published 10A source and protected baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object viewer/GV-beta-0010A.py)" = "cab3be7681858c940f650b9d25713657a24c7031"
          test "$(git hash-object viewer/GV-beta-0009I.py)" = "c618320f9ddad3e243f2fc5af436eb6bb678a6b5"
          test "$(git hash-object viewer/archive/GV-beta-0009I-7.py)" = "c618320f9ddad3e243f2fc5af436eb6bb678a6b5"
          test "$(git hash-object viewer/artwork/icon.svg)" = "829faf3594e85d4ff529d3c2b069a309d580b054"
          test "$(git hash-object viewer/artwork/Hubble/Hubble-NASA-ESA-BW.png)" = "5b597839833f4b7a7d477e720fd12949e8515ac6"

      - name: Download exact verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 31993156596 -n Galaxy-Viewer-10A
          test -f Galaxy-Viewer-10A.apk
          test -f Galaxy-Viewer-10A.sha256
          echo '23890cc8c76b034668d835f67bdc9d06799015c21a68b947848e036a24b724ef  Galaxy-Viewer-10A.apk' | sha256sum -c -
          grep -Fx '23890cc8c76b034668d835f67bdc9d06799015c21a68b947848e036a24b724ef  Galaxy-Viewer-10A.apk' Galaxy-Viewer-10A.sha256

      - name: Publish immutable 10A release at actual source commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view galaxy-viewer-10a >/dev/null 2>&1; then
            echo '10A release already exists; refusing overwrite.' >&2
            exit 1
          fi
          gh release create galaxy-viewer-10a Galaxy-Viewer-10A.apk Galaxy-Viewer-10A.sha256 --target d2c4350e46c671822e21a4d327cd13f1a39c6fc0 --title 'Galaxy Viewer 10A — Android' --notes 'Standalone Galaxy Viewer 10A built from frozen 9I-M blob c618320f9ddad3e243f2fc5af436eb6bb678a6b5. 10A source blob: cab3be7681858c940f650b9d25713657a24c7031. Startup cover uses approved icon.svg for 3.5 seconds before splash playback begins from frame zero.'

      - name: Remove temporary publication workflow only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Galaxy Viewer Build Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-galaxy-viewer-10A-recovery.yml
          git diff --cached --check
          git commit -m 'Remove temporary Galaxy Viewer 10A publish workflow'
          git fetch origin beta
          git rebase origin/beta
          git push origin HEAD:beta
