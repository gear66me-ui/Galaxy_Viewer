name: Build Galaxy Viewer 10F Surgical R3
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/build-galaxy-viewer-10f-surgical-r3.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Execute exact R2 build with command tracing
        shell: bash
        run: |
          set -euo pipefail
          SRC='.github/workflows/build-galaxy-viewer-10f-surgical-r2.yml'
          sed -n '/^        run: |$/,$p' "$SRC" | tail -n +2 | sed 's/^          //' > /tmp/10f-r2.sh
          sed -i '0,/^set -euo pipefail$/s//set -euxo pipefail/' /tmp/10f-r2.sh
          sed -i '/^          mapfile -t P/!b' /dev/null 2>/dev/null || true
          sed -i '/^mapfile -t P/i rm -rf viewer/__pycache__' /tmp/10f-r2.sh
          bash /tmp/10f-r2.sh
