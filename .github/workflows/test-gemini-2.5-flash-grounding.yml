name: Gemini Interactions Grounding Preflight

on:
  push:
    branches:
      - beta
    paths:
      - .github/workflows/test-gemini-2.5-flash-grounding.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MODEL: gemini-3.6-flash
    steps:
      - name: Test Interactions API ordinary and grounded calls
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY:-}" || { echo "GEMINI_API_KEY secret missing"; exit 1; }
          python3 <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          key=os.environ['GEMINI_API_KEY']
          model=os.environ['MODEL']
          url='https://generativelanguage.googleapis.com/v1beta/interactions'

          def call(prompt, grounded=False):
              body={
                  'model':model,
                  'input':prompt,
              }
              if grounded:
                  body['tools']=[{'type':'google_search'}]
              req=urllib.request.Request(
                  url,
                  data=json.dumps(body).encode('utf-8'),
                  method='POST',
                  headers={'Content-Type':'application/json','x-goog-api-key':key},
              )
              try:
                  with urllib.request.urlopen(req,timeout=120) as response:
                      return json.loads(response.read().decode('utf-8'))
              except urllib.error.HTTPError as exc:
                  response_body=exc.read().decode('utf-8','replace')
                  raise SystemExit(f'Gemini Interactions API HTTP {exc.code}: {response_body[:3000]}')

          def extract_text(resp):
              texts=[]
              for step in resp.get('steps') or []:
                  if step.get('type') != 'model_output':
                      continue
                  for block in step.get('content') or []:
                      if block.get('type') == 'text' and block.get('text'):
                          texts.append(block['text'])
              return ''.join(texts).strip()

          ordinary=call('Reply with exactly OK.')
          ordinary_text=extract_text(ordinary)
          if not ordinary_text:
              raise SystemExit(f'Ordinary Interactions call returned no text: {json.dumps(ordinary)[:2000]}')
          print('ORDINARY INTERACTIONS PASS:',ordinary_text[:120])

          grounded=call(
              'Use Google Search to identify the common name of Messier 104. Reply briefly and cite the sources you used.',
              grounded=True,
          )
          grounded_text=extract_text(grounded)
          search_calls=[s for s in grounded.get('steps') or [] if s.get('type') == 'google_search_call']
          citations=[]
          for step in grounded.get('steps') or []:
              if step.get('type') != 'model_output':
                  continue
              for block in step.get('content') or []:
                  for ann in block.get('annotations') or []:
                      if ann.get('type') == 'url_citation' and ann.get('url'):
                          citations.append(ann['url'])
          if not grounded_text:
              raise SystemExit(f'Grounded Interactions call returned no text: {json.dumps(grounded)[:2000]}')
          if not search_calls:
              raise SystemExit(f'Grounded Interactions call returned no google_search_call: {json.dumps(grounded)[:2500]}')
          if not citations:
              raise SystemExit(f'Grounded Interactions call returned no URL citations: {json.dumps(grounded)[:2500]}')
          print('GROUNDING INTERACTIONS PASS: searches=',len(search_calls),'citations=',len(citations))
          print('MODEL PASS:',model)
          PY
