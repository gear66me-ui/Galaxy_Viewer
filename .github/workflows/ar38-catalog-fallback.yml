name: AR38 Catalog Fallback Builder

on:
  push:
    branches:
      - beta
    paths:
      - .github/ar38-trigger.txt

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Build AR38
        shell: bash
        run: echo '' | base64 -d > /tmp/build_ar38.py
      - name: Apply patch
        shell: bash
        run: python /tmp/build_ar38.py
      - name: Validate
        shell: bash
        run: |
          python -m py_compile viewer/GV-beta-0012AR-38.py
          grep -q "async function fetchJsonWithFallback" viewer/GV-beta-0012AR-38.py
          grep -q "for(let attempt=1;attempt<=3;attempt++)" viewer/GV-beta-0012AR-38.py
          grep -q "const NAVIGATION_VERSION='0016'" viewer/GV-beta-0012AR-38.py
          grep -q "const RANDOM_GALAXY_VERSION='0112'" viewer/GV-beta-0012AR-38.py
          grep -q 'GV-beta-0012AR-38.py' viewer/gv-current-viewer.json
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/GV-beta-0012AR-38.py viewer/gv-current-viewer.json
          git commit -m 'AR38 harden catalog startup with retry and Pages fallback'
          git push origin beta
