name: TEMP Catalog 0018 one-word summary
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/temp-catalog18-oneword-summary.yml']
permissions:
  contents: write
jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: beta}
      - shell: bash
        run: |
          python - <<'PY'
          import json,csv
          p='viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0018.json'
          d=json.load(open(p,encoding='utf-8'))
          q='viewer/image-databases/Hubble/databases/temp-catalog18-oneword-summary.tsv'
          with open(q,'w',encoding='utf-8',newline='') as f:
              w=csv.writer(f,delimiter='\t')
              w.writerow(['index','archiveId','displayName','designation','name','title','sourceUrl'])
              for i,e in enumerate(d['entries']):
                  n=(e.get('displayName') or '').strip()
                  if n and len(n.split())==1:
                      w.writerow([i,e.get('archiveId',''),n,e.get('designation',''),e.get('name',''),e.get('title',''),e.get('sourceUrl','')])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add viewer/image-databases/Hubble/databases/temp-catalog18-oneword-summary.tsv
          git commit -m 'TEMP summarize Catalog 0018 one-word pseudonyms'
          git push origin HEAD:beta
