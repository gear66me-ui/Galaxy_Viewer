name: Build Galaxy Viewer Local Survey Thumbnails APK

on:
  push:
    branches: [release]
    paths:
      - '.github/workflows/build-galaxy-viewer-local-survey-thumbnails-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install launcher tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Assemble production shell with bundled Survey thumbnails
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/galaxy-viewer-local-thumbs
          GOLD=8081fda85c7216fe4cbd580fc2a26f765cde64d1
          rm -rf "$ROOT"
          mkdir -p "$ROOT/app/src/main/java/com/gear66me/galaxyviewer"
          mkdir -p "$ROOT/app/src/main/assets/survey-thumbnails"
          mkdir -p "$ROOT/app/src/main/res/drawable" "$ROOT/app/src/main/res/mipmap-anydpi-v26" "$ROOT/app/src/main/res/values" "$ROOT/app/src/main/res/values-v31"

          THUMB_ROOT=viewer/artwork/runtime/survey-thumbnails
          test -s "$THUMB_ROOT/gv-survey-thumbnail-index.json"
          test -s "$THUMB_ROOT/gv-survey-thumbnail-current.json"
          THUMB_COUNT="$(find "$THUMB_ROOT" -type f -name '*.webp' | wc -l | tr -d ' ')"
          test "$THUMB_COUNT" = "1848"
          cp -a "$THUMB_ROOT"/. "$ROOT/app/src/main/assets/survey-thumbnails/"

          cat > "$ROOT/settings.gradle" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='GalaxyViewerLocalThumbs'
          include ':app'
          EOF

          cat > "$ROOT/build.gradle" <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF

          cat > "$ROOT/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > "$ROOT/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.gear66me.galaxyviewer'
            compileSdk 36
            defaultConfig {
              applicationId 'com.gear66me.galaxyviewer'
              minSdk 29
              targetSdk 36
              versionCode 10027
              versionName 'RC-V1.0.0.27'
            }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.17.1' }
          EOF

          test -s viewer/artwork/app_icon_4.png
          cp viewer/artwork/app_icon_4.png "$ROOT/app/src/main/res/drawable/app_icon_4.png"

          cat > "$ROOT/app/src/main/res/drawable/transparent_splash_icon.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
            <solid android:color="#00000000"/>
            <size android:width="1dp" android:height="1dp"/>
          </shape>
          EOF

          cat > "$ROOT/app/src/main/res/drawable/gv_launcher_background.xml" <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="#000000"/></shape>
          EOF

          cat > "$ROOT/app/src/main/res/drawable/gv_launcher_foreground.xml" <<'EOF'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:gravity="center" android:width="66dp" android:height="66dp"><bitmap android:src="@drawable/app_icon_4" android:gravity="fill"/></item></layer-list>
          EOF

          cat > "$ROOT/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/gv_launcher_background"/><foreground android:drawable="@drawable/gv_launcher_foreground"/></adaptive-icon>
          EOF
          cp "$ROOT/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" "$ROOT/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml"

          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            px="${spec##*:}"
            mkdir -p "$ROOT/app/src/main/res/mipmap-${density}"
            convert viewer/artwork/app_icon_4.png -resize "${px}x${px}" "$ROOT/app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp "$ROOT/app/src/main/res/mipmap-${density}/ic_launcher.png" "$ROOT/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done

          cat > "$ROOT/app/src/main/res/values/styles.xml" <<'EOF'
          <resources>
            <style name="GalaxyViewerTheme" parent="@android:style/Theme.Material.NoActionBar">
              <item name="android:windowBackground">#000000</item>
              <item name="android:navigationBarColor">#000000</item>
              <item name="android:statusBarColor">#000000</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowLightNavigationBar">false</item>
            </style>
          </resources>
          EOF

          cat > "$ROOT/app/src/main/res/values-v31/styles.xml" <<'EOF'
          <resources>
            <style name="GalaxyViewerTheme" parent="@android:style/Theme.Material.NoActionBar">
              <item name="android:windowBackground">#000000</item>
              <item name="android:windowSplashScreenBackground">#000000</item>
              <item name="android:windowSplashScreenAnimatedIcon">@drawable/transparent_splash_icon</item>
              <item name="android:windowSplashScreenAnimationDuration">0</item>
              <item name="android:navigationBarColor">#000000</item>
              <item name="android:statusBarColor">#000000</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowLightNavigationBar">false</item>
            </style>
          </resources>
          EOF

          cat > "$ROOT/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:allowBackup="false" android:hardwareAccelerated="true"
              android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"
              android:label="Galaxy Viewer" android:theme="@style/GalaxyViewerTheme"
              android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity"
                android:configChanges="keyboardHidden|orientation|screenSize"
                android:exported="true" android:screenOrientation="portrait">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          git fetch origin beta --no-tags
          git show "$GOLD:android/galaxy-viewer-web-browser/app/src/main/java/com/gear66me/galaxyviewer/webbrowser/MainActivity.java" > "$ROOT/app/src/main/java/com/gear66me/galaxyviewer/MainActivity.java"
          sed -i 's/package com\.gear66me\.galaxyviewer\.webbrowser;/package com.gear66me.galaxyviewer;/' "$ROOT/app/src/main/java/com/gear66me/galaxyviewer/MainActivity.java"

          MAIN="$ROOT/app/src/main/java/com/gear66me/galaxyviewer/MainActivity.java"
          # Restore the already-approved persistent provider load/reuse + native preload telemetry from APK 0019.
          # Heavy provider work still begins only after the hosted viewer reports destination arrival.
          # A WEB press never restarts the same in-flight/ready provider load; it reveals the persistent WebView.
          python - "$MAIN" <<'PY19'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()

          def replace_between(start_marker,end_marker,replacement):
              global s
              start=s.index(start_marker)
              end=s.index(end_marker,start)
              assert start>=0 and end>start
              s=s[:start]+replacement+s[end:]

          state_needle='  private final android.os.Handler providerGateHandler=new android.os.Handler(android.os.Looper.getMainLooper()); private Runnable providerWatchdog=null;\n'
          assert s.count(state_needle)==1
          s=s.replace(state_needle,state_needle+
              '  private int providerLoadProgress=0; private boolean providerLoadReady=false;\n',1)

          helper=(
              '  private void emitProviderWarmStatus(){\n'
              '    if(viewerWeb==null)return;final int p=Math.max(0,Math.min(100,providerLoadProgress));final boolean ready=providerLoadReady,visible=prewarmedUrl!=null&&!prewarmedUrl.isEmpty();\n'
              '    String js="(function(p,r,v){var e=document.getElementById(\\\'gv-provider-native-progress\\\'),i=document.querySelector(\\\'.gvdp-card.gvdp-visible .gvdp-icon\\\');if(!v||!i){if(e)e.remove();return;}if(!e){e=document.createElement(\\\'div\\\');e.id=\\\'gv-provider-native-progress\\\';e.innerHTML=\\\'<i></i><b></b>\\\';document.body.appendChild(e);}var q=i.getBoundingClientRect();e.style.cssText=\\\'position:fixed;pointer-events:none;z-index:9000;height:3px;background:rgba(0,20,12,.76);border-radius:2px;\\\';e.style.left=q.left+\\\'px\\\';e.style.top=(q.bottom+2)+\\\'px\\\';e.style.width=q.width+\\\'px\\\';var f=e.querySelector(\\\'i\\\'),d=e.querySelector(\\\'b\\\');f.style.cssText=\\\'position:absolute;left:0;top:0;height:100%;border-radius:2px;background:#55ff99;box-shadow:0 0 3px rgba(85,255,153,.8);\\\';f.style.width=Math.max(0,Math.min(100,p))+\\\'%\\\';d.style.cssText=\\\'position:absolute;right:-6px;top:-1px;width:4px;height:4px;border-radius:50%;\\\';d.style.background=r?\\\'#55ff99\\\':\\\'#173126\\\';d.style.boxShadow=r?\\\'0 0 4px #55ff99\\\':\\\'none\\\';})(\"+p+\",\"+(ready?\"true\":\"false\")+\",\"+(visible?\"true\":\"false\")+\");";\n'
              '    try{viewerWeb.evaluateJavascript(js,null);}catch(Exception ignored){}\n'
              '  }\n'
          )
          insert='  private void prewarmProvider(String u){'
          assert s.count(insert)==1
          s=s.replace(insert,helper+insert,1)

          prewarm=(
              '  private void prewarmProvider(String u){\n'
              '    if(u==null||!u.startsWith("https://")||web==null)return;\n'
              '    configureProviderViewport(u);\n'
              '    if(u.equals(prewarmedUrl)&&!prewarmFailed&&(prewarmLoading||providerLoadReady)){emitProviderWarmStatus();return;}\n'
              '    if(prerenderSignal!=null){try{prerenderSignal.cancel();}catch(Exception ignored){}prerenderSignal=null;}\n'
              '    if(prefetchSignal!=null){try{prefetchSignal.cancel();}catch(Exception ignored){}prefetchSignal=null;}\n'
              '    ++prerenderGeneration;prewarmedUrl=u;prewarmReadyUrl="";prewarmCommittedUrl="";prewarmLoading=true;prewarmFailed=false;providerLoadProgress=0;providerLoadReady=false;clearProviderEntryHistory=true;\n'
              '    try{if(WebViewFeature.isFeatureSupported(WebViewFeature.MULTI_PROFILE)){Profile profile=WebViewCompat.getProfile(web);if(WebViewFeature.isFeatureSupported(WebViewFeature.WARM_UP_RENDERER_PROCESS)){try{profile.warmUpRendererProcess();}catch(Exception ignored){}}if(WebViewFeature.isFeatureSupported(WebViewFeature.PRECONNECT)){try{profile.preconnect(u);}catch(Exception ignored){}}}}catch(Exception ignored){}\n'
              '    if(browserLayer!=null)browserLayer.setVisibility(View.INVISIBLE);\n'
              '    emitProviderWarmStatus();\n'
              '    web.loadUrl(u);\n'
              '  }\n'
          )
          replace_between('  private void prewarmProvider(String u){','  private boolean providerRequestCurrent',prewarm)

          chrome='    v.setWebChromeClient(new WebChromeClient(){\n'
          assert s.count(chrome)==1
          s=s.replace(chrome,chrome+
              '      @Override public void onProgressChanged(WebView view,int newProgress){super.onProgressChanged(view,newProgress);if(prewarmedUrl!=null&&!prewarmedUrl.isEmpty()&&!prewarmFailed){providerLoadProgress=Math.max(providerLoadProgress,Math.max(0,Math.min(100,newProgress)));emitProviderWarmStatus();}}\n',1)

          old_callbacks=(
              '      @Override public void onPageCommitVisible(WebView view,String url){if(browserMode&&awaitingProviderCommit&&activeProviderNavigation==null)visualRevealProvider(providerRevealGeneration,providerTargetUrl);}\n'
              '      @Override public void onReceivedError(WebView view,WebResourceRequest request,WebResourceError error){if(browserMode&&awaitingProviderCommit&&activeProviderNavigation==null&&request!=null&&request.isForMainFrame())retryProviderNavigation(providerRevealGeneration,providerTargetUrl);}\n'
              '      @Override public void onPageFinished(WebView view,String url){CookieManager.getInstance().flush();if(browserMode&&!awaitingProviderCommit){if(url!=null&&!url.isEmpty())sourceUrl=url;syncShell();}}\n'
          )
          assert s.count(old_callbacks)==1
          new_callbacks=(
              '      @Override public void onPageCommitVisible(WebView view,String url){if(prewarmLoading&&url!=null&&!url.isEmpty())prewarmCommittedUrl=url;}\n'
              '      @Override public void onReceivedError(WebView view,WebResourceRequest request,WebResourceError error){if(request!=null&&request.isForMainFrame()&&prewarmLoading){prewarmLoading=false;prewarmFailed=true;providerLoadReady=false;emitProviderWarmStatus();}}\n'
              '      @Override public void onPageFinished(WebView view,String url){CookieManager.getInstance().flush();if(prewarmLoading&&!prewarmedUrl.isEmpty()){prewarmLoading=false;prewarmFailed=false;prewarmReadyUrl=prewarmedUrl;prewarmCommittedUrl=url==null?"":url;providerLoadProgress=100;providerLoadReady=true;if(clearProviderEntryHistory){web.clearHistory();clearProviderEntryHistory=false;}emitProviderWarmStatus();}if(browserMode){if(url!=null&&!url.isEmpty())sourceUrl=url;syncShell();}}\n'
          )
          s=s.replace(old_callbacks,new_callbacks,1)

          old_cfg='    if(web==null)return;boolean chandra=isChandraProvider(url);WebSettings settings=web.getSettings();settings.setUseWideViewPort(true);settings.setLoadWithOverviewMode(chandra);if(chandra)web.setInitialScale(0);\n'
          assert s.count(old_cfg)==1
          new_cfg='    if(web==null)return;boolean chandra=isChandraProvider(url);WebSettings settings=web.getSettings();settings.setUseWideViewPort(true);settings.setLoadWithOverviewMode(chandra);settings.setCacheMode(WebSettings.LOAD_DEFAULT);settings.setOffscreenPreRaster(true);if(chandra)web.setInitialScale(0);\n'
          s=s.replace(old_cfg,new_cfg,1)

          cancel=(
              '  private void cancelProviderWork(){\n'
              '    providerRevealGeneration++;prerenderGeneration++;awaitingProviderCommit=false;browserMode=false;activeProviderNavigation=null;providerTargetUrl="";providerRevealNotBeforeMs=0L;providerRetryUsed=false;\n'
              '    if(providerWatchdog!=null){providerGateHandler.removeCallbacks(providerWatchdog);providerWatchdog=null;}\n'
              '    if(prerenderSignal!=null){try{prerenderSignal.cancel();}catch(Exception ignored){}prerenderSignal=null;}\n'
              '    if(prefetchSignal!=null){try{prefetchSignal.cancel();}catch(Exception ignored){}prefetchSignal=null;}\n'
              '    prewarmLoading=false;prewarmFailed=false;prewarmedUrl="";prewarmReadyUrl="";prewarmCommittedUrl="";providerLoadProgress=0;providerLoadReady=false;\n'
              '    pendingProviderUrl="";pendingProviderIcon="";clearProviderEntryHistory=false;\n'
              '    if(web!=null){try{web.stopLoading();}catch(Exception ignored){}}\n'
              '    if(browserLayer!=null)browserLayer.setVisibility(View.GONE);emitProviderWarmStatus();\n'
              '  }\n'
          )
          replace_between('  private void cancelProviderWork(){','  private boolean isChandraProvider',cancel)

          open_provider=(
              '  private void openProvider(String u,String icon){\n'
              '    configureProviderViewport(u);\n'
              '    browserMode=true;pendingProviderUrl=u;pendingProviderIcon=icon==null?"":icon;providerIcon=pendingProviderIcon;sourceUrl=u;providerHomeUrl=u;awaitingProviderCommit=false;activeProviderNavigation=null;\n'
              '    if(providerWatchdog!=null){providerGateHandler.removeCallbacks(providerWatchdog);providerWatchdog=null;}\n'
              '    boolean sameWarm=u!=null&&u.equals(prewarmedUrl)&&!prewarmFailed;\n'
              '    if(!sameWarm)prewarmProvider(u);\n'
              '    if(browserLayer!=null){browserLayer.setVisibility(View.VISIBLE);browserLayer.bringToFront();}\n'
              '    if(web!=null)web.requestFocus();\n'
              '    syncShell();fetchPointer();immersive();\n'
              '  }\n'
          )
          replace_between('  private void openProvider(String u,String icon){','  private void notifyViewerResumed(){',open_provider)

          old_return='  private void returnToViewer(){ browserMode=false; if(browserLayer!=null)browserLayer.setVisibility(View.GONE); notifyViewerResumed(); }\n'
          assert s.count(old_return)==1
          s=s.replace(old_return,'  private void returnToViewer(){ browserMode=false; if(browserLayer!=null)browserLayer.setVisibility(View.GONE); notifyViewerResumed(); emitProviderWarmStatus(); }\n',1)

          p.write_text(s)
          PY19


          python - "$MAIN" <<'PY'
          from pathlib import Path
          import sys

          p=Path(sys.argv[1])
          s=p.read_text(encoding='utf-8')

          old='import android.os.Bundle;\nimport android.os.Message;\n'
          new='import android.os.Bundle;\nimport android.os.Message;\nimport android.os.Handler;\nimport android.os.Looper;\n'
          if s.count(old)!=1:
              raise SystemExit('android.os import anchor mismatch')
          s=s.replace(old,new,1)

          old='import java.io.BufferedReader;\nimport java.io.InputStreamReader;\n'
          new='import java.io.BufferedReader;\nimport java.io.InputStreamReader;\nimport java.io.InputStream;\nimport java.io.IOException;\nimport java.util.HashMap;\n'
          if s.count(old)!=1:
              raise SystemExit('import anchor mismatch')
          s=s.replace(old,new,1)

          anchor='  private WebView viewer(){\n'
          helper=r'''  private WebResourceResponse localSurveyThumbnailOrAsset(Uri uri){
            if(uri!=null){
              String path=uri.getPath();
              String marker="/viewer/artwork/runtime/survey-thumbnails/";
              if(path!=null){
                int at=path.indexOf(marker);
                if(at>=0){
                  String rel=path.substring(at+marker.length());
                  if(!rel.isEmpty()&&!rel.contains("..")){
                    try{
                      InputStream in=getAssets().open("survey-thumbnails/"+rel);
                      String mime=rel.endsWith(".webp")?"image/webp":"application/json";
                      String encoding=rel.endsWith(".json")?"UTF-8":null;
                      HashMap<String,String> headers=new HashMap<>();
                      headers.put("Access-Control-Allow-Origin","*");
                      headers.put("Cache-Control","public, max-age=31536000, immutable");
                      headers.put("X-Galaxy-Viewer-Thumbnail-Source","APK");
                      return new WebResourceResponse(mime,encoding,200,"OK",headers,in);
                    }catch(IOException ignored){}
                  }
                }
              }
            }
            return assetLoader==null?null:assetLoader.shouldInterceptRequest(uri);
          }

          '''
          if s.count(anchor)!=1:
              raise SystemExit('viewer anchor mismatch')
          s=s.replace(anchor,helper+anchor,1)

          old_req='      @Override public WebResourceResponse shouldInterceptRequest(WebView view,WebResourceRequest request){ return assetLoader==null?null:assetLoader.shouldInterceptRequest(request.getUrl()); }\n      @Override public WebResourceResponse shouldInterceptRequest(WebView view,String url){ return assetLoader==null?null:assetLoader.shouldInterceptRequest(Uri.parse(url)); }'
          new_req='      @Override public WebResourceResponse shouldInterceptRequest(WebView view,WebResourceRequest request){ return localSurveyThumbnailOrAsset(request.getUrl()); }\n      @Override public WebResourceResponse shouldInterceptRequest(WebView view,String url){ return localSurveyThumbnailOrAsset(Uri.parse(url)); }'
          if s.count(old_req)<1:
              raise SystemExit('viewer intercept anchor missing')
          s=s.replace(old_req,new_req,1)

          p.write_text(s,encoding='utf-8')
          PY

          grep -q 'GalaxyViewerWebBrowser/0057' "$MAIN"
          grep -q 'addJavascriptInterface(new ViewerBridge(),"GVNative")' "$MAIN"
          grep -q 'WebViewCompat.prerenderUrlAsync(web,u' "$MAIN"
          grep -q 'X-Galaxy-Viewer-Thumbnail-Source' "$MAIN"
          grep -q 'providerLoadProgress=100;providerLoadReady=true' "$MAIN"
          grep -q 'gv-provider-native-progress' "$MAIN"
          grep -q 'profile.preconnect(u)' "$MAIN"
          grep -q 'settings.setOffscreenPreRaster(true)' "$MAIN"
          grep -q 'boolean sameWarm=u!=null&&u.equals(prewarmedUrl)&&!prewarmFailed' "$MAIN"
          grep -q 'getAssets().open("survey-thumbnails/"+rel)' "$MAIN"
          grep -q 'localSurveyThumbnailOrAsset(request.getUrl())' "$MAIN"
          grep -q 'https://gear66me-ui.github.io/Galaxy_Viewer/viewer/releases/launch/Galaxy-Viewer-Launch/index.html?gv=' "$MAIN"

          echo "Bundled Survey thumbnails: $THUMB_COUNT"

      - name: Build release APK
        run: gradle --no-daemon -p /tmp/galaxy-viewer-local-thumbs :app:assembleRelease

      - name: Sign APK
        shell: bash
        env:
          GV_UPLOAD_KEYSTORE_BASE64: ${{ secrets.GALAXY_VIEWER_UPLOAD_KEYSTORE }}
          GV_UPLOAD_STORE_PASSWORD: ${{ secrets.GALAXY_VIEWER_UPLOAD_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE=/tmp/galaxy-viewer-upload.jks
          UNSIGNED=/tmp/galaxy-viewer-local-thumbs/app/build/outputs/apk/release/app-release-unsigned.apk
          OUT=Galaxy-Viewer-RC-V1.0.0.27-Local-Survey-Thumbnails.apk
          test -n "$GV_UPLOAD_KEYSTORE_BASE64"
          test -n "$GV_UPLOAD_STORE_PASSWORD"
          printf '%s' "$GV_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          test -s "$UNSIGNED"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$UNSIGNED" /tmp/gv-local-thumbs-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias galaxyviewer-upload \
            --ks-pass env:GV_UPLOAD_STORE_PASSWORD \
            --key-pass env:GV_UPLOAD_STORE_PASSWORD \
            --out "$OUT" \
            /tmp/gv-local-thumbs-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$OUT" | tee apk-signature.txt
          sha256sum "$OUT" | tee "$OUT.sha256"

      - name: Verify bundled thumbnail payload
        shell: bash
        run: |
          set -euo pipefail
          APK=Galaxy-Viewer-RC-V1.0.0.27-Local-Survey-Thumbnails.apk
          test -s "$APK"
          COUNT="$(unzip -l "$APK" | grep -E 'assets/survey-thumbnails/.+\.webp$' | wc -l | tr -d ' ')"
          test "$COUNT" = "1848"
          unzip -l "$APK" | grep -q 'assets/survey-thumbnails/gv-survey-thumbnail-index.json'
          unzip -l "$APK" | grep -q 'assets/survey-thumbnails/gv-survey-thumbnail-current.json'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.gear66me.galaxyviewer'" apk-badging.txt
          grep -q "versionCode='10027'" apk-badging.txt
          echo "Verified APK-bundled thumbnails: $COUNT"

      - name: Publish direct-download APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=galaxy-viewer-rc-v1.0.0.27-local-survey-thumbnails
          APK=Galaxy-Viewer-RC-V1.0.0.27-Local-Survey-Thumbnails.apk
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" "$APK" "$APK.sha256" apk-badging.txt apk-signature.txt \
            --target release \
