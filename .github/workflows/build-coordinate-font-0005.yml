name: Build Coordinate Font 0005

on:
  workflow_dispatch:
  push:
    branches:
      - beta
    paths:
      - viewer/artwork/Fonts/FontLab/build-coordinate-font-0005.py
      - .github/workflows/build-coordinate-font-0005.yml

permissions:
  contents: write

jobs:
  build-coordinate-font:
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Install FontForge
        run: |
          sudo apt-get update
          sudo apt-get install -y fontforge python3-fontforge

      - name: Build and capture audit
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          /usr/bin/python3 viewer/artwork/Fonts/FontLab/build-coordinate-font-0005.py 2>&1 | tee viewer/artwork/Fonts/FontLab/build-coordinate-font-0005.log

      - name: Commit font or diagnostic log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "viewer/artwork/Fonts/FontLab/build-coordinate-font-0005.log"
          if test -f "viewer/artwork/Fonts/Space Age Regular GV-9/GV-Coordinate-Digits-0005.otf"; then
            git add -- "viewer/artwork/Fonts/Space Age Regular GV-9/GV-Coordinate-Digits-0005.otf"
          fi
          if git diff --cached --quiet; then
            echo "No generated output changed."
          else
            git commit -m "Record coordinate font 0005 build result"
            git push origin beta
          fi

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
