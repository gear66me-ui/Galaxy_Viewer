name: Build Coordinate Font 0005

on:
  workflow_dispatch:
  push:
    branches:
      - beta
    paths:
      - viewer/artwork/Fonts/FontLab/build-coordinate-font-0005.py
      - .github/workflows/build-coordinate-font-0005.yml

permissions:
  contents: write

jobs:
  build-coordinate-font:
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Install FontForge
        run: |
          sudo apt-get update
          sudo apt-get install -y fontforge python3-fontforge

      - name: Build and verify coordinate font 0005
        run: |
          /usr/bin/python3 viewer/artwork/Fonts/FontLab/build-coordinate-font-0005.py

      - name: Commit generated font
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "viewer/artwork/Fonts/Space Age Regular GV-9/GV-Coordinate-Digits-0005.otf"
          if git diff --cached --quiet; then
            echo "Generated font is unchanged."
          else
            git commit -m "Build coordinate font 0005 with restored slashed zero"
            git push origin beta
          fi
