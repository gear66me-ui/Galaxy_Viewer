name: Convert distance audit CSV to Excel

on:
  push:
    branches: [release]
    paths:
      - "audit/distance-age-review/galaxy-distance-age-source-audit.csv"
      - ".github/scripts/convert_distance_audit_to_excel.py"
      - ".github/workflows/convert-distance-audit-to-excel.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook writer
        run: pip install openpyxl
      - name: Convert CSV to XLSX
        run: python .github/scripts/convert_distance_audit_to_excel.py
      - name: Commit workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/distance-age-review/galaxy-distance-age-source-audit.xlsx
          if git diff --cached --quiet; then
            echo "Workbook is already current."
          else
            git commit -m "Add Excel version of galaxy distance audit"
            git push origin HEAD:release
          fi
