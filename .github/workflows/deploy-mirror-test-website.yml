name: Deploy Mirror Test Website
on:
  push:
    branches: [release]
    paths:
      - 'mirror-test.html'
      - '.github/workflows/deploy-mirror-test-website.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mirror-test-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
      - name: Prepare website
        run: |
          mkdir -p _site
          cp mirror-test.html _site/mirror-test.html
          cp mirror-test.html _site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
