name: Deploy Galaxy Viewer public site from release

on:
  push:
    branches:
      - release
    paths:
      - 'viewer/**'
      - 'galaxy-viewer/**'
      - 'temporary-demos/**'
      - 'release-manifest.json'
      - '.github/workflows/pages-release.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 1

      - name: Verify release site and runtime pointers
        shell: bash
        run: |
          set -euo pipefail
          test -s galaxy-viewer/index.html
          test -s galaxy-viewer/assets/galaxy-viewer-disintegration-banner.jpg
          test -s viewer/releases/launch/Galaxy-Viewer-Launch/index.html
          test -s viewer/gv-current-viewer.json
          test -s viewer/RC-V1.0.0.py
          test -s viewer/Web-Browser/web-browser-current.json

          python3 - <<'PY'
          import json,re,pathlib,urllib.parse
          root=pathlib.Path('.')

          vp=json.loads((root/'viewer/gv-current-viewer.json').read_text())
          src=(root/'viewer'/vp['viewer']).read_text()
          m=re.search(r"GV200001_BUILD='(\d+)'",src)
          if not m or m.group(1)!=str(vp['build']):
              raise SystemExit(f"Viewer build mismatch: pointer={vp.get('build')} source={m.group(1) if m else 'missing'}")

          bp=json.loads((root/'viewer/Web-Browser/web-browser-current.json').read_text())
          prefix='/Galaxy_Viewer/'
          u=urllib.parse.urlparse(bp['config'])
          if prefix not in u.path:
              raise SystemExit('Unexpected browser config URL: '+bp['config'])
          cfg_path=root/u.path.split(prefix,1)[1]
          if not cfg_path.is_file():
              raise SystemExit('Browser config missing: '+str(cfg_path))
          cfg=json.loads(cfg_path.read_text())
          if str(cfg.get('version'))!=str(bp.get('version')):
              raise SystemExit(f"Browser version mismatch: pointer={bp.get('version')} config={cfg.get('version')}")
          for key in ('topShell','bottomShell'):
              su=urllib.parse.urlparse(cfg[key])
              rel=su.path.split(prefix,1)[1]
              if not (root/rel).is_file():
                  raise SystemExit(f'{key} missing: {rel}')

          print('RELEASE POINTERS OK build='+str(vp['build'])+' browser='+str(bp['version']))
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
