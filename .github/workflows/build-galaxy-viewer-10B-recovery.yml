name: Build Galaxy Viewer 10B Recovery

on:
  push:
    branches:
      - beta
    paths:
      - '.github/workflows/build-galaxy-viewer-10B-recovery.yml'

permissions:
  contents: write

jobs:
  build-10b:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Verify exact 10A baseline and protected assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object viewer/GV-beta-0010A.py)" = "cab3be7681858c940f650b9d25713657a24c7031"
          test "$(git hash-object viewer/artwork/icon.svg)" = "829faf3594e85d4ff529d3c2b069a309d580b054"
          test "$(git hash-object viewer/artwork/Hubble/Hubble-NASA-ESA-logo.png)" = "9283e83cfbacd230551e9fc005794138be59709b"
          test "$(git hash-object viewer/artwork/Hubble/Hubble-NASA-ESA-BW.png)" = "5b597839833f4b7a7d477e720fd12949e8515ac6"
          test "$(git hash-object viewer/modules/gv-random-galaxy-0028.js)" = "625b8d889f67652fa19a39b8689e306ea1c1fb91"
          test ! -e viewer/GV-beta-0010B.py

      - name: Generate exact standalone 10B and forensic audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import difflib, hashlib, json, subprocess

          src=Path('viewer/GV-beta-0010A.py')
          dst=Path('viewer/GV-beta-0010B.py')
          raw=src.read_bytes()
          text=raw.decode('utf-8')

          assert subprocess.check_output(['git','hash-object',str(src)],text=True).strip()=='cab3be7681858c940f650b9d25713657a24c7031'
          assert len(raw)==70852, len(raw)
          assert len(text)==70843, len(text)
          assert raw.count(b'\n')==1165, raw.count(b'\n')
          assert text.count(' ')==10493, text.count(' ')
          assert text.count('\t')==0
          assert not text.endswith('\n')

          changes=[]
          def once(old,new,label,req):
              global text
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected 1 occurrence, got {count}')
              text=text.replace(old,new,1)
              changes.append({'label':label,'requirement':req,'old':old,'new':new})

          once('# GV-beta-0010A','# GV-beta-0010B','header identity',1)
          once('.gv-10a-version','.gv-10b-version','startup CSS class',2)
          once("version.className='gv-10a-version';version.textContent='VERSION 10A'","version.className='gv-10b-version';version.textContent='VERSION 10B'",'startup label',2)
          once("    const VERSION='10A';\n    const DISPLAY_VERSION='10A';","    const VERSION='10B';\n    const DISPLAY_VERSION='10B';",'runtime identity',1)

          old_p="    presentationStyle.textContent='#gv-random-galaxy{font-size:15.5px!important;border:1px solid #4F8CFF!important;box-shadow:inset 0 0 8px rgba(167,255,203,.38),0 0 9px rgba(79,140,255,.55)!important;filter:brightness(1.08)}.gv-galaxy-history{border:1px solid #4F8CFF!important;box-shadow:inset 0 0 8px rgba(167,255,203,.38),0 0 9px rgba(79,140,255,.55)!important;filter:brightness(1.08)}.gvrg-hd-science,.gvrg-hd-viewport{box-sizing:border-box!important;width:min(620px,96vw)!important;border:1px solid #78FFAB!important;border-radius:8px!important}.gvrg-hd-science{background:rgba(0,12,8,.88)!important;box-shadow:inset 0 0 6px rgba(120,255,171,.10),0 0 8px rgba(87,255,147,.22)!important}.gvrg-hd-viewport{left:50%!important;right:auto!important;transform:translateX(-50%);background:#020B07!important;box-shadow:inset 0 0 6px rgba(120,255,171,.10),0 0 8px rgba(87,255,147,.22)!important}.gvrg-hd-icon-button{background:#020604!important;border:1px solid #4F8CFF!important;border-radius:7px!important;box-shadow:0 0 7px rgba(79,140,255,.38)!important}.gvrg-hd-icon-button img{background:transparent!important;border-radius:5px!important}';"
          new_p="    presentationStyle.textContent='#gv-random-galaxy{font-size:15.5px!important;border:3px solid #4F8CFF!important;box-shadow:inset 0 0 9px rgba(167,255,203,.42),0 0 12px rgba(79,140,255,.92),0 0 20px rgba(79,140,255,.50)!important;filter:brightness(1.10)}.gv-galaxy-history{border:3px solid #4F8CFF!important;box-shadow:inset 0 0 9px rgba(167,255,203,.42),0 0 12px rgba(79,140,255,.92),0 0 20px rgba(79,140,255,.50)!important;filter:brightness(1.10)}.gvrg-hd-science,.gvrg-hd-viewport{box-sizing:border-box!important;width:min(620px,96vw)!important;border:1px solid #78FFAB!important;border-radius:8px!important}.gvrg-hd-science{background:rgba(0,12,8,.88)!important;box-shadow:inset 0 0 6px rgba(120,255,171,.10),0 0 8px rgba(87,255,147,.22)!important}.gvrg-hd-viewport{left:50%!important;right:auto!important;transform:translateX(-50%);background:#020B07!important;box-shadow:inset 0 0 6px rgba(120,255,171,.10),0 0 8px rgba(87,255,147,.22)!important}.gvrg-hd-icon-button{background:linear-gradient(145deg,rgba(18,105,65,.96),rgba(31,176,96,.94))!important;border:2px solid #ff8214!important;border-radius:5px!important;box-shadow:inset 0 0 7px rgba(167,255,203,.28),0 0 8px rgba(255,130,20,.38),0 0 14px rgba(255,130,20,.18)!important}.gvrg-hd img{scale:1.052632}';"
          once(old_p,new_p,'10B presentation override',11)

          old_icon="    if(hubbleIcon)hubbleIcon.src='https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/4383b1848bdc747ed0eaf45c8d300019cd312492/viewer/artwork/Hubble/Hubble-NASA-ESA-BW.png';"
          new_icon="    if(hubbleIcon)hubbleIcon.src='https://gear66me-ui.github.io/Galaxy_Viewer/viewer/artwork/Hubble/Hubble-NASA-ESA-logo.png?v=9283e83cfbacd230551e9fc005794138be59709b';"
          once(old_icon,new_icon,'restore original Hubble icon',3)
          once('# GV-beta-0010A staged','# GV-beta-0010B staged','staged identity',1)

          out=text.encode('utf-8')
          assert not out.endswith(b'\n')
          dst.write_bytes(out)
          subprocess.run(['python','-m','py_compile',str(dst)],check=True)

          # Required authorized markers.
          assert "const VERSION='10B';" in text
          assert "const DISPLAY_VERSION='10B';" in text
          assert "version.textContent='VERSION 10B'" in text
          assert 'font-size:15.5px!important' in text
          assert '#gv-random-galaxy{font-size:15.5px!important;border:3px solid #4F8CFF!important' in text
          assert '.gv-galaxy-history{border:3px solid #4F8CFF!important' in text
          assert '.gvrg-hd-science,.gvrg-hd-viewport{box-sizing:border-box!important;width:min(620px,96vw)!important;border:1px solid #78FFAB!important;border-radius:8px!important}' in text
          assert 'background:linear-gradient(145deg,rgba(18,105,65,.96),rgba(31,176,96,.94))!important;border:2px solid #ff8214!important' in text
          assert 'Hubble-NASA-ESA-logo.png?v=9283e83cfbacd230551e9fc005794138be59709b' in text
          assert 'Hubble-NASA-ESA-BW.png' not in text
          assert '.gvrg-hd img{scale:1.052632}' in text
          assert 'HUBBLE_PREFETCH_TARGET=10' in text
          assert 'suspendBackgroundWork();' in text
          assert 'resumeBackgroundWork();' in text
          assert "img.src='artwork/icon.svg'" in text

          # Exact character accounting.
          sm=difflib.SequenceMatcher(a=raw.decode('utf-8'),b=text,autojunk=False)
          ins=dele=0
          opcodes=[]
          for tag,i1,i2,j1,j2 in sm.get_opcodes():
              if tag!='equal':
                  opcodes.append({'tag':tag,'before':[i1,i2],'after':[j1,j2],'old':raw.decode('utf-8')[i1:i2],'new':text[j1:j2]})
              if tag in ('insert','replace'): ins += j2-j1
              if tag in ('delete','replace'): dele += i2-i1

          audit={
            'baseline_blob':subprocess.check_output(['git','hash-object',str(src)],text=True).strip(),
            'candidate_blob':subprocess.check_output(['git','hash-object',str(dst)],text=True).strip(),
            'bytes_before':len(raw),'bytes_after':len(out),'byte_delta':len(out)-len(raw),
            'chars_before':len(raw.decode('utf-8')),'chars_after':len(text),'char_delta':len(text)-len(raw.decode('utf-8')),
            'lines_before':raw.count(b'\n')+1,'lines_after':out.count(b'\n')+1,
            'spaces_before':raw.decode('utf-8').count(' '),'spaces_after':text.count(' '),
            'tabs_before':raw.decode('utf-8').count('\t'),'tabs_after':text.count('\t'),
            'newlines_before':raw.count(b'\n'),'newlines_after':out.count(b'\n'),
            'final_newline_before':raw.endswith(b'\n'),'final_newline_after':out.endswith(b'\n'),
            'inserted_characters':ins,'deleted_characters':dele,
            'sha256':hashlib.sha256(out).hexdigest(),
            'authorized_replacements':changes,
            'diff_opcode_count':len(opcodes),
          }
          Path('/tmp/gv10b-audit.json').write_text(json.dumps(audit,indent=2)+'\n',encoding='utf-8')
          Path('/tmp/gv10b-opcodes.json').write_text(json.dumps(opcodes,indent=2)+'\n',encoding='utf-8')
          Path('/tmp/gv10b.diff').write_text(''.join(difflib.unified_diff(raw.decode('utf-8').splitlines(True),text.splitlines(True),fromfile='GV-beta-0010A.py',tofile='GV-beta-0010B.py')),encoding='utf-8')
          print(json.dumps(audit,indent=2))
          print(Path('/tmp/gv10b.diff').read_text(encoding='utf-8'))
          PY
          git diff --no-index --check viewer/GV-beta-0010A.py viewer/GV-beta-0010B.py || rc=$?; test "${rc:-1}" = 1

      - name: Build standalone Android working tree from audited 10B
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import importlib.util, re, shutil, sys
          root=Path('.').resolve()
          sys.path.insert(0,str(root/'.github/scripts'))
          spec=importlib.util.spec_from_file_location('gv9im',root/'.github/scripts/prepare_galaxy_viewer_9im.py')
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          mod.VIEWER=root/'viewer/GV-beta-0010B.py'
          mod.copy_assets()
          shutil.copy2(root/'viewer/artwork/icon.svg',mod.ASSETS/'artwork/icon.svg')
          mod.patch_packaged_splash()
          mod.build_standalone()
          index=mod.ASSETS/'index.html'
          s=index.read_text(encoding='utf-8').replace('<title>GALAXY VIEWER 9I-M</title>','<title>GALAXY VIEWER 10B</title>',1)
          index.write_text(s,encoding='utf-8')
          mod.base.patch_android()
          gradle=mod.ANDROID/'app/build.gradle'
          g=gradle.read_text(encoding='utf-8')
          g=re.sub(r'versionCode\s+\d+','versionCode 21',g,count=1)
          g=re.sub(r"versionName\s+'[^']+'","versionName '10B'",g,count=1)
          gradle.write_text(g,encoding='utf-8')
          manifest=mod.ANDROID/'app/src/main/AndroidManifest.xml'
          m=manifest.read_text(encoding='utf-8')
          m=re.sub(r'android:label="[^"]+"','android:label="GALAXY VIEWER 10B"',m,count=1)
          manifest.write_text(m,encoding='utf-8')
          s=index.read_text(encoding='utf-8')
          for marker in ["DISPLAY_VERSION='10B'","version.textContent='VERSION 10B'",'border:3px solid #4F8CFF!important','border:2px solid #ff8214!important','Hubble-NASA-ESA-logo.png?v=9283e83cfbacd230551e9fc005794138be59709b','.gvrg-hd img{scale:1.052632}',"splash.src='splash/index.html'",'},3500);']:
              assert marker in s, marker
          assert 'Hubble-NASA-ESA-BW.png' not in s
          assert (mod.ASSETS/'artwork/icon.svg').read_bytes()==(root/'viewer/artwork/icon.svg').read_bytes()
          PY

      - name: Browser smoke test 10B Viewer
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          python -m http.server 8765 --bind 127.0.0.1 --directory android/galaxy-viewer-9i/app/src/main/assets >/tmp/gv10b-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID >/dev/null 2>&1 || true' EXIT
          sleep 1
          set +e
          timeout 100s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --enable-webgl --ignore-gpu-blocklist --virtual-time-budget=70000 --dump-dom 'http://127.0.0.1:8765/index.html?smoke=1' >/tmp/gv10b-dom.html 2>/tmp/gv10b-chrome.log
          RC=$?
          set -e
          grep -q 'data-viewer-status="ready"' /tmp/gv10b-dom.html
          echo "10B browser smoke PASS rc=$RC"

      - name: Commit only 10B source and remove temporary workflow
        id: source_commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Galaxy Viewer Build Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git stash push --include-untracked -m 10b-android-working-tree -- android/galaxy-viewer-9i
          git fetch origin beta
          git rebase origin/beta
          test "$(git hash-object viewer/GV-beta-0010A.py)" = "cab3be7681858c940f650b9d25713657a24c7031"
          test "$(git hash-object viewer/GV-beta-0010B.py)" = "$(python -c "import json;print(json.load(open('/tmp/gv10b-audit.json'))['candidate_blob'])")"
          git add viewer/GV-beta-0010B.py
          git rm .github/workflows/build-galaxy-viewer-10B-recovery.yml
          git diff --cached --check
          CHANGED="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n%s\n' '.github/workflows/build-galaxy-viewer-10B-recovery.yml' 'viewer/GV-beta-0010B.py' | sort)"
          test "$CHANGED" = "$EXPECTED"
          git commit -m 'Release standalone Galaxy Viewer 10B'
          git push origin HEAD:beta
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_blob=$(git hash-object viewer/GV-beta-0010B.py)" >> "$GITHUB_OUTPUT"
          git stash pop
          test "$(git hash-object viewer/GV-beta-0010A.py)" = "cab3be7681858c940f650b9d25713657a24c7031"
          test "$(git hash-object viewer/artwork/icon.svg)" = "829faf3594e85d4ff529d3c2b069a309d580b054"
          test "$(git hash-object viewer/artwork/Hubble/Hubble-NASA-ESA-logo.png)" = "9283e83cfbacd230551e9fc005794138be59709b"
          test "$(git hash-object viewer/artwork/Hubble/Hubble-NASA-ESA-BW.png)" = "5b597839833f4b7a7d477e720fd12949e8515ac6"
          test "$(git hash-object viewer/modules/gv-random-galaxy-0028.js)" = "625b8d889f67652fa19a39b8689e306ea1c1fb91"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build 10B APK
        working-directory: android/galaxy-viewer-9i
        run: gradle --no-daemon :app:assembleDebug

      - name: Inspect exact APK payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from zipfile import ZipFile
          apk='android/galaxy-viewer-9i/app/build/outputs/apk/debug/app-debug.apk'
          with ZipFile(apk) as z:
              names=set(z.namelist())
              for required in ['assets/index.html','assets/splash/index.html','assets/data/gv-hubble-galaxies-full-0002.json','assets/artwork/icon.svg']:
                  assert required in names, required
              s=z.read('assets/index.html').decode('utf-8')
              for marker in ["DISPLAY_VERSION='10B'","version.textContent='VERSION 10B'",'border:3px solid #4F8CFF!important','border:2px solid #ff8214!important','Hubble-NASA-ESA-logo.png?v=9283e83cfbacd230551e9fc005794138be59709b','.gvrg-hd img{scale:1.052632}',"splash.src='splash/index.html'",'},3500);']:
                  assert marker in s, marker
              assert 'Hubble-NASA-ESA-BW.png' not in s
              assert z.read('assets/artwork/icon.svg') == open('viewer/artwork/icon.svg','rb').read()
          PY

      - name: Stage hash and upload APK
        shell: bash
        run: |
          set -euo pipefail
          cp android/galaxy-viewer-9i/app/build/outputs/apk/debug/app-debug.apk Galaxy-Viewer-10B.apk
          sha256sum Galaxy-Viewer-10B.apk | tee Galaxy-Viewer-10B.sha256
          cat /tmp/gv10b-audit.json

      - name: Upload 10B artifact
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Viewer-10B
          path: |
            Galaxy-Viewer-10B.apk
            Galaxy-Viewer-10B.sha256
          if-no-files-found: error

      - name: Publish immutable 10B release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.source_commit.outputs.source_commit }}
          SOURCE_BLOB: ${{ steps.source_commit.outputs.source_blob }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view galaxy-viewer-10b >/dev/null 2>&1; then
            echo '10B release already exists; refusing overwrite.' >&2
            exit 1
          fi
          gh release create galaxy-viewer-10b Galaxy-Viewer-10B.apk Galaxy-Viewer-10B.sha256 --target "$SOURCE_COMMIT" --title 'Galaxy Viewer 10B — Android' --notes "Standalone Galaxy Viewer 10B from frozen 10A blob cab3be7681858c940f650b9d25713657a24c7031. Restores original Hubble logo/green-orange button treatment, strengthens blue navigation borders, and applies a modest 1.052632 HD presentation scale for approximately 95% visible framing while preserving source pixels and pan/zoom logic. 10B source blob: $SOURCE_BLOB."
