name: Build Galaxy Viewer GENERIC APK
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/build-galaxy-viewer-10g-fresh-now.yml']
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: beta}
      - name: Expose build run ID
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='galaxy-viewer-generic-apk' -f description="GENERIC build ${GITHUB_RUN_ID}" -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Preflight pointer and launcher source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time,urllib.request
          B='https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/beta/viewer/'
          req=urllib.request.Request(B+'gv-current-viewer.json?t='+str(time.time_ns()),headers={'Cache-Control':'no-cache, no-store','Pragma':'no-cache'})
          with urllib.request.urlopen(req,timeout=30) as r:p=json.load(r)
          v=p['viewer'].strip(); assert v.startswith('GV-beta-') and v.endswith('.py'),v
          with urllib.request.urlopen(B+v+'?t='+str(time.time_ns()),timeout=30) as r:s=r.read().decode('utf-8')
          assert 'display(HTML("""' in s and 'display(Javascript(r"""' in s
          print('POINTER='+v)
          PY
          grep -q 'gv-current-viewer.json' mobile/beta/GV-GENERIC-app.html
          grep -q 'const \[html,js\]=extract(source)' mobile/beta/GV-GENERIC-app.html
          grep -q 'background:#000' mobile/beta/GV-GENERIC-app.html
      - name: Build GENERIC APK
        shell: bash
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/gv"; rm -rf "$R"
          mkdir -p "$R/app/src/main/java/com/gear66me/galaxyviewergeneric" "$R/app/src/main/res/values" "$R/app/src/main/res/drawable" "$R/app/src/main/res/mipmap-anydpi" "$R/app/src/main/res/mipmap-anydpi-v26"
          cat > "$R/settings.gradle" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='GVGeneric'; include ':app'
          EOF
          echo "plugins { id 'com.android.application' version '8.7.3' apply false }" > "$R/build.gradle"
          cat > "$R/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.gear66me.galaxyviewergeneric'; compileSdk 35; defaultConfig { applicationId 'com.gear66me.galaxyviewergeneric'; minSdk 23; targetSdk 35; versionCode 9; versionName 'GENERIC' } }
          EOF
          echo '<resources><color name="black">#000000</color></resources>' > "$R/app/src/main/res/values/colors.xml"
          cat > "$R/app/src/main/res/values/styles.xml" <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.NoActionBar"><item name="android:windowBackground">#000000</item><item name="android:navigationBarColor">#000000</item><item name="android:statusBarColor">#000000</item><item name="android:windowLightStatusBar">false</item><item name="android:windowLightNavigationBar">false</item></style></resources>
          EOF
          cat > "$R/app/src/main/res/drawable/ic_target_foreground.xml" <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="32" android:viewportHeight="32"><path android:fillColor="#000000" android:strokeColor="#FFFFFF" android:strokeWidth="1.8" android:pathData="M16,6.5 A9.5,9.5 0,1 1,15.99 6.5"/><path android:fillColor="#00000000" android:strokeColor="#FFFFFF" android:strokeWidth="2.2" android:pathData="M4.5,16 C7,9.5 25,9.5 27.5,16 C25,22.5 7,22.5 4.5,16"/><path android:fillColor="#00000000" android:strokeColor="#FFFFFF" android:strokeWidth="1.6" android:pathData="M10.3,16 C11.8,12.7 20.2,12.7 21.7,16 C20.2,19.3 11.8,19.3 10.3,16"/><path android:fillColor="#FFFFFF" android:pathData="M16,14.4 A1.6,1.6 0,1 1,15.99 14.4"/><path android:fillColor="#00000000" android:strokeColor="#FFFFFF" android:strokeWidth="1.6" android:strokeLineCap="round" android:pathData="M16,2.5 L16,7 M16,25 L16,29.5 M2.5,16 L7,16 M25,16 L29.5,16"/></vector>
          EOF
          cat > "$R/app/src/main/res/mipmap-anydpi/ic_launcher.xml" <<'EOF'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:drawable="@color/black"/><item android:drawable="@drawable/ic_target_foreground" android:gravity="center"/></layer-list>
          EOF
          cp "$R/app/src/main/res/mipmap-anydpi/ic_launcher.xml" "$R/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml"
          cat > "$R/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/black"/><foreground android:drawable="@drawable/ic_target_foreground"/></adaptive-icon>
          EOF
          cp "$R/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" "$R/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml"
          cat > "$R/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:allowBackup="false" android:hardwareAccelerated="true" android:label="Galaxy Viewer" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:theme="@style/AppTheme" android:usesCleartextTraffic="false"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > "$R/app/src/main/java/com/gear66me/galaxyviewergeneric/MainActivity.java" <<'EOF'
          package com.gear66me.galaxyviewergeneric;
          import android.app.*;import android.graphics.Color;import android.net.Uri;import android.os.Bundle;import android.view.View;import android.webkit.*;import android.widget.TextView;
          public final class MainActivity extends Activity{
            private static final String URL="https://gear66me-ui.github.io/Galaxy_Viewer/mobile/beta/GV-GENERIC-app.html"; private WebView web;
            @Override public void onCreate(Bundle b){super.onCreate(b);getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_FULLSCREEN|View.SYSTEM_UI_FLAG_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY|View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN|View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_LAYOUT_STABLE);web=new WebView(this);web.setBackgroundColor(Color.BLACK);WebSettings s=web.getSettings();s.setJavaScriptEnabled(true);s.setDomStorageEnabled(true);s.setDatabaseEnabled(true);s.setCacheMode(WebSettings.LOAD_NO_CACHE);s.setMediaPlaybackRequiresUserGesture(false);web.setWebChromeClient(new WebChromeClient());web.setWebViewClient(new WebViewClient(){@Override public boolean shouldOverrideUrlLoading(WebView v,WebResourceRequest r){Uri u=r.getUrl();return u==null||!"https".equalsIgnoreCase(u.getScheme());}@Override public void onReceivedError(WebView v,WebResourceRequest r,WebResourceError e){if(r.isForMainFrame())fatal("PAGE LOAD ERROR: "+e.getDescription());}@Override public void onReceivedHttpError(WebView v,WebResourceRequest r,WebResourceResponse e){if(r.isForMainFrame())fatal("PAGE HTTP ERROR: "+e.getStatusCode());}});setContentView(web);web.loadUrl(URL+"?t="+System.currentTimeMillis());}
            private void fatal(String m){runOnUiThread(()->{TextView t=new TextView(this);t.setText("GALAXY VIEWER FAILED TO LOAD\n\n"+m);t.setTextColor(Color.WHITE);t.setBackgroundColor(Color.BLACK);t.setTextSize(16);t.setPadding(40,40,40,40);setContentView(t);});}
            @Override public void onBackPressed(){if(web!=null&&web.canGoBack())web.goBack();else super.onBackPressed();}
          }
          EOF
          cd "$R"; gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Galaxy-Viewer-GENERIC.apk"
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"; SIGN="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s Galaxy-Viewer-GENERIC.apk
          unzip -t Galaxy-Viewer-GENERIC.apk | tee apk-zip-test.txt
          "$AAPT" dump badging Galaxy-Viewer-GENERIC.apk | tee apk-badging.txt
          grep -q "package: name='com.gear66me.galaxyviewergeneric'" apk-badging.txt
          grep -q "application-label:'Galaxy Viewer'" apk-badging.txt
          DEX=$(mktemp); unzip -p Galaxy-Viewer-GENERIC.apk classes.dex > "$DEX"; strings "$DEX" > apk-dex-strings.txt
          grep -q 'GV-GENERIC-app.html' apk-dex-strings.txt
          ! grep -q 'GV-beta-0010G.py' apk-dex-strings.txt
          "$SIGN" verify --verbose --print-certs Galaxy-Viewer-GENERIC.apk | tee apk-signature.txt
          sha256sum Galaxy-Viewer-GENERIC.apk | tee Galaxy-Viewer-GENERIC.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Viewer-GENERIC
          path: |
            Galaxy-Viewer-GENERIC.apk
            Galaxy-Viewer-GENERIC.apk.sha256
            apk-badging.txt
            apk-signature.txt
            apk-zip-test.txt
          if-no-files-found: error
      - name: Publish direct-download release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          TAG=galaxy-viewer-generic
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" Galaxy-Viewer-GENERIC.apk Galaxy-Viewer-GENERIC.apk.sha256 --target "$GITHUB_SHA" --title 'Galaxy Viewer GENERIC' --notes 'Stable pointer-driven launcher on GitHub Pages origin. Black adaptive launcher background with white target.'
      - name: Report success
        if: success()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='galaxy-viewer-generic-apk' -f description="GENERIC APK ready ${GITHUB_RUN_ID}" -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Report failure
        if: failure()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='galaxy-viewer-generic-apk' -f description="GENERIC build failed ${GITHUB_RUN_ID}" -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
