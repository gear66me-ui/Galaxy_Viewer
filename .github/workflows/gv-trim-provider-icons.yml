name: GV trim ESO NOIRLab icons

on:
  push:
    paths:
      - '.github/workflows/gv-trim-provider-icons.yml'

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Trim provider icons to rounded tile edge
        shell: bash
        run: |
          set -euo pipefail

          # Use the original full-resolution ESO artwork from repository history.
          git show a82a636b8841c7be9d4d1371f88a025b5bf10f09:viewer/artwork/ESO/eso_observatory_night_sky_icon.png > /tmp/eso-source.png

          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          import hashlib

          def trim_like_front_tile(src, dst, inset):
              im = Image.open(src).convert('RGB')
              w, h = im.size
              if w != h:
                  raise RuntimeError(f'Expected square image: {src} -> {im.size}')

              crop = im.crop((inset, inset, w-inset, h-inset))
              crop = crop.resize((w, h), Image.Resampling.LANCZOS)

              mask = Image.new('L', (w, h), 0)
              draw = ImageDraw.Draw(mask)
              radius = round(w * 0.14)
              draw.rounded_rectangle((0, 0, w-1, h-1), radius=radius, fill=255)

              out = Image.new('RGB', (w, h), 'black')
              out.paste(crop, (0, 0), mask)
              out.save(dst, format='PNG', optimize=True)

              size = Path(dst).stat().st_size
              digest = hashlib.sha256(Path(dst).read_bytes()).hexdigest()
              print(f'{dst}: {w}x{h} inset={inset} radius={radius} bytes={size} sha256={digest}')
              if size < 250000:
                  raise RuntimeError(f'Unexpectedly small output: {dst} {size} bytes')

          trim_like_front_tile(
              '/tmp/eso-source.png',
              'viewer/artwork/ESO/eso_observatory_night_sky_icon.png',
              18,
          )

          trim_like_front_tile(
              'viewer/artwork/NoirLabs/noirlab-icon.png',
              'viewer/artwork/NoirLabs/noirlab-icon.png',
              18,
          )
          PY

      - name: Audit exact image changes
        shell: bash
        run: |
          set -euo pipefail
          echo "=== CHANGED FILES ==="
          git diff --name-only

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n'             viewer/artwork/ESO/eso_observatory_night_sky_icon.png             viewer/artwork/NoirLabs/noirlab-icon.png | sort)"
          test "$changed" = "$expected"

          echo "=== IMAGE METADATA ==="
          file viewer/artwork/ESO/eso_observatory_night_sky_icon.png
          file viewer/artwork/NoirLabs/noirlab-icon.png
          ls -lh viewer/artwork/ESO/eso_observatory_night_sky_icon.png viewer/artwork/NoirLabs/noirlab-icon.png

          echo "=== RANDOM GALAXY REFERENCES UNCHANGED ==="
          grep -R -n -m2 'viewer/artwork/NoirLabs/noirlab-icon.png' viewer/modules/random-galaxy/gv-random-galaxy-*.js | tail -2
          grep -R -n -m2 'viewer/artwork/ESO/eso_observatory_night_sky_icon.png' viewer/modules/random-galaxy/gv-random-galaxy-*.js | tail -2

      - name: Commit trimmed icons
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- viewer/artwork/ESO/eso_observatory_night_sky_icon.png viewer/artwork/NoirLabs/noirlab-icon.png
          git commit -m "Trim ESO and NOIRLab provider icons to tile edge"
          git push origin HEAD:beta
