name: Patch Hanny Voorwerp HD image in catalog 0017
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/build-galaxy-viewer-10e-repair-r4.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Replace heic1102b HD image metadata with heic1102a
        shell: bash
        run: |
          set -euo pipefail
          FILE='viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0017.json'
          test "$(git hash-object "$FILE")" = '97e4eeb8249607288040d070b7bdc36a9e5ab789'
          URL='https://cdn.esahubble.org/archives/images/large/heic1102a.jpg'
          curl -fL --retry 3 --retry-delay 2 "$URL" -o /tmp/heic1102a.jpg
          BYTES=$(stat -c%s /tmp/heic1102a.jpg)
          SHA=$(sha256sum /tmp/heic1102a.jpg | awk '{print $1}')
          export BYTES SHA
          python3 - <<'PY'
          import json, math, os
          from pathlib import Path
          p=Path('viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0017.json')
          data=json.loads(p.read_text())
          byid={e.get('archiveId'):e for e in data['entries']}
          t=byid['heic1102b']
          assert 'Hanny' in (t.get('name') or '')
          assert t.get('science',{}).get('distanceMly') == 650.0
          t['fieldOfView']='0.79 x 1.11 arcminutes'
          t['orientation']='North is 17.8° right of vertical'
          t['pixelSize']='1194 x 1674 px'
          t['credit']='NASA, ESA, William Keel (University of Alabama, Tuscaloosa), and the Galaxy Zoo team'
          t['sourceUrl']='https://esahubble.org/images/heic1102a/'
          t['esaPublicationJpeg']=None
          t['jpegCandidates']=[
            'https://cdn.esahubble.org/archives/images/large/heic1102a.jpg',
            'https://cdn.esahubble.org/archives/images/screen/heic1102a.jpg'
          ]
          t['selectedImageUrl']='https://cdn.esahubble.org/archives/images/large/heic1102a.jpg'
          t['githubImageUrl']='https://cdn.esahubble.org/archives/images/large/heic1102a.jpg'
          t['assetName']='heic1102a.jpg'
          t['bytes']=int(os.environ['BYTES'])
          t['sha256']=os.environ['SHA']
          t['downloadErrors']=[]
          # Update image-span size for the replacement FOV at the preserved 650 Mly distance.
          dly=650_000_000.0
          spans=[]
          for amin in (0.79,1.11):
              spans.append(round(dly*math.radians(amin/60.0)/1000.0,3))
          s=t.setdefault('science',{})
          s['sizeKly']=spans
          s['sizeMethod']='distance_fov_estimate_heic1102a_replacement_0017'
          s['sizeEstimated']=True
          s['sizeDisplay']=f"EST. {spans[0]:.0f} x {spans[1]:.0f} KLY"
          t['imageReplacement0017']={
            'replacementArchiveId':'heic1102a',
            'reason':'Use the user-approved Hubble composite showing IC 2497 and Hanny’s Voorwerp instead of the infrared-only heic1102b frame.',
            'preservedTargetArchiveId':'heic1102b',
            'uploadedImageMatchedToOfficialAsset':True
          }
          # Preserve/fix canonical designation.
          t['designation']='IC 2497'
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          PY
          python3 -m json.tool "$FILE" >/dev/null
          python3 - <<'PY'
          import json
          d=json.load(open('viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0017.json'))
          t=next(e for e in d['entries'] if e.get('archiveId')=='heic1102b')
          assert t['selectedImageUrl']=='https://cdn.esahubble.org/archives/images/large/heic1102a.jpg'
          assert t['fieldOfView']=='0.79 x 1.11 arcminutes'
          assert t['pixelSize']=='1194 x 1674 px'
          assert t['designation']=='IC 2497'
          assert t['imageReplacement0017']['replacementArchiveId']=='heic1102a'
          print('Hanny Voorwerp replacement verified:',t['selectedImageUrl'],t['bytes'],t['sha256'])
          PY
          test "$(git status --porcelain | wc -l)" -eq 1
          git status --porcelain | grep -q " $FILE$"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          git commit -m 'Catalog 0017: use Hubble heic1102a for Hanny Voorwerp'
          for attempt in 1 2 3; do
            git fetch origin beta
            git rebase origin/beta
            if git push origin beta; then exit 0; fi
            sleep 2
          done
          exit 1
