name: Surgical Galaxy Viewer 10E Random Repair
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/build-galaxy-viewer-10e-repair-r4.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Apply exact 10E repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object viewer/GV-beta-0010E.py)" = "8912ac5f7c9bb4fabf970b4f3b9eef99107e2a69"
          test "$(git hash-object viewer/modules/gv-random-galaxy-0030.js)" = "c17d7c8d48e71b7e91ac3ed28ee3c55786a82385"
          python - <<'PY'
          from pathlib import Path
          p=Path('viewer/GV-beta-0010E.py')
          s=p.read_text(encoding='utf-8')
          old="random.id='gv-random-galaxy';random.type='button';random.textContent='RANDOM GALAXY';random.setAttribute('aria-label','RANDOM GALAXY');"
          new="random.id='gv-random-galaxy';random.type='button';random.textContent='RANDOM GALAXY ✨';random.setAttribute('aria-label','RANDOM GALAXY');"
          if s.count(old)!=1: raise SystemExit(f'button label anchor count {s.count(old)}')
          s=s.replace(old,new,1)
          old="        bindClick:true,"
          new="        bindClick:false,"
          if s.count(old)!=1: raise SystemExit(f'bindClick anchor count {s.count(old)}')
          s=s.replace(old,new,1)
          old="    window.__gv10eRandomGalaxy=randomGalaxy;\n    await randomGalaxy.ready;\n    const presentationStyle=document.createElement('style');"
          new="""    window.__gv10eRandomGalaxy=randomGalaxy;\n    await randomGalaxy.ready;\n    bottom.random.disabled=false;\n    const launchRandomGalaxy=()=>{\n        if(navigationPending||randomGalaxy.getState().busy)return;\n        randomGalaxy.travelToRandom().catch(error=>{\n            navigationPending=false;pendingHistoryIndex=null;forcedDestination=null;endTravelHud();setHistoryControls();resumeBackgroundWork();console.error('GV-10E RANDOM GALAXY CLICK FAILURE',error);\n        });\n    };\n    bottom.random.addEventListener('click',launchRandomGalaxy);\n    const presentationStyle=document.createElement('style');"""
          if s.count(old)!=1: raise SystemExit(f'ready anchor count {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile viewer/GV-beta-0010E.py
          grep -Fq "random.textContent='RANDOM GALAXY ✨'" viewer/GV-beta-0010E.py
          grep -Fq 'bindClick:false' viewer/GV-beta-0010E.py
          grep -Fq "bottom.random.addEventListener('click',launchRandomGalaxy)" viewer/GV-beta-0010E.py
          grep -Fq 'formatCompactHdScale' viewer/modules/gv-random-galaxy-0030.js
          grep -Fq 'G LY' viewer/modules/gv-random-galaxy-0030.js
          test "$(git hash-object viewer/modules/gv-random-galaxy-0030.js)" = "c17d7c8d48e71b7e91ac3ed28ee3c55786a82385"
      - name: Restore workflow and commit only effective 10E change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout HEAD^ -- .github/workflows/build-galaxy-viewer-10e-repair-r4.yml
          git add viewer/GV-beta-0010E.py .github/workflows/build-galaxy-viewer-10e-repair-r4.yml
          git diff --cached --name-only | sort | tee /tmp/staged.txt
          printf '%s\n' .github/workflows/build-galaxy-viewer-10e-repair-r4.yml viewer/GV-beta-0010E.py | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/staged.txt
          git commit -m 'Restore 10E Random Galaxy control and add sparkle icon'
          git fetch origin beta
          git rebase origin/beta
          git push origin HEAD:beta
