name: Surgical Galaxy Viewer 10E HD Scale Font
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/build-galaxy-viewer-10e-repair-r4.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Apply exact HD scale font increase
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object viewer/GV-beta-0010E.py)" = "bef86acce85b3d0fa3211b73412d2621ddffe734"
          python - <<'PY'
          from pathlib import Path
          p=Path('viewer/GV-beta-0010E.py')
          s=p.read_text(encoding='utf-8')
          old='.gvrg-hd img{scale:1.052632}'
          new='.gvrg-hd-scale,.gvrg-hd-scale-label{font-size:13.5px!important}.gvrg-hd img{scale:1.052632}'
          if s.count(old)!=1: raise SystemExit(f'HD scale insertion anchor count {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile viewer/GV-beta-0010E.py
          grep -Fq '.gvrg-hd-scale,.gvrg-hd-scale-label{font-size:13.5px!important}' viewer/GV-beta-0010E.py
          test "$(git hash-object viewer/modules/gv-random-galaxy-0030.js)" = "c17d7c8d48e71b7e91ac3ed28ee3c55786a82385"
      - name: Commit only 10E source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/GV-beta-0010E.py
          test "$(git diff --cached --name-only)" = "viewer/GV-beta-0010E.py"
          git commit -m 'Increase 10E Hubble HD scale label font by 50 percent'
          git fetch origin beta
          git rebase origin/beta
          git push origin HEAD:beta
