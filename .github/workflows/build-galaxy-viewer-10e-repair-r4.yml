name: TEMP Surgical Antennae Catalog Repair
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/build-galaxy-viewer-10e-repair-r4.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Replace only opo9734e representative image with potw1345a
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy, json, pathlib
          p = pathlib.Path('viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0017.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data.get('version') == 'full-0017', data.get('version')
          entries = data['entries']
          assert len(entries) == 1879, len(entries)
          byid = {e.get('archiveId'): e for e in entries}
          assert 'opo9734e' in byid and 'potw1345a' in byid
          target = byid['opo9734e']
          source = byid['potw1345a']
          assert target.get('selectedImageUrl','').endswith('/opo9734e.jpg')
          assert target.get('pixelSize') == '120 x 120 px'
          assert source.get('selectedImageUrl','').endswith('/potw1345a.jpg')
          assert source.get('pixelSize') == '4240 x 4211 px'
          before = copy.deepcopy(entries)
          original = {
              'archiveId': target.get('archiveId'),
              'title': target.get('title'),
              'sourceUrl': target.get('sourceUrl'),
              'selectedImageUrl': target.get('selectedImageUrl'),
              'fieldOfView': target.get('fieldOfView'),
              'pixelSize': target.get('pixelSize'),
          }
          # Make this legacy close-up entry present the scientifically coherent,
          # whole-Antennae Hubble observation already validated in this catalog.
          # Keep the original archiveId so catalog cardinality/order remain unchanged.
          copy_fields = [
              'name','title','ra','dec','raText','decText','distance','constellation',
              'fieldOfView','orientation','imageType','releaseDate','pixelSize','credit',
              'sourceUrl','esaPublicationJpeg','jpegCandidates','license','licenseUrl',
              'imageStatus','selectedImageUrl','assetName','bytes','sha256','downloadErrors',
              'githubImageUrl','releaseTag','science','constellationMethod','designation',
              'displayName','imageReview'
          ]
          for k in copy_fields:
              if k in source:
                  target[k] = copy.deepcopy(source[k])
              else:
                  target.pop(k, None)
          target['archiveId'] = 'opo9734e'
          target['imageSubstitution0017'] = {
              'representativeImageSourceArchiveId': 'potw1345a',
              'reason': 'Replace 120x120 star-formation subfield with whole Antennae Galaxies Hubble observation for representative HD display.',
              'original': original,
          }
          changed = [i for i,(a,b) in enumerate(zip(before, entries)) if a != b]
          assert changed == [next(i for i,e in enumerate(entries) if e.get('archiveId')=='opo9734e')], changed
          assert target['selectedImageUrl'] == source['selectedImageUrl']
          assert target['fieldOfView'] == source['fieldOfView']
          assert target['pixelSize'] == source['pixelSize']
          assert target['science'] == source['science']
          assert byid['potw1345a'] == source
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print('TARGET', target['archiveId'], target['title'])
          print('IMAGE', target['selectedImageUrl'])
          print('FOV', target['fieldOfView'], 'PIXELS', target['pixelSize'])
          print('SOURCE_RECORD_UNCHANGED', source['archiveId'])
          PY
          python -m json.tool viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0017.json >/dev/null
          git status --porcelain
          test "$(git status --porcelain | wc -l)" -eq 1
          git status --porcelain | grep -q '^ M viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0017.json$'
      - name: Commit only catalog 0017
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0017.json
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = 'viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0017.json'
          git commit -m 'Fix Antennae representative HD image in catalog 0017'
          git push origin HEAD:beta
