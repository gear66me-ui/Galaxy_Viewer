name: Surgical 10E Four Image Replacements And Image Size Label
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/build-galaxy-viewer-10e-repair-r4.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Patch catalog and 10E only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          cat=Path('viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0017.json')
          vp=Path('viewer/GV-beta-0010E.py')
          data=json.loads(cat.read_text())
          records=data if isinstance(data,list) else data.get('records') or data.get('galaxies') or data.get('items')
          assert isinstance(records,list) and len(records)==1879, len(records) if isinstance(records,list) else type(records)
          def txt(r): return ' '.join(str(r.get(k,'')) for k in ('archiveId','name','title','designation','objectName','pseudoName')).lower()
          def by_archive(a):
            m=[r for r in records if str(r.get('archiveId','')).lower()==a.lower()]
            assert len(m)==1,(a,len(m)); return m[0]
          sources={a:by_archive(a) for a in ('potw1352a','heic0819b','potw2116a','potw1345a')}
          def pick(label,pred):
            m=[r for r in records if pred(r)]
            assert len(m)==1,(label,len(m),[(x.get('archiveId'),x.get('title')) for x in m[:20]])
            return m[0]
          targets={
            'M65':pick('M65',lambda r:'messier 65 through the years' in txt(r)),
            'NGC253':pick('NGC253',lambda r:'behind a dusty veil' in txt(r)),
            'NGC4603':pick('NGC4603',lambda r:'galactic close-up' in txt(r) and '4603' in txt(r)),
            'AntennaeGround':pick('AntennaeGround',lambda r:'ground-based image' in txt(r) and ('4038' in txt(r) or 'antennae' in txt(r))),
          }
          image_keys=('pixelWidth','pixelHeight','width','height','fovArcmin','fovWidthArcmin','fovHeightArcmin','fov','sourceUrl','esaUrl','publicationImage','imageUrl','selectedImageUrl','hdUrl','githubImageUrl','assetFilename','byteCount','imageSha256','downloadError','credit','orientation','sizeKly','sizeLightYears','sizeLy','imageSizeLy','imageSpanLightYears','imageSpanKly','sizeEstimated','sizeMethod','sizeSource')
          pairs=(('M65','potw1352a'),('NGC253','heic0819b'),('NGC4603','potw2116a'),('AntennaeGround','potw1345a'))
          changed=[]
          for key,srcid in pairs:
            dst,src=targets[key],sources[srcid]
            oldid=dst.get('archiveId')
            copied=[]
            for k in image_keys:
              if k in src:
                dst[k]=src[k]; copied.append(k)
            dst['imageReplacement0017']={
              'replacementArchiveId':srcid,
              'replacesPresentationForArchiveId':oldid,
              'reason':'approved better color/full-frame Hubble presentation',
              'copiedImageMetadataFields':copied
            }
            changed.append((key,oldid,srcid))
          cat.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          s=vp.read_text()
          marker="const DISPLAY_VERSION='10E';"
          assert marker in s
          inject="""const DISPLAY_VERSION='10E';
    const relabelImageSize=()=>{
      document.querySelectorAll('.gvrg-field-label').forEach((el)=>{
        if((el.textContent||'').trim().toUpperCase()==='SIZE'){
          el.innerHTML='IMAGE SIZE<br><span style=\"font-size:.72em;letter-spacing:.25px\">(FOV)</span>';
        }
      });
    };
    const imageSizeLabelObserver=new MutationObserver(relabelImageSize);
    imageSizeLabelObserver.observe(document.documentElement,{subtree:true,childList:true});
    relabelImageSize();"""
          assert s.count(marker)==1
          s=s.replace(marker,inject,1)
          vp.write_text(s)
          print('CATALOG REPLACEMENTS',changed)
          PY
          python -m py_compile viewer/GV-beta-0010E.py
          test "$(git hash-object viewer/modules/gv-random-galaxy-0030.js)" = "c17d7c8d48e71b7e91ac3ed28ee3c55786a82385"
          python - <<'PY'
          import json
          p='viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0017.json'
          d=json.load(open(p)); r=d if isinstance(d,list) else d.get('records') or d.get('galaxies') or d.get('items')
          assert len(r)==1879
          for a in ('potw1352a','heic0819b','potw2116a','potw1345a'):
            assert any(x.get('imageReplacement0017',{}).get('replacementArchiveId')==a for x in r),a
          PY
          mapfile -t changed < <(git status --porcelain | sed 's/^...//')
          printf 'CHANGED %s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | sort > /tmp/actual
          printf '%s\n' 'viewer/GV-beta-0010E.py' 'viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0017.json' | sort > /tmp/allowed
          diff -u /tmp/allowed /tmp/actual
      - name: Commit exact two-file repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/GV-beta-0010E.py viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0017.json
          git commit -m 'Update four Hubble presentations and label image FOV size'
          git pull --rebase origin beta
          git push origin HEAD:beta
