name: Surgical Galaxy Viewer 10E Hubble Preload Retention
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/build-galaxy-viewer-10e-repair-r4.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Preserve active Hubble HD preload through travel
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object viewer/modules/gv-random-galaxy-0030.js)" = "c17d7c8d48e71b7e91ac3ed28ee3c55786a82385"
          python - <<'PY'
          from pathlib import Path
          p=Path('viewer/GV-beta-0010E.py')
          s=p.read_text(encoding='utf-8')
          replacements=[
            ("        if(activePrefetchKey){const active=galaxyCatalog.find(item=>destinationKey(item)===activePrefetchKey);if(active)setHdStatus(active,'SUSPENDED')}\n        if(activePrefetchAbort)activePrefetchAbort.abort();\n", ""),
            ("                if(backgroundWorkSuspended||signal?.aborted)throw new DOMException('HUBBLE HD PRELOAD SUSPENDED','AbortError');", "                if(signal?.aborted)throw new DOMException('HUBBLE HD PRELOAD SUSPENDED','AbortError');"),
            ("                        if(backgroundWorkSuspended||controller.signal.aborted)throw abortError();", "                        if(controller.signal.aborted)throw abortError();\n                        if(backgroundWorkSuspended)return;"),
            ("                if(backgroundWorkSuspended){releasePreparedItem(item);throw abortError()}\n                if(key===activeTargetKey&&!activePreparedItem){", "                if(backgroundWorkSuspended){\n                    if(key===activeTargetKey&&!activePreparedItem){\n                        activePreparedItem=item;\n                        window.__gv10eRandomGalaxy?.setPreparedHdResource?.(key,item.objectUrl,item.sourceKind,item.image);\n                    }else if(prefetchReady.length<HUBBLE_PREFETCH_TARGET)prefetchReady.push(item);else releasePreparedItem(item);\n                    return;\n                }\n                if(key===activeTargetKey&&!activePreparedItem){")
          ]
          for old,new in replacements:
              if s.count(old)!=1:
                  raise SystemExit(f'preload repair anchor count {s.count(old)} for {old[:80]!r}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python -m py_compile viewer/GV-beta-0010E.py
          grep -Fq "if(signal?.aborted)throw new DOMException('HUBBLE HD PRELOAD SUSPENDED','AbortError');" viewer/GV-beta-0010E.py
          grep -Fq 'if(backgroundWorkSuspended)return;' viewer/GV-beta-0010E.py
          if grep -Fq 'if(activePrefetchAbort)activePrefetchAbort.abort();' viewer/GV-beta-0010E.py; then
            count=$(grep -Fo 'if(activePrefetchAbort)activePrefetchAbort.abort();' viewer/GV-beta-0010E.py | wc -l)
            test "$count" -eq 1
          fi
      - name: Commit only 10E source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/GV-beta-0010E.py
          test "$(git diff --cached --name-only)" = "viewer/GV-beta-0010E.py"
          git commit -m 'Preserve active 10E Hubble preload through travel'
          git fetch origin beta
          git rebase origin/beta
          git push origin HEAD:beta
