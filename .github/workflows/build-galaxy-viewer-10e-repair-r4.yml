name: Patch Cartwheel HD image in catalog 0017
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/build-galaxy-viewer-10e-repair-r4.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Replace opo9502a HD image metadata with potw1036a
        shell: bash
        run: |
          set -euo pipefail
          FILE='viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0017.json'
          test "$(git hash-object "$FILE")" = '5d8419d522e01a330dd9d3f4eefc52c61de2c11f'
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0017.json')
          data=json.loads(p.read_text())
          entries=data['entries']
          byid={e.get('archiveId'):e for e in entries}
          target=byid['opo9502a']
          source=byid['potw1036a']
          assert 'Cartwheel' in (target.get('name') or '')
          assert 'Cartwheel' in (source.get('name') or '')
          assert target.get('science',{}).get('distanceMly') == 500.0
          image_fields=['fieldOfView','orientation','pixelSize','credit','sourceUrl','esaPublicationJpeg','jpegCandidates','imageStatus','selectedImageUrl','assetName','bytes','sha256','downloadErrors','githubImageUrl','releaseTag']
          for k in image_fields:
              target[k]=source.get(k)
          # Keep target identity/coordinates/distance/age. Carry source image geometry-derived size.
          for k in ['sizeKly','sizeMethod','sizeEstimated','sizeDisplay']:
              if k in source.get('science',{}):
                  target.setdefault('science',{})[k]=source['science'][k]
          target['imageReplacement0017']={
              'replacementArchiveId':'potw1036a',
              'reason':'Use the approved reprocessed wide Hubble Cartwheel image instead of the older presentation image.',
              'preservedTargetArchiveId':'opo9502a'
          }
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          PY
          python3 -m json.tool "$FILE" >/dev/null
          python3 - <<'PY'
          import json
          p='viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0017.json'
          d=json.load(open(p))
          byid={e['archiveId']:e for e in d['entries']}
          t,s=byid['opo9502a'],byid['potw1036a']
          assert t['selectedImageUrl']==s['selectedImageUrl']
          assert t['assetName']==s['assetName']
          assert t['fieldOfView']==s['fieldOfView']
          assert t['pixelSize']==s['pixelSize']
          assert t['science']['distanceMly']==500.0
          assert t['imageReplacement0017']['replacementArchiveId']=='potw1036a'
          print('Cartwheel replacement verified:', t['selectedImageUrl'], t['fieldOfView'], t['pixelSize'])
          PY
          test "$(git status --porcelain | grep -v '^ M .github/workflows/build-galaxy-viewer-10e-repair-r4.yml$' | wc -l)" -eq 1
          git status --porcelain | grep -q " $FILE$"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          git commit -m 'Catalog 0017: use reprocessed Hubble Cartwheel image'
          git push origin beta
