# trigger: second push so GitHub registers the workflow before matching paths
name: GV one-shot Random 0227 WCS repair

on:
  push:
    branches:
      - beta
    paths:
      - '.github/workflows/gv-one-shot-random-0227-wcs-repair.yml'

permissions:
  contents: write

jobs:
  patch-random-0227:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          persist-credentials: true

      - name: Patch Random 0227 and restore BD pointer
        run: |
          python3 - <<'PY'
          from pathlib import Path

          random_path = Path('viewer/modules/random-galaxy/gv-random-galaxy-0227.js')
          pointer_path = Path('viewer/gv-current-viewer.json')
          workflow_path = Path('.github/workflows/gv-one-shot-random-0227-wcs-repair.yml')

          text = random_path.read_text(encoding='utf-8')

          old = """            const centerAuthority=gv0223ImageCenterFromWcs(wcs,actualWidth,actualHeight);
            const cameraRa=ra;
            const cameraDec=dec;"""

          new = """            const centerAuthority=gv0223ImageCenterFromWcs(wcs,actualWidth,actualHeight);
            const centerRa=Number(centerAuthority?.ra);
            const centerDec=Number(centerAuthority?.dec);
            const cameraRa=Number.isFinite(centerRa)?centerRa:ra;
            const cameraDec=Number.isFinite(centerDec)?centerDec:dec;"""

          count = text.count(old)
          print(f'RANDOM_0227_BAD_CAMERA_BLOCK_COUNT={count}')
          if count != 1:
              raise SystemExit('FAIL: expected exactly one bad camera authority block')

          random_path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          pointer_path.write_text(
              '{\n  "version": "12AR-132BD",\n  "viewer": "GV-12AR-132BD.py"\n}\n',
              encoding='utf-8',
              newline='\n'
          )

          workflow_path.unlink(missing_ok=True)
          PY

      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add viewer/modules/random-galaxy/gv-random-galaxy-0227.js viewer/gv-current-viewer.json .github/workflows/gv-one-shot-random-0227-wcs-repair.yml
          git commit -m "Repair Random 0227 WCS image-center authority"
          git push origin HEAD:beta
