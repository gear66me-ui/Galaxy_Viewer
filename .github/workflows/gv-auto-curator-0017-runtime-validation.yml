name: GV Auto Curator 0017 Runtime Validation

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/gv-auto-curator-0017-runtime-validation.yml'
      - 'viewer/image-databases/master-database/orientation-review/gv-auto-curator-0017.html'
      - 'viewer/image-databases/master-database/orientation-review/gv-curator-server-analysis-0001.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Validate curator 0017 in real Chromium
        run: |
          python - <<'PY'
          import asyncio,json,subprocess
          from pathlib import Path
          from playwright.async_api import async_playwright

          repo=Path.cwd()
          srv=subprocess.Popen(['python','-m','http.server','8765','--bind','127.0.0.1'],cwd=repo,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          url='http://127.0.0.1:8765/viewer/image-databases/master-database/orientation-review/gv-auto-curator-0017.html'

          async def main():
            try:
              async with async_playwright() as p:
                b=await p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
                page=await b.new_page(viewport={'width':1100,'height':900})
                errors=[]
                page.on('pageerror',lambda e: errors.append('PAGEERROR '+str(e)))
                page.on('console',lambda m: errors.append('CONSOLE '+m.type+' '+m.text) if m.type=='error' else None)
                await page.goto(url,wait_until='domcontentloaded',timeout=60000)

                # Wait for the final 0014-derived document, catalog load, and Aladin initialization.
                ready=False
                for _ in range(240):
                  txt=(await page.locator('body').inner_text())[:3000]
                  if '0017 STARTUP ERROR' in txt:
                    raise SystemExit(txt)
                  try:
                    ready=await page.evaluate("typeof rows!=='undefined' && rows.length>0 && typeof aladin!=='undefined' && !!aladin && document.querySelector('[data-r=\"-0.1\"]') && document.querySelector('[data-r=\"0.1\"]')")
                  except Exception:
                    ready=False
                  if ready: break
                  await asyncio.sleep(.5)
                if not ready:
                  raise SystemExit('0017 did not reach catalog/Aladin ready state; errors='+json.dumps(errors[-12:]))

                ui=await page.evaluate("""() => ({
                  title:document.querySelector('.title')?.textContent,
                  minus:document.querySelector('[data-r="-0.1"]')?.textContent,
                  plus:document.querySelector('[data-r="0.1"]')?.textContent,
                  sliderStep:document.querySelector('#rotRange')?.step,
                  numberStep:document.querySelector('#rotDeg')?.step,
                  store:typeof STORE!=='undefined'?STORE:null
                })""")
                print('0017 UI',json.dumps(ui,indent=2))
                if ui['title']!='GALAXY VIEWER AUTO CURATOR 0017': raise SystemExit('0017 title/version mismatch')
                if ui['minus']!='−0.1°' or ui['plus']!='+0.1°': raise SystemExit('±0.1° buttons missing')
                if float(ui['sliderStep'])!=0.1 or float(ui['numberStep'])!=0.1: raise SystemExit('0.1° slider/input precision missing')
                if ui['store']!='gv-auto-curator-0017': raise SystemExit('0017 store key mismatch')

                # Put the validated NGC 4636 row in the active slot and let the real page position Aladin.
                probe=await page.evaluate("""async () => {
                  const x=rows.find(z=>z.key==='Chandra:chandra-2001-0144');
                  if(!x) return {error:'NGC 4636 row missing'};
                  const m=machineOf(x);
                  queue=[x];qpos=0;
                  await showCurrent(true);
                  await new Promise(r=>setTimeout(r,700));
                  return {machine:m,center:currentCenter(),fov:currentFov(),rot:currentRot(),gate:targetVerified,name:nameOf(x.r)};
                }""")
                print('NGC4636 RUNTIME',json.dumps(probe,indent=2))
                if probe.get('error'): raise SystemExit(probe['error'])
                m=probe['machine']
                if not m or abs(float(m['ra'])-190.709059)>.000001 or abs(float(m['dec'])-2.6862401)>.000001: raise SystemExit('NGC 4636 did not consume server-validated center')
                if abs(float(m['fov'])-.084082743)>.000001 or abs(float(m['rot']))>.000001: raise SystemExit('NGC 4636 did not consume server-validated FoV/rotation')
                if abs(float(m['confidence'])-1)>.000001 or not m.get('p',{}).get('registration',{}).get('serverValidated'): raise SystemExit('Server-validation provenance missing from machine candidate')
                c=probe['center']
                if not c or abs(float(c[0])-float(m['ra']))>.003 or abs(float(c[1])-float(m['dec']))>.003 or not probe['gate']: raise SystemExit('Live Aladin center gate failed for NGC 4636')
                if abs(float(probe['fov'])-float(m['fov']))>.015: raise SystemExit('Live Aladin FoV mismatch for NGC 4636')
                if abs(float(probe['rot'])-float(m['rot']))>.5: raise SystemExit('Live Aladin rotation mismatch for NGC 4636')

                # Exercise the new buttons, not just their markup.
                await page.evaluate('setRot(0)'); await asyncio.sleep(.25)
                await page.locator('[data-r="-0.1"]').click(); await asyncio.sleep(.35)
                rminus=await page.evaluate('currentRot()')
                await page.locator('[data-r="0.1"]').click(); await asyncio.sleep(.35)
                rback=await page.evaluate('currentRot()')
                print('ROTATION NUDGE',json.dumps({'afterMinus0_1':rminus,'afterPlus0_1':rback},indent=2))
                if abs(float(rminus)-(-.1))>.06: raise SystemExit(f'-0.1° button readback failed: {rminus}')
                if abs(float(rback)-0)>.06: raise SystemExit(f'+0.1° button readback failed: {rback}')

                await page.screenshot(path='gv-auto-curator-0017-runtime.png',full_page=True)
                await b.close()
            finally:
              srv.terminate();srv.wait(timeout=10)

          asyncio.run(main())
          PY

      - name: Upload runtime screenshot
        uses: actions/upload-artifact@v4
        with:
          name: gv-auto-curator-0017-runtime
          path: gv-auto-curator-0017-runtime.png
          if-no-files-found: error
