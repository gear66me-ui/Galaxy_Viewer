name: Fix 10V HD archive preload once

on:
  push:
    branches: [beta]
    paths:
      - .github/workflows/fix-10v-hd-archive-preload-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Apply surgical HD archive preload repair
        run: |
          set -euo pipefail
          test "$(git hash-object viewer/GV-beta-0010V.py)" = "87944256a5a0c197254bc3a5f9738548d8c7c0c4"
          python - <<'PY'
          from pathlib import Path
          p=Path('viewer/GV-beta-0010V.py')
          s=p.read_text()

          old="""    let archiveSourceUrl='';\n    let archiveClosing=false;\n    const setArchiveLoading=loading=>{\n        hdArchiveButton.classList.toggle('gv-archive-loading',loading);\n        archiveOverlay.classList.toggle('gv-archive-loading',loading);\n    };\n"""
          new="""    let archiveSourceUrl='';\n    let archiveLoadedUrl='';\n    let archiveOpenRequested=false;\n    let archiveClosing=false;\n    const setArchiveLoading=loading=>{\n        hdArchiveButton.classList.toggle('gv-archive-loading',loading);\n        archiveOverlay.classList.toggle('gv-archive-loading',loading);\n    };\n    const preloadArchiveSource=destination=>{\n        const sourceUrl=String(destination?.sourceUrl||'').trim();\n        if(!/^https:\\/\\//i.test(sourceUrl)||archiveSourceUrl===sourceUrl)return;\n        archiveSourceUrl=sourceUrl;\n        archiveLoadedUrl='';\n        archiveOpenRequested=false;\n        archiveClosing=false;\n        archiveOverlay.classList.remove('gv-open');\n        archiveOverlay.style.pointerEvents='none';\n        archiveOverlay.setAttribute('aria-hidden','true');\n        archiveFrame.style.pointerEvents='none';\n        archiveFrame.src=sourceUrl;\n    };\n"""
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)

          old="""        archiveFrame.blur();\n        archiveSourceUrl='';\n        archiveFrame.src='about:blank';\n        setTimeout(()=>{\n"""
          new="""        archiveFrame.blur();\n        archiveOpenRequested=false;\n        setTimeout(()=>{\n"""
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)

          old="""    archiveFrame.addEventListener('load',()=>{\n        if(!archiveSourceUrl||archiveClosing)return;\n        setArchiveLoading(false);\n        archiveOverlay.removeAttribute('aria-hidden');\n        archiveOverlay.style.pointerEvents='auto';\n        archiveOverlay.classList.add('gv-open');\n        archiveFrame.style.pointerEvents='auto';\n    });\n    archiveFrame.addEventListener('error',()=>{\n        const sourceUrl=archiveSourceUrl;\n        closeArchiveOverlay();\n        if(sourceUrl)window.open(sourceUrl,'_blank','noopener,noreferrer');\n    });\n"""
          new="""    archiveFrame.addEventListener('load',()=>{\n        if(!archiveSourceUrl||archiveClosing)return;\n        archiveLoadedUrl=archiveSourceUrl;\n        if(!archiveOpenRequested)return;\n        setArchiveLoading(false);\n        archiveOverlay.removeAttribute('aria-hidden');\n        archiveOverlay.style.pointerEvents='auto';\n        archiveOverlay.classList.add('gv-open');\n        archiveFrame.style.pointerEvents='auto';\n    });\n    archiveFrame.addEventListener('error',()=>{\n        const sourceUrl=archiveSourceUrl;\n        const requested=archiveOpenRequested;\n        archiveLoadedUrl='';\n        archiveOpenRequested=false;\n        setArchiveLoading(false);\n        if(requested&&sourceUrl)window.open(sourceUrl,'_blank','noopener,noreferrer');\n    });\n"""
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)

          old="""        archiveSourceUrl=sourceUrl;\n        archiveClosing=false;\n        setArchiveLoading(true);\n        archiveOverlay.classList.remove('gv-open');\n        archiveOverlay.style.pointerEvents='none';\n        archiveOverlay.setAttribute('aria-hidden','true');\n        archiveFrame.style.pointerEvents='none';\n        archiveFrame.src=sourceUrl;\n"""
          new="""        archiveOpenRequested=true;\n        archiveClosing=false;\n        if(archiveLoadedUrl===sourceUrl){\n            setArchiveLoading(false);\n            archiveOverlay.removeAttribute('aria-hidden');\n            archiveOverlay.style.pointerEvents='auto';\n            archiveOverlay.classList.add('gv-open');\n            archiveFrame.style.pointerEvents='auto';\n            return;\n        }\n        setArchiveLoading(true);\n        if(archiveSourceUrl!==sourceUrl)preloadArchiveSource(destination);\n        archiveOpenRequested=true;\n"""
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)

          old="""        hdArchiveButton.setAttribute('aria-label',`OPEN ${provider} ARCHIVE SOURCE`);\n        if(randomGalaxy.hdLoading&&provider==='JWST'&&/HUBBLE/i.test(randomGalaxy.hdLoading.textContent||''))randomGalaxy.hdLoading.textContent=String(randomGalaxy.hdLoading.textContent||'').replace(/HUBBLE/gi,'JWST');\n        fitHdInfoText(destination);\n"""
          new="""        hdArchiveButton.setAttribute('aria-label',`OPEN ${provider} ARCHIVE SOURCE`);\n        preloadArchiveSource(destination);\n        if(randomGalaxy.hdLoading&&provider==='JWST'&&/HUBBLE/i.test(randomGalaxy.hdLoading.textContent||''))randomGalaxy.hdLoading.textContent=String(randomGalaxy.hdLoading.textContent||'').replace(/HUBBLE/gi,'JWST');\n        fitHdInfoText(destination);\n"""
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
          python -m py_compile viewer/GV-beta-0010V.py
          test "$(git hash-object viewer/GV-beta-0010V.py)" = "e024d6808d0beb351eee3c9f05f1c30f31ca8cd3"
          git diff --check
          git rm .github/workflows/fix-10v-hd-archive-preload-once.yml
          mapfile -t changed < <(git status --short | sed -E 's/^.. //')
          printf '%s\n' "${changed[@]}" | sort > /tmp/actual
          printf '%s\n' '.github/workflows/fix-10v-hd-archive-preload-once.yml' 'viewer/GV-beta-0010V.py' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/GV-beta-0010V.py .github/workflows/fix-10v-hd-archive-preload-once.yml
          git commit -m '10V surgical HD archive preload repair' -m 'ECO-ID: GV-10V-HD-ARCHIVE-004' -m 'AUTHORIZED-RUNTIME-PATH: viewer/GV-beta-0010V.py' -m 'TRANSPORT-HELPER: self-deleting workflow only' -m 'REQUIREMENTS: preload ESA/JWST archive while galaxy remains visible; instant reveal if ready' -m 'USER-GO: true'
          git push origin HEAD:beta
