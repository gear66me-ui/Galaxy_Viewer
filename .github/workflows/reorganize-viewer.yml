# One-shot viewer cleanup — retriggered
name: Reorganize viewer folder

on:
  push:
    branches:
      - beta
    paths:
      - .github/workflows/reorganize-viewer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reorganize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Reorganize viewer directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p viewer/archive viewer/html
          shopt -s dotglob nullglob

          for item in viewer/*; do
            name="$(basename "$item")"

            case "$name" in
              GV-beta-0004G.py|artwork|html|archive)
                continue
                ;;
            esac

            if [[ -f "$item" && "$name" == *.html ]]; then
              destination="viewer/html/$name"
            else
              destination="viewer/archive/$name"
            fi

            if [[ -e "$destination" ]]; then
              echo "Destination already exists: $destination" >&2
              exit 1
            fi

            mv "$item" "$destination"
          done

          printf '%s\n' 'Final viewer directory:'
          find viewer -mindepth 1 -maxdepth 1 -printf '%f\n' | sort

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A viewer

          if git diff --cached --quiet; then
            echo "No viewer cleanup changes were required."
            exit 0
          fi

          git commit -m "Reorganize viewer files into html and archive"
          git push origin beta
