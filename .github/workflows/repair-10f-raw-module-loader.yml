name: Repair 10F Raw Module Loader
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/repair-10f-raw-module-loader.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Repair only 10F raw JavaScript loading
        shell: bash
        run: |
          set -euo pipefail
          F='viewer/GV-beta-0010F.py'
          E='viewer/GV-beta-0010E.py'
          M30='viewer/modules/gv-random-galaxy-0030.js'
          M31='viewer/modules/gv-random-galaxy-0031.js'
          test "$(git hash-object "$F")" = '7e124b137faeb99992439b8aa4068997f7b1fc23'
          test "$(git hash-object "$E")" = '8e747b313963a14fbaf1676ff77ab7e71f906667'
          test "$(git hash-object "$M30")" = 'c17d7c8d48e71b7e91ac3ed28ee3c55786a82385'
          test "$(git hash-object "$M31")" = 'eaf76aa364853e1f997c5ec439bd8e0205a5e0c8'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('viewer/GV-beta-0010F.py')
          s=p.read_text()
          old_url="const RANDOM_GALAXY_URL='https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/beta/viewer/modules/gv-random-galaxy-0031.js?v=eaf76aa364853e1f997c5ec439bd8e0205a5e0c8';"
          new_url="const RANDOM_GALAXY_URL='https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/1e6e2de79c24164003dd313132134b3866c2ca36/viewer/modules/gv-random-galaxy-0031.js?v=eaf76aa364853e1f997c5ec439bd8e0205a5e0c8';"
          assert s.count(old_url)==1
          s=s.replace(old_url,new_url)
          old='''    function loadScript(url,datasetKey){
        return new Promise((resolve,reject)=>{
            const existing=[...document.scripts].find(script=>script.src===url||script.dataset[datasetKey]==='true');
            if(existing){
                if(existing.dataset.gvLoaded==='true'){resolve(existing);return}
                existing.addEventListener('load',()=>resolve(existing),{once:true});
                existing.addEventListener('error',()=>reject(new Error('SCRIPT FAILED TO LOAD: '+url)),{once:true});
                return;
            }
            const script=document.createElement('script');
            script.src=url;
            script.charset='utf-8';
            script.dataset[datasetKey]='true';
            script.addEventListener('load',()=>{script.dataset.gvLoaded='true';resolve(script)},{once:true});
            script.addEventListener('error',()=>reject(new Error('SCRIPT FAILED TO LOAD: '+url)),{once:true});
            document.head.appendChild(script);
        });
    }
'''
          new='''    function loadScript(url,datasetKey){
        return new Promise((resolve,reject)=>{
            const existing=[...document.scripts].find(script=>script.src===url||script.dataset[datasetKey]==='true');
            if(existing){
                if(existing.dataset.gvLoaded==='true'){resolve(existing);return}
                existing.addEventListener('load',()=>resolve(existing),{once:true});
                existing.addEventListener('error',()=>reject(new Error('SCRIPT FAILED TO LOAD: '+url)),{once:true});
                return;
            }
            const script=document.createElement('script');
            script.charset='utf-8';
            script.dataset[datasetKey]='true';
            if(/^https:\\/\\/raw\\.githubusercontent\\.com\\//.test(url)){
                fetch(url,{cache:'no-store'}).then(response=>{
                    if(!response.ok)throw new Error('SCRIPT FETCH RETURNED HTTP '+response.status+': '+url);
                    return response.text();
                }).then(source=>{
                    script.textContent=source;
                    document.head.appendChild(script);
                    script.dataset.gvLoaded='true';
                    resolve(script);
                }).catch(error=>reject(new Error('SCRIPT FAILED TO LOAD: '+url+' — '+String(error?.message||error))));
                return;
            }
            script.src=url;
            script.addEventListener('load',()=>{script.dataset.gvLoaded='true';resolve(script)},{once:true});
            script.addEventListener('error',()=>reject(new Error('SCRIPT FAILED TO LOAD: '+url)),{once:true});
            document.head.appendChild(script);
        });
    }
'''
          assert s.count(old)==1
          s=s.replace(old,new)
          p.write_text(s)
          PY
          python3 -m py_compile "$F"
          rm -rf viewer/__pycache__
          curl -fsSL 'https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/1e6e2de79c24164003dd313132134b3866c2ca36/viewer/modules/gv-random-galaxy-0031.js' -o /tmp/0031.js
          node --check /tmp/0031.js
          grep -Fq "raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/1e6e2de79c24164003dd313132134b3866c2ca36/viewer/modules/gv-random-galaxy-0031.js" "$F"
          grep -Fq "response.text()" "$F"
          grep -Fq "script.textContent=source" "$F"
          test "$(git hash-object "$E")" = '8e747b313963a14fbaf1676ff77ab7e71f906667'
          test "$(git hash-object "$M30")" = 'c17d7c8d48e71b7e91ac3ed28ee3c55786a82385'
          test "$(git hash-object "$M31")" = 'eaf76aa364853e1f997c5ec439bd8e0205a5e0c8'
          mapfile -t changed < <(git status --porcelain | awk '{print $2}')
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$F"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$F"
          git commit -m '10F: fetch raw 0031 module before JavaScript injection'
          git fetch origin beta
          git rebase origin/beta
          git push origin HEAD:beta
