name: Build Galaxy Viewer Android 10E Generic R3
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/build-galaxy-viewer-android-10E-generic-r3.yml']
  workflow_dispatch:
permissions:
  contents: write
env:
  APK_NAME: Galaxy-Viewer-10E-Generic.apk
  RELEASE_TAG: galaxy-viewer-10e-generic
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Lock protected baselines
        shell: bash
        run: |
          set -euo pipefail
          echo "NINE_I_HTML=$(git hash-object mobile/beta/9I.html)" >> "$GITHUB_ENV"
          echo "NINE_I_APP=$(git hash-object mobile/beta/9I-app.html)" >> "$GITHUB_ENV"
          echo "NINE_I_VIEWER=$(git hash-object viewer/GV-beta-0009I.py)" >> "$GITHUB_ENV"
          echo "TEN_D_VIEWER=$(git hash-object viewer/GV-beta-0010D.py)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate standalone 10E source and Android project
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, shutil
          baseline=Path('viewer/GV-beta-0010D.py')
          candidate=Path('viewer/GV-beta-0010E.py')
          if candidate.exists(): raise SystemExit('REFUSING overwrite of existing 10E')
          s=baseline.read_text(encoding='utf-8')
          for a,b in [('# GV-beta-0010D','# GV-beta-0010E'),('gv-10d-version','gv-10e-version'),('VERSION 10D','VERSION 10E'),("const VERSION='10D';","const VERSION='10E';"),("const DISPLAY_VERSION='10D';","const DISPLAY_VERSION='10E';"),('GV9I','GV10E'),('gv9i','gv10e'),('__gv9i','__gv10e'),('GV-9I','GV-10E'),('GALAXY VIEWER 9I','GALAXY VIEWER 10E'),('9I','10E'),('9i','10e'),('source=android-10d','source=android-10e')]: s=s.replace(a,b)
          candidate.write_text(s,encoding='utf-8')
          legacy=('9I-app.html','GV9I','gv9i','__gv9i','GV-9I','GALAXY VIEWER 9I','source=android-10d')
          hits=[x for x in legacy if x in s]
          if hits: raise SystemExit('Legacy 10E refs remain: '+repr(hits))
          if s.count("const VERSION='10E';")!=1 or s.count("const DISPLAY_VERSION='10E';")!=1: raise SystemExit('10E identity mismatch')
          Path('viewer/gv-current-viewer.json').write_text(json.dumps({'version':'10E','viewer':'GV-beta-0010E.py'},indent=2)+'\n',encoding='utf-8')
          gate=Path('.github/workflows/galaxy-viewer-release-gate.yml')
          g=gate.read_text(encoding='utf-8')
          old='          python -m py_compile "$CANDIDATE_PATH"\n'
          new="          python - <<'PY'\n          import os,pathlib\n          p=pathlib.Path(os.environ['CANDIDATE_PATH'])\n          compile(p.read_text(encoding='utf-8'),str(p),'exec')\n          PY\n"
          if old in g: gate.write_text(g.replace(old,new,1),encoding='utf-8')
          elif "compile(p.read_text(encoding='utf-8'),str(p),'exec')" not in g: raise SystemExit('Unexpected release gate')
          root=Path('android/galaxy-viewer-10e'); java=root/'app/src/main/java/com/gear66me/galaxyviewer10e'; assets=root/'app/src/main/assets'
          if root.exists(): raise SystemExit('REFUSING overwrite of existing 10E Android project')
          java.mkdir(parents=True); (assets/'viewer').mkdir(parents=True); (assets/'artwork').mkdir(parents=True)
          (root/'settings.gradle').write_text("pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name='GalaxyViewer10EGeneric'\ninclude ':app'\n",encoding='utf-8')
          (root/'build.gradle').write_text("plugins { id 'com.android.application' version '8.7.3' apply false }\n",encoding='utf-8')
          (root/'gradle.properties').write_text("org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=false\n",encoding='utf-8')
          (root/'app/build.gradle').write_text("plugins { id 'com.android.application' }\nandroid {\n namespace 'com.gear66me.galaxyviewer10e'\n compileSdk 35\n defaultConfig { applicationId 'com.gear66me.galaxyviewer10e'; minSdk 29; targetSdk 35; versionCode 1007; versionName '10E-generic' }\n}\n",encoding='utf-8')
          (root/'app/src/main/AndroidManifest.xml').write_text("<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"><uses-permission android:name=\"android.permission.INTERNET\"/><application android:allowBackup=\"false\" android:label=\"Galaxy Viewer 10E\" android:usesCleartextTraffic=\"false\" android:theme=\"@android:style/Theme.Material.NoActionBar\"><activity android:name=\".MainActivity\" android:configChanges=\"keyboardHidden|orientation|screenSize\" android:exported=\"true\" android:screenOrientation=\"portrait\"><intent-filter><action android:name=\"android.intent.action.MAIN\"/><category android:name=\"android.intent.category.LAUNCHER\"/></intent-filter></activity></application></manifest>\n",encoding='utf-8')
          main='package com.gear66me.galaxyviewer10e;\nimport android.app.*; import android.content.*; import android.graphics.Color; import android.net.Uri; import android.os.*; import android.view.View; import android.webkit.*; import android.widget.TextView;\npublic final class MainActivity extends Activity { private WebView web; @Override protected void onCreate(Bundle b){super.onCreate(b);getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_FULLSCREEN|View.SYSTEM_UI_FLAG_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY|View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN|View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_LAYOUT_STABLE);open();} private void open(){web=new WebView(this);web.setBackgroundColor(Color.BLACK);WebSettings s=web.getSettings();s.setJavaScriptEnabled(true);s.setDomStorageEnabled(true);s.setDatabaseEnabled(true);s.setAllowFileAccess(true);s.setAllowContentAccess(false);s.setAllowFileAccessFromFileURLs(true);s.setAllowUniversalAccessFromFileURLs(true);s.setMediaPlaybackRequiresUserGesture(false);s.setCacheMode(WebSettings.LOAD_DEFAULT);s.setUserAgentString(s.getUserAgentString()+\" GalaxyViewer10E/10E-generic\");web.setWebChromeClient(new WebChromeClient());web.setWebViewClient(new WebViewClient(){@Override public boolean shouldOverrideUrlLoading(WebView v,WebResourceRequest r){Uri u=r.getUrl();String q=u==null?\"\":u.getScheme();return !(\"https\".equalsIgnoreCase(q)||\"file\".equalsIgnoreCase(q));}@Override public void onReceivedError(WebView v,WebResourceRequest r,WebResourceError e){if(r.isForMainFrame())fatal(\"LOAD ERROR: \"+e.getDescription());}});web.setDownloadListener((url,ua,cd,mime,len)->{try{Uri u=Uri.parse(url);if(!\"https\".equalsIgnoreCase(u.getScheme()))return;DownloadManager.Request q=new DownloadManager.Request(u);q.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);q.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS,URLUtil.guessFileName(url,cd,mime));((DownloadManager)getSystemService(Context.DOWNLOAD_SERVICE)).enqueue(q);}catch(Exception ignored){}});setContentView(web);web.loadUrl(\"file:///android_asset/index.html\");} private void fatal(String m){runOnUiThread(()->{TextView t=new TextView(this);t.setText(\"GALAXY VIEWER 10E\\n\\n\"+m);t.setTextColor(Color.WHITE);t.setBackgroundColor(Color.BLACK);t.setTextSize(16);t.setPadding(40,40,40,40);setContentView(t);});} @Override public void onBackPressed(){if(web!=null&&web.canGoBack())web.goBack();else super.onBackPressed();}}\n'
          (java/'MainActivity.java').write_text(main,encoding='utf-8')
          index='<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#000"><title>GALAXY VIEWER 10E</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff}#gv-apk-cover{position:fixed;inset:0;z-index:2147483646;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;background:#000}#gv-apk-cover img{width:min(42vw,240px);max-height:42vh}.v{color:#FFD85A;font:16px sans-serif}#gv-splash-frame{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:2147483645;background:#000;visibility:hidden}#gv-launch-error{display:none;position:fixed;inset:0;z-index:2147483647;padding:24px;background:#000;color:#FFD166;white-space:pre-wrap;font:14px monospace}</style></head><body><div id="gv-apk-cover"><img src="artwork/icon.svg" alt="GALAXY VIEWER"><div class="v">VERSION 10E</div></div><iframe id="gv-splash-frame"></iframe><div id="gv-launch-error"></div><script>(async()=>{\'use strict\';const R=\'https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/beta/viewer/\',c=document.getElementById(\'gv-apk-cover\'),p=document.getElementById(\'gv-splash-frame\'),e=document.getElementById(\'gv-launch-error\');const t=async u=>{const r=await fetch(u,{cache:\'no-store\'});if(!r.ok)throw new Error(\'HTTP \'+r.status);return r.text()};const x=s=>{const h=[...s.matchAll(/display\\(HTML\\(\\"\\"\\"([\\s\\S]*?)\\"\\"\\"\\)\\)/g)],j=[...s.matchAll(/display\\(Javascript\\(r\\"\\"\\"([\\s\\S]*?)\\"\\"\\"\\)\\)/g)];if(h.length!==1||j.length!==1)throw new Error(\'Viewer extraction failed\');return[h[0][1],j[0][1]]};const q=async()=>{try{const m=JSON.parse(await t(R+\'gv-current-viewer.json?t=\'+Date.now()));return[m,await t(R+m.viewer+\'?t=\'+Date.now())]}catch(z){const m=JSON.parse(await t(\'viewer/gv-current-viewer.json\'));return[m,await t(\'viewer/\'+m.viewer)]}};const ready=()=>new Promise((ok,no)=>{const d=performance.now()+30000;const f=()=>{if(document.getElementById(\'aladin-cosmic-command-test\')?.querySelector(\'canvas\')&&window.aladin_cosmic_command_test)return ok();if(performance.now()>d)return no(new Error(\'10E Viewer readiness timeout\'));setTimeout(f,100)};f()});try{const a=performance.now();p.src=\'viewer/releases/splash/Galaxy-Viewer-Singularity-FINAL/index.html\';const[m,s]=await q();if(m.version!==\'10E\')throw new Error(\'Manifest did not select 10E\');const[h,j]=x(s);document.body.insertAdjacentHTML(\'beforeend\',h);const z=document.createElement(\'script\');z.textContent=j;document.body.appendChild(z);await new Promise(r=>setTimeout(r,Math.max(0,3500-(performance.now()-a))));p.style.visibility=\'visible\';c.remove();await Promise.all([ready(),new Promise(r=>setTimeout(r,5000))]);p.remove()}catch(z){e.style.display=\'block\';e.textContent=\'GALAXY VIEWER 10E FAILED TO LOAD\\n\\n\'+String(z?.stack||z)}})();</script></body></html>'
          (assets/'index.html').write_text(index,encoding='utf-8')
          (assets/'viewer/gv-current-viewer.json').write_text(json.dumps({'version':'10E','viewer':'GV-beta-0010E.py'},indent=2)+'\n',encoding='utf-8')
          shutil.copy2(candidate,assets/'viewer/GV-beta-0010E.py'); shutil.copy2('viewer/artwork/icon.svg',assets/'artwork/icon.svg')
          shutil.copytree('viewer/releases/splash/Galaxy-Viewer-Singularity-FINAL',assets/'viewer/releases/splash/Galaxy-Viewer-Singularity-FINAL',dirs_exist_ok=True)
          for src in ['viewer/modules/gv-hamburger-menu-0002.js','viewer/modules/gv-coordinate-overlay-0004.js','viewer/modules/gv-target-simbad-0001.js','viewer/modules/gv-random-galaxy-0028.js','viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0010.json','viewer/artwork/GV-reticle-0001.svg']:
              p=Path(src); d=assets/p; d.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p,d)
          PY
      - name: Audit active 10E code and protected hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          legacy=('9I-app.html','GV9I','gv9i','__gv9i','GV-9I','GALAXY VIEWER 9I','source=android-10d')
          files=[Path('viewer/GV-beta-0010E.py')]+[p for p in Path('android/galaxy-viewer-10e').rglob('*') if p.is_file() and p.suffix.lower() in {'.html','.java','.gradle','.properties','.xml','.py'}]
          hits=[(str(p),x) for p in files for x in legacy if x in p.read_text(encoding='utf-8')]
          if hits: raise SystemExit(repr(hits))
          PY
          test "$(git hash-object mobile/beta/9I.html)" = "$NINE_I_HTML"
          test "$(git hash-object mobile/beta/9I-app.html)" = "$NINE_I_APP"
          test "$(git hash-object viewer/GV-beta-0009I.py)" = "$NINE_I_VIEWER"
          test "$(git hash-object viewer/GV-beta-0010D.py)" = "$TEN_D_VIEWER"
          test ! -d viewer/__pycache__
      - name: Build APK
        run: gradle --no-daemon -p android/galaxy-viewer-10e :app:assembleDebug
      - name: Validate packaged APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android/galaxy-viewer-10e/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.gear66me.galaxyviewer10e'" /tmp/badging.txt
          grep -q "application-label:'Galaxy Viewer 10E'" /tmp/badging.txt
          grep -q "launchable-activity: name='com.gear66me.galaxyviewer10e.MainActivity'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -l "$APK" | grep -q 'assets/viewer/gv-current-viewer.json'
          unzip -l "$APK" | grep -q 'assets/viewer/GV-beta-0010E.py'
          rm -rf /tmp/apk10e; mkdir /tmp/apk10e; unzip -qq "$APK" -d /tmp/apk10e
          ! grep -RInaE '9I-app\.html|GV9I|gv9i|__gv9i|GV-9I|GALAXY VIEWER 9I|source=android-10d' /tmp/apk10e
          cp "$APK" "$APK_NAME"
          sha256sum "$APK_NAME" | tee "${APK_NAME}.sha256"
      - name: Commit release sources without protected paths
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object mobile/beta/9I.html)" = "$NINE_I_HTML"
          test "$(git hash-object mobile/beta/9I-app.html)" = "$NINE_I_APP"
          test "$(git hash-object viewer/GV-beta-0009I.py)" = "$NINE_I_VIEWER"
          test "$(git hash-object viewer/GV-beta-0010D.py)" = "$TEN_D_VIEWER"
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/GV-beta-0010E.py viewer/gv-current-viewer.json android/galaxy-viewer-10e .github/workflows/galaxy-viewer-release-gate.yml
          git diff --cached --name-only | tee /tmp/changed.txt
          ! grep -E '^mobile/beta/9I|^viewer/GV-beta-0009I|^android/galaxy-viewer-9i' /tmp/changed.txt
          git commit -m 'Release standalone Galaxy Viewer 10E and generic APK shell'
          git fetch origin beta; git rebase origin/beta; git push origin HEAD:beta
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Viewer-10E-Generic
          path: |
            Galaxy-Viewer-10E-Generic.apk
            Galaxy-Viewer-10E-Generic.apk.sha256
      - name: Publish immutable APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ! gh release view "$RELEASE_TAG" >/dev/null 2>&1
          gh release create "$RELEASE_TAG" "$APK_NAME" "${APK_NAME}.sha256" --target "$RELEASE_COMMIT" --title 'Galaxy Viewer 10E — Generic APK' --notes 'Standalone 10E generic installer. Starts from file:///android_asset/index.html and viewer/gv-current-viewer.json. 9I public website, 9I app launcher, 9I Viewer, and 10D baseline were hash-verified unchanged.'
