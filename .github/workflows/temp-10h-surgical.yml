name: TEMP 10H surgical restoration
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/temp-10h-surgical.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Build verify and commit 10H
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re, difflib, hashlib

          gpath=Path('viewer/GV-beta-0010G.py')
          hpath=Path('viewer/GV-beta-0010H.py')
          lpath=Path('mobile/beta/GV-10H-app.html')
          ppath=Path('viewer/gv-current-viewer.json')
          wpath=Path('.github/workflows/temp-10h-surgical.yml')
          g=gpath.read_text()
          g_sha=hashlib.sha256(g.encode()).hexdigest()
          h=g

          h=h.replace('# GV-beta-0010G\n','# GV-beta-0010H\n',1)
          h=h.replace("const VERSION='10G';","const VERSION='10H';",1)
          h=h.replace("const DISPLAY_VERSION='10G';","const DISPLAY_VERSION='10H';",1)
          h=h.replace("version.textContent='VERSION 10G';","version.textContent='VERSION 10H';",1)
          h=h.replace('# GV-beta-0010G staged','# GV-beta-0010H staged')
          h=h.replace('GV-10G','GV-10H').replace('GALAXY VIEWER 10G','GALAXY VIEWER 10H')
          h=h.replace(
              "const ALADIN_URL='https://gear66me-ui.github.io/Galaxy_Viewer/aladin-source-clone/dist/aladin.js';",
              "const ALADIN_URL='https://aladin.cds.unistra.fr/AladinLite/api/v3/3.8.2/aladin.js';",1)

          icon_css="#gv-hd-info-link{position:absolute;right:20px;bottom:20px;z-index:8;display:inline-flex;width:46px;height:46px;align-items:center;justify-content:center;border:1px solid #78FFAB;border-radius:6px;background:rgba(0,12,8,.32);overflow:hidden;pointer-events:auto;touch-action:manipulation;cursor:pointer}#gv-hd-info-link img{display:block;max-width:40px;max-height:40px;object-fit:contain}#gv-archive-overlay{position:fixed;inset:0;z-index:2147483000;background:#000;display:none}#gv-archive-overlay.gv-open{display:block}#gv-archive-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}#gv-archive-back{position:absolute;left:50%;bottom:18px;z-index:2147483647;transform:translateX(-50%);height:44px;padding:0 18px;border:2px solid #ABB3AA;border-radius:6px;background:linear-gradient(145deg,rgba(18,105,65,.98),rgba(31,176,96,.98));color:#E8FFF0;font:400 11px/1 \"Space Age\",sans-serif;letter-spacing:.55px;text-transform:uppercase;white-space:nowrap;box-shadow:0 0 12px rgba(0,0,0,.75);pointer-events:auto;touch-action:manipulation;cursor:pointer}"
          h,n=re.subn(r'#gv-hd-back-to-viewer\{[^}]*\}',lambda m:icon_css,h,count=1)
          assert n==1, f'HD back CSS substitution count {n}'

          archive_block="""    const hdInfoLink=document.createElement('button');
    hdInfoLink.id='gv-hd-info-link';
    hdInfoLink.type='button';
    hdInfoLink.setAttribute('aria-label','OPEN ARCHIVE SOURCE INFORMATION');
    const hdInfoIcon=document.createElement('img');
    hdInfoIcon.id='gv-hd-info-icon';
    hdInfoIcon.alt='ARCHIVE SOURCE';
    hdInfoLink.appendChild(hdInfoIcon);
    randomGalaxy.hdViewport?.appendChild(hdInfoLink);

    const archiveOverlay=document.createElement('div');
    archiveOverlay.id='gv-archive-overlay';
    const archiveFrame=document.createElement('iframe');
    archiveFrame.id='gv-archive-frame';
    archiveFrame.title='GALAXY ARCHIVE SOURCE';
    const archiveBack=document.createElement('button');
    archiveBack.id='gv-archive-back';
    archiveBack.type='button';
    archiveBack.textContent='← BACK TO GALAXY VIEWER';
    archiveBack.setAttribute('aria-label','BACK TO GALAXY VIEWER');
    archiveOverlay.append(archiveFrame,archiveBack);
    document.body.appendChild(archiveOverlay);
    const closeArchiveOverlay=()=>{archiveOverlay.classList.remove('gv-open');archiveFrame.src='about:blank'};
    archiveBack.addEventListener('click',closeArchiveOverlay);
    hdInfoLink.addEventListener('click',()=>{
        const destination=currentArchiveDestination();
        const sourceUrl=String(destination?.sourceUrl||'').trim();
        if(!sourceUrl)return;
        archiveFrame.src=sourceUrl;
        archiveOverlay.classList.add('gv-open');
    });
"""
          h,n=re.subn(r"    const hdBackToViewer=randomGalaxy\.backButton;\n    if\(hdBackToViewer\)\{[\s\S]*?randomGalaxy\.hdViewport\?\.appendChild\(hdBackToViewer\);\n    \}\n",lambda m:archive_block,h,count=1)
          assert n==1, f'HD back block substitution count {n}'

          h=h.replace(
              "        if(hdBackToViewer)hdBackToViewer.setAttribute('aria-label','BACK TO GALAXY VIEWER');",
              "        if(hdInfoIcon){hdInfoIcon.src=iconUrl;hdInfoIcon.alt=`${provider} ARCHIVE SOURCE`}\n        if(hdInfoLink)hdInfoLink.setAttribute('aria-label',`OPEN ${provider} SOURCE INFORMATION`);",1)
          h=h.replace(
              "        if(hdBackToViewer){hdBackToViewer.style.right=`${HD_LAYOUT.iconInset}px`;hdBackToViewer.style.bottom=`${HD_LAYOUT.iconInset}px`;hdBackToViewer.style.pointerEvents='auto'}",
              "        hdInfoLink.style.right=`${HD_LAYOUT.iconInset}px`;hdInfoLink.style.bottom=`${HD_LAYOUT.iconInset}px`;hdInfoLink.style.pointerEvents='auto';",1)

          credit_hook="""    function removeHdCredit(){
        randomGalaxy.hdOverlay?.querySelectorAll('*').forEach(element=>{
            if(element.children.length===0&&/^CREDIT\\b/i.test(String(element.textContent||'').trim()))element.remove();
        });
    }
"""
          assert 'function removeHdCredit()' not in h
          marker='    function settleHdPresentation(){\n'
          assert marker in h
          h=h.replace(marker,credit_hook+marker,1)
          h=h.replace("    function settleHdPresentation(){\n        syncHdProviderPresentation();\n","    function settleHdPresentation(){\n        syncHdProviderPresentation();\n        removeHdCredit();\n",1)

          # Final Viewer invariants.
          assert '# GV-beta-0010H' in h
          assert "const VERSION='10H';" in h and "const DISPLAY_VERSION='10H';" in h
          assert 'gv-hubble-galaxies-full-0018.json' in h
          assert 'gv-hubble-galaxies-full-0017.json' not in h
          assert "const ALADIN_URL='https://aladin.cds.unistra.fr/AladinLite/api/v3/3.8.2/aladin.js';" in h
          assert 'aladin-source-clone/dist/aladin.js' not in h
          assert 'gv-hd-back-to-viewer' not in h
          assert "archiveBack.textContent='← BACK TO GALAXY VIEWER';" in h
          assert 'hdInfoIcon.src=iconUrl' in h
          assert 'function removeHdCredit()' in h
          hpath.write_text(h)

          launcher='''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#000000"><title>Galaxy Viewer 10H</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff}#boot{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#000}#boot img{width:min(42vw,240px);height:auto}#err{display:none;position:fixed;inset:0;z-index:2147483647;padding:24px;box-sizing:border-box;background:#000;color:#FFD166;white-space:pre-wrap;font:14px/1.45 monospace}</style></head><body><div id="boot"><img src="../../viewer/artwork/icon_target_vector.svg" alt="Galaxy Viewer"></div><div id="err"></div><script>(async()=>{'use strict';const text=async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status+' '+u);return r.text()};const extract=s=>{const h=[...s.matchAll(/display\\(HTML\\(\\"\\"\\"([\\s\\S]*?)\\"\\"\\"\\)\\)/g)],j=[...s.matchAll(/display\\(Javascript\\(r\\"\\"\\"([\\s\\S]*?)\\"\\"\\"\\)\\)/g)];if(h.length!==1||j.length!==1)throw new Error('Viewer extraction mismatch HTML='+h.length+' JS='+j.length);return[h[0][1],j[0][1]]};try{const p=JSON.parse(await text('../../viewer/gv-current-viewer.json?t='+Date.now()));const v=String(p.viewer||'').trim();if(v!=='GV-beta-0010H.py')throw new Error('10H launcher pointer mismatch: '+v);const src=await text('../../viewer/'+v+'?t='+Date.now());const [html,js]=extract(src);const safeJs=js.replace(/<\\/script/gi,'<\\\\/script');const page='<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#000000"></head><body>'+html+'<script>'+safeJs+'<\\/script></body></html>';document.open();document.write(page);document.close()}catch(e){document.getElementById('boot')?.remove();const x=document.getElementById('err');x.style.display='block';x.textContent='GALAXY VIEWER 10H FAILED TO LOAD\\n\\n'+String(e?.stack||e)}})();</script></body></html>'''
          assert 'icon_target_vector.svg' in launcher
          assert 'raw.githubusercontent.com' not in launcher
          assert 'aladin-source-clone' not in launcher
          lpath.write_text(launcher)
          ppath.write_text(json.dumps({'version':'10H','viewer':'GV-beta-0010H.py'},indent=2)+'\n')

          assert hashlib.sha256(gpath.read_bytes()).hexdigest()==g_sha, '10G changed'
          assert Path('viewer/artwork/icon_target_vector.svg').exists(), 'target SVG missing'

          def metrics(text):
              return {'characters':len(text),'spaces':text.count(' '),'lines':len(text.splitlines()),'bytes_utf8':len(text.encode())}
          bm=metrics(g); hm=metrics(h); lm=metrics(launcher); pm=metrics(ppath.read_text())
          diff=list(difflib.ndiff(g.splitlines(),h.splitlines()))
          added=sum(1 for x in diff if x.startswith('+ ')); deleted=sum(1 for x in diff if x.startswith('- '))
          audit={'baseline_10G_sha256':g_sha,'files_final':3,'10G':bm,'10H':hm,'launcher':lm,'pointer':pm,'10G_to_10H':{'characters_delta':hm['characters']-bm['characters'],'spaces_delta':hm['spaces']-bm['spaces'],'lines_delta':hm['lines']-bm['lines'],'diff_added_lines':added,'diff_deleted_lines':deleted}}
          print('GV10H_AUDIT='+json.dumps(audit,sort_keys=True))
          wpath.unlink()
          PY
          git diff --check
          test -z "$(git diff -- viewer/GV-beta-0010G.py)"
          git add -A
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/temp-10h-surgical.yml mobile/beta/GV-10H-app.html viewer/GV-beta-0010H.py viewer/gv-current-viewer.json "
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '10H surgical HD restoration and HTML launcher'
          git push origin HEAD:beta
