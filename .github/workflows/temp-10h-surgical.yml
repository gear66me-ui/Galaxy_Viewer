name: TEMP Random 0227 WCS image-center authority repair

on:
  push:
    branches: [beta]
    paths: ['.github/workflows/temp-10h-surgical.yml']

permissions:
  contents: write

jobs:
  repair-random-0227:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
          persist-credentials: true

      - name: Patch Random 0227 and restore BD pointer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          random_path = Path('viewer/modules/random-galaxy/gv-random-galaxy-0227.js')
          pointer_path = Path('viewer/gv-current-viewer.json')
          temp_workflow = Path('.github/workflows/temp-10h-surgical.yml')
          one_shot_workflow = Path('.github/workflows/gv-one-shot-random-0227-wcs-repair.yml')

          text = random_path.read_text(encoding='utf-8')
          old = """            const centerAuthority=gv0223ImageCenterFromWcs(wcs,actualWidth,actualHeight);
            const cameraRa=ra;
            const cameraDec=dec;"""
          new = """            const centerAuthority=gv0223ImageCenterFromWcs(wcs,actualWidth,actualHeight);
            const centerRa=Number(centerAuthority?.ra);
            const centerDec=Number(centerAuthority?.dec);
            const cameraRa=Number.isFinite(centerRa)?centerRa:ra;
            const cameraDec=Number.isFinite(centerDec)?centerDec:dec;"""

          count = text.count(old)
          print(f'RANDOM_0227_BAD_CAMERA_BLOCK_COUNT={count}')
          if count != 1:
              raise SystemExit('FAIL: expected exactly one bad camera authority block')

          random_path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          pointer_path.write_text(
              '{\n  "version": "12AR-132BD",\n  "viewer": "GV-12AR-132BD.py"\n}\n',
              encoding='utf-8',
              newline='\n'
          )

          temp_workflow.unlink(missing_ok=True)
          one_shot_workflow.unlink(missing_ok=True)
          PY

          git diff --check
          git status --short
          git add -A
          echo '=== STAGED FILES ==='
          git diff --cached --name-only | sort
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair Random 0227 WCS image-center authority'
          git push origin HEAD:beta
