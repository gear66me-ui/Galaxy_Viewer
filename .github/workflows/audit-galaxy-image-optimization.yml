name: Audit Full Galaxy Image Optimization

on:
  push:
    branches: [release]
    paths:
      - '.github/workflows/audit-galaxy-image-optimization.yml'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful full optimization run ID"
        required: true
        default: "38825774745"

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release source of truth
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Download six optimized shard artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          mkdir -p audit-input
          for shard in 0 1 2 3 4 5; do
            gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "galaxy-optimized-shard-$shard" --dir "audit-input/shard-$shard"
          done
          find audit-input -maxdepth 3 -type f -printf '%p %s bytes\n' | sort

      - name: Validate archive contents and catalog mapping
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import collections, hashlib, io, json, pathlib, zipfile
          from PIL import Image
          root = pathlib.Path("audit-input")
          manifest_path = pathlib.Path("viewer/image-databases/Hubble/mirror/image-mirror-manifest.json")
          text = manifest_path.read_text(encoding="utf-8")
          manifest, _ = json.JSONDecoder().raw_decode(text.lstrip())
          source = [x for x in manifest.get("images", []) if x.get("sha256") and x.get("githubImageUrl")]
          expected = {i for i, x in enumerate(source)}
          seen = set()
          errors, rows = [], []
          total_original = total_optimized = 0
          provider = collections.Counter()
          above_target = []
          for shard in range(6):
            zips = list((root / f"shard-{shard}").glob(f"galaxy-optimized-shard-{shard}.zip"))
            reports = list((root / f"shard-{shard}").glob(f"report-shard-{shard}.json"))
            if len(zips) != 1 or len(reports) != 1:
              errors.append(f"shard {shard}: expected one ZIP and report; got {len(zips)} ZIP(s), {len(reports)} report(s)")
              continue
            report = json.loads(reports[0].read_text(encoding="utf-8"))
            with zipfile.ZipFile(zips[0]) as zf:
              names = set(zf.namelist())
              for row in report:
                idx = row.get("manifestIndex")
                if idx in seen:
                  errors.append(f"duplicate manifest index {idx}")
                seen.add(idx)
                if idx is None or idx < 0 or idx >= len(source):
                  errors.append(f"invalid manifest index {idx}")
                  continue
                original = source[idx]
                if row.get("originalMirrorUrl") != original.get("githubImageUrl"):
                  errors.append(f"mapping mismatch at index {idx}")
                if row.get("status") != "ok":
                  errors.append(f"processing error at index {idx}: {row.get('error')}")
                  continue
                name = row.get("optimizedFilename")
                if name not in names:
                  errors.append(f"missing optimized file {name}")
                  continue
                blob = zf.read(name)
                if len(blob) != row.get("optimizedBytes"):
                  errors.append(f"byte-size mismatch for {name}")
                try:
                  with Image.open(io.BytesIO(blob)) as im:
                    im.verify()
                  with Image.open(io.BytesIO(blob)) as im:
                    w,h = im.size
                except Exception as e:
                  errors.append(f"image decode failure {name}: {e}")
                  continue
                if (w,h) != (row.get("optimizedWidth"), row.get("optimizedHeight")):
                  errors.append(f"dimension mismatch for {name}")
                if max(w,h) > 1536 and not row.get("keptOriginal"):
                  errors.append(f"optimized image exceeds 1536px: {name}")
                if len(blob) > 700*1024:
                  above_target.append({"index":idx,"provider":row.get("provider"),"bytes":len(blob),"keptOriginal":row.get("keptOriginal")})
                total_original += row.get("originalBytes", 0)
                total_optimized += len(blob)
                provider[row.get("provider","unknown")] += 1
                rows.append(row)
          missing = sorted(expected - seen)
          extra = sorted(seen - expected)
          if missing: errors.append(f"{len(missing)} manifest entries missing from shard reports")
          if extra: errors.append(f"{len(extra)} unexpected manifest indexes")
          summary = {
            "expectedRecords": len(expected), "reportedRecords": len(seen),
            "validatedImages": len(rows), "errors": errors,
            "missingIndexes": missing[:50], "unexpectedIndexes": extra[:50],
            "totalOriginalBytes": total_original, "totalOptimizedBytes": total_optimized,
            "bytesSaved": total_original-total_optimized,
            "reductionPercent": round((1-total_optimized/total_original)*100,2) if total_original else None,
            "underOrEqual700KiB": sum(1 for r in rows if r.get("optimizedBytes", 0) <= 700*1024),
            "above700KiB": above_target, "providerCounts": dict(provider),
            "viewerModified": False
          }
          pathlib.Path("audit-summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          print(json.dumps(summary, indent=2))
          if errors:
            raise SystemExit(f"Optimization audit failed with {len(errors)} error(s); do not integrate into viewer.")
          print("AUDIT PASSED: all records mapped, optimized images decode, sizes and dimensions match reports.")
          PY

      - name: Upload consolidated audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-image-optimization-audit
          path: audit-summary.json
          retention-days: 30
          if-no-files-found: warn
