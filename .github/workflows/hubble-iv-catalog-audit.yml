name: Hubble IV Catalog 0019 quality audit

on:
  workflow_dispatch:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/hubble-iv-catalog-audit.yml'
      - 'test/HUBBLE-IV-audit.py'

permissions:
  contents: write

concurrency:
  group: hubble-iv-catalog-0019-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out exact beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image decoder
        run: python -m pip install --disable-pip-version-check pillow

      - name: Verify authoritative Catalog 0019 blob
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git hash-object viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0019.json)"
          expected="4b2bda03169c43bf3040d55e6457bd086f0c9ffe"
          echo "Catalog 0019 blob: $actual"
          test "$actual" = "$expected"

      - name: Run full Hubble IV audit
        run: python test/HUBBLE-IV-audit.py

      - name: Verify reports
        shell: bash
        run: |
          set -euo pipefail
          for f in test/HUBBLE-IV-REPORT.json test/HUBBLE-IV-REPORT.csv test/HUBBLE-IV-REPORT.md test/HUBBLE-IV-REPORT.html; do
            test -s "$f"
            echo "OK $f ($(wc -c < "$f") bytes)"
          done

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: hubble-iv-catalog-0019-audit
          retention-days: 30
          path: |
            test/HUBBLE-IV-REPORT.json
            test/HUBBLE-IV-REPORT.csv
            test/HUBBLE-IV-REPORT.md
            test/HUBBLE-IV-REPORT.html

      - name: Commit authoritative audit reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- test/HUBBLE-IV-REPORT.json test/HUBBLE-IV-REPORT.csv test/HUBBLE-IV-REPORT.md test/HUBBLE-IV-REPORT.html
          if git diff --cached --quiet; then
            echo 'Audit reports unchanged.'
            exit 0
          fi
          git commit -m $'Hubble IV Catalog 0019 audit reports\n\nECO-ID: ECO-20260822-HUBBLE-IV-AUDIT-001\nAUTHORIZED-PATHS: test/HUBBLE-IV-REPORT.json,test/HUBBLE-IV-REPORT.csv,test/HUBBLE-IV-REPORT.md,test/HUBBLE-IV-REPORT.html\nREQUIREMENTS: REQ-001-REQ-007\nARCHIVE-AUTHORIZED: false\nUSER-GO: true'
          for attempt in 1 2 3; do
            if git push origin HEAD:beta; then exit 0; fi
            git fetch origin beta
            git rebase origin/beta
            sleep $((attempt * 2))
          done
          exit 1
