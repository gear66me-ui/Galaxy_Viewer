name: Repair NGC 5668 published distance

on:
  push:
    branches: [release]
    paths:
      - .github/workflows/repair-ngc5668-published-distance.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-ngc5668-published-distance
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Repair exact Hubble observation and validate
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, json, math
          from pathlib import Path

          ROOT = Path("viewer/image-databases")
          TARGET_ID = "potw2437a"
          TARGET_PROVIDER = "hubble"
          TARGET_MLY = 90.0
          SOURCE_URL = "https://esahubble.org/images/potw2437a/"
          EVIDENCE = (
              "ESA/Hubble Picture of the Week potw2437a; About the Object lists "
              "NGC 5668 at 90 million light-years; " + SOURCE_URL
          )
          METHOD = "published_distance_ESA_Hubble_potw2437a_90_Mly"

          def norm(v):
              return " ".join(str(v or "").strip().casefold().replace("_", " ").split())

          def walk(node):
              if isinstance(node, dict):
                  yield node
                  for value in node.values():
                      yield from walk(value)
              elif isinstance(node, list):
                  for value in node:
                      yield from walk(value)

          def identity(record):
              return {
                  norm(record.get(k))
                  for k in ("archiveId", "archive_id", "observationId", "imageId", "id")
                  if record.get(k) is not None
              }

          def provider(record):
              return norm(record.get("providerKey") or record.get("provider") or record.get("survey"))

          json_files = sorted(ROOT.rglob("*.json"))
          loaded = {}
          matches = []
          for path in json_files:
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  raise SystemExit(f"STOP: invalid JSON {path}: {exc}")
              loaded[path] = data
              for record in walk(data):
                  ids = identity(record)
                  # Exact observation ID only. Source Hubble catalogs may omit provider fields.
                  is_target = norm(TARGET_ID) in ids and (
                      provider(record) in (TARGET_PROVIDER, "hubble space telescope", "")
                  )
                  if not is_target:
                      continue
                  science = record.get("science")
                  if not isinstance(science, dict):
                      continue
                  current = science.get("distanceMly")
                  if isinstance(current, bool) or not isinstance(current, (int, float)):
                      raise SystemExit(f"STOP: target {path} has nonnumeric distanceMly={current!r}")
                  if not math.isclose(float(current), TARGET_MLY, rel_tol=0, abs_tol=1e-9):
                      matches.append((path, record, float(current)))

          if not matches:
              raise SystemExit(
                  "STOP: no exact potw2437a record with science.distanceMly found in JSON catalogs; "
                  "nothing was written. Inspect the runtime schema before retrying."
              )

          # All matches are identified and validated before any file is written.
          for path, record, old_value in matches:
              science = record["science"]
              science["distanceMly"] = TARGET_MLY
              science["distanceMethod"] = METHOD
              science["distanceEvidence"] = EVIDENCE
              science["distanceEstimated"] = False
              science["distanceDisplay"] = "90 million light-years"
              if isinstance(record.get("distance"), str) and "light-year" in record["distance"].casefold():
                  record["distance"] = "90 million light-years"

          changed_json = set()
          for path, _, _ in matches:
              changed_json.add(path)
          for path in sorted(changed_json):
              path.write_text(json.dumps(loaded[path], indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          # Keep the runtime distance map consistent when it contains the exact row.
          csv_path = ROOT / "master-database/avm-metadata/avm-runtime-distance-map-0004.csv"
          csv_updated = False
          if csv_path.is_file():
              with csv_path.open("r", encoding="utf-8", newline="") as f:
                  reader = csv.DictReader(f)
                  fieldnames = reader.fieldnames
                  rows = list(reader)
              if not fieldnames or not {"providerKey", "archiveId", "distanceMly"}.issubset(fieldnames):
                  raise SystemExit(f"STOP: unexpected CSV schema in {csv_path}")
              for row in rows:
                  if norm(row.get("providerKey")) == TARGET_PROVIDER and norm(row.get("archiveId")) == TARGET_ID:
                      row["distanceMly"] = "90"
                      csv_updated = True
              if csv_updated:
                  with csv_path.open("w", encoding="utf-8", newline="") as f:
                      writer = csv.DictWriter(f, fieldnames=fieldnames, lineterminator="\n")
                      writer.writeheader()
                      writer.writerows(rows)

          # Re-open every modified JSON and assert the target value persisted.
          for path in sorted(changed_json):
              verified = json.loads(path.read_text(encoding="utf-8"))
              found = [
                  r for r in walk(verified)
                  if norm(TARGET_ID) in identity(r)
                  and isinstance(r.get("science"), dict)
                  and isinstance(r["science"].get("distanceMly"), (int, float))
              ]
              if not found or any(float(r["science"]["distanceMly"]) != TARGET_MLY for r in found):
                  raise SystemExit(f"STOP: post-write verification failed for {path}")

          report = {
              "object": "NGC 5668",
              "archiveId": TARGET_ID,
              "providerKey": TARGET_PROVIDER,
              "old_values_Mly": sorted({old for _, _, old in matches}),
              "new_distance_Mly": TARGET_MLY,
              "source": SOURCE_URL,
              "json_records_updated": len(matches),
              "json_files_updated": sorted(str(p) for p in changed_json),
              "runtime_distance_map_row_updated": csv_updated,
              "note": "The website publishes an approximate distance of 90 million light-years; redshift, emission age, image span and FOV were not changed by this workflow."
          }
          Path("ngc5668-distance-repair-report.json").write_text(
              json.dumps(report, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, indent=2))
          PY

      - name: Validate JSON and patch formatting
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("ngc5668-distance-repair-report.json").read_text())
          assert report["new_distance_Mly"] == 90.0
          assert report["json_records_updated"] > 0
          for name in report["json_files_updated"]:
              json.loads(Path(name).read_text(encoding="utf-8"))
          print("PASS: NGC 5668 published-distance repair validated.")
          PY
          git diff --check

      - name: Commit only if catalog values changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases
          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
          else
            git diff --cached --stat
            git commit -m "Correct NGC 5668 distance to ESA Hubble published value"
            git push origin HEAD:release
          fi

      - name: Upload repair report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ngc5668-published-distance-repair
          path: ngc5668-distance-repair-report.json
          if-no-files-found: warn
