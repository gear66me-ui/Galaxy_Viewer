name: Repair NGC 6670 distance
on:
  push:
    branches: [release]
    paths: [.github/workflows/repair-ngc-6670-distance.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repair validated Hubble record
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          p=Path("viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json")
          d=json.loads(p.read_text(encoding="utf-8")); es=d.get("entries")
          if not isinstance(es,list): raise SystemExit("Missing entries")
          def n(v): return str(v or "").strip().upper().replace(" ","").replace("-","")
          ms=[]
          for e in es:
            s=e.get("science") or {}; vals=[e.get(k) for k in ("designation","name","title","objectName","target","id")]+[s.get("designation"),s.get("name")]
            if any(n(v) in {"NGC6670","NGC6670A","NGC6670B"} for v in vals): ms.append(e)
          if len(ms)!=1: raise SystemExit(f"Guard: expected exactly one NGC 6670 record, found {len(ms)}")
          e=ms[0]; s=e.setdefault("science",{}); s["distanceMly"]=412.7
          s["distanceMethod"]="SIMBAD_126.5_Mpc_ref_2000ApJ...529..786M_converted_to_Mly"
          s["distanceSource"]="SIMBAD NGC 6670 distance collection; 126.5 Mpc; 2000ApJ...529..786M"
          s["distanceVerified"]=True
          fx=float(e.get("imageFovXDeg") or 0); fy=float(e.get("imageFovYDeg") or 0)
          if fx<=0 or fy<=0: raise SystemExit(f"Guard: invalid FOV x={fx}, y={fy}")
          x=412.7*1000*math.tan(math.radians(fx)); y=412.7*1000*math.tan(math.radians(fy))
          s["sizeKly"]=[round(x,3),round(y,3)]; s["sizeMethod"]="image_footprint_fov_distance_estimate_NGC6670_repair"; s["sizeEstimated"]=True; s["sizeDisplay"]=f"EST. {x:.1f} × {y:.1f} KLY"
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          z=json.loads(p.read_text(encoding="utf-8")); assert abs(z["entries"][es.index(e)]["science"]["distanceMly"]-412.7)<.01
          print(f"NGC 6670 corrected to 412.7 Mly; span {x:.1f} × {y:.1f} Kly")
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json
          git diff --cached --quiet || git commit -m "Correct NGC 6670 distance from SIMBAD"
          git push
