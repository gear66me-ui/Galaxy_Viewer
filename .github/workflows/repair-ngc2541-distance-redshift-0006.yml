name: Correct NGC 2541 published distance and FLRW redshift in runtime catalog 0006
on:
  push:
    branches: [release]
    paths:
      - ".github/workflows/repair-ngc2541-distance-redshift-0006.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repair-ngc2541-distance-redshift-0006
  cancel-in-progress: false
jobs:
  repair-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: release
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set NGC 2541 to the published 24 Mly distance and derive redshift
        run: |
          python3 - <<'PY'
          import json, math
          from pathlib import Path

          path = Path("viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0006.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          # The cited source states approximately 24 million light-years.
          target_mly = 24.0
          target_mpc = target_mly / 3.26156
          H0, omega_m, c = 67.6, 0.315, 299792.458
          omega_l = 1.0 - omega_m

          def luminosity_distance_mpc(z):
              # Simpson integration of luminosity distance in flat Lambda-CDM.
              n = 4000
              h = z / n
              total = 1.0 / math.sqrt(omega_m * (1.0)**3 + omega_l)
              total += 1.0 / math.sqrt(omega_m * (1.0 + z)**3 + omega_l)
              for i in range(1, n):
                  x = i * h
                  f = 1.0 / math.sqrt(omega_m * (1.0 + x)**3 + omega_l)
                  total += (4 if i % 2 else 2) * f
              integral = total * h / 3.0
              return (c / H0) * (1.0 + z) * integral

          lo, hi = 0.0, 0.02
          for _ in range(100):
              mid = (lo + hi) / 2.0
              if luminosity_distance_mpc(mid) < target_mpc:
                  lo = mid
              else:
                  hi = mid
          z = (lo + hi) / 2.0

          def walk(node, p="$"):
              if isinstance(node, dict):
                  yield node, p
                  for k, v in node.items():
                      if isinstance(v, (dict, list)):
                          yield from walk(v, f"{p}.{k}")
              elif isinstance(node, list):
                  for i, v in enumerate(node):
                      yield from walk(v, f"{p}[{i}]")

          def scalar_values(obj):
              return [str(v).strip().lower() for v in obj.values()
                      if isinstance(v, (str, int, float)) and not isinstance(v, bool)]

          all_nodes = list(walk(data))
          candidates = []
          for obj, p in all_nodes:
              vals = scalar_values(obj)
              if not any(v in ("ngc 2541", "ngc2541") for v in vals):
                  continue
              dk = next((k for k in obj if k.lower() in ("distancemly", "distance_mly")), None)
              zk = next((k for k in obj if k.lower() in ("redshift", "redshiftz")), None)
              if dk and zk:
                  candidates.append((obj, p, dk, zk))

          # Only update outermost matching record objects, not nested aliases.
          matches = [(o, p, dk, zk) for o, p, dk, zk in candidates
                     if not any(p.startswith(q + ".") or p.startswith(q + "[")
                                for _, q, _, _ in candidates if q != p)]
          if not matches:
              raise SystemExit("STOP: no NGC 2541 runtime record with distance and redshift fields; no changes made.")

          updated = []
          for obj, p, dk, zk in matches:
              old_d, old_z = obj[dk], obj[zk]
              obj[dk] = round(target_mly, 6)
              obj[zk] = round(z, 8)
              for k in list(obj):
                  if k.lower() == "sciencedistancemly":
                      obj[k] = round(target_mly, 6)
              updated.append((p, old_d, old_z))

          # Also align nested science.distanceMly fields on the matching record subtree.
          for obj, p, _, _ in matches:
              for child, child_path in walk(obj, p):
                  for k in list(child):
                      if k.lower() == "sciencedistancemly":
                          child[k] = round(target_mly, 6)

          encoded = json.dumps(data, ensure_ascii=False, indent=2) + "\n"
          json.loads(encoded)
          path.write_text(encoded, encoding="utf-8")

          print(f"Updated {len(updated)} NGC 2541 runtime record(s)")
          for p, old_d, old_z in updated:
              print(f"{p}: distance {old_d} -> {target_mly:.6f} Mly; redshift {old_z} -> {z:.8f}")
          print(f"Source distance: {target_mly:.6f} Mly = {target_mpc:.6f} Mpc")
          print(f"Flat Lambda-CDM assumptions: H0={H0} km/s/Mpc, Omega_m={omega_m}")
          print(f"Derived luminosity-distance redshift: z={z:.8f}")
          print("JSON serialization validation passed.")
          PY
      - name: Validate and commit catalog
        run: |
          python3 -m json.tool viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0006.json >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0006.json
          if git diff --cached --quiet; then
            echo "No catalog changes were needed."
          else
            git commit -m "Correct NGC 2541 distance to 24 Mly and derive FLRW redshift"
            git push origin HEAD:release
          fi
