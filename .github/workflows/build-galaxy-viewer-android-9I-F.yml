name: Build Galaxy Viewer Android 9I-F

on:
  push:
    branches:
      - beta
    paths:
      - '.github/workflows/build-galaxy-viewer-android-9I-F.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Prepare 9I-F Viewer and Android working tree
        run: python .github/scripts/prepare_galaxy_viewer_9if.py

      - name: Commit and safely rebase 9I-F Viewer source
        run: |
          git config user.name 'Galaxy Viewer Build Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/GV-beta-0009I.py
          git diff --cached --check
          git commit -m 'Rev beta Viewer to 9I-F and normalize HD CONST cell'
          git stash push --include-untracked -m 9if-build-working-tree -- android/galaxy-viewer-9i
          git fetch origin beta
          git rebase origin/beta
          git push origin HEAD:beta
          git stash pop

      - name: Generate black 9I-F icon
        run: |
          python -m pip install --quiet pillow
          python .github/scripts/generate_9if_icon.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build 9I-F APK
        working-directory: android/galaxy-viewer-9i
        run: gradle --no-daemon :app:assembleDebug

      - name: Stage and hash APK
        run: |
          cp android/galaxy-viewer-9i/app/build/outputs/apk/debug/app-debug.apk Galaxy-Viewer-9I-F.apk
          sha256sum Galaxy-Viewer-9I-F.apk | tee Galaxy-Viewer-9I-F.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Viewer-9I-F
          path: |
            Galaxy-Viewer-9I-F.apk
            Galaxy-Viewer-9I-F.sha256
          if-no-files-found: error

      - name: Create immutable 9I-F release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET="$(git rev-parse HEAD)"
          if gh release view galaxy-viewer-9i-f >/dev/null 2>&1; then
            echo 'Galaxy Viewer 9I-F release already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          gh release create galaxy-viewer-9i-f Galaxy-Viewer-9I-F.apk Galaxy-Viewer-9I-F.sha256 --target "$TARGET" --title 'Galaxy Viewer 9I-F — Android' --notes 'Galaxy Viewer 9I-F beta test APK. Built from beta source with one HD CONST field, visible VERSION 9I-F, black versioned icon, and a bundled app shell.'
