name: Fix 10V archive transition once

on:
  push:
    branches: [beta]
    paths:
      - .github/workflows/fix-10v-archive-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Apply exact 10V archive repair
        run: |
          set -euo pipefail
          test "$(git hash-object viewer/GV-beta-0010V.py)" = "69fd0f5fbd1daf0f6297012276d49c06512bdb7c"
          test "$(git hash-object mobile/beta/10V.html)" = "d269856d1d3797672037caf05bb27f8aaab3bc4c"
          python - <<'PY'
          from pathlib import Path

          vp=Path('viewer/GV-beta-0010V.py')
          v=vp.read_text()
          old_overlay='#gv-archive-overlay{position:fixed;inset:0;z-index:2147483000;background:#F7FBFF;display:none;pointer-events:none}'
          new_overlay='#gv-archive-overlay{position:fixed;inset:0;z-index:2147483000;background:#000;display:none;pointer-events:none}'
          old_frame='#gv-archive-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#F7FBFF}'
          new_frame='#gv-archive-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}'
          assert v.count(old_overlay)==1, v.count(old_overlay)
          assert v.count(old_frame)==1, v.count(old_frame)
          v=v.replace(old_overlay,new_overlay,1).replace(old_frame,new_frame,1)
          vp.write_text(v)

          lp=Path('mobile/beta/10V.html')
          l=lp.read_text()
          css='''#gv-archive-overlay{background:#000!important}\n#gv-archive-frame{background:#000!important;opacity:0!important;visibility:hidden!important}\n#gv-archive-frame.gv-archive-painted{opacity:1!important;visibility:visible!important}\n'''
          guard='''const installArchivePaintGuard=()=>{\n const frame=document.getElementById('gv-archive-frame');if(!frame)return;\n frame.classList.remove('gv-archive-painted');\n frame.addEventListener('load',()=>{if(frame.src&&frame.src!=='about:blank')frame.classList.add('gv-archive-painted')});\n document.addEventListener('click',event=>{if(event.target?.closest?.('#gv-hd-archive-button'))frame.classList.remove('gv-archive-painted')},true);\n};\n'''
          assert l.count(css)==1, l.count(css)
          assert l.count(guard)==1, l.count(guard)
          assert l.count('fullReady.then(installArchivePaintGuard).catch(showError);')==1
          l=l.replace(css,'',1).replace(guard,'',1).replace('fullReady.then(installArchivePaintGuard).catch(showError);','fullReady.catch(showError);',1)
          lp.write_text(l)
          PY
          git rm .github/workflows/fix-10v-archive-once.yml
          git diff --check
          mapfile -t changed < <(git status --short | sed -E 's/^.. //')
          printf '%s\n' "${changed[@]}" | sort > /tmp/actual
          printf '%s\n' '.github/workflows/fix-10v-archive-once.yml' 'mobile/beta/10V.html' 'viewer/GV-beta-0010V.py' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          grep -Fq '#gv-archive-overlay{position:fixed;inset:0;z-index:2147483000;background:#000;display:none;pointer-events:none}' viewer/GV-beta-0010V.py
          grep -Fq '#gv-archive-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}' viewer/GV-beta-0010V.py
          ! grep -Fq 'gv-archive-painted' mobile/beta/10V.html
          ! grep -Fq 'installArchivePaintGuard' mobile/beta/10V.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/GV-beta-0010V.py mobile/beta/10V.html .github/workflows/fix-10v-archive-once.yml
          git commit -m '10V restore archive transition with black loading surface' -m 'ECO-ID: GV-10V-ARCHIVE-TRANSITION-001' -m 'AUTHORIZED-PATHS: viewer/GV-beta-0010V.py, mobile/beta/10V.html, .github/workflows/fix-10v-archive-once.yml' -m 'REQUIREMENTS: black archive surface only; preserve iframe load sequence; remove launcher paint guard' -m 'ARCHIVE-AUTHORIZED: false' -m 'USER-GO: true'
          git push origin HEAD:beta
