name: TEMP AE2 Random Galaxy Surgical Repair
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/apply-10g-final-and-build-generic.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Create AE2 and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL_WORKFLOW_REF='18a304c545b6073b8ed9b046a7cf09a6cf244833'
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib
          ae1_path=Path('viewer/GV-beta-0010AE1.py')
          ae2_path=Path('viewer/GV-beta-0010AE2.py')
          pointer_path=Path('viewer/gv-current-viewer.json')
          ae1=ae1_path.read_text(encoding='utf-8')
          assert ae1.count("chandraTestOverrideActive=chandraTestTotal>0;")==1
          assert "const VERSION='10AE1';" in ae1
          assert "const DISPLAY_VERSION='10AE1';" in ae1
          assert 'CHANDRA_CATALOG_URL' in ae1 and 'CHANDRA_ICON_URL' in ae1
          ae2=ae1.replace('10AE1','10AE2')
          ae2=ae2.replace("chandraTestOverrideActive=chandraTestTotal>0;","chandraTestOverrideActive=false;",1)
          assert "const VERSION='10AE2';" in ae2
          assert "const DISPLAY_VERSION='10AE2';" in ae2
          assert "chandraTestOverrideActive=chandraTestTotal>0;" not in ae2
          assert "chandraTestOverrideActive=false;" in ae2
          assert ae2.count('CHANDRA_CATALOG_URL')==ae1.count('CHANDRA_CATALOG_URL')
          assert ae2.count('CHANDRA_ICON_URL')==ae1.count('CHANDRA_ICON_URL')
          ae2_path.write_text(ae2,encoding='utf-8')
          pointer_path.write_text(json.dumps({'version':'10AE2','viewer':'GV-beta-0010AE2.py'},indent=2)+'\n',encoding='utf-8')
          print('AE1_SHA256='+hashlib.sha256(ae1.encode()).hexdigest())
          print('AE2_SHA256='+hashlib.sha256(ae2.encode()).hexdigest())
          PY
          git checkout "$ORIGINAL_WORKFLOW_REF" -- .github/workflows/apply-10g-final-and-build-generic.yml
          git diff --check
          test -z "$(git diff -- viewer/GV-beta-0010AE1.py)"
          test -z "$(git diff -- viewer/modules/gv-random-galaxy-0031.js)"
          test -z "$(git diff -- viewer/image-databases/Chandra/databases/gv-chandra-galaxies-full-0001.json)"
          git add viewer/GV-beta-0010AE2.py viewer/gv-current-viewer.json .github/workflows/apply-10g-final-and-build-generic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ECO GV-10AE2-RANDOM-REPAIR-001 restore Random Galaxy selection'
          for attempt in 1 2 3 4 5; do
            git fetch origin beta
            git rebase origin/beta
            if git push origin HEAD:beta; then exit 0; fi
            sleep 2
          done
          exit 1
