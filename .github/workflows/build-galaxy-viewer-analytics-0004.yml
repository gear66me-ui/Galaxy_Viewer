name: Build Galaxy Viewer Analytics 0004

on:
  workflow_dispatch:
  push:
    branches:
      - beta
    paths:
      - "android/galaxy-viewer-analytics-0003/**"
      - "mobile/beta/analytics-app-0002.html"
      - ".github/workflows/build-galaxy-viewer-analytics-0004.yml"

permissions:
  contents: read

env:
  APK_NAME: Galaxy-Viewer-Analytics-0004.apk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout beta
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify failsafe analytics contract
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.gear66me.galaxyviewer.analytics'" android/galaxy-viewer-analytics-0003/app/build.gradle
          grep -q "versionName 'analytics-3'" android/galaxy-viewer-analytics-0003/app/build.gradle
          grep -q "analytics-app-0002.html" android/galaxy-viewer-analytics-0003/app/src/main/java/com/gear66me/galaxyviewer/analytics/MainActivity.java
          grep -q "STARTUP_WATCHDOG_50S" android/galaxy-viewer-analytics-0003/app/src/main/java/com/gear66me/galaxyviewer/analytics/MainActivity.java
          grep -q "NATIVE_HEARTBEAT" android/galaxy-viewer-analytics-0003/app/src/main/java/com/gear66me/galaxyviewer/analytics/MainActivity.java
          grep -q "Galaxy-Viewer-Startup-Audit-" mobile/beta/analytics-app-0002.html
          grep -q "SAVE AUDIT NOW" mobile/beta/analytics-app-0002.html
          grep -q "setInterval" mobile/beta/analytics-app-0002.html
          grep -q "queueState" mobile/beta/analytics-app-0002.html
          grep -q "JS_FAILSAFE_50S" mobile/beta/analytics-app-0002.html

      - name: Build Analytics APK
        run: |
          set -euo pipefail
          gradle --no-daemon -p android/galaxy-viewer-analytics-0003 :app:assembleDebug

      - name: Stage APK
        run: |
          set -euo pipefail
          APK="android/galaxy-viewer-analytics-0003/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"

      - name: Verify APK signature
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK_NAME"

      - name: Verify APK identity
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK_NAME" > analytics-badging.txt
          grep -q "package: name='com.gear66me.galaxyviewer.analytics'" analytics-badging.txt
          grep -q "versionName='analytics-3'" analytics-badging.txt
          grep -q "application-label:'GALAXY VIEWER ANALYTICS'" analytics-badging.txt
          head -20 analytics-badging.txt

      - name: Upload Analytics APK
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Viewer-Analytics-0004
          path: |
            Galaxy-Viewer-Analytics-0004.apk
            Galaxy-Viewer-Analytics-0004.apk.sha256
            analytics-badging.txt
          if-no-files-found: error
          retention-days: 30
