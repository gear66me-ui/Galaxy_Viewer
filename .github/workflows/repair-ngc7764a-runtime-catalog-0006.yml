name: Repair NGC 7764A Runtime Catalog 0006

on:
  workflow_dispatch:
  push:
    branches: [release]
    paths:
      - .github/workflows/repair-ngc7764a-runtime-catalog-0006.yml

permissions:
  contents: write

concurrency:
  group: repair-ngc7764a-runtime-0006
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Correct NGC 7764A distance and derive flat-LCDM redshift
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math
          from pathlib import Path

          path = Path("viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0006.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          records = data.get("records") if isinstance(data, dict) else data
          if not isinstance(records, list) or len(records) != 1847:
              raise SystemExit(f"FAIL: expected 1,847 runtime records; got {len(records) if isinstance(records, list) else 'non-list'}")

          matches = [
              r for r in records if isinstance(r, dict)
              and str(r.get("providerKey", "")).lower() == "hubble"
              and str(r.get("archiveId", "")).lower() == "potw2204a"
          ]
          if len(matches) != 1:
              raise SystemExit(f"FAIL: expected exactly one Hubble potw2204a record for NGC 7764A; found {len(matches)}")
          r = matches[0]

          # Preserve the project's established FLRW redshift calculation:
          # invert comoving distance in flat Lambda-CDM, H0=67.6, Omega_m=0.315.
          distance_mly = 425.0
          H0, omega_m, c = 67.6, 0.315, 299792.458
          def e(z):
              return math.sqrt(omega_m * (1 + z)**3 + (1 - omega_m))
          def comoving_distance_mpc(z):
              n = 1200
              dz = z / n
              total = sum((1 if i in (0, n) else 4 if i % 2 else 2) / e(i * dz) for i in range(n + 1))
              return (c / H0) * (dz / 3) * total
          target_mpc = distance_mly / 3.26156
          lo, hi = 0.0, 1.0
          for _ in range(100):
              mid = (lo + hi) / 2
              if comoving_distance_mpc(mid) < target_mpc:
                  lo = mid
              else:
                  hi = mid
          z = (lo + hi) / 2

          display = "425.00 million light-years"
          r["distanceMly"] = 425.0
          r["redshift"] = round(z, 8)
          science = r.get("science")
          if not isinstance(science, dict):
              science = {}
              r["science"] = science
          science.update({
              "distanceMly": 425.0,
              "distanceDisplay": display,
              "distanceMethod": "adopted_published_group_distance_NGC_7764A",
              "distanceSource": "https://science.nasa.gov/missions/hubble/hubble-spots-a-starship-shaped-galactic-pair/",
              "distanceEvidence": "NASA/ESA Hubble states that the NGC 7764A group lies about 425 million light-years from Earth.",
              "distanceVerified": True,
              "redshift": round(z, 8),
              "redshiftMethod": "flat_LCDM_from_distance_H0_67.6_Om_0.315",
              "redshiftSource": "Calculated from adopted distance using the Galaxy Viewer flat-Lambda-CDM convention (H0=67.6 km/s/Mpc, Omega_m=0.315).",
              "redshiftEvidence": "Derived from 425.0 Mly using flat Lambda-CDM comoving distance inversion."
          })
          if isinstance(r.get("distance"), dict):
              r["distance"]["mly"] = 425.0
              r["distance"]["display"] = display
          elif isinstance(r.get("distance"), str):
              r["distance"] = display
          if "distanceDisplay" in r:
              r["distanceDisplay"] = display

          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          checked = json.loads(path.read_text(encoding="utf-8"))
          rs = checked.get("records") if isinstance(checked, dict) else checked
          target = [x for x in rs if isinstance(x, dict) and str(x.get("providerKey", "")).lower() == "hubble" and str(x.get("archiveId", "")).lower() == "potw2204a"]
          assert len(target) == 1 and target[0]["science"]["distanceMly"] == 425.0
          assert abs(target[0]["science"]["redshift"] - z) < 1e-8
          print(json.dumps({"archiveId":"potw2204a","name":target[0].get("name"),"distanceMly":425.0,"redshift":round(z,8),"recordCount":len(rs)}, indent=2))
          PY

      - name: Validate and commit only the runtime catalog
        shell: bash
        run: |
          set -euo pipefail
          CATALOG="viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0006.json"
          python3 -m json.tool "$CATALOG" >/dev/null
          git diff --check
          changed="$(git diff --name-only)"
          if [[ "$changed" != "$CATALOG" ]]; then
            echo "FAIL: expected only runtime catalog change; got: $changed"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CATALOG"
          git commit -m "Fix NGC 7764A distance and FLRW redshift in runtime catalog 0006"
          git push origin HEAD:release
