name: TEMP audit Catalog 0018 pseudonym word counts
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/temp-audit-catalog18-wordcounts.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: beta}
      - shell: bash
        run: |
          python - <<'PY'
          import json,re,collections
          p='viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0018.json'
          d=json.load(open(p,encoding='utf-8')); es=d['entries']; wc=collections.Counter(); sus=[]; nums=[]
          cat=re.compile(r'\\b(?:NGC|IC|UGC|UGCA|MACS|eMACS|RXC|RCS2?|Abell|ESO|SDSS|2XMM|PSZ1?|ACT-CL|IRAS|LMC|SMC|LEDA|MCG|AM|Arp|2MASX|WINGS|HerS|Messier|PGC|ACO|HCG|DDO|Mrk|Markarian|GAMA|PLCK|ZwCl|VV|HST|MS\\s*\\d|3C\\s*\\d)\\b',re.I)
          badwords=re.compile(r'\\b(?:hubble|image|images|imaging|ground[- ]based|telescope|camera|instrument|exposure)\\b',re.I)
          for i,e in enumerate(es,1):
            n=(e.get('displayName') or '').strip(); w=len(n.split()) if n else 0; wc[w]+=1; r=[]
            if not n:r.append('empty')
            if re.search(r'\\d',n):r.append('number');nums.append((i,e.get('designation'),n))
            if w>8:r.append('over8')
            if cat.search(n):r.append('catalog-token')
            if badwords.search(n):r.append('image/provenance-word')
            if r:sus.append((i,e.get('designation'),n,','.join(r)))
          out=['TOTAL='+str(len(es)),'COUNTS='+','.join(f'{k}:{wc[k]}' for k in sorted(wc)),'SUSPICIOUS='+str(len(sus)),'NUMBERS='+str(len(nums))]
          out += ['SUS\t%d\t%s\t%s\t%s'%x for x in sus]
          open('viewer/image-databases/Hubble/databases/temp-catalog18-wordcount-audit.txt','w',encoding='utf-8').write('\n'.join(out)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add viewer/image-databases/Hubble/databases/temp-catalog18-wordcount-audit.txt
          git commit -m 'TEMP Catalog 0018 word-count audit'
          git push origin HEAD:beta
