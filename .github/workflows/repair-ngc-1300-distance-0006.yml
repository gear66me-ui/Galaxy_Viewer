name: Repair NGC 1300 Distance in AVM Runtime Catalog 0006
on:
  push:
    branches: [release]
    paths:
      - ".github/workflows/repair-ngc-1300-distance-0006.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repair-ngc-1300-distance-0006
  cancel-in-progress: false
jobs:
  repair-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: release
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Correct NGC 1300 and derive flat-Lambda-CDM redshift
        run: |
          python3 - <<'PY'
          import json, math
          from pathlib import Path

          path = Path("viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0006.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          target_mly = 75.0
          target_mpc = target_mly / 3.26156
          H0, omega_m, c = 67.6, 0.315, 299792.458
          omega_l = 1.0 - omega_m

          def luminosity_distance_mpc(z):
              n = 4000
              h = z / n
              total = 1.0 + 1.0 / math.sqrt(omega_m * (1+h)**3 + omega_l)
              for i in range(1, n):
                  x = i*h
                  f = 1.0 / math.sqrt(omega_m * (1+x)**3 + omega_l)
                  total += (4 if i % 2 else 2) * f
              integral = total * h / 3.0
              return (c / H0) * (1+z) * integral

          lo, hi = 0.0, 0.1
          for _ in range(100):
              mid = (lo + hi) / 2
              if luminosity_distance_mpc(mid) < target_mpc:
                  lo = mid
              else:
                  hi = mid
          z = (lo + hi) / 2

          def walk(node, p="$"):
              if isinstance(node, dict):
                  yield node, p
                  for k,v in node.items():
                      if isinstance(v,(dict,list)):
                          yield from walk(v, f"{p}.{k}")
              elif isinstance(node,list):
                  for i,v in enumerate(node):
                      yield from walk(v, f"{p}[{i}]")

          def scalars(obj):
              return [(str(k).lower(), str(v).strip().lower())
                      for k,v in obj.items()
                      if isinstance(v,(str,int,float)) and not isinstance(v,bool)]

          all_records = list(walk(data))
          matches = []
          for obj,p in all_records:
              vals = scalars(obj)
              texts = [v for _,v in vals]
              has_name = any("ngc 1300" == v or "ngc1300" == v or "ngc 1300" in v for v in texts)
              has_id = any(v in ("eso1042d","ngc1300-muse","ngc1300_muse-ha") for v in texts)
              dist_key = next((k for k in obj if k.lower() in ("distancemly","distance_mly")), None)
              z_key = next((k for k in obj if k.lower() in ("redshift","redshiftz")), None)
              if (has_name or has_id) and dist_key and z_key:
                  matches.append((obj,p,dist_key,z_key,has_name,has_id))
          matches = [(o,p,dk,zk,n,i) for o,p,dk,zk,n,i in matches
                     if not any(p.startswith(q+".") or p.startswith(q+"[")
                                for _,q,_,_,_,_ in matches if q != p)]
          if not matches:
              # Some catalogs store distance/redshift in a parent record and aliases in nested metadata.
              for obj,p in all_records:
                  vals = scalars(obj)
                  texts = [v for _,v in vals]
                  if any("ngc 1300" == v or "ngc1300" == v for v in texts):
                      dk = next((k for k in obj if k.lower() in ("distancemly","distance_mly")), None)
                      zk = next((k for k in obj if k.lower() in ("redshift","redshiftz")), None)
                      if dk and zk: matches.append((obj,p,dk,zk,True,False))
          if len(matches) != 1:
              raise SystemExit(f"STOP: expected exactly one NGC 1300 runtime record with distance/redshift fields; found {len(matches)}. No catalog file changed.")
          obj,p,dk,zk,_,_ = matches[0]
          old_d, old_z = obj[dk], obj[zk]
          obj[dk], obj[zk] = round(target_mly, 6), round(z, 8)
          # Keep any duplicated standard science distance field consistent within this record.
          for k in list(obj):
              if k.lower() in ("sciencedistancemly", "distance_mly", "distancemly"):
                  obj[k] = round(target_mly, 6)
          encoded = json.dumps(data, ensure_ascii=False, indent=2) + "\n"
          json.loads(encoded)
          path.write_text(encoded, encoding="utf-8")
          print(f"Updated NGC 1300 at {p}")
          print(f"Distance: {old_d} -> {target_mly:.6f} Mly ({target_mpc:.6f} Mpc)")
          print(f"Redshift: {old_z} -> {z:.8f} (flat LCDM; H0={H0}, Omega_m={omega_m})")
          print("JSON serialization validation passed.")
          PY
      - name: Validate and commit repaired catalog
        run: |
          python3 -m json.tool viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0006.json >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0006.json
          if git diff --cached --quiet; then
            echo "Catalog already has the approved NGC 1300 values."
          else
            git commit -m "Correct NGC 1300 distance to 75 Mly in AVM runtime catalog 0006"
            git push origin HEAD:release
          fi
