name: Fix 10E R3 Validation
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/fix-10e-r3-validation.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Remove only false aapt label assertion
        shell: bash
        run: |
          set -euo pipefail
          FILE=.github/workflows/build-galaxy-viewer-android-10E-generic-r3.yml
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/build-galaxy-viewer-android-10E-generic-r3.yml')
          s=p.read_text(encoding='utf-8')
          needle='          grep -q "application-label:\'Galaxy Viewer 10E\'" /tmp/badging.txt\n'
          if s.count(needle) != 1:
              raise SystemExit('Expected exactly one false label assertion')
          p.write_text(s.replace(needle,'',1),encoding='utf-8')
          PY
          git diff --check
          git diff -- "$FILE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          test "$(git diff --cached --name-only)" = "$FILE"
          git commit -m 'Fix 10E APK validation label check'
          git fetch origin beta
          git rebase origin/beta
          git push origin HEAD:beta
