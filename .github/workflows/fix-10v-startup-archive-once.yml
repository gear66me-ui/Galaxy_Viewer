name: Surgical 10V startup and archive fix once

on:
  push:
    branches: [beta]
    paths:
      - .github/workflows/fix-10v-startup-archive-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Patch exact 10V only
        run: |
          set -euo pipefail
          test "$(git hash-object viewer/GV-beta-0010V.py)" = "a448f3c3de22e7892eff2a74acf7beecfade3bfa"
          test "$(git hash-object mobile/beta/10V.html)" = "d269856d1d3797672037caf05bb27f8aaab3bc4c"
          python - <<'PY'
          from pathlib import Path

          p=Path('viewer/GV-beta-0010V.py')
          s=p.read_text()

          root_css='#aladin-cosmic-command-test{position:relative!important;width:100%!important;height:100vh!important;height:100svh!important;height:100dvh!important;min-height:100vh!important;min-height:100svh!important;min-height:100dvh!important;overflow:hidden!important;background:#000!important}\n'
          comet_css='#gv-startup-wait{position:absolute;inset:0;z-index:7085;display:flex;align-items:center;justify-content:center;background:#000;pointer-events:none}\n#gv-startup-comet{position:relative;width:54px;height:54px;border-radius:50%;animation:gvStartupOrbit .8s linear infinite}\n#gv-startup-comet::before{content:"";position:absolute;left:50%;top:-2px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0 18%,#ddf7ff 30%,#79d6ff 55%,#1e6ec1 78%,#0a255d 100%);box-shadow:0 0 5px #fff,0 0 11px #76d8ff,0 0 18px rgba(20,83,173,.85)}\n#gv-startup-comet::after{content:"";position:absolute;left:50%;top:1px;width:28px;height:6px;margin-left:-1px;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.96),rgba(135,220,255,.80) 28%,rgba(44,128,219,.48) 58%,rgba(9,35,89,0) 100%);transform:rotate(30deg);transform-origin:left center;filter:blur(.4px)}\n@keyframes gvStartupOrbit{to{transform:rotate(360deg)}}\n'
          assert s.count(root_css)==1
          s=s.replace(root_css,root_css+comet_css,1)

          old='<div id="aladin-cosmic-command-test"></div>'
          new='<div id="aladin-cosmic-command-test"><div id="gv-startup-wait" aria-hidden="true"><div id="gv-startup-comet"></div></div></div>'
          assert s.count(old)==1
          s=s.replace(old,new,1)

          old="    const galaxyCatalogPromise=loadCombinedGalaxyCatalog();\n\n    const A=await ensureAladin();\n    await A.init;\n    const root=document.getElementById('aladin-cosmic-command-test');\n    if(!root)throw new Error('GALAXY VIEWER ROOT MISSING');\n\n    const aladin=A.aladin('#aladin-cosmic-command-test',{"
          new="    const galaxyCatalogPromise=loadCombinedGalaxyCatalog();\n    const moduleLoads=Promise.all([\n        loadScript(HAMBURGER_URL,'gvHamburger0002'),\n        loadScript(COORDINATE_URL,'gvCoordinate0004'),\n        loadScript(TARGET_URL,'gvTarget0001'),\n        loadScript(RANDOM_GALAXY_URL,'gvRandomGalaxy0031')\n    ]);\n    const root=document.getElementById('aladin-cosmic-command-test');\n    if(!root)throw new Error('GALAXY VIEWER ROOT MISSING');\n    const startupWait=document.getElementById('gv-startup-wait');\n    document.dispatchEvent(new CustomEvent('gv-viewer-startup-visible',{detail:{version:VERSION,displayVersion:DISPLAY_VERSION,elapsedMs:performance.now()-startupTiming.startedAt}}));\n\n    const A=await ensureAladin();\n    await A.init;\n\n    const aladin=A.aladin('#aladin-cosmic-command-test',{"
          assert s.count(old)==1
          s=s.replace(old,new,1)

          old="    const homeOverlay=createHomeOverlay(root);\n    startupTiming.shellReadyAt=performance.now();\n    document.dispatchEvent(new CustomEvent('gv-viewer-shell-ready',{detail:{version:VERSION,displayVersion:DISPLAY_VERSION,elapsedMs:startupTiming.shellReadyAt-startupTiming.startedAt}}));\n\n    const moduleLoads=Promise.all([\n        loadScript(HAMBURGER_URL,'gvHamburger0002'),\n        loadScript(COORDINATE_URL,'gvCoordinate0004'),\n        loadScript(TARGET_URL,'gvTarget0001'),\n        loadScript(RANDOM_GALAXY_URL,'gvRandomGalaxy0031')\n    ]);\n    galaxyCatalog=await galaxyCatalogPromise;"
          new="    const homeOverlay=createHomeOverlay(root);\n    startupWait?.remove();\n    startupTiming.shellReadyAt=performance.now();\n    document.dispatchEvent(new CustomEvent('gv-viewer-shell-ready',{detail:{version:VERSION,displayVersion:DISPLAY_VERSION,elapsedMs:startupTiming.shellReadyAt-startupTiming.startedAt}}));\n\n    galaxyCatalog=await galaxyCatalogPromise;"
          assert s.count(old)==1
          s=s.replace(old,new,1)

          old="    archiveFrame.addEventListener('load',()=>{\n        if(!archiveSourceUrl||archiveClosing)return;\n        setArchiveLoading(false);\n        archiveFrame.style.pointerEvents='auto';\n    });"
          new="    archiveFrame.addEventListener('load',()=>{\n        if(!archiveSourceUrl||archiveClosing)return;\n        setArchiveLoading(false);\n        archiveOverlay.removeAttribute('aria-hidden');\n        archiveOverlay.style.pointerEvents='auto';\n        archiveOverlay.classList.add('gv-open');\n        archiveFrame.style.pointerEvents='auto';\n    });"
          assert s.count(old)==1
          s=s.replace(old,new,1)

          old="        setArchiveLoading(true);\n        requestAnimationFrame(()=>{\n            if(!archiveSourceUrl||archiveClosing)return;\n            archiveOverlay.removeAttribute('aria-hidden');\n            archiveOverlay.style.pointerEvents='auto';\n            archiveOverlay.classList.add('gv-open');\n            archiveFrame.style.pointerEvents='auto';\n            archiveFrame.src=sourceUrl;\n        });"
          new="        setArchiveLoading(true);\n        archiveOverlay.classList.remove('gv-open');\n        archiveOverlay.style.pointerEvents='none';\n        archiveOverlay.setAttribute('aria-hidden','true');\n        archiveFrame.style.pointerEvents='none';\n        archiveFrame.src=sourceUrl;"
          assert s.count(old)==1
          s=s.replace(old,new,1)
          p.write_text(s)

          lp=Path('mobile/beta/10V.html')
          l=lp.read_text()
          l=l.replace('69fd0f5fbd1daf0f6297012276d49c06512bdb7c','87944256a5a0c197254bc3a5f9738548d8c7c0c4')
          l=l.replace('Splash exits when its animation completes; a comet indicates the remaining shell-ready wait while full initialization continues in background.','Splash hands off to the Python-owned startup state; full initialization continues in background.')
          for block in [
              '#gv-startup-wait{position:fixed;inset:0;z-index:2147483644;display:none;align-items:center;justify-content:center;background:#000;pointer-events:none}\n#gv-startup-wait.gv-visible{display:flex}\n#gv-startup-comet{position:relative;width:54px;height:54px;border-radius:50%;animation:gvStartupOrbit .8s linear infinite}\n#gv-startup-comet::before{content:"";position:absolute;left:50%;top:-2px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0 18%,#ddf7ff 30%,#79d6ff 55%,#1e6ec1 78%,#0a255d 100%);box-shadow:0 0 5px #fff,0 0 11px #76d8ff,0 0 18px rgba(20,83,173,.85)}\n#gv-startup-comet::after{content:"";position:absolute;left:50%;top:1px;width:28px;height:6px;margin-left:-1px;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.96),rgba(135,220,255,.80) 28%,rgba(44,128,219,.48) 58%,rgba(9,35,89,0) 100%);transform:rotate(30deg);transform-origin:left center;filter:blur(.4px)}\n@keyframes gvStartupOrbit{to{transform:rotate(360deg)}}\n',
              '#gv-archive-overlay{background:#000!important}\n#gv-archive-frame{background:#000!important;opacity:0!important;visibility:hidden!important}\n#gv-archive-frame.gv-archive-painted{opacity:1!important;visibility:visible!important}\n',
              '<div id="gv-startup-wait" aria-hidden="true"><div id="gv-startup-comet"></div></div>\n',
              "const startupWait=document.getElementById('gv-startup-wait');\n",
              "const installArchivePaintGuard=()=>{\n const frame=document.getElementById('gv-archive-frame');if(!frame)return;\n frame.classList.remove('gv-archive-painted');\n frame.addEventListener('load',()=>{if(frame.src&&frame.src!=='about:blank')frame.classList.add('gv-archive-painted')});\n document.addEventListener('click',event=>{if(event.target?.closest?.('#gv-hd-archive-button'))frame.classList.remove('gv-archive-painted')},true);\n};\n",
          ]:
              assert l.count(block)==1, block[:50]
              l=l.replace(block,'',1)
          l=l.replace("const showError=e=>{startupWait?.classList.remove('gv-visible');errorBox.style.display='block';", "const showError=e=>{errorBox.style.display='block';")
          l=l.replace("const fetchText=async(url,label)=>{const r=await fetch(url,{cache:'no-store'});", "const fetchText=async(url,label)=>{const r=await fetch(url,{cache:'force-cache'});")
          l=l.replace("const shellReady=waitForViewerEvent('gv-viewer-shell-ready',event=>event.detail?.version==='10V');", "const startupVisible=waitForViewerEvent('gv-viewer-startup-visible',event=>event.detail?.version==='10V');")
          old=" const viewerInit=initializeViewer();\n await startSplash();\n if(splashFrame.isConnected)splashFrame.remove();\n if(launchCover.isConnected)launchCover.remove();\n startupWait.classList.add('gv-visible');\n await Promise.all([viewerInit,shellReady]);\n requestAnimationFrame(()=>startupWait.classList.remove('gv-visible'));\n fullReady.then(installArchivePaintGuard).catch(showError);"
          new=" await Promise.all([initializeViewer(),startSplash(),startupVisible]);\n requestAnimationFrame(()=>{if(splashFrame.isConnected)splashFrame.remove();if(launchCover.isConnected)launchCover.remove()});\n fullReady.catch(showError);"
          assert l.count(old)==1
          l=l.replace(old,new,1)
          lp.write_text(l)
          PY

          test "$(git hash-object viewer/GV-beta-0010V.py)" = "87944256a5a0c197254bc3a5f9738548d8c7c0c4"
          test "$(git hash-object mobile/beta/10V.html)" = "2d0425bb68a04dc4cec8c0b4ffc2329c3ccb0c85"
          python -m py_compile viewer/GV-beta-0010V.py
          git diff --check
          rm -f .github/workflows/fix-10v-archive-once.yml
          git rm .github/workflows/fix-10v-startup-archive-once.yml
          git add viewer/GV-beta-0010V.py mobile/beta/10V.html
          git add -A .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '10V surgical startup and archive handoff repair' \
            -m 'ECO-ID: GV-10V-STARTUP-ARCHIVE-002' \
            -m 'AUTHORIZED-PATHS: viewer/GV-beta-0010V.py, mobile/beta/10V.html, .github/workflows/fix-10v-archive-once.yml, .github/workflows/fix-10v-startup-archive-once.yml' \
            -m 'REQUIREMENTS: Python-owned startup comet; parallel module fetch; load archive before switching; no black/white stall' \
            -m 'ARCHIVE-AUTHORIZED: false' \
            -m 'USER-GO: true'
          git push origin HEAD:beta
