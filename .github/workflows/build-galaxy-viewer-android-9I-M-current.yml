name: Build Current Galaxy Viewer Android 9I-M

on:
  push:
    branches:
      - beta
    paths:
      - '.github/workflows/build-galaxy-viewer-android-9I-M-current.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-current-9im:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Verify authorized current Viewer and build standalone assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object viewer/GV-beta-0009I.py)" = "c618320f9ddad3e243f2fc5af436eb6bb678a6b5"
          grep -q "DISPLAY_VERSION='9I-M'" viewer/GV-beta-0009I.py
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('.github/scripts').resolve()))
          import prepare_galaxy_viewer_9im as p
          p.EXPECTED_VIEWER='c618320f9ddad3e243f2fc5af436eb6bb678a6b5'
          p.patch_viewer=lambda: None
          p.copy_assets()
          p.patch_packaged_splash()
          p.build_standalone()
          p.patch_android_identity()
          p.verify()
          index=(p.ASSETS/'index.html').read_text(encoding='utf-8')
          assert 'font-size:22px!important' in index
          assert 'border:2px solid #FFD85A!important' in index
          assert 'width:min(620px,96vw)!important' in index
          assert 'border:2px solid #4F8CFF!important' in index
          assert 'Hubble-NASA-ESA-BW.png' in index
          assert "DISPLAY_VERSION='9I-M'" in index
          PY
          test "$(git hash-object viewer/GV-beta-0009I.py)" = "c618320f9ddad3e243f2fc5af436eb6bb678a6b5"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build current 9I-M APK
        working-directory: android/galaxy-viewer-9i
        run: gradle --no-daemon :app:assembleDebug

      - name: Inspect exact APK payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from zipfile import ZipFile
          apk='android/galaxy-viewer-9i/app/build/outputs/apk/debug/app-debug.apk'
          with ZipFile(apk) as z:
              names=set(z.namelist())
              for required in ['assets/index.html','assets/splash/index.html','assets/data/gv-hubble-galaxies-full-0002.json','assets/artwork/GV-reticle-0001.svg','assets/app-icon.png']:
                  assert required in names, required
              s=z.read('assets/index.html').decode('utf-8')
              for marker in ["DISPLAY_VERSION='9I-M'",'font-size:22px!important','border:2px solid #FFD85A!important','width:min(620px,96vw)!important','border:2px solid #4F8CFF!important','Hubble-NASA-ESA-BW.png']:
                  assert marker in s, marker
          PY

      - name: Stage and hash APK
        shell: bash
        run: |
          set -euo pipefail
          cp android/galaxy-viewer-9i/app/build/outputs/apk/debug/app-debug.apk Galaxy-Viewer-9I-M.apk
          sha256sum Galaxy-Viewer-9I-M.apk | tee Galaxy-Viewer-9I-M.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Viewer-9I-M-current
          path: |
            Galaxy-Viewer-9I-M.apk
            Galaxy-Viewer-9I-M.sha256
          if-no-files-found: error

      - name: Publish current 9I-M APK without overwriting frozen release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view galaxy-viewer-9i-m-current >/dev/null 2>&1; then
            echo 'Current 9I-M build release already exists; refusing overwrite.' >&2
            exit 1
          fi
          gh release create galaxy-viewer-9i-m-current Galaxy-Viewer-9I-M.apk Galaxy-Viewer-9I-M.sha256 --target "${GITHUB_SHA}" --title 'Galaxy Viewer 9I-M — Current Android Build' --notes 'Rebuilt from the current approved 9I-M Viewer blob c618320f9ddad3e243f2fc5af436eb6bb678a6b5. Viewer source remains 9I-M; no release-letter increment.'
