name: Fix NGC 2566 Hubble Distance
on:
  push:
    branches: [release]
    paths:
      - ".github/workflows/fix-ngc2566-hubble-distance.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  correct-hubble-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Correct NGC 2566 from measured redshift
        run: python .github/scripts/fix_ngc2566_hubble_distance.py
      - name: Commit catalog correction
        run: |
          if git diff --quiet -- viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json
          git commit -m "Correct NGC 2566 Hubble distance and redshift"
          git push origin HEAD:release
