name: Build and Smoke-Test Galaxy Viewer 10G
on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/build-galaxy-viewer-10g-local-launcher.yml'
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
      - name: Expose build run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='galaxy-viewer-10g-smoke' \
            -f description="Android smoke test run ${GITHUB_RUN_ID}" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare proven-shell 10G payload
        run: python3 .github/scripts/build_10g_flatten.py
      - name: Build exact test APK
        run: gradle --no-daemon -p android/galaxy-viewer-10e :app:assembleDebug
      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          APK=android/galaxy-viewer-10e/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" Galaxy-Viewer-10G-SMOKE-TESTED.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.gear66me.galaxyviewer10g'" /tmp/badging.txt
          grep -q "application-label:'Galaxy Viewer 10G'" /tmp/badging.txt
          unzip -p "$APK" assets/index.html | grep -q 'font-family:"Space Age",sans-serif!important'
          unzip -p "$APK" assets/index.html | grep -q 'VERSION 10G'
          unzip -p "$APK" assets/index.html | grep -q 'GV-beta-0010F.py'
          unzip -p "$APK" assets/index.html | grep -q 'gv-info-module-0001.js'
          unzip -l "$APK" | grep -q 'assets/artwork/Space-Age.otf'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum Galaxy-Viewer-10G-SMOKE-TESTED.apk | tee Galaxy-Viewer-10G-SMOKE-TESTED.apk.sha256
      - name: Android emulator launch test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            APK=Galaxy-Viewer-10G-SMOKE-TESTED.apk
            PKG=com.gear66me.galaxyviewer10g
            ACT=com.gear66me.galaxyviewer10e.MainActivity
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop "$PKG" || true
            adb shell am start -W -n "$PKG/$ACT" | tee smoke-start.txt
            grep -q 'Status: ok' smoke-start.txt
            sleep 65
            adb shell pidof "$PKG" | tee smoke-pid.txt
            test -s smoke-pid.txt
            adb shell dumpsys activity activities > smoke-activity.txt
            grep -q "$PKG/$ACT" smoke-activity.txt
            adb shell screencap -p /sdcard/10g-smoke.png
            adb pull /sdcard/10g-smoke.png 10g-smoke.png
            adb logcat -d -v threadtime > 10g-logcat.txt
            adb shell uiautomator dump /sdcard/10g-window.xml || true
            adb pull /sdcard/10g-window.xml 10g-window.xml || true
            if grep -Eqi 'FAILED TO LOAD|readiness timeout|Viewer startup failed' 10g-window.xml 2>/dev/null; then
              echo 'Visible launcher failure detected'; exit 21
            fi
            if grep -Eqi 'FATAL EXCEPTION|Fatal signal|Process com\.gear66me\.galaxyviewer10g .* died|Render process.*gone|renderer.*crash|AwContents.*render.*gone|crashpad|OutOfMemoryError|low memory killer.*galaxyviewer10g' 10g-logcat.txt; then
              echo 'Android/WebView crash signature detected'; exit 22
            fi
            echo 'ANDROID SMOKE GATE PASSED: process and activity survived 65 seconds'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Galaxy-Viewer-10G-SMOKE-DIAGNOSTICS
          path: |
            Galaxy-Viewer-10G-SMOKE-TESTED.apk
            Galaxy-Viewer-10G-SMOKE-TESTED.apk.sha256
            10g-smoke.png
            10g-logcat.txt
            10g-window.xml
            smoke-start.txt
            smoke-pid.txt
            smoke-activity.txt
          if-no-files-found: ignore
          retention-days: 30
      - name: Mark smoke test successful
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='galaxy-viewer-10g-smoke' \
            -f description="APK installed and survived Android launch test" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
