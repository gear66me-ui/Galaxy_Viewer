name: Build and Smoke-Test Galaxy Viewer 10G

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/build-galaxy-viewer-10g-local-launcher.yml'
      - '.github/scripts/build_10g_flatten.py'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Expose build run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='galaxy-viewer-10g-smoke' \
            -f description="10G standalone Android verification ${GITHUB_RUN_ID}" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          ls -l /dev/kvm || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Snapshot protected 10G source
        shell: bash
        run: |
          set -euo pipefail
          sha256sum viewer/GV-beta-0010G.py | tee 10g-source-before.sha256
          git diff --exit-code -- viewer/GV-beta-0010G.py

      - name: Package authoritative standalone 10G read-only
        run: python3 .github/scripts/build_10g_flatten.py

      - name: Verify 10G source remained read-only
        shell: bash
        run: |
          set -euo pipefail
          sha256sum viewer/GV-beta-0010G.py | tee 10g-source-after.sha256
          cmp 10g-source-before.sha256 10g-source-after.sha256
          git diff --exit-code -- viewer/GV-beta-0010G.py
          grep -q "const VERSION='10G';" viewer/GV-beta-0010G.py
          grep -q "const DISPLAY_VERSION='10G';" viewer/GV-beta-0010G.py
          grep -q 'GalaxyViewerInfo10G' viewer/GV-beta-0010G.py

      - name: Build exact 10G APK
        run: gradle --no-daemon -p /tmp/galaxy-viewer-10g-build :app:assembleDebug

      - name: Static APK validation
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/galaxy-viewer-10g-build/app/build/outputs/apk/debug/app-debug.apk
          OUT=Galaxy-Viewer-10G-STANDALONE-VERIFIED.apk
          test -s "$APK"
          cp "$APK" "$OUT"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.gear66me.galaxyviewer10g'" apk-badging.txt
          grep -q "versionName='10G-standalone-apk-3'" apk-badging.txt
          grep -q "application-label:'Galaxy Viewer 10G'" apk-badging.txt
          grep -q "launchable-activity: name='com.gear66me.galaxyviewer10g.MainActivity'" apk-badging.txt
          unzip -p "$APK" assets/index.html > apk-index.html
          grep -q 'font-family:"Space Age",sans-serif!important' apk-index.html
          grep -q 'VERSION 10G' apk-index.html
          grep -q 'GalaxyViewerInfo10G' apk-index.html
          grep -q 'gv-viewer-ready' apk-index.html
          grep -q 'gv-viewer-failed' apk-index.html
          grep -q 'SPLASH_COMPLETION_GRACE_MS=15000' apk-index.html
          ! grep -q 'APK_WEAK_READY_CONDITION_PASS' apk-index.html
          ! grep -Eq 'GV-beta-[0-9A-Z-]+\.py' apk-index.html
          test "$(grep -o '</script>' apk-index.html | wc -l)" -eq 1
          unzip -l "$APK" | tee apk-files.txt
          grep -q 'assets/artwork/Space-Age.otf' apk-files.txt
          grep -q 'assets/artwork/icon.svg' apk-files.txt
          ! grep -Eq 'assets/viewer/GV-beta-[^ ]+\.py' apk-files.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          unzip -t "$APK" | tee apk-zip-test.txt
          grep -q 'No errors detected' apk-zip-test.txt
          sha256sum "$OUT" | tee "$OUT.sha256"

      - name: Android repeated-launch gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu host -noaudio -no-boot-anim -camera-back none
          script: |
            set -e
            PKG=com.gear66me.galaxyviewer10g
            ACT=com.gear66me.galaxyviewer10g.MainActivity
            adb install -r Galaxy-Viewer-10G-STANDALONE-VERIFIED.apk
            adb logcat -c

            launch_and_verify () {
              N="$1"
              adb shell am force-stop "$PKG" || true
              adb shell am start -W -n "$PKG/$ACT" > "launch-${N}.txt"
              grep -q 'Status: ok' "launch-${N}.txt"
              sleep 35
              adb shell pidof "$PKG" > "pid-${N}.txt"
              test -s "pid-${N}.txt"
              adb shell dumpsys activity activities > "activity-${N}.txt"
              grep -q "$PKG/$ACT" "activity-${N}.txt"
              adb shell screencap -p "/sdcard/10g-launch-${N}.png"
              adb pull "/sdcard/10g-launch-${N}.png" "10g-launch-${N}.png"
            }

            launch_and_verify 1
            launch_and_verify 2
            launch_and_verify 3

            adb shell input tap 540 2300 || true
            sleep 20
            adb shell pidof "$PKG" > pid-after-random.txt
            test -s pid-after-random.txt
            adb shell screencap -p /sdcard/10g-after-random.png
            adb pull /sdcard/10g-after-random.png 10g-after-random.png
            adb logcat -d -v threadtime > 10g-logcat.txt
            grep -Eqi 'FATAL EXCEPTION|Fatal signal|Process com\.gear66me\.galaxyviewer10g .* died|Render process.*gone|renderer.*crash|OutOfMemoryError|Uncaught (SyntaxError|TypeError|ReferenceError)|GALAXY VIEWER 10G APK FAILURE' 10g-logcat.txt && exit 22 || true
            echo 'ANDROID REPEATED-LAUNCH GATE PASSED'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Galaxy-Viewer-10G-STANDALONE-VERIFIED
          path: |
            Galaxy-Viewer-10G-STANDALONE-VERIFIED.apk
            Galaxy-Viewer-10G-STANDALONE-VERIFIED.apk.sha256
            10g-source-before.sha256
            10g-source-after.sha256
            apk-badging.txt
            apk-index.html
            apk-files.txt
            apk-signature.txt
            apk-zip-test.txt
            10g-launch-1.png
            10g-launch-2.png
            10g-launch-3.png
            10g-after-random.png
            10g-logcat.txt
            launch-1.txt
            launch-2.txt
            launch-3.txt
            pid-1.txt
            pid-2.txt
            pid-3.txt
            pid-after-random.txt
            activity-1.txt
            activity-2.txt
            activity-3.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Mark smoke test successful
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='galaxy-viewer-10g-smoke' \
            -f description="Standalone 10G APK passed repeated-launch gate" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
