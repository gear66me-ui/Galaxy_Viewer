name: Build Galaxy Viewer 10G Flattened APK
on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/build-galaxy-viewer-10g-local-launcher.yml'
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
      - name: Expose build run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='galaxy-viewer-10g-apk' \
            -f description="Actions run ${GITHUB_RUN_ID}" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Flatten 10G into proven Android shell
        run: python3 .github/scripts/build_10g_flatten.py
      - name: Build 10G R3 APK
        run: gradle --no-daemon -p android/galaxy-viewer-10e :app:assembleDebug
      - name: Validate and package APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android/galaxy-viewer-10e/app/build/outputs/apk/debug/app-debug.apk
          OUT=Galaxy-Viewer-10G-R3.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.gear66me.galaxyviewer10g'" /tmp/badging.txt
          grep -q "versionName='10G-flattened-3'" /tmp/badging.txt
          grep -q "application-label:'Galaxy Viewer 10G'" /tmp/badging.txt
          unzip -p "$APK" assets/index.html | grep -q 'GalaxyViewerInfo10G'
          unzip -p "$APK" assets/index.html | grep -q 'VERSION 10G'
          ! unzip -p "$APK" assets/index.html | grep -q 'fetch(VIEWER_URL'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Viewer-10G-R3
          path: |
            Galaxy-Viewer-10G-R3.apk
            Galaxy-Viewer-10G-R3.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish 10G R3 installer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=galaxy-viewer-10g-flattened-3
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" Galaxy-Viewer-10G-R3.apk Galaxy-Viewer-10G-R3.apk.sha256 --target "$(git rev-parse HEAD)" --title 'Galaxy Viewer 10G R3 — Flattened Viewer' --notes 'R3 removes the runtime 10G-to-10F composition chain. Frozen 10F HTML/JS and the 10G INFO module are flattened into one APK-local document at build time.'
      - name: Mark build successful
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='galaxy-viewer-10g-apk' \
            -f description="APK ready in run ${GITHUB_RUN_ID}" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
