name: Patch ECO Current Viewer Promotion Policy
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/patch-eco-current-viewer-promotion-policy.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Add mandatory current Viewer promotion rule without changing workflow behavior
        shell: bash
        run: |
          set -euo pipefail
          P='.github/workflows/automatic-change-control-log.yml'
          test "$(git hash-object "$P")" = '3eee1e1b7471d4fada6a1327fe6062bd53114e04'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/automatic-change-control-log.yml')
          s=p.read_text()
          marker='# MANDATORY GENERIC APP CURRENT-VIEWER PROMOTION'
          assert marker not in s
          anchor='name: Automatic Change Control Log\n\n'
          assert s.startswith(anchor)
          block='''# ================================================================
# MANDATORY GENERIC APP CURRENT-VIEWER PROMOTION
# ================================================================
#
# This is a standing requirement for every future Viewer-affecting
# Engineering Change Order.
#
# Creating and validating a new Viewer release is NOT sufficient.
# Before a Viewer ECO may be reported complete, the rolling generic app
# pointer `viewer/gv-current-viewer.json` MUST be promoted to the exact
# newly approved Viewer release and fetch-back verified.
#
# The permanent generic bootstrap MUST remain version-agnostic. Do not
# rebuild or rename the installed generic APK merely to advance Viewer
# revisions. The installed generic app obtains the current approved Viewer
# from `viewer/gv-current-viewer.json`.
#
# Every Viewer-affecting ECO workflow MUST invoke the permanent reusable
# workflow `.github/workflows/promote-current-viewer.yml` after all source,
# syntax, integrity, scope and behavioral gates for the new release pass.
# The promotion inputs MUST identify the exact new display version and exact
# Viewer filename. Promotion MUST NOT happen before those release gates pass.
#
# A Viewer-affecting ECO is a FAILURE / INCOMPLETE release if the new Viewer
# exists but `viewer/gv-current-viewer.json` still selects an older Viewer.
# The final completion report MUST state and verify the current pointer.
#
# Historical Viewer files, old launchers, the generic APK, Android package
# identity, artwork and unrelated delivery files remain protected unless an
# ECO explicitly authorizes them.
#
'''
          p.write_text(anchor+block+s[len(anchor):])
          PY
          # Executable workflow body must be preserved exactly from the first `on:` onward.
          git show HEAD:"$P" | sed -n '/^on:$/,$p' > /tmp/before-body
          sed -n '/^on:$/,$p' "$P" > /tmp/after-body
          cmp /tmp/before-body /tmp/after-body
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "$P"
          grep -q 'MANDATORY GENERIC APP CURRENT-VIEWER PROMOTION' "$P"
          grep -q 'promote-current-viewer.yml' "$P"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$P"
          git commit -m 'Require current Viewer promotion in every Viewer ECO'
          git fetch origin beta
          git rebase origin/beta
          git push origin HEAD:beta
