name: Build Galaxy Viewer Android 10E Generic R2

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/build-galaxy-viewer-android-10E-generic-r2.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: galaxy-viewer-10e-generic
  APK_NAME: Galaxy-Viewer-10E-Generic.apk

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Lock protected files
        shell: bash
        run: |
          set -euo pipefail
          echo "NINE_I_HTML=$(git hash-object mobile/beta/9I.html)" >> "$GITHUB_ENV"
          echo "NINE_I_APP=$(git hash-object mobile/beta/9I-app.html)" >> "$GITHUB_ENV"
          echo "NINE_I_VIEWER=$(git hash-object viewer/GV-beta-0009I.py)" >> "$GITHUB_ENV"
          echo "TEN_D_VIEWER=$(git hash-object viewer/GV-beta-0010D.py)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate 10E and persistent generic shell
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, shutil

          baseline=Path('viewer/GV-beta-0010D.py')
          candidate=Path('viewer/GV-beta-0010E.py')
          if candidate.exists(): raise SystemExit('10E already exists; refusing overwrite')
          s=baseline.read_text(encoding='utf-8')
          s=s.replace('# GV-beta-0010D','# GV-beta-0010E',1)
          s=s.replace('gv-10d-version','gv-10e-version')
          s=s.replace('VERSION 10D','VERSION 10E')
          s=s.replace("const VERSION='10D';","const VERSION='10E';")
          s=s.replace("const DISPLAY_VERSION='10D';","const DISPLAY_VERSION='10E';")
          s=s.replace('GV9I','GV10E').replace('gv9i','gv10e').replace('__gv9i','__gv10e')
          s=s.replace('GV-9I','GV-10E').replace('GALAXY VIEWER 9I','GALAXY VIEWER 10E')
          s=s.replace('9I','10E').replace('9i','10e')
          s=s.replace('source=android-10d','source=android-10e')
          candidate.write_text(s,encoding='utf-8')
          legacy=('9I-app.html','GV9I','gv9i','__gv9i','GV-9I','GALAXY VIEWER 9I','source=android-10d')
          hits=[x for x in legacy if x in s]
          if hits: raise SystemExit('legacy runtime references remain in 10E: '+repr(hits))
          if s.count("const VERSION='10E';")!=1 or s.count("const DISPLAY_VERSION='10E';")!=1: raise SystemExit('10E identity mismatch')
          Path('viewer/gv-current-viewer.json').write_text(json.dumps({'version':'10E','viewer':'GV-beta-0010E.py'},indent=2)+'\n',encoding='utf-8')

          gate=Path('.github/workflows/galaxy-viewer-release-gate.yml')
          g=gate.read_text(encoding='utf-8')
          old='          python -m py_compile "$CANDIDATE_PATH"\n'
          new="          python - <<'PY'\n          import os,pathlib\n          p=pathlib.Path(os.environ['CANDIDATE_PATH'])\n          compile(p.read_text(encoding='utf-8'),str(p),'exec')\n          PY\n"
          if old in g: gate.write_text(g.replace(old,new,1),encoding='utf-8')
          elif "compile(p.read_text(encoding='utf-8'),str(p),'exec')" not in g: raise SystemExit('release gate baseline unexpected')

          root=Path('android/galaxy-viewer-10e')
          if root.exists(): raise SystemExit('10E android project already exists; refusing overwrite')
          java=root/'app/src/main/java/com/gear66me/galaxyviewer10e'
          assets=root/'app/src/main/assets'
          java.mkdir(parents=True); (assets/'viewer').mkdir(parents=True); (assets/'artwork').mkdir(parents=True)
          (root/'settings.gradle').write_text("""pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
rootProject.name='GalaxyViewer10EGeneric'
include ':app'
""",encoding='utf-8')
          (root/'build.gradle').write_text("""plugins { id 'com.android.application' version '8.7.3' apply false }
""",encoding='utf-8')
          (root/'gradle.properties').write_text("""org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=false
""",encoding='utf-8')
          (root/'app/build.gradle').write_text("""plugins { id 'com.android.application' }
android {
 namespace 'com.gear66me.galaxyviewer10e'
 compileSdk 35
 defaultConfig { applicationId 'com.gear66me.galaxyviewer10e'; minSdk 29; targetSdk 35; versionCode 1007; versionName '10E-generic' }
}
""",encoding='utf-8')
          (root/'app/src/main/AndroidManifest.xml').write_text("""<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
 <uses-permission android:name="android.permission.INTERNET" />
 <application android:allowBackup="false" android:label="Galaxy Viewer 10E" android:usesCleartextTraffic="false" android:theme="@android:style/Theme.Material.NoActionBar">
  <activity android:name=".MainActivity" android:configChanges="keyboardHidden|orientation|screenSize" android:exported="true" android:screenOrientation="portrait">
   <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
  </activity>
 </application>
</manifest>
""",encoding='utf-8')
          (java/'MainActivity.java').write_text(r'''package com.gear66me.galaxyviewer10e;
import android.app.*; import android.content.*; import android.graphics.Color; import android.net.Uri; import android.os.*; import android.view.View; import android.webkit.*; import android.widget.TextView;
public final class MainActivity extends Activity {
 private WebView web;
 @Override protected void onCreate(Bundle b){super.onCreate(b);getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_FULLSCREEN|View.SYSTEM_UI_FLAG_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY|View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN|View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_LAYOUT_STABLE);open();}
 private void open(){web=new WebView(this);web.setBackgroundColor(Color.BLACK);WebSettings s=web.getSettings();s.setJavaScriptEnabled(true);s.setDomStorageEnabled(true);s.setDatabaseEnabled(true);s.setAllowFileAccess(true);s.setAllowContentAccess(false);s.setAllowFileAccessFromFileURLs(true);s.setAllowUniversalAccessFromFileURLs(true);s.setMediaPlaybackRequiresUserGesture(false);s.setCacheMode(WebSettings.LOAD_DEFAULT);s.setUserAgentString(s.getUserAgentString()+" GalaxyViewer10E/10E-generic");web.setWebChromeClient(new WebChromeClient());web.setWebViewClient(new WebViewClient(){@Override public boolean shouldOverrideUrlLoading(WebView v,WebResourceRequest r){Uri u=r.getUrl();String q=u==null?"":u.getScheme();return !("https".equalsIgnoreCase(q)||"file".equalsIgnoreCase(q));}@Override public void onReceivedError(WebView v,WebResourceRequest r,WebResourceError e){if(r.isForMainFrame())fatal("LOAD ERROR: "+e.getDescription());}});web.setDownloadListener((url,ua,cd,mime,len)->{try{Uri u=Uri.parse(url);if(!"https".equalsIgnoreCase(u.getScheme()))return;DownloadManager.Request q=new DownloadManager.Request(u);q.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);q.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS,URLUtil.guessFileName(url,cd,mime));((DownloadManager)getSystemService(Context.DOWNLOAD_SERVICE)).enqueue(q);}catch(Exception ignored){}});setContentView(web);web.loadUrl("file:///android_asset/index.html");}
 private void fatal(String m){runOnUiThread(()->{TextView t=new TextView(this);t.setText("GALAXY VIEWER 10E\n\n"+m);t.setTextColor(Color.WHITE);t.setBackgroundColor(Color.BLACK);t.setTextSize(16);t.setPadding(40,40,40,40);setContentView(t);});}
 @Override public void onBackPressed(){if(web!=null&&web.canGoBack())web.goBack();else super.onBackPressed();}
}
''',encoding='utf-8')

          index=r'''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#000"><title>GALAXY VIEWER 10E</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff}#gv-apk-cover{position:fixed;inset:0;z-index:2147483646;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;background:#000}#gv-apk-cover img{width:min(42vw,240px);max-height:42vh}.v{color:#FFD85A;font:16px sans-serif;letter-spacing:1.2px}#gv-splash-frame{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:2147483645;background:#000;visibility:hidden}#gv-launch-error{display:none;position:fixed;inset:0;z-index:2147483647;padding:24px;background:#000;color:#FFD166;white-space:pre-wrap;font:14px monospace}</style></head><body><div id="gv-apk-cover"><img src="artwork/icon.svg" alt="GALAXY VIEWER"><div class="v">VERSION 10E</div></div><iframe id="gv-splash-frame"></iframe><div id="gv-launch-error"></div><script>(async()=>{'use strict';const REMOTE='https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/beta/viewer/';const cover=document.getElementById('gv-apk-cover'),splash=document.getElementById('gv-splash-frame'),err=document.getElementById('gv-launch-error');const read=async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status+' '+u);return r.text()};const extract=src=>{const h=[...src.matchAll(/display\(HTML\(\"\"\"([\s\S]*?)\"\"\"\)\)/g)],j=[...src.matchAll(/display\(Javascript\(r\"\"\"([\s\S]*?)\"\"\"\)\)/g)];if(h.length!==1||j.length!==1)throw new Error('Viewer extraction failed');return [h[0][1],j[0][1]]};const resolve=async()=>{try{const m=JSON.parse(await read(REMOTE+'gv-current-viewer.json?t='+Date.now()));if(!/^GV-beta-[A-Za-z0-9._-]+\.py$/.test(m.viewer))throw new Error('bad manifest');return [m,await read(REMOTE+m.viewer+'?t='+Date.now())]}catch(e){const m=JSON.parse(await read('viewer/gv-current-viewer.json'));return [m,await read('viewer/'+m.viewer)]}};const ready=()=>new Promise((ok,no)=>{const end=performance.now()+30000;const f=()=>{if(document.getElementById('aladin-cosmic-command-test')?.querySelector('canvas')&&window.aladin_cosmic_command_test)return ok();if(performance.now()>end)return no(new Error('10E Viewer readiness timeout'));setTimeout(f,100)};f()});try{const started=performance.now();splash.src='viewer/releases/splash/Galaxy-Viewer-Singularity-FINAL/index.html';const [manifest,src]=await resolve();if(manifest.version!=='10E')throw new Error('Manifest did not select 10E');const [html,js]=extract(src);document.body.insertAdjacentHTML('beforeend',html);const sc=document.createElement('script');sc.textContent=js;document.body.appendChild(sc);await new Promise(r=>setTimeout(r,Math.max(0,3500-(performance.now()-started))));splash.style.visibility='visible';cover.remove();await Promise.all([ready(),new Promise(r=>setTimeout(r,5000))]);splash.remove()}catch(e){err.style.display='block';err.textContent='GALAXY VIEWER 10E FAILED TO LOAD\n\n'+String(e?.stack||e)}})();</script></body></html>'''
          (assets/'index.html').write_text(index,encoding='utf-8')
          (assets/'viewer/gv-current-viewer.json').write_text(json.dumps({'version':'10E','viewer':'GV-beta-0010E.py'},indent=2)+'\n',encoding='utf-8')
          shutil.copy2(candidate,assets/'viewer/GV-beta-0010E.py')
          shutil.copy2('viewer/artwork/icon.svg',assets/'artwork/icon.svg')
          shutil.copytree('viewer/releases/splash/Galaxy-Viewer-Singularity-FINAL',assets/'viewer/releases/splash/Galaxy-Viewer-Singularity-FINAL',dirs_exist_ok=True)
          for src in ['viewer/modules/gv-hamburger-menu-0002.js','viewer/modules/gv-coordinate-overlay-0004.js','viewer/modules/gv-target-simbad-0001.js','viewer/modules/gv-random-galaxy-0028.js','viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0010.json','viewer/artwork/GV-reticle-0001.svg']:
              p=Path(src);d=assets/p;d.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,d)
          PY

      - name: Pre-build surgical audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          legacy=('9I-app.html','GV9I','gv9i','__gv9i','GV-9I','GALAXY VIEWER 9I','source=android-10d')
          files=[Path('viewer/GV-beta-0010E.py')]
          files += [p for p in Path('android/galaxy-viewer-10e').rglob('*') if p.is_file() and p.suffix.lower() in {'.html','.java','.gradle','.properties','.xml','.py'}]
          hits=[]
          for p in files:
              s=p.read_text(encoding='utf-8')
              for x in legacy:
                  if x in s:hits.append((str(p),x))
          if hits: raise SystemExit('legacy runtime references remain: '+repr(hits))
          print('10E active-code reference audit PASS')
          PY
          test "$(git hash-object mobile/beta/9I.html)" = "$NINE_I_HTML"
          test "$(git hash-object mobile/beta/9I-app.html)" = "$NINE_I_APP"
          test "$(git hash-object viewer/GV-beta-0009I.py)" = "$NINE_I_VIEWER"
          test "$(git hash-object viewer/GV-beta-0010D.py)" = "$TEN_D_VIEWER"
          test ! -d viewer/__pycache__

      - name: Build APK
        run: gradle --no-daemon -p android/galaxy-viewer-10e :app:assembleDebug

      - name: Validate finished APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android/galaxy-viewer-10e/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/10e-badging.txt
          grep -q "package: name='com.gear66me.galaxyviewer10e'" /tmp/10e-badging.txt
          grep -q "application-label:'Galaxy Viewer 10E'" /tmp/10e-badging.txt
          grep -q "launchable-activity: name='com.gear66me.galaxyviewer10e.MainActivity'" /tmp/10e-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -l "$APK" | grep -q 'assets/viewer/gv-current-viewer.json'
          unzip -l "$APK" | grep -q 'assets/viewer/GV-beta-0010E.py'
          rm -rf /tmp/apk10e;mkdir /tmp/apk10e;unzip -qq "$APK" -d /tmp/apk10e
          if grep -RInaE '9I-app\.html|GV9I|gv9i|__gv9i|GV-9I|GALAXY VIEWER 9I|source=android-10d' /tmp/apk10e; then exit 1; fi
          cp "$APK" "$APK_NAME"
          sha256sum "$APK_NAME" | tee "${APK_NAME}.sha256"

      - name: Verify protected files and commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object mobile/beta/9I.html)" = "$NINE_I_HTML"
          test "$(git hash-object mobile/beta/9I-app.html)" = "$NINE_I_APP"
          test "$(git hash-object viewer/GV-beta-0009I.py)" = "$NINE_I_VIEWER"
          test "$(git hash-object viewer/GV-beta-0010D.py)" = "$TEN_D_VIEWER"
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/GV-beta-0010E.py viewer/gv-current-viewer.json android/galaxy-viewer-10e .github/workflows/galaxy-viewer-release-gate.yml
          git diff --cached --name-only | tee /tmp/changed.txt
          if grep -E '^mobile/beta/9I|^viewer/GV-beta-0009I|^android/galaxy-viewer-9i' /tmp/changed.txt; then exit 1; fi
          git commit -m 'Release standalone Galaxy Viewer 10E and generic APK shell'
          git fetch origin beta;git rebase origin/beta;git push origin HEAD:beta
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Viewer-10E-Generic
          path: |
            Galaxy-Viewer-10E-Generic.apk
            Galaxy-Viewer-10E-Generic.apk.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ! gh release view "$RELEASE_TAG" >/dev/null 2>&1
          gh release create "$RELEASE_TAG" "$APK_NAME" "${APK_NAME}.sha256" --target "$RELEASE_COMMIT" --title 'Galaxy Viewer 10E — Generic APK' --notes 'Standalone 10E generic installer. Starts at file:///android_asset/index.html, reads viewer/gv-current-viewer.json, loads 10E directly, and bundles a 10E fallback. Protected 9I website, launcher, Viewer, and 10D baseline were hash-verified unchanged.'
