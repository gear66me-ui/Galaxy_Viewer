name: Verify NGC 6240 distance synchronization — AVM runtime 0006

on:
  push:
    branches: [release]
    paths:
      - .github/workflows/fix-n81-distance-0006.yml
      - viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0006.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avm-runtime-0006-ngc6240-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-ngc6240:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current release head
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Verify all six NGC 6240 provider records in AVM runtime 0006
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0006.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          expected = {
              ("chandra", "chandra-2013-ngc6240"),
              ("chandra", "chandra-2009-ngc6240"),
              ("hubble", "potw1520a"),
              ("hubble", "heic0810ai"),
              ("noirlab", "iotw2342c"),
              ("spitzer", "ssc2009-06a1"),
          }
          records = [
              r for r in data.get("records", [])
              if (r.get("providerKey"), r.get("archiveId")) in expected
          ]
          actual = {(r.get("providerKey"), r.get("archiveId")) for r in records}

          if data.get("version") != "0006":
              raise SystemExit(f"Expected AVM runtime 0006; found {data.get('version')!r}.")
          if actual != expected or len(records) != 6:
              raise SystemExit(
                  f"NGC 6240 provider record mismatch. "
                  f"Missing={sorted(expected - actual)}, unexpected/duplicate count={len(records)}."
              )

          failures = []
          for r in records:
              key = (r.get("providerKey"), r.get("archiveId"))
              science = r.get("science") or {}
              checks = {
                  "distanceMly": r.get("distanceMly") == 349.0,
                  "redshift": r.get("redshift") == 0.024480,
                  "distanceDisplay": r.get("distanceDisplay") == "349 million light-years",
                  "science.distanceMly": science.get("distanceMly") == 349.0,
                  "science.redshift": science.get("redshift") == 0.024480,
                  "science.distanceDisplay": science.get("distanceDisplay") == "349 million light-years",
              }
              bad = [name for name, passed in checks.items() if not passed]
              if bad:
                  failures.append(f"{key}: {', '.join(bad)}")
              else:
                  print(f"PASS {key[0]}/{key[1]}: 349.0 Mly; z=0.024480")

          if failures:
              raise SystemExit("NGC 6240 runtime verification failed:\\n" + "\\n".join(failures))

          print("PASS: all six NGC 6240 records are synchronized in AVM runtime 0006.")
          print(f"PASS: catalog contains {data.get('recordCount')} records.")
