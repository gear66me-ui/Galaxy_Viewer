name: AR41 Random Navigation Compatibility Builder

on:
  push:
    branches: [ beta ]
    paths:
      - '.github/ar41-trigger.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Build Random 0114 and AR41
        run: |
          python - <<'PY'
          from pathlib import Path

          r0=Path('viewer/modules/random-galaxy/gv-random-galaxy-0113.js')
          r1=Path('viewer/modules/random-galaxy/gv-random-galaxy-0114.js')
          s=r0.read_text()

          # Strict preconditions: AR40/0113 bug must be present exactly as diagnosed.
          required=[
              "const VERSION='0113';",
              "../navigation/gv-navigation-0016.js",
              "return '/viewer/modules/navigation/gv-navigation-0016.js';",
              "if(existing?.VERSION==='0016')",
              "if(existing && existing.VERSION!=='0016')",
              "if(api?.VERSION!=='0016')",
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('PRECONDITION FAILED: '+repr(missing))

          # Version roll and ONLY the Random->Navigation compatibility seam.
          s=s.replace("const VERSION='0113';","const VERSION='0114';",1)
          s=s.replace('gv-navigation-0016.js','gv-navigation-0017.js')
          s=s.replace("VERSION==='0016'","VERSION==='0017'")
          s=s.replace("VERSION!=='0016'","VERSION!=='0017'")
          s=s.replace('NAVIGATION 0016','NAVIGATION 0017')

          # Hard gates: no 0016 runtime dependency may remain in the 0114 seam.
          seam=s[s.index('function navigation0008Url()'):s.index('async function advanceNavigationPlannerAfterArrival')]
          if '0016' in seam:
              raise SystemExit('GATE FAILED: stale Navigation 0016 reference remains in runtime seam')
          for token in [
              "../navigation/gv-navigation-0017.js",
              "return '/viewer/modules/navigation/gv-navigation-0017.js';",
              "if(existing?.VERSION==='0017')",
              "if(existing && existing.VERSION!=='0017')",
              "if(api?.VERSION!=='0017')",
          ]:
              if token not in seam:
                  raise SystemExit('GATE FAILED: missing '+token)

          # Preserve the already-fixed UI release behavior.
          for token in [
              'randomRequestPending=false;',
              'updateRandomButtonReadyState();',
              'setTimeout(()=>{\n      void advanceNavigationPlannerAfterArrival(arrived)',
          ]:
              if token not in s:
                  raise SystemExit('GATE FAILED: UI release invariant missing '+token)

          r1.write_text(s)

          a0=Path('viewer/GV-beta-0012AR-40.py')
          a1=Path('viewer/GV-beta-0012AR-41.py')
          a=a0.read_text()
          for old,new in [
              ("VERSION='12AR-40'","VERSION='12AR-41'"),
              ("DISPLAY_VERSION='12AR-40'","DISPLAY_VERSION='12AR-41'"),
              ("VERSION 12AR-40","VERSION 12AR-41"),
              ('gv-random-galaxy-0113.js','gv-random-galaxy-0114.js'),
              ("RANDOM_GALAXY_VERSION='0113'","RANDOM_GALAXY_VERSION='0114'"),
          ]:
              a=a.replace(old,new)

          if 'gv-navigation-0017.js' not in a or "NAVIGATION_VERSION='0017'" not in a:
              raise SystemExit('GATE FAILED: AR41 does not retain Navigation 0017')
          if 'gv-random-galaxy-0114.js' not in a or "RANDOM_GALAXY_VERSION='0114'" not in a:
              raise SystemExit('GATE FAILED: AR41 does not load Random 0114')
          if 'gv-navigation-0016.js' in a:
              raise SystemExit('GATE FAILED: AR41 regressed to Navigation 0016')

          a1.write_text(a)

          print('AR41 BUILD GATES PASS')
          print('RANDOM 0114: Navigation 0017 seam aligned')
          print('AR41: Navigation 0017 + Random 0114')
          PY

          node --check viewer/modules/random-galaxy/gv-random-galaxy-0114.js
          python -m py_compile viewer/GV-beta-0012AR-41.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/modules/random-galaxy/gv-random-galaxy-0114.js viewer/GV-beta-0012AR-41.py
          git commit -m 'AR41 align Random 0114 with Navigation 0017'
          git push origin beta
