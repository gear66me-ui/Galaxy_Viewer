name: Populate Provider Mirror Folders

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful provider-organization workflow run ID"
        required: true
        default: "38828582399"
      confirm_release_mirror_population:
        description: "Type POPULATE-MIRRORS to confirm writing image files to release"
        required: true
        default: ""

permissions:
  actions: read
  contents: write

concurrency:
  group: populate-provider-mirrors
  cancel-in-progress: false

jobs:
  populate:
    if: ${{ inputs.confirm_release_mirror_population == 'POPULATE-MIRRORS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout release source of truth
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Download provider-organized optimized image artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/provider-input
          for provider in Chandra ESO Hubble JWST NoirLab Spitzer; do
            gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "provider-$provider-optimized-test" --dir "/tmp/provider-input/$provider"
            test -n "$(find "/tmp/provider-input/$provider" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          done
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "provider-image-mappings-and-summary" --dir "/tmp/provider-input/mappings"
          for provider in Chandra ESO Hubble JWST NoirLab Spitzer; do
            test -f "/tmp/provider-input/mappings/$provider-mapping.json"
          done

      - name: Populate provider Mirror directories and validate all images
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow
          python - <<'PY'
          import hashlib, io, json, pathlib, re, zipfile
          from PIL import Image

          repo = pathlib.Path(".")
          input_root = pathlib.Path("/tmp/provider-input")
          providers = {
              "Chandra": "viewer/image-databases/Chandra",
              "ESO": "viewer/image-databases/ESO",
              "Hubble": "viewer/image-databases/Hubble",
              "JWST": "viewer/image-databases/JWST",
              "NoirLab": "viewer/image-databases/NoirLab",
              "Spitzer": "viewer/image-databases/Spitzer",
          }
          summary = {
              "sourceRunId": int(__import__("os").environ.get("SOURCE_RUN_ID", "0")),
              "sourceArtifacts": [],
              "providers": {},
              "viewerCodeModified": False,
              "catalogJsonModified": False,
              "registrationValidated": False,
              "notes": [
                  "Optimized images are test mirror assets, not scientific-registration approval.",
                  "Use the source catalog/AVM runtime metadata for astrometric registration.",
                  "Optimized pixel dimensions are recorded separately; do not assume old image dimensions still apply."
              ]
          }
          failures = []
          for provider, relative in providers.items():
              folder = input_root / provider
              zips = list(folder.glob("*.zip"))
              if len(zips) != 1:
                  failures.append(f"{provider}: expected one optimized-image ZIP, found {len(zips)}")
                  continue
              mapping_path = input_root / "mappings" / f"{provider}-mapping.json"
              if not mapping_path.is_file():
                  failures.append(f"{provider}: mapping.json missing")
                  continue
              mapping = json.loads(mapping_path.read_text(encoding="utf-8"))
              with zipfile.ZipFile(zips[0]) as archive:
                  members = set(archive.namelist())
                  rows = mapping if isinstance(mapping, list) else mapping.get("images", [])
                  if not isinstance(rows, list):
                      failures.append(f"{provider}: mapping.json has an unsupported shape")
                      continue
                  target = repo / relative / "Mirror"
                  target.mkdir(parents=True, exist_ok=True)
                  used = set()
                  output_rows = []
                  for index, row in enumerate(rows):
                      source_member = row.get("bundleFilename")
                      if not source_member or source_member not in members:
                          failures.append(f"{provider}[{index}]: missing ZIP member {source_member!r}")
                          continue
                      blob = archive.read(source_member)
                      try:
                          with Image.open(io.BytesIO(blob)) as im:
                              im.verify()
                          with Image.open(io.BytesIO(blob)) as im:
                              im.load()
                              width, height = im.size
                              fmt = im.format
                      except Exception as exc:
                          failures.append(f"{provider}[{index}]: invalid image {source_member}: {exc}")
                          continue
                      original = pathlib.PurePosixPath(row.get("originalFilename") or pathlib.PurePosixPath(source_member).name).name
                      if not original or original in (".", ".."):
                          original = f"image-{index:05d}.jpg"
                      suffix = pathlib.PurePosixPath(original).suffix or ".jpg"
                      stem = pathlib.PurePosixPath(original).stem or "image"
                      filename = original
                      if filename.casefold() in used:
                          seed = str(row.get("originalMirrorUrl") or row.get("sourceUrl") or source_member)
                          digest = hashlib.sha256(seed.encode("utf-8")).hexdigest()[:10]
                          filename = f"{stem}__{digest}{suffix}"
                          serial = 2
                          while filename.casefold() in used:
                              filename = f"{stem}__{digest}_{serial}{suffix}"
                              serial += 1
                      used.add(filename.casefold())
                      (target / filename).write_bytes(blob)
                      output_rows.append({
                          **row,
                          "mirrorFilename": filename,
                          "relativePath": f"Mirror/{filename}",
                          "optimizedWidth": width,
                          "optimizedHeight": height,
                          "optimizedFormat": fmt,
                          "optimizedBytes": len(blob),
                          "sha256": hashlib.sha256(blob).hexdigest(),
                          "dimensionsChangedFromOriginal": (
                              row.get("originalWidth") is not None and row.get("originalHeight") is not None
                              and (int(row["originalWidth"]) != width or int(row["originalHeight"]) != height)
                          )
                      })
                  (target / "mirror-mapping.json").write_text(json.dumps({
                      "schemaVersion": 1,
                      "provider": provider,
                      "sourceRunId": summary["sourceRunId"],
                      "imageCount": len(output_rows),
                      "images": output_rows
                  }, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
                  summary["providers"][provider] = {
                      "mirrorDirectory": f"{relative}/Mirror/",
                      "images": len(output_rows),
                      "mapping": f"{relative}/Mirror/mirror-mapping.json",
                      "zipArtifact": zips[0].name
                  }
          if failures:
              pathlib.Path("/tmp/mirror-population-errors.json").write_text(json.dumps(failures, indent=2))
              print(json.dumps(failures, indent=2))
              raise SystemExit(f"Validation failed: {len(failures)} issue(s); refusing to commit.")
          out = repo / "viewer/image-databases/mirror-population-test-summary.json"
          out.write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2))
          PY
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}

      - name: Ensure only test Mirror assets and summary changed
        run: |
          set -euo pipefail
          git status --short
          python - <<'PY'
          import subprocess, sys
          allowed = (
              "viewer/image-databases/Chandra/Mirror/",
              "viewer/image-databases/ESO/Mirror/",
              "viewer/image-databases/Hubble/Mirror/",
              "viewer/image-databases/JWST/Mirror/",
              "viewer/image-databases/NoirLab/Mirror/",
              "viewer/image-databases/Spitzer/Mirror/",
              "viewer/image-databases/mirror-population-test-summary.json",
          )
          changed = subprocess.check_output(["git", "status", "--porcelain"], text=True).splitlines()
          paths = [line[3:] for line in changed]
          unexpected = [p for p in paths if not any(p.startswith(prefix) for prefix in allowed)]
          if unexpected:
              print("Unexpected changed paths:", *unexpected, sep="\n")
              sys.exit(1)
          PY

      - name: Commit and push provider Mirror folders to release
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases/Chandra/Mirror \
                  viewer/image-databases/ESO/Mirror \
                  viewer/image-databases/Hubble/Mirror \
                  viewer/image-databases/JWST/Mirror \
                  viewer/image-databases/NoirLab/Mirror \
                  viewer/image-databases/Spitzer/Mirror \
                  viewer/image-databases/mirror-population-test-summary.json
          if git diff --cached --quiet; then
            echo "No mirror changes to commit."
            exit 0
          fi
          git commit -m "Populate provider Mirror folders from optimized test artifacts"
          git push origin HEAD:release

      - name: Report GitHub raw URL pattern
        run: |
          echo "Mirror assets committed to release."
          echo "Raw URL pattern: https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/release/viewer/image-databases/PROVIDER/Mirror/FILENAME"
          echo "Registration still must validate astrometry; image resizing may require dimension-aware metadata scaling."
