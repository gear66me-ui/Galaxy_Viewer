name: Repair Eagle Nebula metadata

on:
  push:
    branches:
      - gv-fix-eagle-metadata
    paths:
      - .github/workflows/repair-eagle-nebula-metadata.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: gv-fix-eagle-metadata
      - name: Patch and validate the two catalog records
        run: python scripts/fix-eagle-nebula-metadata.py
      - name: Commit corrected catalogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0003.json
          if git diff --cached --quiet; then
            echo "No catalog changes needed."
          else
            git commit -m "Correct Eagle Nebula distance, age, and image band"
            git push origin HEAD:gv-fix-eagle-metadata
          fi
