name: Publish Existing Galaxy Image Mirror Artifact

on:
  push:
    branches: [release]
    paths:
      - ".github/workflows/publish-galaxy-image-mirror-artifact.yml"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed mirror-download run ID containing galaxy-image-mirror-1 artifact"
        required: true
        default: "38793695755"
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: galaxy-image-mirror-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout current release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Download completed mirror artifact from earlier run
        uses: actions/download-artifact@v4
        with:
          name: galaxy-image-mirror-1
          path: mirror-artifact
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id || '38793695755' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Recover image files from numbered ZIP chunks
        run: |
          python - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path("mirror-artifact")
          manifest = root / "image-mirror-manifest.json"
          if not manifest.exists():
              raise SystemExit("Manifest missing from saved artifact; refusing to publish.")
          chunks = sorted(root.glob("galaxy-image-mirror-part-*.zip"))
          if not chunks:
              raise SystemExit("No numbered mirror ZIP chunks found in saved artifact.")
          out = pathlib.Path("recovered-images")
          out.mkdir(exist_ok=True)
          total = 0
          for chunk in chunks:
              with zipfile.ZipFile(chunk) as z:
                  for member in z.infolist():
                      if member.is_dir():
                          continue
                      name = pathlib.PurePosixPath(member.filename).name
                      if not name:
                          continue
                      target = out / name
                      with z.open(member) as src, target.open("wb") as dst:
                          import shutil
                          shutil.copyfileobj(src, dst)
                      total += 1
              print(f"Recovered {chunk.name}")
          print(f"Recovered {total} image files")
          if total == 0:
              raise SystemExit("No images recovered.")
          PY

      - name: Publish images as permanent GitHub Release assets and update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path("recovered-images")
          manifest_path = pathlib.Path("mirror-artifact/image-mirror-manifest.json")
          manifest = json.loads(manifest_path.read_text())
          items = [x for x in manifest.get("images", []) if x.get("sha256")]
          if not items:
              raise SystemExit("Manifest contains no successful downloads.")
          tags = ["galaxy-image-mirror-a", "galaxy-image-mirror-b", "galaxy-image-mirror-c", "galaxy-image-mirror-d"]
          chunk_size = 850
          for start in range(0, len(items), chunk_size):
              part = start // chunk_size
              tag = tags[part]
              batch = items[start:start + chunk_size]
              check = subprocess.run(["gh", "release", "view", tag], capture_output=True, text=True)
              if check.returncode:
                  subprocess.run(["gh", "release", "create", tag, "--title", f"Galaxy Image Mirror {tag[-1].upper()}",
                                  "--notes", "Galaxy Viewer image mirror. Manifest on release branch contains source URLs and SHA-256 checksums."], check=True)
              paths = []
              for item in batch:
                  filename = item["filename"]
                  p = root / filename
                  if not p.exists():
                      raise SystemExit(f"Missing recovered image file: {filename}")
                  digest = hashlib.sha256(p.read_bytes()).hexdigest()
                  if digest != item["sha256"]:
                      raise SystemExit(f"SHA-256 mismatch for {filename}; refusing to publish.")
                  paths.append(str(p))
                  item["githubImageUrl"] = f"https://github.com/gear66me-ui/Galaxy_Viewer/releases/download/{tag}/{filename}"
                  item["releaseTag"] = tag
              for offset in range(0, len(paths), 50):
                  subprocess.run(["gh", "release", "upload", tag, *paths[offset:offset+50], "--clobber"], check=True)
              print(f"Published {len(batch)} verified images to {tag}")
          manifest["imageCount"] = len(items)
          manifest["publishedImageCount"] = len(items)
          manifest["sourceArtifactRunId"] = int("${{ inputs.source_run_id }}")
          manifest_path.write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          pathlib.Path("mirror-artifact/image-mirror-manifest.json").write_text(manifest_path.read_text(), encoding="utf-8")
          PY

      - name: Safely commit published manifest to release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p viewer/image-databases/Hubble/mirror
          cp mirror-artifact/image-mirror-manifest.json viewer/image-databases/Hubble/mirror/image-mirror-manifest.json
          if [ -f mirror-artifact/image-mirror-failures.json ]; then
            cp mirror-artifact/image-mirror-failures.json viewer/image-databases/Hubble/mirror/image-mirror-failures.json
          fi
          git add viewer/image-databases/Hubble/mirror/image-mirror-manifest.json viewer/image-databases/Hubble/mirror/image-mirror-failures.json
          if git diff --cached --quiet; then
            echo "Manifest unchanged."
            exit 0
          fi
          git commit -m "Publish verified Galaxy Viewer image mirror manifest"
          for attempt in 1 2 3 4 5; do
            git fetch origin release
            git rebase origin/release
            if git push origin HEAD:release; then
              echo "Manifest committed to latest release tip."
              exit 0
            fi
            echo "release advanced during push attempt $attempt; retrying."
            sleep 2
          done
          echo "Failed to publish manifest after five safe retries."
          exit 1
