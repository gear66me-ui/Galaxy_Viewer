name: Recover Galaxy Image Mirror Manifest

on:
  push:
    branches: [release]
    paths:
      - ".github/workflows/publish-galaxy-image-mirror-artifact.yml"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed mirror-download run ID containing galaxy-image-mirror-1 artifact"
        required: true
        default: "38793695755"
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: galaxy-image-mirror-manifest-recovery
  cancel-in-progress: false

jobs:
  recover-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Download saved mirror artifact
        uses: actions/download-artifact@v4
        with:
          name: galaxy-image-mirror-1
          path: mirror-artifact
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id || '38793695755' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate manifest and existing published image assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || '38793695755' }}
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, os
          root = pathlib.Path("mirror-artifact")
          path = root / "image-mirror-manifest.json"
          if not path.exists():
              raise SystemExit(f"Saved manifest not found at {path}")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          images = [x for x in manifest.get("images", []) if x.get("sha256") and x.get("filename")]
          if not images:
              raise SystemExit("Manifest contains no successfully downloaded images.")
          missing = [k for k in ("sourceUrl", "provider", "catalogRefs") if not all(k in x for x in images)]
          if missing:
              raise SystemExit(f"Manifest lacks required mapping fields for some images: {missing}")
          tags = ["galaxy-image-mirror-a", "galaxy-image-mirror-b", "galaxy-image-mirror-c", "galaxy-image-mirror-d"]
          for i, item in enumerate(images):
              tag = tags[i // 850]
              item["githubImageUrl"] = f"https://github.com/gear66me-ui/Galaxy_Viewer/releases/download/{tag}/{item['filename']}"
              item["releaseTag"] = tag
          manifest["imageCount"] = len(images)
          manifest["publishedImageCount"] = len(images)
          manifest["sourceArtifactRunId"] = int(os.environ["SOURCE_RUN_ID"])
          manifest["manifestRecovery"] = {
              "method": "recovered-from-original-workflow-artifact",
              "sourceRunId": int(os.environ["SOURCE_RUN_ID"]),
              "mappingPreserved": True
          }
          path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\\n", encoding="utf-8")
          failures = root / "image-mirror-failures.json"
          print(f"Validated {len(images)} image mappings.")
          print("Provider counts:")
          counts = {}
          for item in images:
              p = str(item.get("provider", "unknown"))
              counts[p] = counts.get(p, 0) + 1
          for provider, count in sorted(counts.items()):
              print(f"  {provider}: {count}")
          print(f"Failure report present: {failures.exists()}")
          PY

      - name: Commit manifest and failure report safely
        run: |
          set -euo pipefail
          mkdir -p viewer/image-databases/Hubble/mirror
          cp mirror-artifact/image-mirror-manifest.json viewer/image-databases/Hubble/mirror/image-mirror-manifest.json
          if [ -f mirror-artifact/image-mirror-failures.json ]; then
            cp mirror-artifact/image-mirror-failures.json viewer/image-databases/Hubble/mirror/image-mirror-failures.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases/Hubble/mirror/image-mirror-manifest.json
          if [ -f viewer/image-databases/Hubble/mirror/image-mirror-failures.json ]; then
            git add viewer/image-databases/Hubble/mirror/image-mirror-failures.json
          fi
          if git diff --cached --quiet; then
            echo "Recovered manifest already matches release."
            exit 0
          fi
          git commit -m "Recover Galaxy Viewer image source manifest"
          for attempt in 1 2 3 4 5; do
            git fetch origin release
            git rebase origin/release
            if git push origin HEAD:release; then
              echo "Recovered manifest committed to release."
              exit 0
            fi
            echo "release advanced during push attempt $attempt; retrying."
          done
          echo "Could not push manifest after five safe attempts."
          exit 1
