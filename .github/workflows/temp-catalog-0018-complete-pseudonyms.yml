name: Temporary complete Catalog 0018 pseudonym pass

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/temp-catalog-0018-complete-pseudonyms.yml'

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Complete compact pseudonym pass
        shell: bash
        run: |
          git fetch origin beta
          git reset --hard origin/beta
          python - <<'PY'
          import json,re
          from pathlib import Path

          p=Path('viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0018.json')
          d=json.loads(p.read_text(encoding='utf-8'))

          known={
            'NGC 1300':'Prototypical Barred Spiral',
            'NGC 6217':'Barred Spiral Galaxy',
            'NGC 7049':'Backlit Dust-Lane Galaxy',
            'NGC 1672':'Spiral-Arm Stellar Nursery',
            'NGC 1510 / NGC 1512':'Interacting Spiral and Dwarf',
            'NGC 4526':'Whirling Lenticular Galaxy',
            'UGC 8091':'Dwarf Irregular Galaxy',
            'M 83':'Southern Pinwheel Galaxy',
            'NGC 4449':'Stellar Fireworks Galaxy',
            'NGC 660':'Polar Ring Galaxy',
            'NGC 1132':'Fossil Group Giant',
            'NGC 346':'Stellar Sculptors',
            'LEDA 1313424':'Bullseye',
            'NGC 2207 / IC 2163':'Interacting Spiral Pair',
            'REP: M 87':'Black Hole Jet and Nova',
            'IC 1954':'Asymmetric Spiral Galaxy',
            'MCG -03-34-064':'Dual Active Nuclei',
            'UGC 12158':'Asteroid-Photobombed Galaxy',
            'NGC 3783':'Active Spiral Galaxy',
            'AM 1054-325':'String-of-Pearls Galaxy',
            'J020941.1+001557':'So Near, So Far',
            'Abell 3192':'One Cluster or Two',
            'MACS J0416.1-2403':'Christmas Tree Galaxy Cluster',
            'IC 5332':'Weakly Barred Spiral',
            '2MASX J05101744-4519179':'Clear-View Galaxy Cluster',
            'Arp 263':'Starstruck Irregular Galaxy',
            'eMACS J1353.7+4329':'Galactic Monster Mash',
            'J211347.41+022834.9':'Under the Sea',
          }

          catalog_token=re.compile(r'\b(?:NGC|IC|UGC|UGCA|MACS|eMACS|RXC|RCS2?|Abell|ESO|SDSS|2XMM|PSZ1?|ACT-CL|IRAS|LMC|SMC|LEDA|MCG|AM|Arp|2MASX|WINGS|HerS|J)\b',re.I)
          forbidden=re.compile(r'\b(?:hubble|image|images|imaging|ground[- ]based|telescope|observatory|exposure|camera|instrument)\b',re.I)

          def flagged(e):
              dn=(e.get('displayName') or '').strip(); des=(e.get('designation') or '').strip(); low=dn.lower()
              return (not dn or bool(re.search(r'\d',dn)) or bool(forbidden.search(dn)) or
                      (des and des.lower() in low and dn.lower()!=des.lower()) or bool(catalog_token.search(dn)) or len(dn.split())>8)

          def strip_designations(s,e):
              if not s: return ''
              candidates=[e.get('designation',''),e.get('name','')]
              for c in candidates:
                  if not c: continue
                  # exact whole composite first
                  s=re.sub(re.escape(c), ' ', s, flags=re.I)
                  # individual comma-separated aliases
                  for part in re.split(r'\s*,\s*|\s*/\s*',c):
                      if part and len(part)>=2:
                          s=re.sub(re.escape(part),' ',s,flags=re.I)
              # remove common catalog identifier forms and their numeric tails
              s=re.sub(r'\b(?:NGC|IC|UGC|UGCA|MACS|eMACS|RXC|RCS2?|Abell|ESO|SDSS|2XMM|PSZ1?|ACT-CL|IRAS|LMC|SMC|LEDA|MCG|AM|Arp|2MASX|WINGS|HerS)\s*[-+J.0-9 ]+\b',' ',s,flags=re.I)
              s=re.sub(r'\bJ\s*[0-9.+-]+\b',' ',s,flags=re.I)
              return s

          def normalize(s):
              s=re.sub(r'\([^)]*\)',' ',s)
              s=forbidden.sub(' ',s)
              s=re.sub(r'\b(?:view|views|viewing|snapshot|observes|observed|looks at|focuses on|focusing on|picture|portrait|photo|photograph)\b',' ',s,flags=re.I)
              s=re.sub(r'\b(?:galaxy)\s+of\b','galaxy ',s,flags=re.I)
              s=re.sub(r'\d+(?:[.,]\d+)*(?:st|nd|rd|th)?',' ',s)
              s=s.replace(':',' ').replace('—',' ').replace('–',' ').replace('_',' ')
              s=re.sub(r'\s+',' ',s).strip(' -–—,.;:!?()[]{}\"“”‘’')
              # remove stranded leading glue
              s=re.sub(r'^(?:of|the|a|an|and|with|for|in|on|at|from)\s+','',s,flags=re.I)
              return s.strip()

          def infer(e):
              text=' '.join(str(e.get(k) or '') for k in ('title','displayName','name','designation')).lower()
              rules=[
                (('gravitational lens','lensing'),'Gravitational Lens'),
                (('galaxy cluster','cluster'),'Galaxy Cluster'),
                (('dwarf irregular','irregular dwarf'),'Dwarf Irregular Galaxy'),
                (('dwarf galaxy','dwarf'),'Dwarf Galaxy'),
                (('lenticular',),'Lenticular Galaxy'),
                (('elliptical',),'Elliptical Galaxy'),
                (('barred spiral',),'Barred Spiral Galaxy'),
                (('spiral',),'Spiral Galaxy'),
                (('starburst',),'Starburst Galaxy'),
                (('ring galaxy','ring'),'Ring Galaxy'),
                (('interacting','interaction','collision','colliding','merger','pair'),'Interacting Galaxies'),
                (('black hole','active galactic','active galaxy'),'Active Galaxy'),
                (('star forming','star-forming','stellar nursery'),'Star-Forming Galaxy'),
              ]
              for keys,label in rules:
                  if any(k in text for k in keys): return label
              return 'Deep-Sky Galaxy'

          def candidate(e):
              des=(e.get('designation') or '').strip()
              if des in known: return known[des]
              # Prefer an already descriptive displayName, then release title.
              for raw in (e.get('displayName') or '', e.get('title') or ''):
                  s=strip_designations(raw,e)
                  s=normalize(s)
                  if not s: continue
                  # common cleanup phrases
                  repl=[
                    (r'^poster-size of ','',),
                    (r'^galaxy ','',),
                    (r'^of ','',),
                    (r'\bare ablaze in galaxy\b','Fireworks Galaxy'),
                    (r'\bnew and improved\b','Refined'),
                  ]
                  for pat,rep in repl: s=re.sub(pat,rep,s,flags=re.I)
                  s=re.sub(r'\s+',' ',s).strip()
                  words=s.split()
                  if len(words)>8:
                      # retain the most descriptive first eight words, dropping weak glue at end
                      words=words[:8]
                      while words and words[-1].lower() in {'of','the','a','an','and','with','in','on','for','to'}: words.pop()
                      s=' '.join(words)
                  if len(s.split())>=1 and not re.search(r'\d',s) and not forbidden.search(s) and not catalog_token.search(s):
                      # avoid labels made entirely of generic glue
                      if s.lower() not in {'galaxy','galaxies','cluster','spiral'}:
                          return s
              return infer(e)

          changed=[]
          for i,e in enumerate(d['entries'],1):
              if not flagged(e): continue
              old=(e.get('displayName') or '').strip()
              new=candidate(e)
              # final hard safety
              new=normalize(new)
              if len(new.split())>8: new=' '.join(new.split()[:8])
              if (not new or re.search(r'\d',new) or forbidden.search(new) or catalog_token.search(new)):
                  new=infer(e)
              if old!=new:
                  e['displayName']=new
                  changed.append((i,e.get('archiveId'),e.get('designation'),old,new))

          # strict final rule validation for every displayName
          bad=[]
          for i,e in enumerate(d['entries'],1):
              n=(e.get('displayName') or '').strip()
              if not n or re.search(r'\d',n) or forbidden.search(n) or catalog_token.search(n) or len(n.split())>8:
                  bad.append((i,e.get('archiveId'),e.get('designation'),n))
          if bad:
              raise SystemExit('FINAL RULE FAILURE '+repr(bad[:30]))

          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          audit=Path('viewer/image-databases/Hubble/databases/catalog-0018-pseudonym-completion-audit.txt')
          audit.write_text('\n'.join(f'{i}\t{aid}\t{des}\t{old} -> {new}' for i,aid,des,old,new in changed)+'\n',encoding='utf-8')
          print('CHANGED',len(changed),'TOTAL',len(d['entries']))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0018.json viewer/image-databases/Hubble/databases/catalog-0018-pseudonym-completion-audit.txt
          git commit -m 'Catalog 0018: complete compact pseudonyms'
          git pull --rebase origin beta
          git push origin HEAD:beta
