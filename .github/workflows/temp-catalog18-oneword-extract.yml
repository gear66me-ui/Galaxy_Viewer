name: TEMP Catalog 0018 one-word extract
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/temp-catalog18-oneword-extract.yml']
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: beta}
      - shell: bash
        run: |
          python - <<'PY'
          import json
          p='viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0018.json'
          d=json.load(open(p,encoding='utf-8'))
          out=[]
          for i,e in enumerate(d['entries']):
              n=(e.get('displayName') or '').strip()
              if n and len(n.split())==1:
                  out.append({'index':i,'entry':e})
          q='viewer/image-databases/Hubble/databases/temp-catalog18-oneword.json'
          json.dump(out,open(q,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print('one-word entries:',len(out))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add viewer/image-databases/Hubble/databases/temp-catalog18-oneword.json
          git commit -m 'TEMP extract Catalog 0018 one-word pseudonyms'
          git push origin HEAD:beta
