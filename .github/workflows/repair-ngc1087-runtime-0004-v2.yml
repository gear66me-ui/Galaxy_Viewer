name: Repair NGC 1087 Runtime Catalog 0004 (v2)
on:
  workflow_dispatch:
  push:
    branches: [release]
    paths:
      - ".github/workflows/repair-ngc1087-runtime-0004-v2.yml"
permissions:
  contents: write
concurrency:
  group: repair-ngc1087-runtime-0004
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
      - name: Find exact NGC 1087 record and update distance
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          p = Path("viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json")
          raw = json.loads(p.read_text(encoding="utf-8"))
          records = raw if isinstance(raw, list) else raw.get("records")
          if not isinstance(records, list):
              raise SystemExit("STOP: expected records[] in runtime catalog")
          def norm(v):
              return re.sub(r"[^a-z0-9]+", "", str(v).casefold())
          identity_keys = {"name","objectname","displayname","designation","primaryname","targetname","title"}
          candidates=[]
          for i,r in enumerate(records):
              if not isinstance(r,dict): continue
              identity = [(k,v) for k,v in r.items() if norm(k) in identity_keys and isinstance(v,(str,int,float))]
              if any(norm(v) in ("ngc1087",) for k,v in identity):
                  candidates.append((i,r,identity))
          if len(candidates) != 1:
              print("Exact identity candidates:", json.dumps([
                {"index":i,"identity":identity,"keys":list(r.keys()),
                 "id":r.get("id"),"archiveId":r.get("archiveId"),"provider":r.get("provider"),
                 "catalog":r.get("catalog"),"distanceMly":r.get("distanceMly"),"redshift":r.get("redshift")}
                for i,r,identity in candidates], ensure_ascii=False, indent=2))
              raise SystemExit(f"STOP: expected one exact NGC 1087 identity record, found {len(candidates)}; no write.")
          i,r,identity=candidates[0]
          # Catalog convention: comoving distance derived from published z, rounded to two decimals.
          distance=73.25
          z=0.005070
          dk=next((k for k in r if norm(k) in ("distancemly","distancemly")),None)
          zk=next((k for k in r if norm(k) in ("redshift","redshiftz","z")),None)
          if dk is None or zk is None:
              raise SystemExit(f"STOP: exact record at records[{i}] lacks expected distance/redshift fields. keys={list(r.keys())}")
          before={"distanceMly":r[dk],"redshift":r[zk]}
          r[dk]=distance
          r[zk]=z
          science=r.get("science")
          if isinstance(science,dict):
              for k in list(science):
                  if norm(k)=="distancemly": science[k]=distance
                  elif norm(k) in ("redshift","redshiftz","z"): science[k]=z
          for k in list(r):
              if norm(k)=="distancemethod":
                  r[k]="Flat Lambda-CDM comoving distance calculated from published redshift z=0.005070 using H0=67.6 km/s/Mpc, Omega_m=0.315, Omega_Lambda=0.685"
              if norm(k)=="redshiftmethod":
                  r[k]="Published heliocentric redshift z=0.005070; frame correction may be needed for cosmological comparison"
          p.write_text(json.dumps(raw,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          check=json.loads(p.read_text(encoding="utf-8"))
          check_records=check if isinstance(check,list) else check.get("records")
          verified=check_records[i]
          if float(verified[dk])!=distance or float(verified[zk])!=z:
              raise SystemExit("STOP: post-write verification failed")
          print(json.dumps({"verified":True,"recordIndex":i,"identity":identity,"before":before,
            "after":{"distanceMly":distance,"redshift":z},"catalog":"AVM runtime 0004",
            "cosmology":{"H0":67.6,"Omega_m":0.315,"Omega_Lambda":0.685}},ensure_ascii=False,indent=2))
          PY
      - name: Validate and commit
        run: |
          python3 -m json.tool viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json
          if git diff --cached --quiet; then
            echo "Catalog already has target values."
          else
            git commit -m "Correct NGC 1087 FLRW distance in AVM runtime 0004"
            git push origin HEAD:release
          fi
