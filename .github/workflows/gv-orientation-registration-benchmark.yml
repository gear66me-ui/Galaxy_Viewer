name: GV Orientation Registration Benchmark

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/gv-orientation-registration-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install registration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy requests opencv-python-headless playwright
          python -m playwright install --with-deps chromium

      - name: Generate blind predictions for unresolved Chandra and JWST records
        run: |
          python viewer/image-databases/master-database/orientation-review/gv-orientation-register-0003.py \
            --catalog 'Chandra=viewer/image-databases/Chandra/databases/gv-chandra-galaxies-full-0002.json' \
            --catalog 'JWST=viewer/image-databases/JWST/databases/gv-jwst-galaxies-full-0002.json' \
            --only-missing-orientation \
            --checkpoint-every 25 \
            --output viewer/image-databases/master-database/orientation-review/gv-registration-predictions-0001.json

      - name: Verify prediction JSON
        run: |
          python - <<'PY'
          import json
          p='viewer/image-databases/master-database/orientation-review/gv-registration-predictions-0001.json'
          d=json.load(open(p,encoding='utf-8'))
          n=len(d.get('predictions',[]))
          print('predictionCount=',n)
          if n != 151:
              raise SystemExit(f'Expected 151 predictions, got {n}')
          PY

      - name: Commit blind prediction file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/image-databases/master-database/orientation-review/gv-registration-predictions-0001.json
          if git diff --cached --quiet; then
            echo 'No prediction changes to commit.'
          else
            git commit -m 'Regenerate blind orientation registration predictions with 0003 renderer'
            git push origin HEAD:beta
          fi
