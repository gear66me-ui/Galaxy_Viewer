name: Audit Runtime Distances Against Source Website Wording
# Read-only audit; source catalog is never modified.

on:
  push:
    branches: [release]
    paths:
      - ".github/workflows/audit-runtime-distance-source-wording.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-runtime-distance-source-wording
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify runtime catalog is valid and read-only
        run: |
          python - <<'PY'
          import json
          p = "viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json"
          data = json.load(open(p, encoding="utf-8"))
          records = data.get("records", []) if isinstance(data, dict) else data
          assert len(records) == 1847, f"Expected 1847 runtime records, got {len(records)}"
          print(f"Validated {len(records)} runtime records. Audit will not modify this file.")
          PY
      - name: Read source-page distance wording for each runtime record
        run: python .github/scripts/audit_runtime_distance_source_wording.py
      - name: Upload full audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: runtime-distance-source-wording-audit
          path: |
            distance-source-wording-audit/runtime-distance-source-wording-audit.csv
            distance-source-wording-audit/summary.json
          if-no-files-found: error
          retention-days: 90
