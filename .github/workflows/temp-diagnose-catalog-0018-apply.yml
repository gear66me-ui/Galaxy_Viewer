name: Temporary diagnose Catalog 0018 apply gate

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/temp-diagnose-catalog-0018-apply.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Diagnose candidate gate
        run: |
          git fetch origin beta
          git reset --hard origin/beta
          python - <<'PY'
          import csv,json,re
          from pathlib import Path
          cat=Path('viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0018.json')
          cand=Path('viewer/image-databases/Hubble/databases/catalog-0018-pseudonym-candidates-v3.tsv')
          d=json.loads(cat.read_text(encoding='utf-8')); entries=d['entries']
          forbidden=re.compile(r'\b(?:hubble|image|images|imaging|ground[- ]based|telescope|camera|instrument|exposure)\b',re.I)
          toks=re.compile(r'\b(?:NGC|IC|UGC|UGCA|MACS|eMACS|RXC|RCS2?|Abell|ESO|SDSS|2XMM|PSZ1?|ACT-CL|IRAS|LMC|SMC|LEDA|MCG|AM|Arp|2MASX|WINGS|HerS|Messier|PGC|ACO|HCG|DDO|Mrk|Markarian|GAMA|PLCK|ZwCl|VV|HST|MS\s*\d|3C\s*\d)\b',re.I)
          overrides={'Abell 2744':"Pandora's Cluster",'Abell 2667':'Comet Galaxy','3C 321':'Death Star Galaxy','Messier 89':'Virgo Elliptical Galaxy','REP: Hubble Space Telescope':'Space Observatory'}
          issues=[]; count=0
          for r in csv.reader(cand.open(encoding='utf-8'),delimiter='\t'):
            if not r: continue
            count+=1
            row,aid,des,old,new,title=int(r[0]),*r[1:]
            e=entries[row-1]
            if (e.get('archiveId') or '')!=aid or (e.get('designation') or '')!=des or (e.get('displayName') or '')!=old:
              issues.append(('BASELINE',row,aid,des,old,e.get('archiveId'),e.get('designation'),e.get('displayName'))); continue
            if old=='Fornax A': continue
            if aid.startswith('heic0810'): new='Interacting Galaxies'
            elif aid.startswith('topo9918'): new='Gravitational Lens'
            elif aid.startswith('topo9928') or aid.startswith('topo9827'): new='Distant Galaxy Cluster'
            elif aid.startswith('topo9910'): new='Infrared Galaxy'
            if des in overrides: new=overrides[des]
            if not new or len(new.split())>8 or re.search(r'\d',new) or forbidden.search(new) or toks.search(new):
              issues.append(('INVALID',row,aid,des,old,new,title))
          out=Path('viewer/image-databases/Hubble/databases/catalog-0018-apply-diagnostic.txt')
          out.write_text('count=%d issues=%d\n'%(count,len(issues))+'\n'.join('\t'.join(map(str,x)) for x in issues)+'\n',encoding='utf-8')
          print('count',count,'issues',len(issues))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/image-databases/Hubble/databases/catalog-0018-apply-diagnostic.txt
          git commit -m 'TEMP Catalog 0018 apply diagnostic'
          git pull --rebase origin beta
          git push origin HEAD:beta
