name: TEMP Patch Hubble 0017 Two Images

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/temp-patch-hubble-0017-two-images.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Patch only opo9217a and opo9227a
        shell: bash
        run: |
          set -euo pipefail
          TARGET='viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0017.json'
          WF='.github/workflows/temp-patch-hubble-0017-two-images.yml'
          EXPECTED_BLOB='e8009928f12dfc4138f215e2144edd16a0974fd4'

          ACTUAL_BLOB=$(git hash-object "$TARGET")
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB" || { echo "ABORT: catalog baseline drift $ACTUAL_BLOB"; exit 1; }

          python - <<'PY'
          import json, copy, hashlib
          from pathlib import Path

          p=Path('viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0017.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d.get('version') == 'full-0017'
          entries=d['entries']
          assert len(entries)==1879
          ids=[r['archiveId'] for r in entries]
          assert len(set(ids))==1879
          targets={'opo9217a','opo9227a'}
          assert sum(r['archiveId'] in targets for r in entries)==2

          top_before={k:copy.deepcopy(v) for k,v in d.items() if k!='entries'}
          other_before=[copy.deepcopy(r) for r in entries if r['archiveId'] not in targets]

          byid={r['archiveId']:r for r in entries}
          m51=byid['opo9217a']
          n4261=byid['opo9227a']

          # Guard exact old presentation state.
          assert m51['selectedImageUrl']=='https://cdn.esahubble.org/archives/images/large/opo9217a.jpg'
          assert m51['pixelSize']=='2169 x 2025 px'
          assert n4261['selectedImageUrl']=='https://cdn.esahubble.org/archives/images/large/opo9227a.jpg'
          assert n4261['pixelSize']=='446 x 390 px'

          m51_original={k:copy.deepcopy(m51.get(k)) for k in [
              'fieldOfView','orientation','pixelSize','credit','sourceUrl','esaPublicationJpeg',
              'jpegCandidates','imageStatus','selectedImageUrl','assetName','bytes','sha256',
              'downloadErrors','githubImageUrl','releaseTag']}
          m51.update({
              'fieldOfView':'9.56 x 6.64 arcminutes',
              'orientation':'North is 91.9° right of vertical',
              'pixelSize':'11477 x 7965 px',
              'credit':'NASA',
              'sourceUrl':'https://esahubble.org/images/heic0506a/',
              'esaPublicationJpeg':'https://cdn.esahubble.org/archives/images/publicationjpg/heic0506a.jpg',
              'jpegCandidates':[
                  'https://cdn.esahubble.org/archives/images/publicationjpg/heic0506a.jpg',
                  'https://cdn.esahubble.org/archives/images/large/heic0506a.jpg',
                  'https://cdn.esahubble.org/archives/images/screen/heic0506a.jpg',
                  'https://esahubble.org/media/archives/images/pl_screen/heic0506a.jpg',
                  'https://cdn.esahubble.org/archives/images/wallpaper1/heic0506a.jpg',
                  'https://cdn.esahubble.org/archives/images/wallpaper2/heic0506a.jpg',
                  'https://cdn.esahubble.org/archives/images/wallpaper3/heic0506a.jpg',
                  'https://cdn.esahubble.org/archives/images/wallpaper4/heic0506a.jpg',
                  'https://cdn.esahubble.org/archives/images/wallpaper5/heic0506a.jpg',
                  'https://cdn.esahubble.org/archives/images/wallpaper_hd/heic0506a.jpg',
                  'https://cdn.esahubble.org/archives/images/wallpaper_fhd/heic0506a.jpg',
                  'https://cdn.esahubble.org/archives/images/wallpaper_qhd/heic0506a.jpg',
                  'https://cdn.esahubble.org/archives/images/wallpaper_uhd/heic0506a.jpg',
                  'https://cdn.esahubble.org/archives/images/wallpaper_mobile_fhd/heic0506a.jpg',
                  'https://cdn.esahubble.org/archives/images/wallpaper_mobile_fhd_plus/heic0506a.jpg',
                  'https://cdn.esahubble.org/archives/images/wallpaper_mobile_qhd_plus/heic0506a.jpg',
                  'https://cdn.esahubble.org/archives/images/wallpaper_mobile_uhd/heic0506a.jpg'],
              'imageStatus':'downloaded',
              'selectedImageUrl':'https://cdn.esahubble.org/archives/images/publicationjpg/heic0506a.jpg',
              'assetName':'heic0506a.jpg',
              'bytes':4060187,
              'sha256':'7b13a932bcf54653c591d369e8d1c4cbdbeb693ecc468242facb239fde52e4c2',
              'downloadErrors':[],
              'githubImageUrl':'https://github.com/gear66me-ui/Galaxy_Viewer/releases/download/hubble-galaxies-0001-a/heic0506a.jpg',
              'releaseTag':'hubble-galaxies-0001-a',
          })
          m51['science']['sizeKly']=[69.52,48.29]
          m51['science']['sizeMethod']='distance_fov_estimate'
          m51['science']['sizeEstimated']=True
          m51['science']['sizeDisplay']='EST. 70 x 48 KLY'
          m51['imageReplacement0017']={
              'replacementArchiveId':'heic0506a',
              'reason':'Replace the old blue M51 core frame with the authoritative 2005 Hubble ACS full-frame Whirlpool Galaxy mosaic.',
              'preservedTargetArchiveId':'opo9217a',
              'presentationOnly':True,
              'originalImage':m51_original,
          }

          n_original={k:copy.deepcopy(n4261.get(k)) for k in [
              'fieldOfView','orientation','pixelSize','credit','sourceUrl','esaPublicationJpeg',
              'jpegCandidates','imageStatus','selectedImageUrl','assetName','bytes','sha256',
              'downloadErrors','githubImageUrl','releaseTag']}
          n4261.update({
              'pixelSize':'1024 x 930 px',
              'credit':'Walter Jaffe/Leiden Observatory, Holland Ford/JHU/STScI, and NASA',
              'sourceUrl':'https://science.nasa.gov/image-detail/hubble-ngc4261-core-stsci-01evtb3x6gaw32dnbfwsszfe70/',
              'esaPublicationJpeg':None,
              'jpegCandidates':['https://science.nasa.gov/wp-content/uploads/2023/11/hubble-ngc4261-core-stsci-01evtb3x6gaw32dnbfwsszfe70.jpg'],
              'imageStatus':'remote_authoritative',
              'selectedImageUrl':'https://science.nasa.gov/wp-content/uploads/2023/11/hubble-ngc4261-core-stsci-01evtb3x6gaw32dnbfwsszfe70.jpg',
              'assetName':'hubble-ngc4261-core-stsci-01evtb3x6gaw32dnbfwsszfe70.jpg',
              'bytes':None,
              'sha256':None,
              'downloadErrors':[],
              'githubImageUrl':'https://science.nasa.gov/wp-content/uploads/2023/11/hubble-ngc4261-core-stsci-01evtb3x6gaw32dnbfwsszfe70.jpg',
              'releaseTag':None,
          })
          n4261['imageReplacement0017']={
              'replacementSource':'NASA Hubble',
              'reason':'Replace the lower-resolution legacy NGC 4261 core JPEG with NASA’s 1024×930 Hubble rendering of the same observation.',
              'preservedTargetArchiveId':'opo9227a',
              'presentationOnly':True,
              'sameFieldOfView':True,
              'originalImage':n_original,
          }

          # Forensic invariants: top-level metadata and every other record unchanged.
          assert {k:v for k,v in d.items() if k!='entries'} == top_before
          assert [r for r in entries if r['archiveId'] not in targets] == other_before
          assert len(entries)==1879 and len({r['archiveId'] for r in entries})==1879

          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          d2=json.loads(p.read_text(encoding='utf-8'))
          assert len(d2['entries'])==1879
          b2={r['archiveId']:r for r in d2['entries']}
          assert b2['opo9217a']['selectedImageUrl'].endswith('/heic0506a.jpg')
          assert b2['opo9227a']['pixelSize']=='1024 x 930 px'
          print('Validated records:',len(d2['entries']))
          print('M51:',b2['opo9217a']['selectedImageUrl'])
          print('NGC4261:',b2['opo9227a']['selectedImageUrl'])
          PY

          python -m json.tool "$TARGET" >/dev/null
          git diff --check -- "$TARGET"

          mapfile -t CHANGED < <(git status --porcelain | sed -E 's/^.. //')
          printf 'Changed paths before commit:\n%s\n' "${CHANGED[@]}"
          if [ "${#CHANGED[@]}" -ne 1 ] || [ "${CHANGED[0]}" != "$TARGET" ]; then
            echo 'ABORT: unauthorized production change'
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git commit -m 'Catalog 0017: upgrade M51 and NGC 4261 Hubble images'
          git push origin HEAD:beta

          # Self-clean the temporary workflow in a separate commit.
          git rm "$WF"
          git commit -m 'Remove temporary Hubble 0017 image patch workflow'
          git push origin HEAD:beta
