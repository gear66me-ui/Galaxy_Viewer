name: Optimize Galaxy Image Pilot

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/optimize-galaxy-image-pilot.yml"

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release source of truth
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Build optimized sample and visual comparison sheet
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import collections, io, json, pathlib, urllib.request, zipfile
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          manifest_path = pathlib.Path("viewer/image-databases/Hubble/mirror/image-mirror-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          records = [x for x in manifest.get("images", []) if x.get("sha256") and x.get("githubImageUrl")]
          grouped = collections.defaultdict(list)
          for item in records:
              grouped[item.get("provider", "unknown")].append(item)
          chosen = []
          for provider, items in sorted(grouped.items()):
              count = min(3, len(items))
              indexes = sorted(set(round(i*(len(items)-1)/max(1,count-1)) for i in range(count)))
              chosen.extend(items[i] for i in indexes)
          out = pathlib.Path("pilot-output")
          out.mkdir(exist_ok=True)
          opener = urllib.request.build_opener()
          opener.addheaders = [("User-Agent", "GalaxyViewer-OptimizationPilot/1.0")]
          report = []
          cards = []
          with zipfile.ZipFile(out/"galaxy-image-optimization-pilot.zip", "w", zipfile.ZIP_DEFLATED) as zf:
              for i, item in enumerate(chosen, 1):
                  try:
                      req = urllib.request.Request(item["githubImageUrl"])
                      with opener.open(req, timeout=45) as resp:
                          raw = resp.read(30*1024*1024+1)
                      if len(raw) > 30*1024*1024:
                          raise ValueError("image exceeds 30 MiB safety limit")
                      original = Image.open(io.BytesIO(raw))
                      original.load()
                      original = ImageOps.exif_transpose(original).convert("RGB")
                      w,h = original.size
                      optimized = original.copy()
                      optimized.thumbnail((1536,1536), Image.Resampling.LANCZOS)
                      chosen_quality = None
                      encoded = None
                      # Keep dimensions at or below 1536 px; seek a visually conservative JPEG under 700 KB.
                      for quality in (90, 87, 85, 82, 80, 77, 74, 70):
                          buf = io.BytesIO()
                          optimized.save(buf, format="JPEG", quality=quality, optimize=True, progressive=True, subsampling=0)
                          encoded = buf.getvalue()
                          chosen_quality = quality
                          if len(encoded) <= 700*1024:
                              break
                      base = f"{i:02d}-{item.get('provider','unknown').replace('/','_')}"
                      zf.writestr(f"optimized/{base}.jpg", encoded)
                      # contact sheet thumbnails show original and optimized side-by-side
                      def thumb(im):
                          im = im.copy()
                          im.thumbnail((360,240), Image.Resampling.LANCZOS)
                          canvas = Image.new("RGB",(370,270),(12,12,18))
                          canvas.paste(im,((370-im.width)//2,8+(240-im.height)//2))
                          return canvas
                      opt_img = Image.open(io.BytesIO(encoded)).convert("RGB")
                      card = Image.new("RGB",(760,320),(20,20,28))
                      d = ImageDraw.Draw(card)
                      label = f"{i}. {item.get('provider')} | {w}x{h} | {len(raw)//1024} KB -> {len(encoded)//1024} KB | Q{chosen_quality}"
                      d.text((8,5),label,fill=(255,255,255))
                      card.paste(thumb(original),(5,35))
                      card.paste(thumb(opt_img),(385,35))
                      d.text((10,305),"ORIGINAL",fill=(220,220,220)); d.text((390,305),"OPTIMIZED",fill=(220,220,220))
                      cards.append((item.get("provider","unknown"),card))
                      report.append({"provider":item.get("provider"),"sourceUrl":item.get("sourceUrl"),"mirrorUrl":item.get("githubImageUrl"),"originalWidth":w,"originalHeight":h,"originalBytes":len(raw),"optimizedWidth":optimized.width,"optimizedHeight":optimized.height,"optimizedBytes":len(encoded),"quality":chosen_quality,"within700KB":len(encoded)<=700*1024,"reductionPercent":round((1-len(encoded)/len(raw))*100,1),"status":"ok"})
                      print(json.dumps(report[-1]))
                  except Exception as e:
                      report.append({"provider":item.get("provider"),"sourceUrl":item.get("sourceUrl"),"status":"error","error":str(e)})
                      print(json.dumps(report[-1]))
              zf.writestr("report.json", json.dumps(report,indent=2))
          # Contact sheet with all sampled pairs
          cols=2
          rows=(len(cards)+cols-1)//cols
          sheet=Image.new("RGB",(cols*760,rows*320),(5,5,10))
          for idx,(_,card) in enumerate(cards):
              sheet.paste(card,((idx%cols)*760,(idx//cols)*320))
          sheet.save(out/"before-after-contact-sheet.jpg",quality=88,optimize=True)
          (out/"optimization-pilot-report.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          good=[x for x in report if x.get("status")=="ok"]
          print(f"PILOT SUMMARY: {len(good)}/{len(report)} processed; under 700 KiB: {sum(x['within700KB'] for x in good)}/{len(good)}; originals preserved in source mirror; viewer not modified.")
          PY

      - name: Upload pilot outputs for review
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-image-optimization-pilot
          path: pilot-output/
          retention-days: 30
          if-no-files-found: error
