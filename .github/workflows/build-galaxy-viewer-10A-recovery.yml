name: Build Galaxy Viewer 10A Recovery

on:
  push:
    branches:
      - beta
    paths:
      - '.github/workflows/build-galaxy-viewer-10A-recovery.yml'

permissions:
  contents: write

jobs:
  build-10a:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Verify frozen baseline and protected assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object viewer/GV-beta-0009I.py)" = "c618320f9ddad3e243f2fc5af436eb6bb678a6b5"
          test "$(git hash-object viewer/archive/GV-beta-0009I-7.py)" = "c618320f9ddad3e243f2fc5af436eb6bb678a6b5"
          test "$(git hash-object viewer/artwork/icon.svg)" = "829faf3594e85d4ff529d3c2b069a309d580b054"
          test "$(git hash-object viewer/artwork/Hubble/Hubble-NASA-ESA-BW.png)" = "5b597839833f4b7a7d477e720fd12949e8515ac6"

      - name: Generate exact standalone 10A source and forensic audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import difflib, hashlib, json, subprocess
          src=Path('viewer/GV-beta-0009I.py')
          dst=Path('viewer/GV-beta-0010A.py')
          raw=src.read_bytes()
          assert len(raw)==70089, len(raw)
          text=raw.decode('utf-8')
          assert len(text)==70080
          assert text.count(' ')==10482
          assert text.count('\t')==0
          assert text.count('\n')==1163
          assert not text.endswith('\n')

          def once(old,new,label):
              global text
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected 1 occurrence, got {count}')
              text=text.replace(old,new,1)

          once('# GV-beta-0009I','# GV-beta-0010A','header identity')
          once("    const VERSION='9I';\n    const DISPLAY_VERSION='9I-M';","    const VERSION='10A';\n    const DISPLAY_VERSION='10A';",'runtime identity')

          startup_old='#gv-we-are-here.gv-hidden{opacity:0;visibility:hidden}\n</style>\n<div id="aladin-cosmic-command-test"></div>'
          startup_new='#gv-we-are-here.gv-hidden{opacity:0;visibility:hidden}\n#gv-apk-cover{flex-direction:column;gap:18px}#gv-apk-cover .gv-10a-version{color:#FFD85A;font:400 16px/1 "Space Age",sans-serif;letter-spacing:1.2px;text-shadow:0 0 7px rgba(255,216,90,.55);white-space:nowrap}\n</style>\n<div id="aladin-cosmic-command-test"></div>\n<script>(()=>{const cover=document.getElementById(\'gv-apk-cover\');if(!cover)return;const img=cover.querySelector(\'img\');if(img)img.src=\'artwork/icon.svg\';const version=document.createElement(\'div\');version.className=\'gv-10a-version\';version.textContent=\'VERSION 10A\';cover.appendChild(version)})();</script>'
          once(startup_old,startup_new,'startup cover')

          old_p="    presentationStyle.textContent='#gv-random-galaxy{font-size:22px!important;border:2px solid #FFD85A!important;box-shadow:inset 0 0 7px rgba(167,255,203,.28),0 0 8px rgba(77,255,143,.34),0 0 10px rgba(255,216,90,.65)!important}.gv-galaxy-history{border:2px solid #FFD85A!important;box-shadow:inset 0 0 7px rgba(167,255,203,.28),0 0 8px rgba(77,255,143,.34),0 0 10px rgba(255,216,90,.65)!important}.gvrg-hd-science,.gvrg-hd-viewport{box-sizing:border-box!important;width:min(620px,96vw)!important}.gvrg-hd-science{border-color:#4F8CFF!important;box-shadow:inset 0 0 8px rgba(79,140,255,.12),0 0 12px rgba(79,140,255,.34)!important}.gvrg-hd-viewport{left:50%!important;right:auto!important;transform:translateX(-50%);border:2px solid #4F8CFF!important;border-radius:8px!important;background:#020818!important;box-shadow:inset 0 0 12px rgba(79,140,255,.16),0 0 16px rgba(79,140,255,.48)!important}';"
          new_p="    presentationStyle.textContent='#gv-random-galaxy{font-size:15.5px!important;border:1px solid #4F8CFF!important;box-shadow:inset 0 0 8px rgba(167,255,203,.38),0 0 9px rgba(79,140,255,.55)!important;filter:brightness(1.08)}.gv-galaxy-history{border:1px solid #4F8CFF!important;box-shadow:inset 0 0 8px rgba(167,255,203,.38),0 0 9px rgba(79,140,255,.55)!important;filter:brightness(1.08)}.gvrg-hd-science,.gvrg-hd-viewport{box-sizing:border-box!important;width:min(620px,96vw)!important;border:1px solid #78FFAB!important;border-radius:8px!important}.gvrg-hd-science{background:rgba(0,12,8,.88)!important;box-shadow:inset 0 0 6px rgba(120,255,171,.10),0 0 8px rgba(87,255,147,.22)!important}.gvrg-hd-viewport{left:50%!important;right:auto!important;transform:translateX(-50%);background:#020B07!important;box-shadow:inset 0 0 6px rgba(120,255,171,.10),0 0 8px rgba(87,255,147,.22)!important}.gvrg-hd-icon-button{background:#020604!important;border:1px solid #4F8CFF!important;border-radius:7px!important;box-shadow:0 0 7px rgba(79,140,255,.38)!important}.gvrg-hd-icon-button img{background:transparent!important;border-radius:5px!important}';"
          once(old_p,new_p,'presentation override')
          once('# GV-beta-0009I staged','# GV-beta-0010A staged','staged identity')

          out=text.encode('utf-8')
          assert not out.endswith(b'\n')
          dst.write_bytes(out)
          subprocess.run(['python','-m','py_compile',str(dst)],check=True)

          assert "const VERSION='10A';" in text
          assert "const DISPLAY_VERSION='10A';" in text
          assert 'font-size:15.5px!important' in text
          assert 'border:1px solid #4F8CFF!important' in text
          assert '.gvrg-hd-science,.gvrg-hd-viewport{box-sizing:border-box!important;width:min(620px,96vw)!important;border:1px solid #78FFAB!important;border-radius:8px!important}' in text
          assert '.gvrg-hd-icon-button{background:#020604!important' in text
          assert "img.src='artwork/icon.svg'" in text
          assert "version.textContent='VERSION 10A'" in text
          assert 'HUBBLE_PREFETCH_TARGET=10' in text
          assert 'suspendBackgroundWork();' in text
          assert 'resumeBackgroundWork();' in text

          sm=difflib.SequenceMatcher(a=raw.decode('utf-8'),b=text,autojunk=False)
          ins=dele=0
          for tag,i1,i2,j1,j2 in sm.get_opcodes():
              if tag in ('insert','replace'): ins += j2-j1
              if tag in ('delete','replace'): dele += i2-i1
          audit={
            'baseline_blob':subprocess.check_output(['git','hash-object',str(src)],text=True).strip(),
            'candidate_blob':subprocess.check_output(['git','hash-object',str(dst)],text=True).strip(),
            'bytes_before':len(raw),'bytes_after':len(out),
            'chars_before':len(raw.decode('utf-8')),'chars_after':len(text),
            'lines_before':raw.count(b'\n')+1,'lines_after':out.count(b'\n')+1,
            'spaces_before':raw.decode('utf-8').count(' '),'spaces_after':text.count(' '),
            'tabs_before':raw.decode('utf-8').count('\t'),'tabs_after':text.count('\t'),
            'newlines_before':raw.count(b'\n'),'newlines_after':out.count(b'\n'),
            'inserted_characters':ins,'deleted_characters':dele,
            'sha256':hashlib.sha256(out).hexdigest(),
          }
          Path('/tmp/gv10a-audit.json').write_text(json.dumps(audit,indent=2)+'\n')
          print(json.dumps(audit,indent=2))
          Path('/tmp/gv10a.diff').write_text(''.join(difflib.unified_diff(raw.decode('utf-8').splitlines(True),text.splitlines(True),fromfile='GV-beta-0009I.py',tofile='GV-beta-0010A.py')),encoding='utf-8')
          print(Path('/tmp/gv10a.diff').read_text(encoding='utf-8'))
          PY
          git diff --no-index --check viewer/GV-beta-0009I.py viewer/GV-beta-0010A.py || rc=$?; test "${rc:-1}" = 1

      - name: Build standalone Android working tree from audited 10A
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import importlib.util, re, shutil, sys
          root=Path('.').resolve()
          sys.path.insert(0,str(root/'.github/scripts'))
          spec=importlib.util.spec_from_file_location('gv9im',root/'.github/scripts/prepare_galaxy_viewer_9im.py')
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          mod.VIEWER=root/'viewer/GV-beta-0010A.py'
          mod.copy_assets()
          shutil.copy2(root/'viewer/artwork/icon.svg',mod.ASSETS/'artwork/icon.svg')
          mod.patch_packaged_splash()
          mod.build_standalone()
          index=mod.ASSETS/'index.html'
          s=index.read_text(encoding='utf-8').replace('<title>GALAXY VIEWER 9I-M</title>','<title>GALAXY VIEWER 10A</title>',1)
          index.write_text(s,encoding='utf-8')
          mod.base.patch_android()
          gradle=mod.ANDROID/'app/build.gradle'
          g=gradle.read_text(encoding='utf-8')
          g=re.sub(r'versionCode\s+\d+','versionCode 20',g,count=1)
          g=re.sub(r"versionName\s+'[^']+'","versionName '10A'",g,count=1)
          gradle.write_text(g,encoding='utf-8')
          manifest=mod.ANDROID/'app/src/main/AndroidManifest.xml'
          m=manifest.read_text(encoding='utf-8')
          m=re.sub(r'android:label="[^"]+"','android:label="GALAXY VIEWER 10A"',m,count=1)
          manifest.write_text(m,encoding='utf-8')
          s=index.read_text(encoding='utf-8')
          for marker in ["DISPLAY_VERSION='10A'",'font-size:15.5px!important','border:1px solid #78FFAB!important','.gvrg-hd-icon-button{background:#020604!important',"img.src='artwork/icon.svg'","version.textContent='VERSION 10A'","setTimeout(()=>{splash.addEventListener('load'",'},3500);']:
              assert marker in s, marker
          assert 'assets/splash' not in s
          assert "splash.src='splash/index.html'" in s
          assert (mod.ASSETS/'artwork/icon.svg').read_bytes()==(root/'viewer/artwork/icon.svg').read_bytes()
          assert '"categoryEntryCount": 1879' in (mod.ASSETS/'data/gv-hubble-galaxies-full-0002.json').read_text(encoding='utf-8')
          PY

      - name: Browser smoke test 10A Viewer
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          python -m http.server 8765 --bind 127.0.0.1 --directory android/galaxy-viewer-9i/app/src/main/assets >/tmp/gv-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID >/dev/null 2>&1 || true' EXIT
          sleep 1
          set +e
          timeout 100s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader --enable-webgl --ignore-gpu-blocklist --virtual-time-budget=70000 --dump-dom 'http://127.0.0.1:8765/index.html?smoke=1' >/tmp/gv-dom.html 2>/tmp/gv-chrome.log
          RC=$?
          set -e
          grep -q 'data-viewer-status="ready"' /tmp/gv-dom.html
          echo "10A browser smoke PASS rc=$RC"

      - name: Commit only 10A source and remove temporary workflow
        id: source_commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Galaxy Viewer Build Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer/GV-beta-0010A.py
          git rm .github/workflows/build-galaxy-viewer-10A-recovery.yml
          git diff --cached --check
          git commit -m 'Release standalone Galaxy Viewer 10A'
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          SOURCE_BLOB="$(git hash-object viewer/GV-beta-0010A.py)"
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "source_blob=$SOURCE_BLOB" >> "$GITHUB_OUTPUT"
          git stash push --include-untracked -m 10a-android-working-tree -- android/galaxy-viewer-9i
          git fetch origin beta
          git rebase origin/beta
          git push origin HEAD:beta
          git stash pop
          test "$(git hash-object viewer/GV-beta-0009I.py)" = "c618320f9ddad3e243f2fc5af436eb6bb678a6b5"
          test "$(git hash-object viewer/archive/GV-beta-0009I-7.py)" = "c618320f9ddad3e243f2fc5af436eb6bb678a6b5"
          test "$(git hash-object viewer/artwork/icon.svg)" = "829faf3594e85d4ff529d3c2b069a309d580b054"
          test "$(git hash-object viewer/artwork/Hubble/Hubble-NASA-ESA-BW.png)" = "5b597839833f4b7a7d477e720fd12949e8515ac6"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build 10A APK
        working-directory: android/galaxy-viewer-9i
        run: gradle --no-daemon :app:assembleDebug

      - name: Inspect exact APK payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from zipfile import ZipFile
          apk='android/galaxy-viewer-9i/app/build/outputs/apk/debug/app-debug.apk'
          with ZipFile(apk) as z:
              names=set(z.namelist())
              for required in ['assets/index.html','assets/splash/index.html','assets/data/gv-hubble-galaxies-full-0002.json','assets/artwork/GV-reticle-0001.svg','assets/artwork/icon.svg','assets/app-icon.png']:
                  assert required in names, required
              s=z.read('assets/index.html').decode('utf-8')
              for marker in ["DISPLAY_VERSION='10A'",'font-size:15.5px!important','border:1px solid #78FFAB!important','.gvrg-hd-icon-button{background:#020604!important',"img.src='artwork/icon.svg'","version.textContent='VERSION 10A'","splash.src='splash/index.html'",'},3500);']:
                  assert marker in s, marker
              assert z.read('assets/artwork/icon.svg') == open('viewer/artwork/icon.svg','rb').read()
          PY

      - name: Stage hash and upload APK
        shell: bash
        run: |
          set -euo pipefail
          cp android/galaxy-viewer-9i/app/build/outputs/apk/debug/app-debug.apk Galaxy-Viewer-10A.apk
          sha256sum Galaxy-Viewer-10A.apk | tee Galaxy-Viewer-10A.sha256
          cat /tmp/gv10a-audit.json

      - name: Upload 10A artifact
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Viewer-10A
          path: |
            Galaxy-Viewer-10A.apk
            Galaxy-Viewer-10A.sha256
          if-no-files-found: error

      - name: Publish immutable 10A release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.source_commit.outputs.source_commit }}
          SOURCE_BLOB: ${{ steps.source_commit.outputs.source_blob }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view galaxy-viewer-10a >/dev/null 2>&1; then
            echo '10A release already exists; refusing overwrite.' >&2
            exit 1
          fi
          gh release create galaxy-viewer-10a Galaxy-Viewer-10A.apk Galaxy-Viewer-10A.sha256 --target "$SOURCE_COMMIT" --title 'Galaxy Viewer 10A — Android' --notes "Standalone Galaxy Viewer 10A built from frozen 9I-M blob c618320f9ddad3e243f2fc5af436eb6bb678a6b5. 10A source blob: $SOURCE_BLOB. Startup cover uses approved icon.svg for 3.5 seconds before splash playback begins from frame zero."
