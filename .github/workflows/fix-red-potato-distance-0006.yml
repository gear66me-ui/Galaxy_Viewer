name: Fix Red Potato Galaxy distance and redshift — AVM runtime catalog 0006

on:
  push:
    branches: [release]
    paths:
      - .github/workflows/fix-red-potato-distance-0006.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-red-potato-distance-and-redshift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
      - name: Correct and validate Red Potato Galaxy distance and redshift
        shell: python
        run: |
          import json
          import subprocess
          from pathlib import Path

          path = Path("viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0006.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          records = data.get("records", [])
          def is_target(r):
              return (
                  "MQN01 J004131.9-493704" in str(r.get("designation", "")).upper()
                  or "red potato galaxy" == str(r.get("name", "")).casefold().strip()
                  or "chandra-2026-redpotato" == str(r.get("archiveId", "")).casefold().strip()
              )
          matches = [r for r in records if is_target(r)]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one Red Potato Galaxy record; found {len(matches)}. No catalog changes made.")

          record = matches[0]
          old_distance = record.get("distanceMly")
          old_redshift = record.get("redshift")
          record["distanceMly"] = 11700.0
          # Chandra's published source value is z=3.25; use 3.2496 for catalog precision.
          record["redshift"] = 3.2496

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          check = json.loads(path.read_text(encoding="utf-8"))
          verified = [r for r in check["records"] if is_target(r)]
          assert len(verified) == 1
          assert float(verified[0]["distanceMly"]) == 11700.0
          assert abs(float(verified[0]["redshift"]) - 3.2496) < 1e-10
          print(f"Red Potato Galaxy distanceMly: {old_distance} -> 11700.0 (11.7 BLY)")
          print(f"Red Potato Galaxy redshift: {old_redshift} -> 3.2496 (Chandra published z=3.25)")
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", str(path)], check=True)
          diff = subprocess.run(["git", "diff", "--cached", "--quiet"])
          if diff.returncode == 0:
              print("Catalog already correct; no catalog commit needed.")
          elif diff.returncode == 1:
              subprocess.run(["git", "commit", "-m", "Fix Red Potato Galaxy distance and redshift in AVM runtime catalog 0006"], check=True)
              subprocess.run(["git", "push", "origin", "HEAD:release"], check=True)
          else:
              raise SystemExit("Unable to determine whether the catalog changed.")
