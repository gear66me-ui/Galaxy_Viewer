name: Populate SIMBAD and NED distance audit CSV

on:
  push:
    branches: [release]
    paths:
      - ".github/workflows/populate-simbad-ned-distance-audit.yml"
      - ".github/scripts/populate_simbad_ned_distance_audit.py"
      - "audit/distance-age-review/galaxy-distance-age-source-audit.csv"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: simbad-ned-distance-audit
  cancel-in-progress: true

jobs:
  enrich-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run SIMBAD and NED lookups for the full 1,847-record audit
        env:
          AUDIT_OUTPUT: audit/distance-age-review/galaxy-distance-age-source-audit.enriched.csv
        run: python .github/scripts/populate_simbad_ned_distance_audit.py
      - name: Upload full enriched audit CSV
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-distance-age-source-audit-full
          path: audit/distance-age-review/galaxy-distance-age-source-audit.enriched.csv
          if-no-files-found: error
          retention-days: 30
