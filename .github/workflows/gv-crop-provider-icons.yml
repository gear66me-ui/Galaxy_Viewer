name: GV crop provider icons

on:
  push:
    paths:
      - '.github/workflows/gv-crop-provider-icons.yml'

permissions:
  contents: write

jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Restore original high-resolution art and crop only
        shell: bash
        run: |
          set -euo pipefail

          # Exact original 1254x1254 ESO asset from repository history.
          git show a82a636b8841c7be9d4d1371f88a025b5bf10f09:viewer/artwork/ESO/eso_observatory_night_sky_icon.png > /tmp/eso-source.png

          # Existing original high-resolution NOIRLab asset.
          cp viewer/artwork/runtime/providers/noirlab/noirlab-icon.png /tmp/noirlab-source.png

          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib

          jobs = [
              (
                  Path('/tmp/eso-source.png'),
                  Path('viewer/artwork/ESO/eso_observatory_night_sky_icon.png'),
                  (17, 14, 1238, 1235),
                  (1221, 1221),
              ),
              (
                  Path('/tmp/noirlab-source.png'),
                  Path('viewer/artwork/NoirLabs/noirlab-icon.png'),
                  (23, 21, 1230, 1228),
                  (1207, 1207),
              ),
          ]

          def crop_only(src, dst, box, expected):
              im = Image.open(src).convert('RGB')
              if im.size != (1254, 1254):
                  raise RuntimeError(f'Expected 1254x1254 source, got {im.size}: {src}')

              out = im.crop(box)
              if out.size != expected:
                  raise RuntimeError(f'Wrong crop size {out.size}; expected {expected}: {dst}')

              dst.parent.mkdir(parents=True, exist_ok=True)
              out.save(dst, format='PNG', optimize=True)

              size = dst.stat().st_size
              digest = hashlib.sha256(dst.read_bytes()).hexdigest()
              print(
                  f'{dst}: source={im.width}x{im.height} '
                  f'crop={box} output={out.width}x{out.height} '
                  f'bytes={size} sha256={digest}'
              )

              if size < 250000:
                  raise RuntimeError(f'Unexpectedly small PNG: {size} bytes')

          for src, dst, box, expected in jobs:
              crop_only(src, dst, box, expected)
          PY

      - name: Verify exact image-only change
        shell: bash
        run: |
          set -euo pipefail
          echo "=== STATUS ==="
          git status --short

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n'             viewer/artwork/ESO/eso_observatory_night_sky_icon.png             viewer/artwork/NoirLabs/noirlab-icon.png | sort)"
          test "$changed" = "$expected"

          file viewer/artwork/ESO/eso_observatory_night_sky_icon.png
          file viewer/artwork/NoirLabs/noirlab-icon.png
          ls -lh viewer/artwork/ESO/eso_observatory_night_sky_icon.png viewer/artwork/NoirLabs/noirlab-icon.png

      - name: Commit cropped high-resolution icons
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- viewer/artwork/ESO/eso_observatory_night_sky_icon.png viewer/artwork/NoirLabs/noirlab-icon.png
          git commit -m "Crop original high-resolution ESO and NOIRLab icons"
          git push origin HEAD:beta
