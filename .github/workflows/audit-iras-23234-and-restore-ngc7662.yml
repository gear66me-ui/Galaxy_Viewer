name: Audit IRAS 23234+4215 and Restore NGC 7662

on:
  push:
    branches:
      - release
    paths:
      - ".github/workflows/audit-iras-23234-and-restore-ngc7662.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Find the exact IRAS record and restore the unrelated NGC 7662 edit
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          paths = [
            "viewer/image-databases/Chandra/databases/gv-chandra-galaxies-full-0007.json",
            "viewer/image-databases/ESO/databases/gv-eso-galaxies-full-0001.json",
            "viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json",
            "viewer/image-databases/JWST/databases/gv-jwst-galaxies-full-0007-AVM-ESA-FOV.json",
            "viewer/image-databases/NoirLab/databases/gv-noirlab-galaxies-full-0001.json",
            "viewer/image-databases/Spitzer/databases/gv-spitzer-galaxies-full-0011.json",
          ]

          def walk(obj, trail="$"):
            if isinstance(obj, dict):
              yield trail, obj
              for k, v in obj.items():
                yield from walk(v, f"{trail}.{k}")
            elif isinstance(obj, list):
              for i, v in enumerate(obj):
                yield from walk(v, f"{trail}[{i}]")

          found = []
          changed = False
          for name in paths:
            p = Path(name)
            data = json.loads(p.read_text(encoding="utf-8"))
            for trail, obj in walk(data):
              if not isinstance(obj, dict):
                continue
              values = [v for v in obj.values() if isinstance(v, str)]
              if any("IRAS 23234+4215" in v.upper() or "23234+4215" in v.upper() for v in values):
                record = {k: obj.get(k) for k in ("archiveId", "id", "name", "designation", "title", "distance", "constellation", "ra", "dec", "age", "url", "imageUrl") if k in obj}
                found.append({"file": name, "path": trail, "record": record})
            if "Hubble" in name:
              for _, obj in walk(data):
                if isinstance(obj, dict) and obj.get("archiveId") in ("opo9738c20", "opo9738c21"):
                  if obj.get("distance") == "2500 light-years":
                    obj["distance"] = "9.97 million light-years"
                    changed = True
                    print(f"RESTORED NGC 7662 {obj.get('archiveId')} distance to 9.97 million light-years")
              if changed:
                p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          print("EXACT IRAS 23234+4215 MATCHES:")
          print(json.dumps(found, ensure_ascii=False, indent=2))
          print(f"MATCH COUNT: {len(found)}")
          if not found:
            raise SystemExit("STOP: exact IRAS record not found in the six provider catalogs; no IRAS distance was changed.")
          PY

      - name: Commit NGC 7662 restoration only if needed
        shell: bash
        run: |
          if git diff --quiet -- viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json; then
            echo "No NGC 7662 restoration needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0035-ESA-FOV.json
          git commit -m "Restore original NGC 7662 catalog distances"
          git push origin HEAD:release
