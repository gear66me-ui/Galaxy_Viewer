name: Audit IRAS 23234+4215 Across Catalogs

on:
  push:
    branches:
      - release
    paths:
      - ".github/workflows/audit-iras-23234-and-restore-ngc7662.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Locate every matching IRAS or NGC 7662 record
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          roots = [Path("viewer/image-databases")]
          matches = []
          for root in roots:
            for p in root.rglob("*.json"):
              try:
                data = json.loads(p.read_text(encoding="utf-8"))
              except Exception:
                continue
              def walk(obj, trail="$"):
                if isinstance(obj, dict):
                  yield trail, obj
                  for k, v in obj.items():
                    yield from walk(v, f"{trail}.{k}")
                elif isinstance(obj, list):
                  for i, v in enumerate(obj):
                    yield from walk(v, f"{trail}[{i}]")
              for trail, obj in walk(data):
                if not isinstance(obj, dict):
                  continue
                vals = [v for v in obj.values() if isinstance(v, str)]
                text = " ".join(vals).upper()
                if "23234+4215" in text or "NGC 7662" in text or "NGC7662" in text:
                  if any(k in obj for k in ("distance", "archiveId", "designation", "name", "title")):
                    matches.append({
                      "file": str(p),
                      "path": trail,
                      "archiveId": obj.get("archiveId"),
                      "id": obj.get("id"),
                      "name": obj.get("name"),
                      "designation": obj.get("designation"),
                      "title": obj.get("title"),
                      "distance": obj.get("distance"),
                      "ra": obj.get("ra"),
                      "dec": obj.get("dec"),
                      "source": obj.get("source"),
                      "provider": obj.get("provider")
                    })
          print("ALL IRAS 23234+4215 / NGC 7662 MATCHES:")
          print(json.dumps(matches, ensure_ascii=False, indent=2))
          print(f"TOTAL MATCHES: {len(matches)}")
          PY
