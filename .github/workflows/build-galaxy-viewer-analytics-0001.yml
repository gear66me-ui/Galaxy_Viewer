name: Build Galaxy Viewer Analytics 0001

on:
  workflow_dispatch:
  push:
    branches:
      - beta
    paths:
      - "android/galaxy-viewer-analytics/**"
      - ".github/workflows/build-galaxy-viewer-analytics-0001.yml"

permissions:
  contents: read

env:
  APK_NAME: Galaxy-Viewer-Analytics-0001.apk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout beta
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Analytics identity before build
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.gear66me.galaxyviewer.analytics'" android/galaxy-viewer-analytics/app/build.gradle
          grep -q "versionName 'analytics-1'" android/galaxy-viewer-analytics/app/build.gradle
          grep -q "GALAXY VIEWER ANALYTICS" android/galaxy-viewer-analytics/app/src/main/AndroidManifest.xml
          grep -q "GalaxyViewerDownloads" android/galaxy-viewer-analytics/app/src/main/java/com/gear66me/galaxyviewer/analytics/MainActivity.java
          grep -q "LOAD_NO_CACHE" android/galaxy-viewer-analytics/app/src/main/java/com/gear66me/galaxyviewer/analytics/MainActivity.java
          grep -q "cacheBust" android/galaxy-viewer-analytics/app/src/main/java/com/gear66me/galaxyviewer/analytics/MainActivity.java

      - name: Build Analytics APK
        run: |
          set -euo pipefail
          gradle --no-daemon -p android/galaxy-viewer-analytics :app:assembleDebug

      - name: Stage APK
        run: |
          set -euo pipefail
          APK="android/galaxy-viewer-analytics/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"

      - name: Verify APK signature
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK_NAME"

      - name: Verify APK package identity
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK_NAME" > analytics-badging.txt
          grep -q "package: name='com.gear66me.galaxyviewer.analytics'" analytics-badging.txt
          grep -q "application-label:'GALAXY VIEWER ANALYTICS'" analytics-badging.txt
          cat analytics-badging.txt | head -20

      - name: Upload Analytics APK
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Viewer-Analytics-0001
          path: |
            Galaxy-Viewer-Analytics-0001.apk
            Galaxy-Viewer-Analytics-0001.apk.sha256
            analytics-badging.txt
          if-no-files-found: error
          retention-days: 30
