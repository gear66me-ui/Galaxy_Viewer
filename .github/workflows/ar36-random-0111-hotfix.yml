name: AR36 Random 0111 hotfix

on:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/ar36-random-0111-hotfix.yml'

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - name: Build Random 0111 and AR36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          r0=Path('viewer/modules/random-galaxy/gv-random-galaxy-0110.js')
          r1=Path('viewer/modules/random-galaxy/gv-random-galaxy-0111.js')
          p0=Path('viewer/GV-beta-0012AR-35.py')
          p1=Path('viewer/GV-beta-0012AR-36.py')
          old=r0.read_text()
          new=old
          changes=[
            ("const VERSION='0110';","const VERSION='0111';",1),
            ("../navigation/gv-navigation-0013.js","../navigation/gv-navigation-0015.js",1),
            ("/viewer/modules/navigation/gv-navigation-0013.js","/viewer/modules/navigation/gv-navigation-0015.js",1),
            ("if(existing?.VERSION==='0013')","if(existing?.VERSION==='0015')",1),
            ("if(existing && existing.VERSION!=='0012')","if(existing && existing.VERSION!=='0015')",1),
            ("if(api?.VERSION!=='0012')","if(api?.VERSION!=='0015')",1),
          ]
          for a,b,n in changes:
              assert new.count(a)==n,(a,new.count(a))
              new=new.replace(a,b)
          for a,b in [
            ('NAVIGATION 0012 EXPORT MISSING OR VERSION MISMATCH','NAVIGATION 0015 EXPORT MISSING OR VERSION MISMATCH'),
            ('NAVIGATION 0012 SCRIPT LOAD FAILED','NAVIGATION 0015 SCRIPT LOAD FAILED'),
            ('NAVIGATION 0012 CREATE API MISSING','NAVIGATION 0015 CREATE API MISSING'),
            ('NAVIGATION 0012 PLANNER API INCOMPLETE','NAVIGATION 0015 PLANNER API INCOMPLETE'),
            ('NAVIGATION 0012 RECONCILE FAILURE','NAVIGATION 0015 RECONCILE FAILURE'),
            ('NAVIGATION 0012 INITIALIZATION FAILURE','NAVIGATION 0015 INITIALIZATION FAILURE'),
            ('NAVIGATION 0012 COMMIT IDENTITY MISMATCH','NAVIGATION 0015 COMMIT IDENTITY MISMATCH'),
          ]:
              new=new.replace(a,b)
          r1.write_text(new)

          py=p0.read_text()
          py=py.replace('12AR-35','12AR-36')
          py=py.replace('GV-beta-0012AR-35.py','GV-beta-0012AR-36.py')
          py=py.replace('gv-random-galaxy-0110.js','gv-random-galaxy-0111.js')
          py=py.replace("const RANDOM_GALAXY_VERSION='0110';","const RANDOM_GALAXY_VERSION='0111';")
          p1.write_text(py)

          assert "gv-navigation-0013.js" not in new
          assert "if(existing?.VERSION==='0015')" in new
          assert "if(existing && existing.VERSION!=='0015')" in new
          assert "if(api?.VERSION!=='0015')" in new
          assert 'const FUTURE_TARGET=10;' in new
          assert 'Math.max(10,needed)' in new
          assert 'randomRequestPending=false;' in new
          assert 'gv-random-galaxy-0111.js' in py
          assert "const NAVIGATION_VERSION='0015';" in py
          assert "const RANDOM_GALAXY_VERSION='0111';" in py

          fn=re.compile(r'(?m)^\s*(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(')
          assert fn.findall(old)==fn.findall(new)
          print('AR36 RANDOM 0111 BUILD AUDIT PASS')
          PY
          node --check viewer/modules/random-galaxy/gv-random-galaxy-0111.js
          python3 -m py_compile viewer/GV-beta-0012AR-36.py
      - name: Commit hotfix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'gear66me-ui automation'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add viewer/modules/random-galaxy/gv-random-galaxy-0111.js viewer/GV-beta-0012AR-36.py
          git rm .github/workflows/ar36-random-0111-hotfix.yml
          git commit -m 'Fix Random planner Navigation 0015 seam in AR36'
          git push origin HEAD:beta
