name: Correct AVM Runtime Catalog 0004
on:
  push:
    branches: [release]
    paths:
      - ".github/workflows/correct-avm-runtime-0004.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: correct-avm-runtime-catalog-0004
  cancel-in-progress: false
jobs:
  correct-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: release
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply nine reviewed distance/redshift corrections (including NGC 6769)
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          corrections = [
              {"id":"potw2401a","names":["hers j020941.1+001557"],"distanceMly":19500.0,"redshift":2.522536},
              {"id":"potw1619a","provider":"eso","names":["eso 316-33"],"distanceMly":203.841,"redshift":0.014140},
              {"id":"opo1353b","names":["himiko"],"distanceMly":13000.0,"redshift":1.25848},
              {"id":"eso0413a","names":["ngc 6769"],"distanceMly":183.131,"redshift":0.012699},
              {"id":"chandra-2012-gb1428","names":["gb 1428+4217"],"distanceMly":25333.590,"redshift":4.72},
              {"id":"chandra-2026-redpotato","names":["red potato galaxy"],"distanceMly":21914.951,"redshift":3.25},
              {"id":"potw1151a","names":["lrg 3-757","cosmic horseshoe"],"distanceMly":5722.583,"redshift":0.444},
              {"id":"weic2428a","names":["mrc 1138-262","spiderweb galaxy"],"distanceMly":17992.853,"redshift":2.156},
              {"id":"ann1105a","names":["cl j1449+0856"],"distanceMly":17603.089,"redshift":2.07},
          ]

          def walk(node, p="$"):
              if isinstance(node, dict):
                  yield node, p
                  for k, v in node.items():
                      if isinstance(v, (dict, list)):
                          yield from walk(v, f"{p}.{k}")
              elif isinstance(node, list):
                  for i, v in enumerate(node):
                      yield from walk(v, f"{p}[{i}]")

          def scalar_values(obj):
              return [(str(k).lower(), str(v).strip().lower())
                      for k, v in obj.items()
                      if isinstance(v, (str, int, float)) and not isinstance(v, bool)]

          records = list(walk(data))
          changed = []
          for c in corrections:
              matches = []
              for obj, p in records:
                  vals = scalar_values(obj)
                  values = [v for _, v in vals]
                  id_match = any(v == c["id"].lower() or v.endswith("/" + c["id"].lower()) for v in values)
                  name_match = any(any(alias in v for alias in c["names"]) for v in values)
                  if not (id_match and name_match):
                      continue
                  if c.get("provider"):
                      provider_values = [v for k, v in vals if "provider" in k or "catalog" in k or k == "source"]
                      if not any(c["provider"] in v for v in provider_values):
                          continue
                  distance_key = next((k for k in obj if k.lower() in ("distancemly", "distance_mly")), None)
                  redshift_key = next((k for k in obj if k.lower() in ("redshift", "z", "redshiftz")), None)
                  if distance_key is not None and redshift_key is not None:
                      matches.append((obj, p, distance_key, redshift_key))
              # Drop a candidate only when it is a nested container of another matching record.
              matches = [(o,p,dk,rk) for o,p,dk,rk in matches
                         if not any(p.startswith(q + ".") or p.startswith(q + "[")
                                    for _,q,_,_ in matches if q != p)]
              if len(matches) != 1:
                  paths = [p for _,p,_,_ in matches]
                  raise SystemExit(f"STOP: {c['names'][0]} ({c['id']}) matched {len(matches)} eligible records at {paths}; no catalog changes committed.")
              obj, p, dk, rk = matches[0]
              old = (obj[dk], obj[rk])
              obj[dk], obj[rk] = c["distanceMly"], c["redshift"]
              changed.append((c["names"][0], p, old, (obj[dk], obj[rk])))

          if len(changed) != 9:
              raise SystemExit(f"STOP: expected 9 corrections, prepared {len(changed)}; no catalog changes committed.")
          # Validate serialization before writing.
          encoded = json.dumps(data, ensure_ascii=False, indent=2)
          json.loads(encoded)
          path.write_text(encoded, encoding="utf-8")
          print(f"Validated and updated {len(changed)} records:")
          for name, p, old, new in changed:
              print(f"- {name}: {old} -> {new} ({p})")
          PY
      - name: Validate catalog and commit changes
        run: |
          python3 -m json.tool viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0004.json
          if git diff --cached --quiet; then
            echo "Catalog already contains all approved values; no catalog commit needed."
          else
            git commit -m "Correct reviewed distances and redshifts in AVM catalog 0004, including NGC 6769"
            git push origin HEAD:release
          fi
