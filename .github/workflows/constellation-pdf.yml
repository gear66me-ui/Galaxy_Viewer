name: Build constellation comparison PDF
on:
  push:
    branches: [audit/constellation-pdf]
    paths:
      - ".github/workflows/constellation-pdf.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF and plotting libraries
        run: pip install reportlab matplotlib
      - name: Build audit PDF
        run: |
          cat > /tmp/build_audit.py <<'PY'
          import csv, io, re, urllib.request, os, math
          from collections import defaultdict
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          from reportlab.lib.pagesizes import A4, landscape
          from reportlab.lib import colors
          from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle
          from reportlab.lib.enums import TA_CENTER
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, Image, PageBreak, Table, TableStyle, KeepTogether
          from reportlab.lib.units import mm

          SOURCES = {
            "viewer_lines": "https://raw.githubusercontent.com/creativival/hipparcos_planetarium_data_creator/main/data/hip_constellation_line.csv",
            "viewer_stars": "https://raw.githubusercontent.com/creativival/hipparcos_planetarium_data_creator/main/data/hip_constellation_line_star.csv",
            "iau_stick_figures": "https://raw.githubusercontent.com/dcf21/star-charter/master/data/constellations/constellation_lines_iau.dat",
          }
          def fetch(url):
            req=urllib.request.Request(url, headers={"User-Agent":"GalaxyViewer-ConstellationAudit/1.0"})
            with urllib.request.urlopen(req, timeout=30) as r: return r.read().decode("utf-8")
          raw_lines=fetch(SOURCES["viewer_lines"])
          raw_stars=fetch(SOURCES["viewer_stars"])
          raw_iau=fetch(SOURCES["iau_stick_figures"])
          line_rows=list(csv.reader(io.StringIO(raw_lines)))
          star_rows=list(csv.reader(io.StringIO(raw_stars)))
          stars={}
          for row in star_rows:
            if len(row)<7: continue
            try:
              hip=int(row[0]); h=int(row[1]); m=int(row[2]); sec=float(row[3])
              d=float(row[4]); dm=float(row[5]); ds=float(row[6])
              sign=-1 if (d<0 or (d==0 and (dm<0 or (dm==0 and ds<0)))) else 1
              ra=(h+m/60+sec/3600)*15
              dec=sign*(abs(d)+abs(dm)/60+abs(ds)/3600)
              stars[hip]=(ra,dec)
            except Exception: pass
          viewer=defaultdict(list)
          for row in line_rows:
            if len(row)>=3:
              try: viewer[row[0]].append((int(row[1]),int(row[2])))
              except Exception: pass

          # Parse IAU-site stick figures distributed by StarCharter; the source file
          # explicitly says these are the figures shown on the IAU website.
          iau=defaultdict(list); current=None
          for line in raw_iau.splitlines():
            m=re.match(r"\*\s+(.+)", line.strip())
            if m: current=m.group(1).strip(); continue
            if current and line.strip().startswith("["):
              try:
                ids=[int(x.replace("*","")) for x in re.findall(r'"(\d+)\*?"',line)]
                iau[current].extend(zip(ids,ids[1:]))
              except Exception: pass
          aliases={
            "And":"Andromeda","Ant":"Antlia","Aps":"Apus","Aqr":"Aquarius","Aql":"Aquila","Ara":"Ara","Ari":"Aries","Aur":"Auriga",
            "Boo":"Bootes","Cae":"Caelum","Cam":"Camelopardalis","Cnc":"Cancer","CVn":"CanesVenatici","CMa":"CanisMajor","CMi":"CanisMinor",
            "Cap":"Capricornus","Car":"Carina","Cas":"Cassiopeia","Cen":"Centaurus","Cep":"Cepheus","Cet":"Cetus","Cha":"Chamaeleon",
            "Cir":"Circinus","Col":"Columba","Com":"ComaBerenices","CrA":"CoronaAustralis","CrB":"CoronaBorealis","Crv":"Corvus",
            "Crt":"Crater","Cru":"Crux","Cyg":"Cygnus","Del":"Delphinus","Dor":"Dorado","Dra":"Draco","Equ":"Equuleus","Eri":"Eridanus",
            "For":"Fornax","Gem":"Gemini","Gru":"Grus","Her":"Hercules","Hor":"Horologium","Hya":"Hydra","Hyi":"Hydrus","Ind":"Indus",
            "Lac":"Lacerta","Leo":"Leo","LMi":"LeoMinor","Lep":"Lepus","Lib":"Libra","Lup":"Lupus","Lyn":"Lynx","Lyr":"Lyra",
            "Men":"Mensa","Mic":"Microscopium","Mon":"Monoceros","Mus":"Musca","Nor":"Norma","Oct":"Octans","Oph":"Ophiuchus","Ori":"Orion",
            "Pav":"Pavo","Peg":"Pegasus","Per":"Perseus","Phe":"Phoenix","Pic":"Pictor","Psc":"Pisces","PsA":"PiscisAustrinus",
            "Pup":"Puppis","Pyx":"Pyxis","Ret":"Reticulum","Sge":"Sagitta","Sgr":"Sagittarius","Sco":"Scorpius","Sct":"Scutum",
            "Ser":"SerpensA","Sex":"Sextans","Tau":"Taurus","Tel":"Telescopium","Tri":"Triangulum","TrA":"TriangulumAustrale",
            "Tuc":"Tucana","UMa":"UrsaMajor","UMi":"UrsaMinor","Vel":"Vela","Vir":"Virgo","Vol":"Volans","Vul":"Vulpecula",
            "Scl":"Sculptor"
          }
          fullnames={
            "Aql":"Aquila","And":"Andromeda","Scl":"Sculptor","Ara":"Ara","Lib":"Libra","Cet":"Cetus","Ari":"Aries","Sct":"Scutum","Pyx":"Pyxis",
            "Boo":"Boötes","Cae":"Caelum","Cha":"Chamaeleon","Cnc":"Cancer","Cap":"Capricornus","Car":"Carina","Cas":"Cassiopeia","Cen":"Centaurus",
            "Cep":"Cepheus","Com":"Coma Berenices","CVn":"Canes Venatici","Aur":"Auriga","Col":"Columba","Cir":"Circinus","Crt":"Crater",
            "CrA":"Corona Australis","CrB":"Corona Borealis","Crv":"Corvus","Cru":"Crux","Cyg":"Cygnus","Del":"Delphinus","Dor":"Dorado","Dra":"Draco",
            "Nor":"Norma","Eri":"Eridanus","Sge":"Sagitta","For":"Fornax","Gem":"Gemini","Cam":"Camelopardalis","CMa":"Canis Major","UMa":"Ursa Major",
            "Gru":"Grus","Her":"Hercules","Hor":"Horologium","Hya":"Hydra","Hyi":"Hydrus","Ind":"Indus","Lac":"Lacerta","Mon":"Monoceros","Lep":"Lepus",
            "Leo":"Leo","Lup":"Lupus","Lyn":"Lynx","Lyr":"Lyra","Ant":"Antlia","Mic":"Microscopium","Mus":"Musca","Oct":"Octans","Aps":"Apus","Oph":"Ophiuchus",
            "Ori":"Orion","Pav":"Pavo","Peg":"Pegasus","Per":"Perseus","Equ":"Equuleus","CMi":"Canis Minor","LMi":"Leo Minor","Vul":"Vulpecula","UMi":"Ursa Minor",
            "Phe":"Phoenix","Psc":"Pisces","PsA":"Piscis Austrinus","Vol":"Volans","Pup":"Puppis","Ret":"Reticulum","Sgr":"Sagittarius","Sco":"Scorpius","Ser":"Serpens",
            "Sex":"Sextans","Men":"Mensa","Tau":"Taurus","Tel":"Telescopium","Tuc":"Tucana","Tri":"Triangulum","TrA":"Triangulum Australe","Aqr":"Aquarius","Vir":"Virgo","Vel":"Vela",
            "Ser":"Serpens"
          }
          # Include all official chart names, even when a dataset has no line figure.
          all_abbr=sorted(set(viewer)|set(aliases))
          os.makedirs("/tmp/gv_audit",exist_ok=True)
          styles=getSampleStyleSheet()
          styles.add(ParagraphStyle(name="CoverTitle",parent=styles["Title"],fontSize=23,leading=28,alignment=TA_CENTER,spaceAfter=14))
          styles.add(ParagraphStyle(name="Small",parent=styles["BodyText"],fontSize=7.5,leading=9))
          story=[]
          story += [Spacer(1,25*mm), Paragraph("Galaxy Viewer<br/>Constellation Drawing Audit",styles["CoverTitle"]),
            Paragraph("Side-by-side comparison of the viewer’s connected-star dataset and the stick-figure sequences published on the IAU website, as distributed by StarCharter.",styles["BodyText"]),Spacer(1,8*mm)]
          summary=[
            ["Source dataset","Parsed result"],
            ["Galaxy Viewer upstream line CSV",f"{sum(len(v) for v in viewer.values())} connections across {len(viewer)} abbreviations"],
            ["Hipparcos coordinate CSV",f"{len(stars)} stars with parsed RA/Dec"],
            ["IAU website stick-figure sequences",f"{sum(len(v) for v in iau.values())} line segments across {len(iau)} named figures"],
            ["Coordinate conversion","RA = (h + m/60 + s/3600) × 15°; declination sign preserved from signed DMS"],
          ]
          t=Table(summary,colWidths=[62*mm,105*mm],repeatRows=1)
          t.setStyle(TableStyle([("BACKGROUND",(0,0),(-1,0),colors.HexColor("#17324d")),("TEXTCOLOR",(0,0),(-1,0),colors.white),("GRID",(0,0),(-1,-1),.35,colors.grey),("VALIGN",(0,0),(-1,-1),"TOP"),("FONTSIZE",(0,0),(-1,-1),8),("LEFTPADDING",(0,0),(-1,-1),6),("RIGHTPADDING",(0,0),(-1,-1),6),("TOPPADDING",(0,0),(-1,-1),5),("BOTTOMPADDING",(0,0),(-1,-1),5)]))
          story += [t,Spacer(1,6*mm),Paragraph("<b>Critical interpretation:</b> the IAU officially defines the 88 constellation regions by boundary coordinates. It does not mandate a unique universal stick figure. The right panel uses the connected-star sequences published on the IAU constellation page (as identified by the source dataset’s author), not a claim that boundary polygons are stick figures. A boundary-coordinate audit is a separate geometric test and is not inferred from line shape alone.",styles["BodyText"]),Spacer(1,3*mm),
          Paragraph("Sources: Galaxy Viewer’s current upstream CSV URLs; Dominic Ford / StarCharter, constellation_lines_iau.dat (GPL-3.0-or-later). This is a data-source comparison, not a claim that the upstream CSV alone reproduces every app-specific branch (notably the custom Fornax overlay).",styles["Small"]),PageBreak()]
          rows_audit=[["Constellation","Viewer edges","IAU ref edges","Common","Viewer-only","IAU-only","Missing HIP endpoints in reference"]]
          def canon(e): return {tuple(sorted((a,b))) for a,b in e}
          all_missing=set()
          for abbr in all_abbr:
            nm=aliases.get(abbr)
            refedges=iau.get(nm,[]) if nm else []
            vedges=viewer.get(abbr,[])
            vset,iset=canon(vedges),canon(refedges)
            common=len(vset&iset); vonly=sorted(vset-iset); ionly=sorted(iset-vset)
            miss=sorted({x for edge in refedges for x in edge if x not in stars})
            rows_audit.append([f"{fullnames.get(abbr,abbr)} ({abbr})",len(vedges),len(refedges),common,len(vonly),len(ionly),len(miss)])
            all_missing.update(miss)
            # Coordinate-based plot; RA reversed so it reads as a sky chart.
            fig,axes=plt.subplots(1,2,figsize=(11.2,5.8))
            def plot(ax, edges, title, color):
              used=[hip for e in edges for hip in e if hip in stars]
              if not used:
                ax.text(.5,.5,"No drawable lines\n(or reference HIP coordinates missing)",ha="center",va="center",transform=ax.transAxes)
                ax.set_title(title); ax.set_xticks([]); ax.set_yticks([]); return
              coords=[stars[h] for h in used]
              ras=[p[0] for p in coords]; decs=[p[1] for p in coords]
              rmin,rmax=min(ras),max(ras); dmin,dmax=min(decs),max(decs)
              rx=max(rmax-rmin,.05); dx=max(dmax-dmin,.05)
              padra=rx*.12; paddec=dx*.12
              for a,b in edges:
                if a not in stars or b not in stars: continue
                ra1,de1=stars[a]; ra2,de2=stars[b]
                ax.plot([ra1,ra2],[de1,de2],color=color,linewidth=1.15,zorder=2)
              ax.scatter(ras,decs,s=9,color="#111827",zorder=3)
              ax.set_xlim(rmax+padra,rmin-padra); ax.set_ylim(dmin-paddec,dmax+paddec)
              ax.grid(True,alpha=.22,linewidth=.4)
              ax.set_xlabel("Right ascension (deg; reversed sky-chart convention)")
              ax.set_ylabel("Declination (deg)")
              ax.set_title(title,fontsize=10)
            plot(axes[0],vedges,"Galaxy Viewer source CSV", "#2369a8")
            plot(axes[1],refedges,"IAU website stick-figure sequence", "#c05a25")
            fig.suptitle(f"{fullnames.get(abbr,abbr)} ({abbr}) — coordinate-space comparison",fontsize=13)
            fig.tight_layout(rect=[0,0,1,.94])
            img=f"/tmp/gv_audit/{abbr}.png"; fig.savefig(img,dpi=150,bbox_inches="tight"); plt.close(fig)
            # Edge discrepancy note, plus actual coordinates for viewer endpoints.
            note=f"Source edges: viewer {len(vedges)}; reference {len(refedges)}; common undirected edges {common}; viewer-only {len(vonly)}; reference-only {len(ionly)}. Reference HIP IDs absent from supplied coordinate CSV: {len(miss)}."
            story += [Paragraph(f"<b>{fullnames.get(abbr,abbr)} ({abbr})</b>",styles["Heading2"]),Paragraph(note,styles["Small"]),Spacer(1,2*mm),Image(img,width=250*mm,height=128*mm),Spacer(1,2*mm)]
            if vonly:
              s=", ".join(f"{a}–{b}" for a,b in vonly[:24])
              story.append(Paragraph(f"<b>Viewer-only edges (first 24):</b> {s}",styles["Small"]))
            if ionly:
              s=", ".join(f"{a}–{b}" for a,b in ionly[:24])
              story.append(Paragraph(f"<b>Reference-only edges (first 24):</b> {s}",styles["Small"]))
            if miss:
              story.append(Paragraph(f"<b>Reference stars lacking coordinates in provided star CSV:</b> {', '.join(map(str,miss[:35]))}{' …' if len(miss)>35 else ''}",styles["Small"]))
            story.append(PageBreak())
          # Summary matrix across all figures.
          story += [Paragraph("Connection-difference summary",styles["Heading1"]),Paragraph("Edge counts compare undirected HIP-ID pairs. This detects topology differences; it does not itself determine whether the figure is aesthetically or scientifically preferable.",styles["BodyText"]),Spacer(1,3*mm)]
          for i in range(0,len(rows_audit),34):
            t=Table(rows_audit[i:i+34],colWidths=[48*mm,18*mm,18*mm,16*mm,18*mm,18*mm,30*mm],repeatRows=1)
            t.setStyle(TableStyle([("BACKGROUND",(0,0),(-1,0),colors.HexColor("#17324d")),("TEXTCOLOR",(0,0),(-1,0),colors.white),("GRID",(0,0),(-1,-1),.3,colors.grey),("FONTSIZE",(0,0),(-1,-1),6.8),("VALIGN",(0,0),(-1,-1),"TOP"),("LEFTPADDING",(0,0),(-1,-1),3),("RIGHTPADDING",(0,0),(-1,-1),3),("TOPPADDING",(0,0),(-1,-1),3),("BOTTOMPADDING",(0,0),(-1,-1),3)]))
            story += [t,PageBreak()]
          # Per-edge coordinate appendix for every source CSV edge.
          story += [Paragraph("Coordinate appendix — viewer source connections",styles["Heading1"]),Paragraph("RA/Dec values below are converted from the supplied Hipparcos sexagesimal fields. Dec signs are explicitly preserved, including values with zero degrees and negative arcminutes/arcseconds.",styles["BodyText"]),Spacer(1,3*mm)]
          coord_rows=[["Abbr","HIP A","RA A (deg)","Dec A (deg)","HIP B","RA B (deg)","Dec B (deg)"]]
          for abbr, edges in sorted(viewer.items()):
            for a,b in edges:
              ca=stars.get(a); cb=stars.get(b)
              coord_rows.append([abbr,a, f"{ca[0]:.6f}" if ca else "MISSING", f"{ca[1]:.6f}" if ca else "MISSING", b, f"{cb[0]:.6f}" if cb else "MISSING", f"{cb[1]:.6f}" if cb else "MISSING"])
          for i in range(0,len(coord_rows),45):
            t=Table(coord_rows[i:i+45],colWidths=[17*mm,18*mm,27*mm,27*mm,18*mm,27*mm,27*mm],repeatRows=1)
            t.setStyle(TableStyle([("BACKGROUND",(0,0),(-1,0),colors.HexColor("#17324d")),("TEXTCOLOR",(0,0),(-1,0),colors.white),("GRID",(0,0),(-1,-1),.25,colors.grey),("FONTSIZE",(0,0),(-1,-1),6.5),("VALIGN",(0,0),(-1,-1),"TOP"),("LEFTPADDING",(0,0),(-1,-1),3),("RIGHTPADDING",(0,0),(-1,-1),3),("TOPPADDING",(0,0),(-1,-1),2),("BOTTOMPADDING",(0,0),(-1,-1),2)]))
            story += [t,PageBreak()]
          story += [Paragraph("Scope and limitations",styles["Heading1"]),
            Paragraph("1. The left-hand figures reconstruct line segments from the live upstream CSV currently referenced by the Galaxy Viewer overlay module. Fornax is a known app-specific exception: the module substitutes a custom three-star pattern, so its left panel here reflects upstream source edges rather than that custom drawing. 2. The right-hand figures use the IAU website stick-figure sequences in StarCharter’s published data file; that file states no universal stick-figure standard exists. 3. The coordinate CSV contains 692 star records; reference endpoints not found there are listed rather than fabricated. 4. IAU constellation boundary regions are formally defined by coordinate boundaries, not by stick figures. This report compares line topology and coordinates; it does not falsely treat line segments as the official region polygons.",styles["BodyText"]),
            Spacer(1,4*mm),Paragraph("Data sources",styles["Heading2"]),
            Paragraph("Galaxy Viewer line CSV: "+SOURCES["viewer_lines"]+"<br/>Galaxy Viewer star coordinate CSV: "+SOURCES["viewer_stars"]+"<br/>IAU stick-figure sequences: "+SOURCES["iau_stick_figures"]+"<br/>IAU constellation FAQ and charts: https://www.iau.org/IAU/IAU/Astronomy-FAQs/Constellations.aspx",styles["Small"])]
          out="/tmp/Galaxy_Viewer_Constellation_Audit.pdf"
          doc=SimpleDocTemplate(out,pagesize=landscape(A4),rightMargin=12*mm,leftMargin=12*mm,topMargin=10*mm,bottomMargin=10*mm,title="Galaxy Viewer Constellation Audit",author="Galaxy Viewer Audit")
          doc.build(story)
          print(f"PDF={out}")
          print(f"Viewer connections={sum(map(len,viewer.values()))}; parsed stars={len(stars)}; IAU edges={sum(map(len,iau.values()))}; constellation pages={len(all_abbr)}")
          PY
          python /tmp/build_audit.py
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Viewer-Constellation-Audit
          path: /tmp/Galaxy_Viewer_Constellation_Audit.pdf
          if-no-files-found: error
          retention-days: 14
