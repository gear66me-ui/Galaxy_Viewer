name: Build Galaxy Viewer Android 10E Splash Fix
on:
  push:
    branches: [beta]
    paths: ['.github/workflows/build-galaxy-viewer-android-10E-splash-fix.yml']
  workflow_dispatch:
permissions:
  contents: write
env:
  APK_NAME: Galaxy-Viewer-10E-Generic.apk
  RELEASE_TAG: galaxy-viewer-10e-generic
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate corrected splash shell source
        shell: bash
        run: |
          set -euo pipefail
          INDEX=android/galaxy-viewer-10e/app/src/main/assets/index.html
          test -s "$INDEX"
          grep -q "galaxy-splash-complete" "$INDEX"
          grep -q "await completion" "$INDEX"
          ! grep -q "setTimeout(r,5000)" "$INDEX"
          ! grep -q "3500-(performance.now()-a)" "$INDEX"
      - name: Build APK
        run: gradle --no-daemon -p android/galaxy-viewer-10e :app:assembleDebug
      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android/galaxy-viewer-10e/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.gear66me.galaxyviewer10e'" /tmp/badging.txt
          grep -q "versionName='10E-generic'" /tmp/badging.txt
          grep -q "launchable-activity: name='com.gear66me.galaxyviewer10e.MainActivity'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          rm -rf /tmp/apk10e && mkdir /tmp/apk10e
          unzip -qq "$APK" -d /tmp/apk10e
          grep -q "galaxy-splash-complete" /tmp/apk10e/assets/index.html
          grep -q "await completion" /tmp/apk10e/assets/index.html
          ! grep -q "setTimeout(r,5000)" /tmp/apk10e/assets/index.html
          cp "$APK" "$APK_NAME"
          sha256sum "$APK_NAME" | tee "${APK_NAME}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Galaxy-Viewer-10E-Splash-Fix
          path: |
            Galaxy-Viewer-10E-Generic.apk
            Galaxy-Viewer-10E-Generic.apk.sha256
          if-no-files-found: error
      - name: Replace 10E release installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$APK_NAME" "${APK_NAME}.sha256" --clobber
