<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#000"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff}
#boot{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:#000}
#identity{text-align:center}
#halo{width:min(62vw,330px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(7,45,110,.98) 0%,rgba(5,35,91,.84) 28%,rgba(3,25,68,.55) 47%,rgba(1,13,38,.24) 64%,rgba(0,0,0,0) 80%)}
#target{width:52%;height:52%;filter:drop-shadow(0 0 8px rgba(69,231,255,.45))}
#ver,#bld{font:600 clamp(15px,4vw,24px) sans-serif;letter-spacing:.08em;color:#f8fdff;text-shadow:0 0 3px #fff,0 0 9px #075cff,0 0 18px #075cff}
#ver{margin-top:18px}#bld{margin-top:20px}
#splash{display:none;position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;z-index:100}
#error{display:none;position:fixed;inset:0;padding:28px;white-space:pre-wrap;color:#9be5ff;background:#000;font:12px monospace;z-index:101}
</style></head><body>
<div id="boot"><div id="identity"><div id="halo"><img id="target" src="https://gear66me-ui.github.io/Galaxy_Viewer/viewer/artwork/runtime/navigation/galaxy-viewer-target-icon.svg"></div><div id="ver">VERSION</div><div id="bld">BUILD</div></div></div>
<iframe id="splash"></iframe><div id="error"></div>
<script>
(async()=>{const BASE='https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/beta/viewer/';
const read=async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status+' '+u);return r.text()};
try{
 const p=JSON.parse(await read(BASE+'gv-current-viewer.json?t='+Date.now()));
 ver.textContent='VERSION '+String(p.version||'').toUpperCase();bld.textContent='BUILD '+String(p.build||'').toUpperCase();
 const vp=read(BASE+p.viewer+'?t='+Date.now());
 await new Promise(r=>setTimeout(r,650));
 const src=await vp;await new Promise(r=>setTimeout(r,2350));
 splash.style.display='block';splash.src='https://gear66me-ui.github.io/Galaxy_Viewer/viewer/releases/splash/Galaxy-Viewer-Singularity-FINAL/index.html?v=0030-'+Date.now();
 await new Promise(r=>setTimeout(r,12750));
 const hm=src.match(/display\(HTML\(\"\"\"([\s\S]*?)\"\"\"\)\)/),jm=src.match(/display\(Javascript\(r\"\"\"([\s\S]*?)\"\"\"\)\)/);
 if(!hm||!jm)throw Error('VIEWER EXTRACTION FAILED');
 splash.remove();boot.remove();document.body.insertAdjacentHTML('beforeend',hm[1]);const e=document.createElement('script');e.textContent=jm[1];document.body.appendChild(e);
}catch(e){boot?.remove();splash?.remove();error.style.display='block';error.textContent='GALAXY VIEWER FAILED TO LOAD\n\n'+String(e&&e.stack||e)}
})();
</script></body></html>
