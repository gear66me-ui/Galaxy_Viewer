<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff}#error{display:none;position:fixed;inset:0;padding:28px;white-space:pre-wrap;color:#9BE5FF;background:#000;font:12px monospace}</style></head><body><div id="error"></div><script>(async()=>{'use strict';const BASE='https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/beta/viewer/';const read=async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status+' '+u);return r.text()};const extract=s=>{const h=[...s.matchAll(/display\(HTML\(\"\"\"([\s\S]*?)\"\"\"\)\)/g)],j=[...s.matchAll(/display\(Javascript\(r\"\"\"([\s\S]*?)\"\"\"\)\)/g)];if(h.length!==1||j.length!==1)throw new Error('VIEWER EXTRACTION FAILED');return[h[0][1],j[0][1]]};try{const p=JSON.parse(await read(BASE+'gv-current-viewer.json?t='+Date.now()));const src=await read(BASE+p.viewer+'?t='+Date.now());const [h,j]=extract(src);document.body.insertAdjacentHTML('beforeend',h);const e=document.createElement('script');e.textContent=j;document.body.appendChild(e)}catch(e){const x=document.getElementById('error');x.style.display='block';x.textContent='GALAXY VIEWER FAILED TO LOAD\n\n'+String(e?.stack||e)}})();</script></body></html>
