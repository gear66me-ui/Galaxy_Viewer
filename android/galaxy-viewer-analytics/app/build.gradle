plugins {
    id 'com.android.application'
}

def canonicalIconOutputDir = layout.buildDirectory.dir('generated/res/canonicalIcon').get().asFile

android {
    namespace 'com.gear66me.galaxyviewer.analytics'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gear66me.galaxyviewer.analytics'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName 'analytics-1'
    }

    sourceSets {
        main {
            res.srcDir canonicalIconOutputDir
        }
    }
}

tasks.register('prepareCanonicalIcon', Copy) {
    from rootProject.file('../../viewer/artwork/icon_transparent.png')
    into new File(canonicalIconOutputDir, 'drawable')
    rename { 'gv_app_icon.png' }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareCanonicalIcon')
}
