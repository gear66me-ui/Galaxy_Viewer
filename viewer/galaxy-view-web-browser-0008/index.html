<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Galaxy Viewer Browser — 0008</title>
<style>
@font-face{font-family:"Space Age";src:url("../artwork/Fonts/Space Age Regular/Space Age Regular.otf") format("opentype");font-style:normal;font-weight:400;font-display:block}
@font-face{font-family:"GV Space Age";src:url("../artwork/Fonts/Space Age Regular GV-9/Space Age GV-9A.otf") format("opentype");font-display:swap}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}body{padding:12px;font-family:"Space Age",sans-serif}
.row{width:100%;display:grid;gap:2px}.top{height:36px;grid-template-columns:36px minmax(0,1fr) 36px}.nav{height:36px;grid-template-columns:36px minmax(0,1fr) 36px;margin-top:4px}
.tile{position:relative;height:36px;margin:0;padding:0;overflow:hidden;border:1px solid #7CCBFF;border-radius:6px;background:linear-gradient(145deg,#081B3A 0%,#0B3177 48%,#123F86 72%,#296DBD 100%);color:#DDF8FF;box-shadow:inset 0 2px 2px rgba(225,251,255,.82),inset 0 -3px 5px rgba(0,0,0,.52),inset 0 0 13px rgba(41,153,255,.34),0 0 3px #DDF8FF,0 0 9px rgba(50,190,255,.72),0 0 18px rgba(20,116,219,.35)}
.tile::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.46) 0%,rgba(118,225,255,.08) 24%,transparent 42%);pointer-events:none;z-index:1}
.icon{display:flex;align-items:center;justify-content:center;padding:2px}.icon img{position:relative;z-index:2;width:30px;height:30px;object-fit:contain}.provider img{object-fit:cover;border-radius:4px}
.title{display:flex;align-items:center;justify-content:center;padding:0 12px;overflow:hidden;font:400 15.5px/1 "GV Space Age",sans-serif;letter-spacing:.38px;text-transform:uppercase;color:#F4FDFF;text-shadow:0 0 5px #fff,0 0 11px rgba(88,191,255,.85);white-space:nowrap}.title span{position:relative;z-index:2}
.ctrl{appearance:none;-webkit-appearance:none;position:relative;display:flex;flex:0 0 36px;align-items:center;justify-content:center;width:36px;height:36px;margin:0;padding:0;border:1px solid #43CFFF;border-radius:10px;background:linear-gradient(180deg,#174E86 0%,#082C59 13%,#041B3E 54%,#07366A 88%,#0D5A98 100%) padding-box;color:transparent;box-shadow:inset 0 2px 2px rgba(225,251,255,.82),inset 0 -3px 5px rgba(0,0,0,.52),inset 0 0 13px rgba(41,153,255,.34),0 0 2px rgba(221,248,255,.88),0 0 7px rgba(50,190,255,.58);cursor:pointer;touch-action:manipulation;outline:none;overflow:hidden}
.ctrl::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.46) 0%,rgba(118,225,255,.08) 24%,transparent 42%);pointer-events:none}
.ctrl::before{content:"";position:absolute;left:50%;top:50%;width:12.8px;height:12.8px;border:solid #F4FDFF;border-width:0 4px 4px 0;filter:drop-shadow(0 0 4px #8DDAFF) drop-shadow(0 0 8px #58BFFF);transform:translate(-62%,-50%) rotate(-45deg);box-sizing:border-box;z-index:2}
.ctrl.back::before{transform:translate(-38%,-50%) rotate(135deg)}
.ctrl:active{transform:translateY(2px) scale(.985);filter:brightness(1.14);box-shadow:inset 0 3px 7px rgba(0,0,0,.52),inset 0 0 10px rgba(88,191,255,.36),0 0 5px rgba(88,191,255,.62)}
.address{display:grid;grid-template-columns:20px minmax(0,1fr);align-items:center;padding:0 6px 0 4px;background:linear-gradient(180deg,#02081B,#020612);font-family:"GV Space Age",sans-serif}.lock{position:relative;z-index:2;width:20px;height:28px;display:flex;align-items:center;justify-content:flex-start;padding-left:0}.lock svg{display:block;width:12px;height:16px;fill:#F4FDFF;filter:drop-shadow(0 0 2px #8DDAFF) drop-shadow(0 0 4px rgba(88,191,255,.55))}.url{position:relative;z-index:2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#F4FDFF;font:400 12px/1 "GV Space Age",sans-serif;letter-spacing:.15px;text-shadow:0 0 3px rgba(88,191,255,.35)}
.refresh svg{position:relative;z-index:2;width:21px;height:21px;stroke:#F4FDFF;stroke-width:4.5;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 3px #8DDAFF)}
.top .tile:first-child img{width:34px;height:34px;object-fit:contain;filter:none}
.gv-target-simbad-button{appearance:none;-webkit-appearance:none;position:relative;display:flex;visibility:visible;opacity:1;align-items:center;justify-content:center;width:36px;min-width:36px;max-width:36px;height:36px;min-height:36px;max-height:36px;margin:0;padding:0;overflow:hidden;background:linear-gradient(145deg,#081B3A 0%,#0B3177 42%,#1484DB 76%,#296DBD 100%);border:1px solid #7CCBFF;border-radius:6px;cursor:default;outline:none;box-shadow:inset 0 2px 2px rgba(225,251,255,.82),inset 0 -3px 5px rgba(0,0,0,.52),inset 0 0 13px rgba(41,153,255,.34),0 0 3px #DDF8FF,0 0 9px rgba(50,190,255,.72),0 0 18px rgba(20,116,219,.35)}
.gv-target-simbad-button img{position:relative;z-index:2;display:block;width:34px;height:34px;object-fit:contain;filter:none;pointer-events:none;user-select:none;-webkit-user-drag:none}
.web-viewport{position:relative;width:100%;height:calc(100dvh - 84px);min-height:300px;margin-top:6px;box-sizing:border-box;overflow:hidden;background:#02070F;border:1px solid #43CFFF;border-radius:10px;box-shadow:inset 0 2px 2px rgba(225,251,255,.22),inset 0 -3px 5px rgba(0,0,0,.52),inset 0 0 13px rgba(41,153,255,.20),0 0 2px rgba(221,248,255,.88),0 0 7px rgba(50,190,255,.58)}
.web-viewport::before{content:"";position:absolute;inset:1px;z-index:1;border-radius:8px;border:1px solid rgba(124,203,255,.22);pointer-events:none}
</style></head><body>
<div class="row top"><div class="gv-target-simbad-button" aria-label="Galaxy Viewer"><img src="../artwork/runtime/navigation/galaxy-viewer-target-icon.svg" alt="" aria-hidden="true" draggable="false"></div><div class="tile title"><span>GALAXY VIEWER</span></div><div class="tile icon provider"><img id="providerIcon" src="../artwork/Chandra/Chandra.jpg" alt="Provider"></div></div>
<div class="row nav"><button class="ctrl back" aria-label="Back"></button><div class="tile address"><span class="lock"><svg viewBox="0 0 12 16" aria-hidden="true"><path d="M3 6V4a3 3 0 0 1 6 0v2h1.5v9H1.5V6H3zm1.5 0h3V4a1.5 1.5 0 0 0-3 0v2z"/></svg></span><span class="url" id="sourceUrl">LOADING SOURCE URL…</span></div><button class="ctrl forward" aria-label="Forward"></button></div>
<script>
(async()=>{try{const r=await fetch("../image-databases/Chandra/databases/gv-chandra-galaxies-full-0007.json",{cache:"no-store"});const j=await r.json();const e=(j.entries||[]).find(x=>x&&x.sourceUrl);document.getElementById("sourceUrl").textContent=e?.sourceUrl||j.sourceArchiveUrl||"SOURCE URL UNAVAILABLE"}catch(e){document.getElementById("sourceUrl").textContent="SOURCE URL UNAVAILABLE"}})();
</script></body></html>
