<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Galaxy Viewer — Orientation Review 0001</title><style>:root{color-scheme:dark;--bg:#070a0f;--panel:#101620;--panel2:#151d29;--line:#2a3545;--text:#eef4ff;--muted:#9eacc0;--good:#55e39a;--warn:#ffd166;--bad:#ff6b6b;--accent:#8ab4ff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input{font:inherit}a{color:var(--accent)}.top{position:sticky;top:0;z-index:50;background:rgba(7,10,15,.97);border-bottom:1px solid var(--line);padding:10px 12px}.toprow,.toolbar,.source-tools,.quick,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0 10px 0 0}.pill{padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:#0d131c;font-size:12px}.pill.good{border-color:#2d7c59;color:var(--good)}.pill.warn{border-color:#846c2d;color:var(--warn)}.toolbar{margin-top:8px}.toolbar input{min-width:210px;flex:1}.toolbar input,.orientation-row input,.note{background:#090d13;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px}button,.btn{border:1px solid var(--line);background:#172130;color:var(--text);border-radius:8px;padding:8px 10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{border-color:#3562a5!important;background:#18345d!important}.good{border-color:#2b7a56!important}.warn{border-color:#8a7130!important}.bad{border-color:#8a3d45!important}main{max-width:1700px;margin:auto;padding:14px}.intro,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}.intro{padding:12px;margin-bottom:14px}.catalog-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}.sum{background:#0d131c;border:1px solid var(--line);border-radius:9px;padding:9px}.sum b{display:block;font-size:20px}#cards{display:flex;flex-direction:column;gap:16px}.card{overflow:hidden}.card.confirmed{border-color:#2b7a56}.card.skipped{border-color:#826c2f}.cardhead{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#0d131c}.num{font-weight:800;color:var(--accent)}.catalog{font-weight:800}.title{font-weight:700;font-size:17px;flex:1}.status{font-size:12px;padding:4px 7px;border-radius:999px;border:1px solid var(--line)}.status.confirmed{color:var(--good)}.status.skipped{color:var(--warn)}.body{display:grid;grid-template-columns:minmax(300px,.9fr) minmax(420px,1.1fr);min-height:520px}.left,.right{padding:12px}.left{border-right:1px solid var(--line)}.imagebox{background:#05070a;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:260px;display:flex;align-items:center;justify-content:center}.imagebox img{width:100%;max-height:520px;object-fit:contain}.noimage,.framehint{color:var(--muted);padding:24px;text-align:center}.meta{display:grid;grid-template-columns:max-content 1fr;gap:5px 10px;margin-top:10px;font-size:13px}.meta dt{color:var(--muted)}.meta dd{margin:0;overflow-wrap:anywhere}.sourceurl{font-size:12px;color:var(--muted);overflow-wrap:anywhere;margin:7px 0}.framewrap{height:400px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#090d13;display:flex;align-items:center;justify-content:center}.framewrap iframe{width:100%;height:100%;border:0;background:white}.review{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}.review label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.orientation-row{display:grid;grid-template-columns:1fr auto;gap:7px}.note{width:100%;margin-top:8px}.suggestion{margin-top:8px;padding:8px;border:1px dashed #58687e;border-radius:8px;font-size:13px}.hidden{display:none!important}.footer{color:var(--muted);text-align:center;padding:30px}@media(max-width:850px){.body{grid-template-columns:1fr}.left{border-right:0;border-bottom:1px solid var(--line)}.framewrap{height:65vh}.top{position:relative}}</style></head><body><header class="top"><div class="toprow"><h1>GALAXY VIEWER — ORIENTATION REVIEW 0001</h1><span class="pill good">REAL SOURCE IMAGES ONLY</span><span class="pill warn">NO AI IMAGES</span><span class="pill" id="loadState">Loading catalogs…</span></div><div class="toolbar"><input id="search" placeholder="Search galaxy, archive ID, catalog…"><button id="unresolvedBtn">SHOW UNRESOLVED ONLY</button><button id="exportBtn" class="primary">DOWNLOAD CONFIRMED JSON</button><button id="copyBtn">COPY CONFIRMED JSON</button><button id="clearBtn" class="bad">CLEAR LOCAL REVIEW</button></div></header><main><section class="intro"><strong>Orientation only.</strong> All missing-orientation records are shown on this one continuous page. Source catalogs and curation decisions are never modified by this page.<div class="catalog-summary" id="summary"></div></section><div id="cards"></div><div class="footer" id="footer"></div></main><script>'use strict';const CATALOGS=[{name:'Chandra',revision:'0002',url:'https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/beta/viewer/image-databases/Chandra/databases/gv-chandra-galaxies-full-0002.json'},{name:'Hubble',revision:'0025',url:'https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/beta/viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0025.json'},{name:'JWST',revision:'0002',url:'https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/beta/viewer/image-databases/JWST/databases/gv-jwst-galaxies-full-0002.json'},{name:'Spitzer',revision:'0009',url:'https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/beta/viewer/image-databases/Spitzer/databases/gv-spitzer-galaxies-full-0009.json'}],STORAGE_KEY='gv-orientation-review-0001';let rows=[],review=loadReview(),unresolvedOnly=false;function loadReview(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch{return{}}}function saveReview(){localStorage.setItem(STORAGE_KEY,JSON.stringify(review))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function missing(v){return v==null||(typeof v==='string'&&!v.trim())}function entries(d){if(Array.isArray(d))return d;for(const k of['entries','galaxies','records','items','data','catalog'])if(Array.isArray(d?.[k]))return d[k];return[]}function id(r,c,i){return`${c.name}:${r.archiveId||r.id||r.designation||r.name||i}`}function name(r){return r.displayName||r.name||r.title||r.designation||r.archiveId||'Unnamed record'}function image(r){return r.selectedImageUrl||r.githubImageUrl||r.esaPublicationJpeg||r.publicationJpeg||r.imageUrl||r.jpegUrl||r.image||(Array.isArray(r.jpegCandidates)?r.jpegCandidates[0]:null)||null}function source(r){return r.sourceUrl||r.sourcePageUrl||r.sourcePage||r.archiveUrl||r.infoUrl||r.webUrl||null}function val(r,...ks){for(const k of ks)if(r[k]!=null)return r[k];return''}async function load(){const results=await Promise.all(CATALOGS.map(async c=>{try{const x=await fetch(c.url,{cache:'no-store'});if(!x.ok)throw Error(`HTTP ${x.status}`);const d=await x.json(),a=entries(d);return{c,a,m:a.filter(r=>missing(r.orientation))}}catch(e){return{c,a:[],m:[],error:String(e)}}}));rows=[];for(const x of results)x.m.forEach((r,i)=>rows.push({catalog:x.c,record:r,key:id(r,x.c,i)}));document.getElementById('loadState').textContent=`${rows.length} missing orientation records`;document.getElementById('summary').innerHTML=results.map(x=>`<div class="sum"><span>${esc(x.c.name)} ${x.c.revision}</span><b>${x.error?'ERROR':x.m.length}</b><small>${x.error?esc(x.error):`${x.a.length} total records`}</small></div>`).join('')+`<div class="sum"><span>GRAND TOTAL MISSING</span><b>${rows.length}</b><small>orientation repair queue</small></div>`;render();document.getElementById('footer').textContent=`End of list — ${rows.length} missing records total.`}function render(){const box=document.getElementById('cards');box.innerHTML='';rows.forEach((row,i)=>box.appendChild(card(row,i)));filter()}function card(row,i){const r=row.record,c=row.catalog,k=row.key,s=review[k]||{},im=image(r),src=source(r),nm=name(r),el=document.createElement('section');el.className='card '+(s.status||'');el.dataset.search=[c.name,c.revision,nm,r.archiveId,r.designation,r.title].join(' ').toLowerCase();el.dataset.status=s.status||'';el.innerHTML=`<div class="cardhead"><span class="num">#${i+1}</span><span class="catalog">${esc(c.name)} ${c.revision}</span><span class="title">${esc(nm)}</span><span class="status ${s.status||''}">${s.status?s.status.toUpperCase():'UNRESOLVED'}</span></div><div class="body"><div class="left"><div class="imagebox">${im?`<img loading="lazy" decoding="async" src="${esc(im)}" alt="${esc(nm)}">`:'<div class="noimage">No image URL found.</div>'}</div><dl class="meta"><dt>Archive ID</dt><dd>${esc(r.archiveId||r.id||'')}</dd><dt>Designation</dt><dd>${esc(r.designation||'')}</dd><dt>RA</dt><dd>${esc(val(r,'raText','RA','ra'))}</dd><dt>Dec</dt><dd>${esc(val(r,'decText','Dec','DEC','dec'))}</dd><dt>FOV</dt><dd>${esc(val(r,'fieldOfView','fov','FOV'))}</dd><dt>Orientation</dt><dd style="color:var(--bad)"><b>MISSING</b></dd><dt>Image URL</dt><dd>${im?`<a target="_blank" href="${esc(im)}">${esc(im)}</a>`:'—'}</dd></dl></div><div class="right"><div class="source-tools">${src?`<button class="load primary">LOAD SOURCE WEBSITE</button><a class="btn" target="_blank" href="${esc(src)}">OPEN SOURCE PAGE ↗</a><button class="scan">SCAN SOURCE TEXT</button>`:'<span class="pill warn">NO SOURCE URL</span>'}</div><div class="sourceurl">${esc(src||'No source URL available.')}</div><div class="framewrap"><div class="framehint">${src?'Tap LOAD SOURCE WEBSITE. If embedding is blocked, use OPEN SOURCE PAGE.':'No source website recorded.'}</div></div><div class="review"><label>CONFIRMED ORIENTATION — preserve published wording when possible</label><div class="orientation-row"><input class="ori" value="${esc(s.orientation||'')}" placeholder="North is 27.0° left of vertical"><button class="paste">PASTE</button></div><div class="quick"><button class="north">NORTH UP / 0°</button><button class="clear">CLEAR FIELD</button></div><div class="suggestion">Source-text suggestion: <span>${esc(s.suggestion||'not scanned')}</span></div><input class="note" value="${esc(s.note||'')}" placeholder="Optional note"><div class="actions"><button class="confirm good">CONFIRM</button><button class="skip warn">SKIP / MANUAL CHECK</button><button class="reset">RESET</button></div></div></div></div>`;const ori=el.querySelector('.ori'),note=el.querySelector('.note');function refresh(){const z=review[k]||{};el.className='card '+(z.status||'');el.dataset.status=z.status||'';el.querySelector('.status').textContent=z.status?z.status.toUpperCase():'UNRESOLVED';el.querySelector('.status').className='status '+(z.status||'');el.querySelector('.suggestion span').textContent=z.suggestion||'not scanned';ori.value=z.orientation||'';note.value=z.note||'';filter()}if(src){el.querySelector('.load').onclick=()=>el.querySelector('.framewrap').innerHTML=`<iframe loading="lazy" referrerpolicy="no-referrer" src="${esc(src)}"></iframe>`;el.querySelector('.scan').onclick=async e=>{e.target.disabled=true;e.target.textContent='SCANNING…';let found='';try{const q=await fetch(src,{mode:'cors',cache:'no-store'}),t=await q.text(),ps=[/North\s+is\s+\d+(?:\.\d+)?\s*(?:°|&deg;)?\s*(?:left|right)\s+of\s+vertical/i,/North\s+(?:is\s+)?up/i,/position\s+angle\s*[:=]?\s*[+\-]?\d+(?:\.\d+)?\s*(?:°|&deg;)?/i];for(const p of ps){const m=t.match(p);if(m){found=m[0].replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();break}}if(!found)found='No obvious orientation phrase found automatically.'}catch{found='Automatic scan blocked by source/CORS — inspect manually.'}review[k]={...(review[k]||{}),suggestion:found};saveReview();refresh();e.target.disabled=false;e.target.textContent='SCAN SOURCE TEXT'}}el.querySelector('.north').onclick=()=>ori.value='North is up (0°)';el.querySelector('.clear').onclick=()=>ori.value='';el.querySelector('.paste').onclick=async()=>{try{ori.value=await navigator.clipboard.readText()}catch{}};el.querySelector('.confirm').onclick=()=>{if(!ori.value.trim())return alert('Enter orientation first.');review[k]={...(review[k]||{}),status:'confirmed',orientation:ori.value.trim(),note:note.value.trim(),reviewedAt:new Date().toISOString(),catalog:c.name,revision:c.revision,archiveId:r.archiveId||r.id||null,name:nm,sourceUrl:src,imageUrl:im};saveReview();refresh()};el.querySelector('.skip').onclick=()=>{review[k]={...(review[k]||{}),status:'skipped',orientation:ori.value.trim(),note:note.value.trim(),reviewedAt:new Date().toISOString(),catalog:c.name,revision:c.revision,archiveId:r.archiveId||r.id||null,name:nm,sourceUrl:src,imageUrl:im};saveReview();refresh()};el.querySelector('.reset').onclick=()=>{delete review[k];saveReview();refresh()};return el}function filter(){const q=document.getElementById('search').value.trim().toLowerCase();document.querySelectorAll('.card').forEach(x=>x.classList.toggle('hidden',!((!q||x.dataset.search.includes(q))&&(!unresolvedOnly||x.dataset.status!=='confirmed'))))}function payload(){const corrections=rows.filter(r=>review[r.key]?.status==='confirmed').map(r=>({catalog:r.catalog.name,revision:r.catalog.revision,archiveId:r.record.archiveId||r.record.id||null,name:name(r.record),orientation:review[r.key].orientation,sourceUrl:source(r.record),imageUrl:image(r.record),note:review[r.key].note||'',reviewedAt:review[r.key].reviewedAt||null}));return{schema:'gv-orientation-corrections-0001',generatedAt:new Date().toISOString(),confirmedCount:corrections.length,corrections}}document.getElementById('search').oninput=filter;document.getElementById('unresolvedBtn').onclick=e=>{unresolvedOnly=!unresolvedOnly;e.target.textContent=unresolvedOnly?'SHOW ALL RECORDS':'SHOW UNRESOLVED ONLY';filter()};document.getElementById('exportBtn').onclick=()=>{const b=new Blob([JSON.stringify(payload(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='gv-orientation-corrections-0001.json';a.click()};document.getElementById('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(payload(),null,2));alert('Copied.')}catch{}};document.getElementById('clearBtn').onclick=()=>{if(confirm('Clear all locally saved review decisions?')){review={};localStorage.removeItem(STORAGE_KEY);render()}};load();</script></body></html>
