<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Galaxy Viewer Astroalign Sandbox 0003</title></head><body><div id="gv-bootstrap" style="font:14px system-ui;padding:20px;background:#05080d;color:#eef5ff;min-height:100vh">Loading Astroalign Sandbox 0003…</div><script>
'use strict';
(async()=>{
const BASE='https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/fcf413428accb443b7d29ddb880493252bf98729/viewer/image-databases/master-database/orientation-review/gv-astrometry-sandbox-0010.html';
const engine=function(){
const PY='https://cdn.jsdelivr.net/pyodide/v0.28.2/full/pyodide.js';let aaBusy=false,py=null,ready=null;
const q=s=>document.querySelector(s);
function aaStatus(text,kind='warn'){const e=q('#actionStatus');if(e){e.textContent=text;e.className='action '+kind}const s=q('#status');if(s){s.textContent=text;s.className=kind}}
function hardFeedback(){const b=q('#aaRun');if(!b)return;b.textContent='PRESSED ✓';b.style.background='#0f7a3d';b.style.boxShadow='0 0 20px #65e7a4';aaStatus('ASTROALIGN BUTTON PRESSED ✓','good')}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(Error('script load failed: '+src));document.head.appendChild(s)})}
async function runtime(){if(ready)return ready;ready=(async()=>{
 aaStatus('ASTROALIGN · LOADING PYTHON','warn');q('#aaRuntime').textContent='LOADING PYTHON…';
 if(typeof loadPyodide!=='function')await loadScript(PY);
 py=await loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.28.2/full/'});
 q('#aaRuntime').textContent='LOADING NUMPY / SCIPY / SCIKIT-IMAGE…';
 await py.loadPackage(['numpy','scipy','scikit-image','micropip']);
 q('#aaRuntime').textContent='INSTALLING ASTROALIGN (NO SEP)…';
 await py.runPythonAsync("import micropip\nawait micropip.install('astroalign==2.6.2', deps=False)\nimport astroalign, numpy as np\n");
 q('#aaRuntime').textContent='RUNNING SYNTHETIC SELF-TEST…';
 const check=await py.runPythonAsync(`
import json, math, numpy as np, astroalign as aa
S=np.array([[20.,30.],[110.,45.],[72.,160.],[210.,90.],[185.,205.],[310.,140.],[260.,300.],[410.,250.]])
ang=math.radians(31.0); scale=1.37; c=math.cos(ang); s=math.sin(ang)
R=np.array([[c,-s],[s,c]])
T=(S@R.T)*scale + np.array([37.,-22.])
try:
 tr,(sp,tp)=aa.find_transform(S,T,max_control_points=50)
 ok=(abs(float(tr.scale)-scale)<1e-3 and abs(float(tr.rotation)-ang)<1e-3 and len(sp)>=4)
 out={'ok':bool(ok),'scale':float(tr.scale),'rotation_deg':float(np.degrees(tr.rotation)),'matches':int(len(sp))}
except Exception as e: out={'ok':False,'error':type(e).__name__+': '+str(e)}
json.dumps(out)
`);
 const C=JSON.parse(String(check));if(!C.ok)throw Error('ASTROALIGN SYNTHETIC SELF-TEST FAILED · '+JSON.stringify(C));
 q('#aaRuntime').textContent='READY ✓ · ASTROALIGN 2.6.2 · NO SEP';
 q('#aaRuntime').className='good';q('#aaPyTest').textContent='PASS ✓ · '+C.matches+' matches · '+C.rotation_deg.toFixed(2)+'°';q('#aaPyTest').className='good';
 return py
 })().catch(e=>{ready=null;q('#aaRuntime').textContent='LOAD FAILED · '+String(e?.message||e);q('#aaRuntime').className='bad';q('#aaPyTest').textContent='FAIL';q('#aaPyTest').className='bad';throw e});return ready}
function brightestCentroids(d,max=18,minSep=.055){const m=features(d),all=detectStars(d,m)||[];const ranked=[...all].filter(p=>Number.isFinite(+p.x)&&Number.isFinite(+p.y)).sort((a,b)=>(+b.b||0)-(+a.b||0));const out=[];for(const p of ranked){if(out.length>=max)break;if(out.every(z=>Math.hypot(p.x-z.x,p.y-z.y)>=minSep))out.push(p)}for(const p of ranked){if(out.length>=max)break;if(!out.includes(p))out.push(p)}return{all,selected:out}}
function draw(sel,pts,color,prefix='B'){const c=q(sel),r=c.parentElement.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=Math.max(1,Math.round(r.width*dpr));c.height=Math.max(1,Math.round(r.height*dpr));c.style.width=r.width+'px';c.style.height=r.height+'px';const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,r.width,r.height);g.strokeStyle=color;g.fillStyle=color;g.lineWidth=3;g.font='bold 12px monospace';pts.forEach((p,i)=>{const x=p[0]/512*r.width,y=p[1]/512*r.height;g.beginPath();g.arc(x,y,13,0,Math.PI*2);g.stroke();g.fillText(prefix+(i+1),x+15,y-8)})}
const pxPoints=(P,w,h)=>P.map(p=>[p.x*w,p.y*h]);
async function aaRun(){hardFeedback();const b=q('#aaRun');if(aaBusy){aaStatus('ASTROALIGN ALREADY RUNNING','warn');return}aaBusy=true;try{
 b.textContent='ASTROALIGN RUNNING…';
 if(typeof record==='undefined'||!record)throw Error('NO RECORD LOADED — press LOAD RECORD first');
 if(typeof aladin==='undefined'||!aladin)throw Error('ALADIN NOT READY');
 const source=q('#source');if(!source||!source.complete||!source.naturalWidth)throw Error('CATALOG IMAGE NOT READY');
 await runtime();clearAnchorOverlays();aaStatus('ASTROALIGN · CAPTURING CURRENT FRAMES','warn');
 const s=imageDataFromImage(source),u=await captureAladin(),t=await imageDataFromUrl(u),SB=brightestCentroids(s,18,.055),TB=brightestCentroids(t,30,.035),spx=pxPoints(SB.selected,s.width,s.height),tpx=pxPoints(TB.selected,t.width,t.height);
 q('#aaSourceBright').textContent=SB.selected.length+' / '+SB.all.length;q('#aaTargetBright').textContent=TB.selected.length+' / '+TB.all.length;
 draw('#sourceAnchors',spx,'#ffd166','S');draw('#aladinAnchors',tpx,'#ffd166','T');
 if(SB.selected.length<3||TB.selected.length<3)throw Error('FEWER THAN 3 BRIGHT CENTROIDS');
 py.globals.set('src_pts',spx);py.globals.set('tgt_pts',tpx);aaStatus('ASTROALIGN · MATCHING BRIGHTEST ASTERISMS','warn');
 const raw=await py.runPythonAsync(`
import json, numpy as np, astroalign as aa
S=np.asarray(src_pts.to_py(),dtype=float)
T=np.asarray(tgt_pts.to_py(),dtype=float)
try:
 tr,(sp,tp)=aa.find_transform(S,T,max_control_points=50)
 sp=np.asarray(sp,float); tp=np.asarray(tp,float); pred=np.asarray(tr(sp),float)
 rr=np.sqrt(np.sum((pred-tp)**2,axis=1)) if len(sp) else np.array([])
 out={'ok':True,'scale':float(tr.scale),'rotation_deg':float(np.degrees(tr.rotation)),'matched':int(len(sp)),'rms_px':float(np.sqrt(np.mean(rr**2))) if len(rr) else None,'source_points':sp.tolist(),'target_points':tp.tolist()}
except Exception as e: out={'ok':False,'error':type(e).__name__+': '+str(e)}
json.dumps(out)
`);
 const R=JSON.parse(String(raw));if(!R.ok)throw Error(R.error);
 draw('#sourceAnchors',R.source_points,'#5ee7ff','A');draw('#aladinAnchors',R.target_points,'#65e7a4','A');
 const rot=((R.rotation_deg%360)+360)%360,pass=R.matched>=4&&Number.isFinite(R.rms_px)&&R.rms_px<=6&&R.scale>.08&&R.scale<12.5;
 q('#aaMatches').textContent=R.matched+' stars';q('#aaRot').textContent=rot.toFixed(3)+'°';q('#aaScale').textContent=R.scale.toFixed(6);q('#aaResidual').textContent=R.rms_px.toFixed(3)+' px RMS';
 aaStatus((pass?'ASTROALIGN PASS':'ASTROALIGN REVIEW')+' · '+R.matched+' MATCHES · ROT '+rot.toFixed(2)+'° · SCALE '+R.scale.toFixed(4)+' · RMS '+R.rms_px.toFixed(2)+' px',pass?'good':'warn')
 }catch(e){aaStatus('ASTROALIGN NO SOLUTION · '+String(e?.message||e),'bad')}finally{aaBusy=false;b.disabled=false;b.textContent='RUN ASTROALIGN';b.style.background='#14532d';b.style.boxShadow='none'}}
function install(){const orient=q('#orient');if(!orient)return;document.title='Galaxy Viewer Astroalign Sandbox 0003';const old=q('#aaRun');if(old)old.remove();window.GV_AA_RUN=aaRun;const b=document.createElement('button');b.id='aaRun';b.type='button';b.textContent='RUN ASTROALIGN';b.disabled=false;b.style.cssText='position:relative;z-index:9999;pointer-events:auto;touch-action:manipulation;background:#14532d;color:#fff;font-weight:900;border:3px solid #65e7a4;min-width:170px;min-height:42px';b.onclick=function(ev){ev.preventDefault();ev.stopPropagation();hardFeedback();setTimeout(()=>window.GV_AA_RUN(),0)};orient.insertAdjacentElement('afterend',b);
 const p=document.createElement('section');p.id='aaPanel';p.className='panel';p.innerHTML='<strong>ASTROALIGN 2.6.2 — PYODIDE NO-SEP TEST 0003</strong><div class="readouts" style="margin-top:7px"><div class="readout">BUTTON SELF-TEST<b id="aaSelf">PENDING</b></div><div class="readout">PYTHON SELF-TEST<b id="aaPyTest">NOT RUN</b></div><div class="readout">RUNTIME<b id="aaRuntime">NOT LOADED</b></div><div class="readout">SOURCE BRIGHT<b id="aaSourceBright">—</b></div><div class="readout">ALADIN BRIGHT<b id="aaTargetBright">—</b></div><div class="readout">MATCHED STARS<b id="aaMatches">—</b></div><div class="readout">ROTATION<b id="aaRot">—</b></div><div class="readout">SCALE<b id="aaScale">—</b></div><div class="readout">RESIDUAL<b id="aaResidual">—</b></div></div><div class="hint">Astroalign is installed with deps=False because SEP is not needed when explicit centroid coordinates are supplied. Yellow circles are the brightest centroids actually submitted.</div>';
 const anchor=q('.statusrow')||orient.parentElement;anchor.insertAdjacentElement('afterend',p);setTimeout(()=>{const ok=typeof window.GV_AA_RUN==='function'&&!!q('#aaRun')&&typeof q('#aaRun').onclick==='function';q('#aaSelf').textContent=ok?'PASS ✓':'FAIL';q('#aaSelf').className=ok?'good':'bad';b.style.outline=ok?'2px solid #65e7a4':'3px solid #ff7b7b'},100)}
install();
};
const PATCH='<script>('+engine.toString()+')();<'+'/script>';const r=await fetch(BASE,{cache:'no-store'});if(!r.ok)throw Error('baseline HTTP '+r.status);let html=await r.text();html=html.replace('</body>',PATCH+'\n</body>');document.open();document.write(html);document.close();
})().catch(e=>{document.getElementById('gv-bootstrap').textContent='BOOTSTRAP FAILED — '+String(e?.message||e)});
</script></body></html>
