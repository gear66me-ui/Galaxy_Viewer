<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Galaxy Viewer Ground Truth Sandbox 0007</title></head><body><div id="gv-bootstrap" style="font:14px system-ui;padding:20px;background:#05080d;color:#eef5ff;min-height:100vh">Loading Ground Truth Sandbox 0007…</div><script>
'use strict';
(async()=>{
const BASE='https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/fcf413428accb443b7d29ddb880493252bf98729/viewer/image-databases/master-database/orientation-review/gv-astrometry-sandbox-0010.html';
const engine=function(){
const q=s=>document.querySelector(s);let srcPts=[],aliPts=[],aliFrame=null,startState=null,last=null;const STORE='gv-ground-truth-catalog-0007';
function norm360(v){return((+v%360)+360)%360}function norm180(v){v=norm360(v);return v>180?v-360:v}
function stat(t,k='warn'){const a=q('#actionStatus');if(a){a.textContent=t;a.className='action '+k}const s=q('#status');if(s){s.textContent=t;s.className=k}}
function live(){try{const s=readLiveState?.();if(s)return s}catch{}let f=NaN,r=0;try{const z=aladin.getFov?.()||aladin.getFoV?.();f=Array.isArray(z)?Math.max(...z.map(Number).filter(Number.isFinite)):+z}catch{}try{r=+aladin.getRotation?.()||0}catch{}return{fov:f,rot:r}}
function imgGray(d){const a=new Float32Array(d.width*d.height),p=d.data;for(let i=0,j=0;i<p.length;i+=4,j++)a[j]=.2126*p[i]+.7152*p[i+1]+.0722*p[i+2];return a}
function snap(d,x,y,r=11){const w=d.width,h=d.height,L=imgGray(d),x0=Math.max(1,Math.round(x-r)),x1=Math.min(w-2,Math.round(x+r)),y0=Math.max(1,Math.round(y-r)),y1=Math.min(h-2,Math.round(y+r));let mx=x,my=y,mv=-1;for(let yy=y0;yy<=y1;yy++)for(let xx=x0;xx<=x1;xx++){const z=L[yy*w+xx];if(z>mv){mv=z;mx=xx;my=yy}}let sw=0,sx=0,sy=0;const bg=[];for(let yy=Math.max(1,my-8);yy<=Math.min(h-2,my+8);yy++)for(let xx=Math.max(1,mx-8);xx<=Math.min(w-2,mx+8);xx++){if(Math.hypot(xx-mx,yy-my)>5)bg.push(L[yy*w+xx])}bg.sort((a,b)=>a-b);const base=bg.length?bg[Math.floor(bg.length*.5)]:0;for(let yy=Math.max(1,my-5);yy<=Math.min(h-2,my+5);yy++)for(let xx=Math.max(1,mx-5);xx<=Math.min(w-2,mx+5);xx++){const rr=Math.hypot(xx-mx,yy-my);if(rr>5)continue;const wt=Math.max(0,L[yy*w+xx]-base);sw+=wt;sx+=wt*xx;sy+=wt*yy}return{x:sw>0?sx/sw:mx,y:sw>0?sy/sw:my,peak:mv,bg:base}}
function mapClick(ev,el){const r=el.getBoundingClientRect();return{x:(ev.clientX-r.left)/r.width*512,y:(ev.clientY-r.top)/r.height*512}}
function overlay(sel){const c=q(sel),r=c.parentElement.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=Math.max(1,Math.round(r.width*dpr));c.height=Math.max(1,Math.round(r.height*dpr));c.style.width=r.width+'px';c.style.height=r.height+'px';const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,r.width,r.height);return{g,w:r.width,h:r.height,c}}
function draw(){const labels=['A','B','C'];for(const [sel,P,color] of [['#sourceAnchors',srcPts,'#5ee7ff'],['#aladinAnchors',aliPts,'#65e7a4']]){const o=overlay(sel),g=o.g;g.strokeStyle=color;g.fillStyle=color;g.lineWidth=4;g.font='bold 16px monospace';P.forEach((p,i)=>{const x=p.x/512*o.w,y=p.y/512*o.h;g.beginPath();g.arc(x,y,15,0,Math.PI*2);g.stroke();g.fillText(labels[i],x+18,y-10)})}}
function solve3(S,T){const cs={x:(S[0].x+S[1].x+S[2].x)/3,y:(S[0].y+S[1].y+S[2].y)/3},ct={x:(T[0].x+T[1].x+T[2].x)/3,y:(T[0].y+T[1].y+T[2].y)/3};let den=0,dot=0,cross=0;for(let i=0;i<3;i++){const x=S[i].x-cs.x,y=S[i].y-cs.y,u=T[i].x-ct.x,v=T[i].y-ct.y;den+=x*x+y*y;dot+=x*u+y*v;cross+=x*v-y*u}if(den<1e-6)throw Error('SOURCE POINTS ARE DEGENERATE');const a=dot/den,b=cross/den,scale=Math.hypot(a,b),rot=Math.atan2(b,a),tx=ct.x-(a*cs.x-b*cs.y),ty=ct.y-(b*cs.x+a*cs.y),pred=S.map(p=>({x:a*p.x-b*p.y+tx,y:b*p.x+a*p.y+ty})),res=pred.map((p,i)=>Math.hypot(p.x-T[i].x,p.y-T[i].y)),rms=Math.sqrt(res.reduce((z,v)=>z+v*v,0)/3);return{a,b,scale,rot,tx,ty,pred,res,rms}}
function setBanner(title,body,k='warn'){const e=q('#gtBanner');e.className='panel '+k;e.style.cssText='border:3px solid '+(k==='good'?'#65e7a4':k==='bad'?'#ff7b7b':'#ffd166')+';text-align:center;padding:16px;margin-bottom:10px';e.innerHTML='<div style="font:900 21px system-ui">'+title+'</div><div style="font:800 17px ui-monospace,monospace;margin-top:7px">'+body+'</div>'}
async function prepare(){if(typeof record==='undefined'||!record)throw Error('LOAD A RECORD FIRST');if(typeof aladin==='undefined'||!aladin)throw Error('ALADIN NOT READY');srcPts=[];aliPts=[];last=null;startState=live();clearAnchorOverlays?.();const source=q('#source');if(!source?.naturalWidth)throw Error('CATALOG IMAGE NOT READY');aliFrame=await imageDataFromUrl(await captureAladin());q('#sourceAnchors').style.pointerEvents='auto';q('#aladinAnchors').style.pointerEvents='auto';q('#sourceAnchors').style.cursor='crosshair';q('#aladinAnchors').style.cursor='crosshair';q('#gtSrc').textContent='0 / 3';q('#gtAli').textContent='0 / 3';q('#gtSolve').disabled=true;q('#gtSend').disabled=true;setBanner('GROUND TRUTH MODE','Tap A, B, C on CATALOG, then the SAME A, B, C on ALADIN','warn');stat('GROUND TRUTH READY · SELECT 3 SOURCE STARS','good')}
async function srcClick(ev){if(srcPts.length>=3)return;const d=imageDataFromImage(q('#source')),m=mapClick(ev,q('#sourceAnchors')),p=snap(d,m.x,m.y);srcPts.push(p);draw();q('#gtSrc').textContent=srcPts.length+' / 3';stat(srcPts.length<3?'SOURCE '+['A','B','C'][srcPts.length-1]+' LOCKED · SELECT NEXT':'SOURCE A/B/C LOCKED · NOW SELECT SAME A/B/C ON ALADIN','good')}
async function aliClick(ev){if(srcPts.length<3||aliPts.length>=3)return;if(!aliFrame)aliFrame=await imageDataFromUrl(await captureAladin());const m=mapClick(ev,q('#aladinAnchors')),p=snap(aliFrame,m.x,m.y);aliPts.push(p);draw();q('#gtAli').textContent=aliPts.length+' / 3';if(aliPts.length===3){q('#gtSolve').disabled=false;stat('A/B/C CORRESPONDENCE COMPLETE · PRESS SOLVE & APPLY','good')}else stat('ALADIN '+['A','B','C'][aliPts.length-1]+' LOCKED · SELECT NEXT','good')}
async function solveApply(){if(srcPts.length!==3||aliPts.length!==3)throw Error('NEED 3 + 3 POINTS');const tr=solve3(srcPts,aliPts),raw=norm180(tr.rot*180/Math.PI),startRot=norm180(+startState.rot||0),requestedRotation=norm180(startRot-raw),startFov=+startState.fov,requestedFov=Number.isFinite(startFov)?startFov*tr.scale:NaN;setBanner('SOLVER FOUND ROTATION '+requestedRotation.toFixed(3)+'°','FOV '+(Number.isFinite(requestedFov)?requestedFov.toFixed(6):'—')+'° · RMS '+tr.rms.toFixed(2)+' px','good');q('#gtRaw').textContent=raw.toFixed(3)+'°';q('#gtReqRot').textContent=requestedRotation.toFixed(3)+'°';q('#gtReqFov').textContent=Number.isFinite(requestedFov)?requestedFov.toFixed(6)+'°':'—';q('#gtRms').textContent=tr.rms.toFixed(3)+' px';stat('COMMANDING ALADIN → ROT '+requestedRotation.toFixed(3)+'°','good');if(Number.isFinite(requestedFov)){aladin.setFoV?.(requestedFov);aladin.setFov?.(requestedFov)}aladin.setRotation?.(requestedRotation);await new Promise(r=>setTimeout(r,1000));updateLive?.();const a=live(),ar=norm180(+a.rot||0),af=+a.fov;q('#gtActualRot').textContent=ar.toFixed(3)+'°';q('#gtActualFov').textContent=Number.isFinite(af)?af.toFixed(6)+'°':'—';const rotOk=Math.abs(norm180(ar-requestedRotation))<=.25,fovOk=!Number.isFinite(requestedFov)||Math.abs(af-requestedFov)<=Math.max(1e-6,requestedFov*.01),pass=tr.rms<=4&&rotOk&&fovOk;last={pass,requestedRotation,requestedFov,actualRotation:ar,actualFov:af,rms:tr.rms,rawScreenRotation:raw,sourcePoints:srcPts,targetPoints:aliPts};q('#gtSend').disabled=!pass;setBanner(pass?'ALADIN ORIENTED ✓':'ALADIN COMMAND APPLIED · REVIEW','FOUND '+requestedRotation.toFixed(3)+'° → READBACK '+ar.toFixed(3)+'° · FOV '+(Number.isFinite(af)?af.toFixed(6):'—')+'°',pass?'good':'warn');stat((pass?'GROUND TRUTH PASS':'GROUND TRUTH REVIEW')+' · ROT '+ar.toFixed(3)+'° · FOV '+(Number.isFinite(af)?af.toFixed(6):'—')+'°',pass?'good':'warn');if(typeof log==='function')log('GROUND TRUTH 0007 RESULT',last)}
function rows(){try{const a=JSON.parse(localStorage.getItem(STORE)||'[]');return Array.isArray(a)?a:[]}catch{return[]}}function send(){if(!last?.pass)throw Error('NO PASSING GROUND TRUTH SOLUTION');const a=rows(),key=record?.archiveId||record?.id||record?.name||('record-'+recordIndex),row={key,mission:q('#mission')?.value||null,recordIndex:Number(recordIndex)||0,archiveId:record?.archiveId||record?.id||null,name:record?.name||record?.title||null,ra:+record?.ra,dec:+record?.dec,fieldOfViewDeg:last.actualFov,orientationDeg:last.actualRotation,method:'manual-3-star-ground-truth',version:'0007',rmsPx:last.rms,rawScreenRotationDeg:last.rawScreenRotation,sourcePoints:last.sourcePoints,targetPoints:last.targetPoints,timestamp:new Date().toISOString()};const i=a.findIndex(r=>r.key===key&&r.mission===row.mission);if(i>=0)a[i]=row;else a.push(row);localStorage.setItem(STORE,JSON.stringify(a));q('#gtCount').textContent=a.length+' records';const blob=new Blob([JSON.stringify({schema:'gv-ground-truth-catalog-0007',created:new Date().toISOString(),records:a},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),x=document.createElement('a');x.href=u;x.download='gv-ground-truth-curated-0007.json';document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),800);stat('GROUND TRUTH SENT TO JSON ✓ · '+a.length+' RECORDS','good')}
function install(){const orient=q('#orient');if(!orient)return;document.title='Galaxy Viewer Ground Truth Sandbox 0007';const h=document.querySelector('main section.panel strong');if(h)h.textContent='GALAXY VIEWER GROUND TRUTH SANDBOX 0007';const b=document.createElement('button');b.id='gtStart';b.type='button';b.textContent='START 3-STAR GROUND TRUTH';b.style.cssText='background:#5b21b6;color:white;font-weight:900;border:3px solid #c4b5fd;min-height:42px';b.onclick=()=>prepare().catch(e=>stat('GROUND TRUTH ERROR · '+String(e.message||e),'bad'));orient.insertAdjacentElement('afterend',b);const p=document.createElement('section');p.id='gtBanner';p.className='panel';orient.parentElement.parentElement.insertAdjacentElement('afterend',p);const c=document.createElement('section');c.className='panel';c.innerHTML='<strong>3-STAR GROUND TRUTH CALIBRATION — 0007</strong><div class="readouts" style="margin-top:7px"><div class="readout">SOURCE PICKS<b id="gtSrc">0 / 3</b></div><div class="readout">ALADIN PICKS<b id="gtAli">0 / 3</b></div><div class="readout">RAW SCREEN ROT<b id="gtRaw">—</b></div><div class="readout">SOLVER ROTATION<b id="gtReqRot">—</b></div><div class="readout">SOLVER FOV<b id="gtReqFov">—</b></div><div class="readout">FIT RMS<b id="gtRms">—</b></div><div class="readout">ALADIN READBACK ROT<b id="gtActualRot">—</b></div><div class="readout">ALADIN READBACK FOV<b id="gtActualFov">—</b></div><div class="readout">CATALOG<b id="gtCount">0 records</b></div></div><div class="controls" style="margin-top:8px"><button id="gtSolve" disabled style="background:#14532d;font-weight:900">SOLVE & APPLY TO ALADIN</button><button id="gtReset">RESET PICKS</button><button id="gtSend" disabled>SEND TO JSON CATALOG</button></div><div class="hint" style="margin-top:8px">Tap near a star; the marker snaps to the local light centroid. A/B/C on the catalog must be the SAME A/B/C on Aladin. This module makes no automatic correspondence guesses.</div>';p.insertAdjacentElement('afterend',c);q('#gtSolve').onclick=()=>solveApply().catch(e=>stat('GROUND TRUTH ERROR · '+String(e.message||e),'bad'));q('#gtReset').onclick=()=>prepare().catch(e=>stat('GROUND TRUTH ERROR · '+String(e.message||e),'bad'));q('#gtSend').onclick=()=>{try{send()}catch(e){stat('GROUND TRUTH ERROR · '+String(e.message||e),'bad')}};q('#sourceAnchors').addEventListener('click',srcClick);q('#aladinAnchors').addEventListener('click',aliClick);q('#sourceAnchors').style.touchAction='none';q('#aladinAnchors').style.touchAction='none';q('#gtCount').textContent=rows().length+' records';setBanner('GROUND TRUTH 0007','Press START 3-STAR GROUND TRUTH','warn')}
install();
};
const PATCH='<script>('+engine.toString()+')();<'+'/script>';const r=await fetch(BASE,{cache:'no-store'});if(!r.ok)throw Error('baseline HTTP '+r.status);let html=await r.text();html=html.replace('</body>',PATCH+'\n</body>');document.open();document.write(html);document.close();
})().catch(e=>{document.getElementById('gv-bootstrap').textContent='BOOTSTRAP FAILED — '+String(e?.message||e)});
</script></body></html>
