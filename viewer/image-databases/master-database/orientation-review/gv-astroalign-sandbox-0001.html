<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Galaxy Viewer Astroalign Sandbox 0001</title></head><body><div id="gv-bootstrap" style="font:14px system-ui;padding:20px;background:#05080d;color:#eef5ff;min-height:100vh">Loading Astroalign Sandbox 0001…</div><script>
'use strict';
(async()=>{
const BASE='https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/fcf413428accb443b7d29ddb880493252bf98729/viewer/image-databases/master-database/orientation-review/gv-astrometry-sandbox-0010.html';
const engine=async function(){
const ECO='ASTROALIGN-0001',PY='https://cdn.jsdelivr.net/pyodide/v0.28.2/full/pyodide.js';let py=null,ready=null;
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(Error('script load failed'));document.head.appendChild(s)})}
async function runtime(){if(ready)return ready;ready=(async()=>{action('ASTROALIGN · LOADING PYTHON','warn');if(typeof loadPyodide!=='function')await loadScript(PY);py=await loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.28.2/full/'});await py.loadPackage(['numpy','scipy','scikit-image','micropip']);action('ASTROALIGN · INSTALLING 2.6.2','warn');await py.runPythonAsync("import micropip\nawait micropip.install('astroalign==2.6.2')\nimport astroalign, numpy as np\n");$('#aaRuntime').textContent='READY · 2.6.2';log('ASTROALIGN RUNTIME READY',{eco:ECO,astroalign:'2.6.2',pyodide:'0.28.2'});return py})().catch(e=>{ready=null;$('#aaRuntime').textContent='LOAD FAILED';throw e});return ready}
function gray(im){const d=im.data,a=new Float32Array(im.width*im.height);for(let i=0,j=0;i<d.length;i+=4,j++)a[j]=.2126*d[i]+.7152*d[i+1]+.0722*d[i+2];return a}
function draw(sel,pts,color){const c=$(sel),r=c.parentElement.getBoundingClientRect();c.width=Math.round(r.width*devicePixelRatio);c.height=Math.round(r.height*devicePixelRatio);c.style.width=r.width+'px';c.style.height=r.height+'px';const g=c.getContext('2d');g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);g.clearRect(0,0,r.width,r.height);g.strokeStyle=color;g.fillStyle=color;g.lineWidth=2.5;g.font='bold 12px monospace';pts.forEach((p,i)=>{const x=p[0]/512*r.width,y=p[1]/512*r.height;g.beginPath();g.arc(x,y,12,0,Math.PI*2);g.stroke();g.fillText('A'+(i+1),x+14,y-8)})}
async function run(){if(!record||!aladin||busy)return;busy=true;const b=$('#aaRun'),old=b.textContent;try{b.disabled=true;b.textContent='ASTROALIGN RUNNING…';$('#status').textContent='ASTROALIGN';$('#status').className='warn';await runtime();clearAnchorOverlays();action('ASTROALIGN · CAPTURING CURRENT FRAMES','warn');const s=imageDataFromImage($('#source')),u=await captureAladin(),t=await imageDataFromUrl(u),sg=gray(s),tg=gray(t);py.globals.set('src_flat',sg);py.globals.set('tgt_flat',tg);py.globals.set('sw',s.width);py.globals.set('sh',s.height);py.globals.set('tw',t.width);py.globals.set('th',t.height);action('ASTROALIGN · MATCHING 3-STAR ASTERISMS','warn');const raw=await py.runPythonAsync(`
import json, numpy as np, astroalign as aa
S=np.asarray(src_flat.to_py(),dtype=np.float32).reshape((int(sh),int(sw)))
T=np.asarray(tgt_flat.to_py(),dtype=np.float32).reshape((int(th),int(tw)))
def norm(a):
 f=a[np.isfinite(a)]; lo=float(np.percentile(f,2)); hi=float(np.percentile(f,99.7)); hi=max(hi,lo+1); return np.clip((a-lo)/(hi-lo),0,1)
S=norm(S); T=norm(T)
try:
 tr,(sp,tp)=aa.find_transform(S,T,detection_sigma=5,max_control_points=50,min_area=5)
 sp=np.asarray(sp,float); tp=np.asarray(tp,float); pred=np.asarray(tr(sp),float); rr=np.sqrt(np.sum((pred-tp)**2,axis=1)) if len(sp) else np.array([])
 out={'ok':True,'scale':float(tr.scale),'rotation_deg':float(np.degrees(tr.rotation)),'translation':[float(tr.translation[0]),float(tr.translation[1])],'matched':int(len(sp)),'rms_px':float(np.sqrt(np.mean(rr**2))) if len(rr) else None,'median_px':float(np.median(rr)) if len(rr) else None,'max_px':float(np.max(rr)) if len(rr) else None,'source_points':sp.tolist(),'target_points':tp.tolist(),'matrix':np.asarray(tr.params,float).tolist()}
except Exception as e: out={'ok':False,'error':type(e).__name__+': '+str(e)}
json.dumps(out)
`);const R=JSON.parse(String(raw));if(!R.ok)throw Error(R.error);draw('#sourceAnchors',R.source_points,'#5ee7ff');draw('#aladinAnchors',R.target_points,'#65e7a4');const rot=((R.rotation_deg%360)+360)%360,pass=R.matched>=4&&Number.isFinite(R.rms_px)&&R.rms_px<=6&&R.scale>.08&&R.scale<12.5;$('#aaMatches').textContent=R.matched+' stars';$('#aaRot').textContent=rot.toFixed(3)+'°';$('#aaScale').textContent=R.scale.toFixed(6);$('#aaResidual').textContent=R.rms_px.toFixed(3)+' px RMS';$('#sBestRot').textContent=rot.toFixed(2)+'°';$('#sStar').textContent=R.matched+' Astroalign correspondences';$('#sConsensus').textContent=R.rms_px.toFixed(2)+' px RMS · '+R.median_px.toFixed(2)+' px median';$('#status').textContent=pass?'ASTROALIGN PASS':'ASTROALIGN REVIEW';$('#status').className=pass?'good':'warn';action((pass?'ASTROALIGN PASS':'ASTROALIGN REVIEW')+' · '+R.matched+' MATCHES · ROT '+rot.toFixed(2)+'° · SCALE '+R.scale.toFixed(4)+' · RMS '+R.rms_px.toFixed(2)+' px',pass?'good':'warn');log('ASTROALIGN RESULT',{eco:ECO,record:record?.name||record?.archiveId||null,visible_state:readLiveState(),result:R,acceptance:{pass,min_matches:4,max_rms_px:6,scale_range:[.08,12.5]}})}catch(e){$('#status').textContent='NO SOLUTION';$('#status').className='bad';action('ASTROALIGN NO SOLUTION · '+String(e?.message||e),'bad');log('ASTROALIGN FAILURE',{eco:ECO,message:String(e?.message||e),stack:String(e?.stack||'')},'ERROR')}finally{busy=false;b.disabled=false;b.textContent=old}}
function install(){const orient=$('#orient');if(!orient||$('#aaRun'))return;document.title='Galaxy Viewer Astroalign Sandbox 0001';const h=document.querySelector('main section.panel strong');if(h)h.textContent='GALAXY VIEWER ASTROALIGN SANDBOX 0001';const hint=document.querySelector('main section.panel .hint');if(hint)hint.textContent='Isolated Astroalign test. RUN ASTROALIGN uses real 3-point asterism matching between the catalog image and the currently visible Aladin frame. Fourier and the existing rotation solver are bypassed.';const b=document.createElement('button');b.id='aaRun';b.textContent='RUN ASTROALIGN';b.disabled=true;b.style.cssText='background:#14532d;color:#fff;font-weight:900;border:2px solid #65e7a4';b.onclick=run;orient.insertAdjacentElement('afterend',b);for(const id of ['load','prev','next'])$('#'+id)?.addEventListener('click',()=>setTimeout(()=>{b.disabled=!record},900));const p=document.createElement('section');p.className='panel';p.innerHTML='<strong>ASTROALIGN 2.6.2 — ISOLATED EVIDENCE</strong><div class="readouts" style="margin-top:7px"><div class="readout">RUNTIME<b id="aaRuntime">NOT LOADED</b></div><div class="readout">MATCHED STARS<b id="aaMatches">—</b></div><div class="readout">ROTATION<b id="aaRot">—</b></div><div class="readout">SCALE<b id="aaScale">—</b></div><div class="readout">RESIDUAL<b id="aaResidual">—</b></div><div class="readout">METHOD<b>3-POINT ASTERISMS</b></div></div><div class="hint" style="margin-top:7px">Acceptance: ≥4 correspondences, RMS ≤6 px, scale 0.08–12.5. Failure returns NO SOLUTION; there is no 180° fallback.</div>';$('.statusrow').insertAdjacentElement('afterend',p);log('ASTROALIGN 0001 READY',{eco:ECO,isolated:true,existing_solvers_modified:false})}install()};
const PATCH='<script>('+engine.toString()+')();<'+'/script>';const r=await fetch(BASE,{cache:'no-store'});if(!r.ok)throw Error('baseline HTTP '+r.status);let html=await r.text();html=html.replace('</body>',PATCH+'\n</body>');document.open();document.write(html);document.close();
})().catch(e=>{document.getElementById('gv-bootstrap').textContent='BOOTSTRAP FAILED — '+String(e?.message||e)});
</script></body></html>
