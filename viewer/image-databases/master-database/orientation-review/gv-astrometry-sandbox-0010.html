<html lang="en">
<head>
<meta charset="utf-8">

<title>Galaxy Viewer Astrometry Sandbox 0010 — ECO 012</title>
<style>html,body{margin:0;background:#05080d;color:#eef5ff;font:13px system-ui,sans-serif}.boot{padding:18px}.bad{color:#ff7b7b}</style>
</head>
<body><div id="boot" class="boot">Loading Astrometry Sandbox 0010 / ECO-012…</div>
<script>
(async()=>{
'use strict';
const BASE='https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/d2a29ebdb1de3f7ce4de9511f6f6bf05fa22038c/viewer/image-databases/master-database/orientation-review/gv-astrometry-sandbox-0010.html';
const PATCH=String.raw`
/* === ECO-20260831-ASTROMETRY-REAL-ANCHORS-012 === */
const ECO012='ECO-012',DIAG_MAX_LINES=200,DIAG_TARGET_LINES=120,PRIMARY_SURVEY='P/DSS2/color';
const MISSION_SURVEYS_012={
 Hubble:[
  ['P/DSS2/color','DSS2 color','DEFAULT optical color reference'],
  ['P/DESI-Legacy-Surveys/DR10/color','DESI Legacy DR10 color','high-resolution optical color'],
  ['P/PanSTARRS/DR1/color-z-zg-g','PanSTARRS DR1 color','optical color comparison'],
  ['P/SDSS9/color','SDSS9 color','optical color comparison'],
  ['P/GALEXGR6_7/color','GALEX GR6/7 color','ultraviolet color comparison']],
 JWST:[
  ['P/DSS2/color','DSS2 color','DEFAULT optical registration reference'],
  ['ESAVO/P/Spitzer/IRAC134-RGB-bright','Spitzer IRAC RGB','infrared color comparison'],
  ['P/allWISE/color','AllWISE color','infrared all-sky comparison'],
  ['P/2MASS/color','2MASS color','near-infrared comparison'],
  ['P/DESI-Legacy-Surveys/DR10/color','DESI Legacy DR10 color','optical structure comparison']],
 Spitzer:[
  ['P/DSS2/color','DSS2 color','DEFAULT optical registration reference'],
  ['ESAVO/P/Spitzer/IRAC134-RGB-bright','Spitzer IRAC RGB','Spitzer infrared color'],
  ['P/GLIMPSE360','GLIMPSE360','Spitzer infrared comparison'],
  ['P/allWISE/color','AllWISE color','mid-infrared comparison'],
  ['P/2MASS/color','2MASS color','near-infrared comparison']],
 Chandra:[
  ['P/DSS2/color','DSS2 color','DEFAULT optical registration reference'],
  ['cxc.harvard.edu/P/cda/hips/allsky/rgb','Chandra CXC RGB','Chandra X-ray survey'],
  ['ESDC/P/XMM/EPIC-RGB','XMM EPIC RGB','X-ray comparison'],
  ['P/DESI-Legacy-Surveys/DR10/color','DESI Legacy DR10 color','optical host reference'],
  ['P/PanSTARRS/DR1/color-z-zg-g','PanSTARRS DR1 color','optical host reference']]
};

const _legacyLog012=log;
log=function(event,data={},level='INFO'){
 const noisy=/^(ORIENT SAMPLE|IMAGE PREFETCH PASS|SURVEY AUTO SELECT)$/;
 if(noisy.test(String(event)))return null;
 const slimData=(()=>{try{
  const d=JSON.parse(JSON.stringify(data||{}));
  if(Array.isArray(d.matched_details))d.matched_details=d.matched_details.slice(0,10).map(x=>({id:x.id,source_index:x.source_index,aladin_index:x.aladin_index,residual:x.residual}));
  if(d.star){delete d.star.matched_details;delete d.star.unmatched_prominent;delete d.star.transform;}
  if(d.morphology&&typeof d.morphology==='object')d.morphology={confidence:d.morphology.confidence,axis_confidence:d.morphology.axis_confidence};
  if(Array.isArray(d.candidates)&&d.candidates.length>5)d.candidates=d.candidates.slice(0,5);
  return d;
 }catch{return{note:'diagnostic serialization failed'}}})();
 const r={line:++lineNo,timestamp:new Date().toISOString(),elapsed_ms:+(performance.now()-t0).toFixed(1),event,data:slimData,level};
 audit.push(r);while(audit.length>DIAG_MAX_LINES)audit.shift();
 $('#diag').textContent=audit.map(x=>String(x.line).padStart(4,'0')+'  '+x.event.padEnd(29)+' '+JSON.stringify(x.data)).join('\n');
 return r;
};

rankSurveys=function(){
 const mission=$('#mission').value,list=MISSION_SURVEYS_012[mission]||MISSION_SURVEYS_012.Hubble;
 return list.map((x,i)=>({priority:i+1,id:x[0],name:x[1],score:100-i*10,reason:x[2],family:mission}));
};
populateSurveyMenu=function(){
 surveyRanking=rankSurveys(record);const sel=$('#survey'),override=manualSurveyOverrides.get(surveyKey());sel.innerHTML='';
 for(const s of surveyRanking){const o=document.createElement('option');o.value=s.id;o.textContent=s.priority+' — '+s.name+(s.priority===1?'  [DEFAULT]':'');sel.appendChild(o)}
 currentSurveyId=override||PRIMARY_SURVEY;sel.value=currentSurveyId;if(!sel.value){currentSurveyId=PRIMARY_SURVEY;sel.value=PRIMARY_SURVEY}sel.disabled=false;
 log('SURVEY RANKING',{mission:$('#mission').value,current:currentSurveyId,manual_override:override||null,candidates:surveyRanking.map(s=>({priority:s.priority,id:s.id,name:s.name}))});return currentSurveyId;
};

function q012(v,a,b){return Math.max(a,Math.min(b,v))}
function stellarRank012(stars,max=24){
 const a=[...(stars||[])];if(!a.length)return[];
 const maxB=Math.max(...a.map(p=>Number(p.b)||0),1),maxC=Math.max(...a.map(p=>Number(p.compact)||0),1);
 for(const p of a){
  const bright=q012((Number(p.b)||0)/maxB,0,1),compact=q012((Number(p.compact)||0)/maxC,0,1),persist=q012((Number(p.persistenceCount)||1)/3,0,1),iso=q012((Number(p.isolation)||0)/.15,0,1);
  p.astroQuality=bright*5.0+compact*2.2+persist*1.7+iso*1.5+(p.offGalaxy?.35:0)-(p.offGalaxy?0:.25);
 }
 a.sort((x,y)=>y.astroQuality-x.astroQuality);
 const out=[];for(const p of a){if(out.length>=max)break;if(out.every(q=>Math.hypot(p.x-q.x,p.y-q.y)>=.035))out.push(p)}
 for(const p of a){if(out.length>=max)break;if(!out.includes(p))out.push(p)}
 return out;
}
function leverage012(points){let m=0;for(let i=0;i<points.length;i++)for(let j=i+1;j<points.length;j++)m=Math.max(m,Math.hypot(points[i].x-points[j].x,points[i].y-points[j].y));return m}
function mirrored012(points,axis){return points.map(p=>({...p,x:axis==='x'?1-p.x:p.x,y:axis==='y'?1-p.y:p.y}))}
function geomSummary012(g){return g?{ok:!!g.ok,inliers:g.inliers||0,residual:+Number(g.residual||1).toFixed(5),rotation_correction_deg:g.rotation_correction_deg==null?null:+Number(g.rotation_correction_deg).toFixed(2),scale_correction:g.scale_correction==null?null:+Number(g.scale_correction).toFixed(4),coverage:+Number(g.spatial_coverage||0).toFixed(2),pairs:g.pair_matches||0,triangles:g.triangle_matches||0,score:+Number(g.score||100).toFixed(2)}:null}
function trustedGeom012(g,src){return !!(g?.ok&&g.inliers>=4&&g.spatial_coverage>=.75&&g.pair_matches>=3&&g.triangle_matches>=1&&leverage012(src)>=.30&&Number.isFinite(g.scale_correction)&&g.scale_correction>.35&&g.scale_correction<2.8)}
function selectConfirmed012(details,max=10){
 const ranked=[...(details||[])].sort((a,b)=>(Number(a.residual)||1)-(Number(b.residual)||1)),out=[];
 for(const m of ranked){if(out.length>=max)break;if(out.every(q=>Math.hypot(m.source.x-q.source.x,m.source.y-q.source.y)>=.08))out.push(m)}
 for(const m of ranked){if(out.length>=max)break;if(!out.includes(m))out.push(m)}
 return out.map((m,i)=>({...m,id:'A'+String(i+1).padStart(2,'0')}));
}
function drawCandidates012(stars){
 const S=overlayContext('#sourceAnchors'),pick=stellarRank012(stars,10);for(let i=0;i<pick.length;i++){const p=pick[i],x=p.x*S.w,y=p.y*S.h;S.g.strokeStyle='#ffd166';S.g.fillStyle='#ffd166';S.g.lineWidth=2;S.g.beginPath();S.g.arc(x,y,7,0,Math.PI*2);S.g.stroke();S.g.fillText('S'+String(i+1).padStart(2,'0'),x+8,y-8)}return pick;
}
function drawConfirmed012(details){
 const S=overlayContext('#sourceAnchors');overlayContext('#aladinAnchors');const matches=selectConfirmed012(details,10);
 for(const m of matches){const x=m.source.x*S.w,y=m.source.y*S.h;S.g.strokeStyle='#5ee7ff';S.g.fillStyle='#5ee7ff';S.g.lineWidth=2.2;S.g.beginPath();S.g.arc(x,y,8,0,Math.PI*2);S.g.stroke();S.g.fillText(m.id,x+9,y-9)}
 installSkyAnchorsFromScreen(matches);return matches;
}
async function surveyFrame012(){const snap=await captureAladin(),data=await imageDataFromUrl(snap),m=features(data),stars=stellarRank012(detectStars(data,m),24);return{data,morph:m,stars}}
async function optionalGaia012(srcStars){
 const c=currentCenter()||[record.ra,record.dec],F=currentFov()||fov(record.fieldOfView)||.1,r=Math.max(.006,Math.min(2,F*.9));
 try{const raw=await queryGaia(c[0],c[1],r),pts=gaiaPlanePoints(raw,c[0],c[1],r,48);if(pts.length<4){log('GAIA OPTIONAL',{usable:pts.length,status:'INSUFFICIENT — SOLUTION RETAINED'});return{usable:pts.length,validated:false}}
  const g=starGeometry(srcStars,pts);log('GAIA OPTIONAL',{usable:pts.length,validated:g.inliers>=4,inliers:g.inliers,coverage:g.spatial_coverage,rotation_check:g.rotation_correction_deg});return{usable:pts.length,validated:g.inliers>=4,inliers:g.inliers};
 }catch(e){log('GAIA OPTIONAL',{status:'UNAVAILABLE — SOLUTION RETAINED',message:String(e?.message||e)},'WARN');return{usable:0,validated:false}}
}
async function solveConstellation012({withGaia=false}={}){
 if(!record||!aladin)throw Error('record/Aladin not loaded');
 const start=readLiveState(),sourceData=imageDataFromImage($('#source')),sourceMorph=features(sourceData),rawSource=detectStars(sourceData,sourceMorph),sourceStars=stellarRank012(rawSource,24);
 clearAnchorOverlays();drawCandidates012(sourceStars);log('SOLVER START',{engine:'two-image stellar constellation',survey:currentSurveyId,start:{ra:start.ra,dec:start.dec,fov:start.fov,rot:start.rot},source_detected:rawSource.length,source_candidates:sourceStars.length});
 if(sourceStars.length<4||leverage012(sourceStars)<.30)return{accepted:false,reasons:['SOURCE_ANCHOR_LEVERAGE_FAIL'],start};
 action('CONSTELLATION SOLVE — CAPTURING '+($('#survey').selectedOptions[0]?.textContent||currentSurveyId));
 gaiaMatchCatalog?.hide?.();const initial=await surveyFrame012();
 log('REFERENCE FRAME',{survey:currentSurveyId,reference_candidates:initial.stars.length});
 if(initial.stars.length<4)return{accepted:false,reasons:['REFERENCE_STARS_TOO_FEW'],start};
 const normal=starGeometry(sourceStars,initial.stars),mx=starGeometry(sourceStars,mirrored012(initial.stars,'x')),my=starGeometry(sourceStars,mirrored012(initial.stars,'y'));
 const mirrors=[mx,my].filter(g=>g?.ok).sort((a,b)=>a.score-b.score),mirrorBest=mirrors[0]||null;
 log('CONSTELLATION HYPOTHESES',{normal:geomSummary012(normal),mirror_best:geomSummary012(mirrorBest)});
 if(!trustedGeom012(normal,sourceStars)){return{accepted:false,reasons:['NO_TRUSTED_NORMAL_PARITY'],start,normal,mirrorBest}}
 if(mirrorBest&&mirrorBest.inliers>normal.inliers+1&&mirrorBest.score<normal.score*.85){return{accepted:false,reasons:['PARITY_AMBIGUITY_OR_MIRROR'],start,normal,mirrorBest}}
 const correction=Number(normal.rotation_correction_deg)||0,predRot=norm(Number(start.rot||0)-correction),predFov=q012(Number(start.fov||currentFov())/Number(normal.scale_correction||1),Number(start.fov)*.4,Number(start.fov)*2.5);
 log('PREDICTED TRANSFORM',{rotation_correction_deg:+correction.toFixed(2),predicted_rotation_deg:+predRot.toFixed(2),predicted_fov_deg:+predFov.toFixed(6)});
 applyState({ra:start.ra,dec:start.dec,fov:predFov,rot:predRot,survey:currentSurveyId});await sleep(700);
 const verify=await surveyFrame012(),vg=starGeometry(sourceStars,verify.stars),verified=trustedGeom012(vg,sourceStars)&&Math.abs(Number(vg.rotation_correction_deg)||999)<=8&&Number(vg.scale_correction)>.72&&Number(vg.scale_correction)<1.38;
 log('VERIFICATION CAPTURE',{verified,geometry:geomSummary012(vg)});
 if(!verified){applyState(start);await sleep(350);retainAladinState();updateLive();clearAnchorOverlays();drawCandidates012(sourceStars);return{accepted:false,reasons:['SECOND_CAPTURE_VERIFICATION_FAIL'],start,normal,verify:vg}}
 const matches=drawConfirmed012(vg.matched_details||[]);const final=readLiveState();orientBest={label:'ECO-012 survey constellation',accepted:true,ra:final.ra,dec:final.dec,fov:final.fov,rot:final.rot,anchors:{count:matches.length,ids:matches.map(m=>m.id),spatial_coverage:vg.spatial_coverage},star:geomSummary012(vg),survey:currentSurveyId};
 $('#sBestRot').textContent=Number(final.rot).toFixed(2)+'°';$('#sBestFov').textContent=Number(final.fov).toFixed(6)+'°';$('#sBestScore').textContent=Number(vg.score).toFixed(2);$('#sStar').textContent=vg.inliers+' confirmed survey stars';$('#sConsensus').textContent=vg.pair_matches+' pairs · '+vg.triangle_matches+' triangles · '+Math.round(vg.spatial_coverage*100)+'% coverage';
 let gaia=null;if(withGaia)gaia=await optionalGaia012(sourceStars);
 log('FINAL SOLUTION',{accepted:true,survey:currentSurveyId,rotation_deg:+Number(final.rot).toFixed(2),fov_deg:+Number(final.fov).toFixed(6),anchors:matches.map(m=>m.id),gaia});retainAladinState();updateLive();return{accepted:true,final,matches,gaia};
}
runOrient=async function(){if(!record||busy)return;busy=true;const btn=$('#orient'),old=btn.textContent;btn.disabled=true;btn.textContent='ORIENTING…';try{const start=readLiveState();$('#sStartRot').textContent=Number(start.rot||0).toFixed(2)+'°';$('#sBaseline').textContent='CURRENT '+currentSurveyId;action('RUNNING SURVEY CONSTELLATION SOLVER…');const out=await solveConstellation012({withGaia:false});if(out.accepted){action('ORIENT COMPLETE — VERIFIED CONSTELLATION','good');$('#status').textContent='ORIENT COMPLETE';$('#status').className='good'}else{action('NO TRUSTED SOLUTION — '+out.reasons.join(' / '),'bad');$('#status').textContent='NO TRUSTED SOLUTION';$('#status').className='bad';log('SOLVER REJECT',{reasons:out.reasons})}}finally{busy=false;btn.disabled=false;btn.textContent=old}}
runAstrometry=async function(){if(!record||busy)return;busy=true;const btn=$('#astro'),old=btn.textContent;btn.disabled=true;btn.textContent='SOLVING…';try{action('ASTROMETRY — SURVEY CONSTELLATION + OPTIONAL GAIA…');const out=await solveConstellation012({withGaia:true});if(out.accepted){action('ASTROMETRY COMPLETE — SURVEY SOLUTION VERIFIED','good');$('#status').textContent='ASTROMETRY COMPLETE';$('#status').className='good'}else{action('NO TRUSTED SOLUTION — '+out.reasons.join(' / '),'bad');$('#status').textContent='NO TRUSTED SOLUTION';$('#status').className='bad';log('ASTROMETRY REJECT',{reasons:out.reasons})}}finally{busy=false;btn.disabled=false;btn.textContent=old}}
pack=function(){const o=orientBest||null;return{sandbox:SANDBOX,eco:ECO012,record:record?{archiveId:record.archiveId,name:record.name,ra:record.ra,dec:record.dec,fieldOfView:record.fieldOfView,orientation:record.orientation}:null,index:recordIndex,live:readLiveState(),survey:{current:currentSurveyId,ranking:surveyRanking.slice(0,5).map(s=>({priority:s.priority,id:s.id,name:s.name})),manualOverride:manualSurveyOverrides.get(surveyKey())||null},solution:o?{accepted:o.accepted,ra:o.ra,dec:o.dec,fov:o.fov,rot:o.rot,survey:o.survey,anchors:o.anchors,star:o.star}:null,diagnostic_lines:audit.length,audit:audit.slice(-DIAG_MAX_LINES)}};
log('ECO-012 READY',{default_survey:PRIMARY_SURVEY,diagnostic_max_lines:DIAG_MAX_LINES,solver:'two-image constellation; Gaia optional; second-capture verification'});
/* === END ECO-012 === */
`;
try{
 const r=await fetch(BASE,{cache:'no-store'});if(!r.ok)throw Error('baseline HTTP '+r.status);let html=await r.text();
 const marker="$('#fetchCatalog').onclick=";if(!html.includes(marker))throw Error('baseline injection marker missing');
 html=html.replace(marker,PATCH+'\n'+marker).replace("anchor_eco:'011'","anchor_eco:'012'").replace("mode:'multi-anchor-orientation-plus-gaia-precision'","mode:'two-image-constellation-plus-optional-gaia'");
 document.open();document.write(html);document.close();
}catch(e){document.getElementById('boot').innerHTML='<b class="bad">ECO-012 LOAD FAILED:</b> '+String(e?.message||e)}
})();
</script></body></html>
