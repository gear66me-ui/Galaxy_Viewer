const PATCH021="/* === ECO-20260831-ASTROMETRY-VISIBLE-ROTATION-021 === */\nasync function visibleApply021(state,stage){\n applyState(state);updateLive();\n const live=visibleState017();\n action(stage+' · ROT '+Number(live.rot).toFixed(1)+'° · FOV '+Number(live.fov).toFixed(6)+'°');\n await sleep(420);updateLive();return visibleState017();\n}\nfunction visibleReferencePoints021(){\n const el=document.querySelector('#aladin'),w=Math.max(1,el?.clientWidth||512),h=Math.max(1,el?.clientHeight||512),out=[];\n for(let i=0;i<anchorReferenceMarkers013.length;i++){\n  const m=anchorReferenceMarkers013[i],p=aladin.world2pix?.(m.ra,m.dec);\n  if(Array.isArray(p)&&Number.isFinite(Number(p[0]))&&Number.isFinite(Number(p[1]))){const x=Number(p[0])/w,y=Number(p[1])/h;if(x>=-.2&&x<=1.2&&y>=-.2&&y<=1.2)out.push({x,y,b:Number(m.strength)||1,compact:1,prominent:true,reference_id:m.id,reference_index:i})}\n }\n return out;\n}\nasync function visibleSample021(srcStars,rot,F,label,start){\n await visibleApply021({ra:start.ra,dec:start.dec,fov:F,rot,survey:currentSurveyId},label);\n const refs=visibleReferencePoints021(),normal=starGeometry(srcStars,refs),mx=starGeometry(srcStars,refs.map(p=>({...p,x:1-p.x}))),my=starGeometry(srcStars,refs.map(p=>({...p,y:1-p.y}))),candidates=[{parity:'NORMAL',g:normal},{parity:'MIRROR-X',g:mx},{parity:'MIRROR-Y',g:my}].sort((a,b)=>geomRank013(b.g)-geomRank013(a.g)),best=candidates[0],matched=(best.g?.matched_details||[]).slice(0,MAX_ANCHORS_013).map(m=>anchorReferenceMarkers013[refs[m.aladin_index]?.reference_index]?.id).filter(Boolean);\n const out={label,rot,F,refs:refs.length,best,candidates,matched,rank:geomRank013(best.g)};\n log('VISIBLE SOLVER SAMPLE',{label,rotation:rot,fov:F,reference_anchors:refs.length,parity:best.parity,inliers:best.g?.inliers||0,coverage:best.g?.spatial_coverage||0,matched});\n return out;\n}\nfovSanitySweep013=async function(){\n if(!record||!aladin)throw Error('record/Aladin not loaded');\n const start=visibleState017(),F
