<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spitzer Color Review</title><style>body{margin:0;background:#070910;color:#eef2f8;font:14px system-ui}header{position:sticky;top:0;z-index:9;background:#0b0e16ee;padding:10px;border-bottom:1px solid #293244}.bar{max-width:1600px;margin:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,input,select{background:#171c28;color:#eef2f8;border:1px solid #354057;border-radius:7px;padding:8px}.nav button.active{background:#28518d}.stats{margin-left:auto;color:#aab4c3}main{max-width:1600px;margin:auto;padding:10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}.card{background:#111621;border:1px solid #293244;border-radius:10px;overflow:hidden}.img{height:205px;background:#020307;display:flex;align-items:center;justify-content:center;position:relative}.img img{width:100%;height:100%;object-fit:contain}.badge{position:absolute;top:5px;left:5px;background:#000c;padding:4px;border-radius:5px;font-size:11px}.body{padding:8px}.name{font-weight:700}.meta{font-size:11px;color:#aab4c3;margin:3px 0 6px}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}.keep.active{background:#174d32}.another.active{background:#624b16}.reject.active{background:#5c2025}.links{display:flex;gap:4px;margin-top:5px}.links a{flex:1;text-align:center;color:#bcd7ff;background:#171c28;padding:6px;border-radius:6px;text-decoration:none;font-size:11px}.noimg{color:#9aa5b5;text-align:center;padding:18px}</style></head><body><header><div class="bar"><b>Spitzer Color Review</b><input id="q" placeholder="Search"><select id="filter"><option value="all">All</option><option>AUTO_GOOD</option><option>REVIEW</option><option>NO_COLOR_CANDIDATE</option><option>LOOKUP_ERROR</option><option value="unreviewed">Unreviewed by me</option></select><button onclick="exportSel()">Export selections</button><span class="stats" id="stats"></span></div><div class="bar nav" id="nav"></div></header><main><div class="grid" id="grid"></div></main><script>let M=null,page=0;const K="gv-spitzer-color-review-selections";let S=JSON.parse(localStorage.getItem(K)||"{}");const save=()=>localStorage.setItem(K,JSON.stringify(S));function choose(id,v){S[id]=v;save();render()}function filtered(){let q=document.getElementById("q").value.toLowerCase(),f=document.getElementById("filter").value;return M.records.filter(r=>(!q||(r.name+" "+r.archiveId).toLowerCase().includes(q))&&(f==="all"||(f==="unreviewed"?!S[r.archiveId]:r.status===f)))}function render(){let d=filtered(),ps=300,pc=Math.max(1,Math.ceil(d.length/ps));if(page>=pc)page=pc-1;let nav=document.getElementById("nav");nav.innerHTML="";for(let i=0;i<pc;i++){let b=document.createElement("button");b.textContent=(i*ps+1)+"-"+Math.min((i+1)*ps,d.length);b.className=i===page?"active":"";b.onclick=()=>{page=i;render();scrollTo(0,0)};nav.appendChild(b)}let g=document.getElementById("grid");g.innerHTML="";d.slice(page*ps,page*ps+ps).forEach(r=>{let c=r.candidates[0],dec=S[r.archiveId]||"",el=document.createElement("div");el.className="card";let im=c?"<img loading="lazy" src=""+c.previewUrl+"">":"<div class="noimg">NO OFFICIAL COLOR CANDIDATE</div>";el.innerHTML="<div class="img">"+im+"<span class="badge">"+r.status+(c?" - "+c.quality.score:"")+"</span></div><div class="body"><div class="name">"+r.name+"</div><div class="meta">"+r.archiveId+"<br>"+(r.flags||[]).join(", ")+(c?"<br>"+c.source+" - "+Math.round(c.quality.previewBytes/1024)+" KB":"")+"</div><div class="actions"><button onclick="choose('"+r.archiveId+"','keep')">KEEP</button><button onclick="choose('"+r.archiveId+"','another')">FIND ANOTHER</button><button onclick="choose('"+r.archiveId+"','reject')">REJECT</button></div>"+(c?"<div class="links"><a target="_blank" href=""+c.previewUrl+"">Open preview</a><a target="_blank" href=""+c.sourcePage+"">Source / detail</a></div>":"")+"</div>";g.appendChild(el)});document.getElementById("stats").textContent="Page "+(page+1)+"/"+pc+" - "+d.length+" records"}function exportSel(){let b=new Blob([JSON.stringify({generatedAt:new Date().toISOString(),selections:S},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="spitzer-color-review-selections.json";a.click()}document.getElementById("q").oninput=()=>{page=0;render()};document.getElementById("filter").onchange=()=>{page=0;render()};fetch("manifest.json?"+Date.now()).then(r=>r.json()).then(x=>{M=x;render()});</script></body></html>
