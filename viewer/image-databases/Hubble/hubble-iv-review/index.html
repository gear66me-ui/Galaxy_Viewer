<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hubble IV — Simple Review</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#05070b;color:#f4f7fb}main{max-width:980px;margin:auto;padding:14px}h1{margin:0 0 6px;font-size:clamp(28px,6vw,44px)}.sub{color:#aebbd0;line-height:1.45;margin-bottom:16px}.candidate{border:1px solid #36445a;border-radius:16px;padding:14px;margin:16px 0;background:#0b1019}.candidate h2{margin:0 0 4px;font-size:24px}.meta{color:#aebbd0;font-size:14px;margin-bottom:10px}.image-wrap{background:#000;border-radius:12px;overflow:hidden;border:1px solid #30394a}.image-wrap img{width:100%;height:260px;object-fit:contain;display:block;background:#000}.decisions{display:grid;gap:10px;margin-top:12px}.decision{border:1px solid #344158;border-radius:12px;padding:11px;background:#111827}.decision strong{display:block;margin-bottom:8px;font-size:17px}.choices{display:flex;gap:8px}.choices label{flex:1;text-align:center;border:1px solid #52617a;border-radius:9px;padding:10px;font-weight:800;cursor:pointer;background:#162033}.choices input{margin-right:6px}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.links a{color:#8fc2ff}.output{position:sticky;bottom:0;background:rgba(5,7,11,.97);border:1px solid #44536d;border-radius:14px;padding:12px;margin-top:18px}.output button{width:100%;padding:13px;border:0;border-radius:10px;background:#dfeaff;color:#08111f;font-size:17px;font-weight:900}.output textarea{width:100%;min-height:160px;margin-top:10px;border:1px solid #344158;border-radius:10px;background:#02050a;color:#fff;padding:10px;font:14px/1.45 ui-monospace,monospace}.status{font-size:13px;color:#8fd6a4;margin-top:6px}.note{font-size:13px;color:#91a0b6;margin-top:8px}@media(max-width:600px){.image-wrap img{height:220px}}</style></head><body><main><h1>Hubble IV — Simple Review</h1><p class="sub">Look at each current Hubble image and answer three simple questions. If IMAGE GOOD = NO, that tells me to find a better replacement later. Nothing on this page changes Catalog 0019.</p><div id="list"></div><section class="output"><button id="copy" type="button">COPY REPORT</button><textarea id="report" readonly aria-label="Hubble review report"></textarea><div id="status" class="status"></div></section></main><script>
const cases=[
{name:'Abell 1689 / A1689-zD1',id:'heic0805a'},
{name:'NGC 1365',id:'opo9621a2'},
{name:'NGC 2366',id:'opo9631c'}
];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const thumb=id=>'https://cdn.esahubble.org/archives/images/screen/'+id+'.jpg';
const source=id=>'https://esahubble.org/images/'+id+'/';
function radios(id,key,label){return `<div class="decision"><strong>${label}</strong><div class="choices"><label><input type="radio" name="${id}-${key}" value="YES">YES</label><label><input type="radio" name="${id}-${key}" value="NO">NO</label></div></div>`}
function render(c){return `<section class="candidate" data-name="${esc(c.name)}" data-id="${esc(c.id)}"><h2>${esc(c.name)}</h2><div class="meta">Archive ID: <strong>${esc(c.id)}</strong></div><div class="image-wrap"><img loading="lazy" decoding="async" src="${thumb(c.id)}" alt="${esc(c.name)}"></div><div class="links"><a href="${source(c.id)}" target="_blank" rel="noopener">Official Hubble source</a></div><div class="decisions">${radios(c.id,'image','IMAGE GOOD?')}${radios(c.id,'fov','FOV GOOD?')}${radios(c.id,'orientation','ORIENTATION GOOD?')}</div><div class="note">YES = keep as-is. NO = I need to repair or replace that item later.</div></section>`}
document.querySelector('#list').innerHTML=cases.map(render).join('');
function picked(name){return document.querySelector(`input[name="${CSS.escape(name)}"]:checked`)?.value||'NOT SELECTED'}
function build(){const out=[];for(const c of cases){out.push(`GALAXY: ${c.name}`);out.push(`ARCHIVE ID: ${c.id}`);out.push(`IMAGE GOOD: ${picked(c.id+'-image')}`);out.push(`FOV GOOD: ${picked(c.id+'-fov')}`);out.push(`ORIENTATION GOOD: ${picked(c.id+'-orientation')}`);out.push('')}document.querySelector('#report').value=out.join('\n').trim();return document.querySelector('#report').value}
document.addEventListener('change',build);document.querySelector('#copy').addEventListener('click',async()=>{const text=build();try{await navigator.clipboard.writeText(text);document.querySelector('#status').textContent='Copied. Paste this report back into ChatGPT.'}catch(e){document.querySelector('#report').focus();document.querySelector('#report').select();document.querySelector('#status').textContent='Clipboard blocked — the report is selected. Use Copy.'}});build();
</script></body></html>
