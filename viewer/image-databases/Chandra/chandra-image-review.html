<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chandra Images — Mark for Replacement</title>
<style>
:root{color-scheme:dark;--bg:#05070b;--panel:#0d121c;--line:#263246;--text:#edf5ff;--muted:#9eb0c8;--accent:#6ec8ff;--selected:#8ee6a8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button{font:inherit}
header{position:sticky;top:0;z-index:10;background:#05070bf2;border-bottom:1px solid var(--line);padding:12px}.bar{max-width:1200px;margin:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.title{font-weight:800;font-size:18px}.count{color:var(--muted)}.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
button{cursor:pointer;border:1px solid #36506f;background:#11243a;color:#fff;border-radius:9px;padding:10px 13px;font-weight:800}.copy{background:#164a70;border-color:#4d98c7}.clear{background:#241820}
main{max-width:1200px;margin:auto;padding:12px}.help{color:var(--muted);padding:4px 2px 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.card{border:1px solid var(--line);background:var(--panel);border-radius:12px;overflow:hidden}.card.selected{outline:3px solid var(--selected);border-color:var(--selected)}.image{height:280px;background:#000;display:flex;align-items:center;justify-content:center}.image img{width:100%;height:100%;object-fit:contain;display:block}.foot{display:flex;align-items:center;gap:10px;padding:10px}.num{width:58px;height:50px;border-radius:10px;font-size:21px;padding:0}.card.selected .num{background:#174f2b;border-color:var(--selected);color:#e8ffed}.name{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tag{font-size:12px;color:var(--muted)}
.bottom{display:flex;justify-content:center;gap:8px;padding:20px 0 8px;flex-wrap:wrap}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#17263a;border:1px solid #55789b;padding:10px 14px;border-radius:9px;opacity:0;pointer-events:none;transition:.15s;z-index:20}.toast.show{opacity:1}
@media(max-width:600px){header{position:relative}.actions{margin-left:0;width:100%}.actions button{flex:1}.grid{grid-template-columns:1fr}.image{height:310px}}
</style>
</head>
<body>
<header><div class="bar"><div><div class="title">CHANDRA — MARK IMAGES TO CHANGE</div><div class="count" id="count">Loading 95 images…</div></div><div class="actions"><button class="copy" id="copyTop">COPY SELECTED NUMBERS</button><button class="clear" id="clearTop">CLEAR</button></div></div></header>
<main><div class="help">Tap the numbered button under any current catalog image that you want replaced. Tap it again to unmark it.</div><div class="grid" id="grid"></div><div class="bottom"><button class="copy" id="copyBottom">COPY SELECTED NUMBERS</button><button class="clear" id="clearBottom">CLEAR</button></div></main>
<div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const CATALOG='databases/gv-chandra-galaxies-full-0001.json';
const KEY='gv-chandra-change-numbers';
const selected=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'));
let entries=[];
const grid=document.getElementById('grid'),count=document.getElementById('count');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify([...selected].sort((a,b)=>a-b)))}
function update(){count.textContent=`95 catalog images • ${selected.size} marked to change`}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1400)}
function toggle(n,card){selected.has(n)?selected.delete(n):selected.add(n);card.classList.toggle('selected',selected.has(n));save();update()}
function render(){grid.innerHTML=entries.map((e,i)=>{const n=i+1,on=selected.has(n);return `<article class="card${on?' selected':''}" data-n="${n}"><div class="image"><img loading="lazy" src="${esc(e.selectedImageUrl)}" alt="${esc(e.displayName||e.name||('Image '+n))}"></div><div class="foot"><button class="num" type="button">${n}</button><div><div class="name">${esc(e.displayName||e.name||e.archiveId)}</div><div class="tag">${on?'MARKED — CHANGE':'Tap number to mark'}</div></div></div></article>`}).join('');grid.querySelectorAll('.card').forEach(card=>card.querySelector('.num').onclick=()=>{toggle(Number(card.dataset.n),card);card.querySelector('.tag').textContent=card.classList.contains('selected')?'MARKED — CHANGE':'Tap number to mark'});update()}
async function copySelected(){const nums=[...selected].sort((a,b)=>a-b);if(!nums.length)return toast('Nothing selected');const text='CHANGE: '+nums.join(', ');try{await navigator.clipboard.writeText(text)}catch{const x=document.createElement('textarea');x.value=text;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}toast(`Copied ${nums.length} numbers`)}
function clearAll(){selected.clear();save();document.querySelectorAll('.card.selected').forEach(c=>{c.classList.remove('selected');c.querySelector('.tag').textContent='Tap number to mark'});update();toast('Cleared')}
document.getElementById('copyTop').onclick=document.getElementById('copyBottom').onclick=copySelected;
document.getElementById('clearTop').onclick=document.getElementById('clearBottom').onclick=clearAll;
fetch(CATALOG,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{entries=Array.isArray(d.entries)?d.entries:[];if(entries.length!==95)throw Error(`Expected 95 records, found ${entries.length}`);render()}).catch(e=>{grid.innerHTML=`<p>Catalog load failed: ${esc(e.message)}</p>`;count.textContent='Catalog unavailable'});
})();
</script>
</body>
</html>
