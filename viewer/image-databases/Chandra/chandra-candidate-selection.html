<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chandra Candidate Selection</title><style>:root{color-scheme:dark;--bg:#05070b;--p:#0d121c;--line:#29384e;--txt:#eef6ff;--mut:#9eb0c8;--sel:#7de59a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.35 system-ui,sans-serif}header{position:sticky;top:0;z-index:5;background:#05070bf2;border-bottom:1px solid var(--line);padding:12px}.bar{max-width:1500px;margin:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.title{font-size:20px;font-weight:900}.stat{color:var(--mut)}button{border:1px solid #45658a;background:#15314e;color:#fff;border-radius:9px;padding:11px 14px;font-weight:900}.copy{margin-left:auto;background:#17537d}.grid{max-width:1500px;margin:12px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;padding:0 10px}.card{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--p)}.card.selected{outline:3px solid var(--sel);border-color:var(--sel)}.img{height:230px;background:#000;display:flex;align-items:center;justify-content:center}.img img{width:100%;height:100%;object-fit:contain}.body{padding:9px}.name{font-weight:900;font-size:16px;margin-bottom:4px}.num{color:#7dd3fc}.src{font-size:11px;color:var(--mut);word-break:break-all;margin:5px 0}.actions{display:flex;gap:6px}.actions button,.actions a{flex:1;text-align:center}.open{display:block;text-decoration:none;border:1px solid #45658a;color:#fff;border-radius:9px;padding:10px;background:#111d2c;font-weight:800}.select{width:100%}.card.selected .select{background:#18532c;border-color:var(--sel)}.note{max-width:1500px;margin:10px auto;color:var(--mut);padding:0 12px}.bottom{text-align:center;padding:20px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#17283b;border:1px solid #58799b;padding:10px 14px;border-radius:9px;opacit ://chandra.harvard.edu/photo/2024/bullet/bullet.jpg','https://chandra.harvard.edu/photo/2024/bullet/']];const selected=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'));const grid=document.getElementById('grid');function save(){localStorage.setItem(KEY,JSON.stringify([...selected]))}function stat(){document.getElementById('stat').textContent=`${selected.size} / ${data.length} selected`}function toast(s){const t=document.querySelector('.toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1400)}function render(){grid.innerHTML=data.map((x,i)=>{const on=selected.has(i);return `<article class="card${on?' selected':''}" data-i="${i}"><div class="img"><img loading="lazy" src="${x[1]}" alt="${x[0]}" onerror="this.onerror=null;this.src='${x[1].replace('.jpg','_300.jpg')}'"></div><div class="body"><div class="name"><span class="num">${String(i+1).padStart(2,'0')}</span> — ${x[0]}</div><div class="src">${x[1]}</div><div class="actions"><a class="open" href="${x[2]}" target="_blank">SOURCE</a><button class="select">${on?'✓ SELECTED':'SELECT ✓'}</button></div></div></article>`}).join('');grid.querySelectorAll('.card').forEach(c=>c.querySelector('.select').onclick=()=>{const i=+c.dataset.i;if(selected.has(i))selected.delete(i);else selected.add(i);save();render()});stat()}async function copy(){const rows=[...selected].sort((a,b)=>a-b).map(i=>`${i+1} — ${data[i][0]} — ${data[i][1]} — ${data[i][2]}`);if(!rows.length)return toast('Nothing selected');const text=`CHANDRA CANDIDATE SELECTIONS (${rows.length}/${data.length})\n`+rows.join('\n');try{await navigator.clipboard.writeText(text)}catch{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}toast(`Copied ${rows.length} selections`)}document.getElementById('copyTop').onclick=document.getElementById('copyBottom').onclick=copy;render()})();</script></body></html>
