<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Galaxy Viewer — Hubble/JWST AVM Full Image Test</title>
<link rel="stylesheet" href="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.min.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#05080d;color:#eef5ff;font-family:system-ui,Arial,sans-serif}header{position:sticky;top:0;z-index:20;background:#08101cf5;border-bottom:1px solid #33445d;padding:8px}.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}button,select{background:#142238;color:#fff;border:1px solid #496487;border-radius:7px;padding:8px 11px;font-weight:700}.title{font-weight:900}.pill{border:1px solid #496487;border-radius:999px;padding:5px 9px;font-size:12px}.ok{color:#68f0ad}.bad{color:#ff7b7b}main{padding:8px}.name{font-size:17px;font-weight:900;margin:5px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.panel{border:1px solid #33445d;background:#080d14;min-width:0}.label{background:#101b2d;padding:7px 9px;font-weight:900}.view{height:min(72vh,760px);background:#000;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.view img{width:100%;height:100%;object-fit:contain}#aladin{width:100%;height:100%}.cross{display:flex;gap:10px;align-items:center;padding:9px}.cross input{flex:1}.telemetry{padding:8px;font:12px/1.45 ui-monospace,monospace;white-space:pre-wrap;border-top:1px solid #33445d}.hint{color:#9eb2cc;font-size:12px;padding:5px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}.view{height:55vh}}
</style></head><body>
<header><div class="bar"><span class="title">GV AVM FULL-IMAGE TEST 0001</span><select id="provider"><option value="hubble">HUBBLE</option><option value="jwst">JWST</option></select><button id="prev">◀ PREVIOUS</button><button id="next">NEXT ▶</button><span class="pill" id="count">0 / 0</span><span class="pill" id="status">LOADING</span></div></header>
<main><div class="name" id="name">Loading catalog…</div><div class="hint" id="meta"></div><div class="grid">
<section class="panel"><div class="label">ORIGINAL PROVIDER IMAGE — COMPLETE</div><div class="view"><img id="original" alt="provider image"></div></section>
<section class="panel"><div class="label">DSS2 + AVM-REGISTERED PROVIDER IMAGE</div><div class="view"><div id="aladin"></div></div><div class="cross"><b>CROSSFADE</b><input id="fade" type="range" min="0" max="100" value="100"><b id="fadev">100%</b></div><div class="telemetry" id="telemetry">Waiting for AVM…</div></section>
</div></main>
<script src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js" charset="utf-8"></script>
<script>
const BASE='https://gear66me-ui.github.io/Galaxy_Viewer/';
const PATHS={hubble:'viewer/image-databases/Hubble/databases/gv-hubble-galaxies-full-0031.json',jwst:'viewer/image-databases/JWST/databases/gv-jwst-galaxies-full-0006.json'};
const $=s=>document.querySelector(s);let catalogs={},rows=[],i=0,aladin=null,token=0;
function entries(d){if(Array.isArray(d))return d;for(const k of ['entries','galaxies','records','items','data','catalog'])if(Array.isArray(d?.[k]))return d[k];return[]}
function first(r,keys){for(const k of keys){const v=r?.[k];if(v!==undefined&&v!==null&&String(v).trim())return v}return null}
function imageOf(r){return first(r,['hdUrl','hd_url','selectedImageUrl','githubImageUrl','esaPublicationJpeg','publicationJpeg','imageUrl','jpegUrl','image'])||(Array.isArray(r?.jpegCandidates)?r.jpegCandidates.find(Boolean):null)}
function nameOf(r){return first(r,['displayName','name','title','objectName','archiveId','id'])||'Unnamed image'}
function num(r,keys){const v=Number(first(r,keys));return Number.isFinite(v)?v:null}
function status(text,ok=true){$('#status').textContent=text;$('#status').className='pill '+(ok?'ok':'bad')}
async function loadCatalog(kind){if(catalogs[kind])return catalogs[kind];const res=await fetch(BASE+PATHS[kind]+'?v='+Date.now());if(!res.ok)throw Error('CATALOG HTTP '+res.status);const d=await res.json();catalogs[kind]=entries(d).filter(r=>imageOf(r));return catalogs[kind]}
function catalogTelemetry(r){const ra=num(r,['ra','raDeg','raDegrees','centerRa']);const dec=num(r,['dec','decDeg','decDegrees','centerDec']);const fov=num(r,['fovDegrees','fov','fieldOfView']);const rot=num(r,['aladinRotation','rotation','rotationDeg']);return {ra,dec,fov,rot}}
function setOverlayOpacity(v){try{aladin?.getOverlayImageLayer()?.setOpacity(v)}catch(e){}}
async function show(){const my=++token;const r=rows[i];if(!r)return;const url=String(imageOf(r));const c=catalogTelemetry(r);$('#count').textContent=`${i+1} / ${rows.length}`;$('#name').textContent=nameOf(r);$('#meta').textContent=`${$('#provider').value.toUpperCase()} · ${first(r,['archiveId','id'])||''} · ${url}`;$('#original').src=url;$('#fade').value=100;$('#fadev').textContent='100%';status('READING AVM');$('#telemetry').textContent=`CATALOG\nRA ${c.ra??'—'}  DEC ${c.dec??'—'}\nFOV ${c.fov??'—'}°  ALADIN ROTATION ${c.rot??'—'}°\n\nAVM\nReading embedded spatial metadata…`;
try{if(aladin.getOverlayImageLayer())aladin.setOverlayImageLayer(null)}catch(e){}
try{const image=A.image(url,{name:'GV AVM '+nameOf(r),successCallback:(ra,dec,fov)=>{if(my!==token)return false;const fit=Number(fov)*1.02;aladin.gotoRaDec(Number(ra),Number(dec));if(Number.isFinite(fit)&&fit>0)aladin.setFoV(fit);setTimeout(()=>setOverlayOpacity(1),50);$('#telemetry').textContent=`CATALOG\nRA ${c.ra??'—'}  DEC ${c.dec??'—'}\nFOV ${c.fov??'—'}°  ALADIN ROTATION ${c.rot??'—'}°\n\nAVM / ALADIN RESULT\nCENTER RA ${Number(ra).toFixed(8)}°\nCENTER DEC ${Number(dec).toFixed(8)}°\nIMAGE FOOTPRINT FOV ${Number(fov).toFixed(8)}°\nDISPLAY FIT FOV ${fit.toFixed(8)}°\nORIENTATION: AVM/WCS NATIVE — applied by Aladin\nPROJECTION: ${aladin.getProjectionName?.()||'SIN'}`;status('AVM REGISTERED');return true},errorCallback:e=>{if(my===token){status('NO USABLE AVM',false);$('#telemetry').textContent+=`\n\nAVM ERROR\n${String(e?.message||e||'registration failed')}`}}});aladin.setOverlayImageLayer(image);setTimeout(()=>setOverlayOpacity(1),100)}catch(e){status('AVM LOAD FAILED',false);$('#telemetry').textContent+=`\n\nERROR\n${e.message}`}}
async function choose(kind){status('LOADING CATALOG');rows=await loadCatalog(kind);i=0;await show()}
$('#fade').addEventListener('input',e=>{const v=Number(e.target.value);$('#fadev').textContent=v+'%';setOverlayOpacity(v/100)});$('#prev').onclick=()=>{if(rows.length){i=(i-1+rows.length)%rows.length;show()}};$('#next').onclick=()=>{if(rows.length){i=(i+1)%rows.length;show()}};$('#provider').onchange=e=>choose(e.target.value).catch(e=>status(e.message,false));
A.init.then(async()=>{aladin=A.aladin('#aladin',{survey:'P/DSS2/color',projection:'SIN',cooFrame:'ICRSd',fov:1,showReticle:true,showZoomControl:true,showFullscreenControl:true,showLayersControl:true});await choose('hubble')}).catch(e=>status('ALADIN INIT: '+e.message,false));
</script></body></html>
