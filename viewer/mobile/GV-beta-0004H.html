<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Galaxy Viewer Mobile Test — GV-beta-0004H</title>
<link rel="stylesheet" href="https://aladin.cds.unistra.fr/AladinLite/api/v3/3.8.2/aladin.min.css">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#aladin-mobile{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;--text-blue:#62D8FF;--copy-blue:#7DF4FF;--active-blue:#45E7FF}
#gv-fullscreen{position:fixed;z-index:2147483647;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));padding:10px 13px;border:1px solid #45E7FF;border-radius:7px;background:rgba(0,0,0,.84);color:#7DF4FF;font:700 13px/1 system-ui,sans-serif;box-shadow:0 0 9px rgba(69,231,255,.5);touch-action:manipulation}
#gv-helper{position:fixed;z-index:9000;left:8px;top:82px;display:flex;align-items:center;gap:5px;pointer-events:none}
#gv-arrow{color:#7DF4FF;font:700 22px/1 monospace;text-shadow:0 0 6px rgba(125,244,255,.7)}
#gv-box{min-width:170px;height:34px;display:flex;align-items:center;justify-content:center;padding:0 10px;box-sizing:border-box;border:1px solid #fff;border-radius:6px;background:rgba(0,0,0,.5);color:#7DF4FF;font:600 12px/1.2 "Roboto Mono",monospace;text-align:center}
#gv-helper.active #gv-box{height:72px;flex-direction:column;color:#FFD166}
#gv-helper.active .cycle{color:var(--active-blue)}
#gv-target{position:fixed;z-index:9001;left:132px;top:43px;width:36px;height:36px;padding:0;border:1px solid #fff;border-radius:4px;background:rgba(0,0,0,.78);color:#7DF4FF;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
#gv-target svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#gv-target.active{color:var(--active-blue)}
#gv-size{position:fixed;z-index:8999;left:8px;bottom:max(8px,env(safe-area-inset-bottom));padding:4px 7px;border-radius:4px;background:rgba(0,0,0,.7);color:#BCEEFF;font:600 11px/1 monospace;pointer-events:none}
</style>
<script src="https://aladin.cds.unistra.fr/AladinLite/api/v3/3.8.2/aladin.js" charset="utf-8"></script>
</head>
<body>
<div id="aladin-mobile"></div>
<button id="gv-target" type="button" aria-label="SIMBAD pointer"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="8.5"></circle><circle cx="16" cy="16" r="2.2"></circle><path d="M16 2.5V8M16 24V29.5M2.5 16H8M24 16H29.5"></path></svg></button>
<div id="gv-helper"><div id="gv-arrow">◀</div><div id="gv-box">Tap Target to Find Info</div></div>
<div id="gv-size"></div>
<button id="gv-fullscreen" type="button">Full screen</button>
<script>
A.init.then(()=>{
 const aladin=A.aladin('#aladin-mobile',{target:'M 31',survey:'P/DSS2/color',fov:1.5,cooFrame:'ICRSd',projection:'TAN',reticleColor:'#62D8FF',reticleSize:22,showReticle:true,showZoomControl:true,showFullscreenControl:true,showLayersControl:true,showGotoControl:true,showCooGridControl:true,showSimbadPointerControl:false,showProjectionControl:true});
 window.aladin_mobile_test=aladin;
 const root=document.getElementById('aladin-mobile');
 const target=document.getElementById('gv-target');
 const helper=document.getElementById('gv-helper');
 const box=document.getElementById('gv-box');
 const colors=['#45E7FF','#4F9DFF','#7575FF'];let active=false,index=0,timer=null;
 function render(){target.classList.toggle('active',active);helper.classList.toggle('active',active);if(active){box.innerHTML='<span>✨ Tap Galaxy / Star</span><span style="color:#45E7FF">🔒 Pan Disabled</span><span class="cycle">or Tap Target Again</span><span class="cycle">to Exit</span>'}else box.textContent='Tap Target to Find Info'}
 function startCycle(){index=0;root.style.setProperty('--active-blue',colors[0]);timer=setInterval(()=>{index=(index+1)%colors.length;root.style.setProperty('--active-blue',colors[index])},500)}
 function stopCycle(){if(timer){clearInterval(timer);timer=null}root.style.setProperty('--active-blue',colors[0])}
 target.addEventListener('click',()=>{active=!active;if(active){aladin.useSimbadPointer?.(true);startCycle()}else{aladin.useSimbadPointer?.(false);stopCycle()}render()});
 render();
});
const size=document.getElementById('gv-size');
function showSize(){size.textContent=window.innerWidth+' × '+window.innerHeight+' px'}showSize();addEventListener('resize',showSize);
const full=document.getElementById('gv-fullscreen');
full.addEventListener('click',async()=>{try{await document.documentElement.requestFullscreen?.()}catch(e){console.warn(e)}});
document.addEventListener('fullscreenchange',()=>{full.style.display=document.fullscreenElement?'none':'block'});
</script>
</body>
</html>
