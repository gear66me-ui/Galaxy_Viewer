<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>@font-face{font-family:GV;src:url("../../artwork/Fonts/Space Age Regular GV-9/Space Age GV-9A.otf")}*{box-sizing:border-box}html,body{margin:0;background:#000;overflow:hidden}body{padding:0 0 5px}.r{display:grid;grid-template-columns:31px 1fr 31px;gap:2px;height:31px}.t{border:1px solid #43cfff;border-radius:10px;background:linear-gradient(180deg,#174e86,#082c59 18%,#041b3e 58%,#0d5a98);box-shadow:inset 0 2px 2px #dff8ffcc,inset 0 -2px 2px #dff8ffcc,0 -2px 6px #dff8ff77,0 2px 6px #dff8ff77,0 0 8px #32beff99;color:#f4fdff;display:flex;align-items:center;justify-content:center;overflow:hidden}.b{position:relative;font-size:0;transition:background .08s,box-shadow .08s}.b.gvflash,.label.gvflash{border-color:#78FFAB!important;background:linear-gradient(145deg,#062B1D 0%,#08783F 42%,#13B968 76%,#38E69A 100%)!important;box-shadow:inset 0 0 8px rgba(120,255,171,.28),0 0 5px #78FFAB,0 0 14px rgba(56,230,154,.92)!important}.b.gvflash:before{border-color:#78FFAB;filter:drop-shadow(0 0 4px #78FFAB) drop-shadow(0 0 8px #38E69A)}.label.gvflash{color:#DFFFF0;text-shadow:0 0 5px rgba(120,255,171,.95),0 0 11px rgba(56,230,154,.78)}.b:before{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;border:solid #F4FDFF;border-width:0 4px 4px 0;filter:drop-shadow(0 0 4px #8DDAFF) drop-shadow(0 0 8px #58BFFF);transform:translate(-50%,-50%) rotate(135deg);box-sizing:border-box}.label{font:14px GV;letter-spacing:.3px;text-shadow:0 0 6px #fff,0 0 11px #58bfff}.icon img{width:31px;height:31px}</style></head><body><div class="r"><button id="gv-exit-arrow" class="t b" aria-label="Back"></button><div id="gv-exit-label" class="t label" role="button" tabindex="0">BACK TO GALAXY VIEWER</div><div class="t icon"><img src="../../artwork/runtime/navigation/galaxy-viewer-target-icon.svg"></div></div><script>let gvExiting=false;function exitToViewer(){if(gvExiting)return;gvExiting=true;const a=document.getElementById('gv-exit-arrow'),l=document.getElementById('gv-exit-label');a.classList.add('gvflash');l.classList.add('gvflash');requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(()=>GV.exit(),520)))}function bindExit(e){let pointerSeen=false;e.addEventListener('pointerdown',x=>{if(x.button!==undefined&&x.button!==0)return;pointerSeen=true;x.preventDefault();exitToViewer()});e.addEventListener('click',x=>{if(pointerSeen){pointerSeen=false;x.preventDefault();return}if(x.detail===0){x.preventDefault();exitToViewer()}});e.addEventListener('keydown',x=>{if(x.key==='Enter'||x.key===' '){x.preventDefault();exitToViewer()}})}bindExit(document.getElementById('gv-exit-arrow'));bindExit(document.getElementById('gv-exit-label'))</script></body></html>
