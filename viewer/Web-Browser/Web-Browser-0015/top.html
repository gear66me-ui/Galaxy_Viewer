<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
@font-face{font-family:GV;src:url("../../artwork/Fonts/Space Age Regular GV-9/Space Age GV-9A.otf")}*{box-sizing:border-box}html,body{margin:0;background:#000;color:#F4FDFF;overflow:hidden;font-family:GV}body{padding:3px 7px}.r{display:grid;grid-template-columns:42px 1fr 42px;gap:7px;height:42px}.r+.r{margin-top:4px}.t{appearance:none;-webkit-appearance:none;position:relative;margin:0;border:1px solid #43CFFF;border-radius:10px;background:linear-gradient(180deg,#174E86 0%,#082C59 13%,#041B3E 54%,#07366A 88%,#0D5A98 100%);color:#F4FDFF;box-shadow:inset 0 2px 2px rgba(225,251,255,.82),inset 0 -3px 5px rgba(0,0,0,.52),inset 0 0 13px rgba(41,153,255,.34),0 0 2px rgba(221,248,255,.88),0 0 7px rgba(50,190,255,.58);display:flex;align-items:center;justify-content:center;overflow:hidden}.t:after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.46) 0%,rgba(118,225,255,.08) 24%,transparent 42%);pointer-events:none}.icon img{width:38px;height:38px;object-fit:contain}.provider img{width:36px;height:36px;object-fit:cover;border-radius:5px}.title{font:400 17px/1 GV,sans-serif;letter-spacing:.5px;text-shadow:0 0 5px #fff,0 0 11px rgba(88,191,255,.85)}.nav{width:42px;padding:0;color:transparent;transition:background .08s,box-shadow .08s}.nav.gvflash{background:linear-gradient(145deg,#062B1D 0%,#08783F 42%,#13B968 76%,#38E69A 100%);box-shadow:inset 0 0 8px rgba(120,255,171,.22),0 0 12px rgba(56,230,154,.85)}.nav:before{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;border:solid #F4FDFF;border-width:0 5px 5px 0;filter:drop-shadow(0 0 4px #8DDAFF) drop-shadow(0 0 8px #58BFFF);transform:translate(-62%,-50%) rotate(-45deg);box-sizing:border-box}.back:before{transform:translate(-38%,-50%) rotate(135deg)}.url{justify-content:flex-start;padding:0 10px;font:400 12px/1 GV,sans-serif;white-space:nowrap;overflow:hidden}.urltext{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lock{position:relative;width:16px;height:13px;flex:0 0 16px;margin-right:10px;margin-left:1px;border:2px solid #F4FDFF;border-radius:2px;filter:drop-shadow(0 0 3px #58BFFF)}.lock:before{content:"";position:absolute;left:50%;top:-10px;width:8px;height:8px;border:2px solid #F4FDFF;border-bottom:0;border-radius:7px 7px 0 0;transform:translateX(-50%);box-sizing:border-box}</style></head><body>
<div class="r"><div class="t icon"><img src="../../artwork/runtime/navigation/galaxy-viewer-target-icon.svg"></div><div class="t title">GALAXY VIEWER</div><div class="t provider"><img id="pi"></div></div>
<div class="r"><button class="t nav back" onclick="pulse(this);GV.back()" aria-label="Back"></button><div class="t url"><span class="lock"></span><span class="urltext" id="u">LOADING…</span></div><button class="t nav" onclick="pulse(this);GV.forward()" aria-label="Forward"></button></div>
<script>function pulse(b){b.classList.add('gvflash');setTimeout(()=>b.classList.remove('gvflash'),260)}let last='';window.setBrowserState=(u,i)=>{const e=document.getElementById('u');if(u&&u!==last){e.textContent=u;e.animate([{opacity:.15},{opacity:1}],{duration:420});last=u}else e.textContent=u||'';document.getElementById('pi').src=i||''}</script><div style="position:fixed;right:10px;top:5px;z-index:9999;font:700 8px monospace;color:#78FFAB;pointer-events:none">V14</div><div style="position:fixed;right:10px;bottom:2px;z-index:99999;padding:1px 5px;border-radius:4px;background:#02070F;color:#78FFAB;font:700 9px/1.4 monospace;pointer-events:none">VERSION 0015</div></body></html>
