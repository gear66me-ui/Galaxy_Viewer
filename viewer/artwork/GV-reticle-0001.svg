      <stop offset="0" stop-color="#E8FBFF"/>
      <stop offset="0.28" stop-color="#62D8FF"/>
      <stop offset="0.62" stop-color="#4F9DFF"/>
      <stop offset="1" stop-color="#7575FF"/>
