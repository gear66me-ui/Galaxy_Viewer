<script>(()=>{'use strict';
/* GALAXY VIEWER CHANGE ORDER: standalone target cyclone lab only. Exact repository target SVG blob 92b223268c18c7ed67c69c56374fc0bd968b8236. Production 0057 flow/release/localTurns/releasedTurns equations retained. Existing repository files remain protected. */
const SOURCE_ASSET_BLOB='92b223268c18c7ed67c69c56374fc0bd968b8236',DEV_STEP=16.6667,LAB_END=8000,TIP_CAPTURE_START=1000,CAPTURE_SWEEP_MS=3300,JOIN_RAMP_MS=180,SHRINK_START=4500,SHRINK_END=7600,FINAL_SCALE=.24,HISTORY_SAMPLES=12,HISTORY_STEP_MS=34,ANNULI=42,SOURCE_SIZE=256,SOURCE_CENTER=128,DISPLAY_MAX=340;
const source=document.getElementById('source'),canvas=document.getElementById('lab'),ctx=canvas.getContext('2d'),devOut=document.getElementById('devOut'),playBtn=document.querySelector('[data-act="play"]'),error=document.getElementById('error');let dpr=1,devMs=0,devPaused=false,devSpeed=1,devLast=0,rafId=0,geom=null,bands=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),smooth=(a,b,v)=>{const x=clamp((v-a)/(b-a),0,1);return x*x*(3-2*x)};
function fail(m){error.style.display='block';error.textContent='Target cyclone lab error: '+m;devPaused=true;playBtn.textContent='Play'}
function productionFlow(ms){const x=clamp((ms-TIP_CAPTURE_START)/6500,0,1),e=x*x*(3-2*x);return .75*e+.25*x}
function productionVortexTurns(ms,rn){const flow=productionFlow(ms),fieldR=rn*.11,radialN=clamp(fieldR/.92,0,1),mask=Math.exp(-Math.pow(fieldR/.235,2)),release=smooth(.15+.43*radialN,1,flow),localTurns=2.10*flow*mask,releasedTurns=1.45*Math.pow(release,1.18)*flow*(.45+.55*radialN);return localTurns+releasedTurns}
function captureTime(rn){return TIP_CAPTURE_START+Math.pow(1-rn,1.04)*CAPTURE_SWEEP_MS}
function captureAt(ms,rn){const tc=captureTime(rn);return smooth(tc,tc+JOIN_RAMP_MS,ms)}
function accumulatedTurns(ms,rn){const tc=captureTime(rn);if(ms<=tc)return 0;return Math.max(0,productionVortexTurns(ms,rn)-productionVortexTurns(tc,rn))*captureAt(ms,rn)}
function shrinkProgress(ms){const p=clamp((ms-SHRINK_START)/(SHRINK_END-SHRINK_START),0,1);return .82*p+.18*p*p*p}
function radialScale(ms){return 1-(1-FINAL_SCALE)*shrinkProgress(ms)}
function stateAt(ms){const flow=productionFlow(ms),scale=radialScale(ms);return{flow,scale,tipCapture:captureAt(ms,.98),outerRingCapture:captureAt(ms,.68),innerRingCapture:captureAt(ms,.38),centerCapture:captureAt(ms,.08),tipDeg:-accumulatedTurns(ms,.98)*360,outerRingDeg:-accumulatedTurns(ms,.68)*360,innerRingDeg:-accumulatedTurns(ms,.38)*360,centerDeg:-accumulatedTurns(ms,.08)*360,captureFront:clamp(1-Math.pow(clamp((ms-TIP_CAPTURE_START)/CAPTURE_SWEEP_MS,0,1),1/1.04),0,1)}}
function buildTarget(){const src=document.createElement('canvas');src.width=src.height=SOURCE_SIZE;const sx=src.getContext('2d',{willReadFrequently:true});sx.drawImage(source,0,0,SOURCE_SIZE,SOURCE_SIZE);const im=sx.getImageData(0,0,SOURCE_SIZE,SOURCE_SIZE),d=im.data;let maxR=0,minR=1e9,kept=0;for(let y=0;y<SOURCE_SIZE;y++)for(let x=0;x<SOURCE_SIZE;x++){const i=(y*SOURCE_SIZE+x)*4,a=d[i+3],r=Math.hypot(x-SOURCE_CENTER,y-SOURCE_CENTER);if(a>8){maxR=Math.max(maxR,r);minR=Math.min(minR,r);kept++}}if(maxR<95||kept<1000)throw Error('exact target SVG did not rasterize');bands=[];for(let n=0;n<ANNULI;n++){const r0=maxR*n/ANNULI,r1=maxR*(n+1)/ANNULI,band=document.createElement('canvas');band.width=band.height=SOURCE_SIZE;const bi=band.getContext('2d').createImageData(SOURCE_SIZE,SOURCE_SIZE);for(let y=0;y<SOURCE_SIZE;y++)for(let x=0;x<SOURCE_SIZE;x++){const i=(y*SOURCE_SIZE+x)*4,r=Math.hypot(x-SOURCE_CENTER,y-SOURCE_CENTER);if(r>=r0&&r<r1&&d[i+3]>8){bi.data[i]=d[i];bi.data[i+1]=d[i+1];bi.data[i+2]=d[i+2];bi.data[i+3]=d[i+3]}}band.getContext('2d').putImageData(bi,0,0);bands.push({canvas:band,rn:((r0+r1)*.5)/maxR})}geom={maxR,minR,kept,sourceAssetBlob:SOURCE_ASSET_BLOB};window.__targetCycloneGeometry=geom}
function resize(){dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
function drawBand(b,time,alpha,history){const rn=b.rn,capture=captureAt(time,rn);if(history&&capture<.025)return;const angle=-accumulatedTurns(time,rn)*Math.PI*2,scale=radialScale(time),display=Math.min(DISPLAY_MAX,Math.min(innerWidth*.74,innerHeight*.58)),sourceScale=display/(geom.maxR*2),cx=innerWidth*.5,cy=Math.max(90,innerHeight*.43);ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);ctx.scale(scale,scale);ctx.globalAlpha=alpha*(history?capture:1);ctx.imageSmoothingEnabled=true;ctx.drawImage(b.canvas,-SOURCE_CENTER*sourceScale,-SOURCE_CENTER*sourceScale,SOURCE_SIZE*sourceScale,SOURCE_SIZE*sourceScale);ctx.restore()}
function renderAt(ms){ctx.clearRect(0,0,innerWidth,innerHeight);ctx.fillStyle='#000';ctx.fillRect(0,0,innerWidth,innerHeight);for(let h=HISTORY_SAMPLES-1;h>=1;h--){const age=h*HISTORY_STEP_MS,t=ms-age;if(t<TIP_CAPTURE_START)continue;const freshness=1-h/HISTORY_SAMPLES,alpha=.018+.075*freshness*freshness;for(const b of bands)drawBand(b,t,alpha,true)}for(const b of bands)drawBand(b,ms,1,false);const s=stateAt(ms),frame60=Math.round(ms/DEV_STEP);devOut.textContent='ms '+ms.toFixed(3)+'   frame60 '+frame60+'   '+(devPaused?'PAUSED':'RUNNING')+'   speed '+devSpeed.toFixed(2)+'×\n'+'productionFlow '+s.flow.toFixed(6)+'   radialScale '+s.scale.toFixed(6)+'   captureFrontRadius '+s.captureFront.toFixed(6)+'\n'+'tipCapture '+s.tipCapture.toFixed(6)+'   tipAngle '+s.tipDeg.toFixed(2)+'°\n'+'outerRingCapture '+s.outerRingCapture.toFixed(6)+'   outerRingAngle '+s.outerRingDeg.toFixed(2)+'°\n'+'innerRingCapture '+s.innerRingCapture.toFixed(6)+'   innerRingAngle '+s.innerRingDeg.toFixed(2)+'°\n'+'centerCapture '+s.centerCapture.toFixed(6)+'   centerAngle '+s.centerDeg.toFixed(2)+'°\n'+'historySamples '+HISTORY_SAMPLES+'   historySpan '+((HISTORY_SAMPLES-1)*HISTORY_STEP_MS).toFixed(1)+' ms\n'+'exact SVG target pixels '+geom.kept+'   targetMaxR '+geom.maxR.toFixed(2)+'   sourceBlob '+SOURCE_ASSET_BLOB.slice(0,12);window.__targetCycloneState={ms,frame60,...s}}
function frame(now){if(!devLast)devLast=now;if(!devPaused)devMs=Math.min(LAB_END,devMs+(now-devLast)*devSpeed);devLast=now;renderAt(devMs);if(!devPaused&&devMs<LAB_END)rafId=requestAnimationFrame(frame);else if(devMs>=LAB_END){devPaused=true;playBtn.textContent='Play'}}
function setPaused(v){devPaused=v;playBtn.textContent=v?'Play':'Pause';cancelAnimationFrame(rafId);if(!v){if(devMs>=LAB_END)devMs=0;devLast=performance.now();rafId=requestAnimationFrame(frame)}else renderAt(devMs)}
document.getElementById('devBtns').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.speed){devSpeed=Number(b.dataset.speed);document.querySelectorAll('[data-speed]').forEach(x=>x.classList.toggle('active',x===b));renderAt(devMs);return}const a=b.dataset.act;if(a==='play'){setPaused(!devPaused);return}if(a==='rewind'){setPaused(true);devMs=0;renderAt(devMs);return}if(a==='stepBack'||a==='stepForward'){setPaused(true);devMs=clamp(devMs+(a==='stepForward'?DEV_STEP:-DEV_STEP),0,LAB_END);renderAt(devMs)}});
async function boot(){try{if(source.decode)await source.decode();if(!source.naturalWidth)throw Error('embedded exact target SVG failed to load');buildTarget();resize();addEventListener('resize',()=>{resize();renderAt(devMs)},{passive:true});devMs=0;devPaused=false;devSpeed=1;devLast=performance.now();renderAt(0);rafId=requestAnimationFrame(frame)}catch(e){fail(e.message||String(e))}}
window.__targetCycloneSetMs=ms=>{setPaused(true);devMs=clamp(Number(ms)||0,0,LAB_END);renderAt(devMs);return window.__targetCycloneState};
if(source.complete&&source.naturalWidth)boot();else{source.onload=boot;source.onerror=()=>fail('embedded exact target SVG failed to load')}
})();</script>
