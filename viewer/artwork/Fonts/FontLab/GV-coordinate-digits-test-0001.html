<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GV Coordinate Digits Test 0001</title><style>
@font-face{font-family:GV9A;src:url('Space Age GV-9A.otf') format('opentype')}@font-face{font-family:GVC;src:url('GV-Coordinate-Digits-0001.otf') format('opentype')}
*{box-sizing:border-box}body{margin:0;background:#03060b;color:#eef8ff;font-family:Arial;padding:12px}.lab{max-width:390px;margin:auto}.box{border:1px solid #263746;border-radius:10px;background:#090e15;padding:10px;margin-bottom:10px}.label{font-size:11px;margin-bottom:5px}.banner{height:36px;width:298px;max-width:100%;margin:auto;background:#000;border:1px solid #d7f4ff;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#2D72C2;white-space:nowrap}.ref{font:15px GV9A;letter-spacing:.55px}.custom{font:15px GVC;letter-spacing:.55px}.large{height:90px;font-size:30px}button{width:100%;height:40px;background:#111a29;color:white;border:1px solid #62d8ff;border-radius:7px}
</style></head><body><main class="lab"><h2>GV Coordinate Digits Test 0001</h2><section class="box"><div class="label">Original GV-9A</div><div id="ref" class="banner ref">-139.9995 -59.9599</div></section><section class="box"><div class="label">Custom coordinate digits</div><div id="custom" class="banner custom">-139.9995 -59.9599</div></section><section class="box"><div class="label">Large comparison</div><div class="banner large custom">0123456789.-</div></section><button id="randomize">New coordinate test</button></main><script>
(()=>{'use strict';const r=()=>{const a=()=>((Math.random()*360)-180).toFixed(4),b=()=>((Math.random()*180)-90).toFixed(4),s=`${a()} ${b()}`;document.getElementById('ref').textContent=s;document.getElementById('custom').textContent=s};document.getElementById('randomize').onclick=r;})();
</script></body></html>
