<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Galaxy Viewer Browser</title>
<style>
@font-face{font-family:"Space Age";src:url("../artwork/Fonts/Space Age Regular/Space Age Regular.otf") format("opentype");font-style:normal;font-weight:400;font-display:block}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}body{padding:12px;font-family:"Space Age",sans-serif}
.row{width:100%;display:grid;gap:2px}.top{height:36px;grid-template-columns:36px minmax(0,1fr) 36px}.nav{height:36px;grid-template-columns:36px 36px minmax(0,1fr) 36px;margin-top:4px}
.tile{position:relative;height:36px;margin:0;padding:0;overflow:hidden;border:1px solid #7CCBFF;border-radius:6px;background:linear-gradient(145deg,#081B3A 0%,#0B3177 48%,#123F86 72%,#296DBD 100%);color:#DDF8FF;box-shadow:inset 0 2px 2px rgba(225,251,255,.82),inset 0 -3px 5px rgba(0,0,0,.52),inset 0 0 13px rgba(41,153,255,.34),0 0 3px #DDF8FF,0 0 9px rgba(50,190,255,.72),0 0 18px rgba(20,116,219,.35)}
.tile::before{content:"";position:absolute;inset:2px;border-radius:6px;pointer-events:none;z-index:1;background:linear-gradient(145deg,rgba(8,27,58,.28),rgba(20,132,219,.10));box-shadow:inset 0 0 0 1px rgba(124,203,255,.34),inset 0 0 7px rgba(88,191,255,.20),inset 0 0 11px rgba(41,109,189,.16)}
.icon{display:flex;align-items:center;justify-content:center;padding:2px}.icon img{position:relative;z-index:2;width:30px;height:30px;object-fit:contain}.provider img{object-fit:cover;border-radius:4px}
.title{display:flex;align-items:center;justify-content:center;padding:0 10px;font:400 12.5px/1 "Space Age",sans-serif;letter-spacing:.55px;text-shadow:0 0 2px rgba(234,248,255,.58);white-space:nowrap}.title span{position:relative;z-index:2}
.ctrl{display:flex;align-items:center;justify-content:center}.chev{position:relative;z-index:2;width:22px;height:22px}.chev::before{content:"";position:absolute;left:7px;top:4px;width:12px;height:12px;border-left:5px solid #F4FDFF;border-bottom:5px solid #F4FDFF;transform:rotate(45deg);filter:drop-shadow(0 0 4px #8DDAFF)}.forward .chev{transform:scaleX(-1)}
.address{display:grid;grid-template-columns:25px minmax(0,1fr);align-items:center;padding:0 7px;background:linear-gradient(180deg,#02081B,#020612);font-family:Arial,sans-serif}.lock{position:relative;z-index:2;display:grid;place-items:center}.lock svg{width:15px;height:19px;fill:#7CCBFF}.url{position:relative;z-index:2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#F4FDFF;font:12px/1 Arial,sans-serif}
.refresh svg{position:relative;z-index:2;width:21px;height:21px;stroke:#F4FDFF;stroke-width:4.5;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 3px #8DDAFF)}
</style></head><body>
<div class="row top"><div class="tile icon"><img src="../artwork/icon.svg" alt="Galaxy Viewer"></div><div class="tile title"><span>GALAXY VIEWER</span></div><div class="tile icon provider"><img id="providerIcon" src="../artwork/Chandra/Chandra.jpg" alt="Provider"></div></div>
<div class="row nav"><button class="tile ctrl back"><span class="chev"></span></button><button class="tile ctrl forward"><span class="chev"></span></button><div class="tile address"><span class="lock"><svg viewBox="0 0 24 30"><path d="M5 12V8a7 7 0 0 1 14 0v4h2v16H3V12h2zm3 0h8V8a4 4 0 0 0-8 0v4z"/></svg></span><span class="url" id="sourceUrl">LOADING SOURCE URL…</span></div><button class="tile ctrl refresh"><svg viewBox="0 0 40 40"><path d="M31 13A14 14 0 1 0 32 27"/><path d="M31 5v10h-10"/></svg></button></div>
<script>
(async()=>{try{const r=await fetch("../image-databases/Chandra/databases/gv-chandra-galaxies-full-0007.json",{cache:"no-store"});const j=await r.json();const e=(j.entries||[]).find(x=>x&&x.sourceUrl);document.getElementById("sourceUrl").textContent=e?.sourceUrl||j.sourceArchiveUrl||"SOURCE URL UNAVAILABLE"}catch(e){document.getElementById("sourceUrl").textContent="SOURCE URL UNAVAILABLE"}})();
</script></body></html>
