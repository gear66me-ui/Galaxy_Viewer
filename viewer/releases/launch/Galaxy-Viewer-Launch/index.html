<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#000"><style>
@font-face{font-family:GV;src:url('../../../artwork/Fonts/Space%20Age%20Regular%20GV-9/Space%20Age%20GV-9A.otf') format('opentype');font-display:block}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff}
#curtain{position:fixed;inset:0;z-index:100000;display:grid;place-items:center;background:#000}
#identity{width:100%;display:flex;flex-direction:column;align-items:center;text-align:center}
#halo{position:relative;width:min(78vw,420px);aspect-ratio:1;display:grid;place-items:center;background:transparent}
#target{display:block;width:100%;height:100%;object-fit:contain;overflow:visible;filter:none}
#ver,#bld{font:400 clamp(15px,4vw,24px) GV,sans-serif;letter-spacing:.08em;color:#f8fdff;text-shadow:0 0 3px #fff,0 0 9px #075cff,0 0 18px #075cff}
#ver{margin-top:18px}#bld{margin-top:20px}
#splash{display:none;position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;z-index:100001}
#error{display:none;position:fixed;inset:0;padding:28px;white-space:pre-wrap;color:#9be5ff;background:#000;font:12px monospace;z-index:99002}
</style></head><body>
<div id="curtain"><div id="identity"><div id="halo"><img id="target" src="https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/release/viewer/artwork/startup/galaxy-viewer-startup.png"></div><div id="ver">VERSION</div><div id="bld">BUILD</div></div></div>
<iframe id="splash"></iframe><div id="error"></div>
<script>
(async()=>{const BASE='https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/release/viewer/';
const read=async u=>{
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
 try{const r=await fetch(u,{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status+' '+u);return await r.text()}
 catch(e){throw Error((e?.name==='AbortError'?'FETCH TIMEOUT ':'FETCH FAILED ')+u+' — '+String(e?.message||e))}
 finally{clearTimeout(timer)}
};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// DIAGNOSTIC 0200: surface the viewer's real boot exception instead of masking it as a readiness timeout.
window.__GV_BOOT_ERRORS=[];
const gvNativeConsoleError=console.error.bind(console);
console.error=(...args)=>{
  try{
    const head=String(args[0]??'');
    if(head.includes('GV200-001 BOOT FAILURE')){
      window.__GV_BOOT_ERRORS.push(args.map(v=>v?.stack||v?.message||String(v)).join('\\n'));
    }
  }catch(_){}
  gvNativeConsoleError(...args);
};
addEventListener('error',event=>{
  try{window.__GV_BOOT_ERRORS.push('WINDOW ERROR: '+String(event?.error?.stack||event?.message||'UNKNOWN ERROR'))}catch(_){}
});
addEventListener('unhandledrejection',event=>{
  try{window.__GV_BOOT_ERRORS.push('UNHANDLED REJECTION: '+String(event?.reason?.stack||event?.reason?.message||event?.reason||'UNKNOWN REJECTION'))}catch(_){}
});
const paint2=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
try{
 const p=JSON.parse(await read(BASE+'gv-current-viewer.json?t='+Date.now()));
 ver.textContent='VERSION '+String(p.version||'').toUpperCase();bld.textContent='BUILD '+String(p.build||'').toUpperCase();
 const identityStarted=performance.now();

 // PREPARE the splash in the background, but KEEP IT HIDDEN.
 // The splash animation is the final launch sequence: it starts only after
 // the complete viewer boot, Monte Carlo route selection, and first
 // destination AVM/HD preload are ready.
 const splashReady=new Promise((resolve,reject)=>{
   const timeout=setTimeout(()=>reject(Error('SPLASH PREP TIMEOUT')),20000);
   const onMessage=ev=>{
     if(ev.source===splash.contentWindow&&ev.data&&ev.data.type==='galaxy-splash-ready'){
       clearTimeout(timeout);removeEventListener('message',onMessage);resolve()
     }
   };
   addEventListener('message',onMessage)
 });
 splash.src='../../splash/Galaxy-Viewer-Singularity-FINAL/index.html?armed=1&v=prep-'+Date.now();

 // Fetch and boot the viewer behind the identity curtain. Nothing visual is
 // revealed yet. This is intentionally BEFORE the splash animation starts.
 const src=await read(BASE+p.viewer+'?t='+Date.now());
 const extract=(text,start,end)=>{const a=text.indexOf(start);if(a<0)return null;const from=a+start.length,b=text.indexOf(end,from);return b<0?null:text.slice(from,b)};
 const html=extract(src,'display(HTML("""','"""))'),js=extract(src,'display(Javascript(r"""','"""))');
 if(html==null||js==null)throw Error('VIEWER EXTRACTION FAILED html='+String(html!==null)+' js='+String(js!==null)+' bytes='+src.length);
 document.body.insertAdjacentHTML('beforeend',html);
 const e=document.createElement('script');e.textContent=js;document.body.appendChild(e);

 // The identity screen remains up while the full application boots.
 const readiness=()=>{
   if(window.__GV_BOOT_ERRORS?.length){
     throw Error('VIEWER BOOT FAILURE\\n'+window.__GV_BOOT_ERRORS.slice(-4).join('\\n---\\n'));
   }
   const root=document.getElementById('aladin-cosmic-command-test');
   const core=window.GalaxyViewerCore,runtime=window.GalaxyViewerRuntime,navState=runtime?.navigationState;
   return {root:!!root,core:!!core,runtime:!!runtime,aladin:!!core?.aladin,phase:navState?.phase??null,active:navState?.active??null};
 };
 const viewerReady=(async()=>{
   const deadline=Date.now()+90000;
   while(Date.now()<deadline){
     const s=readiness();
     if(s.root&&s.core&&s.runtime&&s.aladin&&s.phase==='READY'&&s.active===100){
       const preload=window.GalaxyViewerPreloadReady;
       if(preload)await preload;
       return
     }
     await sleep(100)
   }
   throw Error('VIEWER APP READINESS TIMEOUT '+JSON.stringify(readiness()))
 })();

 // Do not launch the splash until the viewer and its first destination are
 // actually ready. The animation is the final handoff, not the loading mask.
 await viewerReady;
 await splashReady;
 const identityRemain=Math.max(0,3000-(performance.now()-identityStarted));if(identityRemain)await sleep(identityRemain);

 const splashComplete=new Promise((resolve,reject)=>{
   const timeout=setTimeout(()=>reject(Error('SPLASH COMPLETION TIMEOUT')),18000);
   const onMessage=ev=>{
     if(ev.source===splash.contentWindow&&ev.data&&ev.data.type==='galaxy-splash-complete'){
       clearTimeout(timeout);removeEventListener('message',onMessage);resolve()
     }
   };
   addEventListener('message',onMessage)
 });
 splash.style.display='block';
 await paint2();
 splash.contentWindow.postMessage({type:'galaxy-splash-start'},'*');

 await splashComplete;
 if(typeof window.GalaxyViewerPrepareCosmicReveal==='function')window.GalaxyViewerPrepareCosmicReveal();
 await paint2();
 document.documentElement.dataset.gvSplashComplete='1';window.GalaxyViewerSetSplashComplete?.();splash.remove();curtain.remove();
 if(typeof window.GalaxyViewerStartCosmicReveal==='function')window.GalaxyViewerStartCosmicReveal();
}catch(e){curtain?.remove();splash?.remove();error.style.display='block';error.textContent='GALAXY VIEWER FAILED TO LOAD\n\n'+String(e&&e.stack||e)}
})();
</script></body></html>
