<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#000"><style>
@font-face{font-family:GV;src:url('../../../artwork/Fonts/Space Age Regular GV-9/Space Age GV-9A.otf') format('opentype');font-display:block}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff}
#curtain{position:fixed;inset:0;z-index:99000;display:grid;place-items:center;background:#000}
#identity{text-align:center}
#halo{position:relative;width:min(62vw,330px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(7,45,110,.98) 0%,rgba(5,35,91,.84) 28%,rgba(3,25,68,.55) 47%,rgba(1,13,38,.24) 64%,rgba(0,0,0,0) 80%)}
#target{width:52%;height:52%;filter:drop-shadow(0 0 8px rgba(69,231,255,.45))}
#orbit{position:absolute;inset:8%;animation:orbit 1s linear infinite}
#comet{position:absolute;left:50%;top:0;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 5px #fff,0 0 12px #79eaff,0 0 22px #167dff}
#comet:after{content:"";position:absolute;width:26px;height:4px;right:4px;top:3px;border-radius:50%;background:linear-gradient(90deg,transparent,#ff7b21,#fff);transform:rotate(-15deg);transform-origin:right center}
@keyframes orbit{to{transform:rotate(360deg)}}
#ver,#bld{font:400 clamp(15px,4vw,24px) GV,sans-serif;letter-spacing:.08em;color:#f8fdff;text-shadow:0 0 3px #fff,0 0 9px #075cff,0 0 18px #075cff}
#ver{margin-top:18px}#bld{margin-top:20px}
#splash{display:none;position:fixed;inset:0;width:100%;height:100%;border:0;background:#000;z-index:99001}
#error{display:none;position:fixed;inset:0;padding:28px;white-space:pre-wrap;color:#9be5ff;background:#000;font:12px monospace;z-index:99002}
</style></head><body>
<div id="curtain"><div id="identity"><div id="halo"><img id="target" src="../../../artwork/runtime/navigation/galaxy-viewer-target-icon.svg"><div id="orbit"><i id="comet"></i></div></div><div id="ver">VERSION</div><div id="bld">BUILD</div></div></div>
<iframe id="splash"></iframe><div id="error"></div>
<script>
(async()=>{const BASE='https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/beta/viewer/';
const read=async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status+' '+u);return r.text()};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const paint2=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
try{
 const p=JSON.parse(await read(BASE+'gv-current-viewer.json?t='+Date.now()));
 ver.textContent='VERSION '+String(p.version||'').toUpperCase();bld.textContent='BUILD '+String(p.build||'').toUpperCase();
 const src=await read(BASE+p.viewer+'?t='+Date.now());
 const hm=src.match(/display\(HTML\(\"\"\"([\s\S]*?)\"\"\"\)\)/),jm=src.match(/display\(Javascript\(r\"\"\"([\s\S]*?)\"\"\"\)\)/);
 if(!hm||!jm)throw Error('VIEWER EXTRACTION FAILED');
 document.body.insertAdjacentHTML('beforeend',hm[1]);const e=document.createElement('script');e.textContent=jm[1];document.body.appendChild(e);
 await sleep(3000);
 splash.style.display='block';splash.src='../../splash/Galaxy-Viewer-Singularity-FINAL/index.html?v=remote-'+Date.now();
 await sleep(12750);
 const ready=()=>{const root=document.getElementById('aladin-cosmic-command-test'),nav=document.getElementById('gv-navigation-host'),ret=document.getElementById('gv-center-reticle'),canvas=root&&root.querySelector('canvas');return !!(root&&nav&&ret&&canvas&&ret.querySelector('img')&&ret.querySelector('img').complete)};
 const deadline=Date.now()+45000;while(!ready()&&Date.now()<deadline)await sleep(100);
 if(!ready())throw Error('VIEWER READINESS TIMEOUT');
 await paint2();await sleep(250);await paint2();
 splash.remove();curtain.remove();
}catch(e){curtain?.remove();splash?.remove();error.style.display='block';error.textContent='GALAXY VIEWER FAILED TO LOAD\n\n'+String(e&&e.stack||e)}
})();
</script></body></html>
