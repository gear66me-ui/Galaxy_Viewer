<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GV49 M51 WCS Registration Lab</title><style>
html,body,#aladin{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#diag{position:fixed;left:8px;right:8px;bottom:10px;z-index:9999;background:rgba(0,10,28,.86);color:#d9f6ff;border:1px solid #46cfff;border-radius:10px;padding:8px 10px;font:12px/1.25 monospace;pointer-events:none}
#op{position:fixed;right:10px;top:35%;z-index:10000;background:rgba(0,10,28,.86);color:#fff;border:1px solid #46cfff;border-radius:10px;padding:8px;font:12px sans-serif}
#op input{width:170px}
</style></head><body><div id="aladin"></div>
<label id="op">OVERLAY <span id="ov">70%</span><br><input id="slider" type="range" min="0" max="100" value="70"></label>
<div id="diag">Loading exact Build 49 registration path…</div>
<script type="module">
import A from '../../aladin-source-clone/dist/aladin.js';
const IMAGE_URL='https://www.spitzer.caltech.edu/system/avm_images/binaries/1324/medium/ssc2004-19a2.jpg?1603801918=';
const RUNTIME_URL='https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/beta/viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0001.json';
const ARCHIVE_ID='ssc2004-19a2';
const diag=document.getElementById('diag'),slider=document.getElementById('slider'),ov=document.getElementById('ov');
const aladin=A.aladin('#aladin',{survey:'P/DSS2/color',target:'M 51',fov:0.45,cooFrame:'ICRS',projection:'TAN',showReticle:true,showGotoControl:true,showZoomControl:true,showFullscreenControl:true,showLayersControl:true,showCooGridControl:true,showProjectionControl:true});
function gvSyntheticWcsFromRuntimeRecord(record,width,height){
 const ra=Number(record?.ra),dec=Number(record?.dec);
 const fovX=Number(record?.fovXDegrees??record?.fovDegrees);
 const fovY=Number(record?.fovYDegrees??record?.fovDegrees);
 const rotation=Number(record?.aladinRotation??record?.spatialRotationDeg);
 if(!Number.isFinite(ra)||!Number.isFinite(dec))throw new Error('GV JSON WCS CENTER INVALID');
 if(!Number.isFinite(fovX)||fovX<=0||!Number.isFinite(fovY)||fovY<=0)throw new Error('GV JSON WCS FOV INVALID');
 if(!Number.isFinite(rotation))throw new Error('GV JSON WCS ROTATION INVALID');
 if(!Number.isFinite(width)||width<=0||!Number.isFinite(height)||height<=0)throw new Error('GV JSON WCS DIMENSION INVALID');
 const sx=fovX/width,sy=fovY/height,t=rotation*Math.PI/180,c=Math.cos(t),s=Math.sin(t);
 const referencePixel=record?.referencePixel,referenceDimension=record?.referenceDimension;
 const rawCrpix1=Number(referencePixel?.[0]),rawCrpix2=Number(referencePixel?.[1]);
 const rawWidth=Number(referenceDimension?.[0]),rawHeight=Number(referenceDimension?.[1]);
 const crpix1=Number.isFinite(rawCrpix1)&&Number.isFinite(rawWidth)&&rawWidth>0?rawCrpix1*(width/rawWidth):(width+1)/2;
 const crpix2=Number.isFinite(rawCrpix2)&&Number.isFinite(rawHeight)&&rawHeight>0?rawCrpix2*(height/rawHeight):(height+1)/2;
 return {NAXIS:2,CTYPE1:'RA---TAN',CTYPE2:'DEC--TAN',EQUINOX:2000,LONPOLE:180,LATPOLE:dec,CUNIT1:'deg',CUNIT2:'deg',
 CRVAL1:ra,CRVAL2:dec,CRPIX1:crpix1,CRPIX2:crpix2,
 CD1_1:-sx*c,CD1_2:-sy*s,CD2_1:-sx*s,CD2_2:sy*c,NAXIS1:width,NAXIS2:height};
}
async function loadBitmap(){
 let res=await fetch(IMAGE_URL,{cache:'no-store'}); if(!res.ok)throw new Error('IMAGE HTTP '+res.status);
 const blob=await res.blob(),bitmap=await createImageBitmap(blob);
 const c=document.createElement('canvas');c.width=bitmap.width;c.height=bitmap.height;c.getContext('2d').drawImage(bitmap,0,0);
 const out=await new Promise(ok=>c.toBlob(ok,'image/png')); return {blob:out,width:c.width,height:c.height};
}
function recordsOf(j){if(Array.isArray(j))return j;for(const k of ['records','items','galaxies','data'])if(Array.isArray(j?.[k]))return j[k];return []}
let layer=null;
try{
 const [runtime,raster]=await Promise.all([fetch(RUNTIME_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('RUNTIME HTTP '+r.status);return r.json()}),loadBitmap()]);
 const records=recordsOf(runtime);
 const record=records.find(x=>String(x?.archiveId||'').toLowerCase()===ARCHIVE_ID)||records.find(x=>String(x?.imageUrl||'').includes('ssc2004-19a2'));
 if(!record)throw new Error('NO AVM RUNTIME RECORD FOR '+ARCHIVE_ID);
 const wcs=gvSyntheticWcsFromRuntimeRecord(record,raster.width,raster.height);
 const objectUrl=URL.createObjectURL(raster.blob);
 layer=A.image(objectUrl,{name:'GV49 EXACT M51',imgFormat:'png',wcs,opacity:.70});
 aladin.setOverlayImageLayer(layer,'GV49 EXACT M51');
 aladin.gotoRaDec(Number(record.ra),Number(record.dec));
 aladin.setFov(Math.max(Number(record.fovXDegrees??record.fovDegrees),Number(record.fovYDegrees??record.fovDegrees)));
 aladin.setRotation(Number(record.aladinRotation??record.spatialRotationDeg));
 const sx=Number(record.fovXDegrees??record.fovDegrees)/raster.width,sy=Number(record.fovYDegrees??record.fovDegrees)/raster.height;
 diag.textContent='EXACT ssc2004-19a2 | raster '+raster.width+'×'+raster.height+' aspect='+(raster.width/raster.height).toFixed(6)+' | AVM ref='+(record.referenceDimension||[]).join('×')+' | FOV='+(record.fovXDegrees??record.fovDegrees)+' × '+(record.fovYDegrees??record.fovDegrees)+'° | rot='+(record.aladinRotation??record.spatialRotationDeg)+'° | sx='+sx.toExponential(7)+' sy='+sy.toExponential(7);
 slider.addEventListener('input',()=>{const v=Number(slider.value)/100;ov.textContent=slider.value+'%'; if(layer?.setOpacity)layer.setOpacity(v); else if(layer)layer.opacity=v;});
}catch(e){diag.textContent='ERROR: '+(e?.stack||e)}
</script></body></html>
