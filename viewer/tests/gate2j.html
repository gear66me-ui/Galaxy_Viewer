<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GV Gate 2I</title>
<link rel="stylesheet" href="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.min.css"><script src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#080b12;color:#fff;font-family:system-ui}.app{width:min(430px,96vw);margin:10px auto}#wrap{position:relative;height:520px;border:1px solid #556;border-radius:8px;overflow:hidden}#aladin{position:absolute;inset:0}#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.row{display:none}.vctl{position:absolute;top:58px;bottom:58px;z-index:20;display:flex;flex-direction:column;align-items:center;gap:5px;padding:5px;background:#111927cc;border:1px solid #39465b;border-radius:8px}.vctl.left{left:5px}.vctl.right{right:5px}.vctl input{writing-mode:vertical-lr;direction:rtl;width:28px;height:100%}.vctl output{font:10px monospace;writing-mode:vertical-rl}.opctl{display:grid;grid-template-columns:58px 1fr 48px;gap:7px;align-items:center;margin:8px 0}.opctl input{width:100%}button{padding:8px 12px}.modebtn{background:#fff;color:#111;border:2px solid #aaa;border-radius:6px}.modebtn.active{background:#22c55e;color:#06130a;border-color:#78ffab;font-weight:800}.top{display:flex;gap:8px;align-items:center}.top b{flex:1}.mono{font:11px monospace;background:#111927;border:1px solid #39465b;padding:8px;border-radius:7px;white-space:pre-wrap}h1{font-size:15px;margin:8px 0}</style></head>
<body><div class="app"><h1>Gate 2J — WCS vs JSON Audit</h1><div class="top"><button id="back">◀ BACK</button><b id="name">Loading catalog…</b><button id="next">NEXT ▶</button><button id="random">Random Image</button></div><div class="top"><button id="jsonload" class="modebtn active">JSON LOAD</button><button id="wcsload" class="modebtn">WCS DECODE LOAD</button><button id="reload">RELOAD IMAGE</button></div><div id="wrap"><div id="aladin"></div><canvas id="ov"></canvas><label class="vctl left"><b>ROT</b><input id="rot" type="range" min="-180" max="180" step=".01" value="0"><output id="rotv">0°</output></label><label class="vctl right"><b>FoV</b><input id="fov" type="range" min="-6" max="6" step=".001" value="0"><output id="fovv">—</output></label></div>
<div class="opctl"><b>IMAGE</b><input id="opacity" type="range" min="0" max="100" step="1" value="55"><output id="opv">55%</output></div>
<div id="read" class="mono">Initializing…</div></div><script>
const CAT="https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/beta/viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0001.json";
let aladin,layer,rows=[],rec,imgW=1,imgH=1,baseFov=1,serial=0,currentBlob=null,currentMode='JSON',currentIndex=-1,lastDecoded=null;
function n(v){v=Number(v);return Number.isFinite(v)?v:null}
function geom(r){let fx=n(r.fovXDegrees??r.fovDegrees),fy=n(r.fovYDegrees??r.fovDegrees),rot=n(r.aladinRotation??r.spatialRotationDeg),ra=n(r.ra),dec=n(r.dec);return {ra,dec,fx,fy,rot}}
function usable(r){let g=geom(r);return !!r.imageUrl&&[g.ra,g.dec,g.fx,g.fy,g.rot].every(Number.isFinite)&&g.fx>0&&g.fy>0}
function cd(){let g=geom(rec),sx=g.fx/imgW,sy=g.fy/imgH,t=g.rot*Math.PI/180,c=Math.cos(t),s=Math.sin(t);return{a:-sx*c,b:-sy*s,c:-sx*s,d:sy*c}}
function W(){let g=geom(rec),m=cd();return{NAXIS:2,CTYPE1:"RA---TAN",CTYPE2:"DEC--TAN",EQUINOX:2000,LONPOLE:180,CUNIT1:"deg",CUNIT2:"deg",CRVAL1:g.ra,CRVAL2:g.dec,CRPIX1:(imgW+1)/2,CRPIX2:(imgH+1)/2,CD1_1:m.a,CD1_2:m.b,CD2_1:m.c,CD2_2:m.d,NAXIS1:imgW,NAXIS2:imgH}}
function sky(x,y){let g=geom(rec),m=cd(),dx=x-(imgW+1)/2,dy=y-(imgH+1)/2,e=m.a*dx+m.b*dy,no=m.c*dx+m.d*dy;return[g.ra+e/Math.cos(g.dec*Math.PI/180),g.dec+no]}
function P(x,y){let q=sky(x,y);return aladin.world2pix(q[0],q[1])}
function draw(){if(!rec)return;let cv=document.getElementById("ov"),r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);let c=cv.getContext("2d");c.setTransform(d,0,0,d,0,0);let a=P(.5,.5),b=P(imgW+.5,.5),e=P(imgW+.5,imgH+.5),f=P(.5,imgH+.5),l=P(.5,(imgH+1)/2),rr=P(imgW+.5,(imgH+1)/2),t=P((imgW+1)/2,.5),bb=P((imgW+1)/2,imgH+.5);c.strokeStyle="#78ffab";c.lineWidth=2;c.beginPath();c.moveTo(...a);c.lineTo(...b);c.lineTo(...e);c.lineTo(...f);c.closePath();c.stroke();c.lineWidth=1.5;c.beginPath();c.moveTo(...l);c.lineTo(...rr);c.moveTo(...t);c.lineTo(...bb);c.stroke()}
function paintMode(){let j=document.getElementById("jsonload"),w=document.getElementById("wcsload");if(!j||!w)return;j.classList.toggle("active",currentMode==="JSON");w.classList.toggle("active",currentMode==="WCS DECODE")}
function auditText(w){if(!w)return "not decoded";return ["CRVAL1 "+w.CRVAL1,"CRVAL2 "+w.CRVAL2,"CRPIX1 "+w.CRPIX1,"CRPIX2 "+w.CRPIX2,"NAXIS1 "+w.NAXIS1,"NAXIS2 "+w.NAXIS2,"CD1_1 "+w.CD1_1,"CD1_2 "+w.CD1_2,"CD2_1 "+w.CD2_1,"CD2_2 "+w.CD2_2].join("\n")}
function info(s="READY"){paintMode();let g=geom(rec),q=aladin.getRaDec(),f=aladin.getFov(),jw=W();document.getElementById("read").innerHTML='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><b>WCS DECODED</b><br><pre>'+auditText(lastDecoded)+'</pre></div><div><b>JSON CATALOG</b><br><pre>'+auditText(jw)+'</pre></div></div><div style="border-top:1px solid #456;padding-top:8px"><b>ALADIN LIVE</b><br>'+s+' ['+currentMode+'] | '+rec.providerKey+' — '+rec.name+'<br>JPEG '+imgW+' × '+imgH+' | Image FoV '+g.fx+' × '+g.fy+'° | JSON Rot '+g.rot+'°<br>RA/Dec '+q[0]+' / '+q[1]+' | Viewport FoV '+f[0]+' × '+f[1]+'° | Camera Rot '+aladin.getRotation()+'</div>';draw()}
async function load(r){let token=++serial;rec=r;let g=geom(r);document.getElementById("name").textContent=r.providerKey+" — "+r.name;document.getElementById("read").textContent="FETCHING IMAGE…";let resp=await fetch(r.imageUrl,{mode:"cors",credentials:"omit",cache:"no-store"});if(!resp.ok)throw Error("HTTP "+resp.status);let blob=await resp.blob();currentBlob=blob;try{lastDecoded=decodedWcs(await blob.arrayBuffer())}catch(_){lastDecoded=null}let bmp=await createImageBitmap(blob);if(token!==serial)return;imgW=bmp.width;imgH=bmp.height;bmp.close();try{aladin.removeImageLayer?.("GATE2C_IMAGE")}catch(e){}let u=URL.createObjectURL(blob);currentMode="JSON";layer=A.image(u,{name:"GATE2C_IMAGE",imgFormat:"jpeg",wcs:W(),opacity:+document.getElementById("opacity").value/100,successCallback:()=>info("IMAGE READY"),errorCallback:e=>info("IMAGE LAYER ERROR "+e)});aladin.setOverlayImageLayer(layer,"GATE2C_IMAGE");aladin.gotoRaDec(g.ra,g.dec);baseFov=Math.max(g.fx,g.fy)*2.5;document.getElementById("fov").value=0;aladin.setFoV(baseFov);document.getElementById("fovv").value=baseFov.toFixed(5)+"°";document.getElementById("rot").value=g.rot;document.getElementById("rotv").value=g.rot.toFixed(2)+"°";aladin.setRotation(g.rot);info("IMAGE LOADING…")}
function avmText(buf){return new TextDecoder("latin1").decode(new Uint8Array(buf))}
function avmArray(x,key){let leaf=key.split(".").pop(),p=x.indexOf("avm:"+key);if(p<0)p=x.indexOf("avm:"+leaf);if(p<0)p=x.indexOf(key);if(p<0)return[];let z=x.slice(p,p+5000),a=[...z.matchAll(/<rdf:li[^>]*>([^<]+)<\/rdf:li>/gi)].map(m=>m[1].trim());if(a.length)return a;let q=z.match(/=[\"\x27]([^\"\x27]+)[\"\x27]/);return q?[q[1]]:[]}
function decodedWcs(buf){let x=avmText(buf),ref=avmArray(x,"Spatial.ReferenceValue").map(Number),dim=avmArray(x,"Spatial.ReferenceDimension").map(Number),pix=avmArray(x,"Spatial.ReferencePixel").map(Number),sc=avmArray(x,"Spatial.Scale").map(Number),rv=avmArray(x,"Spatial.Rotation"),rot=Number(rv[0]);if(ref.length<2||sc.length<2||!Number.isFinite(rot))throw Error("AVM WCS FIELDS MISSING");let oldW=Number(dim[0])||imgW,oldH=Number(dim[1])||imgH,rx=imgW/oldW,ry=imgH/oldH,px=Number.isFinite(pix[0])?pix[0]*rx:(imgW+1)/2,py=Number.isFinite(pix[1])?pix[1]*ry:(imgH+1)/2,sx=Math.abs(sc[0])/rx,sy=Math.abs(sc[1])/ry,t=rot*Math.PI/180,c=Math.cos(t),sn=Math.sin(t);return{NAXIS:2,CTYPE1:"RA---TAN",CTYPE2:"DEC--TAN",EQUINOX:2000,CUNIT1:"deg",CUNIT2:"deg",CRVAL1:ref[0],CRVAL2:ref[1],CRPIX1:px,CRPIX2:py,CD1_1:-sx*c,CD1_2:-sy*sn,CD2_1:-sx*sn,CD2_2:sy*c,NAXIS1:imgW,NAXIS2:imgH}}
async function reloadMode(mode){if(!rec||!currentBlob)return;currentMode=mode;paintMode();try{lastDecoded=decodedWcs(await currentBlob.arrayBuffer())}catch(_){lastDecoded=null}let wc=mode==="JSON"?W():lastDecoded;if(!wc)throw Error('AVM WCS FIELDS MISSING');try{aladin.removeImageLayer?.("GATE2C_IMAGE")}catch(e){}let u=URL.createObjectURL(currentBlob);layer=A.image(u,{name:"GATE2C_IMAGE",imgFormat:"jpeg",wcs:wc,opacity:+document.getElementById("opacity").value/100,successCallback:()=>info("IMAGE READY"),errorCallback:e=>info("IMAGE LAYER ERROR "+e)});aladin.setOverlayImageLayer(layer,"GATE2C_IMAGE");info("IMAGE LOADING…")}
async function loadIndex(i,step=1){if(!rows.length)return;for(let k=0;k<Math.min(20,rows.length);k++){i=(i+rows.length)%rows.length;try{await load(rows[i]);currentIndex=i;return}catch(e){document.getElementById("read").textContent="SKIP FAILED IMAGE: "+e;i+=step}}document.getElementById("read").textContent="No usable image after 20 attempts"}
async function random(){if(!rows.length)return;let i=Math.floor(Math.random()*rows.length);await loadIndex(i,1)}
window.addEventListener("load",async()=>{await A.init;aladin=A.aladin("#aladin",{survey:"P/DSS2/color",target:"M 31",fov:4,projection:"SIN",showReticle:true,showZoomControl:true,showLayersControl:true});let j=await (await fetch(CAT,{cache:"no-store"})).json();rows=(Array.isArray(j)?j:(j.records||j.entries||j.data||j.catalog||[])).filter(usable);document.getElementById("random").onclick=random;document.getElementById("back").onclick=()=>loadIndex(currentIndex-1,-1);document.getElementById("next").onclick=()=>loadIndex(currentIndex+1,1);document.getElementById("reload").onclick=()=>rec&&load(rec);document.getElementById("jsonload").onclick=()=>reloadMode("JSON").catch(e=>info("JSON LOAD ERROR "+e));document.getElementById("wcsload").onclick=()=>reloadMode("WCS DECODE").catch(e=>info("WCS DECODE ERROR "+e));document.getElementById("rot").oninput=e=>{let v=+e.target.value;document.getElementById("rotv").value=v.toFixed(2)+"°";aladin.setRotation(v);info()};document.getElementById("fov").oninput=e=>{let v=baseFov*Math.pow(2,+e.target.value);document.getElementById("fovv").value=v.toFixed(5)+"°";aladin.setFoV(v);info()};document.getElementById("opacity").oninput=e=>{let v=+e.target.value;document.getElementById("opv").value=v+"%";if(layer)layer.setOpacity(v/100);info()};setInterval(()=>{if(rec)info()},300);random()});
</script></body></html>
