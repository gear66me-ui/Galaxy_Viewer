<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Galaxy Viewer Glyph-9 Lab 0001</title>
<style>
@font-face{
  font-family:"Space Age GV-9";
  src:url("https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/beta/viewer/artwork/Fonts/Space%20Age%20Regular%20GV-9/Space%20Age%20GV-9A.otf?v=glyph9A-hex-input-0001") format("opentype");
  font-style:normal;font-weight:400;font-display:block
}
:root{
  --coord:#72a7e8;
  --font-size:13px;
  --sx:1.20;
  --sy:1.70;
  --spacing:0.55px;
  --coord-width:298px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#03060b;color:#eef8ff}
body{font-family:Arial,sans-serif;padding:8px;overflow-x:hidden}
button,input{font:inherit}
.lab{width:374px;max-width:100%;margin:0 auto}
h1{margin:2px 0 7px;text-align:center;font:400 15px/1.2 "Space Age GV-9",sans-serif;letter-spacing:.5px}
.banner-wrap{display:flex;justify-content:center;margin:0 auto 7px}
.banner{display:grid;grid-template-columns:36px var(--coord-width) 36px;gap:2px;width:max-content}
.tile{height:36px;border:1px solid #d7f4ff;border-radius:6px;background:#000;box-shadow:0 0 8px rgba(98,216,255,.28);overflow:hidden}
.menu,.target{position:relative;width:36px}
.menu span,.menu:before,.menu:after{content:"";position:absolute;left:9px;width:18px;height:2px;border-radius:2px;background:#d7f3ff}
.menu:before{top:9px}.menu span{top:16px}.menu:after{top:23px}
.target:before,.target:after{content:"";position:absolute;inset:7px;border:2px solid #d7f3ff;border-radius:50%}
.target:after{inset:15px;border-width:1px}
.target i:before,.target i:after{content:"";position:absolute;background:#d7f3ff}
.target i:before{left:17px;top:3px;width:2px;height:30px}
.target i:after{left:3px;top:17px;width:30px;height:2px}
.coord-tile{position:relative;width:var(--coord-width)}
.coord-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.coord-text,.checkpoint{
  color:var(--coord);
  font-family:"Space Age GV-9",sans-serif;
  font-weight:400;
  letter-spacing:var(--spacing);
  transform:scaleX(var(--sx)) scaleY(var(--sy));
  transform-origin:center;
  white-space:nowrap
}
.coord-text{font-size:var(--font-size);line-height:24px}
.gal{font-size:calc(var(--font-size) * .846);margin-right:5px}
.lambda{font-family:Arial,sans-serif;font-size:10px;margin:0 4px;display:inline-block;transform:scaleY(calc(1 / var(--sy)))}
.checkpoint-shell{height:34px;border:1px solid #243648;border-radius:8px;background:#080d14;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:7px}
.checkpoint{font-size:calc(var(--font-size) * .923)}
.color-panel{border:1px solid #263746;border-radius:10px;background:#090e15;padding:8px;margin-bottom:7px}
.color-panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font-size:11px;text-transform:uppercase}
#hexColor{width:92px;height:28px;border:1px solid #526f88;border-radius:5px;background:#050a11;color:#7df4ff;padding:4px 6px;text-align:center;font:11px/1.2 monospace;text-transform:uppercase}
#hexColor.invalid{border-color:#ff7f7f;color:#ffb2b2}
#svField{position:relative;width:100%;height:150px;border:1px solid #526f88;border-radius:8px;touch-action:none;overflow:hidden;background-color:hsl(214,100%,50%)}
#svField:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#fff,rgba(255,255,255,0))}
#svField:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000,rgba(0,0,0,0))}
#svHandle{position:absolute;left:65%;top:9%;width:18px;height:18px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #000;transform:translate(-50%,-50%);pointer-events:none;z-index:2}
#hueBar{position:relative;width:100%;height:24px;margin-top:7px;border:1px solid #526f88;border-radius:7px;touch-action:none;background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
#hueHandle{position:absolute;left:59.4%;top:50%;width:12px;height:30px;border:2px solid #fff;border-radius:5px;box-shadow:0 0 0 1px #000;transform:translate(-50%,-50%);pointer-events:none}
.current-strip{height:18px;margin-top:7px;border:1px solid #526f88;border-radius:6px;background:var(--coord)}
.controls{border:1px solid #263746;border-radius:10px;background:#090e15;padding:8px;margin-bottom:7px}
.control{display:grid;grid-template-columns:68px 1fr 45px;gap:7px;align-items:center;min-height:32px}
.control label{font-size:11px;text-transform:uppercase}
.control output{text-align:right;font-size:10px;color:#7df4ff}
input[type=range]{width:100%}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:6px}
button{min-height:34px;border:1px solid #62d8ff;border-radius:7px;background:#111a29;color:#fff;text-transform:uppercase;font-size:11px}
.pad-section{display:grid;grid-template-columns:150px 1fr;gap:9px;align-items:center;border:1px solid #263746;border-radius:10px;background:#090e15;padding:8px}
#pad{position:relative;width:150px;height:150px;border:1px solid #526f88;border-radius:9px;touch-action:none;background:
linear-gradient(90deg,transparent 49.4%,rgba(98,216,255,.24) 49.6%,rgba(98,216,255,.24) 50.4%,transparent 50.6%),
linear-gradient(0deg,transparent 49.4%,rgba(98,216,255,.24) 49.6%,rgba(98,216,255,.24) 50.4%,transparent 50.6%),#050a11}
#handle{position:absolute;left:50%;top:50%;width:18px;height:18px;border:2px solid #fff;border-radius:50%;background:var(--coord);transform:translate(-50%,-50%);pointer-events:none}
.pad-copy{font-size:11px;line-height:1.45;color:#d7e9f5}
.pad-copy strong{display:block;font:400 12px/1.25 "Space Age GV-9",sans-serif;color:#7df4ff;margin-bottom:5px}
.pad-copy small{display:block;margin-top:6px;color:#95aabd}
#notice{min-height:14px;margin-top:5px;text-align:center;font-size:10px;color:#8ef0b5}
@media(max-width:350px){
  :root{--coord-width:228px}
  body{padding:8px}
  .lab{width:304px}
  .coord-text{font-size:calc(var(--font-size) * .808)}
  .gal{font-size:calc(var(--font-size) * .692);margin-right:3px}
  .lambda{margin:0 2px;font-size:9px}
  .checkpoint{font-size:calc(var(--font-size) * .731)}
  #svField{height:132px}
  .pad-section{grid-template-columns:132px 1fr;gap:7px}
  #pad{width:132px;height:132px}
  .control{grid-template-columns:60px 1fr 40px}
}
@media(min-width:391px){
  .lab{width:374px}
}
</style>
</head>
<body>
<main class="lab">
<h1>Galaxy Viewer Glyph-9 Lab</h1>

<section class="banner-wrap" aria-label="Coordinate banner preview">
  <div class="banner">
    <div class="tile menu"><span></span></div>
    <div class="tile coord-tile">
      <div class="coord-stage">
        <div class="coord-text"><span class="gal">GAL</span><span id="lon">-139.9995</span><span class="lambda">λ</span><span id="lat">-59.9599</span></div>
      </div>
    </div>
    <div class="tile target"><i></i></div>
  </div>
</section>

<section class="color-panel" aria-label="Live color selector">
  <div class="color-panel-title"><label for="hexColor">Live color field</label><input id="hexColor" type="text" value="#72A7E8" maxlength="7" spellcheck="false" autocomplete="off" autocapitalize="characters" inputmode="text" aria-label="Hexadecimal color value"></div>
  <div id="svField" role="application" aria-label="Saturation and brightness color field"><span id="svHandle"></span></div>
  <div id="hueBar" role="application" aria-label="Hue selector"><span id="hueHandle"></span></div>
  <div class="current-strip" aria-hidden="true"></div>
</section>

<div class="checkpoint-shell">
  <div class="checkpoint">5 9&nbsp;&nbsp;55 59 95 99&nbsp;&nbsp;-139.9995&nbsp;&nbsp;-59.9599</div>
</div>

<section class="controls">
  <div class="control"><label for="fontSize">Size</label><input id="fontSize" type="range" min="9" max="18" step=".1" value="13"><output id="fontSizeOut">13.0px</output></div>
  <div class="control"><label for="sx">Width</label><input id="sx" type="range" min=".70" max="1.35" step=".01" value="1.20"><output id="sxOut">1.20×</output></div>
  <div class="control"><label for="sy">Height</label><input id="sy" type="range" min=".85" max="1.70" step=".01" value="1.70"><output id="syOut">1.70×</output></div>
  <div class="control"><label for="spacing">Spacing</label><input id="spacing" type="range" min="-1" max="2.5" step=".05" value=".55"><output id="spacingOut">0.55</output></div>
  <div class="actions"><button id="reset">Reset</button><button id="copy">Copy Settings</button></div>
  <div id="notice"></div>
</section>

<section class="pad-section">
  <div id="pad" role="application" aria-label="Drag to change longitude and latitude"><span id="handle"></span></div>
  <div class="pad-copy">
    <strong>NUMBER SCAN PAD</strong>
    Drag in any direction. Longitude and latitude update continuously with four decimal places.
    <small>Range: −180° to +180° / −90° to +90°</small>
  </div>
</section>
</main>

<script>
(()=>{
  "use strict";
  const root=document.documentElement;
  const $=id=>document.getElementById(id);
  const defaults={fontSize:13,sx:1.20,sy:1.70,spacing:0.55,h:214,s:.50,v:.91,lon:-139.9995,lat:-59.9599};
  const state={...defaults};
  const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
  const format=v=>(v<0?"-":"")+Math.abs(v).toFixed(4);

  function hsvToRgb(h,s,v){
    const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;
    let r=0,g=0,b=0;
    if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}
    else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}
    return [r,g,b].map(n=>Math.round((n+m)*255));
  }
  function rgbToHex([r,g,b]){
    return "#"+[r,g,b].map(n=>n.toString(16).padStart(2,"0")).join("");
  }
  function colorHex(){return rgbToHex(hsvToRgb(state.h,state.s,state.v))}
  function normalizeHex(value){
    const raw=value.trim().replace(/^#/,"");
    if(/^[0-9a-fA-F]{3}$/.test(raw))return "#"+raw.split("").map(c=>c+c).join("").toUpperCase();
    if(/^[0-9a-fA-F]{6}$/.test(raw))return "#"+raw.toUpperCase();
    return null;
  }
  function hexToHsv(hex){
    const n=parseInt(hex.slice(1),16);
    const r=((n>>16)&255)/255,g=((n>>8)&255)/255,b=(n&255)/255;
    const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;
    let h=0;
    if(d){
      if(max===r)h=60*(((g-b)/d)%6);
      else if(max===g)h=60*((b-r)/d+2);
      else h=60*((r-g)/d+4);
    }
    if(h<0)h+=360;
    return {h,s:max===0?0:d/max,v:max};
  }

  function render(){
    const color=colorHex();
    root.style.setProperty("--font-size",state.fontSize+"px");
    root.style.setProperty("--sx",state.sx);
    root.style.setProperty("--sy",state.sy);
    root.style.setProperty("--spacing",state.spacing+"px");
    root.style.setProperty("--coord",color);
    $("fontSizeOut").textContent=state.fontSize.toFixed(1)+"px";
    $("sxOut").textContent=state.sx.toFixed(2)+"×";
    $("syOut").textContent=state.sy.toFixed(2)+"×";
    $("spacingOut").textContent=state.spacing.toFixed(2);
    $("lon").textContent=format(state.lon);
    $("lat").textContent=format(state.lat);
    $("hexColor").value=color.toUpperCase();
    $("hexColor").classList.remove("invalid");
    $("svField").style.backgroundColor="hsl("+state.h+",100%,50%)";
    $("svHandle").style.left=(state.s*100)+"%";
    $("svHandle").style.top=((1-state.v)*100)+"%";
    $("hueHandle").style.left=(state.h/360*100)+"%";
  }

  $("fontSize").addEventListener("input",e=>{state.fontSize=Number(e.target.value);render()});
  $("sx").addEventListener("input",e=>{state.sx=Number(e.target.value);render()});
  $("sy").addEventListener("input",e=>{state.sy=Number(e.target.value);render()});
  $("spacing").addEventListener("input",e=>{state.spacing=Number(e.target.value);render()});
  $("hexColor").addEventListener("input",e=>{
    const normalized=normalizeHex(e.target.value);
    if(!normalized){e.target.classList.add("invalid");return}
    const hsv=hexToHsv(normalized);
    Object.assign(state,hsv);
    render();
  });
  $("hexColor").addEventListener("blur",e=>{
    const normalized=normalizeHex(e.target.value);
    if(!normalized){e.target.value=colorHex().toUpperCase();e.target.classList.remove("invalid");return}
    e.target.value=normalized;
  });

  function bindDrag(el,apply){
    el.addEventListener("pointerdown",e=>{el.setPointerCapture(e.pointerId);apply(e)});
    el.addEventListener("pointermove",e=>{if(el.hasPointerCapture(e.pointerId))apply(e)});
    el.addEventListener("pointerup",e=>{if(el.hasPointerCapture(e.pointerId))el.releasePointerCapture(e.pointerId)});
    el.addEventListener("pointercancel",e=>{if(el.hasPointerCapture(e.pointerId))el.releasePointerCapture(e.pointerId)});
  }
  bindDrag($("svField"),e=>{
    const r=$("svField").getBoundingClientRect();
    state.s=clamp((e.clientX-r.left)/r.width,0,1);
    state.v=1-clamp((e.clientY-r.top)/r.height,0,1);
    render();
  });
  bindDrag($("hueBar"),e=>{
    const r=$("hueBar").getBoundingClientRect();
    state.h=clamp((e.clientX-r.left)/r.width,0,1)*360;
    render();
  });

  const pad=$("pad"),handle=$("handle");
  function setFromPointer(e){
    const r=pad.getBoundingClientRect();
    const x=clamp(e.clientX-r.left,0,r.width);
    const y=clamp(e.clientY-r.top,0,r.height);
    state.lon=(x/r.width)*360-180;
    state.lat=90-(y/r.height)*180;
    handle.style.left=(x/r.width*100)+"%";
    handle.style.top=(y/r.height*100)+"%";
    render();
  }
  bindDrag(pad,setFromPointer);

  $("reset").addEventListener("click",()=>{
    Object.assign(state,defaults);
    $("fontSize").value=state.fontSize;
    $("sx").value=state.sx;
    $("sy").value=state.sy;
    $("spacing").value=state.spacing;
    handle.style.left="50%";
    handle.style.top="50%";
    render();
  });

  $("copy").addEventListener("click",async()=>{
    const text=[
      "GALAXY VIEWER GLYPH-9 LAB SETTINGS",
      "Font: viewer/artwork/Fonts/Space Age Regular GV-9/Space Age GV-9A.otf",
      "Character size: "+state.fontSize.toFixed(1)+"px",
      "Character width: scaleX("+state.sx.toFixed(2)+")",
      "Character height: scaleY("+state.sy.toFixed(2)+")",
      "Character spacing: "+state.spacing.toFixed(2)+"px",
      "Color: "+colorHex().toUpperCase(),
      "Longitude: "+format(state.lon),
      "Latitude: "+format(state.lat),
      "Responsive test widths: 390px and 320px"
    ].join("\n");
    try{await navigator.clipboard.writeText(text);$("notice").textContent="SETTINGS COPIED"}
    catch(_){$("notice").textContent="COPY BLOCKED — SELECT FROM BROWSER"}
  });
  render();
})();
</script>
</body>
</html>
