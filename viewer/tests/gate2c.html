<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GV Gate 2C</title>
<link rel="stylesheet" href="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.min.css"><script src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#080b12;color:#fff;font-family:system-ui}.app{width:min(430px,96vw);margin:10px auto}#wrap{position:relative;height:520px;border:1px solid #556;border-radius:8px;overflow:hidden}#aladin{position:absolute;inset:0}#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.row{display:grid;grid-template-columns:58px 1fr 82px;gap:7px;align-items:center;margin:8px 0}input{width:100%}button{padding:8px 12px}.top{display:flex;gap:8px;align-items:center}.top b{flex:1}.mono{font:11px monospace;background:#111927;border:1px solid #39465b;padding:8px;border-radius:7px;white-space:pre-wrap}h1{font-size:15px;margin:8px 0}</style></head>
<body><div class="app"><h1>Gate 2C — Random WCS Images</h1><div class="top"><b id="name">Loading catalog…</b><button id="random">Random Image</button></div><div id="wrap"><div id="aladin"></div><canvas id="ov"></canvas></div>
<div class="row"><b>ROT</b><input id="rot" type="range" min="-180" max="180" step=".01" value="0"><output id="rotv">0°</output></div>
<div class="row"><b>FoV</b><input id="fov" type="range" min="-6" max="6" step=".001" value="0"><output id="fovv">—</output></div>
<div class="row"><b>IMAGE</b><input id="opacity" type="range" min="0" max="100" step="1" value="55"><output id="opv">55%</output></div>
<div id="read" class="mono">Initializing…</div></div><script>
const CAT="https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/beta/viewer/image-databases/master-database/avm-metadata/gv-avm-runtime-catalog-0001.json";
let aladin,layer,rows=[],rec,imgW=1,imgH=1,baseFov=1,serial=0;
function n(v){v=Number(v);return Number.isFinite(v)?v:null}
function geom(r){let fx=n(r.fovXDegrees??r.fovDegrees),fy=n(r.fovYDegrees??r.fovDegrees),rot=n(r.aladinRotation??r.spatialRotationDeg),ra=n(r.ra),dec=n(r.dec);return {ra,dec,fx,fy,rot}}
function usable(r){let g=geom(r);return !!r.imageUrl&&[g.ra,g.dec,g.fx,g.fy,g.rot].every(Number.isFinite)&&g.fx>0&&g.fy>0}
function cd(){let g=geom(rec),sx=g.fx/imgW,sy=g.fy/imgH,t=g.rot*Math.PI/180,c=Math.cos(t),s=Math.sin(t);return{a:-sx*c,b:-sy*s,c:-sx*s,d:sy*c}}
function W(){let g=geom(rec),m=cd();return{NAXIS:2,CTYPE1:"RA---TAN",CTYPE2:"DEC--TAN",EQUINOX:2000,LONPOLE:180,CUNIT1:"deg",CUNIT2:"deg",CRVAL1:g.ra,CRVAL2:g.dec,CRPIX1:(imgW+1)/2,CRPIX2:(imgH+1)/2,CD1_1:m.a,CD1_2:m.b,CD2_1:m.c,CD2_2:m.d,NAXIS1:imgW,NAXIS2:imgH}}
function sky(x,y){let g=geom(rec),m=cd(),dx=x-(imgW+1)/2,dy=y-(imgH+1)/2,e=m.a*dx+m.b*dy,no=m.c*dx+m.d*dy;return[g.ra+e/Math.cos(g.dec*Math.PI/180),g.dec+no]}
function P(x,y){let q=sky(x,y);return aladin.world2pix(q[0],q[1])}
function draw(){if(!rec)return;let cv=document.getElementById("ov"),r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);let c=cv.getContext("2d");c.setTransform(d,0,0,d,0,0);let a=P(.5,.5),b=P(imgW+.5,.5),e=P(imgW+.5,imgH+.5),f=P(.5,imgH+.5),l=P(.5,(imgH+1)/2),rr=P(imgW+.5,(imgH+1)/2),t=P((imgW+1)/2,.5),bb=P((imgW+1)/2,imgH+.5);c.strokeStyle="#78ffab";c.lineWidth=2;c.beginPath();c.moveTo(...a);c.lineTo(...b);c.lineTo(...e);c.lineTo(...f);c.closePath();c.stroke();c.lineWidth=1.5;c.beginPath();c.moveTo(...l);c.lineTo(...rr);c.moveTo(...t);c.lineTo(...bb);c.stroke()}
function info(s="READY"){let g=geom(rec),q=aladin.getRaDec(),f=aladin.getFov();document.getElementById("read").textContent=s+"\n"+rec.providerKey+" — "+rec.name+"\nJPEG "+imgW+" × "+imgH+" | WCS FoV "+g.fx+" × "+g.fy+"° | WCS Rot "+g.rot+"°\nALADIN RA/Dec "+q[0]+" / "+q[1]+" | FoV "+f[0]+" × "+f[1]+"° | Rot "+aladin.getRotation();draw()}
async function load(r){let token=++serial;rec=r;let g=geom(r);document.getElementById("name").textContent=r.providerKey+" — "+r.name;document.getElementById("read").textContent="FETCHING IMAGE…";let resp=await fetch(r.imageUrl,{mode:"cors",credentials:"omit",cache:"no-store"});if(!resp.ok)throw Error("HTTP "+resp.status);let blob=await resp.blob();let bmp=await createImageBitmap(blob);if(token!==serial)return;imgW=bmp.width;imgH=bmp.height;bmp.close();try{aladin.removeImageLayer?.("GATE2C_IMAGE")}catch(e){}let u=URL.createObjectURL(blob);layer=A.image(u,{name:"GATE2C_IMAGE",imgFormat:"jpeg",wcs:W(),opacity:+document.getElementById("opacity").value/100,successCallback:()=>info("IMAGE READY"),errorCallback:e=>info("IMAGE LAYER ERROR "+e)});aladin.setOverlayImageLayer(layer,"GATE2C_IMAGE");aladin.gotoRaDec(g.ra,g.dec);baseFov=Math.max(g.fx,g.fy)*2.5;document.getElementById("fov").value=0;aladin.setFoV(baseFov);document.getElementById("fovv").value=baseFov.toFixed(5)+"°";document.getElementById("rot").value=g.rot;document.getElementById("rotv").value=g.rot.toFixed(2)+"°";aladin.setRotation(g.rot);info("IMAGE LOADING…")}
async function random(){for(let k=0;k<20;k++){let r=rows[Math.floor(Math.random()*rows.length)];if(!usable(r))continue;try{await load(r);return}catch(e){document.getElementById("read").textContent="SKIP FAILED IMAGE: "+e}}document.getElementById("read").textContent="No usable random image after 20 attempts"}
window.addEventListener("load",async()=>{await A.init;aladin=A.aladin("#aladin",{survey:"P/DSS2/color",target:"M 31",fov:4,projection:"SIN",showReticle:true,showZoomControl:true,showLayersControl:true});let j=await (await fetch(CAT,{cache:"no-store"})).json();rows=(Array.isArray(j)?j:(j.records||j.entries||j.data||j.catalog||[])).filter(usable);document.getElementById("random").onclick=random;document.getElementById("rot").oninput=e=>{let v=+e.target.value;document.getElementById("rotv").value=v.toFixed(2)+"°";aladin.setRotation(v);info()};document.getElementById("fov").oninput=e=>{let v=baseFov*Math.pow(2,+e.target.value);document.getElementById("fovv").value=v.toFixed(5)+"°";aladin.setFoV(v);info()};document.getElementById("opacity").oninput=e=>{let v=+e.target.value;document.getElementById("opv").value=v+"%";if(layer)layer.setOpacity(v/100);info()};setInterval(()=>{if(rec)info()},300);random()});
</script></body></html>
