<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Galaxy Viewer 11M Test</title>
<style>html,body,#status{margin:0;width:100%;height:100%;background:#000;color:#78ffab;font-family:monospace}#status{display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
<div id="status">LOADING GALAXY VIEWER…</div>
<script>
(async()=>{
  const source='https://raw.githubusercontent.com/gear66me-ui/Galaxy_Viewer/beta/viewer/GV-beta-0011M.py';
  try{
    const r=await fetch(source,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const py=await r.text();
    const htmlMatch=py.match(/display\(HTML\(r?"""([\s\S]*?)"""\)\)/);
    const jsMatches=[...py.matchAll(/display\(Javascript\(r?"""([\s\S]*?)"""\)\)/g)];
    if(!htmlMatch)throw new Error('Viewer HTML block not found');
    document.open();document.write(htmlMatch[1]);document.close();
    for(const m of jsMatches){const s=document.createElement('script');s.textContent=m[1];document.body.appendChild(s)}
  }catch(e){document.getElementById('status').textContent='GALAXY VIEWER LOAD FAILED: '+e.message;console.error(e)}
})();
</script>
</body>
</html>
